<script>window.__SEED__={};</script>
<script>(function(){
 var EM='demo@crescom.ai';
 var SEED=window.__SEED__||{};
 function build(t){
   var filters=[],single=null,mode='select',payload=null;var b={};
   ['select','order','limit','range','csv','abortSignal','returns','throwOnError'].forEach(function(m){b[m]=function(){return b;};});
   ['neq','in','gt','gte','lt','lte','is','not','like','ilike','or','filter','contains','containedBy','overlaps','match','textSearch','rangeGt','rangeLt'].forEach(function(m){b[m]=function(){return b;};});
   b.eq=function(k,v){filters.push([k,v]);return b;};
   b.insert=function(p){mode='insert';payload=p;return b;};
   b.update=function(p){mode='update';payload=p;return b;};
   b.upsert=function(p){mode='upsert';payload=p;return b;};
   b.delete=function(){mode='delete';return b;};
   b.single=function(){single='one';return b;};
   b.maybeSingle=function(){single='maybe';return b;};
   function resolve(){
     if(t==='user_roles'){var apps=['*','ehr','hr','payroll','eval','retire','finance','index','splitter'];return {data:apps.map(function(a){return {role:'SUPER',email:EM,app:a};}),error:null};}
     if(mode!=='select'){var d=Array.isArray(payload)?payload:[payload];return {data:d,error:null};}
     var rows=(SEED[t]||[]).slice();
     filters.forEach(function(f){var k=f[0],v=f[1];rows=rows.filter(function(r){return r[k]==null?true:String(r[k])===String(v);});});
     if(single==='one')return {data:rows[0]||null,error:rows[0]?null:{message:'0 rows',code:'PGRST116'}};
     if(single==='maybe')return {data:rows[0]||null,error:null};
     return {data:rows,error:null};
   }
   b.then=function(res,rej){var r;try{r=resolve();}catch(e){r={data:null,error:{message:String(e)}};}return Promise.resolve(r).then(res,rej);};
   return b;
 }
 var USER={id:'demo-uid',email:EM,user_metadata:{name:'데모 관리자'}};
 var SESSION={access_token:'demo',token_type:'bearer',user:USER};
 var auth={
   getSession:function(){return Promise.resolve({data:{session:SESSION},error:null});},
   getUser:function(){return Promise.resolve({data:{user:USER},error:null});},
   onAuthStateChange:function(cb){setTimeout(function(){try{cb('SIGNED_IN',SESSION);}catch(e){}},0);return {data:{subscription:{unsubscribe:function(){}}}};},
   signInWithPassword:function(){return Promise.resolve({data:{session:SESSION,user:USER},error:null});},
   signInWithOtp:function(){return Promise.resolve({data:{},error:null});},
   signUp:function(){return Promise.resolve({data:{session:SESSION,user:USER},error:null});},
   signOut:function(){return Promise.resolve({error:null});},
   setSession:function(){return Promise.resolve({data:{session:SESSION},error:null});},
   refreshSession:function(){return Promise.resolve({data:{session:SESSION},error:null});},
   resetPasswordForEmail:function(){return Promise.resolve({data:{},error:null});},
 };
 var client={
   from:function(t){return build(t);},
   rpc:function(n){return Promise.resolve({data:(SEED['rpc:'+n]||[]),error:null});},
   auth:auth,
   channel:function(){var ch={on:function(){return ch;},subscribe:function(cb){if(cb)setTimeout(function(){cb('SUBSCRIBED');},0);return ch;},unsubscribe:function(){return Promise.resolve('ok');}};return ch;},
   removeChannel:function(){return Promise.resolve('ok');},removeAllChannels:function(){return Promise.resolve('ok');},
   getChannels:function(){return [];},
   storage:{from:function(){return {upload:function(){return Promise.resolve({data:{path:'demo'},error:null});},download:function(){return Promise.resolve({data:new Blob(),error:null});},getPublicUrl:function(){return {data:{publicUrl:'#'}};},createSignedUrl:function(){return Promise.resolve({data:{signedUrl:'#'},error:null});},list:function(){return Promise.resolve({data:[],error:null});},remove:function(){return Promise.resolve({data:[],error:null});}};}},
   functions:{invoke:function(){return Promise.resolve({data:{},error:null});}},
 };
 window.supabase={createClient:function(){return client;}};
})();</script>

  //   ① 월 폴더 만들기(7·8·9단계의 선행조건)  ② 임금명세서 발송  ③ 파일 보관  ④ 과거 자료 조회
  { key: 'payroll_gas', roleKey: 'payroll', title: '급여 GAS', desc: '폴더 · 명세서 발송 · 보관',
    href: 'https://script.google.com/a/macros/crescom.ai/s/AKfycbyyqy7AvqoUXDbFO0Si0ALbjUBfzsZa5nSslXhfoPGAVO539_7kjpY4o0LAsJu4j1Sp/exec',
    external: true, badge: '구글 전용',
    hint: '급여 자동화와 함께 쓰는 도구입니다. 구글 권한이 필요한 일만 담당합니다 — ① 월 폴더 만들기(7·8·9단계 선행) ② 임금명세서 발송 ③ 파일 보관 ④ 과거 자료 조회. 구글 계정 관리자 3명만 실행할 수 있습니다.',
    color: 'from-amber-600 to-orange-600',
    icon: 'M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z' },
];

function Icon({ path, className }) {
  return (
    <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d={path} />
    </svg>
  );
}

function Login({ onDone }) {
  const [email, setEmail] = useState('');
  const [pw, setPw] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const [showAdmin, setShowAdmin] = useState(false);

  async function submit() {
    setErr(''); setBusy(true);
    const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pw });
    setBusy(false);
    if (error) { setErr('로그인 실패: ' + error.message); return; }
    onDone();
  }
  async function google(){
    setErr('');
    const { error } = await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: window.location.href.split('#')[0], queryParams:{ hd:'crescom.ai', prompt:'select_account' } } });
    if (error) setErr('구글 로그인 실패: ' + error.message);
  }

  return (
    <div className="min-h-screen flex items-center justify-center px-4">
      <div className="w-full max-w-sm">
        <div className="flex justify-end mb-2"><ThemeToggle /></div>
        <div className="text-center mb-8">
          <div className="inline-flex items-center justify-center mb-4 rounded-2xl bg-gradient-to-br from-rose-500 to-red-600 px-6 py-4">
            <img src={LOGO} alt="CRESCOM" className="h-7" />
          </div>
          <h1 className="text-xl font-bold text-slate-900 dark:text-slate-100">CRESCOM 인사시스템</h1>
          <p className="text-sm text-slate-500 dark:text-slate-400 mt-1">사내 계정으로 로그인하세요</p>
        </div>
        <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 space-y-4">
          {err && <div className="text-xs text-red-600 bg-red-50 dark:bg-red-950 rounded-lg px-3 py-2">{err}</div>}

          <button onClick={google}
            className="w-full py-3 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700/40 text-sm font-semibold text-slate-700 dark:text-slate-200 flex items-center justify-center gap-2 shadow-sm">
            <svg viewBox="0 0 48 48" className="w-4 h-4"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.7 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.3 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.1 5.3-4.6 6.9l7.1 5.5c4.1-3.8 6.5-9.4 6.5-16.9z"/><path fill="#FBBC05" d="M10.4 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.3.8-4.7l-7.8-6.1C1 16.3 0 20 0 24s1 7.7 2.6 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.1-5.5c-2 1.4-4.6 2.2-8.1 2.2-6.4 0-11.7-3.8-13.6-9.3l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
            Google 계정으로 로그인
          </button>
          <p className="text-center text-xs text-slate-400 dark:text-slate-500">임직원은 회사 구글 계정으로 로그인하세요</p>

          {!showAdmin ? (
            <div className="text-center pt-1">
              <button onClick={()=>setShowAdmin(true)} className="text-xs text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 underline">관리자 로그인</button>
            </div>
          ) : (
            <div className="border-t border-slate-200 dark:border-slate-700 pt-4 space-y-3">
              <div className="text-xs font-semibold text-slate-500 dark:text-slate-400">관리자 로그인 (이메일 · 비밀번호)</div>
              <div>
                <label className="text-xs font-medium text-slate-600 dark:text-slate-300">이메일</label>
                <input type="email" value={email} onChange={e=>setEmail(e.target.value)}
                  onKeyDown={e=>e.key==='Enter'&&submit()}
                  placeholder="you@crescom.ai"
                  className="mt-1 w-full px-3 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 focus:border-rose-500 focus:ring-1 focus:ring-rose-500 outline-none text-sm" />
              </div>
              <div>
                <label className="text-xs font-medium text-slate-600 dark:text-slate-300">비밀번호</label>
                <input type="password" value={pw} onChange={e=>setPw(e.target.value)}
                  onKeyDown={e=>e.key==='Enter'&&submit()}
                  className="mt-1 w-full px-3 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 focus:border-rose-500 focus:ring-1 focus:ring-rose-500 outline-none text-sm" />
              </div>
              <button onClick={submit} disabled={busy}
                className="w-full py-2.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium disabled:opacity-50">
                {busy ? '로그인 중…' : '관리자 로그인'}
              </button>
              <div className="text-center"><button onClick={()=>setShowAdmin(false)} className="text-xs text-slate-400 dark:text-slate-500 hover:underline">← 임직원 로그인으로</button></div>
            </div>
          )}
        </div>
        <p className="text-center text-xs text-slate-400 dark:text-slate-500 mt-4">CRESCOM 임직원 전용 · 문의: 경영지원팀</p>
      </div>
    </div>
  );
}

function Portal({ session, onLogout }) {
  const [roles, setRoles] = useState(null);
  const [err, setErr] = useState('');
  const email = session.user.email;

  useEffect(() => {
    (async () => {
      const { data, error } = await sb.from('user_roles').select('app,role').eq('email', email);
      if (error) { setErr(error.message); setRoles([]); return; }
      setRoles(data || []);
    })();
  }, [email]);

  const roleOf = (appKey) => (roles || []).find(r => r.app === appKey);

  return (
    <div className="min-h-screen">
      <header className="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700">
        <div className="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
          <div className="flex items-center gap-3">
            <div className="rounded-lg bg-gradient-to-br from-rose-500 to-red-600 px-3 py-2 flex items-center">
              <img src={LOGO} alt="CRESCOM" className="h-4" />
            </div>
            <span className="font-bold text-slate-900 dark:text-slate-100">인사시스템</span>
          </div>
          <div className="flex items-center gap-3">
            <span className="text-sm text-slate-500 dark:text-slate-400">{email}</span>
            <ThemeToggle />
            <button onClick={onLogout}
              className="text-sm text-slate-600 dark:text-slate-300 hover:text-slate-900 px-3 py-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">로그아웃</button>
          </div>
        </div>
      </header>

      <main className="max-w-5xl mx-auto px-6 py-12">
        <h2 className="text-2xl font-bold text-slate-900 dark:text-slate-100 mb-2">시스템 선택</h2>
        <p className="text-slate-500 dark:text-slate-400 mb-8">접근 권한이 있는 시스템을 선택하세요.</p>

        {roles === null && <div className="text-slate-400 dark:text-slate-500 text-sm">권한 확인 중…</div>}
        {err && <div className="text-red-600 text-sm bg-red-50 dark:bg-red-950 rounded-lg px-4 py-3 mb-4">권한 조회 오류: {err}</div>}

        {roles !== null && (
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-6 sm:gap-9 max-w-3xl mx-auto py-4">
            {APPS.map(app => {
              const r = roleOf(app.roleKey || app.key);
              const enabled = !!r;
              const tile = (
                <div className="group flex flex-col items-center text-center select-none">
                  <div className={"relative w-24 h-24 sm:w-28 sm:h-28 rounded-[28px] flex items-center justify-center shadow-lg ring-1 ring-black/5 transition-all duration-200 " +
                    (enabled
                      ? "bg-gradient-to-br " + app.color + " group-hover:-translate-y-1.5 group-hover:shadow-2xl cursor-pointer"
                      : "bg-gradient-to-br from-slate-400 to-slate-500 opacity-80")}>
                    <Icon path={app.icon} className="w-11 h-11 sm:w-12 sm:h-12 text-white drop-shadow" />
                    {enabled
                      ? <span className="absolute top-2.5 right-2.5 text-[9px] font-bold tracking-wide bg-black/35 text-white px-1.5 py-0.5 rounded-md">{app.badge || r.role}</span>
                      : <div className="absolute -bottom-1.5 -right-1.5 w-8 h-8 rounded-full bg-white dark:bg-slate-800 shadow-md ring-1 ring-slate-200 flex items-center justify-center">
                          <Icon path="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zM8 11V7a4 4 0 118 0v4" className="w-4 h-4 text-slate-400 dark:text-slate-500" />
                        </div>}
                  </div>
                  <div className={"mt-3.5 font-semibold text-sm sm:text-base " + (enabled ? "text-slate-800 dark:text-slate-100" : "text-slate-400 dark:text-slate-500")}>{app.title}</div>
                  <div className={"text-xs mt-0.5 " + (enabled ? "text-slate-400 dark:text-slate-500" : "text-slate-300 dark:text-slate-600")}>{app.desc}</div>
                  {!enabled && <div className="text-[11px] text-slate-400 dark:text-slate-500 mt-1">접근 권한 없음</div>}
                </div>
              );
              return enabled
                ? <a key={app.key} href={app.href} title={app.hint || undefined} target={app.external?"_blank":undefined} rel={app.external?"noopener noreferrer":undefined} className="no-underline">{tile}</a>
                : <div key={app.key}>{tile}</div>;
            })}
          </div>
        )}

        {roles !== null && roles.length === 0 && (
          <div className="mt-6 text-sm text-amber-700 bg-amber-50 dark:bg-amber-950 border border-amber-200 rounded-lg px-4 py-3">
            이 계정({email})에 부여된 권한이 없습니다. 관리자에게 권한 등록을 요청하세요.
          </div>
        )}
      </main>
    </div>
  );
}

function useTheme(){
  const [theme,setTheme]=useState(()=>{ try{ return localStorage.getItem('crescom-theme')||'system'; }catch(e){ return 'system'; } });
  useEffect(()=>{
    const el=document.documentElement;
    el.classList.toggle('dark', theme==='dark');
    el.classList.toggle('claude', theme==='system');
    try{ localStorage.setItem('crescom-theme',theme); }catch(e){}
  },[theme]);
  return [theme,setTheme];
}
const THEME_ICON={ light:"M12 3v1M12 20v1M4.9 4.9l.7.7M18.4 18.4l.7.7M3 12h1M20 12h1M4.9 19.1l.7-.7M18.4 5.6l.7-.7M12 8a4 4 0 100 8 4 4 0 000-8z", system:"M4 5h16v10H4zM8 19h8M12 15v4", dark:"M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z" };
function ThemeToggle(){
  const [theme,setTheme]=useTheme();
  const opts=[['light','라이트'],['system','시스템'],['dark','다크']];
  return (
    <div className="inline-flex items-center bg-slate-100 dark:bg-slate-700 rounded-lg p-0.5">
      {opts.map(o=>{ const on=theme===o[0];
        return <button key={o[0]} onClick={()=>setTheme(o[0])} title={o[1]} className={"px-2 py-1.5 rounded-md flex items-center "+(on?"bg-white dark:bg-slate-800 shadow text-slate-800 dark:text-slate-100":"text-slate-500 dark:text-slate-400 hover:text-slate-700")}><Icon path={THEME_ICON[o[0]]} className="w-4 h-4" /></button>;
      })}
    </div>
  );
}
function App() {
  const [session, setSession] = useState(undefined); // undefined=확인중, null=로그아웃

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  if (SUPABASE_URL.indexOf('여기에') === 0) {
    return <div className="min-h-screen flex items-center justify-center text-center px-4">
      <div className="text-slate-500 dark:text-slate-400 text-sm">⚙️ 설정 필요: 코드 상단의 SUPABASE_URL / SUPABASE_ANON_KEY 를<br/>본인 Supabase 값으로 교체한 뒤 다시 열어주세요.</div>
    </div>;
  }
  if (session === undefined) return <div className="min-h-screen flex items-center justify-center text-slate-400 dark:text-slate-500">로딩 중…</div>;
  if (!session) return <Login onDone={() => {}} />;
  return <Portal session={session} onLogout={() => sb.auth.signOut()} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
