            <p className="text-[11px] text-slate-400 dark:text-slate-500 -mt-1">명칭은 그대로 두고 <b>색만</b> 바꿔도 등록됩니다. 색 옆에 그 색을 이미 쓰는 조직 이름이 표시되니, 같은 색을 고르면 조직도에서 같은 색 그룹으로 묶입니다.</p>
          </>}
          {type==='job_change' && <div className="grid grid-cols-2 gap-2">
            <Field label="새 직위 (선택)"><PosPicker value={position} onChange={setPosition} kind="position" placeholder={emp?emp.position:'선택/입력'} /></Field>
            <Field label="새 직책 (선택)"><PosPicker value={rank} onChange={setRank} kind="duty" placeholder={emp?(emp.rank||'없으면 비움'):'없으면 비움'} /></Field>
          </div>}
          {type==='dispatch' && <Field label="파견 조직 (선택)">
            <select value={groupId} onChange={e=>setGroupId(e.target.value)} className="inp"><option value="">선택 안 함</option>{groups.map(g=><option key={g.id} value={g.id}>{g.name}</option>)}</select>
          </Field>}

          {['pos_create','pos_delete','duty_create','duty_delete'].includes(type) && <>
            <Field label={(type.indexOf('pos')===0?'직위':'직책')+' 명칭'}><input value={itemName} onChange={e=>setItemName(e.target.value)} className="inp" placeholder={type.indexOf('pos')===0?'예: 책임매니저':'예: 팀장'} /></Field>
            {(type==='pos_create'||type==='pos_delete') && <Field label="적용 범위 (선택)"><input value={itemScope} onChange={e=>setItemScope(e.target.value)} className="inp" placeholder="예: 비개발 직군" /></Field>}
            {type==='duty_create' && <Field label="설명 (선택)"><input value={itemScope} onChange={e=>setItemScope(e.target.value)} className="inp" placeholder="예: 팀 총괄 책임" /></Field>}
            <p className="text-[11px] text-slate-400 dark:text-slate-500 -mt-1">특정 직원이 아니라 <b>직위·직책 제도의 신설/폐지</b>를 기록합니다. 발령문 「직위·직책 신설/폐지」에 표기됩니다.</p>
          </>}

          <div>
            <Field label="사유"><input value={reason} onChange={e=>setReason(e.target.value)} className="inp" /></Field>
            <div className="flex flex-wrap gap-1 mt-1.5">{REASON_CHIPS.map(c=><button key={c} type="button" onClick={()=>setReason(c)} className="text-[11px] px-2 py-0.5 rounded-full border border-slate-200 dark:border-slate-600 text-slate-500 dark:text-slate-400 hover:border-indigo-400 hover:text-indigo-600 dark:hover:text-indigo-400">{c}</button>)}</div>
          </div>
          
        </div>
        <div className="flex justify-end gap-2 mt-5">
          <button onClick={saveTemp} className="px-4 py-2 text-sm text-slate-600 dark:text-slate-300 rounded-lg border border-slate-300 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-700/40">임시저장</button>
          <button onClick={onClose} className="px-4 py-2 text-sm text-slate-600 dark:text-slate-300 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">취소</button>
          <button onClick={save} className="px-4 py-2 text-sm bg-slate-900 text-white rounded-lg hover:bg-slate-800">등록</button>
        </div>
      </div>
    </div>
  );
}
function OrgPicker({ groups, value, onChange, placeholder }){
  const [q,setQ]=useState(''); const [open,setOpen]=useState(false);
  const sel=groups.find(g=>g.id===value);
  const s=(q||'').trim();
  const list=groups.filter(g=> !s || (g.name||'').includes(s)).slice(0,60);
  return (
    <div className="relative">
      <input value={open? q : (sel? sel.name : '')} onFocus={()=>{ setOpen(true); setQ(''); }} onChange={e=>{ setQ(e.target.value); setOpen(true); }} onBlur={()=>setTimeout(()=>setOpen(false),150)} placeholder={placeholder||'조직/팀 검색'} className="inp" />
      {open && <div className="absolute z-30 left-0 right-0 mt-1 max-h-56 overflow-y-auto bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg shadow-lg">
        {list.length===0 && <div className="px-3 py-2 text-xs text-slate-400">검색 결과 없음</div>}
        {list.map(g=><button key={g.id} type="button" onMouseDown={()=>{ onChange(g.id); setQ(''); setOpen(false); }} className="w-full text-left px-3 py-1.5 text-sm hover:bg-slate-100 dark:hover:bg-slate-700/40 text-slate-700 dark:text-slate-200">{g.name}</button>)}
      </div>}
    </div>
  );
}
function BatchOrderModal({ emps, groups, assigns, reload, setBusy, flash, setErr, onClose }){
  const active=emps.filter(e=>e.status!=='퇴사');
  const today=new Date().toISOString().slice(0,10);
  const [date,setDate]=useState(today);
  const [effDate,setEffDate]=useState(today);
  const blank=()=>({ key:Math.random().toString(36).slice(2), kind:'transfer', empId:'', groupId:'', position:'', rank:'', orgId:'', newName:'', itemName:'', itemScope:'', p1:'', p2:'', note:'' });
  const [rows,setRows]=useState([blank(),blank(),blank()]);
  function upd(key,field,val){ setRows(rs=>rs.map(r=>r.key===key?Object.assign({},r,{[field]:val}):r)); }
  function addRow(){ setRows(rs=>rs.concat([blank()])); }
  function delRow(key){ setRows(rs=>rs.length>1?rs.filter(r=>r.key!==key):rs); }
  const RESERVE=(effDate||date)>TODAY();
  const EFF=(effDate||date);
  function flagOf(){ return RESERVE ? { effective_date:EFF, applied:false } : { effective_date:EFF, applied:true, applied_at:new Date().toISOString() }; }

  const effGroups=(function(){
    var list=groups.map(function(g){ return { id:g.id, name:g.name, team:g.team, parent_id:g.parent_id, _pendNew:g._pendNew, _pendName:g._pendName, _pendDel:g._pendDel }; });
    var removed={};
    rows.forEach(function(r){
      if(r.kind==='org_create' && (r.newName||'').trim()) list.push({ id:'tmp_'+r.key, name:r.newName.trim()+' (이 화면에서 신설)', team:'', parent_id:r.orgId||null, tmp:true });
      if(r.kind==='org_edit' && r.orgId && (r.newName||'').trim()){ var g=list.find(function(x){return x.id===r.orgId;}); if(g) g.name=r.newName.trim(); }
      if(r.kind==='org_delete' && r.orgId) removed[r.orgId]=1;
    });
    return list.filter(function(g){ return !removed[g.id]; });
  })();
  const gname=id=>{ const g=groups.find(x=>x.id===id); return g?g.name:''; };
  const gopt=effGroups.map(g=><option key={g.id} value={g.id}>{g.tmp?g.name:gLabel(g)}</option>);
  // 이 조직이 (기존 예약이든, 지금 이 화면의 다른 줄이든) 명칭변경 대상인지 — 같은 조직으로의 "전보"가
  // 실제로는 "팀 명칭 변경에 따른 재확인"일 수 있으므로, 이 경우엔 무효 처리하지 않음
  const renamedIds=(function(){
    var s={};
    groups.forEach(function(g){ if(g._pendName) s[g.id]=1; });
    rows.forEach(function(r){ if(r.kind==='org_edit' && r.orgId && (r.newName||'').trim()){ var g=groups.find(function(x){return x.id===r.orgId;}); if(g && r.newName.trim()!==g.name) s[r.orgId]=1; } });
    return s;
  })();

  // ── 줄 상태 판정 ──
  function isFilled(r){
    return !!(r.empId||r.orgId||(r.newName||'').trim()||(r.itemName||'').trim()||(r.itemScope||'').trim()||(r.p1||'').trim()||(r.p2||'').trim()||(r.position||'').trim()||(r.rank||'').trim()||(r.note||'').trim()||r.groupId);
  }
  function issueOf(r){
    var emp=active.find(function(e){ return e.id===r.empId; });
    var k=r.kind;
    if(['hire','transfer','promotion','demotion','job_change','dispatch','leave','return','standby','resign','concurrent','concurrent_end'].indexOf(k)>=0 && !r.empId) return '대상 직원을 선택하세요';
    if(k==='hire'){
      if(!r.groupId) return '배치할 조직을 선택하세요';
    }
    if(k==='transfer'){
      if(!r.groupId) return '이동할 조직을 선택하세요';
      if(emp && r.groupId===emp.group_id && !renamedIds[r.groupId]) return '이동할 조직이 현재 소속('+gname(emp.group_id)+')과 같습니다';
    }
    if(k==='promotion'||k==='demotion'){
      var np=(r.position||'').trim(), nr=(r.rank||'').trim();
      if(!np && !nr) return '새 직위 또는 새 직책을 입력하세요';
      if(emp && (!np||np===emp.position) && (!nr||nr===emp.rank)) return '새 직위·직책이 현재 값과 같습니다 (현재: '+(emp.position||'-')+(emp.rank?(' · '+emp.rank):'')+')';
    }
    if(k==='concurrent'&&!r.groupId) return '겸직할 조직을 선택하세요';
    if(k==='concurrent_end'&&!r.groupId) return '해제할 겸직 조직을 선택하세요';
    if(k==='org_edit'){
      if(!r.orgId) return '명칭을 변경할 조직을 선택하세요';
      if(!(r.newName||'').trim()) return '새 조직/팀 명칭을 입력하세요';
      var g0=groups.find(function(x){return x.id===r.orgId;});
      if(g0 && r.newName.trim()===g0.name) return '새 명칭이 기존 명칭과 같습니다';
    }
    if(k==='org_create'&&!(r.newName||'').trim()) return '새 조직/팀 명칭을 입력하세요';
    if(k==='org_delete'&&!r.orgId) return '폐지할 조직을 선택하세요';
    if(['pos_create','pos_delete','duty_create','duty_delete'].indexOf(k)>=0 && !(r.itemName||'').trim()) return '명칭을 입력하세요';
    if(k==='position_scheme' && !((r.itemScope||'').trim()||(r.p1||'').trim()||(r.p2||'').trim())) return '적용 범위 또는 기존/변경 직위를 입력하세요';
    return '';
  }
  const filled=rows.filter(isFilled);
  const issues=filled.map(function(r){ return { i:rows.indexOf(r)+1, r:r, msg:issueOf(r) }; }).filter(function(x){ return !!x.msg; });
  const ready=filled.filter(function(r){ return !issueOf(r); });

  const DKEY='demo_hr_batch_draft';
  const [draft,setDraft]=useState(null);
  useEffect(function(){ var d=draftGet(DKEY); if(d && d.rows && d.rows.length) setDraft(d); },[]);
  function saveTemp(){ if(draftSet(DKEY,{ date, effDate, rows })) uiAlert('임시저장되었습니다.\n다음에 이 창을 열면 「불러오기」로 이어서 작성할 수 있습니다.'); else uiAlert('이 브라우저에서는 임시저장을 지원하지 않습니다.'); }
  function restoreDraft(){ if(draft){ if(draft.date) setDate(draft.date); if(draft.effDate) setEffDate(draft.effDate); if(draft.rows) setRows(draft.rows); } setDraft(null); }
  function discardDraft(){ draftDel(DKEY); setDraft(null); }

  async function submit(){
    if(!filled.length){ uiAlert('내용을 한 줄 이상 채우세요.\n(직원·조직·명칭 중 하나라도 입력하면 그 줄이 처리 대상이 됩니다)'); return; }
    if(issues.length){
      const lines=issues.map(function(x){ return x.i+'번째 줄 ['+(ORDER_LABEL[x.r.kind]||x.r.kind)+'] : '+x.msg; }).join('\n');
      if(!ready.length){ await uiAlert('아래 항목을 채우면 등록할 수 있습니다.\n\n'+lines); return; }
      if(!await uiConfirm('아래 '+issues.length+'줄은 항목이 비어 처리할 수 없습니다.\n\n'+lines+'\n\n정상 입력된 '+ready.length+'줄만 등록할까요?')) return;
    }
    const FL=flagOf();
    setBusy(true); let made=0, errObj=null; const skipped=[]; const idMap={};
    const R=function(kind){ return ready.filter(function(x){ return x.kind===kind; }); };
    // 1) 조직 신설 — 다른 신설조직을 상위로 참조하는 줄은 그 상위가 먼저 만들어지도록 정렬(부모→자식)
    if(!errObj){
      const ocRows=R('org_create').slice();
      const ordered=[]; const placed={}; let guard=0;
      while(ocRows.length && guard++<ocRows.length+50){
        for(let i=0;i<ocRows.length;i++){
          const r=ocRows[i];
          const dep = (r.orgId && r.orgId.indexOf('tmp_')===0) ? r.orgId : null; // 같은 화면 신설조직을 상위로 참조?
          if(!dep || placed[dep]){ ordered.push(r); placed['tmp_'+r.key]=1; ocRows.splice(i,1); i--; }
        }
      }
      // 혹시 순환/미해결이 남으면 그대로 뒤에 붙임(상위는 최상위로 처리됨)
      ocRows.forEach(function(r){ ordered.push(r); placed['tmp_'+r.key]=1; });
      for(const r of ordered){
        const realId='g_'+Date.now()+Math.floor(Math.random()*1000);
        const parent=r.orgId ? ((r.orgId.indexOf('tmp_')===0?idMap[r.orgId]:r.orgId)||null) : null;
        const fields={ name:r.newName.trim(), subtitle:'', parent_id:parent, team:'', is_staff:false, staff_side:null };
        let res=await sb.from('org_groups').insert(Object.assign({ id:realId }, fields));
        if(res.error){ errObj=res.error; break; }
        idMap['tmp_'+r.key]=realId;
        res=await sb.from('hr_orders').insert({ order_date:date, order_type:'org_create', person_name:fields.name, detail:Object.assign({ id:realId, after:fields, reason:(r.note||'').trim() }, FL) });
        if(res.error){ errObj=res.error; break; } made++;
      }
    }
    // 2) 팀 명칭 변경
    if(!errObj) for(const r of R('org_edit')){
      const g=groups.find(function(x){return x.id===r.orgId;}); if(!g) continue;
      const nm=r.newName.trim();
      let res={ error:null };
      if(!RESERVE) res=await sb.from('org_groups').update({ name:nm }).eq('id',g.id);
      if(res.error){ errObj=res.error; break; }
      res=await sb.from('hr_orders').insert({ order_date:date, order_type:'org_edit', person_name:nm, detail:Object.assign({ id:g.id, before:{ name:g.name, parent_id:g.parent_id }, after:{ name:nm, parent_id:g.parent_id }, reason:(r.note||'').trim() }, FL) });
      if(res.error){ errObj=res.error; break; } made++;
    }
    // 3) 전보 (신설 조직으로도 이동 가능: 임시ID→실제ID 매핑)
    const movedOut={};
    if(!errObj) for(const r of R('transfer')){
      const emp=active.find(function(e){return e.id===r.empId;}); if(!emp) continue;
      let gid=r.groupId; if(gid && gid.indexOf('tmp_')===0) gid=idMap[gid];
      if(!gid){ skipped.push(emp.name+'(이동 조직 확인 불가)'); continue; }
      const before={ team:emp.team, position:emp.position, rank:emp.rank, group_id:emp.group_id, status:emp.status||'재직' };
      const tg=groups.find(function(x){return x.id===gid;}); const patch={ group_id:gid, team:tg?tg.name:'' };
      let res={ error:null };
      if(!RESERVE) res=await sb.from('employees').update(patch).eq('id',emp.id);
      if(res.error){ errObj=res.error; break; }
      if(!RESERVE) (movedOut[emp.group_id]=movedOut[emp.group_id]||{})[emp.id]=1;
      res=await sb.from('hr_orders').insert({ order_date:date, order_type:'transfer', employee_id:emp.id, person_name:emp.name, detail:Object.assign({ reason:(r.note||'').trim(), before, after:{ group_id:patch.group_id, team:patch.team } }, FL) });
      if(res.error){ errObj=res.error; break; } made++;
    }
    // 3.2) 신규 입사 배치 (기존 직원을 조직으로 배치 · 신설 조직 tmp id 매핑 지원)
    if(!errObj) for(const r of R('hire')){
      const emp=active.find(function(e){return e.id===r.empId;}); if(!emp) continue;
      let gid=r.groupId; if(gid && gid.indexOf('tmp_')===0) gid=idMap[gid];
      if(!gid){ skipped.push(emp.name+'(배치 조직 확인 불가)'); continue; }
      const before={ team:emp.team, position:emp.position, rank:emp.rank, group_id:emp.group_id, status:emp.status||'재직' };
      const tg=groups.find(function(x){return x.id===gid;});
      const after={ group_id:gid, team:tg?tg.name:'', position:r.position||emp.position, rank:r.rank||emp.rank };
      let res={ error:null };
      if(!RESERVE){ const patch={ group_id:gid, team:after.team }; if(r.position) patch.position=r.position; if(r.rank) patch.rank=r.rank; res=await sb.from('employees').update(patch).eq('id',emp.id); }
      if(res.error){ errObj=res.error; break; }
      res=await sb.from('hr_orders').insert({ order_date:date, order_type:'hire', employee_id:emp.id, person_name:emp.name, detail:Object.assign({ reason:(r.note||'').trim()||'신규 입사 배치', before, after }, FL) });
      if(res.error){ errObj=res.error; break; } made++;
    }
    // 4) 승진 / 강등
    if(!errObj) for(const r of R('promotion').concat(R('demotion'))){
      const emp=active.find(function(e){return e.id===r.empId;}); if(!emp) continue;
      const patch={}; if(r.position && r.position!==emp.position) patch.position=r.position; if(r.rank && r.rank!==emp.rank) patch.rank=r.rank;
      if(!Object.keys(patch).length) continue;
      const before={ team:emp.team, position:emp.position, rank:emp.rank, group_id:emp.group_id, status:emp.status||'재직' };
      let res={ error:null };
      if(!RESERVE) res=await sb.from('employees').update(patch).eq('id',emp.id);
      if(res.error){ errObj=res.error; break; }
      res=await sb.from('hr_orders').insert({ order_date:date, order_type:r.kind, employee_id:emp.id, person_name:emp.name, detail:Object.assign({ reason:(r.note||'').trim(), before, after:{ position:r.position||emp.position, rank:r.rank||emp.rank } }, FL) });
      if(res.error){ errObj=res.error; break; } made++;
    }
    // 5) 기타 인사발령 (직무변경/파견/휴직/복직/대기발령)
    if(!errObj) for(const r of ready.filter(function(x){return ['job_change','dispatch','leave','return','standby'].indexOf(x.kind)>=0;})){
      const emp=active.find(function(e){return e.id===r.empId;}); if(!emp) continue;
      const note=(r.note||'').trim();
      const before={ team:emp.team, position:emp.position, rank:emp.rank, group_id:emp.group_id, status:emp.status||'재직' };
      let res={ error:null };
      if(r.kind==='job_change'){
        const patch={}; if(r.position && r.position!==emp.position) patch.position=r.position; if(r.rank && r.rank!==emp.rank) patch.rank=r.rank;
        if(!RESERVE && Object.keys(patch).length) res=await sb.from('employees').update(patch).eq('id',emp.id);
        if(!res.error) res=await sb.from('hr_orders').insert({ order_date:date, order_type:'job_change', employee_id:emp.id, person_name:emp.name, detail:Object.assign({ reason:note, before, after:patch }, FL) });
      } else if(r.kind==='dispatch'){
        res=await sb.from('hr_orders').insert({ order_date:date, order_type:'dispatch', employee_id:emp.id, person_name:emp.name, detail:Object.assign({ reason:note, before, group:(r.groupId?gname(r.groupId):'') }, FL) });
      } else if(r.kind==='leave'){
        if(!RESERVE) res=await sb.from('employees').update({ status:'휴직' }).eq('id',emp.id);
        if(!res.error) res=await sb.from('hr_orders').insert({ order_date:date, order_type:'leave', employee_id:emp.id, person_name:emp.name, detail:Object.assign({ reason:note, before }, FL) });
      } else if(r.kind==='return'){
        if(!RESERVE) res=await sb.from('employees').update({ status:'재직' }).eq('id',emp.id);
        if(!res.error) res=await sb.from('hr_orders').insert({ order_date:date, order_type:'return', employee_id:emp.id, person_name:emp.name, detail:Object.assign({ reason:note, before }, FL) });
      } else if(r.kind==='standby'){
        res=await sb.from('hr_orders').insert({ order_date:date, order_type:'standby', employee_id:emp.id, person_name:emp.name, detail:Object.assign({ reason:note, before }, FL) });
      }
      if(res.error){ errObj=res.error; break; } made++;
    }
    // 6) 겸직 등록/해제 · 퇴사
    if(!errObj) for(const r of R('concurrent')){
      const emp=active.find(function(e){return e.id===r.empId;}); if(!emp) continue; const note=(r.note||'').trim();
      let gid=r.groupId; if(gid && gid.indexOf('tmp_')===0) gid=idMap[gid]; if(!gid) continue;
      let res={ error:null };
      if(!RESERVE) res=await sb.from('employee_assignments').upsert({ employee_id:emp.id, group_id:gid, position:r.position||emp.position, rank:r.rank||emp.rank }, { onConflict:'employee_id,group_id' });
      if(res.error){ errObj=res.error; break; }
      res=await sb.from('hr_orders').insert({ order_date:date, order_type:'concurrent', employee_id:emp.id, person_name:emp.name, detail:Object.assign({ reason:note, group:gname(gid), group_id:gid, position:r.position||emp.position }, FL) });
      if(res.error){ errObj=res.error; break; } made++;
    }
    if(!errObj) for(const r of R('concurrent_end')){
      const emp=active.find(function(e){return e.id===r.empId;}); if(!emp) continue; const note=(r.note||'').trim();
      let res={ error:null };
      if(!RESERVE) res=await sb.from('employee_assignments').delete().eq('employee_id',emp.id).eq('group_id',r.groupId);
      if(res.error){ errObj=res.error; break; }
      res=await sb.from('hr_orders').insert({ order_date:date, order_type:'concurrent_end', employee_id:emp.id, person_name:emp.name, detail:Object.assign({ reason:note, group:gname(r.groupId), group_id:r.groupId }, FL) });
      if(res.error){ errObj=res.error; break; } made++;
    }
    if(!errObj) for(const r of R('resign')){
      const emp=active.find(function(e){return e.id===r.empId;}); if(!emp) continue; const note=(r.note||'').trim();
      const before={ team:emp.team, position:emp.position, rank:emp.rank, group_id:emp.group_id, status:emp.status||'재직' };
      let res={ error:null };
      if(!RESERVE) res=await sb.from('employees').update({ last_work_day:EFF, status:'퇴사' }).eq('id',emp.id);
      if(res.error){ errObj=res.error; break; }
      res=await sb.from('hr_orders').insert({ order_date:date, order_type:'resign', employee_id:emp.id, person_name:emp.name, detail:Object.assign({ reason:note, before }, FL) });
      if(res.error){ errObj=res.error; break; } made++;
    }
    // 7) 직위/직책 신설·폐지 · 직위체계 변경 (기록)
    if(!errObj) for(const r of ready.filter(function(x){return ['pos_create','pos_delete','duty_create','duty_delete'].indexOf(x.kind)>=0;})){
      const note=(r.note||'').trim();
      let res=await sb.from('hr_orders').insert({ order_date:date, order_type:r.kind, person_name:r.itemName.trim(), detail:Object.assign({ reason:note, scope:(r.itemScope||'').trim(), name:r.itemName.trim() }, FL) });
      if(res.error){ errObj=res.error; break; } made++;
    }
    if(!errObj) for(const r of R('position_scheme')){
      const note=(r.note||'').trim();
      const bf=(r.p1||'').split(',').map(function(s){return s.trim();}).filter(Boolean);
      const af=(r.p2||'').split(',').map(function(s){return s.trim();}).filter(Boolean);
      let res=await sb.from('hr_orders').insert({ order_date:date, order_type:'position_scheme', person_name:(r.itemScope||'직위체계').trim(), detail:Object.assign({ reason:note, scope:(r.itemScope||'').trim(), before:bf, after:af }, FL) });
      if(res.error){ errObj=res.error; break; } made++;
    }
    // 8) 조직 폐지 (이동 반영 후 비어있는 것만 · 예약이면 시행일에 판정)
    if(!errObj) for(const r of R('org_delete')){
      const g=groups.find(function(x){return x.id===r.orgId;}); if(!g) continue;
      const remain=active.filter(function(e){ return e.group_id===r.orgId && !(movedOut[r.orgId]&&movedOut[r.orgId][e.id]); });
      const kids=groups.filter(function(x){ return x.parent_id===r.orgId; });
      const snap={ id:g.id, name:g.name, subtitle:g.subtitle||'', parent_id:g.parent_id||null, team:g.team||'', is_staff:!!g.is_staff, staff_side:g.staff_side||null };
      let res={ error:null };
      if(!RESERVE){
        if(remain.length||kids.length){ skipped.push(g.name+'(잔류 '+remain.length+'명·하위 '+kids.length+'개)'); continue; }
        res=await sb.from('org_groups').delete().eq('id',g.id);
        if(res.error){ errObj=res.error; break; }
      }
      res=await sb.from('hr_orders').insert({ order_date:date, order_type:'org_delete', person_name:g.name, detail:Object.assign({ id:g.id, before:snap, reason:(r.note||'').trim() }, FL) });
      if(res.error){ errObj=res.error; break; } made++;
    }
    setBusy(false);
    if(errObj){ setErr(errObj.message); return; }
    if(made===0 && !skipped.length){ uiAlert('반영할 변경 내용이 없습니다.\n각 줄의 필수 항목(직원·조직·명칭 등)을 확인하세요.'); return; }
    await reload();
    await uiAlert(made+'건이 '+(RESERVE?('예약되었습니다.\n시행일('+EFF+')이 지나면 자동으로 반영됩니다.'):'등록·반영되었습니다.')+(skipped.length?('\n\n폐지 보류(소속 인원·하위 조직 있음): '+skipped.join(', ')):''));
    draftDel(DKEY);
    onClose();
  }
  return (
    <div className="fixed inset-0 bg-black/40 z-50 flex items-start justify-center p-4 overflow-y-auto">
      <div className="bg-white dark:bg-slate-800 rounded-2xl w-full max-w-5xl my-6 p-5" onClick={ev=>ev.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-bold text-slate-800 dark:text-slate-100">일괄 발령</h3>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">×</button>
        </div>
        <div className="grid grid-cols-2 gap-3 mb-2">
          <Field label="발령일 (문서 날짜)"><input type="date" value={date} onChange={e=>setDate(e.target.value)} className="inp" /></Field>
          <Field label="시행일 (실제 반영일)"><input type="date" value={effDate} onChange={e=>setEffDate(e.target.value)} className="inp" /></Field>
        </div>
        {RESERVE
          ? <div className="mb-2 rounded-lg bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800 px-3 py-2 text-[12px] text-amber-700 dark:text-amber-300">시행일이 미래이므로 <b>예약 등록</b>됩니다. 시행일({EFF})이 지나면 자동 반영되며, 그때까지 조직도·명부는 <b>발령 전 상태</b>로 유지됩니다. (신설 조직은 발령 드롭다운에만 「신설 시행예정」으로 표시)</div>
          : <div className="mb-2 rounded-lg bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 px-3 py-2 text-[12px] text-slate-500 dark:text-slate-400">시행일이 오늘 이전이므로 <b>즉시 반영</b>됩니다.</div>}
        <div className="text-[11px] text-slate-400 dark:text-slate-500 mb-1.5">조직 <b>신설·명칭변경·폐지</b>를 먼저 넣으면, 같은 화면의 <b>인사이동</b> 조직 목록에 바로 반영됩니다(신설 조직으로도 발령 가능). 처리 순서: 신설 → 명칭변경 → 인사이동 → 승진/강등 → 기타 → 겸직·퇴사 → 직위/직책 → 폐지. <b>비고</b>는 비우면 발령문에 빈칸으로 나옵니다.</div>
        {draft && <div className="mb-2 flex items-center justify-between gap-2 rounded-lg border border-amber-300 dark:border-amber-700 bg-amber-50 dark:bg-amber-950/40 px-3 py-2 text-[12px]">
          <span className="text-amber-700 dark:text-amber-300">임시저장된 작성 내용이 있습니다.</span>
          <span className="flex gap-2"><button type="button" onClick={restoreDraft} className="px-2 py-0.5 rounded bg-amber-600 text-white hover:bg-amber-700">불러오기</button><button type="button" onClick={discardDraft} className="px-2 py-0.5 rounded border border-amber-300 dark:border-amber-700 text-amber-700 dark:text-amber-300 hover:bg-amber-100 dark:hover:bg-amber-900/40">삭제</button></span>
        </div>}
        <div className="space-y-2">
          {rows.map((r,i)=>{ const emp=active.find(e=>e.id===r.empId);
            const msg=isFilled(r)?issueOf(r):'';
            const tmpl = (r.kind==='hire'||r.kind==='promotion'||r.kind==='demotion'||r.kind==='job_change'||r.kind==='concurrent'||r.kind==='position_scheme') ? 'minmax(0,0.9fr) minmax(0,1.1fr) minmax(0,0.8fr) minmax(0,0.8fr) minmax(0,0.9fr) 28px'
              : (r.kind==='leave'||r.kind==='return'||r.kind==='standby'||r.kind==='resign') ? 'minmax(0,0.9fr) minmax(0,1.6fr) minmax(0,0.9fr) 28px'
              : r.kind==='transfer' ? 'minmax(0,0.9fr) minmax(0,1.1fr) minmax(0,1.1fr) minmax(0,0.9fr) 28px'
              : 'minmax(0,0.9fr) minmax(0,1.1fr) minmax(0,1.4fr) minmax(0,0.9fr) 28px';
            return (
            <div key={r.key}>
            <div className="grid gap-2 items-start" style={{gridTemplateColumns:tmpl}}>
              <select value={r.kind} onChange={e=>upd(r.key,'kind',e.target.value)} className="inp">{ORDER_TYPE_OPTIONS.map(function(o){ return <option key={o[0]} value={o[0]}>{o[1]}</option>; })}</select>
              {r.kind==='hire' && <>
                <EmpPicker emps={active} value={r.empId} onChange={id=>upd(r.key,'empId',id)} placeholder={'직원 '+(i+1)} />
                <select value={r.groupId} onChange={e=>upd(r.key,'groupId',e.target.value)} className="inp"><option value="">배치할 조직 선택</option>{gopt}</select>
                <PosPicker value={r.position} onChange={v=>upd(r.key,'position',v)} kind="position" placeholder={emp?('현 '+(emp.position||'-')):'직위'} />
              </>}
              {r.kind==='transfer' && <>
                <EmpPicker emps={active} value={r.empId} onChange={id=>upd(r.key,'empId',id)} placeholder={'직원 '+(i+1)} />
                <select value={r.groupId} onChange={e=>upd(r.key,'groupId',e.target.value)} className="inp"><option value="">이동할 조직 선택</option>{gopt}</select>
              </>}
              {(r.kind==='promotion'||r.kind==='demotion') && <>
                <EmpPicker emps={active} value={r.empId} onChange={id=>upd(r.key,'empId',id)} placeholder={'직원 '+(i+1)} />
                <PosPicker value={r.position} onChange={v=>upd(r.key,'position',v)} kind="position" placeholder={emp?('현 '+(emp.position||'-')):'새 직위'} />
                <PosPicker value={r.rank} onChange={v=>upd(r.key,'rank',v)} kind="duty" placeholder={emp?('현 '+(emp.rank||'-')):'새 직책(선택)'} />
              </>}
              {r.kind==='org_edit' && <>
                <OrgPicker groups={groups} value={r.orgId} onChange={id=>upd(r.key,'orgId',id)} placeholder={'대상 조직/팀 '+(i+1)} />
                <input value={r.newName} onChange={e=>upd(r.key,'newName',e.target.value)} className="inp" placeholder="새 조직/팀 명칭" />
              </>}
              {r.kind==='org_create' && <>
                <select value={r.orgId} onChange={e=>upd(r.key,'orgId',e.target.value)} className="inp"><option value="">(상위: 최상위)</option>{effGroups.filter(g=>g.id!==('tmp_'+r.key)).map(g=><option key={g.id} value={g.id}>{g.tmp?g.name:gLabel(g)}</option>)}</select>
                <input value={r.newName} onChange={e=>upd(r.key,'newName',e.target.value)} className="inp" placeholder="새 조직/팀 명칭" />
              </>}
              {r.kind==='org_delete' && <>
                <OrgPicker groups={groups} value={r.orgId} onChange={id=>upd(r.key,'orgId',id)} placeholder={'폐지할 조직/팀 '+(i+1)} />
                <div className="text-[11px] text-slate-400 dark:text-slate-500 self-center px-1">소속 인원·하위 없어야 폐지</div>
              </>}
              {r.kind==='concurrent' && <>
                <EmpPicker emps={active} value={r.empId} onChange={id=>upd(r.key,'empId',id)} placeholder={'직원 '+(i+1)} />
                <select value={r.groupId} onChange={e=>upd(r.key,'groupId',e.target.value)} className="inp"><option value="">겸직 조직 선택</option>{gopt}</select>
                <PosPicker value={r.position} onChange={v=>upd(r.key,'position',v)} kind="position" placeholder="겸직 직위" />
              </>}
              {r.kind==='concurrent_end' && <>
                <EmpPicker emps={active} value={r.empId} onChange={id=>upd(r.key,'empId',id)} placeholder={'직원 '+(i+1)} />
                <select value={r.groupId} onChange={e=>upd(r.key,'groupId',e.target.value)} className="inp"><option value="">해제할 겸직 조직</option>{(assigns||[]).filter(a=>a.employee_id===r.empId).map(a=><option key={a.id} value={a.group_id}>{gname(a.group_id)}</option>)}</select>
              </>}
              {(r.kind==='pos_create'||r.kind==='pos_delete') && <>
                <input value={r.itemName} onChange={e=>upd(r.key,'itemName',e.target.value)} className="inp" placeholder="직위 명칭 (예: 책임매니저)" />
                <input value={r.itemScope} onChange={e=>upd(r.key,'itemScope',e.target.value)} className="inp" placeholder="적용 범위 (선택)" />
              </>}
              {(r.kind==='duty_create'||r.kind==='duty_delete') && <>
                <input value={r.itemName} onChange={e=>upd(r.key,'itemName',e.target.value)} className="inp" placeholder="직책 명칭 (예: 팀장)" />
                <input value={r.itemScope} onChange={e=>upd(r.key,'itemScope',e.target.value)} className="inp" placeholder="설명 (선택)" />

              {r.kind==='position_scheme' && <>
                <input value={r.itemScope} onChange={e=>upd(r.key,'itemScope',e.target.value)} className="inp" placeholder="적용 범위 (예: 비개발 직군)" />
                <input value={r.p1} onChange={e=>upd(r.key,'p1',e.target.value)} className="inp" placeholder="기존 (예: 매니저)" />
                <input value={r.p2} onChange={e=>upd(r.key,'p2',e.target.value)} className="inp" placeholder="변경 (예: 매니저, 책임매니저, 수석매니저)" />
              </>}
              {r.kind==='job_change' && <>
                <EmpPicker emps={active} value={r.empId} onChange={id=>upd(r.key,'empId',id)} placeholder={'직원 '+(i+1)} />
                <PosPicker value={r.position} onChange={v=>upd(r.key,'position',v)} kind="position" placeholder={emp?('현 '+(emp.position||'-')):'새 직위'} />
                <PosPicker value={r.rank} onChange={v=>upd(r.key,'rank',v)} kind="duty" placeholder={emp?('현 '+(emp.rank||'-')):'새 직책(선택)'} />
              </>}
              {r.kind==='dispatch' && <>
                <EmpPicker emps={active} value={r.empId} onChange={id=>upd(r.key,'empId',id)} placeholder={'직원 '+(i+1)} />
                <select value={r.groupId} onChange={e=>upd(r.key,'groupId',e.target.value)} className="inp"><option value="">파견 조직(선택)</option>{gopt}</select>
              </>}
              {(r.kind==='leave'||r.kind==='return'||r.kind==='standby'||r.kind==='resign') && <EmpPicker emps={active} value={r.empId} onChange={id=>upd(r.key,'empId',id)} placeholder={'직원 '+(i+1)} />}
              <input value={r.note} onChange={e=>upd(r.key,'note',e.target.value)} className="inp" placeholder="비고 (선택)" />
              <button type="button" onClick={()=>delRow(r.key)} className="h-9 text-slate-300 hover:text-rose-500" title="줄 삭제">✕</button>
            </div>
            {msg && <div className="text-[11px] text-rose-500 mt-0.5 ml-1">⚠ {i+1}번째 줄 : {msg}</div>}
            </div>
          ); })}
        </div>
        <button type="button" onClick={addRow} className="mt-2 text-xs text-indigo-600 dark:text-indigo-400 hover:underline">+ 줄 추가</button>

        <div className="flex justify-between items-center mt-5">
          <span className="text-[12px] text-slate-400 dark:text-slate-500">등록 가능 {ready.length}줄{issues.length?(' · 확인 필요 '+issues.length+'줄'):''}</span>
          <div className="flex gap-2">
            <button onClick={saveTemp} className="px-4 py-2 text-sm text-slate-600 dark:text-slate-300 rounded-lg border border-slate-300 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-700/40">임시저장</button>
            <button onClick={onClose} className="px-4 py-2 text-sm text-slate-600 dark:text-slate-300 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">취소</button>
            <button onClick={submit} className="px-4 py-2 text-sm bg-slate-900 text-white rounded-lg hover:bg-slate-800">일괄 등록</button>
          </div>
        </div>
      </div>
    </div>
  );
}
function EmpsTab({ emps, groups, orders, canEdit, payAdmin, reload, setBusy, flash, setErr }){

    .sort((a,b)=>(a.team||'').localeCompare(b.team||'')||(a.name||'').localeCompare(b.name||''));
  async function exportXlsx(){
    if(typeof XLSX==='undefined'){ uiAlert('엑셀 모듈 로딩 중입니다. 잠시 후 다시 시도하세요.'); return; }
    const rows=list.map(e=> emergency
      ? { 이름:e.name, 부서:e.team, 직위:e.position, 개인휴대폰:e.personal_phone||'', 비상연락처:e.emergency_contact||'', 관계:e.emergency_relation||'', 자택주소:e.home_address||'' }
      : Object.assign({ 이름:e.name, 사번:e.emp_no, 부서:e.team, 직위:e.position, 직책:e.rank||'',
                        입사일:fmtDate(e.join_date), 퇴사일:e.last_work_day?fmtDate(e.last_work_day):'',
                        근로계약종료일:e.contract_end_date||'',
                        근속:tenure(e.join_date,e.last_work_day), 이메일:e.email||'' },
                      showSalary?{ 월급여:e.monthly_pay||'' }:{}, { 상태:e.status||'재직' }));
    const ws=XLSX.utils.json_to_sheet(rows), wb=XLSX.utils.book_new();
    const title=emergency?'비상연락망':'임직원명부';
    XLSX.utils.book_append_sheet(wb,ws,title);

    // ── 「임금대장」 시트 추가 (2026-08-05) ────────────────────────────
    //  급여 권한자(user_roles: app='payroll' · SUPER/ADMIN)에게만 붙인다.
    //  employee_pay_base 는 적용시작월 단위 이력이므로, 오늘 기준으로
    //  유효한 버전 한 건만 골라 쓴다 (미래 발효분은 제외).
    //  「항목합계」·「차이」 열은 월급여와 항목 합이 어긋난 사람을 바로 찾기 위한 것이다.
    let wageNote='';
    if(payAdmin && !emergency){
      const pb=await sb.from('employee_pay_base')
        .select('*').order('emp_no').order('apply_month',{ascending:false});
      if(pb.error){ wageNote=' (임금대장 조회 실패: '+pb.error.message+')'; }
      else {
        const thisMonth=new Date().toISOString().slice(0,7);
        const cur={};
        (pb.data||[]).forEach(r=>{
          const am=String(r.apply_month||'').slice(0,7);
          if(am && am>thisMonth) return;              // 아직 발효되지 않은 버전은 건너뛴다
          if(!cur[r.emp_no]) cur[r.emp_no]=r;         // 최신순 정렬이라 첫 건이 유효 버전
        });
        const ITEM=['base_salary','fixed_ot','fixed_holiday','night_allow','activity_allow',
                    'meal_allow','car_allow','childcare_allow','research_allow'];
        const n=v=>Math.round(Number(v)||0);
        const wageRows=list.map(e=>{
          const w=cur[e.emp_no]||{};
          const sum=ITEM.reduce((a,k)=>a+n(w[k]),0);
          return { 이름:e.name, 사번:e.emp_no, 부서:e.team, 직위:e.position||'', 직책:e.rank||'',
                   입사일:fmtDate(e.join_date), 상태:e.status||'재직',
                   적용시작월:w.apply_month?String(w.apply_month).slice(0,7):'(임금 미등록)',
                   월급여:n(w.monthly_pay),
                   기본급:n(w.base_salary),
                   고정연장근로수당:n(w.fixed_ot), 고정휴일근로수당:n(w.fixed_holiday),
                   야간수당:n(w.night_allow), 업무활동비:n(w.activity_allow),
                   식대:n(w.meal_allow), 차량유지비:n(w.car_allow),
                   출산보육수당:n(w.childcare_allow), 연구보조비:n(w.research_allow),
                   항목합계:sum, 차이:n(w.monthly_pay)-sum,
                   통상시급:n(w.ordinary_hourly), 최저시급:n(w.min_hourly),
                   변경사유:w.reason||'' };
        });
        // 합계행 — 숫자 열만 더한다
        const NUM=['월급여','기본급','고정연장근로수당','고정휴일근로수당','야간수당','업무활동비',
                   '식대','차량유지비','출산보육수당','연구보조비','항목합계','차이'];
        const tot={ 이름:'합계 '+wageRows.length+'명', 사번:'', 부서:'', 직위:'', 직책:'',
                    입사일:'', 상태:'', 적용시작월:'', 통상시급:'', 최저시급:'', 변경사유:'' };
        NUM.forEach(k=>{ tot[k]=wageRows.reduce((a,r)=>a+(Number(r[k])||0),0); });
        wageRows.push(tot);
        const ws2=XLSX.utils.json_to_sheet(wageRows);
        XLSX.utils.book_append_sheet(wb,ws2,'임금대장');
        const gap=wageRows.filter(r=>r.이름!==tot.이름 && Number(r.차이)!==0).length;
        wageNote=' · 임금대장 시트 '+(wageRows.length-1)+'명 포함'
               + (gap?(' ⚠ 월급여와 항목합이 다른 사람 '+gap+'명'):'');
      }
    }

    const fname=title+'_'+new Date().toISOString().slice(0,10)+'.xlsx';
    // 저장 위치를 직접 고를 수 있는 브라우저(Chrome/Edge 등)에서는 "다른 이름으로 저장" 대화상자를 띄움
    if(window.showSaveFilePicker){
      try{
        const handle=await window.showSaveFilePicker({ suggestedName:fname, types:[{ description:'Excel 파일', accept:{ 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx'] } }] });
        const buf=XLSX.write(wb,{ bookType:'xlsx', type:'array' });
        const writable=await handle.createWritable();
        await writable.write(new Blob([buf],{ type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
        await writable.close();
        flash&&flash('선택한 위치에 엑셀 파일이 저장되었습니다'+wageNote);
        return;
      }catch(e){
        if(e && e.name==='AbortError') return; // 사용자가 저장을 취소함
        // 그 외 오류는 아래 기본 다운로드로 폴백
      }
    }
    // 폴백: 저장 위치 선택을 지원하지 않는 브라우저(Safari·Firefox 등) → 브라우저 기본 다운로드 폴더로 저장
    XLSX.writeFile(wb, fname);
  }
  return (
    <div>
      <div className="flex items-center justify-between mb-3 gap-2 flex-wrap no-print">
        <div className="flex items-center gap-2 flex-wrap">
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="이름/사번/팀 검색" className="inp !w-52" />
          <label className="text-xs text-slate-500 dark:text-slate-400 flex items-center gap-1"><input type="checkbox" checked={showResigned} onChange={e=>setShowResigned(e.target.checked)} /> 퇴사자 포함</label>
          <div className="flex rounded-lg border border-slate-200 dark:border-slate-700 overflow-hidden text-xs">
            <button onClick={()=>setView('general')} className={emergency?"px-3 py-1.5 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/40":"px-3 py-1.5 bg-slate-900 text-white"}>일반</button>
            <button onClick={()=>setView('emergency')} className={emergency?"px-3 py-1.5 bg-slate-900 text-white":"px-3 py-1.5 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/40"}>비상연락망</button>
          </div>
          {canEdit && !emergency && <label className="text-xs text-slate-500 dark:text-slate-400 flex items-center gap-1"><input type="checkbox" checked={showSalary} onChange={e=>setShowSalary(e.target.checked)} /> 급여 표시</label>}
        </div>
        <div className="flex items-center gap-2">
          <button onClick={exportXlsx} className="text-sm px-3 py-1.5 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700">엑셀</button>
          <button onClick={()=>window.print()} className="text-sm px-3 py-1.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700/40">인쇄</button>
          {canEdit && <button onClick={()=>setEdit({ _new:true })} className="text-sm px-3 py-1.5 bg-slate-900 text-white rounded-lg hover:bg-slate-800">+ 직원 추가</button>}
        </div>
      </div>
      <div className="text-sm font-semibold text-slate-700 dark:text-slate-200 mb-2 hidden print:block">{emergency?'비상연락망':'임직원 명부'} ({list.length}명)</div>
      <div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl overflow-hidden print-area">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 dark:bg-slate-900 text-slate-500 dark:text-slate-400 text-xs">
            {emergency ? (
              <tr><th className="text-left px-4 py-2.5">이름</th><th className="text-left px-4 py-2.5">부서</th><th className="text-left px-4 py-2.5">직위</th><th className="text-left px-4 py-2.5">개인 휴대폰</th><th className="text-left px-4 py-2.5">비상연락처</th><th className="text-left px-4 py-2.5">관계</th><th className="text-left px-4 py-2.5">자택주소</th></tr>
            ) : (
              <tr><th className="text-left px-4 py-2.5">이름</th><th className="text-left px-4 py-2.5">사번</th><th className="text-left px-4 py-2.5">팀</th><th className="text-left px-4 py-2.5">직위</th><th className="text-left px-4 py-2.5">입사일</th><th className="text-left px-4 py-2.5">퇴사일 · 계약종료</th><th className="text-left px-4 py-2.5">이메일</th>{showSalary && <th className="text-left px-4 py-2.5">월급여</th>}<th className="text-left px-4 py-2.5">상태</th><th className="px-4 py-2.5 no-print"></th></tr>
            )}
          </thead>
          <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
            {list.map(e=> emergency ? (
              <tr key={e.id} className="hover:bg-slate-50 dark:hover:bg-slate-700/40">
                <td className="px-4 py-2.5 font-medium text-slate-800 dark:text-slate-100">{e.name}</td>
                <td className="px-4 py-2.5 text-slate-600 dark:text-slate-300"><EmpTeamBadge e={e} /></td>
                <td className="px-4 py-2.5 text-slate-600 dark:text-slate-300">{e.position}</td>
                <td className="px-4 py-2.5 text-slate-600 dark:text-slate-300">{e.personal_phone||'-'}</td>
                <td className="px-4 py-2.5 text-slate-600 dark:text-slate-300">{e.emergency_contact||'-'}</td>
                <td className="px-4 py-2.5 text-slate-500 dark:text-slate-400">{e.emergency_relation||'-'}</td>
                <td className="px-4 py-2.5 text-slate-500 dark:text-slate-400">{e.home_address||'-'}</td>
              </tr>
            ) : (
              <tr key={e.id} className={"hover:bg-slate-50 dark:hover:bg-slate-700/40 "+(e.status==='퇴사'?'opacity-50':'')}>
                <td className="px-4 py-2.5 font-medium text-slate-800 dark:text-slate-100">{e.name}{e.status==='퇴사'&&<span className="text-[10px] text-slate-400 dark:text-slate-500 ml-1">(퇴사)</span>}</td>
                <td className="px-4 py-2.5 text-slate-500 dark:text-slate-400">{e.emp_no}</td>
                <td className="px-4 py-2.5 text-slate-600 dark:text-slate-300"><EmpTeamBadge e={e} /></td>
                <td className="px-4 py-2.5 text-slate-600 dark:text-slate-300">{e.position}</td>
                <td className="px-4 py-2.5 text-slate-500 dark:text-slate-400">{fmtDate(e.join_date)}</td>
                <td className="px-4 py-2.5"><LastDayCell e={e} /></td>
                <td className="px-4 py-2.5 text-slate-500 dark:text-slate-400">{e.email}</td>
                {showSalary && <td className="px-4 py-2.5 text-slate-700 dark:text-slate-200">{e.monthly_pay?Number(e.monthly_pay).toLocaleString():'-'}</td>}
                <td className="px-4 py-2.5 text-slate-500 dark:text-slate-400"><StatusCell e={e} /></td>
                <td className="px-4 py-2.5 text-right no-print">{canEdit && <button onClick={()=>setEdit(e)} className="text-xs text-indigo-600 hover:text-indigo-800">수정</button>}</td>
              </tr>
            ))}
            {list.length===0 && <tr><td colSpan="10" className="px-4 py-8 text-center text-slate-300 dark:text-slate-600">해당 직원이 없습니다</td></tr>}
          </tbody>
        </table>
      </div>
      {edit && <EmpEditModal e={edit} groups={groups} orders={orders} emps={emps} payAdmin={payAdmin} reload={reload} setBusy={setBusy} flash={flash} setErr={setErr} onClose={()=>setEdit(null)} />}
    </div>
  );

// ══════════════════════════════════════════════════════════════════════
//  직원 등록·수정 모달 — 4탭 구조 (2026-08-03)
//   ① 기본정보      → employees
//   ② 근로계약정보  → employee_contracts
//   ③ 임금정보      → employee_pay_base   (적용시작월 단위 버전)
//   ④ 민감정보      → employee_private    (급여 관리자만 · RPC 경유 · 암호화)
//  저장 버튼 한 번으로 4개 탭이 함께 저장된다.
// ══════════════════════════════════════════════════════════════════════
function nowYM(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
// 'YYYY-MM' 의 다음 달
function nextYM(ym){
  const m=/^(\d{4})-(\d{2})$/.exec(String(ym||'')); if(!m) return nowYM();
  let y=Number(m[1]), mo=Number(m[2])+1;
  if(mo>12){ mo=1; y++; }
  return y+'-'+String(mo).padStart(2,'0');
}
function EMPTY_C(no){ return { emp_no:no||'', ei_enrolled:'Y', job_desc:'', work_days_per_week:'주 5일',
  weekly_holiday:'일', weekday_hours:'09:00~18:00', break_time:'', saturday_type:'',
  contract_hours_note:'1일 8시간, 1주 40시간', work_note:'', wage_contract_term:'',
  contract_start_date:'', contract_end_date:'', probation_end_date:'', pay_include:'Y',
  dependents:1, children_7_20:0, tax_exempt:'N', withhold_rate:'',
  base_hours:209, fixed_ot_hours:0, fixed_hol_hours:0, night_hours:0 }; }
function EMPTY_W(no){ return { emp_no:no||'', apply_month:nowYM(), change_type:'신규',
  monthly_pay:'', base_salary:'', fixed_ot:'', fixed_holiday:'', night_allow:'', activity_allow:'',
  meal_allow:'', car_allow:'', childcare_allow:'', research_allow:'',
  ordinary_hourly:'', min_hourly:'', reason:'' }; }
const _num=v=>Number(String(v==null?'':v).replace(/[^0-9.\-]/g,''))||0;
const _won=v=>(v===''||v==null)?'':Number(_num(v)).toLocaleString('ko-KR');

// 한글·점·슬래시 날짜를 YYYY-MM-DD 로 정규화
//   '2021년 11월 12일' · '2021.11.12' · '2021/11/12' → '2021-11-12'
function normDate(v){
  if(v===null||v===undefined) return '';
  var s=String(v).trim(); if(!s) return '';
  var m=s.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  if(m) return m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0');
  return s;
}

// 입사일로부터 N개월이 되는 날의 전일 (수습기간 종료일 산정)
function addMonthsEnd(d, m){
  if(!d) return '';
  const s=String(d).slice(0,10);
  const p=s.split('-'); if(p.length!==3) return '';
  const t=new Date(Number(p[0]), Number(p[1])-1+m, Number(p[2]));
  if(isNaN(t)) return '';
  t.setDate(t.getDate()-1);
  return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
}

// ── 월급여 → 임금 항목 분해 ──────────────────────────────────────────
//  ⚠ 엑셀 「데모 급여계산본」 임금대장과 1원 단위로 일치하도록 맞춘 식이다.
//    GAS calcWageFromMonthly 는 최저시급을 (과세대상 ÷ 총시간) 으로 계산했는데
//    엑셀은 (기본급 ÷ 기본근로시간) 이다. 엑셀을 정답으로 삼는다.
//    · 통상시급 = (월급여 − 차량유지비 − 출산보육수당) ÷ (기본 + 연장×1.5 + 야간×0.5 + 휴일×1.5)
//    · 연장·야간·휴일수당 = 시간 × 통상시급 × 배수, 반올림
//    · 기본급 = 월급여 − 반올림한 수당 − 비과세 − 업무활동비  (나머지로 총액을 정확히 맞춘다)
//    · 최저시급 = 기본급 ÷ 기본근로시간
//  검증 : 장우석·전재원·이미정·신상열·김덕기 5건 엑셀과 전건 일치
function splitWage(monthly, baseH, fixOT, fixHol, ngtH, car, child, meal, act, res){
  const taxable = monthly - car - child;
  const totalH  = baseH + fixOT*1.5 + ngtH*0.5 + fixHol*1.5;
  const wage    = totalH>0 ? taxable/totalH : 0;
  const otPay   = Math.round(fixOT *wage*1.5);
  const ngtPay  = Math.round(ngtH  *wage*0.5);
  const holPay  = Math.round(fixHol*wage*1.5);
  const basic   = monthly - otPay - ngtPay - holPay - car - child - meal - act - res;
  const minW    = baseH>0 ? Math.round(basic/baseH) : 0;
  return { ordinary_hourly:Math.round(wage), min_hourly:minW, base_salary:basic,
           fixed_ot:otPay, fixed_holiday:holPay, night_allow:ngtPay };
}

// ══════════════════════════════════════════════════════════════════════
//  「퇴사일 · 계약종료」 / 「상태」 칸  (2026-08-05)
//
//  ▣ 두 날짜는 다른 개념이다 — 합치면 안 된다
//     · employees.last_work_day        = 발령으로 확정된 실제 퇴사일 (SSOT)
//     · employee_contracts.contract_end_date = 계약서상 만료 예정일
//     계약종료일을 퇴사일 칸에 그대로 써 버리면, 아직 퇴사 발령이 나지 않은
//     사람이 퇴사자로 보이고 급여·조직도가 어긋난다.
//     그래서 「예정」임을 분명히 구분해 함께 보여주기만 한다.
//
//  ▣ 급여는 이미 계약종료일을 본다
//     payroll 의 ledgerScope·getProratedPreview 가
//     (last_work_day || 근로계약종료일) 로 판단하므로 급여 제외는 정상 동작한다.
// ══════════════════════════════════════════════════════════════════════
function _today10(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
// 계약종료 상태 : '' | 'soon'(오늘 이후 · 예정) | 'past'(오늘 지남 · 퇴사 처리 필요)
function contractEndState(e){
  const ce=e && e.contract_end_date ? String(e.contract_end_date).slice(0,10) : '';
  if(!ce) return { ce:'', kind:'' };
  if(e.last_work_day) return { ce:ce, kind:'done' };      // 이미 퇴사 확정됨
  if(e.status==='퇴사') return { ce:ce, kind:'done' };
  return { ce:ce, kind: ce < _today10() ? 'past' : 'soon' };
}

function LastDayCell({ e }){
  const { ce, kind }=contractEndState(e);
  if(e.last_work_day){
    return (
      <div>

  // 「없음」도 정보다 — 대비를 기준(4.5:1) 이상으로 맞춘다
  if(!ce) return <span className="text-slate-500 dark:text-slate-400">-</span>;
  // 퇴사 확정 전 — 계약종료일만 있는 상태
  const past=kind==='past';
  return (
    <div title={past
        ? '근로계약 종료일이 지났는데 퇴사 처리가 되어 있지 않습니다. 「발령 관리 → 발령 등록 → 퇴사」에서 처리하세요.'
        : '근로계약서상 만료 예정일입니다. 실제 퇴사일은 「발령 관리 → 퇴사」로 확정됩니다.'}>
      <span className={past
        ? 'text-rose-700 dark:text-rose-300 font-semibold'
        : 'text-amber-700 dark:text-amber-300 font-semibold'}>{ce}</span>
      <span className={'block text-[10.5px] mt-0.5 '+(past
        ? 'text-rose-700 dark:text-rose-300 font-bold'
        : 'text-amber-700 dark:text-amber-400')}>

      </span>
    </div>
  );
}

// DB 오류 메시지를 담당자가 이해할 수 있는 문장으로 바꾼다. (2026-08-17)
//  「duplicate key value violates unique constraint "employees_email_key"」 같은
//  원문만 보여주면 무엇을 고쳐야 할지 알 수 없다.
function _saveErrMsg(where, err){
  var m=String((err&&err.message)||err||'');
  if(/duplicate key/i.test(m)){
    if(/employees_email_key/i.test(m))
      return where+' 저장 실패 — 같은 이메일을 쓰는 직원이 이미 있습니다.\n'
        +'이메일을 비우거나 다른 주소로 바꿔 주세요. (회사 메일이 없으면 비워 두시면 됩니다)';
    if(/employees_emp_no_key/i.test(m))
      return where+' 저장 실패 — 같은 사번을 쓰는 직원이 이미 있습니다. 사번을 확인해 주세요.';
    var f=/unique constraint "([^"]+)"/i.exec(m);
    return where+' 저장 실패 — 이미 같은 값을 쓰는 직원이 있습니다'+(f?(' ('+f[1]+')'):'')+'.';
  }
  if(/violates foreign key/i.test(m))
    return where+' 저장 실패 — 연결된 조직·상사 정보가 없습니다. 조직도에서 먼저 등록해 주세요.';
  if(/violates not-null/i.test(m)){
    var c=/column "([^"]+)"/i.exec(m);
    return where+' 저장 실패 — 필수 항목이 비어 있습니다'+(c?(' ('+c[1]+')'):'')+'.';
  }
  if(/permission denied|row-level security/i.test(m))
    return where+' 저장 실패 — 수정 권한이 없습니다. 관리자에게 문의하세요.';
  return where+' 저장 실패 — '+m;
}

        if(wMode==='new' && wHist.some(h=>String(h.apply_month)===String(w.apply_month)))
          throw new Error('적용시작월 '+w.apply_month+' 이력이 이미 있습니다.\n\n「기존 기준 수정」으로 바꾸거나 다른 적용월을 쓰세요.');
        // ── 원 단위 정수화 (2026-08-05) ──────────────────────────────
        //  GAS 직원마스터 이관본에 소수점이 남아 있었다
        //  (예: 기본급 4,054,933.921 · 고정연장 312,555.066 · 통상시급 20,837.004).
        //  급여 시스템이 이 값을 더하면 부동소수점 오차로 지급합계가
        //  2,004,999.99999999977 처럼 되어 실지급액 끝자리가 999 로 틀어졌다.
        //  임금은 원 단위이므로 저장할 때 정수로 맞춘다.
        //  반올림 잔차는 기본급이 흡수해 「항목 합계 = 월급여」를 정확히 유지한다.
        //  단, 원래부터 합계가 맞지 않던 경우(합계 차이 ⚠)는 담당자의 의도이므로
        //  잔차를 옮기지 않고 각 항목만 반올림한다.
        const _i=v=>Math.round(_num(v));
        const wMonthlyI=_i(w.monthly_pay);
        const wOth={ fixed_ot:_i(w.fixed_ot), fixed_holiday:_i(w.fixed_holiday),
          night_allow:_i(w.night_allow), activity_allow:_i(w.activity_allow),
          meal_allow:_i(w.meal_allow), car_allow:_i(w.car_allow),
          childcare_allow:_i(w.childcare_allow), research_allow:_i(w.research_allow) };
        const wOthSum=Object.keys(wOth).reduce((a,k)=>a+wOth[k],0);
        const wWasBalanced=Math.abs(_num(w.monthly_pay)-wSum)<0.5;   // 반올림 전에 맞았는지
        const wBaseI=wWasBalanced ? (wMonthlyI-wOthSum) : _i(w.base_salary);
        const wPay=Object.assign({ emp_no:no, apply_month:w.apply_month,
          change_type:w.change_type||'변경',
          monthly_pay:wMonthlyI, base_salary:wBaseI,
          ordinary_hourly:_i(w.ordinary_hourly)||null, min_hourly:_i(w.min_hourly)||null,
          reason:w.reason||null, created_by:'e-HR' }, wOth);
        const rw=await sb.from('employee_pay_base').upsert(wPay,{ onConflict:'emp_no,apply_month' });
        if(rw.error) throw new Error('임금기준 저장 실패 — '+rw.error.message);
        wSaved=true;
      }

      // ④ 민감정보 — 입력된 항목만 (빈칸은 기존 값 유지)
      const anyPv=['rrn','bank','acct','birth','child_birth'].some(k=>String(pvIn[k]||'').trim());
      if(anyPv){
        if(!payAdmin) throw new Error('민감정보 저장은 급여 관리자만 가능합니다. (user_roles 에 app=payroll 권한 필요)');
        const rp=await sb.rpc('hr_save_private',{
          p_emp_no:no,
          p_rrn:  pvIn.rrn.trim()||null,
          p_bank: pvIn.bank.trim()||null,
          p_acct: pvIn.acct.trim()||null,
          p_birth:pvIn.birth||null,
          p_child:normDate(pvIn.child_birth)||null });
        if(rp.error) throw new Error('민감정보 저장 실패 — '+rp.error.message);
        pvSaved=true;
      }

      setBusy(false);
      await reload();
      if(closeAfter){ await uiAlert('저장되었습니다.'); onClose(); return; }
      flash('저장되었습니다.');
      const t=new Date();
      const hasPv=!!(pv && (pv.has_rrn || pv.has_acct));
      say('ok','저장되었습니다 — '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')+':'+String(t.getSeconds()).padStart(2,'0')
            +'\n반영 : 기본정보'+(cSaved?' · 근로계약':'')+(wSaved?' · 임금':'')+(pvSaved?' · 민감정보(암호화)':'')
            +((!pvSaved && payAdmin && !hasPv) ? '\n\n⚠ 민감정보는 입력한 값이 없어 저장되지 않았습니다. 민감정보 탭의 「새로 입력·변경」 칸에 주민번호·은행명·계좌번호를 채운 뒤 다시 저장하세요.' : ''));
      await reloadChild();
    }catch(ex){
      setBusy(false);
      say('err', String(ex.message||ex));
      setErr(String(ex.message||ex));
      uiAlert(String(ex.message||ex));
    }
  }

  const TABS=[['basic','기본정보'],['contract','근로계약'],['wage','임금']]
             .concat(payAdmin?[['private','민감정보']]:[]);
  const tabBtn=k=>"px-3.5 py-2 text-[13px] rounded-lg font-bold transition border "+
    (tab===k ? "bg-slate-900 dark:bg-indigo-600 text-white border-slate-900 dark:border-indigo-600"

  return (
    <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">

        {/* 상단 고정 — 스크롤을 내려도 제목·탭이 항상 보인다 (2026-08-05) */}
        <div className="sticky top-0 z-20 -mt-5 -mx-5 px-5 pt-5 pb-3 mb-4

        </div>

          <Field label="소속 조직">

                {curG
                  ? <><span style={{background:colorForGroup(curG),width:12,height:12,borderRadius:3,display:'inline-block',flex:'0 0 auto',border:'1px solid rgba(0,0,0,.15)'}} /><span className="text-sm text-slate-700 dark:text-slate-200 truncate">{curG.name}</span></>
                  : <span className="text-xs text-slate-400 dark:text-slate-500">{f.team||'소속 조직을 선택하면 자동으로 채워집니다'}</span>}
              </div>
            </Field>
            <p className="text-[11px] text-slate-400 dark:text-slate-500 mt-1">조직도 카드 <b>색상은 개인이 아니라 조직의 속성</b>입니다. 색을 바꾸려면 <b>조직도 관리 → 조직 편집</b> 또는 <b>발령 관리 → 팀 명칭·색상 변경</b>에서 조직 단위로 변경하세요.</p>
          </div>

          <Field label="개인 휴대폰"><input value={f.personal_phone} onChange={ev=>set('personal_phone',ev.target.value)} className="inp" /></Field>

          <Field label="겸직 표기"><input value={f.concurrent_note} onChange={ev=>set('concurrent_note',ev.target.value)} className="inp" /></Field>
          <div className="col-span-2"><Field label="자택주소"><input value={f.home_address} onChange={ev=>set('home_address',ev.target.value)} className="inp" /></Field></div>
          <div className="col-span-2"><Field label="학력"><input value={f.education} onChange={ev=>set('education',ev.target.value)} className="inp" /></Field></div>
          <div className="col-span-2"><Field label="주요경력"><input value={f.career} onChange={ev=>set('career',ev.target.value)} className="inp" /></Field></div>
          <div className="col-span-2"><Field label="핵심역량"><input value={f.skill} onChange={ev=>set('skill',ev.target.value)} className="inp" /></Field></div>
          <div className="col-span-2 text-[11px] text-slate-500 dark:text-slate-400 rounded-lg bg-slate-50 dark:bg-slate-900/40 border border-slate-200 dark:border-slate-700 px-3 py-2">
            월급여는 <b>임금 탭</b>에서 관리합니다. 여기 저장하면 급여 시스템의 임금기준으로 함께 반영됩니다.
          </div>
        </div>}

        {/* ───────── ② 근로계약 ───────── */}
        {!loading && tab==='contract' && <div className="grid grid-cols-2 gap-3">
          <div className="col-span-2 text-[11px] text-slate-600 dark:text-slate-300 rounded-lg bg-indigo-50 dark:bg-indigo-950/40 border border-indigo-100 dark:border-indigo-900 px-3 py-2 leading-relaxed">
            아래 <b>「근로계약서 · 임금대장 항목」</b>은 엑셀 임금대장의 컬럼과 순서·이름이 같습니다.
            그 아래 <b>「급여 계산 추가 항목」</b>은 임금대장에는 없지만 <b>소득세·4대보험 계산과 급여대장 생성에 반드시 필요한 값</b>으로,
            기존 GAS 직원마스터에서 관리하던 것입니다.
          </div>

          <div className="col-span-2 flex items-center justify-between gap-2 pt-1">
            <div className="text-xs font-bold text-slate-500 dark:text-slate-400">근로계약서 · 임금대장 항목</div>
            <button onClick={applyJoinDates} className="text-[11px] px-2.5 py-1 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 font-bold whitespace-nowrap">
              입사일 기준으로 계약 날짜 채우기
            </button>
          </div>

          <div className="col-span-2"><Field label="업무"><input value={c.job_desc||''} onChange={ev=>setC2('job_desc',ev.target.value)} className="inp" placeholder="예: 국내외 영업 마케팅 고객관리 등과 관련 통상수행되는 모든 업무" /></Field></div>
          <Field label="주당 근무일수"><input value={c.work_days_per_week||''} onChange={ev=>setC2('work_days_per_week',ev.target.value)} className="inp" placeholder="주 5일" /></Field>
          <Field label="주휴일"><input value={c.weekly_holiday||''} onChange={ev=>setC2('weekly_holiday',ev.target.value)} className="inp" placeholder="일" /></Field>
          <Field label="평일 근무시간"><input value={c.weekday_hours||''} onChange={ev=>setC2('weekday_hours',ev.target.value)} className="inp" placeholder="09:00~18:00" /></Field>

          <Field label="소정근로시간"><input value={c.contract_hours_note||''} onChange={ev=>setC2('contract_hours_note',ev.target.value)} className="inp" placeholder="1일 8시간, 1주 40시간" /></Field>
          <div className="col-span-2"><Field label="근로시간 특이사항"><input value={c.work_note||''} onChange={ev=>setC2('work_note',ev.target.value)} className="inp" placeholder="근로일 및 근로시간, 업무의 범위는 회사의 운영현황 및 대표자의 결정에 따라 변경될 수 있으며, 근로자는 이에 동의한다." /></Field></div>

            <p className="text-[11px] text-slate-400 dark:text-slate-500 mt-1">임금대장과 동일하게 <b>시작일 한 날짜</b>입니다. 기본값은 입사일.</p>

            <div>
              <Field label="근로계약 종료일"><input type="date" value={c.contract_end_date||''} onChange={ev=>setC2('contract_end_date',ev.target.value)} className="inp" /></Field>

                계약서상 <b>만료 예정일</b>입니다. 급여는 이 날짜 이후를 자동 제외합니다.

              </p>
            </div>
            <p className="text-[11px] text-slate-400 dark:text-slate-500 mt-1">기간의 정함이 없으면 <b>비워두세요.</b> 정규직 무기계약은 공백이 정상입니다.</p>
          </div>

          <div className="col-span-2 mt-2 pt-2 border-t border-slate-200 dark:border-slate-700 text-xs font-bold text-slate-500 dark:text-slate-400">급여 계산 추가 항목 <span className="font-normal text-slate-400 dark:text-slate-500">(임금대장에는 없으나 계산에 필요)</span></div>
          <div>
            <Field label="수습기간 종료일"><input type="date" value={c.probation_end_date||''} onChange={ev=>setC2('probation_end_date',ev.target.value)} className="inp" /></Field>
            <p className="text-[11px] text-slate-400 dark:text-slate-500 mt-1">입사일 <b>+3개월이 되는 날의 전일</b>로 자동 계산됩니다{f.join_date?(' (입사 '+String(f.join_date).slice(0,10)+' → '+addMonthsEnd(f.join_date,3)+')'):''}. 다르면 직접 수정하세요.</p>
          </div>
          <Field label="근로계약 시작일 (= 입사일)"><input type="date" value={c.contract_start_date||''} onChange={ev=>setC2('contract_start_date',ev.target.value)} className="inp" /></Field>
          <Field label="부양가족수 (본인 포함)"><input type="number" min="1" value={c.dependents} onChange={ev=>setC2('dependents',ev.target.value)} className="inp" /></Field>
          <Field label="자녀수 (7~20세)"><input type="number" min="0" value={c.children_7_20} onChange={ev=>setC2('children_7_20',ev.target.value)} className="inp" /></Field>
          <Field label="고용보험 가입">
            <select value={c.ei_enrolled||'Y'} onChange={ev=>setC2('ei_enrolled',ev.target.value)} className="inp"><option value="Y">가입</option><option value="N">미가입</option></select>
          </Field>
          <Field label="소득세 면제">
            <select value={c.tax_exempt||'N'} onChange={ev=>setC2('tax_exempt',ev.target.value)} className="inp"><option value="N">해당없음</option><option value="Y">면제</option></select>
          </Field>
          <div>
            <Field label="소득세 원천징수 비율">
              <select value={(function(){var v=_num(c.withhold_rate); return (v===80||v===120)?String(v):'100';})()}
                onChange={ev=>setC2('withhold_rate',ev.target.value)} className="inp">
                <option value="80">80% (적게 내고 연말정산 때 더 냄)</option>

              간이세액표 금액의 <b>몇 %를 매월 원천징수할지</b> 근로자가 고르는 항목입니다. 대부분 <b>100%</b>.
              현장실습생·인턴은 소득세가 0원, 외부연구원은 지급합계의 8%로 별도 계산되어 이 값과 무관합니다.

          </div>
          <div>
            <Field label="급여 지급 포함">
              <select value={c.pay_include||'Y'} onChange={ev=>setC2('pay_include',ev.target.value)} className="inp">
                <option value="Y">포함 (정상 지급)</option><option value="N">제외 (무급휴직 등)</option>

                </tbody>
              </table>
            </div>
          </div>}
        </div>}

            <span className={"text-[11px] px-2 py-0.5 rounded font-bold "+(payAdmin

                {grant
                  ? (grant.allowed
                      ? ('열람 권한 있음 · 만료 '+String(grant.expires_at||'').slice(0,16).replace('T',' ')+' · 부여자 '+(grant.granted_by||'')+' · 열람 '+(grant.uses||0)+'회')
                      : '열람 권한이 없습니다 — 다른 급여 관리자가 [권한 관리] 탭에서 부여해야 평문을 볼 수 있습니다.')
                  : '권한 상태를 확인할 수 없습니다.'}
              </p>
            </div>
          </div>

          <div className="grid grid-cols-2 gap-3 pt-3 border-t border-slate-200 dark:border-slate-700">
            <div className="col-span-2 text-xs font-bold text-slate-500 dark:text-slate-400">새로 입력·변경 <span className="font-normal text-slate-400 dark:text-slate-500">(빈칸은 기존 값을 그대로 유지합니다)</span></div>
            <Field label="주민등록번호"><input value={pvIn.rrn} onChange={ev=>setP2('rrn',ev.target.value)} className="inp font-mono" placeholder="000000-0000000" autoComplete="off" /></Field>
            <Field label="생년월일"><input type="date" value={pvIn.birth} onChange={ev=>setP2('birth',ev.target.value)} className="inp" /></Field>
            <Field label="은행명"><input value={pvIn.bank} onChange={ev=>setP2('bank',ev.target.value)} className="inp" placeholder="예: 국민은행" /></Field>
            <Field label="계좌번호"><input value={pvIn.acct} onChange={ev=>setP2('acct',ev.target.value)} className="inp font-mono" placeholder="숫자만 또는 하이픈 포함" autoComplete="off" /></Field>
            <div>
              <Field label="보육수당 자녀 생년월일"><input type="date" value={/^\d{4}-\d{2}-\d{2}$/.test(pvIn.child_birth)?pvIn.child_birth:''} onChange={ev=>setP2('child_birth',ev.target.value)} className="inp" /></Field>
              <p className="text-[11px] text-slate-400 dark:text-slate-500 mt-1">6세 이하 <b>출산·보육수당 비과세 판정</b>에 쓰이므로 날짜로 저장됩니다. 해당 없으면 비워두세요.</p>
            </div>
          </div>
        </div>}

        <div className="sticky bottom-0 -mx-5 px-5 pb-1 pt-3 mt-5 bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700">
        {msg && <div className={"mb-2.5 rounded-xl px-3.5 py-2.5 text-[12.5px] font-bold flex items-start gap-2 border-2 "+(msg.kind==='ok'
          ? "border-emerald-400 dark:border-emerald-600 bg-emerald-50 dark:bg-emerald-950/50 text-emerald-800 dark:text-emerald-200"
          : "border-rose-400 dark:border-rose-600 bg-rose-50 dark:bg-rose-950/50 text-rose-800 dark:text-rose-200")}>
          <span className="shrink-0">{msg.kind==='ok'?'✅':'⚠'}</span>
          <span className="whitespace-pre-wrap flex-1">{msg.text}</span>
          <button onClick={()=>setMsg(null)} className="shrink-0 opacity-60 hover:opacity-100">✕</button>
        </div>}
        {/* 하단 고정 — 긴 탭에서도 저장 버튼을 찾아 올라갈 필요가 없다 */}
        <div className="sticky bottom-0 z-20 -mb-5 -mx-5 px-5 pt-3 pb-5 mt-4
                        flex justify-between items-center gap-2
                        bg-white dark:bg-slate-800
                        border-t border-slate-200 dark:border-slate-700">
          <span className="text-[11px] text-slate-400 dark:text-slate-500">「저장 (계속 입력)」은 창을 닫지 않고 {TABS.length}개 탭을 함께 반영합니다</span>
          <div className="flex gap-2">
            <button onClick={onClose} className="px-4 py-2 text-sm text-slate-600 dark:text-slate-300 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">닫기</button>
            <button onClick={()=>save(false)} className={"px-4 py-2 text-sm rounded-lg font-bold border transition "+(msg&&msg.kind==='ok'
              ? "bg-emerald-600 border-emerald-600 text-white"
              : "bg-white dark:bg-slate-700 border-slate-300 dark:border-slate-500 text-slate-700 dark:text-slate-100 hover:bg-slate-50 dark:hover:bg-slate-600")}>{(msg&&msg.kind==='ok')?'저장됨 ✓ 계속 입력':'저장 (계속 입력)'}</button>
            <button onClick={()=>save(true)} className="px-4 py-2 text-sm bg-slate-900 dark:bg-indigo-600 text-white rounded-lg hover:bg-slate-800 dark:hover:bg-indigo-700 font-bold">저장 후 닫기</button>
          </div>
        </div>
        </div>
      </div>
    </div>
  );
}

function Field({ label, children }){
  return <label className="block"><span className="text-xs font-medium text-slate-600 dark:text-slate-300">{label}</span><div className="mt-1">{children}</div></label>;
}

// inp 공통 스타일 주입
const st=document.createElement('style');
st.textContent=''
 +'.inp{width:100%;padding:.5rem .625rem;border:1px solid #cbd5e1;border-radius:.5rem;font-size:.8125rem;outline:none;background:#fff;color:#0f172a}'
 +'.inp::placeholder{color:#94a3b8}'
 +'.inp:focus{border-color:#0f172a;box-shadow:0 0 0 1px #0f172a}'
 +'.dark .inp{background:#1e293b;color:#f1f5f9;border-color:#475569}'
 +'.dark .inp::placeholder{color:#64748b}'
 +'.dark .inp:focus{border-color:#818cf8;box-shadow:0 0 0 1px #818cf8}'
 +'.dark .inp option{background:#1e293b;color:#f1f5f9}'
 +'input[type=date].inp::-webkit-calendar-picker-indicator{cursor:pointer}'
 +'.dark input[type=date].inp::-webkit-calendar-picker-indicator{filter:invert(1) opacity(.7)}';
document.head.appendChild(st);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
