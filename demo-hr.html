function applyPendingToData(emps, groups, assigns, orders){
  var E=(emps||[]).map(function(e){ return Object.assign({}, e); });
  var G=(groups||[]).map(function(g){ return Object.assign({}, g); });
  var A=(assigns||[]).map(function(a){ return Object.assign({}, a); });
  var eById={}; E.forEach(function(e){ eById[e.id]=e; });
  var gById={}; G.forEach(function(g){ gById[g.id]=g; });
  // 시행 순서대로 정렬(신설→명칭→전보→…→폐지). falsy-zero 안전 처리.
  function seqOf(t){ return (APPLY_SEQ[t]==null)?8:APPLY_SEQ[t]; }
  var pend=(orders||[]).filter(isPendingOrder).slice().sort(function(x,y){ return seqOf(x.order_type)-seqOf(y.order_type) || String(effOf(x)).localeCompare(String(effOf(y))); });
  pend.forEach(function(o){
    var d=o.detail||{}, a=d.after||{}, b=d.before||{}, t=o.order_type, e=o.employee_id?eById[o.employee_id]:null;
    function _teamFor(gid, fb){ var tg=gById[gid]; return tg?(tg.name||''):(isHexColor(fb)?'':(fb||'')); }
    if(t==='hire'){ if(e){ if(a.group_id!=null) e.group_id=a.group_id; if(a.team!=null||a.group_id) e.team=_teamFor(a.group_id,a.team); if(a.position) e.position=a.position; if(a.rank) e.rank=a.rank; } }
    else if(t==='transfer'){ if(e){ if(a.group_id) e.group_id=a.group_id; if(a.team!=null||a.group_id) e.team=_teamFor(a.group_id,a.team); } }
    else if(t==='promotion'||t==='demotion'||t==='job_change'){ if(e){ if(a.position) e.position=a.position; if(a.rank) e.rank=a.rank; } }
    else if(t==='leave'){ if(e) e.status='휴직'; }
    else if(t==='return'){ if(e) e.status='재직'; }
    else if(t==='resign'){ if(e){ e.status='퇴사'; e.last_work_day=effOf(o); } }
    else if(t==='concurrent'){ var cg=d.group_id||gidByName(G,d.group); if(cg&&e) A.push({ id:'tmp_'+o.id, employee_id:e.id, group_id:cg, position:d.position||null, rank:d.rank||null, display:(d.display==='SUB'?'SUB':'MEMBER') }); }
    else if(t==='concurrent_end'){ var eg=d.group_id||gidByName(G,d.group); if(eg&&e){ A=A.filter(function(x){ return !(x.employee_id===e.id && x.group_id===eg); }); } }
    else if(t==='org_create'){ if(d.id){
      var ng=gById[d.id];
      if(!ng){ ng={ id:d.id, name:a.name||o.person_name, subtitle:a.subtitle||'', parent_id:a.parent_id||null, team:a.team||'', is_staff:!!a.is_staff, staff_side:a.staff_side||null }; G.push(ng); gById[d.id]=ng; }
      // 신설 조직 행은 등록 시 이미 만들어져 있으므로, 발령 이력에서 수정한 내용(팀 라벨·부제·상위 등)을 미리보기에도 반영
      // ⚠ 발령에 값이 비어 있으면 덮어쓰지 않는다.
      //   (조직도 관리에서 직접 입력한 부제·팀라벨이 빈 발령값에 지워지던 문제)
      else { if(a.name) ng.name=a.name; if(a.subtitle) ng.subtitle=a.subtitle; if(a.parent_id) ng.parent_id=a.parent_id; if(a.team) ng.team=a.team; if(a.is_staff!==undefined) ng.is_staff=!!a.is_staff; if(a.staff_side) ng.staff_side=a.staff_side; }
    } }
    else if(t==='org_edit'){ if(d.id && gById[d.id]){ var gg=gById[d.id]; if(a.name) gg.name=a.name; if(a.parent_id) gg.parent_id=a.parent_id; if(a.subtitle) gg.subtitle=a.subtitle; if(a.team) gg.team=a.team; if(a.is_staff!==undefined) gg.is_staff=!!a.is_staff; if(a.staff_side) gg.staff_side=a.staff_side; } }
    else if(t==='org_delete'){ if(d.id){ G=G.filter(function(g){ return g.id!==d.id; }); delete gById[d.id]; } }
  });
  return { emps:E, groups:G, assigns:A };
}

// ── 조직 삭제 전 실시간 안전 확인 (프론트 상태가 낡아도 FK 오류 대신 명확한 안내) ──
async function safeDeleteOrg(gid){
  // 재직 인원 · 하위 조직이 있으면 차단
  var mem=await sb.from('employees').select('id,name,status').eq('group_id',gid).neq('status','퇴사');
  if(mem.error) return { error:mem.error };
  var kid=await sb.from('org_groups').select('id').eq('parent_id',gid);
  if(kid.error) return { error:kid.error };
  var memN=(mem.data||[]).length, kidN=(kid.data||[]).length;
  if(memN>0||kidN>0){
    var names=(mem.data||[]).slice(0,5).map(function(e){ return e.name; }).join(', ');
    return { blocked:true, memN:memN, kidN:kidN,
      message:'이 조직에는 아직 '+(memN>0?('소속 인원 '+memN+'명'+(names?(' ('+names+(memN>5?' 외':'')+')'):'')):'')+(memN>0&&kidN>0?' 및 ':'')+(kidN>0?('하위 조직 '+kidN+'개'):'')+'이(가) 남아 있어 폐지할 수 없습니다.\n먼저 전보 발령으로 인원을 다른 조직으로 옮기거나 하위 조직을 정리한 뒤 폐지하세요.' };
  }
  // 재직자는 없지만 퇴사자가 이 조직을 참조하면 FK 제약에 걸리므로, 퇴사자의 소속을 먼저 비움(이력은 발령 기록에 남음)
  var former=await sb.from('employees').select('id').eq('group_id',gid);
  if(former.error) return { error:former.error };
  if((former.data||[]).length>0){
    var clr=await sb.from('employees').update({ group_id:null }).eq('group_id',gid);
    if(clr.error) return { error:clr.error };
  }
  var del=await sb.from('org_groups').delete().eq('id',gid);
  return del.error ? { error:del.error } : { ok:true };
}

// ── 발령 1건을 실제 인사정보에 반영 ──
async function applyOrderNow(o, ctx){
  ctx=ctx||{}; var d=o.detail||{}, a=d.after||{}, t=o.order_type, res={error:null}, note='';
  // 직원의 팀 표기는 '배치 조직명'이 정답. 옛 발령에는 조직 색상(hex)이나 빈값이 담겨 있을 수 있어 여기서 다시 계산한다.
  function teamFor(gid, fb){ var g=(ctx.groups||[]).find(function(x){ return x.id===gid; }); return g?(g.name||''):(isHexColor(fb)?'':(fb||'')); }
  if(t==='hire'){
    var hp={}; if(a.group_id) hp.group_id=a.group_id; if(a.team!=null||a.group_id) hp.team=teamFor(a.group_id,a.team); if(a.position) hp.position=a.position; if(a.rank) hp.rank=a.rank;
    if(o.employee_id && Object.keys(hp).length) res=await sb.from('employees').update(hp).eq('id',o.employee_id);
  } else if(t==='transfer'){
    var patch={}; if(a.group_id) patch.group_id=a.group_id; if(a.team!=null||a.group_id) patch.team=teamFor(a.group_id,a.team);
    if(o.employee_id && Object.keys(patch).length) res=await sb.from('employees').update(patch).eq('id',o.employee_id);
  } else if(t==='promotion'||t==='demotion'||t==='job_change'){
    var p={}; if(a.position) p.position=a.position; if(a.rank) p.rank=a.rank;
    if(o.employee_id && Object.keys(p).length) res=await sb.from('employees').update(p).eq('id',o.employee_id);
  } else if(t==='leave'){
    if(o.employee_id) res=await sb.from('employees').update({ status:'휴직' }).eq('id',o.employee_id);
  } else if(t==='return'){
    if(o.employee_id) res=await sb.from('employees').update({ status:'재직' }).eq('id',o.employee_id);
  } else if(t==='resign'){
    if(o.employee_id) res=await sb.from('employees').update({ status:'퇴사', last_work_day:effOf(o) }).eq('id',o.employee_id);
  } else if(t==='concurrent'){
    var cg=d.group_id||gidByName(ctx.groups,d.group);
    if(cg && o.employee_id) res=await sb.from('employee_assignments').upsert({ employee_id:o.employee_id, group_id:cg, position:d.position||null, rank:d.rank||null, display:(d.display==='SUB'?'SUB':'MEMBER') },{ onConflict:'employee_id,group_id' });
    else note='겸직 조직을 찾을 수 없어 건너뜀';
  } else if(t==='concurrent_end'){
    var eg=d.group_id||gidByName(ctx.groups,d.group);
    if(eg && o.employee_id) res=await sb.from('employee_assignments').delete().eq('employee_id',o.employee_id).eq('group_id',eg);
    else note='겸직 조직을 찾을 수 없어 건너뜀';
  } else if(t==='org_create'){
    // 신설 조직 행은 발령 등록 시점에 이미 만들어져 있는 경우가 많다.
    // 예전에는 "이미 있으면 건너뛰기" 였기 때문에, 발령 이력에서 팀 라벨(색)·부제·상위조직을 수정해도
    // 실제 조직 테이블에 반영되지 않았다 → 있으면 갱신, 없으면 생성(upsert)으로 변경.
    if(d.id){
      // 값이 있는 필드만 갱신 → 조직도 관리에서 직접 채운 부제·팀라벨이 지워지지 않음
      var up2={};
      if(a.name||o.person_name) up2.name=(a.name||o.person_name);
      if(a.subtitle) up2.subtitle=a.subtitle;
      if(a.parent_id) up2.parent_id=a.parent_id;
      if(a.team) up2.team=a.team;
      if(a.is_staff!==undefined) up2.is_staff=!!a.is_staff;
      if(a.staff_side) up2.staff_side=a.staff_side;
      var upd=await sb.from('org_groups').update(up2).eq('id',d.id).select('id');
      if(upd.error) res=upd;
      else if(!upd.data || upd.data.length===0){
        // 아직 행이 없으면 신규 생성
        res=await sb.from('org_groups').insert({ id:d.id, name:(a.name||o.person_name), subtitle:a.subtitle||'', parent_id:a.parent_id||null, team:a.team||'', is_staff:!!a.is_staff, staff_side:a.staff_side||null });
      } else res={ error:null };
      if(!res.error && up2.name) await sb.from('employees').update({ team:up2.name }).eq('group_id',d.id);
    }
  } else if(t==='org_edit'){
    if(d.id){
      var up={};
      if(a.name!==undefined && a.name!=='') up.name=a.name;
      if(a.parent_id!==undefined) up.parent_id=a.parent_id||null;
      if(a.subtitle) up.subtitle=a.subtitle;      // 빈 값이면 기존 부제 유지
      if(a.team) up.team=a.team;                   // 빈 값이면 기존 팀 라벨 유지
      if(a.is_staff!==undefined) up.is_staff=!!a.is_staff;
      if(a.staff_side!==undefined) up.staff_side=a.staff_side||null;
      if(Object.keys(up).length) res=await sb.from('org_groups').update(up).eq('id',d.id);
      // 조직명이 바뀌면 소속 직원의 팀 표기도 함께 갱신 (인사평가 화면 등이 이 값을 팀명으로 사용)
      if(!res.error && up.name) await sb.from('employees').update({ team:up.name }).eq('group_id',d.id);
    }
  } else if(t==='org_delete'){
    if(d.id){
      var sd=await safeDeleteOrg(d.id);
      if(sd.error) return { error:sd.error };
      if(sd.blocked) return { error:null, skipped:true, note:(o.person_name+' : '+sd.message) };
      res={ error:null };
    }
  }
  if(res.error) return { error:res.error };
  var nd=Object.assign({}, d, { applied:true, applied_at:new Date().toISOString() }); delete nd.hold;
  var r2=await sb.from('hr_orders').update({ detail:nd }).eq('id',o.id);
  return { error:r2.error, note:note };
}

// ── 이미 반영된 발령을 발령 전 상태로 되돌리기(보류로 전환) ──
async function revertOrderNow(o, ctx){
  ctx=ctx||{}; var d=o.detail||{}, b=d.before||{}, t=o.order_type, res={error:null};
  function _bTeam(gid, fb){ var g=(ctx.groups||[]).find(function(x){ return x.id===gid; }); return g?(g.name||''):(isHexColor(fb)?'':(fb||'')); }
  if(t==='hire'){

  } else if(t==='promotion'||t==='demotion'||t==='job_change'){

  } else if(t==='resign'){
    if(o.employee_id) res=await sb.from('employees').update({ status:b.status||'재직', last_work_day:null }).eq('id',o.employee_id);
  } else if(t==='concurrent'){
    var cg=d.group_id||gidByName(ctx.groups,d.group);
    if(cg && o.employee_id) res=await sb.from('employee_assignments').delete().eq('employee_id',o.employee_id).eq('group_id',cg);
  } else if(t==='concurrent_end'){
    var eg=d.group_id||gidByName(ctx.groups,d.group);
    if(eg && o.employee_id) res=await sb.from('employee_assignments').upsert({ employee_id:o.employee_id, group_id:eg, position:d.position||null, display:(d.display==='SUB'?'SUB':'MEMBER') },{ onConflict:'employee_id,group_id' });
  } else if(t==='org_edit'){
    if(d.id){
      var rb={};
      if(b.name) rb.name=b.name;
      if(b.parent_id!==undefined) rb.parent_id=b.parent_id||null;
      if(b.subtitle!==undefined) rb.subtitle=b.subtitle||'';
      if(b.team!==undefined) rb.team=b.team||'';
      if(b.is_staff!==undefined) rb.is_staff=!!b.is_staff;
      if(b.staff_side!==undefined) rb.staff_side=b.staff_side||null;
      if(Object.keys(rb).length) res=await sb.from('org_groups').update(rb).eq('id',d.id);
      if(!res.error && rb.name) await sb.from('employees').update({ team:rb.name }).eq('group_id',d.id);
    }
  } else if(t==='org_create'){
    if(d.id){
      var sd=await safeDeleteOrg(d.id);
      if(sd.error) return { error:sd.error };
      if(sd.blocked) return { error:{ message:'소속 인원·하위 조직이 있어 조직 신설을 되돌릴 수 없습니다. 먼저 인원을 이동시키세요.' } };
      res={ error:null };

  }

  return { error:r2.error };

// ── 시행일이 도래한 예약 발령 자동 반영 ──
const APPLY_SEQ={ hire:0, org_create:1, org_edit:2, transfer:3, promotion:4, demotion:4, job_change:4, leave:5, return:5, standby:5, dispatch:5, concurrent:6, concurrent_end:6, resign:7, org_delete:9 };
async function autoApplyDueOrders(orders, emps, groups){
  var due=(orders||[]).filter(function(o){ return isPendingOrder(o) && !isHeldOrder(o) && isDueOrder(o); });
  if(!due.length) return { applied:0, notes:[] };
  function seqOf(t){ return (APPLY_SEQ[t]==null)?8:APPLY_SEQ[t]; }
  due.sort(function(x,y){ return seqOf(x.order_type)-seqOf(y.order_type) || String(effOf(x)).localeCompare(String(effOf(y))); });
  var n=0, notes=[], gs=(groups||[]).slice(), es=(emps||[]).slice();
  for(var i=0;i<due.length;i++){
    var r=await applyOrderNow(due[i], { emps:es, groups:gs });
    if(r && r.note) notes.push(r.note);
    if(r && !r.error && !r.skipped) n++;
  }
  return { applied:n, notes:notes };
}

function useTheme(){
  const [theme,setTheme]=useState(()=>{ try{ return localStorage.getItem('demo-theme')||'system'; }catch(e){ return 'system'; } });
  useEffect(()=>{
    const el=document.documentElement;
    el.classList.toggle('dark', theme==='dark');
    el.classList.toggle('claude', theme==='system');
    try{ localStorage.setItem('demo-theme',theme); }catch(e){}
  },[theme]);
  return [theme,setTheme];
}

  // ── 권한 변경 알림 ──────────────────────────────────────────────
  //  다른 최고관리자가 바꾼 것 중 내가 아직 확인하지 않은 건을 가져온다.
  //  「확인」을 누르면 seen_by 에 내 이메일이 들어가 나에게는 사라진다.
  //  최근 30일치만 본다 — 오래된 건은 이력 조회로 확인한다.
  async function loadRoleAlerts(mail){
    const me=mail||(session&&session.user&&session.user.email);
    if(!me) return;
    const since=new Date(Date.now()-30*24*3600*1000).toISOString();
    const r=await sb.from('role_change_log').select('*')
      .gte('changed_at', since).order('changed_at',{ascending:false}).limit(50);
    if(r.error){ setRoleAlerts([]); return; }          // 표가 없거나 권한이 없으면 조용히 넘어간다
    setRoleAlerts((r.data||[]).filter(x=>
      x.changed_by!==me && !((x.seen_by||[]).includes(me))));
  }
  function reloadAlerts(){ loadRoleAlerts(); }
  async function seenRoleAlerts(ids){
    const me=session&&session.user&&session.user.email; if(!me) return;
    setBusy(true);
    for(const a of roleAlerts.filter(x=>!ids||ids.includes(x.id))){
      const next=Array.from(new Set([...(a.seen_by||[]), me]));
      await sb.from('role_change_log').update({ seen_by: next }).eq('id', a.id);
    }
    setBusy(false);
    await loadRoleAlerts();
    flash('확인 처리했습니다');
  }
  const [emps,setEmps]=useState([]);
  const [groups,setGroups]=useState([]);
  const [orders,setOrders]=useState([]);
  const [assigns,setAssigns]=useState([]);
  const [err,setErr]=useState('');
  const [busy,setBusy]=useState(false);
  const [notice,setNotice]=useState('');
  const [modal,setModal]=useState(null);
  useEffect(function(){ _modalCtl=setModal; return function(){ _modalCtl=null; }; },[]);

  const autoRan=useRef(false);
  const canWriteRef=useRef(false);
  async function loadAll(){
    setErr('');
    const [e1,e2,e3,e4,e5]=await Promise.all([
      sb.from('employees').select('*'),
      sb.from('org_groups').select('*'),
      sb.from('hr_orders').select('*').order('order_date',{ascending:false}).order('created_at',{ascending:false}),
      sb.from('employee_assignments').select('*'),
      // 근로계약 종료일·급여지급포함은 employee_contracts 에 있다.
      // 목록에서 보이지 않아 「계약종료일을 넣었는데 퇴사일에 반영되지 않는다」는
      // 오해가 생겼다 (2026-08-05). 목록에 함께 실어 보여준다.
      sb.from('employee_contracts').select('emp_no,contract_end_date,pay_include')
    ]);
    const anyErr=e1.error||e2.error||e3.error||e4.error;
    if(anyErr){ setErr(anyErr.message); return; }
    // 근로계약은 없을 수도 있으므로 실패해도 목록 자체는 보여준다
    const cMap={};
    (e5&&e5.data||[]).forEach(c=>{ if(c.emp_no!=null) cMap[String(c.emp_no)]=c; });
    const empsMerged=(e1.data||[]).map(e=>{
      const c=cMap[String(e.emp_no)]||{};
      return Object.assign({}, e, {
        contract_end_date: c.contract_end_date ? String(c.contract_end_date).slice(0,10) : '',
        pay_include: c.pay_include || 'Y'
      });
    });
    setEmps(empsMerged); setGroups(e2.data||[]); setOrders(e3.data||[]); setAssigns(e4.data||[]);
    // 시행일이 도래한 예약 발령을 자동 반영 (관리자 세션에서 1회)
    if(canWriteRef.current && !autoRan.current){
      autoRan.current=true;
      const r=await autoApplyDueOrders(e3.data||[], e1.data||[], e2.data||[]);
      if(r.applied>0){ flash('시행일이 도래한 발령 '+r.applied+'건을 반영했습니다.'); await loadAll(); }
      else if(r.notes.length){ flash('폐지 보류: '+r.notes.join(' / ')); }
    }
  }

  useEffect(()=>{ (async()=>{
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){ window.location.href='index.html'; return; }
    setSession(session);
    const { data:roles } = await sb.from('user_roles').select('app,role').eq('email',session.user.email).in('app',['hr','payroll']);
    const _can=!!(roles||[]).find(r=>r.app==='hr'      && (r.role==='SUPER'||r.role==='ADMIN'));
    const _sup=!!(roles||[]).find(r=>r.app==='hr'      && r.role==='SUPER');
    const _pay=!!(roles||[]).find(r=>r.app==='payroll'  && (r.role==='SUPER'||r.role==='ADMIN'));
    canWriteRef.current=_can; setCanEdit(_can); setIsSuper(_sup); setPayAdmin(_pay);
    if(_sup) loadRoleAlerts(session.user.email);
    await loadAll();
    setReady(true);
  })(); },[]);

  function flash(msg){ setNotice(msg); setTimeout(()=>setNotice(''),2500); }

  if(!ready) return <div className="min-h-screen flex items-center justify-center text-slate-400 dark:text-slate-500">불러오는 중…</div>;

  const active = emps.filter(e=>e.status!=='퇴사');
  // 예약(미시행) 발령 반영 상태 계산
  const pendMeta = computePendingMeta(orders);
  setGroupsCache(groups);   // 팀 표시용 조직 캐시 — 렌더 시점에 갱신(훅 아님)
  const groupsF = decorateGroups(groups, pendMeta);           // 발령 화면용(시행예정 표기 포함)
  const memCnt = {}; emps.forEach(e=>{ if(e.status!=='퇴사') memCnt[e.group_id]=(memCnt[e.group_id]||0)+1; });
  const orgGroups = groupsF;  // 조직도 컴포넌트 안에서 시행 전 신설 조직을 차트에서만 숨김
  const pendCnt = orders.filter(o=>isPendingOrder(o)&&!isHeldOrder(o)).length;
  const stats = { total: active.length, groups: orgGroups.length };

  return (
    <div className="min-h-screen">
      {modal && <div className="fixed inset-0 z-[300] bg-black/50 flex items-center justify-center p-4" onClick={()=>{ if(modal.kind==='alert'){ var f=modal.on; setModal(null); f&&f(true); } }}>
        <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl max-w-sm w-full p-6" onClick={function(e){e.stopPropagation();}}>
          <div className="text-sm text-slate-800 dark:text-slate-100 whitespace-pre-wrap leading-relaxed mb-5">{modal.msg}</div>
          <div className="flex justify-end gap-2">
            {modal.kind==='confirm' && <button onClick={()=>{ var f=modal.on; setModal(null); f&&f(false); }} className="px-4 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700">취소</button>}
            <button onClick={()=>{ var f=modal.on; setModal(null); f&&f(true); }} className="px-5 py-2 text-sm rounded-lg bg-slate-900 text-white font-bold hover:bg-slate-800 shadow">확인</button>
          </div>
        </div>
      </div>}
      <header className="sticky top-0 z-30 bg-white/90 dark:bg-slate-900/90 backdrop-blur border-b border-slate-200 dark:border-slate-700 no-print">
        <div className="max-w-[1400px] mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4 flex-wrap">
          <div className="flex items-center gap-3">
            <a href="index.html" className="w-9 h-9 rounded-lg bg-gradient-to-br from-slate-700 to-slate-900 flex items-center justify-center" title="포털로">
              <Icon path="M3 21h18M5 21V7l7-4 7 4v14" className="w-5 h-5 text-white" />
            </a>
            <div>
              <h1 className="font-bold text-slate-900 dark:text-slate-100">e-HR 시스템</h1>
              <p className="text-xs text-slate-500 dark:text-slate-400">재직 {stats.total}명 · 조직 {stats.groups}개 {canEdit?'· 편집가능':'· 조회전용'}{pendCnt?(' · 시행예정 '+pendCnt+'건'):''}</p>
            </div>
          </div>
          <div className="flex items-center gap-3">
            {busy && <span className="text-xs text-blue-600">저장 중…</span>}
            {notice && <span className="text-xs text-emerald-600 bg-emerald-50 dark:bg-emerald-950 px-3 py-1.5 rounded-md">{notice}</span>}
            <ThemeToggle />
            <a href="index.html" className="text-xs font-bold px-3.5 py-2 rounded-lg bg-rose-600 text-white border border-rose-700 shadow-md hover:bg-rose-700 transition">DEMO 인사시스템</a>
            <a href="demo-eval.html" className="text-xs font-bold px-3.5 py-2 rounded-lg bg-indigo-600 text-white border border-indigo-700 shadow-md hover:bg-indigo-700 hover:shadow-lg active:translate-y-px transition">인사평가시스템</a>
            <a href="demo-payroll.html" className="text-xs font-bold px-3.5 py-2 rounded-lg bg-emerald-600 text-white border border-emerald-700 shadow-md hover:bg-emerald-700 hover:shadow-lg active:translate-y-px transition">급여자동화</a>
            <span className="text-sm text-slate-500 dark:text-slate-400 hidden sm:inline">{session.user.email}</span>
            <button onClick={()=>sb.auth.signOut().then(()=>window.location.href='index.html')} className="text-sm text-slate-600 dark:text-slate-300 hover:text-slate-900 px-3 py-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">로그아웃</button>
          </div>
        </div>
        <div className="max-w-[1400px] mx-auto px-4 sm:px-6 flex gap-2 pt-1 pb-3">
          {[['org','조직도 관리','M3 21h18M5 21V7l7-4 7 4v14'],['orders','발령 관리','M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8zM14 2v6h6'],['emps','임직원 관리','M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M13 7a4 4 0 11-8 0 4 4 0 018 0z']].concat(isSuper?[['roles','권한 관리','M15 7a2 2 0 012 2m4 0a6 6 0 01-7.7 5.7L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.6a1 1 0 01.3-.7l5.4-5.4A6 6 0 1121 9z']]:[]).map(([k,label,ic])=>{
            const on=tab===k;
            return <button key={k} onClick={()=>setTab(k)}
              className={"flex items-center gap-1.5 px-5 py-2.5 text-sm rounded-lg border transition "+(on?"bg-slate-900 border-slate-900 text-white font-bold shadow-md":"bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 font-medium hover:bg-slate-50 dark:hover:bg-slate-700/40 hover:text-slate-900")}>
              <Icon path={ic} className="w-4 h-4" />{label}</button>;
          })}
        </div>
      </header>

      <main className="max-w-[1400px] mx-auto px-4 sm:px-6 py-6">
        {err && <div className="mb-4 text-sm text-red-600 bg-red-50 dark:bg-red-950 border border-red-200 rounded-lg px-4 py-3">오류: {err}</div>}
        {isSuper && roleAlerts.length>0 && (()=>{
          const APPN={hr:'e-HR', eval:'인사평가', payroll:'급여자동화'};
          const kst=t=>{ try{ return new Date(t).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ return String(t||'').slice(0,16).replace('T',' '); } };
          return <div className="mb-4 rounded-xl border border-amber-300 dark:border-amber-800 bg-amber-50 dark:bg-amber-950/40 px-4 py-3">
            <div className="flex items-center justify-between gap-3 flex-wrap mb-2">
              <span className="text-sm font-bold text-amber-900 dark:text-amber-200">🔔 다른 최고관리자가 권한을 변경했습니다 — {roleAlerts.length}건</span>
              <div className="flex gap-2">
                <button onClick={()=>setTab('roles')}
                  className="text-xs px-3 py-1.5 rounded-lg border border-amber-500 dark:border-amber-700 text-amber-900 dark:text-amber-200 hover:bg-amber-100 dark:hover:bg-amber-900 font-semibold">권한 관리 열기</button>
                <button onClick={()=>seenRoleAlerts()}
                  className="text-xs px-3 py-1.5 rounded-lg bg-amber-700 text-white font-semibold hover:bg-amber-800">모두 확인</button>
              </div>
            </div>
            <div className="space-y-1">
              {roleAlerts.slice(0,8).map(a=>(
                <div key={a.id} className="text-[12px] text-amber-900 dark:text-amber-200 flex items-center gap-2 flex-wrap">
                  <span className="text-amber-700 dark:text-amber-400 tabular-nums">{kst(a.changed_at)}</span>
                  <b>{a.target_name||a.target_email}</b>
                  <span className="px-1.5 py-0.5 rounded bg-amber-200 dark:bg-amber-900 text-[11px] font-bold">{APPN[a.app]||a.app}</span>
                  <span>{a.old_role||'없음'} <b>→</b> {a.new_role||'없음'}</span>
                  <span className="text-amber-700 dark:text-amber-400">by {a.changed_by}</span>
                </div>
              ))}
              {roleAlerts.length>8 && <div className="text-[11px] text-amber-700 dark:text-amber-400">외 {roleAlerts.length-8}건</div>}
            </div>
          </div>;
        })()}
        {tab==='org'   && <OrgTab emps={emps} groups={orgGroups} assigns={assigns} orders={orders} canEdit={canEdit} reload={loadAll} setBusy={setBusy} flash={flash} setErr={setErr} />}
        {tab==='orders'&& <OrdersTab emps={emps} groups={groupsF} orders={orders} assigns={assigns} canEdit={canEdit} reload={loadAll} setBusy={setBusy} flash={flash} setErr={setErr} />}
        {tab==='emps'  && <EmpsTab emps={emps} groups={groupsF} orders={orders} canEdit={canEdit} payAdmin={payAdmin} reload={loadAll} setBusy={setBusy} flash={flash} setErr={setErr} />}
        {tab==='roles' && isSuper && <RolesTab emps={emps} myEmail={session&&session.user&&session.user.email} payAdmin={payAdmin} setBusy={setBusy} flash={flash} setErr={setErr} reloadAlerts={reloadAlerts} />}
      </main>
    </div>
  );
}

// ════════════════════════════════════════════════════════
function RolesTab({ emps, myEmail, payAdmin, setBusy, flash, setErr, reloadAlerts }){
  const APPS_DEF=[['hr','e-HR'],['eval','인사평가'],['payroll','급여자동화']];
  const ROLES=['SUPER','ADMIN','USER'];
  const [rows,setRows]=useState(null);
  const [q,setQ]=useState('');
  const [log,setLog]=useState(null);          // 변경 이력 (열었을 때만 조회)
  const [logOpen,setLogOpen]=useState(false);
  async function load(){ const r=await sb.from('user_roles').select('*'); if(r.error){ setErr(r.error.message); return; } setRows(r.data||[]); }
  useEffect(()=>{ load(); },[]);
  async function loadLog(){
    const r=await sb.from('role_change_log').select('*').order('changed_at',{ascending:false}).limit(100);
    setLog(r.error? [] : (r.data||[]));
  }
  const active=emps.filter(e=>e.status!=='퇴사' && e.email).slice().sort((a,b)=>(a.team||'').localeCompare(b.team||'')||(a.name||'').localeCompare(b.name||''));
  const list=active.filter(e=>!q||(e.name||'').includes(q)||(e.email||'').includes(q)||(e.team||'').includes(q));
  const of=(email,app)=>(rows||[]).find(r=>r.email===email&&r.app===app);
  //  user_roles 에는 있는데 직원 명부에 없는 이메일 (공용·시스템 계정 등)
  const orphan=(()=>{
    if(!rows) return [];
    const known=new Set(emps.map(e=>(e.email||'').toLowerCase()).filter(Boolean));
    const seen={};
    rows.forEach(r=>{
      const m=String(r.email||'').toLowerCase();
      if(!m || known.has(m)) return;
      seen[r.email]=seen[r.email]||{ email:r.email, roles:[] };
      seen[r.email].roles.push(r);
    });
    return Object.values(seen).sort((a,b)=>a.email.localeCompare(b.email));
  })();
  async function setRole(email, app, role){
    const APPN={hr:'e-HR', eval:'인사평가', payroll:'급여자동화'};
    const cur=of(email,app);
    // 본인 e-HR 관리자 권한 하향 차단 (탭 접근 상실 방지)
    if(email===myEmail && app==='hr' && (!role || role==='USER')){
      uiAlert('본인의 e-HR 관리자 권한은 여기서 내릴 수 없습니다.\n(권한 관리 접근을 잃게 됩니다. 이관 시 후임자에게 먼저 SUPER를 부여한 뒤 후임자가 조정하세요.)');
      load(); return;
    }
    const empNm=(active.find(x=>x.email===email)||{}).name||email;   // 명부에 없으면 이메일로 표시
    const curTxt=cur?cur.role:'없음';
    const newTxt=role||'없음';
    //  e-HR SUPER 는 「권한 관리」 화면 자체에 들어갈 수 있는 권한이다.
    //  누가 권한을 나눠줄 수 있는지가 걸린 문제라 따로 확인한다. (2026-08-31)
    if(app==='hr' && (role==='SUPER' || (cur&&cur.role==='SUPER'))){
      const give=(role==='SUPER');
      const supers=(rows||[]).filter(r=>r.app==='hr'&&r.role==='SUPER').map(r=>r.email);
      if(!give && supers.length<=1 && supers[0]===email){
        uiAlert('마지막 남은 e-HR 최고관리자입니다.\n먼저 다른 분에게 SUPER 를 부여한 뒤 회수하세요.');
        load(); return;
      }
      const msg = give
        ? (empNm+' 님에게 e-HR 최고관리자(SUPER) 권한을 부여합니다.\n\n'
          +'이 권한을 가지면\n'
          +'  · 「권한 관리」 화면에 들어갈 수 있습니다\n'
          +'  · 다른 사람의 e-HR · 인사평가 · 급여자동화 권한을 바꿀 수 있습니다\n\n'
          +'현재 최고관리자 : '+(supers.join(', ')||'없음')+'\n\n계속할까요?')
        : (empNm+' 님의 e-HR 최고관리자(SUPER) 권한을 '+newTxt+' 로 내립니다.\n\n'
          +'「권한 관리」 화면에 더 이상 들어갈 수 없게 됩니다.\n\n계속할까요?');
      if(!await uiConfirm(msg)){ load(); return; }
    }
    else if(!await uiConfirm(empNm+' 님의 ['+(APPN[app]||app)+'] 권한을 변경할까요?\n'+curTxt+' → '+newTxt)){ load(); return; }
    setBusy(true);
    let res;
    if(!role){ if(!cur){ setBusy(false); return; } res=await sb.from('user_roles').delete().eq('id',cur.id); }
    else if(cur){ res=await sb.from('user_roles').update({role}).eq('id',cur.id); }
    else { res=await sb.from('user_roles').insert({email,app,role}); }
    setBusy(false);
    if(res.error){ setErr(res.error.message); return; }
    // ── 변경 이력을 남긴다 (다른 최고관리자에게 알리기 위해) ──────
    //  이력 저장이 실패해도 권한 변경 자체는 이미 끝났으므로 막지 않는다.
    //  다만 알림이 가지 않는다는 사실은 알려 준다. (2026-08-31)
    try{
      const lg=await sb.from('role_change_log').insert({
        changed_by: myEmail, target_email: email, target_name: empNm,
        app: app, old_role: (cur?cur.role:null), new_role: (role||null),
        seen_by: [myEmail]          // 바꾼 본인은 확인한 것으로 둔다
      });
      if(lg.error) throw new Error(lg.error.message);
      flash(empNm+' 님 '+(APPN[app]||app)+' 권한 '+curTxt+' → '+newTxt+' · 다른 최고관리자에게 알림이 갑니다');
    }catch(e){
      flash('권한은 저장했습니다 — 다만 변경 알림 기록에 실패했습니다 ('+(e&&e.message||e)+')');
    }
    load(); if(typeof reloadAlerts==='function') reloadAlerts();
  }
  if(rows===null) return <div className="text-slate-400 dark:text-slate-500 text-sm py-6">불러오는 중…</div>;
  const sel="text-xs border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1.5 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-200 outline-none";
  return (
    <div>
      <div className="flex items-center gap-2 mb-3 flex-wrap">
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="🔍 이름/이메일/팀 검색" className="inp !w-64" />
        <span className="text-xs text-slate-400 dark:text-slate-500">{list.length}명 · 권한이 없으면 포털에서 해당 시스템이 잠깁니다</span>

        {log===null ? <div className="px-4 py-6 text-sm text-slate-400 dark:text-slate-500">불러오는 중…</div>

         : <div className="max-h-72 overflow-y-auto"><table className="w-full text-xs whitespace-nowrap">

                const up=(a.new_role==='SUPER')||(a.old_role==null&&a.new_role);

            공용 계정이거나 퇴사자·오타일 수 있습니다. 아래 표에서 함께 조정할 수 있습니다.

// ══════════════════════════════════════════════════════════════════════
//  주민번호·계좌번호 「평문 열람 권한」 관리 (급여 관리자 전용)
//   · 본인에게 직접 부여할 수 없다 (2인 교차 승인)
//   · 기본 7일 후 자동 만료 · 언제든 회수 가능 · 전건 감사 기록
// ══════════════════════════════════════════════════════════════════════
function RevealGrantPanel({ rows, setBusy, flash, setErr, myEmail }){
  const [grants,setGrants]=useState(null);
  const [logs,setLogs]=useState(null);
  const [target,setTarget]=useState('');
  const [why,setWhy]=useState('');
  const [days,setDays]=useState(7);
  const [openLog,setOpenLog]=useState(false);

  const payUsers=(rows||[]).filter(r=>r.app==='payroll'&&(r.role==='SUPER'||r.role==='ADMIN'));

  async function load(){
    const [g,l]=await Promise.all([
      sb.from('private_reveal_grants').select('*').order('granted_at',{ascending:false}).limit(30),
      sb.from('sensitive_access_log').select('*').order('at',{ascending:false}).limit(30)
    ]);
    if(g.error) setErr(g.error.message); else setGrants(g.data||[]);
    if(!l.error) setLogs(l.data||[]);
  }
  useEffect(()=>{ load(); },[]);

  async function grant(){
    if(!target){ uiAlert('권한을 부여할 급여 관리자를 선택해 주세요.'); return; }
    if(!why.trim()){ uiAlert('부여 사유를 입력해 주세요.'); return; }
    if(!await uiConfirm(target+' 님에게 주민번호·계좌번호 평문 열람 권한을 '+days+'일간 부여할까요?\n\n부여 사실과 이후 모든 열람이 감사 기록에 남습니다.')) return;
    setBusy(true);
    const r=await sb.rpc('hr_grant_reveal',{ p_grantee:target, p_reason:why.trim(), p_days:Number(days)||7 });
    setBusy(false);
    if(r.error){ uiAlert('부여할 수 없습니다.\n\n'+r.error.message); return; }
    setWhy(''); setTarget(''); flash('열람 권한을 부여했습니다.'); load();
  }
  async function revoke(email){
    if(!await uiConfirm(email+' 님의 평문 열람 권한을 즉시 회수할까요?')) return;
    setBusy(true);
    const r=await sb.rpc('hr_revoke_reveal',{ p_grantee:email });
    setBusy(false);
    if(r.error){ uiAlert(r.error.message); return; }
    flash('회수했습니다.'); load();
  }
  const isLive=g=>!g.revoked_at && new Date(g.expires_at)>new Date();
  const live=(grants||[]).filter(isLive);

  return (
    <div className="mt-6 bg-white dark:bg-slate-800 border border-rose-200 dark:border-rose-900 rounded-2xl p-4">
      <div className="font-bold text-slate-800 dark:text-slate-100 mb-1">🔒 주민번호·계좌번호 평문 열람 권한</div>
      <p className="text-[11.5px] text-slate-500 dark:text-slate-400 mb-3 leading-relaxed rounded-lg bg-rose-50 dark:bg-rose-950/40 border border-rose-100 dark:border-rose-900 px-3 py-2">
        급여 관리자라도 <b>이 권한 없이는 평문을 볼 수 없습니다.</b> 마스킹된 값(<span className="font-mono">830312-1******</span> · <span className="font-mono">****6272</span>)은 권한 없이도 확인할 수 있습니다.
        <b> 본인에게 직접 부여할 수는 없으며</b>, 다른 급여 관리자가 부여해야 합니다. 부여·열람·회수는 전건 기록되며 삭제할 수 없습니다.
      </p>

      <div className="grid grid-cols-1 md:grid-cols-4 gap-2 items-end">
        <Field label="대상 (급여 관리자)">
          <select value={target} onChange={e=>setTarget(e.target.value)} className="inp">
            <option value="">선택</option>
            {payUsers.filter(u=>u.email!==myEmail).map(u=><option key={u.email} value={u.email}>{u.email}</option>)}
          </select>
        </Field>
        <div className="md:col-span-2"><Field label="부여 사유 (필수)"><input value={why} onChange={e=>setWhy(e.target.value)} className="inp" placeholder="예: 8월 급여 이체 계좌 검증" /></Field></div>
        <div className="flex gap-2">
          <div className="w-24"><Field label="유효일수"><input type="number" min="1" max="30" value={days} onChange={e=>setDays(e.target.value)} className="inp" /></Field></div>
          <button onClick={grant} className="h-[34px] px-3 text-xs font-bold bg-rose-600 text-white rounded-lg hover:bg-rose-700 whitespace-nowrap">권한 부여</button>
        </div>
      </div>

      <div className="mt-3">
        <div className="text-xs font-bold text-slate-500 dark:text-slate-400 mb-1.5">유효한 권한 {live.length}건</div>
        {live.length===0
          ? <div className="text-[11.5px] text-slate-400 dark:text-slate-500 px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-900/40 border border-slate-200 dark:border-slate-700">현재 평문을 열람할 수 있는 사람이 없습니다.</div>
          : <div className="border border-slate-200 dark:border-slate-700 rounded-lg overflow-hidden">
              <table className="w-full text-[11.5px]">
                <thead className="bg-slate-50 dark:bg-slate-900/50 text-slate-500 dark:text-slate-400">
                  <tr><th className="text-left px-2.5 py-1.5">대상</th><th className="text-left px-2.5 py-1.5">부여자</th><th className="text-left px-2.5 py-1.5">만료</th><th className="text-center px-2.5 py-1.5">열람</th><th className="text-left px-2.5 py-1.5">사유</th><th className="px-2.5 py-1.5"></th></tr>
                </thead>
                <tbody className="text-slate-700 dark:text-slate-200">
                  {live.map(g=><tr key={g.id} className="border-t border-slate-100 dark:border-slate-700">
                    <td className="px-2.5 py-1.5 font-bold">{g.grantee_email}</td>
                    <td className="px-2.5 py-1.5 text-slate-500 dark:text-slate-400">{g.granted_by}</td>
                    <td className="px-2.5 py-1.5">{String(g.expires_at||'').slice(0,16).replace('T',' ')}</td>
                    <td className="px-2.5 py-1.5 text-center font-bold">{g.uses_count||0}회</td>
                    <td className="px-2.5 py-1.5 text-slate-500 dark:text-slate-400">{g.reason||''}</td>
                    <td className="px-2.5 py-1.5 text-right"><button onClick={()=>revoke(g.grantee_email)} className="text-[11px] px-2 py-0.5 rounded bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-rose-200 dark:hover:bg-rose-800">회수</button></td>
                  </tr>)}
                </tbody>
              </table>
            </div>}
      </div>

      <button onClick={()=>setOpenLog(v=>!v)} className="mt-3 text-[11.5px] text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 font-bold">
        {openLog?'▲ 감사 기록 접기':'▼ 감사 기록 보기 (최근 30건)'}
      </button>
      {openLog && <div className="mt-2 border border-slate-200 dark:border-slate-700 rounded-lg overflow-hidden max-h-64 overflow-y-auto">
        <table className="w-full text-[11px]">
          <thead className="bg-slate-50 dark:bg-slate-900/50 text-slate-500 dark:text-slate-400 sticky top-0">
            <tr><th className="text-left px-2.5 py-1.5">시각</th><th className="text-left px-2.5 py-1.5">행위자</th><th className="text-left px-2.5 py-1.5">구분</th><th className="text-left px-2.5 py-1.5">대상</th><th className="text-left px-2.5 py-1.5">항목</th><th className="text-left px-2.5 py-1.5">사유</th></tr>
          </thead>
          <tbody className="text-slate-700 dark:text-slate-200">
            {(logs||[]).map(l=><tr key={l.id} className="border-t border-slate-100 dark:border-slate-700">
              <td className="px-2.5 py-1 whitespace-nowrap">{String(l.at||'').slice(0,16).replace('T',' ')}</td>
              <td className="px-2.5 py-1">{l.actor_email}</td>
              <td className="px-2.5 py-1"><span className={"px-1.5 py-0.5 rounded font-bold "+(
                l.action==='READ'?"bg-amber-100 dark:bg-amber-900 text-amber-700 dark:text-amber-300":
                l.action==='DENIED'?"bg-rose-100 dark:bg-rose-900 text-rose-700 dark:text-rose-300":
                l.action==='GRANT'?"bg-indigo-100 dark:bg-indigo-900 text-indigo-700 dark:text-indigo-300":
                "bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300")}>{l.action}</span></td>
              <td className="px-2.5 py-1">{l.emp_no}</td>
              <td className="px-2.5 py-1 text-slate-500 dark:text-slate-400">{(l.fields||[]).join(', ')}</td>
              <td className="px-2.5 py-1 text-slate-500 dark:text-slate-400">{l.reason||''}</td>
            </tr>)}
            {(logs||[]).length===0 && <tr><td colSpan="6" className="px-2.5 py-4 text-center text-slate-400 dark:text-slate-500">기록 없음</td></tr>}
          </tbody>
        </table>
      </div>}
    </div>
  );
}

//  탭 1) 조직도 관리
// ════════════════════════════════════════════════════════
// ── 조직 색상/정렬 유틸 ──
// 팀 라벨(색상 그룹) 20색 팔레트 — 드롭다운으로 선택. team 값에 hex 를 저장.
const TEAM_PALETTE = [
  '#2563eb','#0284c7','#0891b2','#0d9488','#059669','#16a34a','#65a30d','#ca8a04',
  '#d97706','#ea580c','#dc2626','#e11d48','#db2777','#c026d3','#9333ea','#7c3aed',
  '#6366f1','#475569','#1e293b','#0f766e'
];
// 구(舊) 텍스트 팀명 → 색 (기존 데이터 호환)
const TEAM_HEX = { 'CEO':'#1e293b','사업본부':'#2563eb','전략마케팅':'#7c3aed','국내영업':'#0284c7','해외영업':'#0891b2','연구개발':'#059669','품질경영':'#d97706','경영지원':'#e11d48' };
const GROUP_HEX = { 'g_app':'#0d9488','g_ai':'#16a34a','g_medical':'#c026d3' };
function isHexColor(v){ return typeof v==='string' && /^#[0-9a-fA-F]{6}$/.test(v); }
// 팀 라벨 텍스트를 팔레트 색으로 안정 매핑 (같은 이름은 항상 같은 색)
function paletteColorForName(name){ let h=0; for(const ch of (name||'')) h=(h*31+ch.charCodeAt(0))>>>0; return TEAM_PALETTE[h%TEAM_PALETTE.length]; }
function colorForGroup(g){
  const t=g.team;
  // 팀 라벨(색상 그룹)이 지정돼 있으면 항상 그것이 최우선
  if(isHexColor(t)) return t;                 // 새 방식: team 에 hex 색 저장
  if(t && TEAM_HEX[t]) return TEAM_HEX[t];      // 구 텍스트 팀명 매핑
  if(t) return paletteColorForName(t);          // 그 외 텍스트는 팔레트에 안정 매핑
  // 팀 라벨이 없을 때만 조직 고정 기본색 → 그것도 없으면 회색
  if(GROUP_HEX[g.id]) return GROUP_HEX[g.id];
  return '#475569';
}
function isPart(g){ return (g.name||'').indexOf('파트')>=0; }
// 조직도 표시 순서 : sort_order(작은 값이 왼쪽) → 같으면 이름순.
// DB 는 행 순서를 보장하지 않으므로(수정할 때마다 뒤바뀜) 반드시 이 기준으로 정렬한다.
function orgSort(a,b){ return (Number(a.sort_order)||0)-(Number(b.sort_order)||0) || String(a.name||'').localeCompare(String(b.name||'')); }
const RANK_ORDER=['대표이사','사내이사','본부장','부장','실장','팀장','수석매니저','파트장','책임매니저','매니저','선임연구원','연구원'];
// 신 직위체계 등급 대응 (책임매니저=파트장급, 수석매니저=팀장급)
const POS_GRADE={ '수석매니저':'팀장급', '책임매니저':'파트장급', '매니저':'', '팀장':'팀장급', '파트장':'파트장급' };
function posGrade(v){ return POS_GRADE[v]||''; }
function posLabel(v){ var g=posGrade(v); return v?(v+(g?(' ('+g+')'):'')):''; }
// 직위(position)·직책(rank)을 중복 없이 합쳐 표기: 둘이 같으면 하나만
function posDutyStr(pos,duty){ var p=[]; if(pos) p.push(pos); if(duty && duty!==pos) p.push(duty); return p.join(' · ')||'-'; }
function rankIdx(e){
  var pi=RANK_ORDER.indexOf(e.position||''); if(pi<0) pi=90;
  var ri=RANK_ORDER.indexOf(e.rank||''); if(ri<0) ri=90;
  return Math.min(pi,ri); // 직위·직급 중 더 상위인 쪽을 기준으로 정렬 (본부장>부장>팀장>파트장 / 수석매니저>책임매니저>매니저)
}
function rankSort(a,b){ return rankIdx(a)-rankIdx(b) || (a.name||'').localeCompare(b.name||''); }

function empTeamColor(e){ var g=empGroupOf(e); if(g) return colorForGroup(g); return e.team?(isHexColor(e.team)?e.team:colorForGroup({team:e.team})):''; }

const AV_HEX=['#6366f1','#3b82f6','#10b981','#f59e0b','#f43f5e','#8b5cf6','#06b6d4','#14b8a6','#f97316','#ec4899'];
function avatarHex(name){ let h=0; for(const ch of (name||'')) h=(h*31+ch.charCodeAt(0))>>>0; return AV_HEX[h%AV_HEX.length]; }

const OC_DEFAULT={ CARD_W:236, HEADER_H:48, ROW_H:42, PAD_B:12, H_GAP:30, BASE_VGAP:58, SPINE_UP:28, SIDE_DX:66, SIDE_VGAP:14, TOP:24, LEFT:24 };
const OC=OC_DEFAULT;
// 조직 트리의 최대 세로 깊이(루트→리프 계층 간격 수). 세로 간격 조정에 사용.
function chartMaxDepth(groups){
  var kids={}; (groups||[]).forEach(function(g){ if(g.parent_id) (kids[g.parent_id]=kids[g.parent_id]||[]).push(g); });
  var roots=(groups||[]).filter(function(g){ return !g.parent_id || !(groups||[]).some(function(p){ return p.id===g.parent_id; }); });
  function depth(gid){ var ch=kids[gid]||[]; if(!ch.length) return 0; var m=0; ch.forEach(function(c){ m=Math.max(m,depth(c.id)); }); return 1+m; }
  var d=0; roots.forEach(function(r){ d=Math.max(d,depth(r.id)); }); return d;
}
function computeOrgLayout(groups, emps, assigns, OCarg){
  const OC=OCarg||OC_DEFAULT;
  const byid=Object.fromEntries(emps.map(e=>[e.id,e]));
  const primary={}, concurrent={};
  emps.forEach(e=>{ if(e.status!=='퇴사'){ (primary[e.group_id]=primary[e.group_id]||[]).push(e); } });
  // 겸직 표시위치 : 'SUB'=카드 부제 / 그 외='MEMBER'=구성원 목록(기본)
  const concSub={};
  (assigns||[]).forEach(a=>{ const e=byid[a.employee_id]; if(e&&e.status!=='퇴사'){
    const row={...e,_concurrent:true,_cpos:a.position,_cdisp:(a.display||'MEMBER')};
    const bucket=(row._cdisp==='SUB')?concSub:concurrent;
    (bucket[a.group_id]=bucket[a.group_id]||[]).push(row);
  } });
  const kids={}, staffk={};
  groups.forEach(g=>{ if(g.parent_id){ const m=g.is_staff?staffk:kids; (m[g.parent_id]=m[g.parent_id]||[]).push(g); } });
  Object.keys(kids).forEach(function(k){ kids[k].sort(orgSort); });
  Object.keys(staffk).forEach(function(k){ staffk[k].sort(orgSort); });
  // 주 소속 인원 + 겸직 인원을 함께 표시 (겸직자는 '겸' 표기로 구분).
  // 예전에는 주 소속이 있으면 겸직자를 카드 부제에 몰아넣어 부제가 지저분해졌다.
  const membersOf=g=>{
    const pm=(primary[g.id]||[]).slice().sort(rankSort);
    const ids={}; pm.forEach(function(m){ ids[m.id]=1; });
    const cm=(concurrent[g.id]||[]).filter(function(m){ return !ids[m.id]; });
    return pm.concat(cm);
  };
  const cardH=g=>{ const n=membersOf(g).length; return OC.HEADER_H+(n?n*OC.ROW_H+OC.PAD_B:10); };
  const subWcache={};
  function stepOf(ch){ const cws=ch.map(subW); let step=OC.CARD_W+OC.H_GAP; for(let i=0;i<ch.length-1;i++){ step=Math.max(step, cws[i]/2+cws[i+1]/2+OC.H_GAP); } return { step, cws }; }
  function subW(g){ if(subWcache[g.id]!=null) return subWcache[g.id]; const ch=kids[g.id]||[]; let w; if(!ch.length){ w=OC.CARD_W; } else { const r=stepOf(ch); const total=r.step*(ch.length-1); w=Math.max(OC.CARD_W, total+Math.max(r.cws[0], r.cws[r.cws.length-1])); } subWcache[g.id]=w; return w; }
  function cnt(gid){ let n=(primary[gid]||[]).length; (kids[gid]||[]).forEach(c=>{ n+=cnt(c.id); }); (staffk[gid]||[]).forEach(c=>{ n+=cnt(c.id); }); return n; }
  const boxes={};
  function layout(g,cx,y){
    const h=cardH(g); const ch=kids[g.id]||[]; const st=staffk[g.id]||[];
    const stL=st.filter(s=>s.staff_side==='left'), stR=st.filter(s=>s.staff_side!=='left');
    const sumH=arr=>arr.reduce((t,x)=>t+cardH(x)+OC.SIDE_VGAP,0);
    const staffH=Math.max(sumH(stL), sumH(stR));
    const gap= st.length? Math.max(OC.BASE_VGAP, OC.SIDE_VGAP+staffH+52) : OC.BASE_VGAP;
    boxes[g.id]={x:cx-OC.CARD_W/2,y,w:OC.CARD_W,h};
    if(ch.length){
      const r=stepOf(ch); const rowY=y+h+gap; const total=r.step*(ch.length-1); const c0=cx-total/2;
      ch.forEach((c,i)=>{ layout(c, c0+i*r.step, rowY); });
    }
    const trunkX=cx; let syL=y+h+OC.SIDE_VGAP, syR=y+h+OC.SIDE_VGAP;
    stL.forEach(sg=>{ const sh=cardH(sg); boxes[sg.id]={x:trunkX-OC.SIDE_DX-OC.CARD_W,y:syL,w:OC.CARD_W,h:sh}; syL+=sh+OC.SIDE_VGAP; });
    stR.forEach(sg=>{ const sh=cardH(sg); boxes[sg.id]={x:trunkX+OC.SIDE_DX,y:syR,w:OC.CARD_W,h:sh}; syR+=sh+OC.SIDE_VGAP; });
  }
  const roots=groups.filter(g=>!g.parent_id).slice().sort(orgSort);
  if(roots[0]) layout(roots[0], OC.LEFT+subW(roots[0])/2, OC.TOP);
  let _minX=Infinity; Object.values(boxes).forEach(b=>{ _minX=Math.min(_minX,b.x); });
  const _shift=(_minX<OC.LEFT)?(OC.LEFT-_minX):0;
  if(_shift) Object.values(boxes).forEach(b=>{ b.x+=_shift; });
  const nodes=groups.filter(g=>boxes[g.id]).map(g=>({ g, ...boxes[g.id], color:colorForGroup(g), members:membersOf(g), conc:(concurrent[g.id]||[]), concSub:(concSub[g.id]||[]), count:cnt(g.id) }));
  const links=[];
  groups.forEach(g=>{ if(!boxes[g.id])return; const b=boxes[g.id]; const trunkX=b.x+OC.CARD_W/2;
    const ch=(kids[g.id]||[]).filter(c=>boxes[c.id]); const st=(staffk[g.id]||[]).filter(c=>boxes[c.id]);
    if(ch.length){ const rowY=boxes[ch[0].id].y; const spineY=rowY-OC.SPINE_UP;
      links.push({x1:trunkX,y1:b.y+b.h,x2:trunkX,y2:spineY});
      const cxs=ch.map(c=>boxes[c.id].x+OC.CARD_W/2);
      links.push({x1:Math.min(...cxs),y1:spineY,x2:Math.max(...cxs),y2:spineY});
      ch.forEach(c=>{ const cx=boxes[c.id].x+OC.CARD_W/2; links.push({x1:cx,y1:spineY,x2:cx,y2:boxes[c.id].y}); });
    }
    st.forEach(sg=>{ const sb=boxes[sg.id]; const cy=sb.y+sb.h/2; if(!ch.length) links.push({x1:trunkX,y1:b.y+b.h,x2:trunkX,y2:cy}); const nearX=(sg.staff_side==='left')?(sb.x+OC.CARD_W):sb.x; links.push({x1:trunkX,y1:cy,x2:nearX,y2:cy,staff:true}); });
  });
  let W=0,H=0; Object.values(boxes).forEach(b=>{ W=Math.max(W,b.x+b.w); H=Math.max(H,b.y+b.h); });
  return { nodes, links, W:W+OC.LEFT, H:H+OC.TOP, C:OC };
}

  const afterData=useMemo(()=>applyPendingToData(emps, (groups||[]).map(g=>{ var c=Object.assign({},g); delete c._pendNew; delete c._pendName; delete c._pendDel; return c; }), assigns, orders),[emps,groups,assigns,orders]);

  // 시행 전(예약) 신설 조직은 '현재' 조직도 차트에서 숨김 — 인원이 이미 배치된 경우는 표시. after 뷰에서는 모두 표시.
  const pendingOrgs=useMemo(()=>isAfter?[]:vGroups.filter(g=>g._pendNew && !vEmps.some(e=>e.group_id===g.id && e.status!=='퇴사')),[vGroups,vEmps,isAfter]);
  const chartGroups=useMemo(()=>{ const hide={}; pendingOrgs.forEach(g=>{ hide[g.id]=1; }); return vGroups.filter(g=>!hide[g.id]); },[vGroups,pendingOrgs]);
  const pendingRenames=useMemo(()=>isAfter?[]:vGroups.filter(g=>g._pendName),[vGroups,isAfter]);
  const pendingDels=useMemo(()=>isAfter?[]:vGroups.filter(g=>g._pendDel),[vGroups,isAfter]);
  const layout=useMemo(()=>computeOrgLayout(chartGroups,vEmps,vAssigns),[chartGroups,vEmps,vAssigns]);
  const primaryMap=useMemo(()=>{ const m={}; vEmps.forEach(e=>{ if(e.status!=='퇴사')(m[e.group_id]=m[e.group_id]||[]).push(e); }); return m; },[vEmps]);
  const childrenMap=useMemo(()=>{ const c={}; vGroups.forEach(g=>{ if(g.parent_id)(c[g.parent_id]=c[g.parent_id]||[]).push(g); }); return c; },[vGroups]);
  const roots=chartGroups.filter(g=>!g.parent_id);

  // 인원 요약: 대표이사(루트) + 대표이사 직속 조직(본부·팀·스태프)별 총원(하위 포함) + 소속미지정 + 전체
  const printSummary=useMemo(function(){
    var cntBy={}; vEmps.forEach(function(e){ if(e.status!=='퇴사') cntBy[e.group_id]=(cntBy[e.group_id]||0)+1; });
    var kids={}; chartGroups.forEach(function(g){ if(g.parent_id) (kids[g.parent_id]=kids[g.parent_id]||[]).push(g); });
    function total(gid){ var n=cntBy[gid]||0; (kids[gid]||[]).forEach(function(c){ n+=total(c.id); }); return n; }
    var rows=[]; var counted=0;
    var rootGroups=chartGroups.filter(function(g){ return !g.parent_id || !chartGroups.some(function(p){ return p.id===g.parent_id; }); });
    rootGroups.forEach(function(root){
      var selfN=cntBy[root.id]||0; if(selfN>0){ rows.push({ name:root.name, n:selfN }); counted+=selfN; }
      (kids[root.id]||[]).forEach(function(c){ var n=total(c.id); if(n>0){ rows.push({ name:c.name, n:n }); counted+=n; } });
    });
    var activeAll=vEmps.filter(function(e){ return e.status!=='퇴사'; }).length;
    // 조직도 트리에 안 잡힌 재직자(소속 미지정 등)를 별도 행으로 — 총계가 항상 맞도록
    var unassigned=activeAll-counted;
    if(unassigned>0) rows.push({ name:'소속 미지정', n:unassigned });
    return { rows:rows, grand:activeAll };
  },[vEmps,chartGroups]);

  function printOrgChart(){
    // 인쇄 전용 레이아웃 — 아바타 없이 글자 크게 + 행 간격 좁게 (카드 정보 밀도 최대)
    var PC={ CARD_W:186, HEADER_H:38, ROW_H:24, PAD_B:7, H_GAP:9, BASE_VGAP:28, SPINE_UP:14, SIDE_DX:28, SIDE_VGAP:7, TOP:8, LEFT:8 };
    var lay=computeOrgLayout(chartGroups, vEmps, vAssigns, PC);
    var W=lay.W, H=lay.H;
    function esc2(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function R(n){ return Math.round(Number(n)*10)/10; }   // 좌표 소수점 정리 → SVG 용량·인쇄 처리량 감소
    // 카드 폭을 넘는 글자는 …로 줄여 좌우로 삐져나가 잘리는 것을 방지
    function fitText(str,maxW,fs){
      str=String(str||''); var w=0, out='';
      for(var i=0;i<str.length;i++){ var c=str.charCodeAt(i); var cw=(c>0x1100&&c<0xFFDC)?fs:fs*0.52;
        if(w+cw>maxW) return out.replace(/[\s·]+$/,'')+'…';
        w+=cw; out+=str.charAt(i); }
      return out;
    }
    // SVG 본문 직접 생성 (사번·근속 제외 · 이름 + 직위/직책만)
    var parts=[];
    lay.links.forEach(function(l){ parts.push('<line x1="'+R(l.x1)+'" y1="'+R(l.y1)+'" x2="'+R(l.x2)+'" y2="'+R(l.y2)+'" stroke="'+(l.staff?'#94a3b8':'#64748b')+'" stroke-width="'+(l.staff?1:1.4)+'" stroke-linecap="round"/>'); });
    lay.nodes.forEach(function(n){
      var g=n.g, x=R(n.x), y=R(n.y), w=PC.CARD_W, color=n.color;
      var members=n.members, hdrH=PC.HEADER_H;
      var h=hdrH+(members.length?members.length*PC.ROW_H+PC.PAD_B:8);
      parts.push('<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="8" fill="#ffffff" stroke="'+color+'" stroke-opacity="0.35" stroke-width="1"/>');
      parts.push('<path d="M'+x+','+(y+9)+' Q'+x+','+y+' '+(x+9)+','+y+' H'+(x+w-9)+' Q'+(x+w)+','+y+' '+(x+w)+','+(y+9)+' V'+(y+hdrH)+' H'+x+' Z" fill="'+color+'"/>');
      parts.push('<text x="'+(x+w/2)+'" y="'+(y+17)+'" text-anchor="middle" fill="#fff" font-size="13.5" font-weight="700">'+esc2(fitText(g.name,(n.count>0?w-46:w-16),13.5))+'</text>');
      // 부제 = 직접 입력한 부제 + 표시위치를 '부제'로 지정한 겸직자
      var cSub=(n.concSub||[]).filter(function(m){ return !(g.subtitle||'').includes(m.name); }).map(function(m){ return '겸 '+((m._cpos||m.rank||m.position)||'')+' '+m.name; }).join(' · ');
      var subLine=[(g.subtitle||''), cSub].filter(Boolean).join(' · ');
      if(subLine) parts.push('<text x="'+(x+w/2)+'" y="'+(y+30)+'" text-anchor="middle" fill="#fff" fill-opacity="0.85" font-size="9.5">'+esc2(fitText(subLine,w-12,9.5))+'</text>');
      if(n.count>0) parts.push('<text x="'+(x+w-9)+'" y="'+(y+17)+'" text-anchor="end" fill="#fff" font-size="11.5" font-weight="700">'+n.count+'명</text>');
      members.forEach(function(m,i){ var my=y+hdrH+5+i*PC.ROW_H;
        var role=(m._concurrent?(m._cpos||m.position):(posDutyStr(m.position,m.rank)==='-'?'':posDutyStr(m.position,m.rank)))||'';
        var nm=(m._concurrent?'겸 ':'')+m.name;
        parts.push('<text x="'+(x+11)+'" y="'+(my+13)+'" fill="#1e293b" font-size="13.5" font-weight="600">'+esc2(nm)+'<tspan fill="#94a3b8" font-size="11" font-weight="400">  '+esc2(fitText(role,w-24-nm.length*13.5,11))+'</tspan></text>');
      });
    });
    var svgHtml='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block">'+parts.join('')+'</svg>';

    var today=new Date(); var ds=today.getFullYear().toString().slice(2)+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
    var titleLabel='조직도('+ds+')'+(isAfter?' · 시행 후 예상':'');
    var sumRows=printSummary.rows.map(function(r){ return '<div class="srow"><span>· '+esc2(r.name)+'</span><span>'+r.n+'명</span></div>'; }).join('');
    var w=window.open('','_blank','width=1200,height=850');
    if(!w){ uiAlert('팝업이 차단되었습니다. 브라우저에서 팝업을 허용한 뒤 다시 시도하세요.'); return; }
    // A4 가로 · 여백 5mm → 실제 인쇄 영역 287mm × 200mm 를 시트 높이로 고정.
    // (예전엔 인쇄 시 높이를 auto 로 풀어 내용이 페이지 위쪽에 몰리고, 남는 공백 때문에 렌더링도 느렸음)
    var doc='<!doctype html><html><head><meta charset="utf-8"><title>'+esc2(titleLabel)+'</title>'
      +'<style>'
      +'@page{ size:A4 landscape; margin:5mm; }'
      +'html,body{ height:100%; margin:0; }'
      +'body{ font-family:"Malgun Gothic","맑은 고딕",AppleSDGothicNeo,sans-serif; color:#1e293b; -webkit-print-color-adjust:exact; print-color-adjust:exact; }'
      +'.sheet{ display:flex; flex-direction:column; height:100vh; padding:0 2mm; }'
      +'.top{ display:flex; justify-content:space-between; align-items:flex-start; flex:0 0 auto; }'
      +'.title{ font-size:26px; font-weight:800; letter-spacing:1px; }'
      +'.badge{ border:2px solid #dc2626; color:#dc2626; font-weight:700; text-align:center; font-size:13px; line-height:1.35; padding:6px 14px; border-radius:4px; }'
      +'.chartwrap{ flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; overflow:hidden; }'
      +'.foot{ flex:0 0 auto; display:flex; justify-content:flex-end; padding-bottom:2mm; }'
      +'.summary{ border:1px solid #94a3b8; border-radius:6px; padding:8px 16px; font-size:13.5px; min-width:200px; }'
      +'.srow{ display:flex; justify-content:space-between; gap:22px; padding:2px 0; }'
      +'.summary .grand{ border-top:1px solid #cbd5e1; margin-top:5px; padding-top:5px; font-weight:800; font-size:15px; }'
      +'@media print{ .sheet{ height:200mm; } }'
      +'</style></head><body><div class="sheet">'
      +'<div class="top"><div class="title">'+esc2(titleLabel)+'</div>'
      +'<div class="badge">Internal Use Only<br>[외부 반출 금지]</div></div>'
      +'<div class="chartwrap">'+svgHtml+'</div>'
      +'<div class="foot"><div class="summary">'+sumRows
      +'<div class="srow grand"><span>DEMO</span><span>'+printSummary.grand+'명</span></div>'
      +'</div></div>'
      +'</div>'
      // 레이아웃이 완전히 끝난 다음 프레임에 인쇄 → 인쇄 대화상자에서 재배치가 반복되지 않게
      +'<scr'+'ipt>window.onload=function(){ requestAnimationFrame(function(){ requestAnimationFrame(function(){ window.focus(); window.print(); }); }); };</scr'+'ipt>'
      +'</body></html>';
    w.document.open(); w.document.write(doc); w.document.close();
  }

  // '시행 후' 미리보기의 카드는 가상 복사본이므로, 편집은 항상 실제 조직 데이터로 연다
  function openEditGroup(g){
    if(!g){ setEditGroup(null); return; }
    var real=(groups||[]).find(function(x){ return x.id===g.id; });
    setEditGroup(real||g);
  }
  function center(){ const vp=vpRef.current; if(vp) vp.scrollLeft=Math.max(0,(vp.scrollWidth-vp.clientWidth)/2); }
  function fit(){ const vp=vpRef.current; if(!vp||!layout.W||!layout.H) return;
    const tw=(vp.clientWidth-24)/layout.W;
    const th=(vp.clientHeight-24)/layout.H;
    const t=Math.min(1.6, Math.max(0.35, Math.min(tw, th)));
    setZoom(+t.toFixed(2)); }
  useEffect(()=>{ center(); },[zoom]);
  useEffect(()=>{ const id=setTimeout(fit,80); return ()=>clearTimeout(id); },[layout.W]);

  return (
    <div>
      <div className="flex items-center justify-between mb-3">
        <h2 className="font-semibold text-slate-800 dark:text-slate-100">조직도</h2>
        <div className="flex items-center gap-2">
          {hasPending && <div className="flex items-center gap-0.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-0.5">
            <button onClick={()=>setView('before')} className={"px-2.5 h-7 text-xs rounded font-medium "+(view==='before'?'bg-slate-900 text-white':'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700')}>변경 전 (현재)</button>
            <button onClick={()=>setView('after')} className={"px-2.5 h-7 text-xs rounded font-medium "+(view==='after'?'bg-emerald-600 text-white':'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700')}>변경 후 (시행일 이후)</button>
          </div>}
          <div className="flex items-center gap-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-1 py-0.5">
            <button onClick={()=>setZoom(z=>Math.max(0.35,+(z-0.1).toFixed(2)))} className="w-7 h-7 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded font-bold">－</button>
            <span className="text-xs text-slate-500 dark:text-slate-400 w-11 text-center">{Math.round(zoom*100)}%</span>
            <button onClick={()=>setZoom(z=>Math.min(1.6,+(z+0.1).toFixed(2)))} className="w-7 h-7 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded font-bold">＋</button>
            <span className="w-px h-4 bg-slate-200 mx-0.5" />
            <button onClick={fit} className="px-2 h-7 text-xs text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded">맞춤</button>
            <button onClick={()=>{ setZoom(1); setTimeout(center,20); }} className="px-2 h-7 text-xs text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded">중앙</button>
          </div>
          <button onClick={printOrgChart} className="text-sm px-3 py-1.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700/40">인쇄</button>
          {canEdit && !isAfter && <button onClick={()=>setShowManage(true)} className="text-sm px-3 py-1.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700/40 text-slate-700 dark:text-slate-200">🗂 조직 관리</button>}
          {canEdit && !isAfter && <button onClick={()=>setEditGroup({ _new:true, parent_id: roots[0]?.id||null })} className="text-sm px-3 py-1.5 bg-slate-900 text-white rounded-lg hover:bg-slate-800">+ 조직 추가</button>}
        </div>
      </div>
      {isAfter && <div className="mb-3 rounded-xl border border-emerald-300 dark:border-emerald-700 bg-emerald-50 dark:bg-emerald-950/40 px-4 py-2.5 text-[12px] text-emerald-800 dark:text-emerald-200 no-print">
        <b>시행일 이후 조직도 미리보기</b> — 예약(시행 전) 발령이 모두 반영된 <b>예상 모습</b>입니다. 인원 배치·조직 신설은 시행일에 자동 반영됩니다.
        <b>연필(✎)로 조직명·부제·팀 라벨은 지금 바로 수정할 수 있고</b>, 저장하면 변경 전/후 화면에 함께 적용됩니다.
      </div>}
      {!isAfter && (pendingOrgs.length>0||pendingRenames.length>0||pendingDels.length>0) && <div className="mb-3 rounded-xl border border-amber-300 dark:border-amber-700 bg-amber-50 dark:bg-amber-950/40 px-4 py-2.5 text-[12px] text-amber-800 dark:text-amber-200 no-print">
        <b>시행 예정 조직 변경</b> — 아래 내용은 <b>시행일 이후</b> 조직도에 반영됩니다(현재 조직도는 발령 전 상태). {hasPending && <b className="underline cursor-pointer" onClick={()=>setView('after')}>변경 후 미리보기 →</b>}
        <div className="mt-1 text-amber-700 dark:text-amber-300">
          {pendingOrgs.map(g=>'신설 '+g.name+' ('+g._pendNew+')').concat(pendingRenames.map(g=>'명칭변경 '+g.name+' → '+g._pendName)).concat(pendingDels.map(g=>'폐지 '+g.name+' ('+g._pendDel+')')).join(' / ')}
        </div>
      </div>}
      <div className="relative">
        <div ref={vpRef} className="org-viewport border border-slate-200 dark:border-slate-700 print-area">
          <div style={{ padding:'24px' }}>
            <svg ref={svgRef} viewBox={"0 0 "+layout.W+" "+layout.H} width={layout.W*zoom} height={layout.H*zoom} style={{ display:'block' }}>
              {layout.links.map((l,i)=><line key={i} x1={l.x1} y1={l.y1} x2={l.x2} y2={l.y2} stroke={l.staff?'#94a3b8':'#64748b'} strokeWidth={l.staff?1.5:2} strokeLinecap="round" />)}
              {layout.nodes.map(n=><NodeSVG key={n.g.id} n={n} canEdit={canEdit} C={layout.C} onMember={setSelected} onEdit={openEditGroup} />)}
            </svg>
            {printSummary.rows.length>0 && <div className="flex justify-end mt-4" style={{ width:(layout.W*zoom)+'px' }}>
              <div className="bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-lg shadow-sm px-4 py-2.5 text-xs min-w-[180px]">
                {printSummary.rows.map(function(r,i){ return <div key={i} className="flex items-center justify-between gap-6 py-0.5"><span className="text-slate-600 dark:text-slate-300">· {r.name}</span><span className="text-slate-800 dark:text-slate-100 font-medium tabular-nums">{r.n}명</span></div>; })}
                <div className="flex items-center justify-between gap-6 mt-1.5 pt-1.5 border-t border-slate-200 dark:border-slate-600"><span className="font-bold text-slate-800 dark:text-slate-100">DEMO</span><span className="font-bold text-slate-900 dark:text-white tabular-nums">{printSummary.grand}명</span></div>
              </div>
            </div>}
          </div>
        </div>
      </div>
      {selected && <EmpDetailModal e={selected} manager={empById[selected.manager_id]} admin={canEdit && !isAfter} onClose={()=>setSelected(null)} />}
      {editGroup && <GroupEditModal g={editGroup} groups={groups} orders={orders} membersOf={primaryMap} childrenOf={childrenMap} canEdit={canEdit} reload={reload} setBusy={setBusy} flash={flash} setErr={setErr} onClose={()=>setEditGroup(null)} />}
      {showManage && <OrgManageModal groups={groups} membersOf={primaryMap} onEdit={(g)=>{ setShowManage(false); setEditGroup(g); }} onAdd={(pid)=>{ setShowManage(false); setEditGroup({ _new:true, parent_id:pid||null }); }} onClose={()=>setShowManage(false)} />}
    </div>
  );
}

function Row({ icon, label, value }){
  return (
    <div className="flex items-start gap-3 py-2">
      <Icon path={icon} className="w-4 h-4 text-slate-300 dark:text-slate-600 mt-0.5 shrink-0" />
      <div><div className="text-[11px] text-slate-400 dark:text-slate-500">{label}</div><div className="text-sm text-slate-800 dark:text-slate-100">{value||'-'}</div></div>
    </div>
  );
}
function EmpDetailModal({ e, manager, admin, onClose }){
  return (
    <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
      <div className="bg-white dark:bg-slate-800 rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto" onClick={ev=>ev.stopPropagation()}>
        <div className="bg-gradient-to-br from-rose-500 to-red-600 p-5 text-white flex items-center gap-4">
          <div className="w-16 h-16 rounded-full bg-white/20 flex items-center justify-center text-xl font-bold">{(e.name||'').slice(-2)}</div>
          <div className="flex-1">
            <div className="text-xl font-bold">{e.name} <span className="text-sm font-normal opacity-80">#{e.emp_no}</span></div>
            <div className="text-sm opacity-90">{[empTeamLabel(e),e.position].filter(Boolean).join(' · ')}</div>
          </div>
          <button onClick={onClose} className="text-white/80 hover:text-white"><Icon path="M18 6L6 18M6 6l12 12" className="w-6 h-6" /></button>
        </div>
        <div className="p-5 grid grid-cols-2 gap-x-4">
          <Row icon="M9 11l3 3L22 4" label="사원번호" value={e.emp_no} />
          <Row icon="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" label="직책" value={e.rank} />
          <Row icon="M8 7V3m8 4V3M3 11h18M5 5h14a2 2 0 012 2v12a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2z" label="입사일" value={fmtDate(e.join_date)} />
          <Row icon="M8 7V3m8 4V3M3 11h18M5 5h14a2 2 0 012 2v12a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2z" label="근속기간" value={tenure(e.join_date,e.last_work_day)} />
          <Row icon="M4 4h16v16H4zM4 8l8 5 8-5" label="이메일" value={e.email} />
          <Row icon="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" label="직속상사" value={manager?(manager.name+' ('+manager.position+')'):'-'} />
          {admin && <div className="col-span-2"><Row icon="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6" label="월급여" value={e.monthly_pay?(Number(e.monthly_pay).toLocaleString()+'원'):'-'} /></div>}
          <div className="col-span-2 border-t border-slate-100 dark:border-slate-700 mt-1 pt-1">

function orgTreeList(groups){
  const kids={}; groups.forEach(g=>{ if(g.parent_id)(kids[g.parent_id]=kids[g.parent_id]||[]).push(g); });
  Object.keys(kids).forEach(k=>kids[k].sort((a,b)=>(a.name||'').localeCompare(b.name||'')));
  const out=[];
  function walk(g,d){ out.push({g,d}); (kids[g.id]||[]).forEach(c=>walk(c,d+1)); }
  groups.filter(g=>!g.parent_id).forEach(r=>walk(r,0));
  // 부모가 목록에 없는(고아) 조직도 표시
  const seen=new Set(out.map(x=>x.g.id));
  groups.filter(g=>!seen.has(g.id)).forEach(g=>out.push({g,d:0}));
  return out;
}
