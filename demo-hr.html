    return ['-', (d.name||o.person_name||'-')];
  }

  const sections=[];
  // 1. 조직 신설 및 명칭 변경 (신설/변경/폐지)
  if(orgs.length) sections.push({ key:'org', heading:'조직 신설 및 명칭 변경', columns:['변경(전)','변경(후)','변경일자','비고'],
    rows:orgs.map(function(o){ var d=o.detail||{};
      var bef = o.order_type==='org_create' ? '-' : (o.order_type==='org_delete' ? (o.person_name||'-') : ((d.before&&d.before.name)||o.person_name||'-'));
      var aft = o.order_type==='org_create' ? (o.person_name||'-') : (o.order_type==='org_delete' ? '(폐지)' : ((d.after&&d.after.name)||o.person_name||'-'));
      return [ bef, aft, fmtK((o.detail&&o.detail.effective_date)||o.order_date), rsn(o)||'' ];
    }) });
  // 직위·직책 신설/폐지 (조직 신설 바로 다음)
  if(posDuty.length) sections.push({ key:'posduty', heading:'직위·직책 신설/폐지', columns:['구분','명칭','적용 범위·설명','비고'],
    rows:posDuty.map(o=>{ var d=o.detail||{}; return [ (ORDER_LABEL[o.order_type]||o.order_type), d.name||o.person_name||'-', d.scope||'-', rsn(o)||'' ]; }) });
  // 직위 신설(직위체계)
  if(posSchemes.length) sections.push({ key:'posscheme', heading:'직위 신설(직위체계)', columns:['적용 범위','기존','변경','비고'],
    rows:posSchemes.map(o=>{ var d=o.detail||{}; return [ d.scope||o.person_name||'-', (d.before||[]).join(', ')||'-', (d.after||[]).join(', ')||'-', rsn(o)||'' ]; }) });
  // 직책 변경 (승진/직무변경/강등)
  var titleRows=[];
  function teamPair(b){ var tb=(b.group_id?gname(b.group_id):b.team)||''; var ta=(b.group_id?gnameAfter(b.group_id):b.team)||''; return [ tb?tb+' ':'', ta?ta+' ':'' ]; }
  promos.forEach(function(o){ var d=o.detail||{}, b=d.before||{}, a=d.after||{}; var tp=teamPair(b); titleRows.push([ o.person_name||'-', (tp[0]+posDutyStr(b.position,b.rank)).trim(), (tp[1]+posDutyStr(a.position||b.position, a.rank||b.rank)).trim(), rsn(o)||'' ]); });
  jobChanges.forEach(function(o){ var d=o.detail||{}, b=d.before||{}, a=d.after||{}; var tp=teamPair(b); titleRows.push([ o.person_name||'-', (tp[0]+posDutyStr(b.position,b.rank)).trim(), (tp[1]+posDutyStr(a.position||b.position, a.rank||b.rank)).trim(), rsn(o)||'직무 변경' ]); });
  demotions.forEach(function(o){ var d=o.detail||{}, b=d.before||{}, a=d.after||{}; var tp=teamPair(b); titleRows.push([ o.person_name||'-', (tp[0]+posDutyStr(b.position,b.rank)).trim(), (tp[1]+posDutyStr(a.position||b.position, a.rank||b.rank)).trim(), rsn(o)||'강등' ]); });
  if(titleRows.length) sections.push({ key:'title', heading:'직책 변경', columns:['성명','변경(전)','변경(후)','비고'], rows:titleRows });
  // 신규 입사 (배치)
  if(hires.length) sections.push({ key:'hire', heading:'신규 입사', columns:['성명','배치 조직','직위/직책','비고'],
    rows:hires.map(function(o){ var a=(o.detail&&o.detail.after)||{}; var org=a.group_id?gnameAfter(a.group_id):(a.team||'-'); return [ o.person_name||'-', org||'-', posDutyStr(a.position,a.rank), rsn(o)||'신규 입사' ]; }) });
  // 전보
  if(transfers.length) sections.push({ key:'transfer', heading:'전보', columns:['성명','발령 전','발령 후','비고'],
    rows:transfers.map(o=>[ o.person_name||'-', tFrom(o), tTo(o), rsn(o)||'' ]) });
  // 겸직·겸직해제
  if(concurrents.length) sections.push({ key:'concurrent', heading:'겸직·겸직해제', columns:['구분','성명','대상 조직','직위','비고'],
    rows:concurrents.map(o=>{ var d=o.detail||{}; return [ o.order_type==='concurrent'?'겸직':'겸직해제', o.person_name||'-', d.group||'-', d.position||'-', rsn(o)||'' ]; }) });
  // 퇴사
  if(resigns.length) sections.push({ key:'resign', heading:'퇴사', columns:['성명','소속','사유','비고'],
    rows:resigns.map(o=>{ var d=o.detail||{}, b=d.before||{}; return [ o.person_name||'-', b.team||'-', rsn(o)||'', '-' ]; }) });
  if(miscs.length) sections.push({ key:'misc', heading:'기타 발령', columns:['성명','구분','대상','비고'],
    rows:miscs.map(o=>{ var d=o.detail||{}; return [ o.person_name||'-', (ORDER_LABEL[o.order_type]||o.order_type), d.group||'-', rsn(o)||'' ]; }) });

  // 사용자가 지정한 섹션 순서(secOrder) 적용 — 지정된 것 먼저, 나머지는 기본 순서 유지
  if(secOrder && secOrder.length){
    sections.sort(function(a,b){ var ia=secOrder.indexOf(a.key), ib=secOrder.indexOf(b.key); if(ia<0)ia=999; if(ib<0)ib=999; return ia-ib; });
  }

  // 발령문: 같은 사유(비고)끼리 묶이도록 각 섹션 행을 비고 기준 정렬
  sections.forEach(function(sec){ var lc=sec.columns.length-1; sec.rows.sort(function(a,b){ return String(a[lc]||'').localeCompare(String(b[lc]||'')); }); });

  var summaryItems=[];
  (function(){
    function add(key,text){ summaryItems.push({ key:key, text:text }); }
    var cr=orgs.filter(o=>o.order_type==='org_create').map(o=>o.person_name);
    var ce=orgs.filter(o=>o.order_type==='org_edit').map(o=>o.person_name);
    var cd=orgs.filter(o=>o.order_type==='org_delete').map(o=>o.person_name);
    if(cr.length) add('org','조직 신설 '+cr.length+'건 : '+cr.join(', '));
    if(ce.length) add('org','조직 명칭 변경 '+ce.length+'건 : '+ce.join(', '));
    if(cd.length) add('org','조직 폐지 '+cd.length+'건 : '+cd.join(', '));
    if(hires.length) add('hire','신규 입사 '+hires.length+'명 : '+hires.map(function(o){ var a=(o.detail&&o.detail.after)||{}; var org=a.group_id?gnameAfter(a.group_id):(a.team||''); var pd=posDutyStr(a.position,a.rank); return o.person_name+'('+(org?org+' ':'')+(pd==='-'?'':pd)+')'; }).join(', '));
    var titleCnt=promos.length+demotions.length+jobChanges.length;
    if(titleCnt) add('title','직책 변경 '+titleCnt+'명 : '+promos.map(function(o){ var a=(o.detail&&o.detail.after)||{}; return o.person_name+'('+(a.position||a.rank||'')+')'; })
      .concat(demotions.map(function(o){ var a=(o.detail&&o.detail.after)||{}; return o.person_name+'('+(a.position||a.rank||'')+' · 강등)'; }))
      .concat(jobChanges.map(function(o){ return o.person_name+'(직무변경)'; }))
      .join(', '));
    if(transfers.length) add('transfer','전보 '+transfers.length+'명 : '+transfers.map(o=>o.person_name).join(', '));
    if(concurrents.length) add('concurrent','겸직/겸직해제 '+concurrents.length+'건');
    posSchemes.forEach(function(o){ var d=o.detail||{}; add('posscheme','직위 신설 ('+(d.scope||o.person_name)+') : '+((d.before||[]).join('/')||'-')+' → '+((d.after||[]).join('/')||'-')); });
    if(posDuty.length) add('posduty','직위·직책 신설/폐지 '+posDuty.length+'건 : '+posDuty.map(function(o){ var d=o.detail||{}; return (ORDER_LABEL[o.order_type]||o.order_type)+'('+(d.name||o.person_name||'-')+')'; }).join(', '));
    if(miscs.length) add('misc','기타 발령 '+miscs.length+'건 : '+miscs.map(function(o){ return o.person_name+'('+(ORDER_LABEL[o.order_type]||o.order_type)+')'; }).join(', '));
    if(resigns.length) add('resign','퇴사 '+resigns.length+'명 : '+resigns.map(o=>o.person_name).join(', '));
  })();
  // 상세 내용의 사용자 지정 순서(secOrder)에 맞춰 요약 순서도 정렬
  if(secOrder && secOrder.length){
    summaryItems.sort(function(a,b){ var ia=secOrder.indexOf(a.key), ib=secOrder.indexOf(b.key); if(ia<0)ia=999; if(ib<0)ib=999; return ia-ib; });
  }
  const summary=summaryItems.map(function(x){ return x.text; });

  const STYLE='<style>.pdoc{font-family:"Malgun Gothic","맑은 고딕",AppleSDGothicNeo,sans-serif;color:#111;max-width:820px;margin:0 auto;padding:28px 30px;background:#fff;font-size:13px;line-height:1.65}.pdoc h1{text-align:center;font-size:23px;letter-spacing:10px;margin:6px 0 22px;font-weight:800}.pdoc .meta{margin:2px 0}.pdoc .rule{border:none;border-top:2px solid #1e293b;margin:14px 0}.pdoc h2{font-size:15px;margin:20px 0 8px;font-weight:700;border-left:4px solid #1e293b;padding-left:8px}.pdoc h3{font-size:13.5px;margin:14px 0 6px;font-weight:700}.pdoc table{border-collapse:collapse;width:100%;margin:6px 0 8px;table-layout:fixed}.pdoc th,.pdoc td{border:1px solid #94a3b8;padding:6px 8px;text-align:center;vertical-align:middle;word-break:break-all}.pdoc th{background:#eef2f7;font-weight:700}.pdoc td.l{text-align:left}.pdoc ul{margin:4px 0 4px;padding-left:20px}.pdoc li{margin:2px 0}.pdoc .end{text-align:right;margin:20px 6px 4px;font-weight:700}.pdoc .sign{text-align:center;margin-top:30px;line-height:2.1}.pdoc .sign .big{font-size:16px;font-weight:800;letter-spacing:2px}@media print{@page{margin:16mm}}</style>';

  function docHtml(){
    var h=STYLE+'<div class="pdoc">';
    h+='<h1>인 사 발 령 문</h1>';
    if(docNo.trim()) h+='<div class="meta"><b>문서번호</b> : '+esc(docNo)+'</div>';
    h+='<div class="meta"><b>제&nbsp;&nbsp;&nbsp;목</b> : '+esc(autoTitle)+'</div>';
    h+='<div class="meta"><b>발령일자</b> : '+fmtK(orderDate)+'</div>';
    h+='<hr class="rule">';
    var _sub=[];
    if(!hidePurpose) _sub.push(['목적', background]);
    if(!hideExpected) _sub.push(['기대효과', purpose]);
    if(_sub.length){
      h+='<h2>1. 인사발령 및 조직변경의 건</h2>';
      _sub.forEach(function(it,si){ var lab=ENUM[si]+'. '+it[0]; var txt=(it[1]||'').trim(); var lns=txt?txt.split(/\n/).map(function(x){return x.trim();}).filter(Boolean):[];
        if(lns.length<=1){ h+='<div>'+lab+' : '+(esc(lns[0]||'-'))+'</div>'; }
        else { h+='<div>'+lab+'</div><div style="padding-left:22px">'; lns.forEach(function(ln){ h+='<div>'+esc(ln)+'</div>'; }); h+='</div>'; }
      });
    }
    // 섹션 번호: 목적·기대효과가 있으면 요약=2/상세=3, 없으면 요약=1/상세=2
    var _n = _sub.length ? 2 : 1;
    h+='<h2>'+_n+'. 내용 요약</h2>';
    if(summary.length){ summary.forEach(function(s,si){ var lab=ENUM[si]?ENUM[si]:String(si+1); h+='<div>'+lab+'. '+esc(s)+'</div>'; }); }
    else h+='<div style="color:#888">선택된 발령이 없습니다.</div>';
    h+='<h2>'+(_n+1)+'. 상세 내용</h2>';
    if(!sections.length) h+='<div style="color:#888">표기할 상세 발령이 없습니다.</div>';
    var _TH='border:1px solid #94a3b8;padding:6px 8px;background:#eef2f7;font-weight:700;text-align:center';
    var _TDc='border:1px solid #94a3b8;padding:6px 8px;vertical-align:middle;text-align:center';
    var _TDl='border:1px solid #94a3b8;padding:6px 8px;vertical-align:middle;text-align:left';
    sections.forEach(function(sec,i){
      h+='<h3>'+ENUM[i]+'. '+esc(sec.heading)+'</h3>';
      h+='<table style="border-collapse:collapse;width:100%;margin:6px 0 8px"><thead><tr>';
      sec.columns.forEach(function(c){ h+='<th style="'+_TH+'">'+esc(c)+'</th>'; });
      h+='</tr></thead><tbody>';
      var LEFTCOLS={'비고':1};
      var lastCol=sec.columns.length-1;
      sec.rows.forEach(function(r,ri){ h+='<tr>'; r.forEach(function(cell,ci){ var st=LEFTCOLS[sec.columns[ci]]?_TDl:_TDc;
        if(ci===lastCol){
          if(ri>0 && String(sec.rows[ri-1][lastCol]||'')===String(r[lastCol]||'')) return;
          var span=1; for(var k=ri+1;k<sec.rows.length && String(sec.rows[k][lastCol]||'')===String(r[lastCol]||'');k++) span++;
          h+='<td style="'+st+'"'+(span>1?' rowspan="'+span+'"':'')+'>'+esc(cell)+'</td>';
        } else { h+='<td style="'+st+'">'+esc(cell)+'</td>'; }
      }); h+='</tr>'; });
      h+='</tbody></table>';
    });
    h+='<h2>'+(_n+2)+'. 시행일</h2>';
    h+='<div>'+fmtK(effDate)+'</div>';
    if((notice||'').trim()){
      h+='<h2>'+(_n+3)+'. 공지사항</h2>';
      h+='<div style="white-space:pre-wrap;line-height:1.7">'+esc(notice.trim())+'</div>';
    }
    h+='<div class="sign">'+fmtKorean(orderDate)+'<br><span class="big">'+esc(signer)+'</span> &nbsp;(직인 생략)</div>';
    h+='<div class="end">끝.</div>';
    h+='</div>';
    return h;
  }

  function printDoc(){
    var w=window.open('','_blank','width=920,height=1040');
    if(!w){ uiAlert('팝업이 차단되었습니다. 브라우저에서 팝업을 허용한 뒤 다시 시도하세요.'); return; }
    w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>'+esc(autoTitle)+'</title></head><body>'+docHtml()+'</bo'+'dy></html>');
    w.document.close(); w.focus();
    setTimeout(function(){ try{ w.print(); }catch(e){} }, 350);
  }
  function copyText(){
    var L=[]; L.push('인사발령문');
    if(docNo.trim()) L.push('문서번호 : '+docNo);
    L.push('제목 : '+autoTitle); L.push('발령일자 : '+fmtK(orderDate)); L.push('');
    var _cs=[]; if(!hidePurpose) _cs.push(['목적',background]); if(!hideExpected) _cs.push(['기대효과',purpose]);
    var _cn = _cs.length ? 2 : 1;
    if(_cs.length){
      L.push('1. 인사발령 및 조직변경의 건');
      _cs.forEach(function(it,si){ var lab='  '+ENUM[si]+'. '+it[0]; var lns=(it[1]||'').trim()?(it[1]).trim().split(/\n/).map(function(x){return x.trim();}).filter(Boolean):[];
        if(lns.length<=1){ L.push(lab+' : '+(lns[0]||'-')); } else { L.push(lab); lns.forEach(function(ln){ L.push('      '+ln); }); } });
      L.push('');
    }
    L.push(_cn+'. 내용 요약'); (summary.length?summary:['(없음)']).forEach(function(s,si){ var lab=summary.length?(ENUM[si]||String(si+1)):''; L.push('  '+(lab?(lab+'. '):'')+s); }); L.push('');
    L.push((_cn+1)+'. 상세 내용');
    sections.forEach(function(sec,i){ L.push('  '+ENUM[i]+'. '+sec.heading); L.push('    '+sec.columns.join(' | ')); sec.rows.forEach(function(r){ L.push('    '+r.join(' | ')); }); L.push(''); });
    L.push((_cn+2)+'. 시행일 : '+fmtK(effDate)); L.push('');
    if((notice||'').trim()){ L.push((_cn+3)+'. 공지사항'); notice.trim().split(/\n/).forEach(function(ln){ L.push('  '+ln); }); L.push(''); }
    L.push(fmtKorean(orderDate)); L.push(signer+' (직인 생략)'); L.push(''); L.push('끝.');
    var txt=L.join('\n');
    var html='<meta charset="utf-8">'+docHtml();
    try{
      if(navigator.clipboard && window.ClipboardItem){
        var item=new ClipboardItem({ 'text/html': new Blob([html],{type:'text/html'}), 'text/plain': new Blob([txt],{type:'text/plain'}) });
        navigator.clipboard.write([item]).then(function(){ flash&&flash('발령문이 복사되었습니다. 문서(워드·한글 등)에 붙여넣으면 표로 들어갑니다.'); }, function(){ if(navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function(){ flash&&flash('발령문 텍스트가 복사되었습니다'); },function(){ uiAlert('복사에 실패했습니다.'); }); });
        return;
      }
    }catch(e){}
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){ flash&&flash('발령문 텍스트가 복사되었습니다'); },function(){ uiAlert('복사에 실패했습니다.'); }); }
    else { uiAlert('이 브라우저에서는 복사를 지원하지 않습니다.'); }
  }

  return (
    <div className="fixed inset-0 bg-black/40 z-50 flex items-start justify-center p-4 overflow-y-auto">
      <div className="bg-white dark:bg-slate-800 rounded-2xl w-full max-w-7xl my-6 p-5" onClick={ev=>ev.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-bold text-slate-800 dark:text-slate-100">인사발령문 생성</h3>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">×</button>
        </div>
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
          <div className="lg:col-span-5 space-y-3">
            {ddraft && <div className="flex items-center justify-between gap-2 rounded-lg border border-amber-300 dark:border-amber-700 bg-amber-50 dark:bg-amber-950/40 px-3 py-2 text-[12px]">
              <span className="text-amber-700 dark:text-amber-300">임시저장된 발령문이 있습니다.</span>
              <span className="flex gap-2"><button type="button" onClick={restoreDraft} className="px-2 py-0.5 rounded bg-amber-600 text-white hover:bg-amber-700">불러오기</button><button type="button" onClick={discardDraft} className="px-2 py-0.5 rounded border border-amber-300 dark:border-amber-700 text-amber-700 dark:text-amber-300 hover:bg-amber-100 dark:hover:bg-amber-900/40">삭제</button></span>
            </div>}
            <div className="grid grid-cols-2 gap-2">
              <Field label="발령일자 (문서 날짜)"><input type="date" value={orderDate} onChange={e=>setOrderDate(e.target.value)} className="inp" /></Field>
              <Field label="시행일자 (4. 시행일)"><input type="date" value={effDate} onChange={e=>setEffDate(e.target.value)} className="inp" /></Field>
            </div>
            <Field label="제목 (비우면 자동 생성)"><input value={title} onChange={e=>setTitle(e.target.value)} className="inp" placeholder={autoTitle} /></Field>
            <Field label="문서번호 (선택)"><input value={docNo} onChange={e=>setDocNo(e.target.value)} className="inp" placeholder="예: 인사-2026-08" /></Field>
            <div>
              <div className="flex items-center justify-between"><span className="text-xs font-medium text-slate-600 dark:text-slate-300">목적</span><label className="text-[11px] text-slate-400 dark:text-slate-500 flex items-center gap-1 cursor-pointer"><input type="checkbox" checked={hidePurpose} onChange={e=>setHidePurpose(e.target.checked)} /> 사용하지 않음</label></div>
              <textarea value={background} onChange={e=>setBackground(e.target.value)} rows="2" disabled={hidePurpose} className="inp mt-1" placeholder="여러 개면 줄바꿈(엔터)으로 나눠 입력 · 예) 1. …↵2. …" />
            </div>
            <div>
              <div className="flex items-center justify-between"><span className="text-xs font-medium text-slate-600 dark:text-slate-300">기대효과</span><label className="text-[11px] text-slate-400 dark:text-slate-500 flex items-center gap-1 cursor-pointer"><input type="checkbox" checked={hideExpected} onChange={e=>setHideExpected(e.target.checked)} /> 사용하지 않음</label></div>
              <textarea value={purpose} onChange={e=>setPurpose(e.target.value)} rows="2" disabled={hideExpected} className="inp mt-1" placeholder="여러 개면 줄바꿈(엔터)으로 나눠 입력" />
            </div>
            <div>
              <span className="text-xs font-medium text-slate-600 dark:text-slate-300">공지사항 <span className="text-slate-400 font-normal">(시행 전 안내 · 선택)</span></span>
              <textarea value={notice} onChange={e=>setNotice(e.target.value)} rows="3" className="inp mt-1" placeholder="시행일 전 임직원에게 알릴 내용을 입력하세요. 예) 본 발령은 2026-08-01자로 시행됩니다. 관련 문의는 경영지원팀으로 바랍니다." />
              <p className="text-[11px] text-slate-400 dark:text-slate-500 mt-1">입력하면 발령문 하단 「공지사항」 항목으로 출력됩니다. 비워두면 표시되지 않습니다.</p>
            </div>
            <Field label="발령권자"><input value={signer} onChange={e=>setSigner(e.target.value)} className="inp" /></Field>
            <div>
              <div className="flex items-center justify-between mb-1">
                <span className="text-xs font-medium text-slate-600 dark:text-slate-300">포함할 발령 <span className="text-slate-400">({chosen.length}/{sortedOrders.length})</span></span>
                <span className="text-[11px]"><button onClick={()=>selAll(true)} className="text-indigo-500 hover:underline mr-2">전체선택</button><button onClick={()=>selAll(false)} className="text-slate-400 hover:underline">전체해제</button></span>
              </div>
              <div className="border border-slate-200 dark:border-slate-700 rounded-lg max-h-72 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-800">
                {sortedOrders.length===0 && <div className="px-3 py-4 text-center text-xs text-slate-400">발령 이력이 없습니다</div>}
                {sortedOrders.map(o=>{ const ba=docBA(o);
                  return (
                  <div key={o.id} className="flex items-start gap-2 px-3 py-2 text-xs hover:bg-slate-50 dark:hover:bg-slate-700/40">
                    <input type="checkbox" checked={!!sel[o.id]} onChange={()=>toggle(o.id)} className="mt-0.5 shrink-0" />
                    <label className="flex-1 min-w-0 cursor-pointer" onClick={()=>toggle(o.id)}>
                      <div className="flex items-center gap-1.5 flex-wrap">
                        <span className={"px-1.5 py-0.5 rounded-full whitespace-nowrap "+(ORDER_COLOR[o.order_type]||'bg-slate-100 text-slate-600')}>{ORDER_LABEL[o.order_type]||o.order_type}</span>
                        <span className="text-slate-800 dark:text-slate-100 font-semibold">{o.person_name}</span>
                        <span className="text-slate-400 dark:text-slate-500">발령 {fmtDate(o.order_date)} · 시행 {effOf(o)||'-'}</span>
                        {orderState(o)!=='done' && <span className={"px-1.5 py-0.5 rounded-full whitespace-nowrap text-[10px] "+(STATE_COLOR[orderState(o)]||'')}>{STATE_LABEL[orderState(o)]}</span>}
                      </div>
                      <div className="mt-0.5 text-slate-500 dark:text-slate-400">
                        <span className="text-slate-400">{ba[0]}</span> <span className="text-slate-400">→</span> <span className="text-slate-700 dark:text-slate-200 font-medium">{ba[1]}</span>
                        {(o.detail&&o.detail.reason)?<span className="text-slate-400 dark:text-slate-500"> · 사유: {o.detail.reason}</span>:null}
                      </div>
                    </label>
                    <button type="button" onClick={()=>setEditOrder(o)} className="text-indigo-500 dark:text-indigo-400 hover:underline whitespace-nowrap shrink-0 mt-0.5">수정</button>
                  </div>
                ); })}
              </div>
              <p className="text-[11px] text-slate-400 dark:text-slate-500 mt-1">발령일자와 같은 날짜의 발령이 기본 선택됩니다. 조직 신설 등 다른 날짜 건은 직접 체크하세요. 각 줄의 <b>수정</b>을 누르면 유형·대상·변경 전/후 값까지 모두 고칠 수 있고, 미리보기에 바로 반영됩니다.</p>
            </div>
            {activeSecKeys.length>1 && <div>
              <div className="flex items-center justify-between mb-1">
                <span className="text-xs font-medium text-slate-600 dark:text-slate-300">상세 내용 표기 순서 <span className="text-slate-400 font-normal">(가·나·다…)</span></span>
                <button type="button" onClick={()=>setSecOrder(DEFAULT_SEC_ORDER.slice())} className="text-[11px] text-slate-400 hover:underline">기본 순서로</button>
              </div>
              <div className="border border-slate-200 dark:border-slate-700 rounded-lg divide-y divide-slate-100 dark:divide-slate-800">
                {activeSecKeys.map(function(k,i){ return (
                  <div key={k} className="flex items-center gap-2 px-3 py-1.5 text-xs">
                    <span className="w-5 text-center font-bold text-indigo-500 dark:text-indigo-400">{ENUM[i]||(i+1)}</span>
                    <span className="flex-1 text-slate-700 dark:text-slate-200">{SEC_LABEL[k]||k}</span>
                    <button type="button" disabled={i===0} onClick={()=>moveSec(k,-1)} className="px-1.5 py-0.5 rounded border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-300 disabled:opacity-30 hover:bg-slate-50 dark:hover:bg-slate-700/40">▲</button>
                    <button type="button" disabled={i===activeSecKeys.length-1} onClick={()=>moveSec(k,1)} className="px-1.5 py-0.5 rounded border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-300 disabled:opacity-30 hover:bg-slate-50 dark:hover:bg-slate-700/40">▼</button>
                  </div>
                ); })}
              </div>
              <p className="text-[11px] text-slate-400 dark:text-slate-500 mt-1">▲▼로 상세 내용의 표기 순서를 바꾸면 미리보기와 가·나·다 번호가 즉시 반영됩니다.</p>
            </div>}
            <div className="flex gap-2 pt-1">
              <button onClick={printDoc} className="flex-1 px-3 py-2 text-sm bg-slate-900 text-white rounded-lg hover:bg-slate-800">🖨 인쇄 / PDF</button>
              <button onClick={copyText} className="px-3 py-2 text-sm bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-200 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700/40">복사(표 포함)</button>
              <button onClick={saveTemp} className="px-3 py-2 text-sm bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-200 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700/40">임시저장</button>
            </div>
          </div>
          <div className="lg:col-span-7">
            <div className="text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">미리보기</div>
            <div className="border border-slate-200 dark:border-slate-700 rounded-lg overflow-auto max-h-[80vh]">
              <div className="bg-white" dangerouslySetInnerHTML={{__html:docHtml()}} />
            </div>
          </div>
        </div>
      </div>
      {editOrder && <OrderEditModal o={editOrder} groups={groups} orders={orders} emps={emps} assigns={assigns} reload={reload} setBusy={setBusy} flash={flash} setErr={setErr} onClose={()=>setEditOrder(null)} />}
    </div>
  );
}
const PERSON_ORDER_TYPES=['transfer','promotion','demotion','job_change','dispatch','leave','return','standby','concurrent','concurrent_end','resign'];
const ORG_ORDER_TYPES=['org_create','org_edit','org_delete'];
const ITEM_ORDER_TYPES=['pos_create','pos_delete','duty_create','duty_delete'];
const STATUS_OPTIONS=['재직','휴직','대기발령','퇴사'];

// ── 발령 이력 수정: 모든 항목 수정 가능 ──
function OrderEditModal({ o, groups, orders, emps, assigns, reload, setBusy, flash, setErr, onClose }){
  const st0=orderState(o);
  const d0=o.detail||{};
  const b0=(d0.before && !Array.isArray(d0.before))?d0.before:{};
  const a0=(d0.after && !Array.isArray(d0.after))?d0.after:{};
  const gname=id=>{ const g=(groups||[]).find(x=>x.id===id); return g?g.name:(id||''); };
  const allEmps=(emps||[]);
  const [type,setType]=useState(o.order_type);
  const [date,setDate]=useState(d10(o.order_date));
  const [eff,setEff]=useState(effOf(o)||d10(o.order_date));
  const [empId,setEmpId]=useState(o.employee_id||'');
  const [pname,setPname]=useState(o.person_name||'');
  const [reason,setReason]=useState(d0.reason||'');
  const [bGroup,setBGroup]=useState(b0.group_id||'');
  const [bPos,setBPos]=useState(b0.position||'');
  const [bRank,setBRank]=useState(b0.rank||'');
  const [bStatus,setBStatus]=useState(b0.status||'재직');
  const [aGroup,setAGroup]=useState(a0.group_id||'');
  const [aPos,setAPos]=useState(a0.position||'');
  const [aRank,setARank]=useState(a0.rank||'');
  // 발령 이력에 상위조직·부제·팀라벨이 안 담긴 옛 기록이면, 해당 조직의 현재 값을 초기값으로 사용
  // (그냥 빈값으로 두면 저장·반영 시 기존 팀 라벨 색이 지워짐)
  const gCur=(groups||[]).find(function(x){ return x.id===(d0.id||''); })||null;
  const [orgId,setOrgId]=useState(d0.id||'');
  const [orgBefore,setOrgBefore]=useState(b0.name||(o.order_type==='org_delete'?(o.person_name||''):''));
  const [orgAfter,setOrgAfter]=useState(a0.name||(o.order_type!=='org_delete'?(o.person_name||''):''));
  const [orgParent,setOrgParent]=useState(a0.parent_id||b0.parent_id||(gCur?(gCur.parent_id||''):''));
  const [orgSub,setOrgSub]=useState(a0.subtitle||b0.subtitle||(gCur?(gCur.subtitle||''):''));
  const [orgTeam,setOrgTeam]=useState(a0.team||b0.team||(gCur?(gCur.team||''):''));
  const [cGroup,setCGroup]=useState(d0.group_id||gidByName(groups,d0.group)||'');
  const [cPos,setCPos]=useState(d0.position||'');
  const [cDisp,setCDisp]=useState(d0.display==='SUB'?'SUB':'MEMBER');
  const [itemName,setItemName]=useState(d0.name||o.person_name||'');
  const [itemScope,setItemScope]=useState(d0.scope||'');
  const [p1,setP1]=useState(Array.isArray(d0.before)?d0.before.join(', '):'');
  const [p2,setP2]=useState(Array.isArray(d0.after)?d0.after.join(', '):'');
  const [hGroup,setHGroup]=useState((o.order_type==='hire'?(a0.group_id||''):'')||'');
  const [hPos,setHPos]=useState((o.order_type==='hire'?(a0.position||''):'')||'');
  const [hRank,setHRank]=useState((o.order_type==='hire'?(a0.rank||''):'')||'');
  const [sync,setSync]=useState(st0==='done');
  const emp=allEmps.find(e=>e.id===empId);
  const isHire=type==='hire';
  const isPerson=PERSON_ORDER_TYPES.indexOf(type)>=0 || isHire;
  const isOrg=ORG_ORDER_TYPES.indexOf(type)>=0;
  const isItem=ITEM_ORDER_TYPES.indexOf(type)>=0;
  const myAssigns=(assigns||[]).filter(a=>a.employee_id===empId);

  function buildDetail(){
    var d=Object.assign({}, d0);
    delete d.before; delete d.after; delete d.group; delete d.group_id; delete d.position; delete d.name; delete d.scope;
    d.reason=reason;
    d.effective_date=eff||date;
    if(type==='hire'){
      var hg=(groups||[]).find(x=>x.id===hGroup);
      d.before={ group_id:(emp?emp.group_id:b0.group_id)||null, team:(emp?emp.team:(b0.team||''))||'', position:(emp?emp.position:b0.position)||null, rank:(emp?emp.rank:b0.rank)||null, status:(emp?emp.status:b0.status)||'재직' };
      d.after={ group_id:hGroup||null, team:(hg?hg.name:''), position:hPos||(emp?emp.position:'')||'', rank:hRank||(emp?emp.rank:'')||'' };
    } else if(type==='transfer'||type==='dispatch'){
      var bg=(groups||[]).find(x=>x.id===bGroup), ag=(groups||[]).find(x=>x.id===aGroup);
      d.before={ group_id:bGroup||null, team:(bg?bg.name:(b0.team||'')), position:bPos||null, rank:bRank||null, status:bStatus||'재직' };
      d.after={ group_id:aGroup||null, team:(ag?ag.name:'') };
      if(type==='dispatch') d.group=aGroup?gname(aGroup):'';
    } else if(type==='promotion'||type==='demotion'||type==='job_change'){
      d.before={ group_id:bGroup||null, team:(b0.team||''), position:bPos||null, rank:bRank||null, status:bStatus||'재직' };
      d.after={ position:aPos||null, rank:aRank||null };
    } else if(type==='leave'||type==='return'||type==='standby'||type==='resign'){
      d.before={ group_id:bGroup||null, team:(b0.team||''), position:bPos||null, rank:bRank||null, status:bStatus||'재직' };
    } else if(type==='concurrent'||type==='concurrent_end'){
      d.group_id=cGroup||null; d.group=cGroup?gname(cGroup):''; d.position=cPos||null; d.display=cDisp;
    } else if(type==='org_create'){
      d.id=orgId||('g_'+Date.now());
      d.after={ name:(orgAfter||'').trim(), subtitle:orgSub||'', parent_id:orgParent||null, team:orgTeam||'', is_staff:!!a0.is_staff, staff_side:a0.staff_side||null };
    } else if(type==='org_edit'){
      d.id=orgId||null;
      d.before={ name:(orgBefore||'').trim(), parent_id:(b0.parent_id!==undefined?b0.parent_id:orgParent)||null, subtitle:(b0.subtitle||''), team:(b0.team||''), is_staff:!!b0.is_staff, staff_side:b0.staff_side||null };
      d.after={ name:(orgAfter||'').trim(), parent_id:orgParent||null, subtitle:orgSub||'', team:orgTeam||'', is_staff:!!(a0.is_staff!==undefined?a0.is_staff:b0.is_staff), staff_side:(a0.staff_side!==undefined?a0.staff_side:b0.staff_side)||null };
    } else if(type==='org_delete'){
      d.id=orgId||null;
      d.before={ name:(orgBefore||'').trim(), subtitle:orgSub||'', parent_id:orgParent||null, team:orgTeam||'', is_staff:!!b0.is_staff, staff_side:b0.staff_side||null };
    } else if(isItem){
      d.name=(itemName||'').trim(); d.scope=(itemScope||'').trim();
    } else if(type==='position_scheme'){
      d.scope=(itemScope||'').trim();
      d.before=(p1||'').split(',').map(function(x){return x.trim();}).filter(Boolean);
      d.after=(p2||'').split(',').map(function(x){return x.trim();}).filter(Boolean);
    }
    d.applied=(st0==='done');
    if(st0!=='done' && isHeldOrder(o)) d.hold=true; else delete d.hold;
    return d;
  }
  function autoName(){
    if(isPerson) return (emp?emp.name:pname)||'';
    if(type==='org_delete') return (orgBefore||'').trim();
    if(isOrg) return (orgAfter||'').trim();
    if(isItem) return (itemName||'').trim();
    if(type==='position_scheme') return (itemScope||'').trim()||'직위체계';
    return pname;
  }
  async function save(){
    if(isHire){
      if(!empId){ uiAlert('대상 직원을 선택하세요.'); return; }
      if(!hGroup){ uiAlert('배치할 조직을 선택하세요.'); return; }
    }
    else if(isPerson && !empId){ uiAlert('대상 직원을 선택하세요.'); return; }
    if(isOrg && !((type==='org_delete'?orgBefore:orgAfter)||'').trim()){ uiAlert('조직 명칭을 입력하세요.'); return; }
    if(isItem && !(itemName||'').trim()){ uiAlert('명칭을 입력하세요.'); return; }
    if((type==='concurrent'||type==='concurrent_end') && !cGroup){ uiAlert('겸직 조직을 선택하세요.'); return; }
    const detail=buildDetail();
    const row={ order_type:type, order_date:date||o.order_date, employee_id:(isPerson?(empId||null):null), person_name:autoName()||pname, detail:detail };
    setBusy(true);
    let res=await sb.from('hr_orders').update(row).eq('id',o.id);
    if(!res.error && sync){
      const merged=Object.assign({}, o, row);
      const r2=await applyOrderNow(merged, { emps:emps, groups:groups });
      if(r2.error) res={ error:r2.error };
      else if(r2.skipped){ setBusy(false); await reload(); await uiAlert('저장했습니다.\n(반영 보류: '+(r2.note||'')+')'); onClose(); return; }
    }
    setBusy(false);
    if(res.error){ setErr(res.error.message); return; }
    await reload(); await uiAlert(sync?'수정 내용이 저장·반영되었습니다.':'수정되었습니다.\n(인사정보 반영은 하지 않았습니다.)'); onClose();
  }
  const gopt=(groups||[]).map(g=><option key={g.id} value={g.id}>{gLabel(g)}</option>);
  return (
    <div className="fixed inset-0 bg-black/40 z-[60] flex items-start justify-center p-4 overflow-y-auto">
      <div className="bg-white dark:bg-slate-800 rounded-2xl w-full max-w-lg my-6 p-5 max-h-[92vh] overflow-y-auto" onClick={ev=>ev.stopPropagation()}>
        <div className="flex items-center justify-between mb-1">
          <h3 className="font-bold text-slate-800 dark:text-slate-100">발령 이력 수정</h3>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">×</button>
        </div>
        <p className="text-xs text-slate-400 dark:text-slate-500 mb-3">
          <span className={"px-2 py-0.5 rounded-full mr-1 "+(STATE_COLOR[st0]||'')}>{STATE_LABEL[st0]}</span>
          등록 당시: {ORDER_LABEL[o.order_type]||o.order_type} · {o.person_name} · 발령일 {fmtDate(o.order_date)}
        </p>
        <div className="space-y-3">
          <Field label="발령 유형 (변경 가능)">
            <select value={type} onChange={e=>setType(e.target.value)} className="inp">
              {ORDER_TYPE_OPTIONS.map(function(x){ return <option key={x[0]} value={x[0]}>{x[1]}</option>; })}
            </select>
          </Field>
          <div className="grid grid-cols-2 gap-2">
            <Field label="발령일 (문서 날짜)"><input type="date" value={date} onChange={e=>setDate(e.target.value)} className="inp" /></Field>
            <Field label="시행일 (실제 반영일)"><input type="date" value={eff} onChange={e=>setEff(e.target.value)} className="inp" /></Field>
          </div>

          {isHire && <>
            <Field label="배치 조직"><select value={hGroup} onChange={e=>setHGroup(e.target.value)} className="inp"><option value="">선택</option>{gopt}</select></Field>
            <div className="grid grid-cols-2 gap-2">
              <Field label="직위"><PosPicker value={hPos} onChange={setHPos} kind="position" placeholder="예: 매니저" /></Field>
              <Field label="직책 (선택 · 보직자만)"><PosPicker value={hRank} onChange={setHRank} kind="duty" placeholder="예: 팀장 / 파트장" /></Field>
            </div>
            <p className="text-[11px] text-slate-400 dark:text-slate-500 -mt-1">신규 입사 배치입니다. 위에서 대상 직원(임직원 관리에서 이미 등록된)을 고르고, 배치할 조직·직위를 지정하세요.</p>
          </>}

          {isPerson && <>
            <Field label="대상 직원"><EmpPicker emps={allEmps} value={empId} onChange={id=>setEmpId(id)} /></Field>
            {emp && <div className="rounded-lg bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 px-3 py-2 text-[12px]">
              <span className="text-slate-400 dark:text-slate-500">현재 인사정보</span> <span className="text-slate-700 dark:text-slate-200 font-medium">{gname(emp.group_id)} · {posLabel(emp.position)||'-'}{emp.rank?(' · '+posLabel(emp.rank)):''} · {emp.status||'재직'}</span>
            </div>}
          </>}

          {(type==='transfer'||type==='dispatch') && <div className="grid grid-cols-2 gap-2">
            <Field label="변경 전 소속"><select value={bGroup} onChange={e=>setBGroup(e.target.value)} className="inp"><option value="">선택</option>{gopt}</select></Field>
            <Field label={type==='dispatch'?'파견 조직':'변경 후 소속'}><select value={aGroup} onChange={e=>setAGroup(e.target.value)} className="inp"><option value="">선택</option>{gopt}</select></Field>
          </div>}

          {(type==='promotion'||type==='demotion'||type==='job_change') && <>
            <div className="grid grid-cols-2 gap-2">
              <Field label="변경 전 직위"><PosPicker value={bPos} onChange={setBPos} kind="position" placeholder="변경 전 직위" /></Field>
              <Field label="변경 전 직책"><PosPicker value={bRank} onChange={setBRank} kind="duty" placeholder="변경 전 직책" /></Field>
              <Field label="변경 후 직위"><PosPicker value={aPos} onChange={setAPos} kind="position" placeholder="변경 후 직위" /></Field>
              <Field label="변경 후 직책"><PosPicker value={aRank} onChange={setARank} kind="duty" placeholder="변경 후 직책 (없으면 비움)" /></Field>
            </div>
            <Field label="변경 전 소속 (발령문 표기용)"><select value={bGroup} onChange={e=>setBGroup(e.target.value)} className="inp"><option value="">선택</option>{gopt}</select></Field>
          </>}

          {(type==='leave'||type==='return'||type==='standby'||type==='resign') && <div className="grid grid-cols-2 gap-2">

    <div className="relative">

      </div>}
    </div>
  );
}
function EmpPicker({ emps, value, onChange, placeholder }){

        const sd=await safeDeleteOrg(groupId);
        if(sd.blocked){ setBusy(false); uiAlert(sd.message); return; }
        if(sd.error){ setBusy(false); setErr(sd.error.message); return; }
      }
      r=await sb.from('hr_orders').insert({ order_date:date, order_type:'org_delete', person_name:g.name, detail:Object.assign({ id:g.id, before:snap, reason:(reason||'조직 폐지') }, FL) });
      setBusy(false);
      if(r.error){ setErr(r.error.message); return; }
      await reload(); await uiAlert(doneMsg('조직 폐지')); draftDel(ODKEY); onClose(); return;
    }
    if(type==='org_edit'){
      if(!groupId){ uiAlert('변경할 조직을 선택하세요'); return; }
      const g=groups.find(x=>x.id===groupId); if(!g){ uiAlert('조직을 찾을 수 없습니다'); return; }
      const nm=(newName||'').trim()||g.name;                 // 명칭을 비우면 기존 명칭 유지(색만 변경)
      const nteam=(orgTeam||'');
      const nameChanged=(nm!==g.name), teamChanged=(nteam!==(g.team||''));
      if(!nameChanged && !teamChanged){ uiAlert('새 명칭 또는 팀 라벨(색)을 변경하세요.\n(명칭만 그대로 두고 색만 바꿔도 등록됩니다)'); return; }
      setBusy(true);
      let r={ error:null };
      if(!RESERVE) r=await sb.from('org_groups').update({ name:nm, team:nteam }).eq('id',g.id);
      if(!r.error) r=await sb.from('hr_orders').insert({ order_date:date, order_type:'org_edit', person_name:nm, detail:Object.assign({ id:g.id, before:{ name:g.name, parent_id:g.parent_id, subtitle:g.subtitle||'', team:g.team||'', is_staff:!!g.is_staff, staff_side:g.staff_side||null }, after:{ name:nm, parent_id:g.parent_id, team:nteam }, reason:(reason||(nameChanged?'조직 명칭 변경':'조직도 색상(팀 라벨) 변경')) }, FL) });
      setBusy(false);
      if(r.error){ setErr(r.error.message); return; }
      await reload(); await uiAlert(doneMsg(nameChanged?'팀 명칭 변경':'팀 라벨(색) 변경')); draftDel(ODKEY); onClose(); return;
    }
    if(['pos_create','pos_delete','duty_create','duty_delete'].indexOf(type)>=0){
      if(!itemName.trim()){ uiAlert('명칭을 입력하세요'); return; }
      setBusy(true);
      const r=await sb.from('hr_orders').insert({ order_date:date, order_type:type, person_name:itemName.trim(), detail:Object.assign({ reason, scope:itemScope.trim(), name:itemName.trim() }, FL) });
      setBusy(false);
      if(r.error){ setErr(r.error.message); return; }
      const _m={ pos_create:'직위 신설', pos_delete:'직위 폐지', duty_create:'직책 신설', duty_delete:'직책 폐지' };
      await reload(); await uiAlert(doneMsg(_m[type])); draftDel(ODKEY); onClose(); return;
    }
    if(!empId){ uiAlert('대상 직원을 선택하세요'); return; }
    const before={ team:emp.team, position:emp.position, rank:emp.rank, group_id:emp.group_id, status:emp.status||'재직' };
    setBusy(true);
    let res={ error:null };
    if(type==='transfer'){
      if(!groupId || groupId===emp.group_id){ setBusy(false); uiAlert('이동할 조직을 선택하세요. (현재 소속과 다른 조직이어야 합니다)'); return; }
      const g=groups.find(x=>x.id===groupId); const patch={ group_id:groupId, team:g?g.name:emp.team };
      if(!RESERVE) res=await sb.from('employees').update(patch).eq('id',empId);
      if(!res.error) res=await sb.from('hr_orders').insert({ order_date:date, order_type:'transfer', employee_id:empId, person_name:emp.name, detail:Object.assign({ reason, before, after:{ group_id:patch.group_id, team:patch.team } }, FL) });
    } else if(type==='promotion' || type==='demotion'){
      const patch={}; if(position && position!==emp.position) patch.position=position; if(rank && rank!==emp.rank) patch.rank=rank;
      if(!Object.keys(patch).length){ setBusy(false); uiAlert('새 직위 또는 새 직책을 입력하세요. (현재 값과 달라야 합니다)'); return; }
      if(!RESERVE) res=await sb.from('employees').update(patch).eq('id',empId);
      if(!res.error) res=await sb.from('hr_orders').insert({ order_date:date, order_type:type, employee_id:empId, person_name:emp.name, detail:Object.assign({ reason, before, after:{ position:patch.position||emp.position, rank:patch.rank||emp.rank } }, FL) });
    } else if(type==='resign'){
      if(!RESERVE) res=await sb.from('employees').update({ last_work_day:EFF, status:'퇴사' }).eq('id',empId);
      if(!res.error) res=await sb.from('hr_orders').insert({ order_date:date, order_type:'resign', employee_id:empId, person_name:emp.name, detail:Object.assign({ reason, before }, FL) });
    } else if(type==='concurrent'){
      if(!groupId){ setBusy(false); uiAlert('겸직할 조직을 선택하세요'); return; }
      if(!RESERVE) res=await sb.from('employee_assignments').upsert({ employee_id:empId, group_id:groupId, position:position||emp.position, rank:rank||emp.rank, display:concDisp }, { onConflict:'employee_id,group_id' });
      if(!res.error) res=await sb.from('hr_orders').insert({ order_date:date, order_type:'concurrent', employee_id:empId, person_name:emp.name, detail:Object.assign({ reason, group:gname(groupId), group_id:groupId, position:position||emp.position, display:concDisp }, FL) });
    } else if(type==='concurrent_end'){
      if(!assignId){ setBusy(false); uiAlert('해제할 겸직을 선택하세요'); return; }
      const a=myAssigns.find(x=>String(x.id)===String(assignId));
      if(!RESERVE) res=await sb.from('employee_assignments').delete().eq('id',assignId);
      if(!res.error) res=await sb.from('hr_orders').insert({ order_date:date, order_type:'concurrent_end', employee_id:empId, person_name:emp.name, detail:Object.assign({ reason, group:a?gname(a.group_id):'', group_id:a?a.group_id:null, position:a?a.position:null }, FL) });
    } else if(type==='job_change'){
      const patch={}; if(position && position!==emp.position) patch.position=position; if(rank && rank!==emp.rank) patch.rank=rank;
      if(!RESERVE && Object.keys(patch).length) res=await sb.from('employees').update(patch).eq('id',empId);
      if(!res.error) res=await sb.from('hr_orders').insert({ order_date:date, order_type:'job_change', employee_id:empId, person_name:emp.name, detail:Object.assign({ reason, before, after:patch }, FL) });
    } else if(type==='dispatch'){
      res=await sb.from('hr_orders').insert({ order_date:date, order_type:'dispatch', employee_id:empId, person_name:emp.name, detail:Object.assign({ reason, before, group:(groupId?gname(groupId):'') }, FL) });
    } else if(type==='leave'){
      if(!RESERVE) res=await sb.from('employees').update({ status:'휴직' }).eq('id',empId);
      if(!res.error) res=await sb.from('hr_orders').insert({ order_date:date, order_type:'leave', employee_id:empId, person_name:emp.name, detail:Object.assign({ reason, before }, FL) });
    } else if(type==='return'){
      if(!RESERVE) res=await sb.from('employees').update({ status:'재직' }).eq('id',empId);
      if(!res.error) res=await sb.from('hr_orders').insert({ order_date:date, order_type:'return', employee_id:empId, person_name:emp.name, detail:Object.assign({ reason, before }, FL) });
    } else if(type==='standby'){
      res=await sb.from('hr_orders').insert({ order_date:date, order_type:'standby', employee_id:empId, person_name:emp.name, detail:Object.assign({ reason, before }, FL) });
    }
    setBusy(false);
    if(res.error){ setErr(res.error.message); return; }
    await reload(); await uiAlert(doneMsg('발령')); draftDel(ODKEY); onClose();
  }

  return (
    <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
      <div className="bg-white dark:bg-slate-800 rounded-2xl w-full max-w-md p-5 max-h-[92vh] overflow-y-auto" onClick={ev=>ev.stopPropagation()}>
        <h3 className="font-bold text-slate-800 dark:text-slate-100 mb-4">발령 등록</h3>
        {odraft && <div className="mb-3 flex items-center justify-between gap-2 rounded-lg border border-amber-300 dark:border-amber-700 bg-amber-50 dark:bg-amber-950/40 px-3 py-2 text-[12px]">
          <span className="text-amber-700 dark:text-amber-300">임시저장된 작성 내용이 있습니다.</span>
          <span className="flex gap-2"><button type="button" onClick={restoreDraft} className="px-2 py-0.5 rounded bg-amber-600 text-white hover:bg-amber-700">불러오기</button><button type="button" onClick={discardDraft} className="px-2 py-0.5 rounded border border-amber-300 dark:border-amber-700 text-amber-700 dark:text-amber-300 hover:bg-amber-100 dark:hover:bg-amber-900/40">삭제</button></span>
        </div>}
        <div className="space-y-3">
          {!['position_scheme','org_create','org_delete','org_edit','pos_create','pos_delete','duty_create','duty_delete'].includes(type) && <Field label="대상 직원">
            <EmpPicker emps={active} value={empId} onChange={id=>{ setEmpId(id); setAssignId(''); }} />
          </Field>}
          {!['position_scheme','org_create','org_delete','org_edit','pos_create','pos_delete','duty_create','duty_delete'].includes(type) && emp && <div className="rounded-lg bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 px-3 py-2 text-[12px]">
            <span className="text-slate-400 dark:text-slate-500">현재 인사정보</span> <span className="text-slate-700 dark:text-slate-200 font-medium">{gname(emp.group_id)} · 직위 {emp.position||'-'}{emp.rank?(' · 직책 '+emp.rank):''} · {emp.status||'재직'}</span>
            <div className="text-[11px] text-slate-400 dark:text-slate-500 mt-0.5">사번 {emp.emp_no||'-'} · 팀라벨 {emp.team||'-'} — 이 값이 실제 저장된 현재 정보입니다(시행 전 예약 발령은 반영되지 않습니다).</div>
          </div>}
          <Field label="발령 유형">
            <select value={type} onChange={e=>{ setType(e.target.value); setGroupId(''); setPosition(''); setRank(''); }} className="inp">
              {ORDER_TYPE_OPTIONS.map(function(o){ return <option key={o[0]} value={o[0]}>{o[1]}</option>; })}
            </select>
          </Field>
          <div className="grid grid-cols-2 gap-2">
            <Field label="발령일 (문서 날짜)"><input type="date" value={date} onChange={e=>setDate(e.target.value)} className="inp" /></Field>
            <Field label="시행일 (실제 반영일)"><input type="date" value={effDate} onChange={e=>setEffDate(e.target.value)} className="inp" /></Field>
          </div>
          {RESERVE
            ? <div className="rounded-lg bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800 px-3 py-2 text-[12px] text-amber-700 dark:text-amber-300">시행일이 미래이므로 <b>예약 등록</b>됩니다. 시행일({EFF})이 지나면 자동 반영되고, 그때까지 조직도·명부는 <b>발령 전 상태</b>로 유지됩니다.</div>
            : <div className="rounded-lg bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 px-3 py-2 text-[12px] text-slate-500 dark:text-slate-400">시행일이 오늘 이전이므로 저장 즉시 인사정보에 <b>반영</b>됩니다.</div>}

          {type==='hire' && <>
            <Field label="배치할 조직">
              <select value={groupId} onChange={e=>setGroupId(e.target.value)} className="inp"><option value="">선택</option>{groups.map(g=><option key={g.id} value={g.id}>{gLabel(g)}</option>)}</select>
            </Field>
            <div className="grid grid-cols-2 gap-2">
              <Field label="직위"><PosPicker value={position} onChange={setPosition} kind="position" placeholder={emp?(emp.position||'예: 매니저'):'예: 매니저'} /></Field>
              <Field label="직책 (선택 · 보직자만)"><PosPicker value={rank} onChange={setRank} kind="duty" placeholder="예: 팀장 / 파트장 (없으면 비움)" /></Field>
            </div>
            {emp && groupId && groupId!==emp.group_id && <div className="rounded-lg bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 px-3 py-2 text-[12px]"><span className="text-emerald-600 dark:text-emerald-400">배치 후 소속</span> <span className="text-slate-800 dark:text-slate-100 font-semibold">{gname(emp.group_id)} → {gname(groupId)}</span></div>}
            <p className="text-[11px] text-slate-400 dark:text-slate-500 -mt-1">임직원 관리에서 이미 등록된 신규 직원을 발령 배치합니다. <b>신규 조직에 배치</b>하려면 아래 <b>「+ 조직 신설 함께」</b>를 켜세요(직책자 입사 시 조직도 함께 생성).</p>
            <label className="flex items-center gap-2 text-sm text-slate-700 dark:text-slate-200 cursor-pointer"><input type="checkbox" checked={orgStaff} onChange={e=>setOrgStaff(e.target.checked)} /> + 조직 신설 함께 (새 조직을 만들어 이 직원을 배치)</label>
            {orgStaff && <div className="rounded-lg border border-slate-200 dark:border-slate-700 p-3 space-y-2">
              <Field label="새 조직명"><input value={orgName} onChange={e=>setOrgName(e.target.value)} className="inp" placeholder="예: 신설팀" /></Field>
              <div className="grid grid-cols-2 gap-2">
                <Field label="상위 조직"><select value={orgParent} onChange={e=>setOrgParent(e.target.value)} className="inp"><option value="">(최상위)</option>{groups.map(g=><option key={g.id} value={g.id}>{gLabel(g)}</option>)}</select></Field>
                <Field label="팀 라벨 (색상 그룹)"><TeamLabelPicker value={orgTeam} onChange={setOrgTeam} groups={groups} orders={orders} /></Field>
              </div>
              <p className="text-[11px] text-slate-400 dark:text-slate-500">새 조직이 먼저 생성되고, 위에서 고른 직원이 그 조직으로 배치됩니다. (배치할 조직 선택은 무시됩니다)</p>
            </div>}
          </>}
          {type==='transfer' && <>
            <Field label="이동할 조직">
              <select value={groupId} onChange={e=>setGroupId(e.target.value)} className="inp">
                <option value="">선택</option>{groups.map(g=><option key={g.id} value={g.id}>{gLabel(g)}</option>)}
              </select>
            </Field>
            {emp && moveOrgChanged && <div className="rounded-lg bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 px-3 py-2 text-[12px]"><span className="text-emerald-600 dark:text-emerald-400">변경 후 소속</span> <span className="text-slate-800 dark:text-slate-100 font-semibold">{gname(emp.group_id)} → {gname(groupId)}</span></div>}
          </>}
          {(type==='promotion'||type==='demotion') && <>
            <div className="grid grid-cols-2 gap-2">
              <Field label="새 직위"><PosPicker value={position} onChange={setPosition} kind="position" placeholder={emp?(emp.position||'매니저'):'매니저'} /></Field>
              <Field label="새 직책 (보직 변경 시)"><PosPicker value={rank} onChange={setRank} kind="duty" placeholder={emp?(emp.rank||'없으면 비움'):'없으면 비움'} /></Field>
            </div>
            {emp && movePosChanged && (function(){
              var np=position||emp.position, nr=rank||emp.rank;
              function fmt(pos,duty){ var parts=[]; if(pos) parts.push('직위 '+pos); if(duty && duty!==pos) parts.push('직책 '+duty); return parts.join(' · ')||'-'; }
              return <div className="rounded-lg bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 px-3 py-2 text-[12px]"><span className="text-emerald-600 dark:text-emerald-400">변경 후</span> <span className="text-slate-800 dark:text-slate-100 font-semibold">{fmt(emp.position,emp.rank)} → {fmt(np,nr)}</span></div>;
            })()}
          </>}

          {type==='concurrent' && <>
            <Field label="겸직할 조직">
              <select value={groupId} onChange={e=>setGroupId(e.target.value)} className="inp">
                <option value="">선택</option>{groups.filter(g=>g.id!==(emp&&emp.group_id)).map(g=><option key={g.id} value={g.id}>{gLabel(g)}</option>)}
              </select>
            </Field>
            <Field label="겸직 직위 (비우면 현재 직위)"><PosPicker value={position} onChange={setPosition} kind="position" placeholder={emp?emp.position:'예: 매니저'} /></Field>
            <Field label="조직도 표시 위치">
              <div className="flex rounded-lg border border-slate-300 dark:border-slate-600 overflow-hidden text-xs">
                <button type="button" onClick={()=>setConcDisp('MEMBER')} className={"flex-1 px-3 py-2 "+(concDisp==='MEMBER'?"bg-slate-900 text-white font-bold":"text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/40")}>구성원 목록</button>
                <button type="button" onClick={()=>setConcDisp('SUB')} className={"flex-1 px-3 py-2 "+(concDisp==='SUB'?"bg-slate-900 text-white font-bold":"text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/40")}>카드 부제</button>
              </div>
            </Field>
            <div className="rounded-lg bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 px-3 py-2 text-[11.5px] text-slate-500 dark:text-slate-400">
              {concDisp==='MEMBER'
                ? <span><b>구성원 목록</b> — 카드 안에 <b>겸 {(emp&&emp.name)||'이름'}  {position||(emp&&emp.position)||'직위'}</b> 한 줄로 추가됩니다. (다른 계통 조직에 실제로 일하는 겸직에 적합)</span>
                : <span><b>카드 부제</b> — 조직명 아래에 <b>겸 {position||(emp&&emp.rank)||(emp&&emp.position)||'직위'} {(emp&&emp.name)||'이름'}</b> 로 표시되고, 구성원 목록에는 나오지 않습니다. (상위 리더가 하위 조직을 겸임할 때 적합)</span>}
            </div>
            <p className="text-[11px] text-slate-400 dark:text-slate-500 -mt-1">겸직은 주 소속을 그대로 두고 선택한 조직에 "겸"으로 함께 표시됩니다. 인원수에는 포함되지 않습니다.</p>
          </>}

          {type==='concurrent_end' && <Field label="해제할 겸직">
            <select value={assignId} onChange={e=>setAssignId(e.target.value)} className="inp">
              <option value="">선택</option>
              {myAssigns.map(a=><option key={a.id} value={a.id}>{gname(a.group_id)} ({a.position||'-'})</option>)}
            </select>
            {empId && myAssigns.length===0 && <p className="text-[11px] text-slate-400 dark:text-slate-500 mt-1">이 직원에게 등록된 겸직이 없습니다.</p>}
          </Field>}

          {type==='position_scheme' && <>
            <Field label="적용 범위 (직군/조직)"><input value={scope} onChange={e=>setScope(e.target.value)} className="inp" placeholder="예: 비개발 직군 (품질·영업·지원)" /></Field>
            <Field label="기존 직위 (쉼표로 구분)"><input value={beforePos} onChange={e=>setBeforePos(e.target.value)} className="inp" placeholder="예: 매니저" /></Field>
            <Field label="변경 직위 (쉼표로 구분)"><input value={afterPos} onChange={e=>setAfterPos(e.target.value)} className="inp" placeholder="예: 매니저, 책임매니저, 수석매니저" /></Field>
            <div className="flex flex-wrap gap-1 -mt-1">{SCHEME_PRESETS.map(function(pp){ return <button key={pp[0]} type="button" onClick={()=>{ setScope(pp[0]); setBeforePos(pp[1]); setAfterPos(pp[2]); }} className="text-[11px] px-2 py-0.5 rounded-full border border-slate-200 dark:border-slate-600 text-slate-500 dark:text-slate-400 hover:border-indigo-400 hover:text-indigo-600">{pp[0]} 프리셋</button>; })}</div>
            <p className="text-[11px] text-slate-500 dark:text-slate-400 -mt-1">현행 체계: <b>매니저</b> → <b>책임매니저(파트장급)</b> → <b>수석매니저(팀장급)</b></p>
            <p className="text-[11px] text-slate-400 dark:text-slate-500 -mt-1">특정 직원 변경이 아니라 <b>직위 체계(호칭 단계) 신설·변경</b>을 기록합니다. 발령문에 「직위 신설」 항목으로 표기됩니다.</p>
          </>}

          {type==='org_create' && <>
            <Field label="조직명"><input value={orgName} onChange={e=>setOrgName(e.target.value)} className="inp" placeholder="예: 국내영업부" /></Field>

            <p className="text-[11px] text-slate-400 dark:text-slate-500 mt-1">소속 인원·하위 조직이 없어야 폐지할 수 있습니다.</p>

            <Field label="팀 라벨 (조직도 색상 그룹)">
              <TeamLabelPicker value={orgTeam} onChange={setOrgTeam} groups={groups} orders={orders} />
