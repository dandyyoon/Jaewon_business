          String(r.memo || "").slice(0, 40)].join("|");
}

/* ── 프로젝트 코드 체크 화면 ────────────────────────────── */
function ScreenProj() {
  const st = useStatus();
  const auth = useAuth();

  const [mode, setMode] = useState("sale");        /* sale 매출 · cost 비용 */
  const [pjRows, setPjRows] = useState(null);      /* f_projects (보조 잣대) */
  const [pjErr, setPjErr] = useState("");
  const [stdFile, setStdFile] = useState(true);    /* 잣대를 파일의 프로젝트명 칸에서 */

  const [fname, setFname] = useState("");
  const [shs, setShs] = useState([]);
  const [shPick, setShPick] = useState("");
  const [hdr, setHdr] = useState(null);
  const [rows, setRows] = useState([]);
  const [openMap, setOpenMap] = useState(false);
  const [drag, setDrag] = useState(false);
  const [busy, setBusy] = useState("");
  const [err, setErr] = useState("");

  const [slkOn, setSlkOn] = useState(true);        /* 슬랙 발행요청과 견줄까 */
  const [slkDays, setSlkDays] = useState(400);
  const [slkRows, setSlkRows] = useState([]);
  const [slkForms, setSlkForms] = useState([]);
  const [slkRepl, setSlkRepl] = useState({});
  const [slkErr, setSlkErr] = useState("");
  const [slkBusy, setSlkBusy] = useState(false);

  const [acctSel, setAcctSel] = useState(paLoad);
  const [open, setOpen] = useState("");
  const [detail, setDetail] = useState(null);
  const [done, setDone] = useState(pjLoad);
  const [hideDone, setHideDone] = useState(false);

  /* f_projects — 있으면 보조 잣대로 씁니다 (없어도 화면은 그대로 돕니다) */
  const loadPj = useCallback(async function () {
    const r = await rpc("f_projects", {});
    if (r.error) { setPjErr(r.error.message); setPjRows([]); }
    else { setPjErr(""); setPjRows(safe(r)); }
  }, []);
  useEffect(function () { loadPj(); }, [loadPj]);

  /* ★ 슬랙 세금계산서 발행요청 — 매출 검증의 잣대   (재무리드 2026-09-09)
        「관리-재무 채널에 댓글로 어떤 매출로 잡아야 하는지도 있는데 이것도 체크가 같이 될 수 있나요?」
        발행요청 양식에서 프로젝트명·회사명·금액·발행일을, 스레드 댓글에서 회계처리를 읽습니다. */
  const loadSlk = useCallback(async function () {
    setSlkBusy(true);
    const rs = await Promise.all([
      rpc("f_slack_requests", { p_kind: null, p_state: null, p_days: slkDays }),
      rpc("f_slack_form_all", { p_days: slkDays }),
      rpc("f_slack_replies", { p_days: slkDays }),
    ]);
    if (rs[0].error) {
      setSlkErr(rs[0].error.message); setSlkRows([]); setSlkForms([]); setSlkRepl({});
    } else {
      setSlkErr("");
      setSlkRows(safe(rs[0]));
      setSlkForms(safe(rs[1]));
      const m = {};
      safe(rs[2]).forEach(function (x) { if (x && x.slack_id) m[x.slack_id] = x; });
      setSlkRepl(m);
    }
    setSlkBusy(false);
  }, [slkDays]);
  useEffect(function () { if (slkOn) loadSlk(); }, [slkOn, loadSlk]);

  /* ① 분개장 올리기 */
  async function onFile(file) {
    if (!file) return;
    setErr(""); setBusy("분개장을 읽는 중…"); st.setSaving("분개장을 읽는 중…");
    try {
      const X = await loadXLSX();
      const buf = await file.arrayBuffer();
      const wb = X.read(buf, { type: "array", cellDates: true });
      const list = wb.SheetNames.map(function (nm) {
        const aoa = X.utils.sheet_to_json(wb.Sheets[nm], { header: 1, raw: true, blankrows: true, defval: null });
        return { name: nm, aoa: aoa, n: aoa.filter(function (r) {
          return (r || []).some(function (v) { return String(v == null ? "" : v).trim() !== ""; }); }).length };
      }).filter(function (x) { return x.n > 1; });
      if (!list.length) throw new Error("이 파일에는 읽을 내용이 없습니다.");
      setShs(list); setFname(file.name);
      const best = list.slice().sort(function (a, b) { return b.n - a.n; })[0];
      useSheet(best.name, list);
    } catch (e) { setErr(e.message || String(e)); st.setError("분개장을 읽지 못했습니다"); }
    setBusy("");
  }
  function useSheet(nm, all) {
    const one = (all || shs).filter(function (x) { return x.name === nm; })[0];
    if (!one) return;
    const hd = findJeHeader(one.aoa);
    const rs = readJe(one.aoa, hd);
    setShPick(nm); setHdr(hd); setRows(rs); setOpen("");
    setOpenMap(hd.hit < 5);
    if (rs.length) st.setSaved(num(rs.length) + "줄을 읽었습니다");
    else st.setEditing("칸을 맞춰 주세요");
  }
  function remap(k, v) {
    if (!hdr) return;
    const map = Object.assign({}, hdr.map);
    if (v === "") delete map[k]; else map[k] = Number(v);
    const hd = Object.assign({}, hdr, { map: map });
    const one = shs.filter(function (x) { return x.name === shPick; })[0];
    setHdr(hd);
    if (one) setRows(readJe(one.aoa, hd));
    st.setEditing("칸을 고쳤습니다");
  }
  function rawOf(k) {
    const one = shs.filter(function (x) { return x.name === shPick; })[0];
    if (!one || !hdr || hdr.map[k] === undefined) return "";
    for (let r = hdr.r + 1; r < Math.min(hdr.r + 14, one.aoa.length); r++) {
      const v = String(cell(one.aoa[r] || [], hdr.map[k])).trim();
      if (v) return v.slice(0, 24);
    }
    return "";
  }

  /* ── 잣대 ① 프로젝트 — 파일의 「프로젝트명」 칸이 아마란스 프로젝트 마스터입니다 */
  const fileProj = useMemo(function () {
    const c = {};
    rows.forEach(function (r) { if (r.proj) c[r.proj] = (c[r.proj] || 0) + 1; });
    return Object.keys(c).map(function (k) { return { code: k, name: k, n: c[k] }; });
  }, [rows]);
  const bookFile = useMemo(function () { return projBook(fileProj); }, [fileProj]);
  const bookDb = useMemo(function () { return projBook(pjRows || []); }, [pjRows]);
  const bk = (stdFile && bookFile.codes.length) ? bookFile : bookDb;
  const stdName = (stdFile && bookFile.codes.length) ? "파일의 프로젝트명 칸" : "프로젝트 표(f_projects)";

  /* ── 잣대 ② 계정 — 전표에 실제로 쓰인 계정 이름 전수 */
  const voc = useMemo(function () {
    const v = {};
    rows.forEach(function (r) { if (r.acct && r.acct.length >= 2) v[r.acct] = (v[r.acct] || 0) + 1; });
    return v;
  }, [rows]);

  /* ── 계정 고르기 — 계정코드 첫자리로 기본을 정합니다 */
  const acctList = useMemo(function () {
    const m = {};
    rows.forEach(function (r) {
      const k = r.acct || "(계정 없음)";
      if (!m[k]) m[k] = { acct: k, cls: r.cls, acode: r.acode, n: 0, amt: 0, dr: 0, cr: 0 };
      m[k].n += 1; m[k].amt += n0(r.amt);
      if (r.side === "대변") m[k].cr += 1; else m[k].dr += 1;
    });
    return Object.keys(m).map(function (k) { return m[k]; })
      .sort(function (a, b) { return Math.abs(b.amt) - Math.abs(a.amt); });
  }, [rows]);
  function defOn(a) {
    if (a.cls) {                                  /* 계정코드가 있으면 그것으로 가릅니다 */
      if (mode === "sale") return a.cls === "4";
      return a.cls === "8" || a.acode === PREPAID; /* 비용 + 콘텐츠선급금 */
    }
    /* 계정코드가 없는 파일 — 이름으로 짐작합니다 */
    if (mode === "sale") return /매출|수익/.test(a.acct) && !/외상|미수|받을|선수|부가세/.test(a.acct);
    return !/매출|수익|외상|미수|받을|선수|부가세|보통예금|현금|미지급|예수금/.test(a.acct) && a.dr >= a.cr;
  }
  function isOn(a) {
    const v = acctSel[mode + "|" + a.acct];
    return v === undefined ? defOn(a) : v;
  }
  function toggleAcct(a) {
    const to = !isOn(a);
    const next = Object.assign({}, acctSel);
    next[mode + "|" + a.acct] = to;
    st.setSaving("보는 계정을 바꾸는 중…");
    setAcctSel(next);
    paSave(next) ? st.setSaved(a.acct + " 을 " + (to ? "넣었습니다" : "뺐습니다"))
                 : st.setEditing(a.acct + " 을 " + (to ? "넣었습니다" : "뺐습니다"));
  }
  function resetAcct() {
    st.setSaving("기본으로 돌리는 중…");
    setAcctSel({});
    paSave({}) ? st.setSaved("기본으로 돌렸습니다") : st.setError("지우지 못했습니다");
  }
  const onMap = useMemo(function () {
    const m = {};
    acctList.forEach(function (a) { if (isOn(a)) m[a.acct] = true; });
    return m;
  }, [acctList, acctSel, mode]);
  const scope = useMemo(function () {
    return rows.filter(function (r) { return onMap[r.acct || "(계정 없음)"]; });
  }, [rows, onMap]);
  /* ★ 검산 — 파일 전체를 한 줄도 빼지 않고 다시 셉니다 (재무리드 2026-09-09) */
  const tot = useMemo(function () {
    const one = shs.filter(function (x) { return x.name === shPick; })[0];
    if (!one || !hdr) return null;
    return jeTotals(one.aoa, hdr);
  }, [shs, shPick, hdr]);
  /* 검사 범위의 차변·대변·순액 — 매출은 차변에 「차감」 이 옵니다 */
  const side = useMemo(function () {
    let dr = 0, cr = 0;
    scope.forEach(function (r) { if (r.side === "대변") cr += n0(r.amt); else dr += n0(r.amt); });
    return { dr: dr, cr: cr, net: mode === "sale" ? cr - dr : dr - cr };
  }, [scope, mode]);

  /* ── 잣대 ③ 거래처별 매출계정 (매출에서만) */
  const sBook = useMemo(function () {
    if (mode !== "sale") return null;
    const m = {};
    rows.filter(function (r) { return r.cls === "4"; }).forEach(function (r) {
      const k = r.party || "(거래처없음)";
      if (!m[k]) m[k] = { acc: {}, n: 0, top: "" };
      m[k].acc[r.acct] = (m[k].acc[r.acct] || 0) + 1; m[k].n += 1;
    });
    Object.keys(m).forEach(function (k) {
      const e = Object.keys(m[k].acc).sort(function (a, b) { return m[k].acc[b] - m[k].acc[a]; });
      m[k].top = e[0] || "";
    });
    return m;
  }, [rows, mode]);

  /* ── 슬랙 발행요청 장부 — 금액을 열쇠로 씁니다 (금액이 같은 것만 짝 후보) */
  const sk = useMemo(function () {
    if (mode !== "sale" || !slkOn || !slkRows.length) return null;
    const book = {};
    let n = 0, withAcct = 0;
    slkRows.forEach(function (r) {
      if (groupOf(r.kind) !== "tax") return;                 /* 세금계산서 발행요청만 */
      const form = slkForms.filter(function (f) { return f.msg_id === r.id; });
      const b = reqFields(r, form, "tax");
      const amt = Math.round(Math.abs(n0(b.amount)));
      if (!amt) return;
      const rp = slkRepl[r.id];
      const acct = slkSaleAcct((rp && (rp.text || rp.body || rp.replies)) || "", voc);
      const one = { id: r.id, amt: amt, co: coFlat(b.company), company: b.company || "",
                    project: b.project || "", dt: b.issDate || String(r.posted_at || "").slice(0, 10),
                    item: b.item || "", acct: acct, link: r.permalink || "" };
      if (!book[amt]) book[amt] = [];
      book[amt].push(one);
      n += 1; if (acct) withAcct += 1;
    });
    return { book: book, n: n, withAcct: withAcct };
  }, [mode, slkOn, slkRows, slkForms, slkRepl, voc]);

  /* ── 검사 */
  const found = useMemo(function () {
    if (!scope.length) return [];
    const out = [];
    scope.forEach(function (r) {
      projCheck(r, bk, voc, mode, sBook, sk).forEach(function (c) {
        out.push(Object.assign({ r: r, key: pjKey(r, c.k) }, c));
      });
    });
    return out;
  }, [scope, bk, voc, mode, sBook, sk]);
  /* 몇 줄이 발행요청과 짝지어졌나 */
  const skStat = useMemo(function () {
    if (!sk) return null;
    let hit = 0, miss = 0;
    scope.forEach(function (r) { if (slkMatch(r, sk.book)) hit += 1; else miss += 1; });
    return { hit: hit, miss: miss };
  }, [scope, sk]);
  const grp = useMemo(function () {
    const m = {};
    found.forEach(function (f) {
      if (!m[f.k]) m[f.k] = { k: f.k, n: 0, amt: 0, list: [], ok: 0 };
      m[f.k].n += 1; m[f.k].amt += n0(f.r.amt); m[f.k].list.push(f);
      if (done[f.key]) m[f.k].ok += 1;
    });
    return PROJ_ORDER.filter(function (k) { return m[k]; }).map(function (k) { return m[k]; });
  }, [found, done]);
  const kpi = useMemo(function () {
    const bad = {}, warn = {}, hit = {};
    found.forEach(function (f) {
      hit[f.r.id] = 1;
      if ((PROJ_KIND[f.k] || {}).tone === "bad") bad[f.r.id] = 1; else warn[f.r.id] = 1;
    });
    const codes = {};
    scope.forEach(function (r) { const c = projPick(r.memo, bk).code; if (c) codes[c] = 1; });
    return { bad: Object.keys(bad).length, warn: Object.keys(warn).length,
             clean: scope.length - Object.keys(hit).length, codes: Object.keys(codes).length,
             amt: scope.reduce(function (a, r) { return a + n0(r.amt); }, 0) };
  }, [scope, found, bk]);
  const mm = useMemo(function () {
    let both = 0, diff = 0, only = 0, none = 0;
    scope.forEach(function (r) {
      const c = projPick(r.memo, bk).code;
      if (!r.proj) { none += 1; return; }
      if (!c) { only += 1; return; }
      both += 1;
      if (projFlat(r.proj) !== projFlat(c)) diff += 1;
    });
    return { both: both, diff: diff, only: only, none: none };
  }, [scope, bk]);
  const byProj = useMemo(function () {
    const m = {};
    scope.forEach(function (r) {
      const c = projPick(r.memo, bk).code || "(이름 없음)";
      if (!m[c]) m[c] = { code: c, n: 0, amt: 0, ok: !!bk.byCode[c] };
      m[c].n += 1; m[c].amt += n0(r.amt);
    });
    return Object.keys(m).map(function (k) { return m[k]; })
      .sort(function (a, b) { return Math.abs(b.amt) - Math.abs(a.amt); });
  }, [scope, bk]);

  function markDone(f, on) {
    const next = Object.assign({}, done);
    if (on) next[f.key] = { at: Date.now(), who: (auth && auth.name) || "" };
    else delete next[f.key];
    st.setSaving(on ? "확인 표시를 남기는 중…" : "확인 표시를 지우는 중…");
    setDone(next);
    pjSave(next) ? st.setSaved(on ? "확인했다고 남겼습니다" : "확인 표시를 지웠습니다")
                 : st.setError("이 브라우저에 남기지 못했습니다");
  }
  function clearAll() {
    st.setSaving("확인 표시를 모두 지우는 중…");
    setDone({});
    pjSave({}) ? st.setSaved("모두 지웠습니다") : st.setError("지우지 못했습니다");
  }

  /* ── 엑셀로 내려받기 ─────────────────────────────── */
  async function toExcel() {
    if (!found.length) return;
    setBusy("엑셀을 만드는 중…"); st.setSaving("엑셀을 만드는 중…");
    try {
      const E = await loadExcelJS();
      const wb = new E.Workbook();
      const label = mode === "sale" ? "매출" : "비용";
      const ws = wb.addWorksheet(label + " 체크");
      const thin = { style: "thin", color: { argb: "FFBFBFBF" } };
      const BOX = { top: thin, left: thin, bottom: thin, right: thin };
      const fnt = function (sz, bold) { return { name: XL_FONT, size: sz, bold: !!bold }; };
      const HEAD = ["체크 포인트", "체크 필요", "일자", "전표번호", "차대", "계정과목", "거래처",
                    "적요", "금액", "프로젝트 칸", "읽은 것", "이렇게 고치세요", "확인함"];
      ws.columns = [{ width: 30 }, { width: 7 }, { width: 12 }, { width: 13 }, { width: 7 },
                    { width: 16 }, { width: 20 }, { width: 50 }, { width: 16 }, { width: 15 },
                    { width: 14 }, { width: 18 }, { width: 9 }];
      ws.getCell(1, 1).value = label + " 프로젝트·계정 체크 — " + today()
        + " · 잣대 : " + stdName + " " + bk.codes.length + "가지 · 검사 " + scope.length + "줄";
      ws.getCell(1, 1).font = fnt(12, true);
      ws.mergeCells(1, 1, 1, HEAD.length);
      HEAD.forEach(function (t, i) {
        const c = ws.getCell(3, i + 1);
        c.value = t; c.font = fnt(10, true); c.border = BOX;
        c.alignment = { horizontal: "center", vertical: "middle" };
        c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: XL_HEAD_BG } };
      });
      let R = 4;
      PROJ_ORDER.forEach(function (k) {
        found.filter(function (f) { return f.k === k; }).forEach(function (f) {
          const K = PROJ_KIND[k] || {};
          const v = [K.tag || k, K.tone === "bad" ? "체크 필요" : "확인", String(f.r.dt || "").slice(0, 10),
                     f.r.no || "", f.r.side || "", f.r.acct || "", f.r.party || "", f.r.memo || "",
                     n0(f.r.amt), f.r.proj || "", f.got || "", f.fix || "", done[f.key] ? "✓" : ""];
          v.forEach(function (val, i) {
            const c = ws.getCell(R, i + 1);
            if (val !== "" && val !== null) c.value = val;
            c.font = fnt(10, i === 11); c.border = BOX;
            c.alignment = { vertical: "middle", wrapText: i === 7 };
            if (i === 8) c.numFmt = XF_MONEY;
            if (i === 1 && K.tone === "bad")
              c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: XL_WARN_BG } };
          });
          R += 1;
        });
      });
      ws.views = [{ state: "frozen", ySplit: 3 }];
      ws.autoFilter = { from: { row: 3, column: 1 }, to: { row: Math.max(3, R - 1), column: HEAD.length } };

      const hw = wb.addWorksheet("읽는 법");
      hw.columns = [{ width: 4 }, { width: 32 }, { width: 96 }];
      hw.getCell(1, 2).value = label + " 프로젝트·계정 체크 — 읽는 법";
      hw.getCell(1, 2).font = fnt(12, true);
      let HR = 3;
      [["적요 규칙", "프로젝트명) 계정명_내용 — 맨 앞의 「프로젝트명)」 한 겹과, 그 뒤 계정명을 봅니다."],
       ["프로젝트 잣대", stdName + " " + bk.codes.length + "가지"],
       ["본 범위", label + " · 계정 " + Object.keys(onMap).length + "가지 · " + num(scope.length) + "줄 · " + won(kpi.amt)],
       ["결과", "맞는 줄 " + num(kpi.clean) + " · 체크 필요 " + num(kpi.bad) + "줄 · 확인할 것 " + num(kpi.warn) + "줄"],
       [(mode === "sale" ? "순매출" : "순비용"),
        won(side.net) + "   (대변 " + won(side.cr) + " · 차변 " + won(side.dr) + ")"],

          onChange: function (e) { setPw(e.target.value); } })),
      err ? h("div", { className: "warnbox", style: { marginBottom: 12, borderLeftColor: "var(--bad)", background: "var(--bad-bg)", color: "var(--bad)" } }, "⛔ " + err) : null,
      h("button", { className: "btn primary", type: "submit", disabled: busy, style: { width: "100%" } },
        busy ? h(React.Fragment, null, h("i", { className: "spin" }), " 로그인 중…") : "로그인"),
      h("p", { className: "muted", style: { fontSize: 11.5, marginTop: 15, textAlign: "center", lineHeight: 1.8 } },
        "계정은 관리자가 발급합니다. 권한(재무팀원 / 열람자 등)에 따라 보이는 정보가 다릅니다."),
      h("p", { className: "muted", style: { fontSize: 10.5, marginTop: 8, textAlign: "center" } }, APP_VERSION)));
}

function Shell() {
  const auth = useAuth();
  const per = usePeriod();
  const ui = useUi();
  const [penOpen, setPenOpen] = useState(false);
  const [tab, setTab] = useState(function () {
    try { return localStorage.getItem("tab") || "cal"; } catch (e) { return "cal"; }
  });
  const [open, setOpen] = useState(false);   // 폰에서 왼쪽 서랍이 열려 있는가

  const go = useCallback(function (k) {
    setTab(k);
    setOpen(false);
    try { localStorage.setItem("tab", k); } catch (e) {}
    window.scrollTo({ top: 0, behavior: "smooth" });
  }, []);

  // 서랍이 열려 있는 동안에는 뒤쪽이 밀리지 않게 잠급니다
  useEffect(function () {
    if (!open) return;
    const y = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return function () { document.body.style.overflow = y; };
  }, [open]);

  if (!auth.ready) {
    return h("div", { style: { padding: 40, textAlign: "center", color: "var(--mut)", fontWeight: 700 } }, "확인하는 중…");
  }
  if (!auth.email) return h(Login, null);

  const cur = TABS.filter(function (t) { return t.k === tab; })[0] || TABS[0];

  return h("div", { className: "app" },

    /* ── 왼쪽 탭 ─────────────────────────────────────── */
    h("aside", { className: "side" + (open ? " on" : ""), id: "side" },
      h("div", { className: "side-h" },
        h("div", { className: "brand" },
          h("span", { className: "logo", role: "img", "aria-label": "3Y" }),
          h("span", { style: { minWidth: 0 } }, "재무관리시스템", h("small", null, APP_VERSION)))),
      h("nav", { className: "side-n", role: "tablist", "aria-label": "화면 고르기" },
        GROUPS.map(function (G) {
          return h("div", { key: G.g, className: "side-gp" },
            h("div", { className: "side-g" }, h("b", null, G.label), h("span", null, G.sub)),
            TABS.filter(function (t) { return t.g === G.g; }).map(function (t) {
              return h("button", { key: t.k, role: "tab", "aria-selected": tab === t.k,
                className: "tab" + (tab === t.k ? " on" : ""),
                onClick: function () { go(t.k); } },
                h("i", { style: { background: t.c } }),
                h("span", { style: { minWidth: 0 } },
                  h("b", null, t.label),
                  h("span", { className: "td" }, ui.get("tab." + t.k, t.d))));
            }));
        })),
      h("div", { className: "side-f" },
        h("div", { className: "muted", style: { fontSize: 9.5, fontWeight: 900, marginBottom: 5, letterSpacing: ".4px" } }, "화면 색"),
        h(ThemeToggle, null),
        h("div", { style: { display: "flex", alignItems: "flex-end", gap: 8, marginTop: 10 } },
          h("div", { className: "muted", style: { fontSize: 10.5, fontWeight: 800, lineHeight: 1.6, minWidth: 0, wordBreak: "break-all" } },
            (auth.name || auth.email),
            auth.role ? h("span", null, h("br", null), (ROLE_LABEL[auth.role] || auth.role)) : null),
          h("button", { className: "btn sm", onClick: auth.signOut, title: "로그아웃",
            style: { marginLeft: "auto", flex: "0 0 auto" } }, "나가기")))),

    open ? h("button", { className: "side-bk", "aria-label": "닫기",
      onClick: function () { setOpen(false); } }) : null,

    /* ── 오른쪽 기둥 ─────────────────────────────────── */
    h("div", { className: "col" },
      h("header", { className: "top", style: { "--tabc": cur.c } },
        h("div", { className: "top-in" },
          h("button", { className: "ham", "aria-label": "화면 목록 열기",
            onClick: function () { setOpen(true); } }, "☰"),
          h("div", { className: "top-t" },
            h("span", { className: "top-gp" },
              h("i", { className: "top-dot" }),
              (GROUPS.filter(function (G) { return G.g === cur.g; })[0] || {}).label || "", " ›"),
            " ", cur.label,
            h("small", null, ui.get("tab." + cur.k, cur.d))),
          auth.canWrite ? h("button", {
            className: "pen" + (ui.edit ? " on" : ""),
            title: ui.edit ? "편집 모드 끄기" : "편집 모드 — 화면의 글을 눌러서 고칩니다",
            "aria-label": "편집 모드", onClick: function () { ui.setEdit(!ui.edit); } }, "✎") : null,
          h("div", { className: "top-sp" }),
          h("div", { className: "per" },
            h("label", null, "결산월"),
            h("select", { value: per.period, "aria-label": "결산 대상월",
              onChange: function (e) { per.setPeriod(e.target.value); } },
              periodOptions().map(function (p) { return h("option", { key: p, value: p }, p); }))))),

      h("main", { className: "wrap" },
        ui.edit ? h("div", { className: "editbar" },
          "✎ 편집 모드 — ", h("b", null, "점선이 그어진 글"), " 을 누르면 그 자리에서 고칩니다.",
          h("div", { className: "sp" }),
          h("button", { className: "btn sm", onClick: function () { setPenOpen(true); } }, "이 화면 설명 한꺼번에"),
          h("button", { className: "btn sm primary", onClick: function () { ui.setEdit(false); } }, "편집 끝내기")) : null,
        tab === "cal" ? h(ScreenCalendar, { go: go })
        : tab === "annual" ? h(ScreenAnnual, null)
        : tab === "issue" ? h(ScreenIssues, null)
        : tab === "acct" ? h(ScreenAcct, null)
        : tab === "slack" ? h(ScreenSlack, null)
        : tab === "ops" ? h(ScreenOps, null)
        : tab === "proj" ? h(ScreenProj, null)
        : tab === "sites" ? h(ScreenSites, null)
        : h(ScreenCash, null)),

      penOpen ? h(TxtEdit, { onClose: function () { setPenOpen(false); },
        items: [
          { k: "tab." + cur.k, label: "왼쪽 탭 설명 — " + cur.label, d: cur.d, rows: 2,
            hint: "왼쪽 탭과 위 띠에 작게 붙는 한 줄입니다." },
          { k: "lead." + cur.k, label: "화면 머리 안내문 — " + cur.label, d: LEAD_D[cur.k] || "", rows: 6,
            hint: "이 화면을 처음 여는 사람에게 무엇을 하는 곳인지 알려 주는 글입니다." },
        ] }) : null));
}

function App() {
  return h(AuthProvider, null, h(PeriodProvider, null, h(StatusProvider, null,
    h(UiTextProvider, null, h(Shell, null)))));
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App, null));
</script>
</body>
</html>
