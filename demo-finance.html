      ③ 「출금 내역(이미 나감)」 + 「출금 예정」 + 「출금 예정(차기)」 를 모읍니다
      ④ 지출결의서를 올리면, 위 셋 어디에도 없는 것만 골라
      ⑤ 왼쪽에 증빙구분(세금계산서 / 계산서 / 사업소득 / 기타…) 과
         사업소득이면 3% · 소득세 · 지방소득세(주민세) ·
         예술인이면 고용보험까지 계산해 새 엑셀로 만들어 드립니다.
      DB 는 건드리지 않습니다 — 파일을 읽어 파일로 내보내기만 합니다.
   ══════════════════════════════════════════════════════════════ */

/* ── 엑셀 읽기 도구는 이 화면에 들어올 때만 내려받습니다 ──
      (첫 화면을 가볍게 두기 위해서입니다) */
let XLSX_P = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (XLSX_P) return XLSX_P;
  XLSX_P = new Promise(function (res, rej) {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = function () { window.XLSX ? res(window.XLSX) : rej(new Error("엑셀 도구를 불러오지 못했습니다.")); };
    s.onerror = function () { XLSX_P = null; rej(new Error("엑셀 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.")); };
    document.head.appendChild(s);
  });
  return XLSX_P;
}

/* ══════════════════════════════════════════════════════════════
   읽은 자료를 들고 있습니다 — 탭을 옮겼다 와도 다시 안 올리게   (v2026.08.31-03)

   재무리드 지시(2026-08-31) : 「한번 올리고 나서 다시 자금일보 탭에 오면
   전부 다 사라집니다. 기존자료 불러오기 이런 기능이 있으면 좋겠습니다.」

   두 겹으로 들고 있습니다.
     ① 이 창 안 (CASH_KEEP)     — 탭을 옮겼다 오면 **저절로** 그대로 있습니다
     ② 이 브라우저 (localStorage) — 창을 닫았다 열어도 **「불러오기」** 로 되살립니다
   자료는 이 컴퓨터 밖으로 나가지 않습니다 (DB 에 올리지 않습니다).
   ══════════════════════════════════════════════════════════════ */
const CASH_KEEP = {};                 /* {회사코드: 읽은 것} — 새로고침하면 사라집니다 */
const CASH_LS = "3y.cash.v1.";        /* 브라우저에 남겨 두는 자리 */
let CASH_T = null;                    /* 너무 자주 쓰지 않게 잠깐 모아서 씁니다 */

/** 브라우저에 남길 때 빼는 것 — 원본 표(rawPaper·papAll)는 커서 자리가 모자랍니다 */
function cashSlim(d) {
  const o = Object.assign({}, d);
  delete o.rawPaper; delete o.papAll;
  return o;
}
function cashSave(entity, data) {
  CASH_KEEP[entity] = data;                       /* ① 이 창 — 통째로, 곧바로 */
  if (CASH_T) clearTimeout(CASH_T);
  CASH_T = setTimeout(function () {               /* ② 브라우저 — 1.5초 모아서 */
    const put = function (o) {
      localStorage.setItem(CASH_LS + entity, JSON.stringify(Object.assign({ at: Date.now() }, o)));
    };
    try { put(data); }
    catch (e) {
      try { put(cashSlim(data)); }                /* 자리가 모자라면 원본 표만 빼고 */
      catch (e2) { /* 그래도 안 되면 이 창에서만 들고 있습니다 */ }
    }
  }, 1500);
}
function cashLoad(entity) {
  if (CASH_KEEP[entity]) return CASH_KEEP[entity];
  try {
    const t = localStorage.getItem(CASH_LS + entity);
    if (t) { const o = JSON.parse(t); o.fromLS = true; return o; }
  } catch (e) { /* 시크릿 창 등에서 막힐 수 있습니다 */ }
  return null;
}
function cashDrop(entity) {
  delete CASH_KEEP[entity];
  if (CASH_T) { clearTimeout(CASH_T); CASH_T = null; }
  try { localStorage.removeItem(CASH_LS + entity); } catch (e) { }
}
/** 「2026-08-31 14:20」 처럼 */
function whenKo(ms) {
  if (!ms) return "";
  const d = new Date(ms);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-"
       + String(d.getDate()).padStart(2, "0") + " "
       + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

/** 그 날의 요일 번호 (0 일요일 ~ 6 토요일) */
function dowOf(iso) {
  const p = String(iso || "").slice(0, 10).split("-").map(Number);
  if (p.length !== 3 || !p[0]) return -1;
  return new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay();
}
function dowKo(iso) { const w = dowOf(iso); return w < 0 ? "" : DOW_KO[w]; }

/** 쉬는 날인가 — 쉬면 그 이유를, 일하는 날이면 빈 글자를 돌려줍니다 */
function offDay(iso) {
  const w = dowOf(iso);
  if (w === 0) return "일요일";
  if (w === 6) return "토요일";
  return HOLIDAY[String(iso || "").slice(0, 10)] || "";
}

/** iso(그 날 포함) 부터 앞으로 가면서 **첫 자금 집행일**을 찾습니다.
    돌려주는 것 : { day 실제 집행일 · base 원래 월/목 · why 밀린 이유 } */
function payDayFrom(iso) {
  let base = String(iso || today()).slice(0, 10);
  for (let i = 0; i < 90; i++) {
    if (PAY_DOW.indexOf(dowOf(base)) >= 0) {
      let day = base, why = "";
      for (let j = 0; j < 20; j++) {
        const off = offDay(day);
        if (!off) break;
        if (!why) why = base + "(" + dowKo(base) + ") 은 " + off + " — 다음 영업일로 밀었습니다";
        day = addDays(day, 1);
      }
      if (day >= String(iso || "").slice(0, 10)) return { day: day, base: base, why: why };
    }
    base = addDays(base, 1);
  }
  return { day: String(iso || today()).slice(0, 10), base: base, why: "" };
}

/** 이번 집행일 다음의 집행일 */
function nextPay(prev) {
  let p = payDayFrom(addDays(prev.base, 1));
  for (let n = 0; n < 12 && p.day <= prev.day; n++) p = payDayFrom(addDays(p.base, 1));
  return p;
}

/** 「2026-08-31(월)」 처럼 보여 줍니다 */
function dayKo(iso) {
  const d = String(iso || "").slice(0, 10);
  return d ? d + "(" + dowKo(d) + ")" : "—";
}

/** 엑셀 칸을 날짜 글자(2026-08-10)로 바꿉니다 */
function xdate(v) {

  if (typeof v === "number" && v > 20000 && v < 80000) {

    return d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0") + "-" + String(d.getUTCDate()).padStart(2, "0");

  if (m) return m[1] + "-" + m[2] + "-" + m[3];

/** 금액을 읽습니다.
    ★ 예전 판은 글자에서 숫자 아닌 것만 지웠습니다. 그래서 날짜(2026-07-25 10:26:07)나
      두 값이 붙은 칸을 만나면 202,607,251,026,072,920,000,000 같은 **터무니없는 수**가 나왔습니다.

  if (v instanceof Date) return 0;                       /* 날짜는 금액이 아닙니다 */

/** 자금일보 한 시트를 읽어 줄 목록으로 만듭니다 */
function readCashSheet(aoa, sheetName) {
  /* 어디서부터 어디까지가 무슨 칸인지 먼저 찾습니다 */
  const marks = [];
  for (let r = 0; r < aoa.length; r++) {
    const s = secOf(cell(aoa[r], 1));
    if (s) marks.push({ r: r, s: s });
  }
  const out = [];
  for (let i = 0; i < marks.length; i++) {
    const key = marks[i].s.key;
    if (key !== "out" && key !== "plan" && key !== "plan2" && key !== "next") continue;
    const from = marks[i].r + 2;
    const to = i + 1 < marks.length ? marks[i + 1].r : aoa.length;
    let lastD = null;
    for (let r = from; r < to; r++) {
      const row = aoa[r] || [];
      const b = String(cell(row, 1)).trim();
      if (/Total|합계|^계$|^\s*계\s*$/.test(b)) continue;
      const party = String(cell(row, 4)).trim();
      const memo = String(cell(row, 5)).trim();
      const krw = xnum(cell(row, 8));
      if (!party && !memo) continue;
      if (!krw) continue;
      const d = xdate(cell(row, 1));
      if (d) lastD = d;
      const proofRaw = String(cell(row, 13)).trim();
      out.push({
        sheet: sheetName,
        sec: key === "out" ? "out" : key === "next" ? "next" : "plan",
        dt: d || lastD,
        gubun: String(cell(row, 2)).trim(),
        acct: String(cell(row, 3)).trim(),
        party: party,
        memo: memo,
        krw: krw,
        fx: xnum(cell(row, 9)),
        holder: String(cell(row, 10)).trim(),
        bank: String(cell(row, 11)).trim(),
        accno: String(cell(row, 12)).trim(),
        proof: proofRaw,
        gross: xnum(cell(row, 15)) || krw,
        tax: xnum(cell(row, 16)),
        ltax: xnum(cell(row, 17)),
        ins: xnum(cell(row, 18)),

    }
  }
  return out;
}

  [/한국전력공사|한국전력/g, "한국전력"],

const NKEY_CACHE = new Map();
function nkey(s) {

    .replace(/[㈜()（）\[\]{}<>"'`.,·・\-_/\\|+*~!@#$%^&?:;=]/g, "")
    .replace(/\s+/g, "")

const STOPW = ["지급", "비용", "대가", "정산", "청구", "건", "및", "기타", "관련", "요청", "이체", "송금", "26년", "2026", "7월", "8월", "월분"];
/* ★ 같은 글월을 몇만 번씩 다시 쪼개던 것을 기억해 둡니다 (대조가 눈에 띄게 빨라집니다) */

/* ══════════════════════════════════════════════════════════════
   ★ 그 밖의 고정 자금일정 — 급여 · 기명식 법인카드   (2026-09-09)

   재무리드 : 「급여일은 25일이며, 급여일 전주 목요일이 기명식 법인카드에 대해서
              지급하는 날이니 이부분도 항상 체크될 수 있게 표현해주시면 좋겠습니다.
              원천세 처럼요.」

   10일 세금과 성격이 똑같습니다 — **지출결의서로 올라오지 않는데 날짜가 정해져
   반드시 나가는 돈**입니다. 그래서 같은 방법으로 챙깁니다 :
   자금일보 그 날짜에 그 줄이 있는지 보고, 없으면 붉은 표를 답니다.

   ★ 「급여일 전주 목요일」 은 두 가지로 읽을 수 있어 확인이 필요합니다 —
       2026년 9월 급여일 = 9월 25일(금)
         ⓐ 급여일이 든 주(9/21~9/27)의 **한 주 앞** 목요일 → 9월 17일(목)   ← 지금 이것
         ⓑ 급여일 **바로 앞** 목요일                      → 9월 24일(목)
       PAY_CARD_MODE 를 "prevweek" ↔ "prevthu" 로 바꾸면 그 자리에서 바뀝니다.
   ══════════════════════════════════════════════════════════════ */
const PAY_DAY = 25;                    /* 급여일 — 매달 25일 */
const PAY_CARD_MODE = "prevweek";      /* "prevweek" = 전주 목요일 · "prevthu" = 바로 앞 목요일 */

/** 그 달 급여일 — 25일이 토·일이면 **앞의 영업일**로 당깁니다 (확인 필요 : ⑧) */
function payDayOf(ym) {
  const y = Number(String(ym).slice(0, 4)), m = Number(String(ym).slice(5, 7));
  let d = new Date(Date.UTC(y, m - 1, PAY_DAY));
  /* 0=일 6=토 — 주말이면 앞으로 당깁니다 */
  while (d.getUTCDay() === 0 || d.getUTCDay() === 6) d = new Date(d.getTime() - 86400000);
  return iso10(d);
}
/** 기명식 법인카드 지급일 — 급여일 기준 목요일 */
function cardDayOf(ym) {
  const pd = payDayOf(ym);
  let d = new Date(pd + "T00:00:00Z");
  if (PAY_CARD_MODE === "prevthu") {
    /* 급여일 바로 앞 목요일 (급여일이 목요일이면 그 앞 주 목요일) */
    do { d = new Date(d.getTime() - 86400000); } while (d.getUTCDay() !== 4);
    return iso10(d);
  }
  /* 급여일이 든 주의 월요일 → 한 주 앞 월요일 → 그 주 목요일 */
  const dow = (d.getUTCDay() + 6) % 7;            /* 월=0 … 일=6 */
  const mon = new Date(d.getTime() - dow * 86400000);
  return iso10(new Date(mon.getTime() - 7 * 86400000 + 3 * 86400000));
}
function iso10(d) {
  return d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0")
       + "-" + String(d.getUTCDate()).padStart(2, "0");
}
/* ══ ★ 기명식 법인카드는 이렇게 적혀 있습니다   (재무리드 2026-09-09 스크린샷)
     거래처 「삼성카드(0438)_김정광」 · 적요 「QWER) 미지급금_삼성카드(0438)_김정광」
     즉 **카드사(카드번호)_사람이름** 입니다. 공용 법인카드는 이름이 안 붙습니다
     (「삼성카드(4366)」). 그 차이 하나로 둘을 가릅니다.

     ★ 처음에는 「기명식」 이라는 낱말로 찾았는데 자금일보에 그 낱말이 한 줄도 없어
       못 찾았습니다. 게다가 「삼성카드」 를 **제외 낱말로 두어** 오히려 막고 있었습니다. */
const KIMYUNG = /(삼성|비씨|BC|신한|현대|국민|롯데|하나|우리|농협)\s*카드\s*[（(]\s*\d{3,4}\s*[)）]\s*_\s*[^\s_]/i;
function isKimyung(r) {
  return KIMYUNG.test(String((r && r.party) || "")) || KIMYUNG.test(String((r && r.memo) || ""));
}
/** 그 달에 기명식 카드 뭉치가 실제로 나간 날 — 한 날에 열 줄 넘게 몰린 날을 찾습니다 */
function kimyungDays(bag, ym) {
  const g = {};
  (bag || []).forEach(function (r) {
    const d = String(r.dt || "").slice(0, 10);
    if (!d) return;
    if (ym && d.slice(0, 7) !== ym) return;
    if (!isKimyung(r)) return;
    if (!g[d]) g[d] = { day: d, n: 0, amt: 0, rows: [] };
    g[d].n += 1; g[d].amt += n0(r.krw); g[d].rows.push(r);
  });
  return Object.keys(g).map(function (k) { return g[k]; })
    .filter(function (x) { return x.n >= 10; })          /* 한두 줄은 딴 건입니다 */
    .sort(function (a, b) { return String(b.day).localeCompare(String(a.day)); });
}

/** 급여 · 기명식 카드가 자금일보에 잡혔는지 봅니다 */

  const payRows = (bag || []).filter(function (r) { return String(r.dt || "").slice(0, 10) === payDay; });
  const payGot = payRows.filter(function (r) {
    const t = String(r.memo || "") + " " + String(r.party || "") + " " + String(r.holder || "");
    return /급여|상여|임금/.test(t) && !/급여이체명세|가불/.test(t);
  });
  let payAmt = 0;
  payGot.forEach(function (r) { payAmt += n0(r.krw); });

  /* ── 기명식 카드 : **그 달 전체**에서 뭉치를 찾습니다

          2026-01 01-19(월) ✘ 월요일
        그래서 **예상일만 계산해 두고, 실제로 나간 날은 그 달 전체에서 찾습니다.** ── */

      n: card ? card.n : 0, amt: card ? card.amt : 0, rows: card ? card.rows : [],
      ok: !!card, nAll: (bag || []).filter(function (r) { return String(r.dt || "").slice(0, 10) === cardWant; }).length,
      tip: "개인 이름으로 발급된 법인카드입니다 — 자금일보에는 「삼성카드(0438)_김정광」 처럼 "
         + "카드사(번호)_이름 으로 사람마다 한 줄씩 적힙니다. 급여일 전주 목요일에 한꺼번에 나갑니다." },

      day: payDay, want: payDay, off: false,

  return { ym: y, list: list, payDay: payDay, cardWant: cardWant, past: kimyungDays(bag, null).slice(0, 4),
           miss: list.filter(function (x) { return !x.ok; }).length };

function autoBook(rows) {

  (rows || []).forEach(function (r) {

    const keys = {};

      if (b && b.length >= 2 && !keys[b]) keys[b] = { name: String(nm).trim(), full: false };
    });

    if (ac && AUTO_ACCT.test(ac)) keys["계정:" + ac] = { name: ac + " (" + String(r.party || "").trim() + ")", full: true };
    Object.keys(keys).forEach(function (k) {

      book[k].n += 1; book[k].amt += n0(r.krw);

function autoHitOf(book) {
  const keys = Object.keys(book || {});
  return function (p) {

    const fx = autoFixOf(p);
    if (fx) return { key: "고정:" + fx.name, name: fx.name, n: 0, amt: 0, fix: true, why: fx.why };
    /* ① 계정명이 공과금 계정이고, 자금일보에 그 계정의 자동이체가 있으면 자동이체입니다 */
    const pa = acctName((p && p.use) || "");
    if (pa && AUTO_ACCT.test(pa) && book["계정:" + pa]) return book["계정:" + pa];
    const pk = nkey(p && p.party);
    if (!pk || pk.length < 2) return null;
    let best = null, bs = 0;
    for (let i = 0; i < keys.length; i++) {
      const k = keys[i];
      let sc = nsim(p.party, book[k].name);
      if (k === pk) sc = 1;
      else if (pk.indexOf(k) === 0) sc = Math.max(sc, 0.92);                 /* kt… ← kt텔레캅 */
      else if (k.length >= 3 && pk.length >= 3 && k.indexOf(pk) === 0) sc = Math.max(sc, 0.9);
      if (sc > bs) { bs = sc; best = book[k]; }
    }
    return bs >= NSIM_SURE ? best : null;
  };
}

                     "memoForm", "amtDec", "memoAsk", "papNoDt", "papZero"];
/** 원 단위 아래가 남아 있는가 */
function hasJeon(v) {
  const x = n0(v);
  return Math.abs(x - Math.round(x)) > 0.004;
}
/** 외화에서 환산한 줄인가 — 소수점이 남아 있어도 그러려니 합니다 */
const FX_HINT = /외화|송금|대만|중국|일본|USD|NT\$?|TWD|CAD|JPY|EUR|CNY|RMB/i;
function looksFx(r) {
  return FX_HINT.test(String((r && r.proof) || "") + " " + String((r && r.cur) || "")
                    + " " + String((r && r.memo) || ""));
}
/** ★ 오기 체크 본체 — 짝이 맞은 줄까지 전부 다시 들여다봅니다 */
function auditAll(paper, bag, cmp, vocab) {
  const out = [];
  const voc = vocab || {};
  const vocKeys = Object.keys(voc);
  function add(k, o) { out.push(Object.assign({ k: k }, o)); }

  /* ── ①② 대조에서 이미 잡아 둔 것 ─────────────────────────── */
  ((cmp && cmp.check) || []).forEach(function (c) {
    const isTypo = /자릿수/.test(String(c.why || ""));
    add(isTypo ? "amtTypo" : "amtDup", {
      dt: (c.p && c.p.dt) || "", party: (c.p && c.p.party) || "",
      amt: n0(c.p && c.p.amt), amt2: n0(c.r && c.r.krw),
      memo: jeokyo(c.p), memo2: String((c.r && c.r.memo) || ""),
      note: "차이 " + won(c.gap || 0) });
  });

  /* ── ③④⑤⑥ 적요·계정 ────────────────────────────────────
        짝이 맞은 줄(hit)만 봅니다 — 지결서와 자금일보를 나란히 놓고 볼 수 있으니까요. */
  ((cmp && cmp.hit) || []).forEach(function (m) {
    const r = m.r;
    if (!r) return;
    const pa = acctName((m.p && m.p.use) || "");
    const memo = String(r.memo || "");
    const base = { dt: (m.p && m.p.dt) || "", party: (m.p && m.p.party) || "",
                   amt: n0(m.p && m.p.amt), memo: jeokyo(m.p), memo2: memo,
                   dt2: r.dt || "", party2: r.party || r.holder || "" };
    if (memo && memo.indexOf("_") < 0) { add("memoForm", base); return; }
    const g = memoAcctV(memo, voc);
    if (!g.acct) return;
    if (g.known) {
      if (pa && pa !== g.acct)
        add("acctDiff", Object.assign({ note: "자금일보 「" + g.acct + "」 → 「" + pa
               + "」 로 고쳐 주세요  (지결서 용도가 기준입니다)" }, base));
      return;
    }
    /* 아는 계정이 아니다 — 아주 비슷한 계정이 있으면 오타, 없으면 계정이 아닌 것 */
    const near = nearAcct(g.acct, vocKeys);
    if (near)
      add("acctTypo", Object.assign({ note: "자금일보 「" + g.acct + "」 → 「" + near.acct
             + "」 아닙니까  (" + near.why + ")" }, base));
    else
      add("acctNone", Object.assign({ note: "적요에서 계정명을 찾지 못했습니다"
             + (pa ? " — 지결서 용도는 「" + pa + "」 입니다" : "") }, base));
  });

  /* ── ⑦⑧ 자금일보 줄 자체 ─────────────────────────────────── */
  (bag || []).forEach(function (r) {
    if (hasJeon(r.krw) && !looksFx(r))
      add("amtDec", { dt: r.dt || "", party: r.party || r.holder || "",
        amt: n0(r.krw), memo2: String(r.memo || ""), note: "적힌 금액 " + String(r.krw) });
    if (/확인\s*(중|필요|요)|\?\?|\(\?\)/.test(String(r.memo || "")))
      add("memoAsk", { dt: r.dt || "", party: r.party || r.holder || "",
        amt: n0(r.krw), memo2: String(r.memo || "") });
  });

  /* ── ⑨⑩ 지출결의서 줄 자체 ───────────────────────────────── */
  (paper || []).forEach(function (p) {
    if (p.isMinus) return;                            /* 마이너스 줄은 원단위절사라 뺍니다 */
    if (!p.dt) add("papNoDt", { dt: "", party: p.party || "", amt: n0(p.amt), memo: jeokyo(p) });
    else if (n0(p.amt) === 0) add("papZero", { dt: p.dt, party: p.party || "", amt: 0, memo: jeokyo(p) });
  });

  /* 까닭별로 묶습니다 */
  const grp = {};
  out.forEach(function (x) {
    if (!grp[x.k]) grp[x.k] = { k: x.k, n: 0, rows: [] };
    grp[x.k].n += 1; grp[x.k].rows.push(x);
  });
  return { all: out, n: out.length,
    bad: out.filter(function (x) { return (AUDIT_KIND[x.k] || {}).tone === "bad"; }).length,
    list: AUDIT_ORDER.filter(function (k) { return grp[k]; }).map(function (k) { return grp[k]; }) };
}

/* ══════════════════════════════════════════════════════════════

const OFF_KIND = {

/* ★★ 보는 순서 — 2026-09-09 에 「겹침」 을 **맨 뒤로** 옮겼습니다.

     재무리드 : 「강남주차장 8,000원 — 증빙이 신용카드매출전표이면 이미 지급된 건입니다.」

     찾아보니 규칙이 아니라 **순서가 잘못**이었습니다. 강남주차장 8,000원 두 줄은
     증빙이 둘 다 「신용카드매출전표(법인)」 이라 slip 으로 빠져야 했는데,
     적요가 글자 하나까지 같아 **겹침(same)이 먼저 잡혔습니다.** 겹침은 기본이 「안 뺌」
     이라 그 줄이 대조 대상으로 들어가고, 자금일보에 없으니 「없음」 으로 떨어졌습니다.

     겹침은 「빼는 까닭」 이 아니라 **「사람이 봐 주세요」 라는 표**입니다.
     그러니 **확실히 안 나가는 까닭(개인카드 · 신용카드 · 법인카드 · 자동이체 · 환불 ·
     수수료공제)을 모두 먼저 보고**, 그래도 남은 줄에만 겹침 표를 답니다.
     → 강남주차장 8,000원이 slip 으로 빠져 「없음」 이 1건 → 0건이 되었습니다. */
const OFF_ORDER = ["own", "slip", "card", "auto", "ref", "fee", "same", "minus"];
/** 지출결의서 한 줄의 까닭을 돌려줍니다 (없으면 null = 자금일보에 넣습니다) */
function offOf(p, autoHit) {
  if (!p) return null;
  /* ★ 확실히 안 나가는 까닭을 **먼저** 봅니다 — 「겹침」 은 맨 뒤입니다 (2026-09-09) */
  if (p.isOwn) return { k: "own", note: "" };
  if (p.isSlip) return { k: "slip", note: "증빙 「" + String(p.proofRaw || "").trim() + "」" };
  if (p.isCard) return { k: "card", note: "" };
  const a = autoHit ? autoHit(p) : null;
  if (a) return { k: "auto", note: a.fix
    ? ("고정 자동이체 명단 「" + a.name + "」 — " + (a.why || ""))
    : ("자금일보 「" + a.name + "」 자동이체 " + num(a.n) + "건") };
  if (p.isRefund) return { k: "ref", note: "" };
  if (p.skip) return { k: "fee", note: p.skip.why || "" };
  /* ★ 겹침은 「빼는 까닭」 이 아니라 「사람이 봐 주세요」 라는 표입니다 — 그래서 맨 뒤에서 봅니다 */
  if (p.sameI > 0) return { k: "same",
    note: "똑같은 줄 " + num(p.sameN) + "개 가운데 " + num(p.sameI + 1) + "번째 — 첫 줄만 남깁니다" };
  if (p.isMinus) return { k: "minus", note: p.isCut ? "원단위절사 — 본 줄에 더했습니다" : "" };

}

function xIsDate(v) { return !!xdate(v); }
function xIsNum(v) {
  if (v instanceof Date) return false;
  if (typeof v === "number") return Math.abs(v) <= AMT_MAX;
  const t = String(v == null ? "" : v).replace(/[,\s]/g, "").replace(/원$/, "");
  return /^-?[0-9]+(\.[0-9]+)?$/.test(t) && t.replace(/\..*$/, "").length <= 14;
}
function xIsWord(v) {
  const t = String(v == null ? "" : v).trim();
  return t !== "" && /[가-힣A-Za-z]/.test(t);   /* 글자가 있어야 이름입니다 */
}

/** 이름으로 못 맞춘 칸을 자료 모양으로 채웁니다 —
    · 일자   : 날짜로 읽히는 칸
    · 금액   : 숫자 칸 중 **합계가 가장 큰** 것 (순번·코드는 작아서 걸러집니다)
    · 거래처 : 글자 칸 중 **짧은** 것 (적요는 깁니다)
    · 적요   : 글자 칸 중 **긴** 것 */
function fillByShape(aoa, hd) {
  const row = aoa[hd.r] || [];
  const sample = [];
  for (let k = hd.r + 1; k < Math.min(aoa.length, hd.r + 60) && sample.length < 25; k++) {
    const rr = aoa[k] || [];
    if (rr.some(function (v) { return String(v == null ? "" : v).trim() !== ""; })) sample.push(rr);
  }
  if (!sample.length) return;
  const used = {};
  Object.keys(hd.map).forEach(function (k) { used[hd.map[k]] = 1; });

  const stat = [];
  for (let c = 0; c < row.length; c++) {
    let nd = 0, nn = 0, nw = 0, len = 0, sum = 0, tot = 0;
    sample.forEach(function (rr) {
      const v = cell(rr, c);
      if (v === "" || v === null || v === undefined) return;
      tot++;
      if (xIsDate(v)) nd++;
      if (xIsNum(v)) { nn++; sum += Math.abs(Number(String(v).replace(/[,\s원]/g, "")) || 0); }
      if (xIsWord(v)) { nw++; len += String(v).trim().length; }
    });
    stat.push({ c: c, tot: tot, d: nd / (tot || 1), n: nn / (tot || 1), w: nw / (tot || 1),
      len: nw ? len / nw : 0, sum: sum });
  }
  function take(k, pick) {
    if (hd.map[k] !== undefined) return;
    const cand = stat.filter(function (x) { return x.tot >= 2 && !used[x.c]; });
    const got = pick(cand);
    if (got) { hd.map[k] = got.c; used[got.c] = 1; hd.hit = (hd.hit || 0) + 1; }
  }
  take("dt",   function (l) { return l.filter(function (x) { return x.d >= 0.6; })
                                 .sort(function (a, b) { return b.d - a.d; })[0]; });
  take("amt",  function (l) { return l.filter(function (x) { return x.n >= 0.6 && x.sum > 0; })
                                 .sort(function (a, b) { return b.sum - a.sum; })[0]; });
  take("party",function (l) { return l.filter(function (x) { return x.w >= 0.6 && x.len <= 24; })
                                 .sort(function (a, b) { return a.len - b.len; })[0]; });
  take("memo", function (l) { return l.filter(function (x) { return x.w >= 0.6; })
                                 .sort(function (a, b) { return b.len - a.len; })[0]; });
}

/** 제목 줄을 찾고, **자료를 실제로 들여다보며** 칸을 맞춥니다. */
function findHeader(aoa) {
  /* ★ 먼저 「우리가 아는 서식인가」 를 봅니다. 알면 짐작하지 않습니다. */
  const known = formOf(aoa);
  if (known) return known;
  let best = { r: -1, hit: 0, map: {}, names: [], all: [] };
  for (let r = 0; r < Math.min(aoa.length, 40); r++) {
    const row = aoa[r] || [];
    /* 이 줄 아래 자료 20줄을 표본으로 봅니다 */
    const sample = [];
    for (let k = r + 1; k < Math.min(aoa.length, r + 40) && sample.length < 20; k++) {
      const rr = aoa[k] || [];
      if (rr.some(function (v) { return v !== null && v !== undefined && String(v).trim() !== ""; })) sample.push(rr);
    }
    if (!sample.length) continue;

    const names = row.map(function (v) { return String(cell(row, row.indexOf(v))); });
    const map = {}; let hit = 0;
    COLS.forEach(function (col) {
      let bestC = -1, bestS = 0;
      for (let c = 0; c < row.length; c++) {
        const t = String(cell(row, c)).replace(/\s/g, "");
        if (!t) continue;
        /* ① 이름이 얼마나 맞나 — 앞쪽 낱말일수록 셉니다 */
        let ns = 0;
        for (let j = 0; j < col.hint.length; j++) {
          const hj = col.hint[j];
          if (t === hj) { ns = 100 - j; break; }
          if (t.indexOf(hj) >= 0) { ns = Math.max(ns, 60 - j); }
        }
        if (!ns) continue;
        if (CODEY.test(t)) ns -= 45;               /* 거래처코드 · 전표번호 … 는 뒤로 */
        /* ② 자료가 그 모양인가 — 이게 이름보다 셉니다 */
        let ok = 0;
        sample.forEach(function (rr) {
          const v = cell(rr, c);
          if (v === "" || v === null || v === undefined) return;
          if (col.k === "dt")  { if (xIsDate(v)) ok++; }
          else if (col.k === "amt") { if (xIsNum(v)) ok++; }
          else { if (xIsWord(v)) ok++; }
        });
        const rate = ok / sample.length;
        const sc = ns + rate * 120;
        /* 자료가 전혀 안 맞으면 그 칸은 버립니다 */
        if (col.k === "dt"  && rate < 0.3) continue;
        if (col.k === "amt" && rate < 0.3) continue;
        if (col.k === "party" && rate < 0.3) continue;
        if (sc > bestS) { bestS = sc; bestC = c; }
      }
      if (bestC >= 0) { map[col.k] = bestC; hit++; }
    });
    if (hit > best.hit) {
      best = { r: r, hit: hit, map: map,
        names: row.map(function (_, c) { return String(cell(row, c)).trim(); }),
        all: row.map(function (_, c) { return c; }) };
    }
  }
  /* ★ 이름으로 못 맞춘 칸은 **자료 모양만 보고** 채웁니다.
        (「상대방」 「집행예정」 「원화」 처럼 낯선 이름을 쓰는 파일도 읽히게) */
  if (best.r >= 0) fillByShape(aoa, best);

  /* ★ 하나도 못 맞춰도 **실패시키지 않습니다.**
        글자가 가장 많이 든 줄을 제목 줄로 보고, 사람이 칸을 맞추게 합니다. */
  if (best.r < 0) {
    let br = 0, bn = 0;
    for (let r = 0; r < Math.min(aoa.length, 40); r++) {
      const row = aoa[r] || [];
      const n = row.filter(function (v) { return String(v == null ? "" : v).trim() !== ""; }).length;
      if (n > bn) { bn = n; br = r; }
    }
    const row = aoa[br] || [];
    best = { r: br, hit: 0, map: {},
      names: row.map(function (_, c) { return String(cell(row, c)).trim(); }),
      all: row.map(function (_, c) { return c; }) };
  }
  return best;
}

function readPaper(aoa, hdr) {
  const out = [];
  const m = hdr.map;
  let lastD = null;
  for (let r = hdr.r + 1; r < aoa.length; r++) {
    const row = aoa[r] || [];
    const amt = m.amt === undefined ? 0 : xnum(cell(row, m.amt));
    const party = m.party === undefined ? "" : String(cell(row, m.party)).trim();
    const memo = m.memo === undefined ? "" : String(cell(row, m.memo)).trim();
    if (!amt || (!party && !memo)) continue;   /* 0원 줄만 버립니다 — 음수는 아래에서 처리합니다 */
    if (/합계|총계|Total/i.test(party + memo)) continue;
    const d = m.dt === undefined ? null : xdate(cell(row, m.dt));
    if (d) lastD = d;
    const g = function (k) { return m[k] === undefined ? "" : String(cell(row, m[k])).trim(); };
    const rec = {
      id: "p" + r,
      dt: d || lastD, party: party, memo: memo, amt: amt,
      proj: g("proj").replace(/^[0-9]+\./, ""),
      who: g("who").replace(/^[0-9]+\./, ""),
      /* ↓ 아는 서식일 때만 채워집니다 */
      use: g("use"), proofRaw: g("proofRaw"),
      bank: g("bank"), accno: g("accno"), holder: g("holder"),
      docno: g("docno"), state: g("state"), card: g("card"), kind: g("kind"),
      supply: m.supply === undefined ? 0 : xnum(cell(row, m.supply)),
      vat: m.vat === undefined ? 0 : xnum(cell(row, m.vat)),
      paid: m.paid === undefined ? 0 : xnum(cell(row, m.paid)),
      dt2: m.dt2 === undefined ? null : xdate(cell(row, m.dt2)),
    };
    /* 구분은 **자금일보와 같은 말**로 미리 채웁니다 */
    rec.gubun = gubunOf(rec.use, rec.memo);
    rec.isCard = isCardRow(rec);
    rec.isSlip = isSlipRow(rec);          /* 증빙이 신용카드매출전표 — 이미 카드로 지급됨 */
    rec.isOwn = isOwnCard(rec);           /* 개인카드 사용분(기명식 법인카드) — 별도 정산 */
    rec.isRefund = isRefundRow(rec);
    rec.skip = skipParty(rec);      /* 정산에서 차감되어 들어오는 곳 */
    out.push(rec);
  }
  return markSame(mergeMinus(out));
}

/* ══════════════════════════════════════════════════════════════
   ★ 똑같은 줄 겹침   (재무리드 2026-09-06 · 오드웨이브 자료에서 드러남)

   내려받은 지출결의서에 **글자 하나까지 똑같은 줄**이 여러 번 실려 있었습니다.
     잔키(JAAN KEE)   13,475,000원  ×5   (자금일보에는 한 줄뿐)
     정유빈            3,650,000원  ×6
     지구어 에듀테인먼트     330,000원  ×3씩 세 사람
   자금일보 한 줄은 한 번만 쓰므로, 첫 줄만 「있음」 이 되고 나머지는 모두
   「없음 → 새로 넣을 것」 으로 떨어집니다. 그대로 넣으면 **같은 돈을 여러 번 내보냅니다.**

   그래서 지급기한 · 거래처 · 금액 · 적요 · 용도 · 문서번호가 **모두 같은** 줄은
   첫 줄만 남기고 나머지에 표를 달아 둡니다 (화면에서 되돌릴 수 있습니다).
   ★ 금액이 같아도 **적요가 다르면 겹침이 아닙니다** — 3Y 의 「주민세 5개 사업장
     × 12,500원」 처럼 진짜로 여러 번 나가는 건은 그대로 남습니다.
   ══════════════════════════════════════════════════════════════ */
function markSame(rows) {
  const m = {};
  rows.forEach(function (r) {
    if (r.isMinus) return;
    /* 문서번호는 **넣지 않습니다** — 같은 줄이 문서번호만 다르게 여러 번 실리기도 합니다.
       대신 지급기한 · 거래처 · 금액 · 적요 · 용도가 모두 같아야 겹침으로 봅니다. */
    const k = [r.dt, r.party, Math.round(n0(r.amt)), r.memo, r.use].join("|");
    (m[k] = m[k] || []).push(r);
  });
  Object.keys(m).forEach(function (k) {
    const g = m[k];
    if (g.length < 2) return;
    g.forEach(function (r, i) { r.sameN = g.length; r.sameI = i; });
  });
  return rows;
}

/* ══════════════════════════════════════════════════════════════
   ★ 음수 줄 정리   (실제 지출결의서를 뜯어 보고 만든 규칙 · 2026-09-03)

   지출결의서에는 **금액이 마이너스인 줄**이 섞여 있습니다. 두 종류입니다.

   ① 「원단위절사」 — 같은 문서 · 같은 용도에 본 줄과 짝으로 붙어 있습니다.
        도시가스요금(306470339)-201호   9,114
        원단위절사  (306470339)-201호      -4
      자금일보에는 **둘을 합친 9,110원** 한 줄로 나갑니다.
      → **본 줄에 더해 버리고** 절사 줄은 없앱니다. (실제로 5건 모두 원 단위까지 일치)

   ② 그 밖의 마이너스 — 「9998.기타매출」 의 카페24 무통장환불 48건 등.
      받은 돈을 되돌려 주는 것이라 **출금예정에 새로 넣지 않습니다.**
      (재무리드 : 「기타매출이 왜 잡히는지 모르겠다 · 환불건은 모두 제외」)
   ══════════════════════════════════════════════════════════════ */
function mergeMinus(rows) {
  /* 「도시가스요금(306470339)-201호」 → 「(306470339)-201호」 : 짝을 찾는 열쇠 */
  function tailKey(t) {
    const x = String(t || "");
    const i = x.indexOf("(");
    return i >= 0 ? x.slice(i) : "";

  rows.forEach(function (m) {
    if (m.amt >= 0) return;
    m.isMinus = true;                         /* 마이너스 줄은 새로 넣지 않습니다 */
    m.isCut = /원단위\s*절사/.test(String(m.memo || ""));
    if (!m.isCut) return;
    const key = tailKey(m.memo);
    /* 같은 문서 · 같은 용도의 본 줄을 찾습니다 (열쇠가 같은 것 → 없으면 딱 하나 남은 것) */
    let mate = null;
    rows.forEach(function (o) {
      if (o === m || o.amt <= 0) return;
      if (o.docno !== m.docno || o.use !== m.use) return;
      if (key && tailKey(o.memo) !== key) return;
      if (!mate) mate = o;
    });
    if (mate) { mate.amt += m.amt; mate.cutBy = (mate.cutBy || 0) + (-m.amt); gone[m.id] = 1; }
  });
  return rows;
}

/** 그 칸의 원본 값을 글자로 — 무엇이 들어 있는지 눈으로 보게 */
function rawOf(aoa, hdr, k, n) {
  if (!aoa || !hdr || hdr.map[k] === undefined) return "";
  const out = [];
  for (let r = hdr.r + 1; r < aoa.length && out.length < (n || 2); r++) {
    const v = cell(aoa[r], hdr.map[k]);
    if (v === "" || v === null || v === undefined) continue;
    out.push(v instanceof Date ? "(날짜) " + ymd(v.toISOString()) : String(v));
  }
  return out.join("  |  ");
}

/* ── 자금일보에서 배운 것 — 이 거래처는 늘 무슨 증빙이었나 ── */
function learn(rows) {

  rows.forEach(function (r) {
    const k = nkey(r.party);
    if (!k || !r.proof) return;
    if (!m[k]) m[k] = { cnt: {}, art: 0, n: 0 };
    m[k].cnt[r.proof] = (m[k].cnt[r.proof] || 0) + 1;
    m[k].n++;
    if (n0(r.ins) > 0) m[k].art++;

  const out = {};
  Object.keys(m).forEach(function (k) {
    const c = m[k].cnt;
    let top = null, tn = 0;
    Object.keys(c).forEach(function (p) { if (c[p] > tn) { tn = c[p]; top = p; } });
    out[k] = { proof: top, n: m[k].n, artist: m[k].art > 0 };
  });
  return out;
}
/** 배운 것이 없으면 글자를 보고 짐작합니다 (사람이 고칠 수 있습니다) */

const CORP_WORD = /전력|공사|은행|보험|카드|통신|물산|산업|기업|상사|유통|미디어|스튜디오|엔터|컴퍼니|그룹|재단|협회|조합|법인|사무소|센터|약국|병원|의원|마트|서비스|시스템|테크|프로덕션|필름|뮤직|레코드|아트|하우스|공방|모터스|건설|개발|투자|캐피탈|증권|자산|세무|회계|노무|법무|특허|감정|운수|택배|물류|여행|호텔|리조트|골프|스포츠|교육|학원|어학|출판|인쇄|광고|기획|이벤트|렌탈|리스|임대|경비|청소|급식|식품|주류|농산|수산|축산|화학|전자|기계|금속|섬유|의류|화장품|제약|바이오|클리닉|주택|부동산|공인|자동차|렌터카|주유|가스|난방|수도|우체국|공단|공제|위원회|시청|구청|세무서/;
function isPerson(name) {

  return /^[가-힣]{2,4}$/.test(t) && !CORP_WORD.test(t);
}
function guessProof(row, book) {
  /* ① 지출결의서에 「증빙」 이 적혀 있으면 그것이 가장 정확합니다.
        (세금계산서 · 계산서 · 현금영수증 · 법인카드 는 그대로 옮깁니다) */
  const mapped = PROOF_MAP[String(row.proofRaw || "").trim()];
  if (mapped) return { proof: mapped, artist: false,
    from: "지출결의서의 증빙 「" + row.proofRaw + "」" };
  const b = book[nkey(row.party)];
  if (b && b.proof) return { proof: b.proof, artist: b.artist, from: "지난 자금일보에서 " + b.n + "번" };
  const t = row.party + " " + row.memo;
  /* ★ 계좌번호가 없으면 계좌이체로 나가는 돈이 아닙니다 —
        카드 · 자동이체 · 카카오T 처럼 이미 빠져나가는 것입니다. */
  if (row.proofRaw && !String(row.accno || "").trim())
    return { proof: "자동이체", artist: false, from: "계좌번호가 없습니다 — 자동이체 · 카드로 봅니다" };
  if (UTIL_WORD.test(t)) return { proof: "자동이체", artist: false, from: "공과금 · 통신 — 자동이체로 봅니다" };
  const person = isPerson(row.party);
  if (person && BIZ_WORD.test(t)) return { proof: "사업소득세", artist: ART_WORD.test(t), from: "개인 이름 + 용역 — 짐작" };
  if (person) return { proof: "사업소득세", artist: ART_WORD.test(t), from: "개인 이름 — 짐작" };
  return { proof: "세금계산서", artist: false, from: "짐작 — 꼭 확인해 주세요" };
}

/* ══════════════════════════════════════════════════════════════
   ★ 대조 한 곳 — 지출결의서 ↔ 자금일보   (2026-09-09 에 여기로 꺼냈습니다)

   예전에는 이 300여 줄이 화면 컴포넌트 안(useMemo)에 들어 있어서,
   고칠 때마다 브라우저를 통째로 띄워야만 확인할 수 있었습니다.
   이제 **혼자 도는 함수**라 자료만 넣으면 바로 결과가 나옵니다
   (검사 시간이 40초 → 1초 아래로 줄었습니다).

     use    : 지출결의서 줄 (빼는 것을 이미 뺀 것)
     bag    : 자금일보 줄 — 출금 내역 · 출금 예정 · 차기 예정 **전부**
     cutDay : 자금일보 기준일 (출금 내역이 어디까지 채워졌나)
     nowD   : 오늘

   돌려주는 것
     hit   이미 자금일보에 있음      miss  없음 = 새로 넣을 것
     late  지급기한이 기준일 뒤      check 거래처·적요는 같은데 금액이 다름
   ══════════════════════════════════════════════════════════════ */
function matchCash(use, bag, cutDay, nowD) {
  if (!use || !bag || !use.length || !bag.length) return null;

    /* 이름이 같은 곳인가 — 근사유사값, 또는 자금일보 적요 안에 그 이름이 들어 있는가
       (카카오T · 법인카드처럼 자금일보에서는 카드 이름으로 찍히는 것을 잡습니다) */
    function nameHit(p, r) {
      const s = Math.max(nsim(p.party, r.party), nsim(p.party, r.holder));
      if (s >= NSIM_OK) return s;
      const pk = nkey(p.party);
      if (pk.length >= 3 && nkey(r.memo).indexOf(pk) >= 0) return 0.7;

          같은 날짜 · 같은 적요인 줄들은 한 무리인데, 그중 한 줄만 거래처를 잘못 적어
          두는 일이 있습니다 (실제 : 9,110원 줄만 「KT텔레캅강남」, 나머지 넷은 「가스 7월_1건」).

          프리랜서 사업소득 건이 지결서에는 「공급가액 300,000 + 부가세 30,000 = 330,000」 으로
          잡혀 있는데, 실제로 나갈 때는 부가세가 없어 자금일보에는 **300,000** 으로 적힙니다.

    function amtGap(p, r) {

      if (!cand.length) return -1;

          지출결의서 330줄 × 자금일보 4,562줄 = 150만 번을 다 재던 것을,
          **금액이 10원 안으로 가까운 줄**만 꺼내 보도록 바꿨습니다.
          ① · ①-b 는 원래도 금액이 그만큼 가까울 때만 붙였으므로 **결과는 똑같습니다.**
          (실제 자료에서 12.7초 → 1초 아래로 줄었습니다) */
    const byAmt = new Map();
    bag.forEach(function (r, j) {
      [n0(r.krw), n0(r.gross)].forEach(function (v) {
        if (!v) return;
        const k2 = Math.round(v);
        let a = byAmt.get(k2);
        if (!a) { a = []; byAmt.set(k2, a); }
        if (a[a.length - 1] !== j) a.push(j);
      });
    });
    /** 지출결의서 한 줄과 **금액이 tol 원 안**인 자금일보 줄 번호들 */
    function nearJ(p, tol) {
      const seen = {}, out = [];
      [n0(p.amt), n0(p.supply)].forEach(function (pa) {
        if (!pa) return;
        const base = Math.round(pa);
        for (let dd = -tol; dd <= tol; dd++) {
          const a = byAmt.get(base + dd);
          if (!a) continue;
          for (let q = 0; q < a.length; q++) {
            const j = a[q];
            if (!seen[j]) { seen[j] = 1; out.push(j); }
          }
        }
      });
      return out;
    }

    /* ★★ 이름이 닮은 줄도 거래처마다 한 번만 찾아 둡니다 (2026-09-09 · 속도)
          nameHit 은 **지출결의서 거래처 이름 하나**에만 달려 있으므로,
          같은 거래처가 여러 줄이어도 한 번만 재면 됩니다. 결과는 똑같습니다. */
    const NAME_IDX = {};
    function nameCands(p) {
      const pk = nkey(p && p.party) || "?";
      let got = NAME_IDX[pk];
      if (got) return got;
      got = [];
      bag.forEach(function (r, j) { if (nameHit(p, r)) got.push(j); });
      NAME_IDX[pk] = got;
      return got;
    }

    const used = {};                                  /* 이미 쓴 자금일보 줄 */
    const st2 = use.map(function () { return null; }); /* 지출결의서 줄마다의 판정 */

    /* ── ① 한 건씩 — ★ **점수가 높은 짝부터** 붙입니다 ─────────────────
          예전 판은 지출결의서 줄 **차례대로** 붙였습니다. 그래서 같은 금액이 여러 번
          나오면 **먼저 나온 줄이 남의 짝을 가져가** 뒤엣것이 「없음」 으로 떨어졌습니다.
          (실제로 「페이시㈜ 179,080원」 이 자금일보에 있는데도 없음으로 나왔습니다)
          이제 모든 짝의 점수를 **먼저 다 매기고**, 높은 것부터 하나씩 붙입니다.
          같은 짝을 두 번 쓰지 않으므로 결과가 줄 순서에 흔들리지 않습니다. */
    const pairs = [];
    use.forEach(function (p, i) {
      nearJ(p, AMT_NEAR).forEach(function (j) {
        const r = bag[j];
        const sm = nameHit(p, r);
        if (!sm) return;
        const gap = amtGap(p, r);
        if (gap < 0 || gap > AMT_NEAR) return;
        let sc = sm * 4 + 5;
        sc -= gap * 0.03;                                   /* 금액이 딱 맞을수록 좋습니다 */
        sc += Math.min(2, overlap(r.memo, p.memo)) * 0.5;
        if (r.dt && p.dt) {
          const dd = Math.abs(new Date(r.dt) - new Date(p.dt)) / 86400000;
          if (dd <= 45) sc += 0.5;
          sc -= Math.min(1, dd / 400);                      /* 날짜가 멀수록 조금씩 깎습니다 */
        }
        pairs.push({ i: i, j: j, sc: sc, sim: sm, gap: gap });
      });
    });
    pairs.sort(function (a, b) { return b.sc - a.sc; });
    pairs.forEach(function (x) {
      if (st2[x.i] || used[x.j]) return;
      /* 금액이 2원을 넘게 다르면 **이름이 확실할 때만** 붙입니다 */
      if (x.gap > AMT_TOL && x.sim < NSIM_SURE) return;
      used[x.j] = 1;
      st2[x.i] = { kind: "one", j: x.j, sim: x.sim, gap: x.gap };
    });

    /* ── ①-b 이름이 안 맞아도 **금액이 똑같고 낱말이 겹치면** 같은 건입니다 ──
          자금일보의 거래처 칸이 비어 있는 줄이 있습니다.
            예) 「(빈칸) · 대만(전사공통)) 외주제작비_세관 세금 납부(TWD326,566) · 14,313,387」
                ← 지출결의서의 「대만 세관 / 세관 세금 납부 / 14,313,387」 과 같은 건입니다.
          금액이 원 단위까지 같고 낱말이 하나라도 겹치면 같은 건으로 봅니다. */
    use.forEach(function (p, i) {
      if (st2[i]) return;
      let best = -1, bs = -1;
      /* ★ 낱말은 **적요(프로젝트)계정_내용)** 로 봅니다 — 자금일보 적요와 같은 모양이라
            「내용」 만 볼 때보다 훨씬 잘 겹칩니다.
            실제 예 : 지결서 「(주)삼천리 · 도시가스요금(306470339)-201호 · 9,110원」
                     자금일보 「가스 8월_1건 · QWER 관리비용) 지급수수료_아티스트 숙소 전기요금 · 9,110원」
                     → 거래처 이름은 전혀 다르지만 「QWER 관리 비용」 「지급수수료」 가 겹치고
                       금액이 원 단위까지 같으므로 같은 건입니다. */
      const pj = jeokyo(p);
      const pbody = bodyOf(pj);
      nearJ(p, AMT_TOL).forEach(function (j) {
        const r = bag[j];
        if (used[j] || !amtHit(p, r)) return;
        /* ★ 날짜가 멀면 보지 않습니다 — 금액만 같은 두 달 전 건에 잘못 붙던 것을 막습니다
              (실제로 「정지은 8/13 330,000원」 이 「인코웍스 6/08 330,000원」 에 붙었습니다) */
        if (r.dt && p.dt && Math.abs(new Date(r.dt) - new Date(p.dt)) > 35 * 86400000) return;
        /* ★ 이름이 다른데 금액만 같다고 아무 데나 붙이면 안 됩니다.
              자금일보 쪽이 **셋 중 하나** 일 때만 붙입니다.
                (a) 거래처 칸이 비어 있다                       — 대만 세관
                (b) 「가스 7월_1건」 처럼 **묶어 적은 라벨** 이다
                (c) 적요의 **내용 부분(계정명 뒤)** 이 겹친다   — 강남교복 · 샬랩(샵랩 오타) */
        const noName = !String(r.party || "").trim();
        const lump = lumpSet[j] || /\d+\s*건/.test(String(r.party || ""));
        /* ★★ (c) 「이름이 다른데 적요가 겹친다」 는 **아주 세게** 겹칠 때만입니다 —
              재무리드 2026-09-09 자료에서 낱말 하나만 겹쳐도 붙어 큰 오매칭이 났습니다.
                샬랩(SHAL LAB) 「유튜브 채널 운영 및 콘텐츠 기획 제작 용역」
                  ↔ 주식회사 오프스튜디오 「TWC) 직접용역료_콘텐츠 제작건」   ← 「콘텐츠」 하나
                141스튜디오 「무신사(쵸단)」
                  ↔ 이상훈 「QWER_쵸단) 2026년 7월 음악제작 용역비」          ← 「쵸단」 하나
              → 내용이 **세 낱말 이상** 겹치고 **날짜가 7일 안**일 때만 붙입니다.
                (샵랩 오타 · 강남교복처럼 진짜로 같은 건은 내용이 통째로 겹칩니다) */
        if (!noName && !lump) {
          if (overlap(pbody, bodyOf(r.memo)) < 3) return;
          if (!r.dt || !p.dt) return;
          if (Math.abs(new Date(r.dt) - new Date(p.dt)) > 7 * 86400000) return;
        }
        const ov = overlap(p.party + " " + pj, r.party + " " + r.memo + " " + r.holder);
        if (ov < 1) return;
        if (ov > bs) { bs = ov; best = j; }
      });
      if (best >= 0) { used[best] = 1; st2[i] = { kind: "word", j: best, sim: 0.5, ov: bs }; }
    });

    /* ── ①-c 외화 건 — **금액으로는 절대 못 맞춥니다** ──────────────
          자금일보의 원화는 **보낸 날 환율**로 환산한 값이고,
          지출결의서의 원화는 **결의한 날 환율**로 환산한 값입니다.
          게다가 자금일보에는 세금·수수료를 뺀 **실제 보낸 외화**가 적혀 있습니다.
            지결서   Amber  2,390,300원 (NT 55,000)
            자금일보 Amber  2,100,812.94원 (TWD 48,339)   ← 같은 건인데 13% 차이
          → 외화 줄(금액(외화) 가 적힌 줄)은 **거래처 + 적요**로 맞춥니다. */
    use.forEach(function (p, i) {
      if (st2[i]) return;
      const pj2 = jeokyo(p);
      let best = -1, bs = 1;
      nameCands(p).forEach(function (j) {
        const r = bag[j];
        if (used[j] || !n0(r.fx)) return;                  /* 외화가 적힌 줄만 */
        if (nameHit(p, r) < NSIM_SURE) return;             /* 거래처는 확실해야 합니다 */
        const ov = overlap(pj2, r.memo);
        if (ov < 2) return;                                /* 적요가 두 낱말 이상 겹쳐야 합니다 */
        if (ov > bs) { bs = ov; best = j; }
      });
      if (best >= 0) { used[best] = 1; st2[i] = { kind: "fx", j: best, sim: 0.9, ov: bs }; }
    });

    /* ── ①-d 자금일보에 **자릿수를 빠뜨려 적은 것** ────────────────
          거래처가 확실하고 · 적요 내용이 세 낱말 이상 겹치고 · 날짜가 이틀 안이고 ·
          금액이 **자릿수만 빠진 모양**이면 같은 건입니다.
            지결서 「(주)에이펀인터렉티브 · 헤비 썸머 팬미팅 콘텐츠 제작 · 119,108,000 · 8/13」
            자금일보 「(주)에이펀인터렉티브 · Hebi) 외주제작비_헤비 썸머 팬미팅 콘텐츠 제작 · 19,108,000 · 8/13」
          ★ 조건 넷을 모두 채워야 합니다 — 실제 자료 전수로 시험해 **이 한 건만** 걸렸습니다.
            (날짜만 같고 이름·적요가 비슷한 짝은 25건이나 되는데, 그것들은 서로 다른 건입니다) */
    use.forEach(function (p, i) {
      if (st2[i]) return;
      const pb2 = bodyOf(jeokyo(p));
      let best = -1, bs = 2;
      nameCands(p).forEach(function (j) {
        const r = bag[j];
        if (used[j]) return;
        if (nameHit(p, r) < NSIM_SURE) return;
        if (!r.dt || !p.dt) return;
        if (Math.abs(new Date(r.dt) - new Date(p.dt)) > 2 * 86400000) return;
        if (!digitTypo(p.amt, r.krw) && !digitTypo(p.amt, r.gross)) return;
        const ov = overlap(pb2, bodyOf(r.memo));
        if (ov < 3) return;
        if (ov > bs) { bs = ov; best = j; }
      });
      if (best >= 0) {
        used[best] = 1;
        st2[i] = { kind: "typo", j: best, sim: 0.9, ov: bs, gap: amtGap(p, bag[best]) };
      }
    });

    /* ── ② 묶음 — 같은 거래처의 남은 건을 **더해서** 맞춰 봅니다 ────
          부분합(subset sum) 을 씁니다. 어느 몇 건을 더해야 그 금액이 되는지 찾습니다. */
    /* ★ 원 단위 절사 — 재무리드 2026-09-03 :
          「실제 **용도별 합계**에서 원 단위가 절사되기 때문에」
          자금일보는 지출결의서 여러 건을 용도별로 **더한 뒤 10원 미만을 버려서** 적습니다.
          그래서 부분합이 딱 떨어지지 않고 **1~9원 모자란 값**이 됩니다.
            예) 지결서 합 2,398,157원  →  자금일보 2,398,150원
          한 건씩 볼 때(AMT_TOL 2원)와 달리, 묶음은 **절사분까지** 같은 것으로 봅니다. */
    function subsetTo(items, target) {
      const cut = Math.floor(target / 10) * 10;      /* 자금일보에 적힌 값의 10원 자리 */
      const lo = target - AMT_TOL, hi = target + AMT_TOL;
      const got = function (m) {
        /* ① 딱 맞는 것부터 (2원까지) */
        for (let t = lo; t <= hi; t++) {
          const v = m.get(t);
          if (v && v.length >= 2) return v;
        }
        /* ② 없으면 **10원 미만이 잘린 것** 으로 봅니다 — 합을 절사하면 같아지는 것 */
        for (let t = cut; t <= cut + 9; t++) {
          const v = m.get(t);
          if (v && v.length >= 2 && Math.floor(t / 10) * 10 === cut) return v;
        }
        return null;
      };
      let reach = new Map(); reach.set(0, []);
      for (let k = 0; k < items.length; k++) {
        const a = items[k].amt;
        if (!a || a > target + AMT_NEAR) continue;
        const add = [];
        reach.forEach(function (path, sum) {
          const s2 = sum + a;
          if (s2 > target + AMT_NEAR) return;
          if (!reach.has(s2)) add.push([s2, path.concat([k])]);
        });
        for (let q = 0; q < add.length; q++) {
          if (reach.size > 60000) break;
          reach.set(add[q][0], add[q][1]);
        }
        const f = got(reach);
        if (f) return f;
      }
      return got(reach);
    }

    const groups = {};
    use.forEach(function (p, i) {
      if (st2[i]) return;
      const k = nkey(p.party) || "?";
      (groups[k] = groups[k] || []).push(i);
    });
    Object.keys(groups).forEach(function (k) {
      const idx = groups[k];
      if (idx.length < 2) return;
      const cands = [];
      nameCands(use[idx[0]]).forEach(function (j) { if (!used[j]) cands.push(j); });
      cands.sort(function (a, b) { return n0(bag[b].krw) - n0(bag[a].krw); });
      cands.forEach(function (j) {
        const open = idx.filter(function (i) { return !st2[i]; });
        if (open.length < 2) return;
        const items = open.map(function (i) { return { i: i, amt: n0(use[i].amt) }; });
        const tries = [n0(bag[j].krw), n0(bag[j].gross)];
        for (let t = 0; t < tries.length; t++) {
          if (!tries[t]) continue;
          /* ★★ 안전장치 — 재무리드 2026-09-07 : 「그립 엠이 7일 지출내역으로 안 올라오는데?」
                그립 엠 8월분 44건 가운데 **7건만 골라** 더했더니 7월분 자금일보 줄
                (5,511,000원) 과 딱 맞아 「이미 나감」 으로 붙어 버렸습니다.
                33,000 · 132,000 · 275,000 · 440,000 처럼 **동그란 금액이 잔뜩** 있으면
                아무 숫자나 만들어집니다. 그래서 아래 둘 중 하나일 때만 묶습니다.
                  ① 그 거래처의 **남은 건을 몽땅** 더했을 때 맞는다  (배철순 2건 · 마젠타 19건 …)
                  ② 일부만 골랐다면 — 조각이 넷 이하이고 **모두 자금일보 줄 날짜 ±10일 안**
                일부를 골라 맞춘 것은 **우연일 수 있어** 붙이지 않고 「없음」 으로 둡니다. */
          const whole = items.reduce(function (a2, x) { return a2 + x.amt; }, 0);
          const cutT = Math.floor(tries[t] / 10) * 10;
          let sub = null;
          if (Math.abs(whole - tries[t]) <= AMT_TOL
              || (Math.floor(whole / 10) * 10 === cutT && whole >= cutT)) {
            sub = items.map(function (_, kk) { return kk; });      /* ① 몽땅 */
          } else {
            sub = subsetTo(items, tries[t]);                        /* ② 일부 */
            if (sub && sub.length !== items.length) {
              if (sub.length > 4) sub = null;
              else {
                const rd = bag[j].dt;
                let far = false;
                sub.forEach(function (kk) {
                  const pd = use[items[kk].i].dt;
                  if (pd && rd && Math.abs(new Date(pd) - new Date(rd)) > 10 * 86400000) far = true;
                });
                if (far) sub = null;
              }
            }
          }
          if (!sub || sub.length < 2) continue;
          const mates = sub.map(function (kk) { return items[kk].i; });
          const real = mates.reduce(function (a, i) { return a + n0(use[i].amt); }, 0);
          mates.forEach(function (i) {
            st2[i] = { kind: "grp", j: j, n: mates.length, sum: tries[t], mates: mates,
                       /* 이름 유사값을 채워 둡니다 — 안 채우면 화면에 0% 로 떠서 놀라게 합니다 */
                       sim: nameHit(use[i], bag[j]),
                       gap: Math.abs(real - tries[t]), real: real };
          });
          used[j] = 1;
          break;
        }
      });
    });

    /* ── ②-b 나눠 지급 — 한 건이 **여러 날에 나뉘어** 나간 것 ──────
          재무리드 2026-09-06 : 「나라물류 건의 경우 8월 13과 16일 나눠서
            지급이 되었네요. 이 부분도 체크가 되어야겠네요.」
              지출결의서   나라물류  264,000원  ← 한 건
              자금일보     8/13 110,000 · 8/18 154,000  ← 두 줄
          ② 묶음(지결서 여러 건 → 자금일보 한 줄) 의 **반대 방향**입니다.
          한 건이 계약금·잔금처럼 나뉘어 나가면 한 줄씩 볼 때는 금액이 안 맞아
          「없음」 으로 떨어지고, 그대로 넣으면 **이미 나간 돈을 또 내보냅니다.**

          잘못 붙으면 큰일이라 조건을 좁게 두었습니다.
            · 거래처 이름이 확실할 것 (85% 이상)

    const real = [], late = [];

    });

  async function onPaper(file) {
    if (!file) return;
    setErr(null); setBusy("지출결의서를 읽는 중…"); st.setSaving("지출결의서를 읽는 중…");
    try {
      const X = await loadXLSX();
      const buf = await file.arrayBuffer();
      const wb = X.read(buf, { type: "array", cellDates: true });
      /* 시트가 여럿이면 **줄이 가장 많은 시트**부터 봅니다 (첫 시트가 표지인 경우가 많습니다) */
      const sheets = wb.SheetNames.map(function (nm) {
        const aoa = X.utils.sheet_to_json(wb.Sheets[nm], { header: 1, raw: true, blankrows: true, defval: null });
        return { name: nm, aoa: aoa, n: aoa.filter(function (r) {
          return (r || []).some(function (v) { return String(v == null ? "" : v).trim() !== ""; }); }).length };
      });
      setPapSheets(sheets.map(function (x) { return { name: x.name, n: x.n }; }));
      const best = sheets.slice().sort(function (a, b) { return b.n - a.n; })[0];
      if (!best || !best.n) throw new Error("이 파일에는 읽을 내용이 없습니다 (빈 파일입니다).");
      setPapAll(sheets);
      usePaperSheet(best.name, sheets, file.name);
    } catch (e) {
      setErr(e.message || String(e)); st.setError("지출결의서를 읽지 못했습니다");
    }
    setBusy("");
  }

  /* 시트 하나를 골라 읽습니다 — 못 맞춰도 **칸 맞추기 화면은 엽니다** */
  function usePaperSheet(nm, all, fname) {
    const list = all || papAll;
    const one = list.filter(function (x) { return x.name === nm; })[0];
    if (!one) return;
    const hd = findHeader(one.aoa);
    const rows = readPaper(one.aoa, hd);
    setPapSheet(nm);
    setRawPaper(one.aoa); setHdr(hd); setPaper(rows);

    /* ★ 지출결의서의 가장 이른 「지급기한」 보다 한 달 앞선 주차까지 **자동으로 켭니다.**
          7월 기한 건은 7월 안에 (때로는 6월 말에) 이미 나갔습니다.
          주차를 좁게 잡아 두면 그 줄이 자루에 안 들어와 「없음」 으로 잘못 떨어집니다.
          — 재무리드 : 「지급기한이 7월이었으면 7월 어느 날엔가 다 나갔는데 검증을 못 하고 있다」 */
    const ds = rows.map(function (x) { return x.dt; }).filter(Boolean).sort();
    if (ds.length && sheets.length) {
      const need = addDays(ds[0], -35);
      const np = Object.assign({}, pick);
      let more = 0;
      sheets.forEach(function (sh) {
        if (!np[sh.name] && String(sh.max || "") >= need) { np[sh.name] = true; more++; }
      });
      if (more) { setPick(np); setWide({ n: more, from: need, due: ds[0] }); }
      else setWide(null);
    }
    /* 아는 서식이면 칸 맞추기를 접어 둡니다 — 짐작한 서식이면 펼쳐서 확인하게 합니다 */
    setOpenMap(!hd.form);
    if (fname) setPaperName(fname);
    setEdit({}); setKeep({});
    if (rows.length) {
      setErr(null);
      st.setSaved(rows.length + "건을 읽었습니다");
    } else {
      setErr(null);
      st.setEditing("칸을 맞춰 주세요");
    }
  }

  /* ④ 대조 — 자금일보에 없는 것만 고릅니다 ------------------------- */
  /* ── ★★ 실제 자료를 뜯어 보고 알아낸 것 — 「한 건 = 한 줄」 이 아닙니다 ────
        지출결의서 여러 건이 자금일보에서는 **한 줄로 합쳐져** 나갑니다.
          · 배철순  26,000 + 24,000            = 50,000  「여비교통비 … 외 1건」
          · 시요밍  9건                        = 371,235 「7월_이시연_개인 경비 청구」
          · 마젠타스튜디오 19건                = 965,639 「7월_마젠타_개인 경비 청구」
          · 케이티텔레캅 2건                   = 501,600 「지급수수료_텔레캅서비스」
        그래서 한 건씩만 맞춰 보면 이런 건이 전부 「없음」 으로 나옵니다.
        → ① 한 건씩 맞춰 보고, ② 남은 것은 **같은 거래처끼리 더해서** 맞춰 봅니다. */
  /* ★ 자금일보에서 자동이체로 나가는 곳 장부 — 올린 파일에서 그때그때 뽑습니다 */
  const autoMap = useMemo(function () { return autoBook(bagAll); }, [bagAll]);
  const autoN = useMemo(function () {
    return bagAll.filter(function (r) { return /자동이체/.test(String(r.proof || "")); }).length;
  }, [bagAll]);

  /* ★ 지출결의서 한 줄마다 「왜 빼는가」 를 붙입니다 (없으면 넣습니다) */
  const offAll = useMemo(function () {
    const hit = autoHitOf(autoMap);
    return paper.map(function (p) { return { p: p, off: offOf(p, hit) }; });
  }, [paper, autoMap]);

  /* 켜고 끄는 자리 — 「마이너스 줄」 은 언제나 뺍니다 */
  const offOn = { same: noSame, own: noOwn, slip: noSlip, card: noCard,
                  auto: noAuto, ref: noRef, fee: noSkip, minus: true };
  const offSet = { same: setNoSame, own: setNoOwn, slip: setNoSlip, card: setNoCard,
                   auto: setNoAuto, ref: setNoRef, fee: setNoSkip };

  const offGrp = useMemo(function () {
    const m = {};
    offAll.forEach(function (x) {
      if (!x.off) return;
      const k = x.off.k;
      if (!m[k]) m[k] = { k: k, n: 0, amt: 0, rows: [] };
      m[k].n += 1; m[k].amt += n0(x.p.amt);
      m[k].rows.push(x);
    });
    return OFF_ORDER.filter(function (k) { return m[k]; }).map(function (k) { return m[k]; });
  }, [offAll]);

  const use = useMemo(function () {
    return offAll.filter(function (x) {
      if (x.p.isMinus) return false;                 /* ★ 마이너스 줄은 언제나 뺍니다 */
      if (!x.off) return true;
      if (x.off.k === "minus") return false;
      return !offOn[x.off.k];
    }).map(function (x) { return x.p; });
  }, [offAll, noCard, noRef, noSkip, noAuto, noSlip, noSame, noOwn]);

  /* 실제로 뺀 건수 (켜 둔 까닭만 셉니다) — 엑셀 「읽는 법」 에 그대로 적습니다 */
  const offCut = useMemo(function () {
    return offGrp.filter(function (g2) { return g2.k === "minus" || offOn[g2.k]; })
                 .reduce(function (a, g2) { return a + g2.n; }, 0);
  }, [offGrp, noCard, noRef, noSkip, noAuto, noSlip, noSame, noOwn]);

  /* 대조는 자금일보 **전체**에서 합니다 (고른 주차와 상관없이) */
  const cmp = useMemo(function () {
    return matchCash(use, bagAll, cutDay, today());
  }, [use, bagAll, cutDay]);

  /* ★ 우리가 쓰는 계정 이름들 — 지출결의서에서 그때그때 모읍니다 (오기 체크의 잣대입니다) */
  const voc = useMemo(function () { return acctVocab(paper); }, [paper]);
  /* ★ 금액·적요 오기 체크 — 짝이 맞은 줄까지 다시 들여다봅니다 (재무리드 2026-09-09) */
  const audit = useMemo(function () {
    if (!paper.length && !bagAll.length) return null;
    return auditAll(paper, bagAll, cmp, voc);
  }, [paper, bagAll, cmp, voc]);
  /* ★ 매달 10일 세금 네 줄 — 금액이 없어도 자리를 잡아 둡니다 (재무리드 2026-09-09) */
  const tax10 = useMemo(function () {
    if (!bagAll.length) return null;
    return tax10Of(bagAll, day10Of(cutDay || today()));
  }, [bagAll, cutDay]);
  /* ★ 급여(25일) · 기명식 법인카드(급여일 전주 목요일) — 10일 세금과 같은 방식 (재무리드 2026-09-09) */
  const fixPay = useMemo(function () {
    if (!bagAll.length) return null;
    return fixPayOf(bagAll, String(cutDay || today()).slice(0, 7));
  }, [bagAll, cutDay]);
  /* ★ 자동이체로 나가는 곳 명단 — 자금일보에서 찾은 것 + 고정 명단 */
  const autoList = useMemo(function () {
    const hitN = {};
    offAll.forEach(function (x) {
      if (!x.off || x.off.k !== "auto") return;
      const a = autoHitOf(autoMap)(x.p);
      const nm = a ? a.name : "(모름)";
      if (!hitN[nm]) hitN[nm] = { name: nm, n: 0, amt: 0, fix: !!(a && a.fix), why: (a && a.why) || "" };
      hitN[nm].n += 1; hitN[nm].amt += n0(x.p.amt);
    });
    /* 자금일보에서 찾은 곳 — 통이름 열쇠만 셉니다 (밑동 열쇠는 같은 곳이 겹쳐 보입니다) */
    const book = [];
    Object.keys(autoMap).forEach(function (k) {
      const b = autoMap[k];
      if (!b.full && k.indexOf("계정:") !== 0) return;
      book.push({ name: b.name, n: b.n, amt: b.amt, acct: k.indexOf("계정:") === 0 });
    });
    book.sort(function (a, b) { return b.n - a.n; });
    const fix = AUTO_FIX.map(function (f) {
      const g = hitN[f.name];
      return { name: f.name, why: f.why, n: g ? g.n : 0, amt: g ? g.amt : 0 };
    });
    return { book: book, fix: fix,
             paper: Object.keys(hitN).map(function (k) { return hitN[k]; })
                      .sort(function (a, b) { return b.n - a.n; }) };
  }, [autoMap, offAll]);

  /* 새로 만들 줄 — 「없음」 + 사람이 「없음」 으로 되돌린 「비슷함」 */
  const news = useMemo(function () {
    if (!cmp) return [];
    const lateSet = {};
    (cmp.late || []).forEach(function (m) { if (m && m.p) lateSet[m.p.id] = 1; });
    const src = cmp.miss
      .concat(takeLate ? (cmp.late || []) : [])
      .concat((cmp.late || []).filter(function (m) { return keep[m.p.id]; }))
      .concat(cmp.hit.filter(function (m) { return keep[m.p.id]; }))
      .filter(function (m) { return !drop[m.p.id]; });
    return src.map(function (m) {
      const g = guessProof(m.p, book);
      const e = edit[m.p.id] || {};
      const row = {
        id: m.p.id, dt: m.p.dt, party: m.p.party,
        /* ★ 적요는 자금일보 규칙대로 **프로젝트)계정_내용** 으로 만듭니다 */
        memo: jeokyo(m.p), memoRaw: m.p.memo, proj: m.p.proj, who: m.p.who,
        /* 자금일보의 「구분」 칸 — 지출결의서의 「용도」 로 정합니다 (콘텐츠 / 판관비) */
        gubun: e.gubun !== undefined ? e.gubun : (m.p.gubun || "콘텐츠"),
        bank: m.p.bank || "", accno: m.p.accno || "", holder: m.p.holder || "",
        isCard: !!m.p.isCard, proofRaw: m.p.proofRaw || "", use: m.p.use || "",
        proof: e.proof !== undefined ? e.proof : g.proof,
        artist: e.artist !== undefined ? e.artist : g.artist,
        gross: e.gross !== undefined ? e.gross : n0(m.p.amt),
        insFix: e.insFix,
        from: g.from, near: m.r || m.near || null, nearSim: m.nearSim || m.sim || 0,
        nearAmt: m.nearAmt || null, nearGap: m.nearGap || 0,
        dup: m.dup || null, dupGap: m.dupGap || 0,
        sameN: m.p.sameN || 0, sameI: m.p.sameI || 0,
        late: !!lateSet[m.p.id],
        sameAmt: m.sameAmt || [], score: m.s,
      };
      const t = calcTax(row);
      row.rate = t.rate; row.tax = t.tax; row.ltax = t.ltax; row.ins = t.ins; row.net = t.net;
      return row;
    }).sort(function (a, b) { return String(a.dt || "9").localeCompare(String(b.dt || "9")); });
  }, [cmp, keep, edit, book, takeLate, drop]);

  /* ── ⑤ 언제 나가나 ─────────────────────────────────────────
       자금 집행은 매주 월·목이고, 그 날이 공휴일이면 다음 영업일입니다.
       지급기한이 이번 집행일이거나 이미 지났으면 **당일**,
       아직 오지 않았으면 **차기** 로 보냅니다. (재무리드 2026-08-31 지시)
       두 날짜와 계좌는 화면에서 고칠 수 있고, 줄마다 따로 옮길 수도 있습니다. */
  const payNow = useMemo(function () { return payDayFrom(today()); }, []);
  const [payA, setPayA] = useState(function () { return g0("payA", payNow.day); });
  const [payB, setPayB] = useState(function () { return g0("payB", nextPay(payNow).day); });
  const [acct, setAcct] = useState(function () { return g0("acct", ACCTS[0]); });
  const [blk, setBlk] = useState(function () { return g0("blk", {}); });   /* {줄id:"A"|"B"} — 사람이 옮긴 것 */
  const payWhy = payNow.why;

  /** 이 줄은 당일(A) 인가 차기(B) 인가 */
  function blockOf(r) {
    if (blk[r.id]) return blk[r.id];
    const d = String(r.dt || "").slice(0, 10);
    if (!d) return "A";                          /* 기한을 못 읽었으면 당일로 — 놓치는 것이 더 위험합니다 */
    return d > payA ? "B" : "A";
  }
  function flipBlock(r) {
    st.setEditing("옮기는 중…");
    const to = blockOf(r) === "A" ? "B" : "A";
    setBlk(function (o) { const n = Object.assign({}, o); n[r.id] = to; return n; });
  }
  const newsA = news.filter(function (r) { return blockOf(r) === "A"; });
  const newsB = news.filter(function (r) { return blockOf(r) === "B"; });

  /* ★ 읽은 것을 들고 있습니다 — 탭을 옮겼다 와도 그대로입니다.
       (파일 자체가 아니라 **읽어 낸 표**만 둡니다. 어디에도 올리지 않습니다.) */
  useEffect(function () {
    if (!cashName && !paperName) return;
    cashSave(props.entity, {
      cashName: cashName, sheets: sheets, pick: pick, span: span, noCard: noCard, noRef: noRef, noSkip: noSkip,
      noAuto: noAuto, noSlip: noSlip, noSame: noSame, noOwn: noOwn, asOf: asOf, takeLate: takeLate,
      paperName: paperName, paper: paper, hdr: hdr, rawPaper: rawPaper,
      papSheets: papSheets, papAll: papAll, papSheet: papSheet,
      edit: edit, keep: keep, payA: payA, payB: payB, acct: acct, blk: blk, drop: drop,
    });
  }, [props.entity, cashName, sheets, pick, span, noCard, noRef, noSkip, noAuto, noSlip, noSame, noOwn, asOf, takeLate, paperName, paper, hdr, rawPaper,
      papSheets, papAll, papSheet, edit, keep, payA, payB, acct, blk, drop]);

  /** 다 지우고 처음부터 — 다른 달 자료를 올릴 때 씁니다 */
  function clearAll() {
    cashDrop(props.entity);
    setCashName(""); setSheets([]); setPick({}); setKeptAt(0);
    setPaperName(""); setPaper([]); setHdr(null); setRawPaper(null);
    setPapSheets([]); setPapAll([]); setPapSheet("");
    setEdit({}); setKeep({}); setBlk({}); setDrop({}); setErr(null);
    const p = payDayFrom(today()); setPayA(p.day); setPayB(nextPay(p).day);
    st.setSaved("다 지웠습니다 — 파일을 새로 올려 주세요");
  }

  function setRow(id, k, v) {
    st.setEditing("고치는 중…");
    setEdit(function (o) {
      const n = Object.assign({}, o);
      n[id] = Object.assign({}, n[id] || {}, (function () { const x = {}; x[k] = v; return x; })());
      return n;
    });
  }

  /* ⑤ 새 엑셀 만들기 ----------------------------------------------- */
  /* ══════════════════════════════════════════════════════════════
       ★ 「자금일보 양식.xlsx」 를 한 칸씩 뜯어서 그대로 다시 만듭니다.
         (재무리드 2026-08-31 : 「이 양식대로 새로 만들어야 함」)

       덩어리가 **둘** 입니다 —
         1. 출금예정(당일 추가되어야 하는 것)          ← 지급요청기한이 지났거나 오늘인 것
         1. 출금예정(다음 결제일에 추가되어야 하는 것)  ← 지급요청기한이 아직 안 온 것

       한 덩어리의 생김새 (양식과 같은 순서입니다)
         ┌ 세율칸   N「사업소득세」 O 3%      ← 아래 소득세 수식이 이 칸을 가리킵니다
         ├ 제목줄   B「1. 출금예정(…)」
         ├ 머리글   B일자 C구분 D계좌 E거래처 F적요(F:H 병합) I금액(원화) J금액(외화)
         │          O세율 P지급액 Q소득세 R지방소득세 S예술인고용보험
         │          ※ K·L·M·N 에는 **이름이 없습니다** — 자금일보 원본이 그렇습니다
         │            (자료는 K예금주 · L은행 · M계좌번호 · N증빙구분 자리에 들어갑니다)
         └ 자료줄   B~J 테두리 · 날짜 mm-dd-yy · 금액 회계서식 · M 은 문자(0 이 안 잘리게)

       ★ 숫자가 아니라 **살아 있는 수식**을 넣습니다 (양식이 그렇게 되어 있습니다)
         Q 소득세          = ROUNDDOWN(P행 * $O$세율칸, -1)
         R 지방소득세      = ROUNDDOWN(Q행 * 10%, -1)
         S 예술인고용보험  = ROUNDDOWN(P행 * 0.6%, -1)
         T 검산            = P행 - Q행 - R행 - S행 = I행     → TRUE 여야 맞는 것입니다
         세율칸의 3% 만 고치면 그 덩어리 전체가 다시 계산됩니다.
     ══════════════════════════════════════════════════════════════ */
  async function makeXlsx() {
    if (!news.length) return;
    setBusy("엑셀을 만드는 중…"); st.setSaving("엑셀을 만드는 중…");
    try {
      const E = await loadExcelJS();
      const wb = new E.Workbook();
      wb.creator = "3Y 재무관리시스템"; wb.created = new Date();
      const ws = wb.addWorksheet("자금일보", { views: [{ zoomScale: 85 }] });

      /* 열 너비 — 양식 파일에서 잰 값 그대로입니다 */
      const WID = { A: 4.4, B: 14.7, C: 9, D: 12, E: 26.4, F: 16.9, G: 9, H: 21.1,
                    I: 14.7, J: 12, K: 11.4, L: 23.3, M: 18.7, N: 10.3,
                    O: 4.1, P: 12.1, Q: 17.4, R: 12.1, S: 14.4, T: 8.2 };
      Object.keys(WID).forEach(function (c) { ws.getColumn(c).width = WID[c]; });

      const thin = { style: "thin" };
      const BOX = { top: thin, left: thin, bottom: thin, right: thin };
      const MID = { vertical: "middle" };
      const CEN = { horizontal: "center", vertical: "middle" };
      const LFT = { horizontal: "left", vertical: "middle" };
      function fnt(sz, bold) { return { name: XL_FONT, size: sz, bold: !!bold }; }

      /* ── 맨 위 제목 (B1:J1 병합 · 24pt) ── */
      ws.mergeCells("B1:J1");
      const t1 = ws.getCell("B1");
      t1.value = "자금일보"; t1.font = fnt(24, true); t1.alignment = CEN;
      ws.getRow(1).height = 45;

      const HEAD = { B: "일자", C: "구분", D: "계좌", E: "거래처", F: "적요",
                     I: "금액(원화)", J: "금액(외화)",
                     O: "세율", P: "지급액", Q: "소득세", R: "지방소득세", S: "예술인고용보험" };
      const LEFT9 = ["B", "C", "D", "E", "F", "G", "H", "I", "J"];

      /** 한 덩어리를 그립니다. 돌려주는 값 = 마지막 자료줄 **다음** 줄 번호 */
      function block(rowFrom, title, rows, dayIso) {
        const aR = rowFrom;        /* 세율칸 */
        const tR = aR + 1;         /* 제목줄 */
        const hR = aR + 2;         /* 머리글 */

        const an = ws.getCell("N" + aR);
        an.value = "사업소득세"; an.font = fnt(11); an.alignment = MID;
        an.border = { left: thin, top: thin, bottom: thin };
        const ao = ws.getCell("O" + aR);
        ao.value = RATE_BIZ; ao.numFmt = "0%"; ao.font = fnt(11); ao.alignment = MID;
        ao.border = { right: thin, top: thin, bottom: thin };
        ws.getRow(aR).height = 15.75;

        const tc = ws.getCell("B" + tR);
        tc.value = title; tc.font = fnt(10, true); tc.alignment = MID;
        ws.getRow(tR).height = 16.5;

        /* 머리글도 양식과 같은 숫자서식을 답니다 (양식 파일이 그렇게 되어 있습니다) */
        const HFMT = { I: XF_MONEY, J: XF_MONEY, O: "0%", P: XF_MONEY, Q: XF_MONEY,
                       R: XF_MONEY, S: XF_MONEY };
        LEFT9.forEach(function (c) {
          const x = ws.getCell(c + hR);
          if (HEAD[c]) x.value = HEAD[c];
          x.font = fnt(10, true); x.alignment = CEN; x.border = BOX;
          if (HFMT[c]) x.numFmt = HFMT[c];
          x.fill = { type: "pattern", pattern: "solid", fgColor: { argb: XL_HEAD_BG } };
        });
        ["O", "P", "Q", "R", "S"].forEach(function (c) {
          const x = ws.getCell(c + hR);
          x.value = HEAD[c]; x.font = fnt(11); x.alignment = CEN; x.border = { bottom: thin };
          if (HFMT[c]) x.numFmt = HFMT[c];
        });
        ws.mergeCells("F" + hR + ":H" + hR);
        ws.getRow(hR).height = 17.25;

        rows.forEach(function (r, i) {
          const R = hR + 1 + i;
          ws.getRow(R).height = 16.5;
          function put(c, v, fmt, al, sz) {
            const x = ws.getCell(c + R);
            if (v !== null && v !== undefined && v !== "") x.value = v;
            x.font = fnt(sz || 10); x.alignment = al || MID;
            if (fmt) x.numFmt = fmt;
            return x;
          }
          /* ★ 거래처·적요는 같은데 금액이 다른 줄 — **연한 붉은색**으로 칠하고 K 에 적습니다 */
          const warn = !!r.dup || (r.sameN > 1) || !!r.late;
          LEFT9.forEach(function (c) {
            const z = ws.getCell(c + R);
            z.border = BOX;
            if (warn) z.fill = { type: "pattern", pattern: "solid", fgColor: { argb: XL_WARN_BG } };
          });
          put("B", xlSerial(dayIso), XF_DATE, CEN);
          put("C", r.gubun || "콘텐츠", null, CEN);
          put("D", acct || "", null, CEN);
          put("E", r.party || "");
          put("F", r.memo || "");
          put("I", n0(r.net), XF_MONEY);
          /* K·L·M·N — 제목줄에는 이름이 없지만 자료는 이 자리에 들어갑니다 */
          const kSay = r.dup
            ? ("★ 확인 필요 — 자금일보에 같은 적요 " + num(n0(r.dup.krw)) + "원 (" + (r.dup.dt || "") + ")")
            : (r.sameN > 1)
              ? ("★ 확인 필요 — 지출결의서에 똑같은 줄 " + num(r.sameN) + "개 중 " + num(r.sameI + 1)
                 + "번째입니다. 같은 줄이 여러 번 실린 것이면 지워 주세요.")
              : r.late
                ? ("★ 확인 필요 — 지급기한이 자금일보 기준일(" + (cutDay || "") + ") 보다 뒤입니다. "
                   + "그 사이에 이미 나갔다면 자금일보에 아직 안 적혀 있을 수 있습니다.")
                : ((r.holder && r.holder !== r.party) ? r.holder : "");
          put("K", kSay, null, MID, 10);
          put("L", r.bank || "", null, MID, 11);
          put("M", r.accno || "", XF_TEXT, LFT, 11);
          put("N", r.proof || "", null, MID, 11);

          if (r.rate) {
            put("O", r.rate, (Math.round(r.rate * 1000) % 10 === 0) ? "0%" : "0.0%", MID, 11);
            put("P", n0(r.gross), XF_MONEY, MID, 11);
            /* 사업소득 3% 는 위 세율칸을 가리킵니다 (양식과 같은 수식).
               기타소득 8.8% 처럼 세율이 다른 줄은 그 줄의 O 칸을 씁니다. */
            const ref = (r.rate === RATE_BIZ) ? ("$O$" + aR) : ("O" + R);
            put("Q", { formula: "ROUNDDOWN(P" + R + "*" + ref + ",-1)" }, XF_MONEY, MID, 11);
            put("R", { formula: "ROUNDDOWN(Q" + R + "*10%,-1)" }, XF_MONEY, MID, 11);
            if (r.ins) {
              const manual = (r.insFix !== undefined && r.insFix !== null);
              put("S", manual ? n0(r.ins) : { formula: "ROUNDDOWN(P" + R + "*0.6%,-1)" },
                  XF_MONEY, MID, 11);
            }
            put("T", { formula: "P" + R + "-Q" + R + "-R" + R + "-S" + R + "=I" + R }, null, MID, 11);
          }
        });
        return hR + 1 + rows.length;
      }

      const endA = block(2, "1. 출금예정(당일 추가되어야 하는 것)", newsA, payA);
      block(endA + 8, "1. 출금예정(다음 결제일에 추가되어야 하는 것)", newsB, payB);

      /* ── 둘째 장 : 읽는 법 (신입사원용) ─────────────────────────
           첫 장은 자금일보 양식 그대로 두어야 하므로, 설명은 여기 모읍니다. */

                     + "(고른 주차와 상관없이 전체에서 「이미 나갔는가」 를 찾았습니다)");
      say("", "");
      say("빼는 것", num(offCut) + "건을 뺐습니다 — 지출결의서에는 있지만 돈이 따로 나가지 않는 줄입니다", true);

                           : "화면에서 빼 두셨습니다 — 이 엑셀에는 들어 있지 않습니다."))
            : "없습니다");
      say("당일 집행", dayKo(payA) + " · " + num(newsA.length) + "건 · 실지급 합계 "

      say("차기 집행", dayKo(payB) + " · " + num(newsB.length) + "건 · 실지급 합계 "
                    + num(newsB.reduce(function (a, r) { return a + n0(r.net); }, 0)) + "원");
      say("나눠 지급", (cmp && cmp.splitN)

            : "없습니다");
      say("확인 필요", (cmp && cmp.check && cmp.check.length)
            ? (num(cmp.check.length) + "건 — 거래처·적요는 같은데 금액이 다릅니다. 셋째 장 「확인 필요」 를 봐 주세요. "
               + "첫 장에서도 연한 붉은색으로 칠하고 K 칸에 적어 두었습니다.")
            : "없습니다");
      say("", "");
      say("어떻게 나눴나", "지출결의서의 「지급기한」이 " + dayKo(payA) + " 보다 뒤면 차기, "
                        + "같거나 지났으면 당일입니다. 자금 집행은 매주 월·목이고 그 날이 휴일이면 다음 영업일로 밉니다.");
      say("", "");
      say("칸 이름", "B 일자 · C 구분 · D 계좌 · E 거래처 · F 적요 · I 금액(원화) · J 금액(외화)");
      say("", "K 예금주 · L 은행 · M 계좌번호 · N 증빙구분   ← 자금일보 제목줄에는 이 넷의 이름이 없습니다");
      say("", "O 세율 · P 지급액 · Q 소득세 · R 지방소득세 · S 예술인고용보험 · T 검산");
      say("", "");
      say("금액(원화) I", "실지급액입니다 — 세금을 뗀 뒤, 실제로 통장에서 나가는 돈.");
      say("지급액 P", "세금을 떼기 전 금액입니다. 계약서·세금계산서에 적힌 금액.");
      say("세금", "사업소득세 3% · 지방소득세는 소득세의 10% · 예술인고용보험은 지급액의 0.6%"
                + "(경비 25%를 뺀 뒤 0.8%). 셋 다 10원 미만은 버립니다.");
      say("검산 T", "P - Q - R - S = I 인지 봅니다. TRUE 면 맞는 것이고, FALSE 면 그 줄을 다시 보셔야 합니다.");
      say("계좌 D", "어느 계좌에서 나가는지입니다 — 화면에서 고른 값(" + (acct || "—") + ")을 모든 줄에 넣었습니다.");
      say("", "");
      say("붙여 넣을 때", "자금일보의 「4. 출 금 예 정」 제목줄 바로 아래에 B열부터 붙여 넣으면 칸이 맞습니다. "
                        + "다만 수식(Q·R·S·T)은 이 파일의 세율칸을 가리키므로, 붙여 넣은 뒤에는 "
                        + "「값으로 붙여넣기」를 쓰시거나 그쪽 세율칸에 맞게 다시 걸어 주세요.");

      /* ── 셋째 장 : 확인 필요 ───────────────────────────────────
           거래처와 적요는 같은데 **금액이 다른** 것을 한곳에 모읍니다.

                                + "전표가 엉뚱한 계정으로 끊기므로 먼저 고쳐 주세요. "

           재무리드 2026-09-09 : 「매달 10일 지급되는 원천세, 원천지방세,

        TH.forEach(function (v, i) {

        });
        tx.getRow(1).height = 17.25;
        tax10.list.forEach(function (t, i) {

/** 계정과목 한 칸을 쪼갭니다 — 「[8670000]콘텐츠제작비_지급수수료」 */

     「상품매출_음반」 · 「미지급세금_대만」 처럼 「_」 가 이름의 일부인 것은 그대로 둡니다. */

/** 견주기용으로 납작하게 — 띄어쓰기·대소문자·괄호를 지웁니다 */
function projFlat(s) {
  /* ★ 「_」 도 지웁니다 — 같은 프로젝트를 「QWER)시연」 · 「QWER_시연」 두 가지로 적고 계십니다.
        다만 「밀크필름_고말숙」 은 지워도 「밀크필름」 과 다르니 멤버 구분은 살아 있습니다. */
  return String(s || "").replace(/\s+/g, "").replace(/[()（）\]\[_\-.·]/g, "").toLowerCase();

/** ★ 적요에서 프로젝트 이름을 꺼냅니다 — **잣대에 있는 가장 긴 것**을 씁니다.

    실제 자료가 이렇게 어긋납니다 —
      ⓐ 이름에 「)」 가 들어감   「QWER)쵸단) 직접용역료_…」   → QWER)쵸단  (잣대에 있음)
      ⓑ 이름에 괄호            「넬(NELL)) 대만 촬영 제작비」  → 넬(NELL)
      ⓒ 앞에 접두어            「[결산조정] QWER) 아티스트 …」 → QWER
      ⓓ 이름에 빈칸            「QWER 관리 비용) 직접용역료_…」→ QWER 관리 비용
    그래서 「)」 자리를 **모두** 찾아 앞부분을 후보로 두고, 잣대와 맞는 **가장 긴** 것을 고릅니다.
    잣대에 아무것도 없으면 첫 「)」 앞을 그대로 씁니다. */
function projPick(t0, bk) {
  let t = String(t0 || "").trim();

  const pre = t.match(/^(\[[^\]]{1,24}\]\s*)/);

  /* 「)」 자리를 모두 찾습니다. ★ 「_」 에서 멈추지 않습니다 —
        프로젝트명 자신에 「_」 가 든 것이 있습니다 (유튜브_셀럽 · 밀크필름_고말숙 · 진용진_글로벌채널). */
  const raws = [];

  }
  if (!raws.length) return { has: false, code: "", hit: "", rest: t, pre: !!pre };
  /* ★ 후보 — 앞부분 그대로 + 「/」 「]」 뒤의 꼬리.
        「[결산] 12월유튜브매출(추정)->1월 (환원) /진용진) …」 처럼 앞에 딴 글이 붙고

     (프로젝트 이름은 짧습니다. 잣대에서 가장 긴 것이 「[TWC] 더와일드카드 클럽」 16자입니다) */
  let fb = cands[0];

  at = at < 0 ? 0 : at + pick.length;

/** 적요에서 **계정명이 될 만한 조각**을 모두 뽑습니다.
    「콘텐츠선급금_지급수수료_송금수수료」 처럼 두 겹으로 적는 일이 있어 한 조각만 보면 안 됩니다. */

}

/* 프로젝트 표를 견주기 쉬운 꼴로 (파일의 프로젝트명 칸 · 또는 f_projects) */
function projBook(rows) {
  const byCode = {}, byFlat = {}, byName = {}, codes = [];
  (rows || []).forEach(function (r) {
    const code = String((r && (r.code || r.project_code || r.name)) || "").trim();
    const name = String((r && r.name) || "").trim();
    if (!code) return;
    if (!byCode[code]) { byCode[code] = { code: code, name: name, n: (r && r.n) || 0 }; codes.push(code); }
    if (!byFlat[projFlat(code)]) byFlat[projFlat(code)] = code;
    if (name && name !== code && !byName[projFlat(name)]) byName[projFlat(name)] = code;
  });
  codes.sort(function (a, b) { return (byCode[b].n || 0) - (byCode[a].n || 0); });

}

/* ── 분개장 읽기 ────────────────────────────────────────

    if (!(row || []).some(function (v) { return String(v == null ? "" : v).trim() !== ""; })) continue;
    out.all += 1;
    const dr = m.dr === undefined ? 0 : xnum(cell(row, m.dr));
    const cr = m.cr === undefined ? 0 : xnum(cell(row, m.cr));
    const one = m.amt === undefined ? 0 : xnum(cell(row, m.amt));
    /* 파일이 스스로 적어 온 합계 줄 */
    let isSum = false;
    ["dt", "acct", "drAcct", "crAcct", "party", "no"].forEach(function (k) {
      if (m[k] === undefined) return;
      if (JE_SUM.test(String(cell(row, m[k])).trim())) isSum = true;
    });
    if (isSum) { out.sumRow = { dr: dr, cr: cr, one: one }; out.all -= 1; continue; }
    if (!dr && !cr && !one) { out.zero += 1; continue; }
    out.used += 1;
    out.dr += dr; out.cr += cr;
    const side = dr ? "차변" : "대변";
    const raw = dr ? (m.drAcct !== undefined ? g(row, "drAcct") : g(row, "acct"))
                   : (m.crAcct !== undefined ? g(row, "crAcct") : g(row, "acct"));
    const A = jeAcct(raw);
    const k2 = A.cls || "(없음)";
    if (!out.cls[k2]) out.cls[k2] = { dr: 0, cr: 0, n: 0 };
    out.cls[k2].n += 1; out.cls[k2].dr += dr; out.cls[k2].cr += cr;
    if (m.amt !== undefined && !dr && !cr) {        /* 금액이 한 칸인 파일 */
      const s2 = g(row, "side");
      if (/대/.test(s2)) { out.cr += one; out.cls[k2].cr += one; }
      else { out.dr += one; out.cls[k2].dr += one; }
    }
    const mo = String(m.dt === undefined ? "" : (xdate(cell(row, m.dt)) || "")).slice(0, 7);
    if (/^\d{4}-\d{2}$/.test(mo)) {
      if (!out.months[mo]) out.months[mo] = { dr: 0, cr: 0, n: 0 };
      out.months[mo].n += 1; out.months[mo].dr += dr; out.months[mo].cr += cr;
    }
  }
  out.gap = out.dr - out.cr;
  out.sumOk = out.sumRow ? (Math.round(out.dr) === Math.round(out.sumRow.dr)
                         && Math.round(out.cr) === Math.round(out.sumRow.cr)) : null;
  return out;
}

/* ── 슬랙 발행요청과 짝짓기 ─────────────────────────────
      #관리-재무 의 세금계산서 발행요청에는 **프로젝트명 · 회사명 · 발행 금액 · 발행 일자**가 있고,
      스레드 댓글에는 재무리드가 정한 **회계처리**가 적혀 있습니다. 매출 적요로는 계정을 볼 수 없으니
      이것이 매출 검증의 잣대가 됩니다.   (재무리드 2026-09-09) */
/** 거래처 이름 견주기 — 「주식회사 스튜디오좋」 ↔ 「스튜디오좋」 을 같게 봅니다 */
function coFlat(s) {
  return String(s || "")
    .replace(/주식회사|\(주\)|\(유\)|㈜|유한회사|사단법인|재단법인|Inc\.?|Ltd\.?|Co\.?/gi, "")
    .replace(/[\s()（）.,·\-_]/g, "").toLowerCase();
}
/** 댓글에서 「회계처리 : … 기타매출 13,636,364 …」 의 **매출계정**을 뽑습니다 */
function slkSaleAcct(text, voc) {
  const t = String(text || "");
  if (!t) return "";
  const keys = Object.keys(voc || {}).filter(function (a) { return /매출|수익/.test(a); });
  /* 「회계처리」 가 적힌 줄을 먼저 봅니다 — 없으면 글 전체에서 봅니다 */
  const lines = t.split(/\r?\n/);
  const pick = lines.filter(function (l) { return /회계\s*처리|계정\s*처리|처리\s*:/.test(l); });
  const scan = (pick.length ? pick.join(" ") : t);
  let best = "";
  keys.forEach(function (a) {
    if (scan.indexOf(a) >= 0 && a.length > best.length) best = a;
  });
  return best;
}
/** 매출 전표 한 줄에 맞는 발행요청을 찾습니다 (금액이 같은 것만 · 거래처나 날짜로 확인) */
function slkMatch(row, book) {
  const amt = Math.round(Math.abs(n0(row.amt)));
  if (!amt) return null;
  const cand = book[amt];
  if (!cand || !cand.length) return null;
  if (cand.length === 1) return cand[0];
  const co = coFlat(row.party);
  const same = cand.filter(function (x) { return co && x.co && (x.co === co || x.co.indexOf(co) >= 0 || co.indexOf(x.co) >= 0); });
  if (same.length === 1) return same[0];
  const pool = same.length ? same : cand;
  const d = String(row.dt || "").slice(0, 10);
  let best = null, gap = 99;
  pool.forEach(function (x) {
    if (!x.dt || !d) return;
    const g2 = Math.abs((new Date(x.dt) - new Date(d)) / 86400000);
    if (g2 < gap) { gap = g2; best = x; }
  });
  return (best && gap <= 40) ? best : pool[0];
}

/** 한 줄을 봅니다 — 갈래마다 {k, fix, got}. 맞으면 빈 목록입니다.
      bk 프로젝트 잣대 · voc 우리가 쓰는 계정 · mode "sale"|"cost" · sBook 거래처별 매출계정 */
function projCheck(row, bk, voc, mode, sBook, sk) {
  const out = [];
  const p = projPick(row.memo, bk);
  function add(k, fix, got) {
    const K = PROJ_KIND[k];
    if (K && K.only && K.only !== mode) return;
    out.push({ k: k, fix: fix || "", got: got === undefined ? p.code : got });
  }
  /* 1) 프로젝트 이름 — 목록에 있는가
        ★ 이름 자체에 흠이 있으면 「이렇게 고치세요」 에 **전표의 프로젝트 칸 이름**을 먼저 씁니다.
          칸에 이미 옳은 이름이 들어 있는 일이 많아, 그것만 적요에 옮겨 적으면 끝납니다. */
  const col = String(row.proj || "").trim();
  let nameBad = false;
  if (!p.has) { add("pjNone", col, ""); nameBad = true; }
  else if (!p.code) { add("pjEmpty", col, ""); nameBad = true; }
  else if (bk.byCode[p.code]) { /* 목록에 있습니다 */ }
  else if (bk.byFlat[projFlat(p.code)]) { add("pjSpell", bk.byFlat[projFlat(p.code)]); nameBad = true; }
  else {
    const near = nearAcct(p.code, bk.codes);
    if (near) add("pjTypo", col || near.acct); else add("pjUnknown", col);
    nameBad = true;
  }
  /* 2) 적요 대 프로젝트 칸.
        ★ 이름 자체가 이미 흠으로 잡힌 줄은 **겹쳐 달지 않습니다** — 고치는 방법이 같기 때문입니다
          (①에서 이미 칸 이름을 찍어 드렸습니다). 여기 남는 것은
          **적요의 이름도 목록에 제대로 있는데 칸과 어긋나는** 줄 — 사람이 판단해야 하는 것뿐입니다.
          어긋난 줄 전체 건수는 화면 ③ 의 「적요의 이름 ↔ 프로젝트 칸」 요약에서 따로 세어 보여 줍니다. */
  if (!nameBad && col && p.code) {
    const a = projFlat(p.code), b = projFlat(col);
    if (a && b && a !== b) {
      const part = a.indexOf(b) >= 0 || b.indexOf(a) >= 0;
      add(part ? "mmPart" : "mmDiff", col, p.code);
    }
  }
  /* 3) 계정이 제대로 들어갔나 */
  if (mode === "cost" && row.acode !== PREPAID) {
    if (p.has && p.rest && p.rest.indexOf("_") >= 0) {
      const cs = memoAcctList(p);
      const hitSelf = cs.some(function (c) {
        if (c === row.acct) return true;
        return c.length >= 3 && (row.acct.indexOf(c) === 0 || c.indexOf(row.acct) === 0);
      });
      if (!hitSelf) {
        const known = cs.filter(function (c) { return voc && voc[c]; });
        if (known.length) add("acctDiff", known[0], row.acct);
        else add("acctUnk", "", cs[0] || "");
      }
    }
  }
  /* 3-2) 슬랙 발행요청과 견주기 — 매출에서만 */
  if (mode === "sale" && sk && sk.book) {
    const q = slkMatch(row, sk.book);
    if (q) {
      if (q.acct && row.acct && q.acct !== row.acct) add("slkAcct", q.acct, row.acct);
      const qp = String(q.project || "").trim();
      /* 적요에 이름이 아예 없는 줄 — 칸도 비었으면 **발행요청의 프로젝트**를 답으로 찍어 줍니다 */
      if (qp) out.forEach(function (o) {
        if ((o.k === "pjNone" || o.k === "pjEmpty") && !o.fix) o.fix = qp;
      });
      if (qp && p.code && projFlat(qp) !== projFlat(p.code)
          && !(projFlat(qp).indexOf(projFlat(p.code)) >= 0 || projFlat(p.code).indexOf(projFlat(qp)) >= 0)) {
        add("slkProj", qp, p.code);
      } else if (qp && !p.code) add("slkProj", qp, "");
    }
  }
  if (mode === "sale" && sBook) {
    const b = sBook[row.party || "(거래처없음)"];
    if (b && b.top && b.top !== row.acct && (b.acc[b.top] || 0) >= (b.acc[row.acct] || 0) * 3) {
      add("saleOdd", b.top, row.acct);
    }
  }
  /* 4) 「_」 없음 */
  if (p.has && p.code && p.rest.indexOf("_") < 0 && String(row.memo || "").trim()) add("under", "");
  return out;
}

/* 확인 표시·계정 선택을 이 브라우저에 남깁니다 (DB 에 올리지 않습니다) */

function lsPut(k, o) { try { localStorage.setItem(k, JSON.stringify(o)); return true; } catch (e) { return false; } }
