        h("i", null, t.ic), h("span", null, t.nm));
    }));
}


/* ── 확인 · 처리 ────────────────────────────────────────────
   경고를 보여주기만 하면 본 사람과 안 본 사람의 화면이 같습니다.
   그래서 매달 같은 것을 다시 읽고 다시 판단하게 됩니다.
   여기 하나만 두고 화면에는 한 줄만 넣습니다.                */
const ACK_STATES = [
  { s: "확인함", d: "봤고 문제 없습니다" },
  { s: "처리함", d: "조치까지 끝냈습니다 (전표를 쳤다 · 계약을 갱신했다)" },
  { s: "해당없음", d: "이 건은 우리 것이 아닙니다" },
  { s: "보류", d: "판단이 남았습니다 — 이유를 적어야 합니다" },
];
const ACK_TONE = { 확인함: "ok", 처리함: "ok", 해당없음: "na", 보류: "warn" };

function Ack(props) {
  const key = String(props.akey);
  const st = useStatus();
  const [open, setOpen] = useState(false);
  const [pick, setPick] = useState("확인함");
  const [note, setNote] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const row = props.row || null;   /* 부모가 f_ack_many 로 한 번에 받아 넘깁니다 */

  async function save() {
    if (!sb) { setErr("DB 에 연결되어 있지 않습니다."); return; }
    if (pick === "보류" && !note.trim()) {
      setErr("보류에는 이유를 적어야 합니다 — 이유 없는 보류는 다음 달에 그대로 다시 올라옵니다.");
      return;
    }
    setBusy(true); setErr(""); st.setSaving("확인 기록 중…");
    const r = await rpc("ack_set", {
      p_kind: props.kind, p_key: key, p_state: pick,
      p_tag: null, p_note: note.trim() || null, p_period: props.period || null,
    });
    setBusy(false);
    if (r.error) { setErr(r.error.message); st.setError(r.error.message); return; }
    st.setSaved("확인으로 남겼습니다");
    setOpen(false);
    if (props.after) props.after();
  }

  return h(React.Fragment, null,
    h("button", {
      className: "btn sm" + (row ? "" : ""),
      style: row ? { color: "var(--ok)", borderColor: "var(--ok)" } : null,
      title: row ? row.state + " — " + row.who + (row.note ? " · " + row.note : "") : "확인했다고 남깁니다",
      onClick: function (e) {
        e.stopPropagation();
        setPick((row && row.state) || "확인함"); setNote(""); setErr(""); setOpen(true);
      },
    }, row ? "✓ " + row.state : (props.label || "확인")),

    h(Modal, {
      open: open, width: 520, title: (props.title || "확인 · 처리"),
      onClose: function () { setOpen(false); },
      footer: h(React.Fragment, null,
        h("button", { className: "btn", onClick: function () { setOpen(false); } }, "취소"),
        h("div", { className: "sp" }),
        h("button", { className: "btn primary", disabled: busy, onClick: save },
          busy ? "저장 중…" : "저장")),
    },
      h("div", { className: "field" },
        h("label", null, "무엇으로 남길까요"),
        ACK_STATES.map(function (a) {
          return h("button", {
            key: a.s, type: "button",
            className: "when-b" + (pick === a.s ? " on" : ""),
            style: { width: "100%", marginBottom: 6 },
            onClick: function () { setPick(a.s); },
          }, h("b", null, a.s), h("span", null, a.d));
        })),
      h("div", { className: "field" },
        h("label", null, "메모", pick === "보류" ? h("b", { style: { color: "var(--bad)" } }, " *") : null),
        h("textarea", { rows: 3, value: note, placeholder: "무엇을 확인했는지 한 줄이면 충분합니다",
          onChange: function (e) { setNote(e.target.value); st.setEditing(); } })),
      err ? h("div", { className: "warnbox" }, err) : null,
      row ? h("p", { className: "muted", style: { fontSize: 10.5 } },
        "지금 : ", h("b", null, row.state), " · ", row.who, row.at ? " · " + dayStr(row.at) : "") : null));
}

/** 확인·처리 기록을 종류별로 한 번에 받아옵니다 (6건이면 6번 부르지 않습니다) */
function useAckMap(kind, period, dep) {
  const [map, setMap] = useState({});
  const load = useCallback(async function () {
    if (!sb) return;
    const r = await rpc("f_ack_many", { p_kind: kind, p_period: period || null });
    const m = {};
    safe(r).forEach(function (x) { m[x.key] = x; });
    setMap(m);
  }, [kind, period]);
  useEffect(function () { load(); }, [load, dep]);
  return [map, load];
}

/* ══════════════════════════════════════════════════════════════
   ⑤-2 화면 설명 고치기
        탭 설명 · 화면 머리 안내문은 「시스템이 미리 써 둔 글」입니다.
        일하다 보면 우리 회사 사정에 맞게 고쳐야 할 때가 옵니다.
        그래서 **화면에서 바로 고칠 수 있게** 했습니다.

        · DB 에 patch_172_ui_text.sql 을 돌려 두면 → 모두가 같은 글을 봅니다
          (이미 있는 patch_88 의 ui_text 표를 그대로 같이 씁니다 — 덮어쓰지 않습니다)
        · 아직 안 돌렸으면      → 이 브라우저에만 저장됩니다 (나만 보입니다)
        어느 쪽이든 화면은 그대로 돕니다.
   ══════════════════════════════════════════════════════════════ */
/** 화면 맨 위(body)로 내보냅니다 — 유리 카드 안에 갇히지 않게 */
function portal(node) {
  return (ReactDOM && ReactDOM.createPortal && document.body)
    ? ReactDOM.createPortal(node, document.body) : node;
}

const UiCtx = createContext(null);
/* 지금 화면에 떠 있는 「고칠 수 있는 글」 목록 —
   Txt 가 그려질 때 스스로 여기에 이름을 올립니다.
   그래서 화면마다 편집 목록을 따로 적어 둘 필요가 없습니다. */
const TXT_REG = {};
function useUi() {
  const c = useContext(UiCtx);
  return c || { get: function (k, d) { return d; }, set: function () {}, map: {},
                shared: false, ready: true, edit: false, setEdit: function () {}, ask: function () {} };
}
function UiTextProvider(props) {
  const [map, setMap] = useState({});
  const [shared, setShared] = useState(false);   /* DB 에 저장되고 있는가 */
  const [ready, setReady] = useState(false);

  useEffect(function () {
    let live = true;
    function local() {
      try { return JSON.parse(localStorage.getItem("uitext") || "{}"); } catch (e) { return {}; }
    }
    if (!sb) { setMap(local()); setReady(true); return; }
    rpc("f_ui_kv", {}).then(function (r) {
      if (!live) return;
      if (r.error) { setMap(local()); setShared(false); }
      else {
        const m = {};
        safe(r).forEach(function (x) { m[x.k] = x.v; });
        setMap(Object.assign(local(), m));       /* DB 값이 이깁니다 */
        setShared(true);
      }
      setReady(true);
    });
    return function () { live = false; };
  }, []);

  const get = useCallback(function (k, d) {
    const v = map[k];
    return v === undefined || v === null || v === "" ? d : v;
  }, [map]);

  const set = useCallback(async function (k, v) {
    setMap(function (o) { const n = Object.assign({}, o); if (v === null) delete n[k]; else n[k] = v; return n; });
    /* 언제나 이 브라우저에도 남깁니다 — DB 가 없어도 다음에 그대로 보입니다 */
    try {
      const l = JSON.parse(localStorage.getItem("uitext") || "{}");
      if (v === null) delete l[k]; else l[k] = v;
      localStorage.setItem("uitext", JSON.stringify(l));
    } catch (e) {}
    if (!sb) return { ok: true, shared: false };
    const r = await rpc("ui_kv_set", { p_k: k, p_v: v });
    if (r.error) return { ok: true, shared: false, why: r.error.message };
    return { ok: true, shared: true };
  }, []);

  const [edit, setEdit] = useState(false);      /* 편집 모드가 켜져 있는가 */
  const [ask, setAsk] = useState(null);         /* 지금 고치고 있는 글 */

  return h(UiCtx.Provider, {
    value: { get: get, set: set, shared: shared, ready: ready, map: map,
             edit: edit, setEdit: setEdit, ask: function (k, cur) { setAsk({ k: k, cur: cur }); } },
  },
    props.children,
    ask ? h(TxtOne, { k: ask.k, cur: ask.cur, onClose: function () { setAsk(null); } }) : null);
}

/** 글 한 칸만 고치는 창 — 편집 모드에서 글을 누르면 뜹니다 */
function TxtOne(props) {
  const ui = useUi();
  const st = useStatus();
  const base = String(props.cur || "");
  const [v, setV] = useState(function () { return ui.get(props.k, base); });
  const [busy, setBusy] = useState(false);
  const changed = ui.map[props.k] !== undefined;

  async function save(val) {
    setBusy(true); st.setSaving("글을 저장하는 중…");
    const r = await ui.set(props.k, val);
    setBusy(false);
    st.setSaved(r.shared ? "저장했습니다 — 모두에게 보입니다" : "이 브라우저에 저장했습니다");
    props.onClose();
  }
  return h(Modal, { open: true, title: "이 글 고치기", width: 620, onClose: props.onClose,
    footer: h(React.Fragment, null,
      h("button", { className: "btn", onClick: props.onClose, disabled: busy }, "취소"),
      changed ? h("button", { className: "btn", disabled: busy,
        onClick: function () { save(null); } }, "기본값으로 되돌리기") : null,
      h("div", { className: "sp" }),
      h("button", { className: "btn primary", disabled: busy, onClick: function () { save(v); } },
        busy ? h(React.Fragment, null, h("i", { className: "spin" }), " 저장중…") : "저장")) },
    h("p", { className: "lead" },
      h("b", null, "**굵게**"), " 처럼 별표 두 개로 감싸면 굵은 글씨가 됩니다. ",
      ui.shared ? "저장하면 팀 모두가 이 글을 봅니다."
                : "지금은 이 브라우저에만 저장됩니다 — patch_172_ui_text.sql 을 돌리면 팀 모두에게 보입니다."),
    h("div", { className: "muted", style: { fontSize: 10, fontWeight: 900, margin: "10px 0 4px" } },
      "자리 이름 · " + props.k),
    h("textarea", { rows: 7, value: v, autoFocus: true,
      onChange: function (e) { setV(e.target.value); } }));
}

/** 고칠 수 있는 글 한 덩이.
    · 평소  : 원래 글(또는 고쳐 둔 글)을 그대로 보여 줍니다
    · 편집 모드 : 점선이 생기고, 누르면 그 자리에서 고칩니다 */
function Txt(props) {
  const ui = useUi();
  const ref = useRef(null);
  const over = ui.map[props.k];
  const has = over !== undefined && over !== null && over !== "";
  const body = has ? md(over)
             : (props.children !== undefined && props.children !== null ? props.children : md(props.d || ""));

  useEffect(function () { TXT_REG[props.k] = ref; });

  if (!ui.edit) return h("span", { ref: ref, className: "txt" }, body);
  return h("span", {
    ref: ref,
    className: "txt on" + (has ? " ed" : ""),
    role: "button", tabIndex: 0, title: "눌러서 이 글을 고칩니다 (" + props.k + ")",
    onClick: function (e) {
      e.preventDefault(); e.stopPropagation();
      ui.ask(props.k, ref.current ? ref.current.innerText : (props.d || ""));
    },
    onKeyDown: function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.currentTarget.click(); } },
  }, body, h("i", { className: "txt-p" }, "✎"));
}

/** 지금 화면의 설명들을 모아 고치는 창 */
function TxtEdit(props) {
  const ui = useUi();
  const st = useStatus();
  const items = props.items || [];              /* [{k, label, d, hint}] */
  const [val, setVal] = useState(function () {
    const o = {};
    items.forEach(function (i) { o[i.k] = ui.get(i.k, i.d); });
    return o;
  });
  const [busy, setBusy] = useState(false);
  const [note, setNote] = useState(null);

  async function save() {
    setBusy(true); st.setSaving("설명을 저장하는 중…");
    let sharedAll = true;
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      const v = String(val[it.k] || "").trim();
      const r = await ui.set(it.k, v === "" || v === it.d ? null : v);
      if (!r.shared) sharedAll = false;
    }
    setBusy(false);
    st.setSaved(sharedAll ? "저장했습니다 — 모두에게 보입니다" : "이 브라우저에 저장했습니다");
    setNote(sharedAll ? null
      : "DB 에 patch_172_ui_text.sql 을 아직 안 돌려서, 고친 글이 이 브라우저에만 남습니다. SQL 을 한 번 돌리면 팀 모두가 같은 글을 봅니다.");
    if (sharedAll) props.onClose();
  }
  function reset(k, d) { setVal(function (o) { return Object.assign({}, o, (function () { const x = {}; x[k] = d; return x; })()); }); }

  return h(Modal, { open: true, title: "이 화면의 설명 고치기", width: 640, onClose: props.onClose,
    footer: h(React.Fragment, null,
      h("button", { className: "btn", onClick: props.onClose, disabled: busy }, "취소"),
      h("button", { className: "btn primary", onClick: save, disabled: busy },
        busy ? h(React.Fragment, null, h("i", { className: "spin" }), " 저장중…") : "저장")) },
    h("p", { className: "lead" },
      "시스템이 미리 써 둔 안내 글입니다. ", h("b", null, "우리 회사 사정에 맞게 고치세요"), ". ",
      h("b", null, "**굵게**"), " 처럼 별표 두 개로 감싸면 굵은 글씨가 됩니다."),
    !ui.shared ? h("div", { className: "warnbox", style: { marginTop: 9 } },
      h("b", null, "지금은 이 브라우저에만 저장됩니다."),
      " 팀 모두가 같은 글을 보게 하려면 ", h("code", { className: "code" }, "patch_172_ui_text.sql"), " 을 한 번 돌리세요.") : null,
    items.map(function (i) {
      const changed = ui.get(i.k, i.d) !== i.d;
      return h("div", { key: i.k, className: "field", style: { marginTop: 13 } },
        h("label", null, i.label,
          changed ? h("span", { className: "st warn" }, "고친 글") : h("span", { className: "st" }, "기본값"),
          h("button", { className: "btn sm", style: { marginLeft: "auto" }, type: "button",
            onClick: function () { reset(i.k, i.d); } }, "기본값으로")),
        i.hint ? h("div", { className: "muted", style: { fontSize: 10.5, marginBottom: 5 } }, i.hint) : null,
        h("textarea", { rows: i.rows || 3, value: val[i.k] || "",
          onChange: function (e) { setVal(Object.assign({}, val, (function () { const x = {}; x[i.k] = e.target.value; return x; })())); } }));
    }),
    note ? h("div", { className: "warnbox info", style: { marginTop: 11 } }, note) : null);
}

/* ══════════════════════════════════════════════════════════════
   ⑤-3 사진 붙이기 · 사진에서 글자 뽑기 (OCR)
        스크린샷을 그대로 붙여 두는 것이,
        「무엇이 미확정인지」를 남기는 가장 빠른 방법입니다.

        · 파일 고르기 · **화면 캡처 붙여넣기(Ctrl+V)** 둘 다 됩니다
        · 글자 뽑기는 **이 브라우저 안에서** 합니다 (Tesseract.js)
          — 사진이 어디로도 나가지 않고, 열쇠도 비용도 없습니다
        · 처음 한 번만 한국어 글자 자료(약 15MB)를 내려받습니다
   ══════════════════════════════════════════════════════════════ */
const OCR_SRC = [
  "https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js",
  "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js",
];
let OCR_P = null;
function loadOCR() {
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  if (OCR_P) return OCR_P;
  OCR_P = new Promise(function (res, rej) {
    let i = 0;
    function next() {
      if (i >= OCR_SRC.length) { OCR_P = null; rej(new Error("글자 뽑는 도구를 내려받지 못했습니다. 인터넷 연결을 확인해 주세요.")); return; }
      const s = document.createElement("script");
      s.src = OCR_SRC[i++];
      s.onload = function () { window.Tesseract ? res(window.Tesseract) : next(); };
      s.onerror = next;
      document.head.appendChild(s);
    }
    next();
  });
  return OCR_P;
}
let OCR_W = null;
async function ocrRead(file, onStep) {
  const T = await loadOCR();
  if (!OCR_W) {
    onStep && onStep("한국어 글자 자료를 준비하는 중… (처음 한 번만 오래 걸립니다)");
    OCR_W = await T.createWorker("kor+eng", 1, {
      logger: function (m) {
        if (m && m.status === "recognizing text" && onStep) onStep("읽는 중… " + Math.round((m.progress || 0) * 100) + "%");
      },
    });
  }
  onStep && onStep("읽는 중…");
  const r = await OCR_W.recognize(file);
  return ((r && r.data && r.data.text) || "").replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();
}

/** 뽑은 글에서 금액 · 날짜 · 거래처 · 프로젝트를 찾아 봅니다 (사람이 고칠 수 있습니다) */
function pickFields(text) {
  const t = String(text || "");
  const out = { amount: null, date: null, party: null, project: null, why: [] };

  /* 금액 — 「3,300,000원」처럼 콤마와 원이 붙은 것을 가장 믿습니다 */
  const amts = [];
  const re1 = /([0-9][0-9,]{2,})\s*원/g;
  let mm;
  while ((mm = re1.exec(t))) { const v = Number(mm[1].replace(/,/g, "")); if (v >= 1000) amts.push(v); }
  if (!amts.length) {
    const re2 = /\b([0-9]{1,3}(?:,[0-9]{3})+)\b/g;
    while ((mm = re2.exec(t))) { const v = Number(mm[1].replace(/,/g, "")); if (v >= 1000) amts.push(v); }
  }
  if (amts.length) { out.amount = Math.max.apply(null, amts); out.why.push("금액"); }

  /* 날짜 — 2026-08-21 · 2026.8.21 · 2026년 8월 21일 */
  const d1 = t.match(/(20\d{2})[-./년]\s*(\d{1,2})[-./월]\s*(\d{1,2})/);
  if (d1) {
    out.date = d1[1] + "-" + String(d1[2]).padStart(2, "0") + "-" + String(d1[3]).padStart(2, "0");
    out.why.push("날짜");
  }

  /* 거래처 — 「거래처 : 」 「회사명 : 」 「업체 : 」 뒤 */
  const p1 = t.match(/(?:거래처|회사명|업체|지급처|상호|공급자)\s*[:：]?\s*([^\n]{2,30})/);
  if (p1) { out.party = p1[1].trim().replace(/[|·,]+$/, ""); out.why.push("거래처"); }

  /* 프로젝트 — 「프로젝트 : 」 뒤, 또는 「QWER_히나) 」처럼 앞에 붙는 꼬리표 */
  const j1 = t.match(/프로젝트\s*(?:명|코드)?\s*[:：]?\s*([^\n]{2,30})/);
  if (j1) { out.project = j1[1].trim(); out.why.push("프로젝트"); }
  else {
    const j2 = t.match(/^\s*([가-힣A-Za-z0-9_\- ]{2,20})\)\s/m);
    if (j2) { out.project = j2[1].trim(); out.why.push("프로젝트(적요 앞머리)"); }
  }
  return out;
}

/** 사진 붙이는 칸 — 고르기 · 붙여넣기 · 글자 뽑기 */
function PicBox(props) {
  /* props: pics [{key,file,url,ocr,busy}] · setPics · onText(글) · onFields(뽑은 항목) */
  const pics = props.pics || [];
  const [step, setStep] = useState("");
  const [err, setErr] = useState(null);
  const [zoom, setZoom] = useState(null);
  const boxRef = useRef(null);

  function addFiles(files) {
    const ok = [];
    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      if (!f || !/^image\//.test(f.type || "")) continue;
      if (f.size > 12 * 1024 * 1024) { setErr((f.name || "사진") + " 은 12MB 가 넘어 못 붙입니다."); continue; }
      ok.push({ key: "p" + Date.now() + "_" + i, file: f, url: URL.createObjectURL(f), ocr: "", busy: false });
    }
    if (ok.length) { setErr(null); props.setPics(pics.concat(ok)); }
  }

  /* 화면 캡처를 그냥 Ctrl+V 로 붙일 수 있게 합니다 */
  useEffect(function () {
    function onPaste(e) {
      const items = (e.clipboardData && e.clipboardData.items) || [];
      const fs = [];
      for (let i = 0; i < items.length; i++) {
        if (items[i].kind === "file") { const f = items[i].getAsFile(); if (f) fs.push(f); }
      }
      if (fs.length) { e.preventDefault(); addFiles(fs); }
    }
    document.addEventListener("paste", onPaste);
    return function () { document.removeEventListener("paste", onPaste); };
  });

  async function readOne(p) {
    setErr(null);
    props.setPics(pics.map(function (x) { return x.key === p.key ? Object.assign({}, x, { busy: true }) : x; }));
    try {
      const txt = await ocrRead(p.file || p.url, setStep);
      setStep("");
      props.setPics(pics.map(function (x) { return x.key === p.key ? Object.assign({}, x, { ocr: txt, busy: false }) : x; }));
      if (props.onText) props.onText(txt);
      if (props.onFields) props.onFields(pickFields(txt), txt);
    } catch (e) {
      setStep(""); setErr(e.message || String(e));
      props.setPics(pics.map(function (x) { return x.key === p.key ? Object.assign({}, x, { busy: false }) : x; }));
    }
  }
  async function readAll() {
    for (let i = 0; i < pics.length; i++) if (!pics[i].ocr) await readOne(pics[i]);
  }

  return h("div", { className: "picbox", ref: boxRef },
    h("div", { className: "hrow" },
      h("label", { className: "btn sm" },
        h("input", { type: "file", accept: "image/*", multiple: true, style: { display: "none" },
          onChange: function (e) { addFiles(e.target.files || []); e.target.value = ""; } }),
        "🖼 사진 고르기"),
      h("span", { className: "muted", style: { fontSize: 10.5, fontWeight: 800 } },
        "또는 화면을 캡처하고 ", h("b", null, "Ctrl+V"), " 로 그냥 붙여넣으세요"),
      pics.length ? h("button", { type: "button", className: "btn sm primary",
        disabled: !!step, onClick: readAll },
        step ? h(React.Fragment, null, h("i", { className: "spin" }), " " + step) : "🔤 사진에서 글자 뽑기") : null),
    err ? h("div", { className: "warnbox", style: { marginTop: 8 } }, err) : null,
    pics.length ? h("div", { className: "thumbs" }, pics.map(function (p) {
      return h("div", { key: p.key, className: "thumb" + (p.ocr ? " done" : "") },
        h("img", { src: p.url, alt: (p.file && p.file.name) || "사진",
          onClick: function () { setZoom(p.url); } }),
        p.busy ? h("span", { className: "tb" }, h("i", { className: "spin" })) : null,
        p.ocr ? h("span", { className: "tok" }, "글자 ✓") : null,
        h("button", { type: "button", title: "떼기",
          onClick: function () {
            props.setPics(pics.filter(function (x) { return x.key !== p.key; }));
          } }, "✕"));
    })) : null,
    pics.some(function (p) { return p.ocr; })
      ? h("details", { style: { marginTop: 8 } },
          h("summary", { className: "lnk", style: { fontSize: 11, cursor: "pointer" } }, "뽑은 글자 보기 · 고치기"),
          pics.filter(function (p) { return p.ocr; }).map(function (p) {
            return h("textarea", { key: p.key, rows: 5, value: p.ocr, style: { marginTop: 6 },
              onChange: function (e) {
                props.setPics(pics.map(function (x) { return x.key === p.key ? Object.assign({}, x, { ocr: e.target.value }) : x; }));
              } });
          }))
      : null,
    zoom ? portal(h("div", { className: "zoom", onClick: function () { setZoom(null); } },
      h("img", { src: zoom, alt: "크게 보기" }))) : null);
}

/* ── 결산 캘린더 본체 ──────────────────────────────────── */
function ScreenCalendar(props) {
  const st = useStatus();
  const auth = useAuth();
  const per = usePeriod();
  const [ym, setYm] = useState(thisYm);
  const [rows, setRows] = useState([]);
  const [stat, setStat] = useState([]);
  const [fix, setFix] = useState([]);
  const [how, setHow] = useState({});
  const [tod, setTod] = useState([]);
  const [pat, setPat] = useState([]);
  const [over, setOver] = useState([]);
  const [mine, setMine] = useState([]);
  const [mineAbsent, setMineAbsent] = useState(false);
  const [loading, setLoading] = useState(true);
  const [absent, setAbsent] = useState(false);
  const [busy, setBusy] = useState(false);
  const [oops, setOops] = useState(null);

  const [pickDay, setPickDay] = useState(today);
  const [pickArea, setPickArea] = useState("");
  const [hideDone, setHideDone] = useState(false);
  const [openLate, setOpenLate] = useState(false);
  const [openHow, setOpenHow] = useState({});
  const [openPat, setOpenPat] = useState(false);
  const [overOpen, setOverOpen] = useState(false);
  const [mineOpen, setMineOpen] = useState(false);
  const dayRef = useRef(null);

  /* ★ 결산일정(D+n) 과 날짜 쪽지 — 캘린더 칸 안에 보이게 하려고 함께 부릅니다 */
  const [flow, setFlow] = useState([]);
  const [flowAbsent, setFlowAbsent] = useState(false);
  const [notes, setNotes] = useState([]);
  const [noteAbsent, setNoteAbsent] = useState(false);
  const [note, setNote] = useState(null);        /* 쪽지 쓰기 · 고치기 창 */
  const [noteDel, setNoteDel] = useState(null);  /* 쪽지 지우기 물어보기 */

  const [add, setAdd] = useState(null);
  const [delAsk, setDelAsk] = useState(null);
  const [when, setWhen] = useState(null);
  const [whenCycle, setWhenCycle] = useState("월");
  const [whenDn, setWhenDn] = useState(1);
  const [whenDay, setWhenDay] = useState(10);
  const [whenOne, setWhenOne] = useState(today);
  const [tkOpen, setTkOpen] = useState({});   /* 달력 칸에서 「더보기」 로 펼쳐 둔 날 */

  const load = useCallback(async function () {
    if (!sb) { setLoading(false); return; }
    setLoading(true);
    const rs = await Promise.all([
      rpc("f_close_month", { p_ym: ym }),
      rpc("f_close_month_stat", { p_ym: ym }),
      rpc("f_cash_fixed", { p_entity: "3Y", p_ym: ym }),
      sb.from("close_task").select("id,menu,how,watch,hand,seen,seen_kind,files,grp,screen,who,when_why,on_event,event_why,ended,ended_why,infile,save,chk"),
      rpc("f_close_today", { p_d: today(), p_entity: "3Y" }),
      rpc("f_je_pattern", { p_q: null }),
      rpc("f_close_over", {}),
    ]);
    const hm = {};
    safe(rs[3]).forEach(function (x) { hm[x.id] = x; });
    setHow(hm);
    setTod(safe(rs[4])); setPat(safe(rs[5])); setOver(safe(rs[6]));
    if (rs[0].error) {
      setAbsent(/f_close_month/.test(rs[0].error.message));
      setOops({ msg: rs[0].error.message, hint: "import/patch_122_close_cal.sql 을 실행했는지 확인해 주세요." });
      setRows([]); setLoading(false); return;
    }
    setAbsent(false); setOops(null);
    setRows(safe(rs[0])); setStat(safe(rs[1])); setFix(safe(rs[2]));
    setLoading(false);
  }, [ym]);
  useEffect(function () { load(); }, [load]);

  /* 등록된 일정 — 접어 둔 것까지 부릅니다. 안 보여주면 되살릴 수가 없습니다 */
  const loadMine = useCallback(async function () {
    const r = await rpc("f_close_task_list", { p_q: null, p_mine_only: false });
    if (r.error) { setMineAbsent(true); setMine([]); return; }
    setMineAbsent(false); setMine(safe(r));
  }, []);
  useEffect(function () { loadMine(); }, [loadMine]);

  /* ── 결산일정(D+n) ─────────────────────────────────────────
        지금 보고 있는 달에 하는 결산은 **지난달 결산**입니다.
        (8월 달력에 뜨는 D+1 · D+3 … 은 7월 결산 일정입니다) */
  const flowPeriod = useMemo(function () { return shiftYm(ym, -1); }, [ym]);
  useEffect(function () {
    let live = true;
    if (!sb) return;
    rpc("f_close_flow", { p_period: flowPeriod }).then(function (r) {
      if (!live) return;
      if (r.error) { setFlowAbsent(true); setFlow([]); return; }
      setFlowAbsent(false); setFlow(safe(r));
    });
    return function () { live = false; };
  }, [flowPeriod]);

  /* ── 날짜 쪽지 ─────────────────────────────────────────── */
  const loadNotes = useCallback(async function () {
    if (!sb) return;
    const p = ym.split("-").map(Number);
    const last = new Date(Date.UTC(p[0], p[1], 0)).getUTCDate();
    const r = await rpc("f_cal_notes", { p_from: ym + "-01", p_to: ym + "-" + String(last).padStart(2, "0"), p_entity: null });
    if (r.error) { setNoteAbsent(true); setNotes([]); return; }
    setNoteAbsent(false); setNotes(safe(r));
  }, [ym]);
  useEffect(function () { loadNotes(); }, [loadNotes]);

  /* 달을 옮기면 고른 날도 함께 옮깁니다 — 8월을 보면서 7월 날짜가 골라진 채로 남지 않게 */
  useEffect(function () { setPickDay(ym === thisYm() ? today() : ym + "-01"); }, [ym]);

  const toggleHow = useCallback(function (k) {
    setOpenHow(function (p) { const n = Object.assign({}, p); if (n[k]) delete n[k]; else n[k] = 1; return n; });
  }, []);

  const call = useCallback(async function (fn, args, msg) {
    setBusy(true); st.setSaving(msg);
    const r = await rpc(fn, args);
    setBusy(false);
    if (r.error) { setOops({ msg: r.error.message }); st.setError(r.error.message); return false; }
    st.setSaved("저장했습니다");
    await load();
    return true;
  }, [load, st]);

  const check = useCallback(function (r, done) {
    return call("close_month_done", { p_kind: r.kind, p_ref: r.ref_id, p_ym: ym, p_done: done },
      done ? r.title + " 확인하는 중…" : "되돌리는 중…");
  }, [call, ym]);

  const late = useMemo(function () { return tod.filter(function (t) { return t.bucket === "밀린 것"; }); }, [tod]);
  const total = useMemo(function () { return stat.filter(function (s) { return s.area === "합계"; })[0]; }, [stat]);
  const byArea = useMemo(function () {
    return stat.filter(function (s) { return s.area !== "합계"; })
      .sort(function (x, y) { return AREA_ORDER.indexOf(x.area) - AREA_ORDER.indexOf(y.area); });
  }, [stat]);
  const dated = useMemo(function () { return rows.filter(function (r) { return r.dt !== null; }); }, [rows]);
  const askList = useMemo(function () { return rows.filter(function (r) { return r.dt === null && r.ask; }); }, [rows]);
  const anytime = useMemo(function () { return rows.filter(function (r) { return r.dt === null && !r.ask; }); }, [rows]);

  const byDay = useMemo(function () {
    const m = {};
    dated.forEach(function (r) { (m[r.dt] = m[r.dt] || []).push(r); });
    return m;
  }, [dated]);

  const fixByDay = useMemo(function () {
    const m = {};
    fix.filter(function (x) { return x.active && !x.yearly && x.dt; }).forEach(function (f) {
      const v = m[f.dt] || { n: 0, amt: 0, todo: 0 };
      v.n += 1; v.amt += n0(f.amt === null || f.amt === undefined ? f.prev_amt : f.amt);
      if (f.state === "예정") v.todo += 1;
      m[f.dt] = v;
    });
    return m;
  }, [fix]);

  /* 날짜 → 결산일정 한 칸 */
  const flowByDay = useMemo(function () {
    const m = {};
    flow.forEach(function (f) { if (f.dt) (m[f.dt] = m[f.dt] || []).push(f); });
    return m;
  }, [flow]);
  /* 날짜 → 쪽지들 */
  const noteByDay = useMemo(function () {
    const m = {};
    notes.forEach(function (n) { if (n.d) (m[n.d] = m[n.d] || []).push(n); });
    return m;
  }, [notes]);

  const days = useMemo(function () {
    const p = ym.split("-").map(Number);
    const last = new Date(Date.UTC(p[0], p[1], 0)).getUTCDate();
    const pad = new Date(Date.UTC(p[0], p[1] - 1, 1)).getUTCDay();
    const list = [];
    for (let i = 1; i <= last; i++) list.push(ym + "-" + String(i).padStart(2, "0"));
    return { last: last, pad: pad, list: list };
  }, [ym]);

  const shownGroups = useMemo(function () {
    let v = pickDay ? (byDay[pickDay] || []) : dated;
    if (pickArea) v = v.filter(function (r) { return r.area === pickArea; });
    if (hideDone) v = v.filter(function (r) { return !r.done; });
    const m = {};
    v.forEach(function (r) { (m[r.dt] = m[r.dt] || []).push(r); });
    return Object.keys(m).sort().map(function (k) { return [k, m[k]]; });
  }, [pickDay, byDay, dated, pickArea, hideDone]);
  const shownN = shownGroups.reduce(function (a, g) { return a + g[1].length; }, 0);

  /* ── 날짜 쪽지 저장 ── */
  const saveNote = useCallback(async function () {
    if (!note) return;
    const body = String(note.body || "").trim();
    if (!body) { setOops({ msg: "내용이 비어 있습니다 — 한 줄이라도 적어 주세요." }); return; }
    setBusy(true); st.setSaving(note.id ? "고치는 중…" : "저장하는 중…");
    const r = await rpc("cal_note_set", {
      p_id: note.id || null, p_d: note.d || null,
      p_title: note.title || null, p_body: body,
      p_color: note.color || "sel", p_entity: "3Y",
      p_author: (auth && auth.name) || null,
    });
    setBusy(false);
    if (r.error) { setOops({ msg: r.error.message }); st.setError(r.error.message); return; }
    st.setSaved("저장했습니다");
    setNote(null);
    loadNotes();
  }, [note, st, auth, loadNotes]);

  /* ── 일정 등록 ── */
  const openAdd = useCallback(function (t) {
    if (!t) {
      setAdd({ id: null, area: "결산", title: "", mode: "day", dn: 3, day: 10,
               dow: [1], months: [3, 6, 9, 12], one: today(), actor: "3Y", detail: "", note: "" });
      return;
    }
    const mode = t.cycle === "수시" ? "none"
      : t.cycle === "1회" ? "once"
      : t.cycle === "주" ? "week"
      : (t.dn !== null && t.dn !== undefined) ? "dn"
      : (t.cycle === "분기" || t.cycle === "연" || t.cycle === "년말") ? "some" : "day";
    setAdd({
      id: t.id, area: t.area, title: t.title, mode: mode,
      dn: t.dn === null || t.dn === undefined ? 3 : t.dn,
      day: t.day_of === null || t.day_of === undefined ? 10 : t.day_of,

      one: t.one_date || today(),
      actor: t.actor || "3Y", detail: t.detail || "", note: t.note || "",

  /* 안 고른 칸은 반드시 null 로 보냅니다 — 안 그러면 D+3 이 남아 달력에 두 번 뜹니다 */
  function addArgs(f) {
    const base = {
      p_id: f.id, p_area: f.area, p_title: f.title.trim(),
      p_dn: null, p_day: null, p_dow: null, p_months: null, p_one: null,

/* ══════════════════════════════════════════════════════════════
   연간 캘린더가 안 뜨는 이유를 사람 말로 알려 줍니다   (patch_181 · 2026-08-31)

   지난판은 무엇이 잘못되었든 「patch_18_calendar.sql 을 먼저 실행하세요」 한 줄만
   나왔습니다. 그래서 표는 멀쩡히 있는데 **함수가 없는 날짜(6월 31일)를 만들다가
   죽는 것**을 분간할 수 없었습니다. 오류 원문을 읽어 「무엇을 하면 되는가」를 짚습니다.
   ══════════════════════════════════════════════════════════════ */
function calDiag(e) {
  const m = String((e && e.message) || "");
  const code = String((e && e.code) || "");
  const bad = (m.match(/\d{4}-\d{2}-\d{2}/) || [])[0] || "";
  if (code === "PGRST202" || /Could not find the function|\bdoes not exist\b/i.test(m))
    return { t: "함수가 아직 DB 에 없습니다",
             w: "Supabase → SQL Editor 에서 import/patch_18_calendar.sql → patch_93_calendar_own.sql 을 그 순서로 실행해 주세요.",
             m: m };
  if (/date field value out of range/i.test(m))
    return { t: "없는 날짜를 만들다가 멈췄습니다" + (bad ? "  —  " + bad : ""),
             w: "일정 하나가 「매월 31일」처럼 잡혀 있어서, 그 날짜가 없는 달"
              + "(4 · 6 · 9 · 11월과 2월)을 그리려다 DB 가 그 자리에서 멈추는 것입니다. "
              + "import/patch_181_annual_calendar_daycap.sql 을 실행하면 그 달 말일로 잘라서 그립니다 "
              + "(6월 31일 → 6월 30일 · 2월 31일 → 2월 28일, 윤년이면 29일).",
             m: m };
  if (/permission denied|not authorized|권한/i.test(m))
    return { t: "볼 권한이 없습니다",
             w: "연간 캘린더는 재무팀 권한(finance) 이상이어야 보입니다. 권한을 받은 뒤 다시 열어 보세요.",
             m: m };
  if (/relation .* does not exist/i.test(m))
    return { t: "일정을 담는 표가 없습니다",
             w: "import/patch_18_calendar.sql 을 먼저 실행해 주세요 (annual_events 표를 만듭니다).",
             m: m };
  return { t: "연간 캘린더를 불러오지 못했습니다",
           w: "아래 「오류 원문」을 그대로 알려 주시면 원인을 찾아 고치겠습니다.",
           m: m };
}

function ScreenAnnual() {
  const st = useStatus();

  const nowY = new Date().getFullYear();
  const nowM = new Date().getMonth() + 1;

  const [year, setYear] = useState(nowY);
  const [evs, setEvs] = useState([]);
  const [up, setUp] = useState([]);
  const [off, setOff] = useState([]);
  const [hideDone, setHideDone] = useState(false);
  const [sel, setSel] = useState(null);
  const [edit, setEdit] = useState(null);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState(null);   /* {t,w,m} — calDiag 가 만든 진단 */
  const [busy, setBusy] = useState(false);
  const [ack, reloadAck] = useAckMap("calendar", null, year);

  const load = useCallback(async function () {
    if (!sb) { setLoading(false); return; }
    setLoading(true);
    const rs = await Promise.all([
      rpc("f_annual_calendar", { p_year: year }),
      rpc("f_upcoming", { p_days: 60 }),
    ]);
    if (rs[0].error) {
      /* ★ 「함수가 없다」 와 「함수가 도중에 죽었다」 는 전혀 다른 일입니다.
         지난판은 무엇이 잘못되었건 「patch_18 을 실행하세요」 만 나와서,
         없는 날짜(2026-06-31) 를 만들다가 죽은 것을 알아보지 못했습니다. */
      setErr(calDiag(rs[0].error));
      setEvs([]); setUp([]); setLoading(false); return;
    }
    setErr(null); setEvs(safe(rs[0])); setUp(safe(rs[1])); setLoading(false);
  }, [year]);
  useEffect(function () { load(); }, [load]);

  const shown = useMemo(function () {
    return evs.filter(function (e) { return off.indexOf(e.kind) < 0; })
              .filter(function (e) { return !(hideDone && e.done); });
  }, [evs, off, hideDone]);

  const byMonth = useMemo(function () {
    const m = [];
    for (let i = 0; i < 12; i++) m.push([]);
    shown.forEach(function (e) { if (e.mth >= 1 && e.mth <= 12) m[e.mth - 1].push(e); });
    m.forEach(function (a) { a.sort(function (x, y) { return x.due_date.localeCompare(y.due_date); }); });
    return m;
  }, [shown]);

  const total = shown.length;
  const doneN = shown.filter(function (e) { return e.done; }).length;
  const unconf = evs.filter(function (e) { return !e.confirmed; }).length;

  async function toggle(e) {
    setBusy(true); st.setSaving("일정 기록 중…");
    const r = await rpc("annual_done_set", { p_event: e.event_id, p_due: e.due_date, p_done: !e.done, p_note: null });
    setBusy(false);
    if (r.error) { st.setError(r.error.message); return; }
    st.setSaved(e.done ? "완료 취소했습니다" : "완료로 기록했습니다");
    setSel(null); load();
  }
  async function doneUp(u) {
    setBusy(true); st.setSaving("일정 기록 중…");

            h("i", { style: { width: 8, height: 8, borderRadius: 2, background: KIND_COLOR[k] || "var(--na)", display: "inline-block" } }),

      h("div", { className: "rows" }, up.map(function (u) {

          h("span", { className: "rt" }, u.title),
          h("span", { className: "rm" },
            !u.confirmed ? h("span", { className: "st warn" }, "기한 확인") : null,
            u.actor ? h("span", { className: "muted", style: { fontSize: 10.5 } }, u.actor) : null,
            h("span", { className: "st " + (u.d_left < 0 ? "bad" : "") },

            (!u.confirmed || u.urgency === "지남" || u.urgency === "임박" || u.urgency === "오늘")

function EventEdit(props) {
  const st = useStatus();
  const year = props.year;
  const [f, setF] = useState(function () { return props.value || emptyEvent(year); });
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  useEffect(function () { if (props.value) { setF(props.value); setErr(""); } }, [props.value]);
  if (!props.value) return null;

  const needMonths = f.rule === "1회" || f.rule === "지정월";
  function up(k, v) { st.setEditing(); setF(Object.assign({}, f, { [k]: v })); }

  async function save() {
    if (!f.title.trim()) { setErr("무엇을 하는 일인지 제목을 적어 주세요."); return; }
    if (needMonths && f.months.length === 0) { setErr("몇 월인지 골라 주세요."); return; }
    if (!f.day_of) { setErr("며칟날인지 골라 주세요."); return; }
    setBusy(true); st.setSaving("일정 저장 중…");
    const r = await rpc("annual_event_set", {
      p_id: f.id, p_kind: f.kind, p_title: f.title.trim(), p_rule: f.rule,
      p_months: needMonths ? f.months : null, p_day_of: f.day_of,
      p_one_year: f.rule === "1회" ? (f.one_year || year) : null,
      p_lead_days: f.lead_days, p_actor: f.actor.trim() || null, p_detail: f.detail.trim() || null,
    });
    setBusy(false);
    if (r.error) { setErr(r.error.message); st.setError(r.error.message); return; }
    st.setSaved("일정을 저장했습니다");
    props.onSaved();
  }
  async function del() {
    if (!f.id) return;
    setBusy(true); st.setSaving("일정 지우는 중…");
    const r = await rpc("annual_event_del", { p_id: f.id });
    setBusy(false);
    if (r.error) { setErr(r.error.message); st.setError(r.error.message); return; }
    st.setSaved("일정을 지웠습니다");
    props.onSaved();
  }

  return h(Modal, {
    open: true, width: 600, title: f.id ? "일정 고치기" : "우리 일정 넣기",
    onClose: props.onClose,
    footer: h(React.Fragment, null,
      f.id && f.mine ? h("button", { className: "btn danger", disabled: busy, onClick: del }, "지우기") : null,
      h("div", { className: "sp" }),
      h("button", { className: "btn", onClick: props.onClose }, "취소"),
      h("button", { className: "btn primary", disabled: busy, onClick: save }, busy ? "저장 중…" : "저장")),
  },
    h("div", { className: "form" },
      h("label", { className: "wide" }, "무엇을 하는 일인가",
        h("input", { value: f.title, autoFocus: true, placeholder: "예 · QWER 미니5집 촬영",
          onChange: function (e) { up("title", e.target.value); } })),
      h("label", null, "종류",
        h("select", { value: f.kind, onChange: function (e) { up("kind", e.target.value); } },
          KINDS_A.map(function (k) { return h("option", { key: k, value: k }, k); }))),
      h("label", null, "담당",
        h("input", { value: f.actor, placeholder: "재무팀", onChange: function (e) { up("actor", e.target.value); } })),
      h("div", { className: "wide" },
        h("div", { className: "muted", style: { fontSize: 11.5, fontWeight: 900, marginBottom: 6 } }, "언제 오는 일인가"),
        h("div", { className: "when" }, EV_RULES.map(function (r) {
          return h("button", { key: r.k, type: "button", className: "when-b" + (f.rule === r.k ? " on" : ""),
            onClick: function () { up("rule", r.k); } }, h("b", null, r.t), h("span", null, r.d));
        }))),
      needMonths ? h("div", { className: "wide" },
        h("div", { className: "muted", style: { fontSize: 11.5, fontWeight: 900, marginBottom: 6 } },
          "몇 월", f.rule === "지정월" ? h("span", { className: "st" }, " 여러 달 고를 수 있습니다") : null),
        h("div", { className: "dow" }, Array.from({ length: 12 }).map(function (_, i) {
          const m = i + 1;
          return h("button", { key: m, type: "button", className: "dow-b" + (f.months.indexOf(m) >= 0 ? " on" : ""),
            onClick: function () {
              if (f.rule === "1회") up("months", [m]);
              else up("months", f.months.indexOf(m) >= 0 ? f.months.filter(function (x) { return x !== m; }) : f.months.concat([m]));
            } }, m + "월");
        }))) : null,
      f.rule === "1회" ? h("label", null, "연도",
        h("select", { value: String(f.one_year || year), onChange: function (e) { up("one_year", Number(e.target.value)); } },
          [year - 1, year, year + 1].map(function (y) { return h("option", { key: y, value: y }, y + "년"); }))) : null,
      h("label", null, "며칟날",
        h("select", { value: String(f.day_of || ""), onChange: function (e) { up("day_of", Number(e.target.value)); } },
          [h("option", { key: "", value: "" }, "고르세요")].concat(
            Array.from({ length: 31 }).map(function (_, i) { return h("option", { key: i, value: i + 1 }, (i + 1) + "일"); })))),
      h("label", null, "며칠 전부터 알릴까요",
        h("select", { value: String(f.lead_days), onChange: function (e) { up("lead_days", Number(e.target.value)); } },
          [3, 7, 14, 30, 45, 60].map(function (d) { return h("option", { key: d, value: d }, d + "일 전"); }))),
      h("label", { className: "wide" }, "설명",
        h("textarea", { rows: 3, value: f.detail, placeholder: "무엇을 준비해야 하는지 적어 두면 다음 사람이 압니다",
          onChange: function (e) { up("detail", e.target.value); } })),
      err ? h("div", { className: "wide warnbox" }, err) : null));

  }, [period, withDone, mPick]);

  const openDetail = useCallback(async function (m) {
    setDetail(m); setDlines([]); setNote("");
    const r = await rpc("f_memo_detail", { p_id: m.id });
    setDlines(safe(r));
  }, []);

  /* 메모에 붙일 사진 — 저장할 때 한꺼번에 올립니다 */
  const [pics, setPics] = useState([]);
  const [picErr, setPicErr] = useState(null);
  const [files, setFiles] = useState({});      /* memo_id → 붙어 있는 사진 목록 */
  const [fileAbsent, setFileAbsent] = useState(false);
  const [picUrl, setPicUrl] = useState({});    /* path → 잠깐 열리는 주소 */
  const [zoomBig, setZoomBig] = useState(null);

  /* 저장한 뒤 사진을 올리고 표에 적습니다 */
  async function upPics(memoId) {
    if (!pics.length || !memoId) return;
    for (let i = 0; i < pics.length; i++) {
      const p = pics[i];
      const nm = (p.file && p.file.name) || ("붙여넣기-" + (i + 1) + ".png");
      const path = "memo/" + memoId + "/" + Date.now() + "_" + i + "_" +
                   nm.replace(/[^\w.\-가-힣]/g, "_");
      st.setSaving("사진을 올리는 중… (" + (i + 1) + "/" + pics.length + ")");
      const up = await sb.storage.from("issues").upload(path, p.file, { upsert: false });
      if (up.error) { setPicErr("사진을 올리지 못했습니다 — " + up.error.message); continue; }
      const r = await rpc("memo_file_add", {
        p_memo: memoId, p_path: path, p_name: nm,
        p_bytes: p.file ? p.file.size : null, p_mime: p.file ? p.file.type : null,
        p_ocr: p.ocr || null, p_by: auth.email || null,
      });
      if (r.error) {
        setPicErr(/memo_file_add|Could not find/i.test(r.error.message)
          ? "patch_174_memo_file.sql 을 아직 안 돌리셨습니다 — 한 번 실행하면 사진 붙이기가 켜집니다."
          : r.error.message);
        return;
      }
    }
    setPics([]);
  }

  /* 어느 메모에 사진이 몇 장 붙어 있는지 */
  const loadFiles = useCallback(async function () {
    if (!sb) return;
    const r = await rpc("f_memo_files", {});
    if (r.error) { setFileAbsent(true); setFiles({}); return; }
    setFileAbsent(false);
    const m = {};
    safe(r).forEach(function (x) { (m[x.memo_id] = m[x.memo_id] || []).push(x); });
    setFiles(m);

/* ── 품의서 이슈 ────────────────────────────────────────── */
function IssueBoard() {
  const st = useStatus();
  const auth = useAuth();
  const [rows, setRows] = useState([]);
  const [notes, setNotes] = useState([]);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState(null);
  const [fStatus, setFStatus] = useState("미해결");
  const [fTopic, setFTopic] = useState("전체");
  const [q, setQ] = useState("");
  const [open, setOpen] = useState(null);
  const [form, setForm] = useState({});
  const [newIssue, setNewIssue] = useState(false);
  const [nf, setNf] = useState({ title: "", topic: "매출인식", counterparty: "", question: "" });
  const [nn, setNn] = useState({ kind: "메일", author: "", body: "", noted_on: today() });
  const [pend, setPend] = useState([]);
  const [drag, setDrag] = useState(false);
  const [imgUrls, setImgUrls] = useState({});
  const [zoom, setZoom] = useState(null);
  const fileRef = useRef(null);

  const load = useCallback(async function () {
    if (!sb) { setLoading(false); return; }
    setLoading(true); setErr(null);
    const rs = await Promise.all([
      sb.from("v_issue_list").select("*").order("seq"),
      sb.from("issue_notes").select("*").order("noted_on", { ascending: false }).limit(2000),
    ]);
    if (rs[0].error) setErr(rs[0].error.message);
    setRows(safe(rs[0])); setNotes(safe(rs[1]));
    setLoading(false);
  }, []);
  useEffect(function () { load(); }, [load]);

  const shown = useMemo(function () {
    const kw = q.trim().toLowerCase();
    return rows.filter(function (r) {
      if (fStatus === "미해결" ? r.status === "적용완료" : (fStatus !== "전체" && r.status !== fStatus)) return false;
      if (fTopic !== "전체" && r.topic !== fTopic) return false;
      if (kw) {
        const hay = [r.code, r.title, r.topic, r.counterparty, r.question, r.decision, r.project_name]
          .filter(Boolean).join(" ").toLowerCase();
        if (hay.indexOf(kw) < 0) return false;
      }
      return true;
    });
  }, [rows, fStatus, fTopic, q]);

  const m = useMemo(function () {
    const c = {};
    rows.forEach(function (r) { c[r.status] = (c[r.status] || 0) + 1; });
    return {
      total: rows.length,
      openCnt: rows.filter(function (r) { return r.status !== "적용완료"; }).length,
      high: rows.filter(function (r) { return r.priority === "높음" && r.status !== "적용완료"; }).length,
      closed: rows.filter(function (r) { return r.closed_out; }).length,
      /* ★ 상태는 「합의 · 적용완료」인데 ⑦ 결론이 빈 것 —
           무엇으로 합의했는지가 시스템 어디에도 없다는 뜻입니다 */
      agreedNoDecision: rows.filter(function (r) {
        return (r.status === "합의" || r.status === "적용완료") && !String(r.decision || "").trim();
      }),
      byStatus: c,
    };
  }, [rows]);

  const myNotes = useMemo(function () {
    return open ? notes.filter(function (n) { return n.issue_id === open.id; }) : [];
  }, [notes, open]);

  /* 스샷 서명 URL (비공개 버킷 · 10분 만료) */
  useEffect(function () {
    if (!sb || !open) return;
    const need = myNotes.filter(function (n) { return n.img_path && !imgUrls[n.img_path]; });
    if (!need.length) return;
    let live = true;
    (async function () {
      const out = {};
      for (let i = 0; i < need.length; i++) {
        const r = await sb.storage.from("issues").createSignedUrl(need[i].img_path, 600);
        if (r.data && r.data.signedUrl) out[need[i].img_path] = r.data.signedUrl;
      }
      if (live && Object.keys(out).length) setImgUrls(function (p) { return Object.assign({}, p, out); });
    })();
    return function () { live = false; };
  }, [open, myNotes]);

  function openIssue(r) {
    setOpen(r);
    setForm({
      question: r.question || "", our_position: r.our_position || "", kgaap_basis: r.kgaap_basis || "",
      recommend: r.recommend || "", industry: r.industry || "", to_confirm: r.to_confirm || "",
      decision: r.decision || "", accounts: r.accounts || "", impact: r.impact || "",
      status: r.status, priority: r.priority, counterparty: r.counterparty || "",
    });
    setNn({ kind: "메일", author: "", body: "", noted_on: today() });
    setPend([]);
  }
  function set(k, v) { setForm(function (f) { return Object.assign({}, f, { [k]: v }); }); st.setEditing(); }

  async function save() {
    if (!open) return;
    st.setSaving("이슈 저장 중…");
    const patch = Object.assign({}, form, { updated_at: new Date().toISOString() });
    if ((form.status === "합의" || form.status === "적용완료") && !open.decided_on) {
      patch.decided_on = today(); patch.decided_by = auth.email;
    }
    const r = await sb.from("accounting_issues").update(patch).eq("id", open.id);
    if (r.error) { st.setError("저장 실패: " + r.error.message); return; }
    st.setSaved("이슈가 저장되었습니다");
    await load();
    setOpen(function (o) { return o ? Object.assign({}, o, patch) : o; });
  }

  async function addIssue() {
    if (!nf.title.trim()) { st.setError("이슈 제목을 입력하세요"); return; }
    st.setSaving("이슈 등록 중…");
    const nextSeq = rows.reduce(function (s, r) { return Math.max(s, r.seq || 0); }, 0) + 1;
    const code = "I-" + String(nextSeq).padStart(2, "0");
    const r = await sb.from("accounting_issues").insert({
      code: code, seq: nextSeq, title: nf.title.trim(), topic: nf.topic,
      counterparty: nf.counterparty || null, question: nf.question || null,
      source: "내부 등록", raised_by: auth.email, raised_on: today(),
      status: "논의중", priority: "보통",
    });
    if (r.error) { st.setError("등록 실패: " + r.error.message); return; }
    st.setSaved(code + " 등록됨");
    setNewIssue(false); setNf({ title: "", topic: "매출인식", counterparty: "", question: "" });
    await load();
  }

  async function addNote() {
    if (!open) return;
    if (!nn.body.trim() && !pend.length) { st.setError("내용을 적거나 스크린샷을 올려주세요"); return; }
    st.setSaving("이력 저장 중…");
    try {
      if (pend.length) {
        for (let i = 0; i < pend.length; i++) {
          const f = pend[i];
          const safeName = (f.name || ("paste-" + (i + 1) + ".png")).replace(/[^\w.\-가-힣]/g, "_");
          const path = (open.code || open.id) + "/" + Date.now() + "_" + i + "_" + safeName;
          const up = await sb.storage.from("issues").upload(path, f, { upsert: false });
          if (up.error) throw new Error("이미지 업로드 실패: " + up.error.message);
          const ins = await sb.from("issue_notes").insert({
            issue_id: open.id, noted_on: nn.noted_on || null,
            kind: nn.body.trim() && i === 0 ? nn.kind : "스크린샷",
            author: nn.author || auth.email,
            body: i === 0 ? (nn.body.trim() || null) : null,
            img_path: path, img_name: f.name || ("paste-" + (i + 1) + ".png"), created_by: auth.email,
          });
          if (ins.error) throw new Error(ins.error.message);
        }
      } else {
        const ins = await sb.from("issue_notes").insert({
          issue_id: open.id, noted_on: nn.noted_on || null, kind: nn.kind,
          author: nn.author || auth.email, body: nn.body.trim(), created_by: auth.email,
        });
        if (ins.error) throw new Error(ins.error.message);
      }
      st.setSaved("이력이 기록되었습니다");
      setNn(function (v) { return Object.assign({}, v, { body: "" }); });
      setPend([]); await load();
    } catch (e) { st.setError(e.message); }
  }

  async function delNote(n) {
    if (!window.confirm("이 이력을 삭제합니다. 계속하시겠습니까?")) return;
    st.setSaving("삭제 중…");
    if (n.img_path) await sb.storage.from("issues").remove([n.img_path]);
    const r = await sb.from("issue_notes").delete().eq("id", n.id);
    if (r.error) { st.setError("삭제 실패: " + r.error.message); return; }
    st.setSaved("삭제되었습니다"); await load();
  }

  async function revert() {
    if (!open) return;
    if (open.status === "합의" || open.status === "적용완료" || String(open.decision || "").trim()) {
      st.setError("결론이 있는 이슈는 되돌릴 수 없습니다 — 결론이 목록에서 사라집니다");
      return;
    }
    if (!window.confirm("「" + open.title + "」을 회계 · 비용 메모로 되돌립니다.\n\n" +
      "· 이 이슈는 보류가 됩니다 (지우지 않습니다 — 쌓인 이력이 남습니다)\n" +
      "· 계상 판단은 「판단필요」로 다시 시작합니다")) return;
    st.setSaving("회계 · 비용 메모로 되돌리는 중…");
    const r = await rpc("issue_to_memo", { p_id: open.id, p_amount: null, p_amt_status: null, p_period: null });
    if (r.error) { st.setError(r.error.message); return; }
    st.setSaved((open.code || "") + " 을 회계 · 비용 메모로 되돌렸습니다 (이 이슈는 보류)");
    setOpen(null); await load();
  }

  function onPaste(e) {
    if (!auth.canWrite || !open) return;
    const files = [];
    Array.prototype.forEach.call(e.clipboardData.items, function (it) {
      if (it.type.indexOf("image/") === 0) {
        const f = it.getAsFile();
        if (f) files.push(new File([f], "paste-" + Date.now() + ".png", { type: f.type }));
      }
    });
    if (files.length) { e.preventDefault(); setPend(function (p) { return p.concat(files); }); st.setEditing(); }

function AcctUsed(props) {
  const st = useStatus();

  const [head, setHead] = useState(null);
  const [rows, setRows] = useState([]);

  const [absent, setAbsent] = useState(false);
  const [cls, setCls] = useState("전체");
  const [q, setQ] = useState("");
  const [onlyMoved, setOnlyMoved] = useState(false);
  const [fix, setFix] = useState(null);
  const [fCls, setFCls] = useState("비용");
  const [fStmt, setFStmt] = useState("PL");
  const [fNormal, setFNormal] = useState("차변");

  const load = useCallback(async function () {
    if (!sb || !props.period) { setLoading(false); return; }
    setLoading(true);
    const rs = await Promise.all([
      rpc("f_tb_head", { p_period: props.period, p_entity: entity }),
      rpc("f_trial_balance", { p_period: props.period, p_entity: entity }),
    ]);
    if (rs[0].error) { setAbsent(true); setLoading(false); return; }
    setAbsent(false);
    setHead(safe(rs[0])[0] || null);
    setRows(safe(rs[1]));
    setLoading(false);
  }, [props.period, entity]);
  useEffect(function () { load(); }, [load]);

  const hit = useMemo(function () {
    const kw = q.trim().replace(/\s+/g, "");
    return rows.filter(function (r) {
      if (cls !== "전체" && r.cls !== cls) return false;
      if (onlyMoved && !r.flag) return false;
      if (!kw) return true;
      return String(r.acct_code).indexOf(kw) >= 0
        || String(r.acct_name || "").replace(/\s+/g, "").indexOf(kw) >= 0;
    });
  }, [rows, cls, q, onlyMoved]);

function AcctGuide() {
  const st = useStatus();
  const auth = useAuth();
  const [guide, setGuide] = useState([]);
  const [ex, setEx] = useState({});            /* 계정 → 실제 분개 예시 (patch_179) */
  const [exAbsent, setExAbsent] = useState(false);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState(null);
  const [q, setQ] = useState("");
  const [only, setOnly] = useState("전체");
  const [edit, setEdit] = useState(null);
  const [eBusy, setEBusy] = useState(false);
  const [eErr, setEErr] = useState(null);
  const [ack, reloadAck] = useAckMap("guide", null, loading);

  const load = useCallback(async function () {
    if (!sb) { setLoading(false); return; }
    setLoading(true); setErr(null);
    const [g, e] = await Promise.all([
      sb.from("account_guide").select("*").order("seq"),
      rpc("f_acct_examples", { p_n: 2, p_from: "2026-01-01", p_to: null }),
    ]);
    if (g.error) { setErr(g.error.message); setLoading(false); return; }
    setGuide(safe(g));
    if (e.error) { setExAbsent(true); setEx({}); }
    else {
      setExAbsent(false);
      const m = {};
      safe(e).forEach(function (x) { (m[x.account] = m[x.account] || []).push(x); });
      setEx(m);
    }
    setLoading(false);
  }, []);
  useEffect(function () { load(); }, [load]);

  const settled = useCallback(function (id) {
    return ["확인함", "처리함", "해당없음"].indexOf((ack[id] && ack[id].state) || "") >= 0;
  }, [ack]);

  /* ★ 계정과목을 주인공으로 — 기준표를 계정 기준으로 뒤집습니다 */
  const accts = useMemo(function () {
    const m = {};
    guide.forEach(function (g) {
      const a = String(g.account || "").trim() || "(계정 없음)";
      if (!m[a]) m[a] = { account: a, uses: [] };
      m[a].uses.push(g);
    });
    /* 분개장에는 있는데 기준표에 없는 계정도 같이 보여 줍니다 */
    Object.keys(ex).forEach(function (a) { if (!m[a]) m[a] = { account: a, uses: [] }; });
    return Object.keys(m).sort(function (x, y) { return x.localeCompare(y, "ko"); })
      .map(function (k) { return m[k]; });
  }, [guide, ex]);

  const hit = useMemo(function () {
    const qq = q.trim();
    return accts.filter(function (a) {
      if (only === "⚠확인" && !a.uses.some(function (g) { return g.basis === "⚠확인" && !settled(g.id); })) return false;
      if (only === "기준없음" && a.uses.length) return false;
      if (!qq) return true;
      if (a.account.indexOf(qq) >= 0) return true;
      if ((ex[a.account] || []).some(function (x) {
        return [x.memo, x.party, x.project].some(function (v) { return String(v || "").indexOf(qq) >= 0; });
      })) return true;
      return a.uses.some(function (g) {
        return [g.item, g.category, g.note, g.caution, g.evidence].some(function (v) {
          return String(v || "").indexOf(qq) >= 0;
        });
      });
    });
  }, [accts, q, only, ex, settled]);

  const cats = useMemo(function () {
    const out = [];
    guide.forEach(function (g) { const c = g.category || "기타"; if (out.indexOf(c) < 0) out.push(c); });
    return out.sort(function (a, b) { return a.localeCompare(b, "ko"); });
  }, [guide]);

  const nCheck = guide.filter(function (g) { return g.basis === "⚠확인" && !settled(g.id); }).length;
  const nNoRule = accts.filter(function (a) { return !a.uses.length; }).length;

  async function saveGuide() {
    if (!edit) return;
    if (!String(edit.item || "").trim() || !String(edit.account || "").trim()) {
      setEErr("「계정과목」과 「이런 지출은(구분)」은 꼭 있어야 합니다."); return;
    }
    setEBusy(true); setEErr(null); st.setSaving(edit.id ? "고치는 중…" : "새로 넣는 중…");
    const r = await rpc("acct_guide_set", {
      p_id: edit.id || null,
      p_category: edit.category || null, p_item: edit.item.trim(), p_account: edit.account.trim(),
      p_note: edit.note || null, p_basis: edit.basis || null,
      p_caution: edit.caution || null, p_evidence: edit.evidence || null, p_seq: null,
    });
    setEBusy(false);
    if (r.error) {
      setEErr(/acct_guide_set|Could not find/i.test(r.error.message)
        ? "patch_178_acct_guide_edit.sql 을 아직 안 돌리셨습니다 — 한 번 실행하면 고치기가 켜집니다."
        : r.error.message);
      st.setError("저장하지 못했습니다"); return;
    }
    st.setSaved(edit.id ? "고쳤습니다" : "새로 넣었습니다"); setEdit(null); load();
  }
  async function delGuide(g) {
    setEBusy(true); st.setSaving("지우는 중…");
    const r = await rpc("acct_guide_del", { p_id: g.id });

    if (r.error) { setEErr(r.error.message); st.setError("지우지 못했습니다"); return; }
    st.setSaved("지웠습니다"); setEdit(null); load();
  }

  if (err) return h("div", { className: "card" }, h(Empty, null,
    "계정과목 기준을 불러올 수 없습니다 — ", h("b", null, "patch_4_ops.sql"), " 을 실행하세요.",
    h("div", { style: { fontSize: 11.5 } }, err)));

  return h(React.Fragment, null,
    h("div", { className: "card" },
      h("h2", null, "🔎 계정 찾기",
        h("span", { className: "st" }, num(accts.length) + "개 계정"),

        h("div", { className: "sp" }),
        auth.canWrite ? h("button", { className: "btn sm primary",
          onClick: function () {
            setEErr(null);
            setEdit({ category: cats[0] || "", item: "", account: "", note: "", basis: "", caution: "", evidence: "" });

       .replace(/[•·]\s*[0-9][0-9,]*\s*(?=[•·]|$)/g, " ");

  for (let i = 0; i < WHY_CUT.length; i++) {

          lab = ASK_LAB[i].k; break;
        }
      }
    }
    if (lab) { flush(); cur = lab; return; }
    if (cur) buf.push(s0);
  });
  flush();
  /* 이름 장부만 채우려고 글 전체를 한 번 훑습니다 */
  unwrapSlack(t0);
  return out;
}

function fromText(t0) {
  const t = String(t0 || "").replace(/\s+/g, " ").trim();
  const out = { who: null, mgr: null, item: null, qty: null, why: null, amount: null, project: null, link: null };
  if (!t) return out;

  /* ① 구매요청자 — 「구매요청자: <@ID>」 또는 맨 앞 <@ID> */
  const w1 = t.match(/구매\s*요청자\s*[:：]?\s*<@([UW][A-Z0-9]{6,})>/)
          || t.match(/^<@([UW][A-Z0-9]{6,})>/);
  if (w1) out.who = w1[1];
  /* ② 구매 담당자 (승인하는 사람) — 요청자와 다릅니다 */
  const w2 = t.match(/구매\s*담당자\s*[:：]?\s*<@([UW][A-Z0-9]{6,})>/);
  if (w2) out.mgr = w2[1];
  /* ③ 구매 링크 */
  const lk = t.match(/https?:\s*\/\/\S+/);
  if (lk) out.link = lk[0].replace(/\s+/g, "");

  out.amount = moneyIn(t);

  /* ④⑤⑥ 품목 / 수량 / 사유 */
  let body = null;
  const b1 = t.match(/구매\s*요청\s*품목\s*[:：]\s*(.+)$/);
  if (b1) body = b1[1];
  else {
    const b2 = t.match(/[•·]\s*(.+)$/);
    if (b2) body = b2[1];
    else {
      const b3 = t.match(/^<@[UW][A-Z0-9]{6,}>\s*님(?:이)?\s*(.+)$/);
      if (b3) body = b3[1];
    }
  }
  if (!body) body = t;
  body = cleanWhy(body);
  if (body) {
    const p2 = body.split("/").map(function (x) { return x.trim(); }).filter(Boolean);
    const isQty = function (x) { return /^[0-9]+\s*(개|장|대|명|건|박스|세트|EA|ea|시간|팩|권|매|kg|g|ml|L)?$/.test(String(x || "").trim()); };
    if (p2.length >= 3 && isQty(p2[1])) { out.item = p2[0]; out.qty = p2[1]; out.why = p2.slice(2).join(" / "); }
    else if (p2.length >= 2) { out.item = p2[0]; out.why = p2.slice(1).join(" / "); }
    else { out.item = body.slice(0, 60); out.why = body; }
  }

  const low = t.toLowerCase();
  for (let i = 0; i < PROJ_HINT.length; i++) {
    const nm = PROJ_HINT[i];
    if (nm && nm.length >= 2 && low.indexOf(String(nm).toLowerCase()) >= 0) { out.project = nm; break; }
  }
  return out;
}

function reqFields(r, form, grp) {
  const tax = grp === "tax";
  const T = fromText(r.text);          /* 글에서 직접 집은 것 (양식이 없을 때 씁니다) */
  /* ★ 「질문 줄 다음 줄이 답」 꼴 — 세금계산서 발행요청 봇 글이 거의 이것입니다.
        양식 칸(form)이 안 올 때 이것이 채워 줍니다 (재무리드 화면 2026-09-09 : 전부 「—」 로 비어 있었습니다) */
  const A = askText(r.text);
  const who  = splitPerson(pick(form, [/요청\s*담당자/, /요청자/, /담당자(?!.*전화)/]) || r.req_person || A.who);
  const trio = splitItem(pick(form, [/항목/, /사용처/]));
  const itemTax = pick(form, [/발행\s*품목/, /품목/]) || r.req_item || A.item;
  const amtS = pick(form, [/발행\s*금액/, /총\s*구매\s*금액/, /금액/]) || A.amount;
  /* 「15만원」 · 「1억 4천만원」 도 읽습니다 — parseNum 은 15 로 읽어 버립니다 */
  const amtF = r.amount !== null && r.amount !== undefined ? r.amount
             : (wonKo(amtS) !== null ? wonKo(amtS) : parseNum(amtS));
  return {
    tax:     tax,
    team:    pick(form, [/팀\s*명/, /^팀$/]),
    reqDate: pick(form, [/요청일/, /신청일/]) || r.req_date,
    /* ★ 세금계산서는 「요청일」과 「발행 일자」가 다릅니다 — 매출 귀속은 발행일자입니다 */
    issDate: pick(form, [/발행\s*일자/, /발행일/]) || A.issDate,
    /* ★ r.who 는 워크플로가 대신 올린 **봇 이름**일 때가 많습니다 —
          그래서 글에서 집은 사람(T.who)을 그보다 먼저 씁니다 */
    who:     who.name || r.req_person || T.who || r.who || null,
    ask:     A,                        /* 무엇을 어디서 집었는지 뒤에서 볼 수 있게 남겨 둡니다 */
    mgr:     T.mgr,
    org:     who.org,
    item:    tax ? itemTax : (trio.item || T.item),
    qty:     tax ? null : (trio.qty || T.qty),
    why:     tax ? (itemTax || "")
                 : cleanWhy(trio.why || T.why || r.text || ""),
    /* ★ 양식에 금액이 없으면 글에서 집습니다 (「• 201870」 · 「총 구매 금액 418,000」) */
    amount:  amtF !== null && amtF !== undefined ? amtF : T.amount,
    amtFrom: (amtF === null || amtF === undefined) && T.amount ? "글에서 집음" : null,
    project: pick(form, [/프로젝트/]) || r.req_project || A.project || T.project,
    company: pick(form, [/회사명/, /거래처/]) || r.req_company || A.company,
    vendor:  pick(form, [/구매처/]) || null,
    email:   pick(form, [/이메일/, /메일/]) || A.email,
    team:    pick(form, [/팀\s*명/, /^팀$/]) || A.team,
    link:    pick(form, [/링크/, /url/i]) || T.link,
  };
}

function dnorm(v) {

  const m = String(v).match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
  if (!m) return String(v).slice(0, 10);

const SLACK_NAME = {};

function withIds(v) {

/** 아이디만 들어 있는 값을 이름으로 바꿉니다 (글자 그대로 돌려줍니다) */

  const t = String(v || "").trim();
  if (!t) return t;

}

function readCard(aoa) {
  const NEED = ["승인일자", "승인금액", "가맹점명"];
  const COLS = [["dt", "승인일자"], ["amt", "승인금액"], ["shop", "가맹점명"],
                ["no", "승인번호"], ["card", "카드번호"], ["cancel", "승인취소여부"],
                ["kind", "업종명"], ["inst", "할부개월수"], ["tm", "승인시각"]];
  for (let r = 0; r < Math.min(aoa.length, 20); r++) {
    const row = aoa[r] || [];
    const names = row.map(function (_, c) { return String(cell(row, c)).replace(/\s/g, ""); });
    const ok = NEED.every(function (n) {
      return names.some(function (x) { return x.indexOf(n) >= 0; });
    });
    if (!ok) continue;
    const map = {};
    COLS.forEach(function (x) {
      for (let c = 0; c < names.length; c++) {
        if (names[c].indexOf(x[1]) >= 0) { map[x[0]] = c; break; }
      }
    });
    const out = [];
    for (let i = r + 1; i < aoa.length; i++) {
      const rw = aoa[i] || [];
      const g = function (k) { return map[k] === undefined ? "" : String(cell(rw, map[k])).trim(); };
      const amt = map.amt === undefined ? 0 : xnum(cell(rw, map.amt));
      const dt = xdate(g("dt"));
      if (!amt || !dt) continue;
      if (/^Y$/i.test(g("cancel"))) continue;          /* 취소건은 나가지 않았습니다 */
      out.push({ id: "cd" + i, dt: dt, amt: amt, shop: g("shop"), no: g("no"),
                 card: g("card"), kind: g("kind"), inst: g("inst"), tm: g("tm") });
    }
    return { r: r, rows: out };
  }
  return null;
}

  [/광고|인쇄|디자인|사진|스튜디오/, "광고선전비"],
  [/화원|꽃|선물|기념품/, "접대비"],
];
function cardAcct(kind, shop) {
  const t = String(kind || "") + " " + String(shop || "");
  for (let i = 0; i < CARD_ACCT.length; i++) if (CARD_ACCT[i][0].test(t)) return CARD_ACCT[i][1];
  return "진행비(기타)";
}

function ScreenSlack() {
  const st = useStatus();
  const auth = useAuth();
  const per = usePeriod();
  /* 기간을 날짜로 잡습니다. 처음에는 **결산 대상월 한 달** 이 골라져 있습니다 */
  const [from, setFrom] = useState(function () { return monthStart(per.period); });
  const [to, setTo] = useState(function () { return monthEnd(per.period); });
  /* 사이드 위쪽에서 결산월을 바꾸면 기간도 그 달로 따라갑니다 */
  const lastPeriod = useRef(per.period);
  useEffect(function () {
    if (lastPeriod.current === per.period) return;
    lastPeriod.current = per.period;
    setFrom(monthStart(per.period)); setTo(monthEnd(per.period));
  }, [per.period]);
  const [rows, setRows] = useState([]);
  const [forms, setForms] = useState([]);
  const [je, setJe] = useState({});          /* slack_id → 분개 한 줄 */
  const [jeAbsent, setJeAbsent] = useState(false);
  const [acct, setAcct] = useState({});      /* slack_id → 계정과목 추천 (patch_171) */
  const [acctAbsent, setAcctAbsent] = useState(false);
  const [acctErr, setAcctErr] = useState("");
  const [direct, setDirect] = useState({});     /* slack_id → 사람이 직접 넣은 분개 (patch_173) */
  const [presets, setPresets] = useState([]);   /* 자주 쓰는 분개 서식 */
  const [dirAbsent, setDirAbsent] = useState(false);
  const [reps, setReps] = useState({});         /* slack_id → 스레드 댓글 (patch_177) */
  const [hideSql, setHideSql] = useState(function () {
    try { return localStorage.getItem("hideSqlNote") === "1"; } catch (e) { return false; }
  });
  /* 분개 고르기 창 — 낱말 검색 · 직접 넣기 */
  const [srch, setSrch] = useState(null);       /* 낱말로 찾은 분개장 줄 */
  const [srchQ, setSrchQ] = useState("");
  const [srchMust, setSrchMust] = useState("");   /* 이 낱말이 꼭 들어간 것만 (예: QWER) */
  const [srchRole, setSrchRole] = useState("");   /* 매출만 / 비용만 (상대계정은 늘 뺍니다) */
  const [mine, setMine] = useState(null);       /* 직접 넣기 입력칸 */
  const [unknowns, setUnknowns] = useState([]);
  const [uName, setUName] = useState({});
  const [uBusy, setUBusy] = useState(false);
  const [stats, setStats] = useState([]);
  const [tagStats, setTagStats] = useState([]);
  const [grp, setGrp] = useState("tax");
  const grpTouched = useRef(false);
  const [tag, setTag] = useState(null);
  const [onlyRisk, setOnlyRisk] = useState(false);
  const [loading, setLoading] = useState(true);
  const [extra, setExtra] = useState(false);   /* 뒤에서 분개 · 계정과목을 채우는 중 */
  const [absent, setAbsent] = useState(false);
  /* 왜 안 보이는지 스스로 말해 주는 칸 — 함수에서 몇 건이 왔고, 기간에서 몇 건이 잘렸는가 */
  const [diag, setDiag] = useState({ raw: 0, kept: 0, newest: null, oldest: null, days: 0, err: null, noTag: false });
  /* 고른 달에 슬랙 자료가 아예 없으면 자료가 있는 달로 한 번 옮겨 드립니다 */
  const [moved, setMoved] = useState(null);
  const movedFor = useRef(null);
  const [tab, setTab] = useState("req");
  const [health, setHealth] = useState([]);
  const [chans, setChans] = useState([]);
  const [newId, setNewId] = useState("");
  const [newName, setNewName] = useState("");
  const [saving, setSaving] = useState(false);
  const [chErr, setChErr] = useState("");
  const [showDel, setShowDel] = useState(false);
  const [guide, setGuide] = useState(false);
  const [copied, setCopied] = useState("");
  const [editId, setEditId] = useState(null);
  const [editName, setEditName] = useState("");
  const [fix, setFix] = useState(null);
  const [fAmt, setFAmt] = useState(null);
  const [fCo, setFCo] = useState("");
  const [fPj, setFPj] = useState("");
  const [fPer, setFPer] = useState("");
  const [fixErr, setFixErr] = useState(null);
  const [fixBusy, setFixBusy] = useState(false);
  const [fixId, setFixId] = useState("");     /* 이름을 붙일 슬랙 아이디 */
  const [fixName, setFixName] = useState("");
  /* 분개 후보 고르기 */
  const [candFor, setCandFor] = useState(null);
  const [cands, setCands] = useState(null);
  const [cBusy, setCBusy] = useState("");
  const [ack, reloadAck] = useAckMap("slack", null, loading);

  const fnUrl = CONF.ok ? CONF.url.replace(/\/$/, "") + "/functions/v1/slack-events" : "";

  /* ── 불러오기 —
        ① 먼저 **목록에 꼭 필요한 것**만 받아 화면을 띄웁니다 (빨리 보입니다)
        ② 무거운 것(요청마다 딸린 분개 · 계정과목 추천)은 그 뒤에 조용히 채웁니다
        예전에는 아홉 개를 한꺼번에 기다리느라 첫 화면이 오래 걸렸습니다. */
  const load = useCallback(async function () {
    if (!sb) { setLoading(false); return; }
    const days = daysSince(from);

    /* ── ① 뼈대 ───────────────────────────────────────── */
    let reqR = await rpc("f_slack_requests", { p_kind: null, p_state: null, p_days: days, p_tag: tag });
    let noTag = false;
    if (reqR.error) {
      const r2 = await rpc("f_slack_requests", { p_kind: null, p_state: null, p_days: days });
      if (!r2.error) { reqR = r2; noTag = true; }
    }
    if (reqR.error) {
      setAbsent(true); setLoading(false);
      setDiag({ raw: 0, kept: 0, newest: null, oldest: null, days: days, err: reqR.error.message, noTag: noTag });
      return;
    }
    setAbsent(false);
    const raw = safe(reqR);
    /* 고른 날짜 범위 안의 요청만 남깁니다 (요청일 기준).
       ★ 날짜가 비어 있는 줄은 버리지 않습니다 — 버리면 화면이 통째로 비어 보입니다 */
    const inRange = raw.filter(function (r) {
      const d = String(r.posted_at || r.made_on || r.ts || "").slice(0, 10);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return true;
      return d >= from && d <= to;
    });
    const ds = raw.map(function (r) { return String(r.posted_at || "").slice(0, 10); })
                  .filter(function (d) { return /^\d{4}-\d{2}-\d{2}$/.test(d); }).sort();
    setDiag({ raw: raw.length, kept: inRange.length, days: days, noTag: noTag, err: null,
      newest: ds.length ? ds[ds.length - 1] : null, oldest: ds.length ? ds[0] : null });

    /* ★ 고른 달에는 슬랙 글이 한 줄도 없는데 다른 달에는 있는 경우 —
          (예: 슬랙 수집이 8월 중순부터 시작됐는데 결산월이 7월)
          빈 화면을 보여 주는 대신 자료가 있는 달로 한 번만 옮기고 그 사실을 알려 줍니다. */
    if (inRange.length === 0 && raw.length > 0 && ds.length) {
      const newest = ds[ds.length - 1];
      const key = from + "~" + to;
      if (movedFor.current !== key) {
        movedFor.current = key;
        setMoved({ was: from + " ~ " + to, oldest: ds[0], newest: newest });
        setFrom(monthStart(newest.slice(0, 7))); setTo(monthEnd(newest.slice(0, 7)));
        return;                                   /* 새 기간으로 다시 불러옵니다 */
      }
    } else if (inRange.length > 0) { movedFor.current = null; }

    const base = await Promise.all([
      rpc("f_slack_form_all", { p_days: days }),
      rpc("f_slack_channels", { p_include_deleted: showDel }),
      rpc("f_slack_users", {}),
      rpc("f_projects", {}),
    ]);
    /* 슬랙 아이디 → 이름 (patch_175). 없으면 아이디 그대로 보입니다 */
    if (!base[2].error) safe(base[2]).forEach(function (u) { if (u.name) SLACK_NAME[u.slack_id] = u.name; });
    /* 프로젝트 이름 — 글에서 프로젝트를 찾는 데 씁니다 (긴 이름부터 봅니다) */
    if (!base[3].error) {
      PROJ_HINT.length = 0;
      safe(base[3]).map(function (x) { return x.name || x.code; })
        .filter(Boolean).sort(function (a, b) { return String(b).length - String(a).length; })
        .forEach(function (x) { PROJ_HINT.push(x); });
    }
    setRows(inRange); setForms(safe(base[0])); setChans(safe(base[1]));
    setLoading(false);                            /* ← 여기서 화면이 뜹니다 */

    /* ── ② 나머지는 뒤에서 채웁니다 ──────────────────── */
    setExtra(true);
    const rest = await Promise.all([
      rpc("f_slack_req_stats", { p_days: days }),
      rpc("f_slack_health", {}),
      rpc("f_slack_req_tags", { p_days: days }),
      rpc("f_slack_unknown_users", {}),
      /* ★ 요청마다 「가장 가까운 분개」 한 줄 — 날짜 · 적요 · 금액 (patch_170) */
      rpc("f_slack_je_brief", { p_days: days }),
      /* ★ 요청 내용 → 분개장에서 실제로 쓰인 계정과목 (patch_171) */
      rpc("f_slack_acct_suggest", { p_days: days }),
      /* ★ 사람이 직접 넣은 분개 + 자주 쓰는 서식 (patch_173) */
      rpc("f_je_direct", { p_days: days }),
      rpc("f_je_presets", {}),
      /* ★ 스레드 댓글 — 「발행 완료」 건은 여기에 매출이 무엇인지 적혀 있습니다 (patch_177) */
      rpc("f_slack_replies", { p_days: days }),
    ]);
    setStats(safe(rest[0])); setHealth(safe(rest[1]));
    setTagStats(safe(rest[2])); setUnknowns(safe(rest[3]));
    /* 함수가 없으면 조용히 넘어갑니다 — 그 칸만 안 뜨고 나머지는 그대로 돕니다 */
    if (rest[4].error) { setJeAbsent(true); setJe({}); }
    else {
      setJeAbsent(false);
      const m = {};
      safe(rest[4]).forEach(function (x) { m[x.slack_id] = x; });
      setJe(m);
    }
    if (rest[5].error) { setAcctAbsent(true); setAcctErr(rest[5].error.message || ""); setAcct({}); }
    else {
      setAcctAbsent(false); setAcctErr("");
      const a2 = {};
      safe(rest[5]).forEach(function (x) { a2[x.slack_id] = x; });
      setAcct(a2);
    }
    if (rest[6].error) { setDirAbsent(true); setDirect({}); setPresets([]); }
    else {
      setDirAbsent(false);
      const d = {};
      safe(rest[6]).forEach(function (x) { d[x.slack_id] = x; });
      setDirect(d);
      setPresets(rest[7].error ? [] : safe(rest[7]));
    }
    if (rest[8] && !rest[8].error) {
      const rp = {};
      safe(rest[8]).forEach(function (x) { rp[x.slack_id] = x; });
      setReps(rp);
    } else setReps({});
    setExtra(false);
  }, [from, to, tag, showDel]);

  useEffect(function () { load(); }, [load]);

  /* 처음 열었을 때 고른 갈래가 비어 있으면, 자료가 있는 갈래로 저절로 옮깁니다.
     (사람이 한 번이라도 갈래를 누른 뒤에는 건드리지 않습니다) */
  useEffect(function () {
    if (grpTouched.current || !rows.length) return;
    const cnt = { tax: 0, buy: 0, etc: 0 };
    rows.forEach(function (r) { cnt[groupOf(r.kind)]++; });
    if (cnt[grp] > 0) return;
    const next = ["tax", "buy", "etc"].filter(function (k) { return cnt[k] > 0; })[0];
    if (next) setGrp(next);
  }, [rows]);

  async function openCands(r) {
    setCandFor(r); setCands(null); setSrch(null); setCBusy("불러오는 중");
    const b0 = reqFields(r, forms, groupOf(r.kind));
    const q = [b0.item, b0.why, b0.company, b0.vendor, b0.project].filter(Boolean).join(" ");
    setSrchQ(q);
    /* 프로젝트가 있으면 그 프로젝트 건만 먼저 봅니다 — QWER 요청이면 QWER 분개만 */
    const must = String(b0.project || "").split(/[_\s(]/)[0] || "";
    setSrchMust(must);
    /* ★ 세금계산서 발행요청은 **매출**, 구매요청은 **비용**만 봅니다.
          외상매출금 · 미지급금 같은 상대계정은 답이 아니라 늘 따라오는 짝입니다. */
    const role = b0.tax ? "매출" : "비용";
    setSrchRole(role);
    const d0 = direct[r.id];
    setMine({
      account: (d0 && d0.account) || "",
      made_on: (d0 && d0.made_on) || dnorm(b0.issDate) || dnorm(b0.reqDate) || String(r.posted_at || "").slice(0, 10),
      memo: (d0 && d0.memo) || ((b0.project ? b0.project + ") " : "") + (b0.item || b0.why || "")),
      amount: (d0 && d0.amount) !== undefined && d0 ? d0.amount : b0.amount,
      project: (d0 && d0.project) || b0.project || "",
      side: (d0 && d0.side) || (b0.tax ? "대변" : "차변"),
      preset: "",
    });
    const c = await rpc("f_slack_je_candidates", { p_slack: r.id, p_top: 8 });
    const list = c.error ? [] : safe(c);
    setCands(list);
    setCBusy("");
    /* 금액으로 못 찾으면 **낱말로** 자동으로 한 번 더 뒤집니다 */
    if (list.length === 0 && q) doSearch(q, must, role);
  }

  async function doSearch(q, must, role) {
    setSrch("loading");
    const mu = must === undefined ? srchMust : must;
    const ro = role === undefined ? srchRole : role;
    let r = await rpc("f_je_search", {
      p_text: q, p_top: 12, p_from: "2026-01-01", p_to: today(), p_must: mu || null, p_role: ro || null });
    /* patch_176 전 판(p_role 없음)이면 그것 없이 다시 부릅니다 */
    if (r.error && /p_role/i.test(r.error.message)) {
      r = await rpc("f_je_search", { p_text: q, p_top: 12, p_from: "2026-01-01", p_to: today(), p_must: mu || null });
    }
    /* patch_175 전 판(p_must 없음)이면 그것 없이 다시 부릅니다 */
    if (r.error && /p_must|Could not find/i.test(r.error.message)) {
      r = await rpc("f_je_search", { p_text: q, p_top: 12, p_from: "2026-01-01", p_to: today() });
    }
    /* 그 프로젝트 안에서 못 찾으면, 프로젝트를 풀고 한 번 더 봅니다 */
    if (!r.error && safe(r).length === 0 && mu) {
      const r2 = await rpc("f_je_search", { p_text: q, p_top: 12, p_from: "2026-01-01", p_to: today(), p_must: null, p_role: ro || null });
      if (!r2.error && safe(r2).length) { setSrch({ rows: safe(r2), wide: mu }); return; }
    }
    setSrch(r.error ? { err: r.error.message } : { rows: safe(r) });
  }

  async function saveMine(alsoPreset) {
    if (!candFor || !mine) return;
    if (!String(mine.account || "").trim()) { setChErr("계정과목을 적어 주세요."); return; }
    setCBusy("저장중"); st.setSaving("분개를 넣는 중…");
    const r = await rpc("je_direct_set", {
      p_slack: candFor.id, p_account: mine.account.trim(), p_made_on: mine.made_on || null,
      p_memo: mine.memo || null, p_amount: mine.amount === "" ? null : mine.amount,
      p_project: mine.project || null, p_party: null, p_note: null,
      p_side: mine.side || "차변",
      p_save_preset: alsoPreset ? (String(mine.preset || "").trim() || mine.account.trim()) : null,
    });
    setCBusy("");
    if (r.error) {
      st.setError("넣지 못했습니다");
      setChErr(/f_je_direct|je_direct_set|Could not find/i.test(r.error.message)
        ? "patch_173_je_direct.sql 을 아직 안 돌리셨습니다 — 한 번 실행하면 직접 넣기가 켜집니다."
        : r.error.message);
      return;
    }
    st.setSaved(alsoPreset ? "넣고 서식으로도 저장했습니다" : "분개를 넣었습니다");
    setCandFor(null);
    load();
  }

  async function delMine() {
    if (!candFor) return;
    setCBusy("저장중"); st.setSaving("지우는 중…");
    const r = await rpc("je_direct_del", { p_slack: candFor.id });
    setCBusy("");
    if (r.error) { st.setError(r.error.message); return; }
    st.setSaved("지웠습니다"); setCandFor(null); load();
  }
  async function decide(c, state) {
    if (!candFor) return;
    setCBusy("저장중"); st.setSaving(state === "맞음" ? "연결을 확정하는 중…" : "아님으로 남기는 중…");
    const r = await rpc("slack_je_set", { p_slack: candFor.id, p_je: c.je_id, p_state: state, p_note: null });
    setCBusy("");
    if (r.error) { st.setError(r.error.message); return; }
    st.setSaved(state === "맞음" ? "이 전표로 확정했습니다" : "아님으로 남겼습니다 — 다음 달에 다시 안 올라옵니다");
    const c2 = await rpc("f_slack_je_candidates", { p_slack: candFor.id, p_top: 8 });
    setCands(c2.error ? [] : safe(c2));
    load();
  }

  async function act(what, id) {
    setSaving(true); setChErr("");
    const r = (what === "on" || what === "off")
      ? await rpc("slack_channel_set", { p_channel_id: id, p_active: what === "on" })
      : await rpc(what, { p_channel_id: id });
    setSaving(false);
    if (r.error) { setChErr(r.error.message); return; }
    await load();
  }
  async function addChannel() {
    setSaving(true); setChErr("");
    const r = await rpc("slack_channel_set", { p_channel_id: newId.trim(), p_name: newName.trim() || null, p_purpose: null, p_active: true });
    setSaving(false);
    if (r.error) { setChErr(r.error.message); return; }
    setNewId(""); setNewName(""); await load();
  }
  async function rename(id) {
    if (!editName.trim()) { setEditId(null); return; }
    setSaving(true); setChErr("");
    const r = await rpc("slack_channel_set", { p_channel_id: id, p_name: editName.trim() });
    setSaving(false); setEditId(null);
    if (r.error) { setChErr(r.error.message); return; }
    await load();
  }
  async function saveFix() {
    if (!fix) return;
    setFixErr(null); setFixBusy(true);
    st.setSaving("요청 내용을 고치는 중…");
    /* ★ 아이디에 이름을 붙이는 것이 먼저입니다 —
          한 번 붙이면 **모든 요청**에서 그 사람 이름으로 보입니다 */
    const nm = String(fixName || "").trim();
    if (nm && fixId) {
      const u = await rpc("slack_user_set", { p_id: fixId, p_name: nm, p_team: null });
      if (u.error) {
        setFixBusy(false);
        setFixErr("이름을 붙이지 못했습니다 — " + u.error.message);
        st.setError("이름을 붙이지 못했습니다");
        return;
      }
      SLACK_NAME[fixId] = nm;
    }
    const r = await rpc("slack_req_set", {

  const cardCmp = useMemo(function () {
    if (!cards.length) return null;
    const used = {};

      let best = null, bs = -1;
      buyRows.forEach(function (q) {
        if (used[q.r.id] || !q.amount) return;
        if (Math.abs(q.amount - c.amt) > AMT_TOL) return;
        const dd = q.accDate ? Math.abs(new Date(c.dt) - new Date(q.accDate)) / 86400000 : 999;
        if (dd > 30) return;
        const nm = Math.max(nsim(c.shop, q.b.vendor || ""), nsim(c.shop, q.b.company || ""),

        const sc = 5 + nm * 4 - dd / 30;
        if (sc > bs) { bs = sc; best = q; }
      });
      if (best) used[best.r.id] = 1;
      return { c: c, q: best,
