<script>(function(){
 var EM='demo@demo.sample';
 var SEED=window.__SEED__||{};
 function build(t){
   var filters=[],single=null,mode='select',payload=null;var b={};

   ['neq','in','gt','gte','lt','lte','is','not','like','ilike','or','filter','contains','containedBy','overlaps','match','textSearch','rangeGt','rangeLt'].forEach(function(m){b[m]=function(){return b;};});
   b.eq=function(k,v){filters.push([k,v]);return b;};
   b.insert=function(p){mode='insert';payload=p;return b;};
   b.update=function(p){mode='update';payload=p;return b;};
   b.upsert=function(p){mode='upsert';payload=p;return b;};
   b.delete=function(){mode='delete';return b;};
   b.single=function(){single='one';return b;};
   b.maybeSingle=function(){single='maybe';return b;};
   function resolve(){
     if(t==='user_roles'){var apps=['*','ehr','hr','payroll','eval','retire','finance','index','splitter'];return {data:apps.map(function(a){return {role:'SUPER',email:EM,app:a};}),error:null};}
     if(mode!=='select'){var d=Array.isArray(payload)?payload:[payload];return {data:d,error:null};}
     var rows=(SEED[t]||[]).slice();
     filters.forEach(function(f){var k=f[0],v=f[1];rows=rows.filter(function(r){return r[k]==null?true:String(r[k])===String(v);});});
     if(single==='one')return {data:rows[0]||null,error:rows[0]?null:{message:'0 rows',code:'PGRST116'}};
     if(single==='maybe')return {data:rows[0]||null,error:null};
     return {data:rows,error:null};
   }
   b.then=function(res,rej){var r;try{r=resolve();}catch(e){r={data:null,error:{message:String(e)}};}return Promise.resolve(r).then(res,rej);};
   return b;
 }

 };

<style>
  body { font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  .inp{ width:100%;padding:.5rem .625rem;border:1px solid #cbd5e1;border-radius:.5rem;font-size:.8125rem;outline:none }
  /* 인재상 카드 주목 효과 — 아직 펼쳐보지 않은 사람에게만 은은하게 맥동 */
  @keyframes talentPulse{
    0%,100%{ border-color:#c7d2fe; box-shadow:0 0 0 0 rgba(99,102,241,0); }
    50%    { border-color:#6366f1; box-shadow:0 0 0 5px rgba(99,102,241,.18); }
  }
  .talent-attn{ animation:talentPulse 2.2s ease-in-out infinite; }
  html.dark .talent-attn{ animation-name:talentPulseDark; }
  @keyframes talentPulseDark{
    0%,100%{ border-color:#3730a3; box-shadow:0 0 0 0 rgba(129,140,248,0); }
    50%    { border-color:#818cf8; box-shadow:0 0 0 5px rgba(129,140,248,.25); }
  }
  @keyframes talentDot{ 0%,100%{ opacity:.25; transform:scale(.85); } 50%{ opacity:1; transform:scale(1); } }
  .talent-dot{ animation:talentDot 1.1s ease-in-out infinite; }
  /* 반드시 눌러야 하는 버튼(360 최종제출 · KPI 승인요청) 주목 효과 */
  @keyframes actionPulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(79,70,229,.55); }
    70%    { box-shadow:0 0 0 9px rgba(79,70,229,0); }
  }
  .action-attn{ animation:actionPulse 1.5s ease-out infinite; }
  @keyframes actionRow{
    0%,100%{ border-color:#c7d2fe; background-color:rgba(238,242,255,.55); }
    50%    { border-color:#4f46e5; background-color:rgba(224,231,255,.95); }
  }
  .action-row{ animation:actionRow 1.8s ease-in-out infinite; }
  html.dark .action-row{ animation-name:actionRowDark; }
  @keyframes actionRowDark{
    0%,100%{ border-color:#3730a3; background-color:rgba(30,27,75,.45); }
    50%    { border-color:#818cf8; background-color:rgba(49,46,129,.75); }
  }
  /* 깜빡임에 민감한 사용자는 애니메이션 비활성화 */
  @media (prefers-reduced-motion: reduce){
    .talent-attn, .talent-dot, .action-attn, .action-row{ animation:none !important; }
    .talent-attn{ border-color:#6366f1; box-shadow:0 0 0 3px rgba(99,102,241,.15); }
    .action-attn{ box-shadow:0 0 0 4px rgba(79,70,229,.25); }
    .action-row{ border-color:#4f46e5; }
  }
  .inp:focus{ border-color:#4f46e5;box-shadow:0 0 0 1px #4f46e5 }
  /* DARKMODE_INJECTED */
  html.dark body{ background:#0f172a; color:#e2e8f0; }
  html.dark input, html.dark textarea, html.dark select{ background:#1e293b; color:#e2e8f0; border-color:#334155; }
  html.dark input::placeholder, html.dark textarea::placeholder{ color:#64748b; }
  /* CLAUDE(시스템) 웜 크림 테마 */
  html.claude body{ background:#eeeae0; color:#3d3a34; }
  html.claude .bg-white{ background-color:#faf8f2 !important; }

   사용법 : await fetchAll(()=> sb.from('eval_360').select('...').eq('cycle_id',cid))
   ══════════════════════════════════════════════════════════════════ */
async function fetchAll(build, pageSize){
  const size = pageSize || 1000;
  let out = [], from = 0;
  for(let guard=0; guard<500; guard++){
    const r = await build().range(from, from + size - 1);
    if(r.error) return { data:null, error:r.error };
    const rows = r.data || [];
    out = out.concat(rows);
    if(rows.length < size) return { data:out, error:null };
    from += size;
  }
  return { data:out, error:null, truncated:true };
}

function cycleWindow(cycle, prefix, label){
  var op=true, s='', e='';
  if(cycle){ op=(cycle[prefix+'_open']!==false);
    s=cycle[prefix+'_start']?String(cycle[prefix+'_start']).slice(0,10):'';
    e=cycle[prefix+'_end']?String(cycle[prefix+'_end']).slice(0,10):''; }
  var td=todayStr();
  var within=((!s||td>=s)&&(!e||td<=e));
  var open=!!(cycle&&op&&within);
  var reason='';
  if(!cycle) reason='진행중인 평가주기가 없습니다.';
  else if(!op) reason=label+'이 닫혀 있습니다. 인사부에서 엽니다.';
  else if(s&&td<s) reason=label+' 시작 전입니다. 기간 '+s+' ~ '+(e||'미정');
  else if(e&&td>e) reason=label+'이 종료되었습니다. 기간 '+(s||'미정')+' ~ '+e;
  var dleft=null; if(e){ dleft=Math.round((Date.parse(e+'T00:00:00')-Date.parse(td+'T00:00:00'))/86400000); }
  return { open:open, reason:reason, start:s, end:e, dleft:dleft, hasRange:!!(s||e) };

        +'· 360도 평가의 [최종 제출]도 KPI 승인 요청 이후에만 가능합니다\n\n'
        +'지금 승인 요청할까요?')){ await fn(); return; }
    }
    setTab(k);
  }
  const tabs=[['home','홈'],['eval360','360도 평가'],['kpi','KPI · 면담'],['myresult','평가결과 보기']];
  if(effIsAdmin){ tabs.push(['manage','평가 관리']); }

  return (
    <div className="min-h-screen">
      {notice && <div className="fixed bottom-8 left-1/2 -translate-x-1/2 z-[120] bg-emerald-600 text-white text-base font-bold px-7 py-4 rounded-2xl shadow-2xl border border-emerald-400 flex items-center gap-2"><span>✅</span>{notice}</div>}
      {modal && <div className="fixed inset-0 z-[300] bg-black/50 flex items-center justify-center p-4" onClick={()=>{ if(modal.kind==='alert'){ var f=modal.on; setModal(null); f&&f(true); } }}>
        <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl max-w-sm w-full p-6" onClick={function(e){e.stopPropagation();}}>
          <div className="text-sm text-slate-800 dark:text-slate-100 whitespace-pre-wrap leading-relaxed mb-4">{modal.msg}</div>
          {modal.kind==='prompt' && <textarea autoFocus value={modalTxt} onChange={e=>setModalTxt(e.target.value)} rows="3" placeholder={modal.ph||''} className="w-full text-sm border border-slate-200 dark:border-slate-700 rounded-lg p-2.5 mb-4 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-200 outline-none focus:border-indigo-400 resize-y" />}
          <div className="flex justify-end gap-2">
            {(modal.kind==='confirm'||modal.kind==='prompt') && <button onClick={()=>{ var f=modal.on; setModal(null); setModalTxt(''); f&&f(modal.kind==='prompt'?null:false); }} className="px-4 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700">취소</button>}
            <button onClick={()=>{ var f=modal.on; var t=modalTxt; setModal(null); setModalTxt(''); f&&f(modal.kind==='prompt'?t:true); }} className="px-5 py-2 text-sm rounded-lg bg-indigo-600 text-white font-bold hover:bg-indigo-700 shadow">확인</button>
          </div>
        </div>
      </div>}
      <header className="sticky top-0 z-30 bg-white/90 dark:bg-slate-900/90 backdrop-blur border-b border-slate-200 dark:border-slate-700">
        <div className="max-w-[1200px] mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4 flex-wrap">
          <div className="flex items-center gap-3">
            <a href="index.html" className="w-9 h-9 rounded-lg bg-gradient-to-br from-indigo-600 to-purple-600 flex items-center justify-center" title="포털로">
              <Icon path="M12 15a7 7 0 100-14 7 7 0 000 14zM8.21 13.89L7 23l5-3 5 3-1.21-9.12" className="w-5 h-5 text-white" />
            </a>
            <div>
              <h1 className="font-bold text-slate-900 dark:text-slate-100">인사평가 시스템</h1>
              <p className="text-xs text-slate-500 dark:text-slate-400">KPI + 360도 역량평가 {isAdmin?'· 관리자':'· '+((me&&me.name)||session.user.email)} <span className="ml-1 text-[10px] px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400 font-mono" title="배포된 파일 버전">{APP_VERSION}</span></p>
            </div>
            {(function(){ var ac=cycles.find(function(c){return c.status==='IN_PROGRESS';}); if(!ac) return null; var dl=ac.end_date?String(ac.end_date).slice(0,10):''; var dd=null; if(dl){ dd=Math.ceil((new Date(dl+'T23:59:59')-new Date())/86400000); } var urgent=(dd!=null&&dd<=3); return (
              <span className="inline-flex items-center gap-1.5 text-xs border border-slate-300 dark:border-slate-600 rounded-full px-2.5 py-1 animate-pulse">
                <span className={"w-1.5 h-1.5 rounded-full "+(urgent?"bg-rose-500":"bg-emerald-500")}></span>
                <span className={"font-semibold whitespace-nowrap "+(urgent?"text-rose-600 dark:text-rose-400":"text-slate-600 dark:text-slate-300")}>평가 진행중 · {ac.name}{dl?" · 마감 "+dl+(dd!=null?(dd>0?" D-"+dd:(dd===0?" 오늘!":" 지남")):""):""}</span>
              </span>
            ); })()}
          </div>
          <div className="flex items-center gap-2">
            {busy && <span className="text-xs text-indigo-600">저장 중…</span>}
            {isAdmin && <select value={viewAs} onChange={e=>setViewAs(e.target.value)} title="보기 전환(개발용)" className="text-xs border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1.5 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300"><option value="admin">관리자 보기</option><option value="leader">팀장 보기</option><option value="staff">직원 보기</option></select>}
            <ThemeToggle />
            <a href="index.html" className="text-xs font-bold px-3.5 py-2 rounded-lg bg-rose-600 text-white border border-rose-700 shadow-md hover:bg-rose-700 transition">DEMO 인사시스템</a>
            {effIsAdmin && <a href="demo-hr.html" className="text-xs font-bold px-3.5 py-2 rounded-lg bg-slate-700 text-white border border-slate-800 shadow-md hover:bg-slate-800 transition">e-HR</a>}
            {effIsAdmin && <a href="demo-payroll.html" className="text-xs font-bold px-3.5 py-2 rounded-lg bg-emerald-600 text-white border border-emerald-700 shadow-md hover:bg-emerald-700 transition">급여자동화</a>}
            <button onClick={()=>sb.auth.signOut().then(()=>window.location.href='index.html')} className="text-sm text-slate-600 dark:text-slate-300 hover:text-slate-900 px-3 py-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">로그아웃</button>
          </div>
        </div>
        <div className="max-w-[1200px] mx-auto px-4 sm:px-6 flex gap-2 pt-1 pb-3">
          {tabs.map(([k,label])=>{ const on=tab===k;
            return <button key={k} onClick={()=>goTab(k)} className={"relative px-4 py-2.5 text-sm rounded-lg border transition "+(on?"bg-indigo-600 border-indigo-600 text-white font-bold shadow-md":"bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 font-medium hover:bg-slate-50 dark:hover:bg-slate-700/40 hover:text-slate-900")}>{label}{k==='kpi'&&pendingN>0&&<span className="absolute -top-1.5 -right-1.5 min-w-[18px] h-[18px] px-1 rounded-full bg-rose-500 text-white text-[10px] font-bold flex items-center justify-center">{pendingN}</span>}{k==='manage'&&unlockN>0&&<span className="absolute -top-1.5 -right-1.5 min-w-[18px] h-[18px] px-1 rounded-full bg-indigo-500 text-white text-[10px] font-bold flex items-center justify-center">{unlockN}</span>}</button>;
          })}
        </div>
      </header>

      <main className="max-w-[1200px] mx-auto px-4 sm:px-6 py-6">
        {err && <div className="mb-4 text-sm text-red-600 bg-red-50 dark:bg-red-950 border border-red-200 rounded-lg px-4 py-3">오류: {err}</div>}
        {tab==='home' && <HomeTab me={me} isAdmin={effIsAdmin} cycles={cycles} comps={comps} cfg={cfg} emps={emps} setTab={setTab} openComp={()=>setShowComp(true)} pendingN={pendingN} />}
        {tab==='manage' && effIsAdmin && <ManageTab cycles={cycles} emps={emps} comps={comps} cfg={cfg} grades={grades} reload={()=>loadAll(session.user.email)} setBusy={setBusy} flash={flash} setErr={setErr} email={session.user.email} />}
        {tab==='eval360' && <Eval360Tab me={me} emps={emps} comps={comps} cfg={cfg} cycles={cycles} setBusy={setBusy} flash={flash} setErr={setErr} openComp={()=>setShowComp(true)} viewAs={viewAs} isAdmin={effIsAdmin} />}
        {tab==='myresult' && <MyResultTab me={me} cycles={cycles} grades={grades} cfg={cfg} setErr={setErr} emps={emps} comps={comps} flash={flash} setBusy={setBusy} isAdmin={effIsAdmin} />}
        {tab==='kpi' && <KpiHubTab me={me} emps={emps} cycles={cycles} cfg={cfg} isAdmin={effIsAdmin} setBusy={setBusy} flash={flash} setErr={setErr} comps={comps} grades={grades} pendingN={pendingN} unlockN={unlockN} />}
        {showComp && <div className="fixed inset-0 bg-black/50 z-50 flex items-start justify-center p-4 overflow-y-auto" onClick={()=>setShowComp(false)}>
          <div className="bg-white dark:bg-slate-800 rounded-2xl max-w-4xl w-full my-8 shadow-2xl" onClick={e=>e.stopPropagation()}>
            <div className="flex justify-between items-center px-5 py-3 border-b border-slate-100 dark:border-slate-700 sticky top-0 bg-white dark:bg-slate-800 rounded-t-2xl z-10">
              <h3 className="font-bold text-slate-800 dark:text-slate-100">역량 모델</h3>
              <button onClick={()=>setShowComp(false)} className="text-slate-400 hover:text-slate-600 text-2xl leading-none">×</button>
            </div>
            <div className="p-5"><CompModelTab comps={comps} cfg={cfg} grades={grades} /></div>
          </div>
        </div>}
      </main>
    </div>
  );
}

function Stub({ title, desc, badge, tone }){
  return (
    <div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-10 text-center">
      <div className={"w-12 h-12 mx-auto mb-3 rounded-xl flex items-center justify-center "+(tone==='done'?"bg-emerald-50 dark:bg-emerald-950":"bg-indigo-50 dark:bg-indigo-950")}>
        {tone==='done'
          ? <Icon path="M5 13l4 4L19 7" className="w-6 h-6 text-emerald-500" />
          : <Icon path="M12 8v4l3 3M12 3a9 9 0 100 18 9 9 0 000-18z" className="w-6 h-6 text-indigo-400" />}
      </div>
      <div className="font-bold text-slate-800 dark:text-slate-100">{title}</div>
      <p className="text-sm text-slate-500 dark:text-slate-400 mt-1 max-w-md mx-auto whitespace-pre-line leading-relaxed">{desc}</p>
      <span className={"inline-block mt-3 text-xs px-3 py-1 rounded-full "+(tone==='done'
        ?"bg-emerald-100 dark:bg-emerald-900 text-emerald-700 dark:text-emerald-300 font-semibold"
        :"bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400")}>{badge||'준비중'}</span>
    </div>
  );
}

function HomeTab({ me, isAdmin, cycles, comps, cfg, emps, setTab, openComp, pendingN }){
  const cycle=cycles.find(c=>c.status==='IN_PROGRESS')||cycles[0];
  const [data,setData]=useState(null);
  const [adminStats,setAdminStats]=useState(null);
  const empById=useMemo(()=>Object.fromEntries(emps.map(e=>[e.id,e])),[emps]);
  const active=useMemo(()=>emps.filter(e=>e.status!=='퇴사'),[emps]);
  const commonCnt=comps.filter(c=>c.track==='COMMON').length;

  useEffect(()=>{ (async()=>{
    if(!cycle||!me){ setData({ empty:true }); return; }
    const cid=cycle.cycle_id;
    const [tg,r360,kp,ks,fb,rs,sub,nc]=await Promise.all([
      sb.from('eval_targets').select('*').eq('cycle_id',cid),
      sb.from('eval_360').select('*').eq('cycle_id',cid).eq('rater_id',me.id),
      sb.from('eval_kpi').select('id,category,evidence').eq('cycle_id',cid).eq('employee_id',me.id),
      sb.from('eval_kpi_status').select('*').eq('cycle_id',cid).eq('employee_id',me.id).maybeSingle(),
      sb.from('eval_feedback').select('period').eq('cycle_id',cid).eq('employee_id',me.id),
      sb.from('eval_results').select('*').eq('cycle_id',cid).eq('employee_id',me.id).maybeSingle(),
      sb.from('eval_360_submissions').select('id').eq('cycle_id',cid).eq('rater_id',me.id).maybeSingle(),
      sb.from('eval_360_comments').select('ratee_id,rater_type,strength,improve,other_note').eq('cycle_id',cid).eq('rater_id',me.id)
    ]);
    const targets=tg.data||[]; const exCEO=String(cfg.exclude_ceo)!=='false'; const targetIds=new Set(targets.filter(t=>t.eval_type!=='EXCLUDED').filter(t=>!(exCEO&&isCEO(empById[t.employee_id]))).map(t=>t.employee_id));
    const tasks=[];
    if(selfEvalOn(cfg) && targetIds.has(me.id)) tasks.push({ r:me, type:'self' });
    const _mf=empById[me.id]||me; const mgr=empById[_mf.manager_id]; if(mgr&&mgr.status!=='퇴사'&&targetIds.has(mgr.id)) tasks.push({ r:mgr, type:'subordinate' });
    targets.forEach(t=>{ if(t.eval_type==='EXCLUDED') return; const rt=empById[t.employee_id]; if(!rt||rt.id===me.id||rt.status==='퇴사') return; const manual=Array.isArray(t.peer_rater_ids)&&t.peer_rater_ids.indexOf(me.id)>=0; if(manual||isAutoPeer(me,rt)) tasks.push({ r:rt, type:'peer' }); });
    active.filter(e=>e.manager_id===me.id&&targetIds.has(e.id)).forEach(e=>tasks.push({ r:e, type:'manager' }));
    const appc=(ratee,type)=>compsForRating(ratee, type||'self', me, comps, cfg);
    let tot=0,don=0; const my360=r360.data||[];
    tasks.forEach(t=>{ const ac=appc(t.r, t.type); tot+=ac.length; const set=new Set(my360.filter(x=>x.ratee_id===t.r.id&&x.rater_type===t.type&&x.score!=null).map(x=>x.comp_id)); don+=ac.filter(c=>set.has(c.comp_id)).length; });
    // 서술평가 미작성 건수 (본인평가 제외 · 설정에서 사용 중일 때만)
    const narrOnH=String(cfg.narr_enabled||'true')!=='false';
    const narrReqH=narrOnH && String(cfg.narr_required||'true')!=='false';
    const narrRows=(nc&&nc.data)?nc.data:[];
    const hasNarr=function(rid,ty){
      const v=narrRows.find(function(x){ return x.ratee_id===rid && x.rater_type===ty; });
      return !!(v && (String(v.strength||'').trim()||String(v.improve||'').trim()||String(v.other_note||'').trim()));
    };
    let nMiss=0;
    if(narrOnH) tasks.forEach(function(t){ if(t.type!=='self' && !hasNarr(t.r.id,t.type)) nMiss++; });
    // KPI 실적근거 진행 (계획외 제외)
    const kRows=(kp.data||[]);
    const kNeed=kRows.filter(function(x){ return String(x.category||'')!=='계획외'; });
    const eviDone=kNeed.filter(function(x){ return String(x.evidence||'').trim()!==''; }).length;
    // 나를 평가할 사람 수 (인원수만 — 이름은 공개하지 않음)
    const myT=targets.find(function(t){ return t.employee_id===me.id; });
    const raterSet={};
    if(myT){
      (myT.peer_rater_ids||[]).forEach(function(id){ if(empById[id]&&empById[id].status!=='퇴사') raterSet[id]=1; });
      const mfx=empById[me.id]||me;
      if(mfx.manager_id&&empById[mfx.manager_id]&&targetIds.has(mfx.manager_id)) raterSet[mfx.manager_id]=1;
      active.forEach(function(e){ if(e.id!==me.id && isAutoPeer(e,mfx) && targetIds.has(e.id)) raterSet[e.id]=1; });
      active.forEach(function(e){ if(e.manager_id===me.id && targetIds.has(e.id)) raterSet[e.id]=1; });
    }
    // ── 본인에게 업적평가(KPI)가 실제로 필요한지 판정 ──
    //   회차에서 KPI를 쓰더라도, 본인이 ①평가 대상자로 지정되지 않았거나 ②평가 제외(EXCLUDED)이거나
    //   ③대표이사 제외 설정에 걸리거나 ④직급 비중상 업적 0% 이면 KPI 작성 의무가 없다.
    const _myEt=myT?myT.eval_type:null;
    const _exSelf=!!(exCEO && isCEO(_mf));
    const _kpiReq=kpiRequiredFor(_mf, myT, cfg);
    setData({ kpiCount:kRows.length, eviTotal:kNeed.length, eviDone:eviDone,
      kpiRequired:_kpiReq, notTarget:(!myT||_myEt==='EXCLUDED'||_exSelf), myEvalType:_myEt,
      myRaters:Object.keys(raterSet).length,
      kpiStatus: (ks&&ks.data)?ks.data.status:'NONE',
      total360:tot, done360:don, taskCount:tasks.length,
      submitted360: !!(sub&&sub.data), narrMissing:nMiss, narrRequired:narrReqH, narrOn:narrOnH,
      feedbackCount:(fb.data||[]).length, result:(rs&&rs.data)?rs.data:null });
  })(); },[cycle&&cycle.cycle_id, me&&me.id]);

  useEffect(()=>{ (async()=>{
    if(!isAdmin||!cycle){ return; }
    const cid=cycle.cycle_id;
    const [tg,ks,r360,rs]=await Promise.all([
      sb.from('eval_targets').select('employee_id,eval_type').eq('cycle_id',cid),
      sb.from('eval_kpi_status').select('employee_id,status').eq('cycle_id',cid),
      fetchAll(()=>sb.from('eval_360').select('rater_id').eq('cycle_id',cid)),
      sb.from('eval_results').select('employee_id').eq('cycle_id',cid)
    ]);
    const tgs=(tg.data||[]).filter(t=>t.eval_type!=='EXCLUDED' && empById[t.employee_id] && empById[t.employee_id].status!=='퇴사'); const N=tgs.length;
    const stMap={}; (ks.data||[]).forEach(x=>stMap[x.employee_id]=x.status);
    let approved=0,submitted=0,rejected=0;
    tgs.forEach(t=>{ const st=stMap[t.employee_id]; if(st==='APPROVED')approved++; else if(st==='SUBMITTED')submitted++; else if(st==='REJECTED')rejected++; });
    setAdminStats({ N, approved, submitted, rejected, notSubmitted:N-approved-submitted, raters:new Set((r360.data||[]).map(x=>x.rater_id)).size, results:(rs.data||[]).length, activeCount:active.length });
  })(); },[isAdmin, cycle&&cycle.cycle_id]);

  const tier = me ? tierRatio(me,'REGULAR',cfg) : { key:'-', ratio:[60,40] };
  const KS_LABEL={ NONE:['미작성','bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300'], DRAFT:['작성중','bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300'], SUBMITTED:['승인 대기','bg-amber-100 dark:bg-amber-950 text-amber-700 dark:text-amber-300'], APPROVED:['승인 완료','bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300'], REJECTED:['보완 요청','bg-rose-100 dark:bg-rose-950 text-rose-700 dark:text-rose-300'] };

  const d=data&&!data.empty?data:null;
  const kpiSt=d?d.kpiStatus:'NONE';
  const kpiOn=(cfg.kpi_enabled!=='false');                 // 회차 설정 (전사 공통)
  const kpiMine=d?!!d.kpiRequired:kpiOn;                    // 나에게 업적평가 의무가 있는지
  const notTarget=!!(d&&d.notTarget);                       // 나는 이번 회차 평가 대상자가 아님(평가자 역할만)
  // 마감 D-day (진행중 회차 종료일 기준)
  const dday=(function(){
    if(!cycle||!cycle.end_date) return null;
    const dl=String(cycle.end_date).slice(0,10);
    const n=Math.ceil((new Date(dl+'T23:59:59')-new Date())/86400000);
    return isNaN(n)?null:n;
  })();
  // 내가 직접 하는 일만 순서로. 팀장이 기록하는 면담 등은 아래 "내 목표와 기록"으로 분리.
  const steps=(function(){
    const arr=[];
    if(kpiMine){
      arr.push({ key:'kpi', label:'KPI 승인', tab:'kpi',
        done:(kpiSt==='APPROVED'), warn:(kpiSt==='REJECTED'),
        badge:(KS_LABEL[kpiSt]||KS_LABEL.NONE)[0],
        title:'KPI 업무목표 작성 · 승인 요청',
        desc:'업무목표와 S~D 등급기준을 작성하고 승인을 받습니다. 배점 합계는 100점이어야 합니다.' });
      arr.push({ key:'evi', label:'실적근거', tab:'kpi',
        done:!!(d&&d.eviTotal>0&&d.eviDone>=d.eviTotal),
        badge:d?(d.eviDone+'/'+d.eviTotal):'0/0',
        title:'KPI 실적 근거 작성',
        desc:'항목별 실적을 수치로 채웁니다. 승인자가 이 내용을 보고 등급을 매깁니다.' });
    }
    arr.push({ key:'score', label:'점수 입력', tab:'eval360',
      done:!!(d&&d.total360>0&&d.done360>=d.total360),
      badge:d?(d.done360+'/'+d.total360):'0/0',
      title:'360도 평가 점수 입력',
      desc:'내조직 · 타조직 동료와 상사 · 부하의 역량을 채점합니다.' });
    if(!d || d.narrOn) arr.push({ key:'narr', label:'서술평가', tab:'eval360',
      done:!(d&&d.narrRequired&&d.narrMissing>0),
      badge:(d&&d.narrMissing>0)?(d.narrMissing+'명 남음'):'작성 완료',
      title:'서술평가 작성',
      desc:'강점 · 보완점 · 기타의견을 적습니다. 피평가자에게는 공개되지 않습니다.' });
    arr.push({ key:'submit', label:'최종 제출', tab:'eval360',
      done:!!(d&&d.submitted360),
      badge:(d&&d.submitted360)?'제출 완료':'미제출',
      title:'360도 평가 최종 제출',
      desc:'제출하지 않으면 결과에 반영되지 않습니다. 제출 후에도 [제출 취소]로 수정할 수 있습니다.' });

    return arr;
  })();
  const curStep=steps.filter(function(x){ return !x.passive; }).find(function(x){ return !x.done; })||null;
  const allDone=!curStep;

  async function finalCheck(){
    const missing=[];
    if(kpiMine && kpiSt!=='APPROVED' && kpiSt!=='SUBMITTED')
      missing.push({ label:'KPI 작성 · 승인 요청  (현재: '+((KS_LABEL[kpiSt]||KS_LABEL.NONE)[0])+')', tab:'kpi' });

      missing.push({ label:'360도 평가 점수 입력  ('+d.done360+'/'+d.total360+' 항목)', tab:'eval360' });
    if(d && d.narrOn && d.narrRequired && d.narrMissing>0)
      missing.push({ label:'서술평가 작성  ('+d.narrMissing+'명 미작성)', tab:'eval360' });
    // 최종 제출을 하지 않으면 결과에 반영되지 않음 — 가장 놓치기 쉬운 단계
    if(d && d.taskCount>0 && !d.submitted360)
      missing.push({ label:'360도 평가 [최종 제출]  ← 제출하지 않으면 결과에 반영되지 않습니다', tab:'eval360' });
    if(missing.length){
      await uiAlert('아직 완료하지 않은 항목이 '+missing.length+'건 있습니다:\n\n'
        +missing.map(function(m,i){ return (i+1)+'. '+m.label; }).join('\n')
        +'\n\n[확인]을 누르면 첫 번째 미완료 화면으로 이동합니다.');
      setTab(missing[0].tab);
      return;
    }
    // 여기까지 오면 미완료가 없다 — 위 초록 카드에 이미 같은 안내가 있으므로
    // 중복 알림 대신 결과 화면으로 바로 보낸다.
    setTab('myresult');
  }

  const Stat=({label,val,color})=> <div className="bg-slate-50 dark:bg-slate-900 rounded-xl p-3"><div className="text-xs text-slate-400 dark:text-slate-500">{label}</div><div className={"font-bold text-lg mt-0.5 "+(color||'text-slate-800 dark:text-slate-100')}>{val}</div></div>;

        {(isAdmin||pendingN>0) && <div>

          <div className="space-y-2">
            {pendingN>0 && <button onClick={()=>setTab('kpi')} className="w-full bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-900 rounded-xl px-3.5 py-2.5 text-left hover:shadow-md transition">
              <div className="text-[12.5px] font-bold text-rose-700 dark:text-rose-300">내 승인 대기 {pendingN}건</div>
              <div className="text-[11px] text-rose-500 dark:text-rose-400 mt-0.5">검토하러 가기 →</div>
            </button>}
            {isAdmin && adminStats && <div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3.5 py-3">
              <div className="flex items-baseline justify-between">
                <span className="text-[11.5px] text-slate-500 dark:text-slate-400">전사 360 참여</span>
                <span className="text-[11px] text-slate-400 dark:text-slate-500">{adminStats.raters} / {adminStats.activeCount}명</span>
              </div>
              <div className="h-1.5 rounded-full bg-slate-200 dark:bg-slate-700 mt-1.5 overflow-hidden">
                <div className="h-full bg-indigo-500" style={{width:(adminStats.activeCount?Math.round(adminStats.raters/adminStats.activeCount*100):0)+'%'}}></div>
              </div>
              <div className="grid grid-cols-3 gap-2 mt-2.5 text-center">
                <div><div className="text-[10px] text-slate-400 dark:text-slate-500">KPI 승인</div><div className="text-sm font-bold text-emerald-600 dark:text-emerald-400">{adminStats.approved}/{adminStats.N}</div></div>
                <div><div className="text-[10px] text-slate-400 dark:text-slate-500">승인 대기</div><div className="text-sm font-bold text-amber-600 dark:text-amber-400">{adminStats.submitted}</div></div>
                <div><div className="text-[10px] text-slate-400 dark:text-slate-500">결과 산정</div><div className="text-sm font-bold text-slate-600 dark:text-slate-300">{adminStats.results}</div></div>
              </div>
              <button onClick={()=>setTab('manage')} className="w-full mt-2.5 py-1.5 text-[11.5px] rounded-lg border border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700/40">평가 관리로 →</button>
            </div>}
          </div>
        </div>}
      </div>

      </React.Fragment>}

      {showOv && (
        <div className="fixed inset-0 bg-black/50 z-[200] flex items-start justify-center p-3 overflow-y-auto" onClick={()=>setShowOv(false)}>
          <div className="bg-white dark:bg-slate-800 rounded-2xl w-full max-w-2xl my-4 shadow-2xl" onClick={ev=>ev.stopPropagation()}>
            <div className="px-5 py-3.5 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
              <h3 className="font-bold text-slate-800 dark:text-slate-100">평가 개요 <span className="text-xs font-normal text-slate-400 dark:text-slate-500">— 점수가 어떻게 매겨지나</span></h3>
              <button onClick={()=>setShowOv(false)} className="text-slate-400 hover:text-slate-700 text-xl leading-none px-1">×</button>

            <div className="px-5 py-4 space-y-4">
              <div className="flex flex-col items-center gap-2">
                {kpiMine ? (
                  <div className="flex items-stretch gap-3 flex-wrap justify-center">
                    <Box title="역량평가 (360도)" sub={"공통 "+(cfg.comp_common_max||80)+" + 직무 "+(cfg.comp_job_max||20)} color="bg-indigo-50 dark:bg-indigo-950 border-indigo-200 dark:border-indigo-900 text-indigo-700 dark:text-indigo-300" />

                    <Box title="성과평가 (KPI)" sub="배점 × 등급 배율" color="bg-emerald-50 dark:bg-emerald-950 border-emerald-200 dark:border-emerald-900 text-emerald-700 dark:text-emerald-300" />
                  </div>
                ) : (
                  <Box title="역량평가 (360도)" sub={"공통 "+(cfg.comp_common_max||80)+" + 직무 "+(cfg.comp_job_max||20)+" · 이번 회차는 역량만"} color="bg-indigo-50 dark:bg-indigo-950 border-indigo-200 dark:border-indigo-900 text-indigo-700 dark:text-indigo-300" />

// 택1 트랙의 배점 표기: 항목들이 같은 배점이면 "N점", 다르면 "N~M점" (실제 설정값 기준)
function trackPtLabel(list){
  var ws=(list||[]).map(function(c){ return Number(c.weight)||0; }).filter(function(n){ return n>0; });
  if(!ws.length) return '0점';
  var mn=Math.min.apply(null,ws), mx=Math.max.apply(null,ws);
  return mn===mx ? (mn+'점') : (mn+'~'+mx+'점');
}

function GradesEditor({ grades, reload, setBusy, flash, setErr }){
  const [rows,setRows]=useState(()=>(grades||[]).map(g=>({grade:g.grade,min_score:g.min_score,max_score:g.max_score,raise_rate:g.raise_rate})));
  const set=(i,k,v)=>setRows(rs=>rs.map((r,j)=>j===i?Object.assign({},r,{[k]:v}):r));
  const add=()=>setRows(rs=>rs.concat([{grade:'',min_score:0,max_score:0,raise_rate:0}]));
  const del=(i)=>setRows(rs=>rs.filter((_,j)=>j!==i));
  async function save(){
    const clean=rows.filter(r=>String(r.grade).trim());
    if(!clean.length){ setErr('등급을 1개 이상 입력하세요'); return; }
    // 등급표 점검 (2026-08-05)
    //  판정은 최소점수만 쓰므로 빈틈·겹침은 생기지 않는다.
    //  대신 「최소점수 중복」과 「0 부터 시작하지 않음」만 막으면 된다.
    const iss=gradeBandIssues(clean.map(r=>({grade:String(r.grade).trim(),
      min_score:Number(r.min_score)||0, max_score:Number(r.max_score)||0,
      raise_rate:Number(r.raise_rate)||0 })));
    if(iss.dupMin.length || iss.notFromZero){
      const msg='⚠ 등급표를 확인하세요.\n\n'
        +(iss.dupMin.length?('■ 최소점수가 같은 등급이 있습니다\n'
            +iss.dupMin.map(d=>'  · '+d.min+'점 : '+d.grades.join(' / ')).join('\n')
            +'\n  → 같은 점수에 두 등급이 걸려 어느 쪽인지 정할 수 없습니다.\n\n'):'')
        +(iss.notFromZero?('■ 가장 낮은 등급('+iss.notFromZero.grade+')의 최소점수가 '
            +iss.notFromZero.min+'점입니다\n'
            +'  → '+iss.notFromZero.min+'점 미만을 받은 사람은 판정할 수 없습니다.\n'
            +'  → 가장 낮은 등급의 최소점수는 0 으로 두세요.\n\n'):'')
        +'■ 판정 규칙\n'
        +'  「종합점수 ≥ 최소점수」인 등급 중 가장 높은 등급이 됩니다.\n'
        +'  최대점수는 자동 계산되며 판정에 쓰지 않습니다.\n\n'
        +'■ 권장 설정\n'
        +iss.bands.map(b=>'  · '+b.grade+' : '+b.label).join('\n')
        +'\n\n그래도 이대로 저장할까요?';
      const ok=await uiConfirm(msg);
      if(!ok) return;
    }
    setBusy(true);
    const keep=clean.map(r=>String(r.grade).trim());
    const toDel=(grades||[]).map(g=>g.grade).filter(g=>keep.indexOf(g)<0);
    let err=null;
    if(toDel.length){ const d=await sb.from('eval_grades').delete().in('grade',toDel); if(d.error) err=d.error; }
    // max_score 는 판정에 쓰지 않는다. 바로 위 등급의 최소점수(=미만 경계)를 자동으로 넣어
    // DB 를 직접 보는 사람도 구간을 알 수 있게 한다. 최고 등급은 100.
    const _bands=gradeBands(clean);
    const _maxOf=g=>{ const b=_bands.find(x=>x.grade===String(g).trim()); return b?b.autoMax:100; };
    if(!err){ const u=await sb.from('eval_grades').upsert(clean.map(r=>({grade:String(r.grade).trim(),min_score:Number(r.min_score)||0,max_score:_maxOf(r.grade),raise_rate:Number(r.raise_rate)||0})),{onConflict:'grade'}); if(u.error) err=u.error; }
    setBusy(false);
    if(err){ setErr(err.message); return; }
    flash('등급표가 저장되었습니다'); reload();
  }
  const inp="w-full text-sm border border-slate-200 dark:border-slate-700 rounded px-2 py-1.5 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 outline-none focus:border-indigo-400";
  return (
    <div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-5">

      <div className="text-xs text-slate-500 dark:text-slate-400 mt-1 leading-relaxed">
        <b className="text-slate-700 dark:text-slate-200">판정 규칙 — 「종합점수 ≥ 최소점수」인 등급 중 가장 높은 등급이 됩니다.</b><br />
        <b>최소점수만 입력</b>하시면 판정 구간은 자동으로 계산됩니다. 최대점수를 직접 넣지 않으므로
        <b> 구간 사이에 빈틈이 생기거나 경계값이 겹칠 일이 없습니다.</b>

        <b>가장 낮은 등급의 최소점수는 0</b> 으로 두세요. 종합점수는 소수 1자리로 반올림해 판정합니다.
        S~D 5단계, 또는 3단계(기대이상/충족/미달)로 단순화할 수 있습니다.
      </div>
      <div className="mt-3 space-y-2">

    let err=null;

      </div>
    </div>
  );

function ManageTab({ cycles, emps, comps, cfg, grades, reload, setBusy, flash, setErr, email }){

  // 상단 헤더 높이 + 평가관리 서브탭 높이를 CSS 변수로 측정 → 하위 sticky 요소가 겹치지 않게 한다
  useEffect(function(){
    function upd(){
      var h=document.querySelector('header');
      if(h) document.documentElement.style.setProperty('--eval-hdr-h', h.offsetHeight+'px');
      var sb=document.getElementById('mgSubNav');
      if(sb) document.documentElement.style.setProperty('--eval-sub-h', sb.offsetHeight+'px');
    }
    upd(); var t1=setTimeout(upd,150), t2=setTimeout(upd,500);
    window.addEventListener('resize',upd);
    return function(){ window.removeEventListener('resize',upd); clearTimeout(t1); clearTimeout(t2); };
  },[sub]);
  const pill=on=>"px-4 py-2 text-sm rounded-lg border transition "+(on?"bg-indigo-600 border-indigo-600 text-white font-bold":"bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700/40");
  const mgCid=(cycles.find(c=>c.status==='IN_PROGRESS')||cycles[0]||{}).cycle_id||'';
  const mgEmpById=useMemo(()=>Object.fromEntries((emps||[]).map(e=>[e.id,e])),[emps]);
  return (
    <div>
      <UnlockReqPanel cid={mgCid} empById={mgEmpById} setBusy={setBusy} flash={flash} setErr={setErr} />
      <div id="mgSubNav" className="flex gap-2 mb-4 flex-wrap sticky z-20 bg-white dark:bg-slate-900 py-2" style={{top:'var(--eval-hdr-h,116px)'}}>
        <button onClick={()=>setSub('status')} className={pill(sub==='status')}>진행 현황</button>
        <button onClick={()=>setSub('cycles')} className={pill(sub==='cycles')}>평가주기</button>
        <button onClick={()=>setSub('targets')} className={pill(sub==='targets')}>대상자 지정</button>
        <button onClick={()=>setSub('results')} className={pill(sub==='results')}>결과 산정</button>
        {false /* 이메일 발송 보류: 도메인 DNS 인증 또는 공용계정 확정 후 true 로 바꿔 재활성화 */ && <button onClick={()=>setSub('email')} className={pill(sub==='email')}>이메일 안내</button>}
        <button onClick={()=>setSub('comps')} className={pill(sub==='comps')}>역량모델</button>
        <button onClick={()=>setSub('settings')} className={pill(sub==='settings')}>평가 설정</button>
      </div>
      {sub==='status' && <StatusSection cycles={cycles} emps={emps} cfg={cfg} comps={comps} setBusy={setBusy} flash={flash} setErr={setErr} />}
      {sub==='cycles' && <div>
        <div className="flex items-center justify-between mb-3">
          <h2 className="font-semibold text-slate-800 dark:text-slate-100">평가주기 <span className="text-slate-400 dark:text-slate-500 font-normal">({cycles.length})</span></h2>
          <button onClick={()=>setShowNew(true)} className="text-sm px-3 py-1.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">+ 평가주기 생성</button>
        </div>
        <div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl overflow-hidden">
          <table className="w-full text-sm">
            <thead className="bg-slate-50 dark:bg-slate-900 text-slate-500 dark:text-slate-400 text-xs"><tr>
              <th className="text-left px-4 py-2.5">주기 ID</th><th className="text-left px-4 py-2.5">이름</th><th className="text-left px-4 py-2.5">기간</th><th className="text-left px-4 py-2.5">상태</th><th className="px-4 py-2.5"></th>
            </tr></thead>
            <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
              {cycles.length===0 && <tr><td colSpan="5" className="px-4 py-8 text-center text-slate-300 dark:text-slate-600">평가주기가 없습니다. 생성해 주세요.</td></tr>}
              {cycles.map(c=>{ const st=CYCLE_STATUS[c.status]||['?','bg-slate-100 dark:bg-slate-700'];
                return <tr key={c.cycle_id} className="hover:bg-slate-50 dark:hover:bg-slate-700/40">
                  <td className="px-4 py-2.5 font-mono text-xs text-slate-600 dark:text-slate-300">{c.cycle_id}</td>
                  <td className="px-4 py-2.5 font-medium text-slate-800 dark:text-slate-100">{c.name}</td>
                  <td className="px-4 py-2.5 text-slate-500 dark:text-slate-400">{fmtDate(c.start_date)} ~ {fmtDate(c.end_date)}</td>
                  <td className="px-4 py-2.5"><span className={"text-xs font-bold px-2.5 py-1 rounded-full whitespace-nowrap "+st[1]}>{st[0]}</span></td>
                  <td className="px-4 py-2.5 text-right"><button onClick={()=>setEditCycle(c)} className="text-xs text-indigo-600 hover:text-indigo-800">수정</button></td>
                </tr>;
              })}
            </tbody>
          </table>
        </div>
        {showNew && <CycleModal cycles={cycles} reload={reload} setBusy={setBusy} flash={flash} setErr={setErr} email={email} onClose={()=>setShowNew(false)} />}
        {editCycle && <CycleModal cycle={editCycle} cycles={cycles} reload={reload} setBusy={setBusy} flash={flash} setErr={setErr} email={email} onClose={()=>setEditCycle(null)} />}
      </div>}
      {sub==='targets' && <TargetsSection cycles={cycles} emps={emps} cfg={cfg} comps={comps} email={email} setBusy={setBusy} flash={flash} setErr={setErr} />}
      {sub==='results' && <ResultsSection cycles={cycles} emps={emps} comps={comps} cfg={cfg} grades={grades} reload={reload} setBusy={setBusy} flash={flash} setErr={setErr} email={email} />}
      {sub==='email' && <EmailPanel cycles={cycles} emps={emps} cfg={cfg} setBusy={setBusy} flash={flash} setErr={setErr} />}
      {sub==='comps' && <CompEditor comps={comps} reload={reload} setBusy={setBusy} flash={flash} setErr={setErr} />}
      {sub==='settings' && <SettingsSection cfg={cfg} grades={grades} cycles={cycles} reload={reload} setBusy={setBusy} flash={flash} setErr={setErr} />}
    </div>
  );
}

const TPL_ORDER=[['prepare','평가 준비'],['start','평가 시작'],['remind','평가 독려'],['closing','종료 임박'],['closed','평가 종료']];
function EmailPanel({ cycles, emps, cfg, setBusy, flash, setErr }){
  const inProg=cycles.find(c=>c.status==='IN_PROGRESS');
  const [cid,setCid]=useState(inProg?inProg.cycle_id:(cycles[0]?cycles[0].cycle_id:''));
  const [templates,setTemplates]=useState([]);
  const [selKey,setSelKey]=useState('prepare');
  const [scope,setScope]=useState('all');
  const [statuses,setStatuses]=useState([]);
  const [targets,setTargets]=useState([]);
  const [edit,setEdit]=useState(null);
  const [excl,setExcl]=useState(()=>new Set());
  const [q,setQ]=useState('');
  const cycle=cycles.find(c=>c.cycle_id===cid);
  const active=useMemo(()=>emps.filter(e=>e.status!=='퇴사'&&e.email),[emps]);

  async function loadT(){ const { data, error }=await sb.from('eval_email_templates').select('*'); if(error){ setErr(error.message); return; } setTemplates(data||[]); }
  useEffect(()=>{ loadT(); },[]);
  useEffect(()=>{ setExcl(new Set()); },[scope,cid]);
  useEffect(()=>{ (async()=>{ if(!cid){ setStatuses([]); setTargets([]); return; } const [ks,tg]=await Promise.all([ sb.from('eval_kpi_status').select('employee_id,status').eq('cycle_id',cid), sb.from('eval_targets').select('employee_id,eval_type').eq('cycle_id',cid) ]); setStatuses(ks.data||[]); setTargets(tg.data||[]); })(); },[cid]);

  const tpl=templates.find(t=>t.key===selKey)||{ key:selKey, subject:'', body:'' };
  const stMap=Object.fromEntries(statuses.map(x=>[x.employee_id,x.status]));
  const targetIds=new Set((targets||[]).filter(t=>t.eval_type!=='EXCLUDED').map(t=>t.employee_id));
  const rcpts = scope==='kpi_missing'
    ? active.filter(e=>targetIds.has(e.id) && stMap[e.id]!=='SUBMITTED' && stMap[e.id]!=='APPROVED')
    : active;
  const toggle=id=>setExcl(sset=>{ const n=new Set(sset); n.has(id)?n.delete(id):n.add(id); return n; });
  const rcptsFinal=rcpts.filter(e=>!excl.has(e.id));
  const rcptsView = q? rcpts.filter(e=>(e.name||'').indexOf(q)>=0||(e.email||'').indexOf(q)>=0) : rcpts;
  const allSelected = rcpts.length>0 && rcpts.every(e=>!excl.has(e.id));
  function clickAll(){ if(scope!=='all'){ setScope('all'); setExcl(new Set()); return; } setExcl(allSelected? new Set(rcpts.map(e=>e.id)) : new Set()); }
  function selVisible(on){ setExcl(sset=>{ const n=new Set(sset); rcptsView.forEach(e=>{ on?n.delete(e.id):n.add(e.id); }); return n; }); }
  function render(txt, emp){ const dl=cycle?(cycle.kpi_input_end||cycle.end_date||''):''; let x=String(txt||''); x=x.split('{name}').join(emp?emp.name:''); x=x.split('{cycle}').join(cycle?cycle.name:''); x=x.split('{deadline}').join(dl?String(dl).slice(0,10):''); return x; }
  const sample=active[0]||{ name:'홍길동' };

  async function send(){
    if(!tpl.subject){ uiAlert('먼저 템플릿을 저장하세요'); return; }
    if(!rcptsFinal.length){ uiAlert('수신자를 선택하세요'); return; }
    if(!await uiConfirm(rcptsFinal.length+'명에게 발송할까요?\n제목: '+render(tpl.subject,sample))) return;
    const emails=rcptsFinal.map(e=>({ to:e.email, subject:render(tpl.subject,e), html:render(tpl.body,e).split('\n').join('<br>') }));
    setBusy(true);
    const { data, error }=await sb.functions.invoke('send-eval-email', { body:{ emails } });
    setBusy(false);
    if(error){ let detail=error.message; try{ if(error.context&&error.context.json){ const b=await error.context.json(); if(b&&b.error) detail=b.error; } }catch(_){} setErr('발송 실패: '+detail+' (Supabase → Edge Functions → send-eval-email → Logs에서 상세 확인)'); return; }
    if(data&&data.error){ setErr('발송 오류: '+data.error); return; }
    const okN=(data&&data.sent!=null)?data.sent:rcptsFinal.length; const fl=(data&&data.failed)||[];
    if(fl.length){ setErr('발송 '+okN+'건 성공 / '+fl.length+'건 실패: '+fl.join(', ')+' — (테스트 모드는 Resend 가입 이메일로만 발송됩니다. 도메인 인증 필요)'); }
    else flash(okN+'건 발송 완료');
  }

  return (
    <div>
      <div className="flex items-center gap-2 mb-3 flex-wrap">
        <select value={cid} onChange={e=>setCid(e.target.value)} className="inp !w-52">
          <option value="">평가주기 선택</option>
          {cycles.map(c=><option key={c.cycle_id} value={c.cycle_id}>{c.name}</option>)}
        </select>
      </div>
      <div className="flex gap-2 mb-4 flex-wrap">
        {TPL_ORDER.map(o=>{ const on=selKey===o[0];
          return <button key={o[0]} onClick={()=>setSelKey(o[0])} className={"px-3 py-1.5 text-sm rounded-lg border "+(on?"bg-indigo-600 border-indigo-600 text-white font-bold":"bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700/40")}>{o[1]}</button>;
        })}
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-4">
          <div className="flex items-center justify-between mb-2">
            <h3 className="font-semibold text-slate-800 dark:text-slate-100">템플릿 미리보기</h3>
            <button onClick={()=>setEdit(tpl)} className="text-xs px-3 py-1.5 bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 rounded-lg">템플릿 수정</button>
          </div>
          <div className="text-xs text-slate-400 dark:text-slate-500 mb-1">제목</div>
          <div className="text-sm font-medium text-slate-800 dark:text-slate-100 mb-3">{render(tpl.subject,sample)||'(비어있음 — 수정하세요)'}</div>
          <div className="text-xs text-slate-400 dark:text-slate-500 mb-1">본문</div>
          <div className="text-sm text-slate-600 dark:text-slate-300 whitespace-pre-wrap bg-slate-50 dark:bg-slate-900 rounded-lg p-3 max-h-64 overflow-y-auto">{render(tpl.body,sample)||'(비어있음)'}</div>
          <div className="text-[11px] text-slate-400 dark:text-slate-500 mt-2">변수: {'{name}'} 이름 · {'{cycle}'} 평가주기 · {'{deadline}'} 마감일 (수신자별로 자동 치환)</div>
        </div>

        <div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-4">
          <h3 className="font-semibold text-slate-800 dark:text-slate-100 mb-2">수신자</h3>
          <div className="flex gap-2 mb-3">
            <button onClick={clickAll} className={"text-xs px-3 py-1.5 rounded-lg border "+(scope==='all'?"bg-indigo-600 border-indigo-600 text-white":"bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300")}>전체 재직자{scope==='all'?(allSelected?' ✓':' ○'):''}</button>
            <button onClick={()=>setScope('kpi_missing')} className={"text-xs px-3 py-1.5 rounded-lg border "+(scope==='kpi_missing'?"bg-indigo-600 border-indigo-600 text-white":"bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300")}>KPI 미제출자</button>
          </div>
          <div className="flex items-center justify-between mb-2">
            <div className="text-sm text-slate-600 dark:text-slate-300">선택 <b className="text-indigo-600 dark:text-indigo-400">{rcptsFinal.length}</b> / {rcpts.length}명</div>
            <div className="flex gap-1"><button onClick={()=>selVisible(true)} className="text-[11px] px-2 py-0.5 rounded border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300">전체선택</button><button onClick={()=>selVisible(false)} className="text-[11px] px-2 py-0.5 rounded border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300">전체해제</button></div>
          </div>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="🔍 이름/이메일 검색" className="w-full mb-2 text-sm border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-1.5 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 outline-none focus:border-indigo-400" />
          <div className="max-h-48 overflow-y-auto border border-slate-100 dark:border-slate-700 rounded-lg divide-y divide-slate-50 dark:divide-slate-800">
            {rcptsView.map(e=>{ const on=!excl.has(e.id); return <label key={e.id} className="flex items-center gap-2 px-3 py-1.5 text-xs cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-700/40"><input type="checkbox" checked={on} onChange={()=>toggle(e.id)} /><span className="text-slate-700 dark:text-slate-200">{e.name}</span><span className="text-slate-400 dark:text-slate-500 ml-auto">{e.email}</span></label>; })}
            {rcptsView.length===0 && <div className="px-3 py-4 text-xs text-slate-400 dark:text-slate-500 text-center">{rcpts.length===0?'대상이 없습니다.':'검색 결과가 없습니다.'}</div>}
          </div>
          <button onClick={send} disabled={!cid||!rcptsFinal.length} className="w-full mt-4 py-2.5 rounded-lg bg-emerald-600 text-white font-bold text-sm hover:bg-emerald-700 disabled:opacity-40">선택한 {rcptsFinal.length}명에게 발송</button>
          <p className="text-[11px] text-slate-400 dark:text-slate-500 mt-2">실제 발송은 Resend 발송기능(Edge Function)이 배포된 후 작동합니다.</p>
        </div>
      </div>
      {edit && <EmailTemplateModal tpl={edit} reload={loadT} setBusy={setBusy} flash={flash} setErr={setErr} onClose={()=>setEdit(null)} />}
    </div>
  );
}

function EmailTemplateModal({ tpl, reload, setBusy, flash, setErr, onClose }){
  const nameMap={ prepare:'평가 준비 안내', start:'평가 시작 안내', remind:'평가 독려', closing:'종료 임박 안내', closed:'평가 종료 안내' };
  const [subject,setSubject]=useState(tpl.subject||'');
  const [body,setBody]=useState(tpl.body||'');
  async function save(){
    setBusy(true);
    const res=await sb.from('eval_email_templates').upsert({ key:tpl.key, subject, body },{ onConflict:'key' });
    setBusy(false);
    if(res.error){ setErr(res.error.message); return; }
    flash('템플릿이 저장되었습니다'); await reload(); onClose();
  }
  return (
    <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
      <div className="bg-white dark:bg-slate-800 rounded-2xl w-full max-w-lg p-5 max-h-[92vh] overflow-y-auto">
        <h3 className="font-bold text-slate-800 dark:text-slate-100 mb-4">템플릿 수정 · {nameMap[tpl.key]||tpl.key}</h3>
        <div className="space-y-3">
          <Field label="제목"><input value={subject} onChange={e=>setSubject(e.target.value)} className="inp" /></Field>
          <Field label="본문"><textarea value={body} onChange={e=>setBody(e.target.value)} rows="10" className="inp" /></Field>
          <div className="text-[11px] text-slate-400 dark:text-slate-500">사용 가능 변수: {'{name}'} {'{cycle}'} {'{deadline}'}</div>
        </div>
        <div className="flex justify-end gap-2 mt-5">
          <button onClick={onClose} className="px-4 py-2 text-sm text-slate-600 dark:text-slate-300 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">취소</button>
          <button onClick={save} className="px-4 py-2 text-sm bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">저장</button>
        </div>
      </div>
    </div>
  );
}

function TargetsSection({ cycles, emps, cfg, comps, email, setBusy, flash, setErr }){
  const [cid,setCid]=useState(cycles[0]?cycles[0].cycle_id:'');
  const [justSaved,setJustSaved]=useState(null);   // 방금 저장한 행 강조 (4초)
  const [targets,setTargets]=useState([]);
  const [loading,setLoading]=useState(false);
  const [peerT,setPeerT]=useState(null);
  const [loadSel,setLoadSel]=useState(null);
  const [raterQ,setRaterQ]=useState('');
  const [scored,setScored]=useState({});   // '평가자id|대상자id' → 채점 완료 여부
  const empById=useMemo(()=>Object.fromEntries(emps.map(e=>[e.id,e])),[emps]);
  const active=useMemo(()=>emps.filter(e=>e.status!=='퇴사'),[emps]);

  async function load(){
    if(!cid){ setTargets([]); setScored({}); return; }
    setLoading(true);
    const { data, error }=await sb.from('eval_targets').select('*').eq('cycle_id',cid);
    setLoading(false);
    if(error){ setErr(error.message); return; }
    setTargets(data||[]);
    // 배정 현황에서 「채점 완료」 표시에 쓰는 최소 정보만 별도 조회
    const sc=await fetchAll(()=>sb.from('eval_360').select('rater_id,ratee_id').eq('cycle_id',cid).eq('rater_type','peer'));
    if(!sc.error){
      const m={};
      (sc.data||[]).forEach(function(x){ m[String(x.rater_id)+'|'+String(x.ratee_id)]=true; });
      setScored(m);
    }
  }
  useEffect(()=>{ load(); },[cid]);

  async function generate(){
    if(!cid){ uiAlert('평가주기를 선택하세요'); return; }
    const have=new Set(targets.map(t=>t.employee_id));
    const exCEO=String(cfg.exclude_ceo)!=='false';
    const add=active.filter(e=>!have.has(e.id) && !(exCEO&&isCEO(e))).map(e=>({ cycle_id:cid, employee_id:e.id, manager_id:e.manager_id||null, eval_type:'REGULAR' }));
    if(!add.length){ uiAlert('추가할 신규 대상자가 없습니다(이미 모두 생성됨).'); return; }
    setBusy(true);
    const res=await sb.from('eval_targets').upsert(add,{ onConflict:'cycle_id,employee_id' });
    setBusy(false);
    if(res.error){ setErr(res.error.message); return; }
    flash(add.length+'명 대상자 생성'); load();
  }
  async function setType(t,val){
    // 화면을 먼저 바꿔 즉시 반영시키고, 저장 실패 시 되돌림
    const prev=t.eval_type;
    setTargets(function(cur){ return cur.map(function(x){ return x.id===t.id?Object.assign({},x,{eval_type:val}):x; }); });
    const res=await sb.from('eval_targets').update({ eval_type:val }).eq('id',t.id);
    if(res.error){
      setTargets(function(cur){ return cur.map(function(x){ return x.id===t.id?Object.assign({},x,{eval_type:prev}):x; }); });
      setErr('평가유형 저장 실패: '+res.error.message);
    }
  }
  async function remove(t){ if(!await uiConfirm('이 대상자를 제외(삭제)할까요?')) return; setBusy(true); const res=await sb.from('eval_targets').delete().eq('id',t.id); setBusy(false); if(res.error){ setErr(res.error.message); return; } load(); }
  async function removeAssign(t, raterId){
    var ra=empById[raterId], rt=empById[t.employee_id];
    if(!await uiConfirm('타조직 동료 배정을 제거합니다.\n\n'
      +'평가자 : '+((ra&&ra.name)||raterId)+'\n'
      +'대상자 : '+((rt&&rt.name)||t.employee_id)+' ('+((rt&&rt.team)||'-')+')\n\n'
      +'제거하면 그 평가자의 화면에서 이 대상자의 채점 과제가 사라집니다.\n'
      +'이미 채점한 점수가 있으면 집계에서 제외됩니다. 계속할까요?')) return;
    setBusy(true);

              flash(r&&r.n>0 ? (r.rateeName+'님을 평가할 타조직 동료 '+r.n+'명 저장 완료 — '+r.names.join(', ')) : (r&&r.rateeName?r.rateeName+'님의 타조직 동료 지정을 모두 해제했습니다':'저장 완료'), 4500); }} onClose={()=>setPeerT(null)} />}

  const chain=new Set();
  (function(){ var cur=ratee,g=0; while(cur&&cur.manager_id&&empMap[cur.manager_id]&&g<20){ chain.add(cur.manager_id); cur=empMap[cur.manager_id]; g++; } })();
  (function(){ var fr=ratee?[ratee.id]:[],g=0; while(fr.length&&g<50){ var nx=[]; emps.forEach(function(e){ if(e.manager_id&&fr.indexOf(e.manager_id)>=0&&!chain.has(e.id)){ chain.add(e.id); nx.push(e.id); } }); fr=nx; g++; } })();

    && e.id!==(ratee&&ratee.id)

  const list=active.filter(e=>!q||(e.name||'').indexOf(q)>=0||(e.team||'').indexOf(q)>=0).sort((a,b)=>(a.team||'').localeCompare(b.team||'')||(a.name||'').localeCompare(b.name||''));

  return (

        <div className="mt-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/60 px-3 py-2">

            <span className="ml-auto text-[10.5px] text-slate-400 dark:text-slate-500">기준: {cntLabel} {cnt}명</span>
          </div>
          {autoCount>0 &&

              <span className="text-slate-400 dark:text-slate-500">자동 포함 명단 · </span>{autoPeers.map(e=>e.name).join(' · ')}

        </div>
        {(cnt<PEER_MIN || cnt>PEER_MAX) &&
          <div className={"mt-2 rounded-lg px-3 py-2 text-[11px] border "+(cnt>PEER_MAX

      </div>
    </div>

// ══ KPI 이월 : 같은 연도 상반기 → 하반기 ═══════════════════════════
//   복사 : 구분·업무목표·지표·목표치·일정·배점·S~D등급기준·실적근거·비고
//   초기화 : 단계별 등급(본인/1차/2차/최종조정)·의견·점수  → 하반기 평가를 새로
//   승인상태 : 상반기가 승인완료였으면 승인완료 유지 (수정하려면 [수정 요청])
async function carryOverKpi(fromCid, toCid, empList){
  const src=await sb.from('eval_kpi').select('*').eq('cycle_id',fromCid);
  if(src.error) return { error:src.error };
  const rows=src.data||[];
  if(rows.length===0) return { copied:0, people:0 };
  const dup=await sb.from('eval_kpi').select('id').eq('cycle_id',toCid);
  if(dup.error) return { error:dup.error };
  if((dup.data||[]).length>0) return { error:{ message:toCid+' 주기에 이미 KPI가 '+dup.data.length+'건 있습니다. 중복 이월을 막기 위해 중단했습니다.' } };
  const payload=rows.map(function(k){
    return {
      cycle_id:toCid, employee_id:k.employee_id,
      category:k.category, kpi_name:k.kpi_name, metric:k.metric,
      target_text:k.target_text, target_value:k.target_value,
      schedule:k.schedule, weight:k.weight,
      rubric_s:k.rubric_s, rubric_a:k.rubric_a, rubric_b:k.rubric_b, rubric_c:k.rubric_c, rubric_d:k.rubric_d,
      evidence:k.evidence, comment:k.comment, sort_order:k.sort_order,
      // 하반기 평가는 새로 → 등급·점수 비움
      self_grade:null, r1_grade:null, r1_comment:null, r2_grade:null, r2_comment:null,
      final_grade:null, adj_reason:null, final_score:null,
      actual_value:null, achievement_rate:null
    };
  });
  const ins=await sb.from('eval_kpi').insert(payload);
  if(ins.error) return { error:ins.error };
  // 승인상태 이월
  const st=await sb.from('eval_kpi_status').select('*').eq('cycle_id',fromCid);
  if(!st.error && (st.data||[]).length){
    const byId={}; (empList||[]).forEach(function(e){ byId[e.id]=e; });
    const now=new Date().toISOString();
    const srows=(st.data||[]).map(function(x){
      const wasOk=(x.status==='APPROVED');
      const line=approvalLine(byId[x.employee_id], byId);
      return {
        cycle_id:toCid, employee_id:x.employee_id,
        status: wasOk?'APPROVED':'DRAFT',
        stage: wasOk?Math.max(1,line.length):1,
        approver_id:null,
        l1_approver_id: line[0]?line[0].id:null,
        l2_approver_id: line[1]?line[1].id:null,
        l3_approver_id: line[2]?line[2].id:null,
        l1_approved_at: wasOk&&line[0]?now:null,
        l2_approved_at: wasOk&&line[1]?now:null,
        l3_approved_at: wasOk&&line[2]?now:null,
        submitted_by:x.submitted_by, submitted_at: wasOk?now:null,
        approved_at: wasOk?now:null,
        reject_reason:null, reject_stage:null, updated_at:now
      };
    });
    const su=await sb.from('eval_kpi_status').upsert(srows,{ onConflict:'cycle_id,employee_id' });
    if(su.error) return { error:su.error };
  }
  const ppl={}; rows.forEach(function(k){ ppl[k.employee_id]=1; });
  return { copied:rows.length, people:Object.keys(ppl).length };
}
function halfInfo(cid){
  const m=String(cid||'').match(/^(\d{4})H([12])/);
  if(!m) return null;
  return { year:m[1], half:m[2], h1id:m[1]+'H1' };
}

function CycleModal({ cycle, cycles, reload, setBusy, flash, setErr, email, onClose }){
  const isNew=!cycle;
  const y=new Date().getFullYear();
  const [f,setF]=useState(cycle ? { cycle_id:cycle.cycle_id, name:cycle.name||'', period:cycle.period||'', start_date:cycle.start_date||'', end_date:cycle.end_date||'', status:cycle.status||'PREPARING', description:cycle.description||'' } : { cycle_id:y+'H2', name:y+'년 하반기 평가', period:y+'H2', start_date:'', end_date:'', status:'PREPARING', description:'' });
  const set=(k,v)=>setF(s=>({...s,[k]:v}));
  const [carry,setCarry]=useState(true);
  const [emps2,setEmps2]=useState([]);
  useEffect(()=>{ (async()=>{ const r=await sb.from('employees_public').select('id,name,team,position,rank,group_id,manager_id,status,last_work_day'); if(!r.error) setEmps2(r.data||[]); })(); },[]);
  // 이월 가능 여부 : 새로 만드는 주기가 YYYYH2 이고, 같은 연도 YYYYH1 이 존재할 때만
  const hi=halfInfo(f.cycle_id);
  const srcCycle=(hi && hi.half==='2') ? (cycles||[]).find(c=>c.cycle_id===hi.h1id) : null;
  const canCarry=!!(isNew && srcCycle);
  const newYearNotice=!!(isNew && hi && hi.half==='1');
  async function save(){
    if(!f.cycle_id.trim()||!f.name.trim()){ uiAlert('주기 ID와 이름은 필수입니다'); return; }
    setBusy(true);
    const payload={ name:f.name, period:f.period, start_date:f.start_date||null, end_date:f.end_date||null, status:f.status, description:f.description };
    let res;
    if(isNew){ res=await sb.from('eval_cycles').insert({ cycle_id:f.cycle_id, ...payload, created_by:email }); }
    else { res=await sb.from('eval_cycles').update(payload).eq('cycle_id',cycle.cycle_id); }
    if(isNew && !res.error && canCarry && carry){
      const r=await carryOverKpi(hi.h1id, f.cycle_id, emps2);
      setBusy(false);
      if(r.error){ setErr('주기는 만들어졌지만 KPI 이월에 실패했습니다: '+r.error.message); await reload(); onClose(); return; }
      flash('평가주기 생성 + KPI 이월 완료 — '+r.people+'명 / '+r.copied+'개 항목');
      await reload(); onClose(); return;
    }
    setBusy(false);
    if(res.error){ setErr(res.error.message); return; }
    flash(isNew?'평가주기가 생성되었습니다':'평가주기가 수정되었습니다'); await reload(); onClose();
  }

function descendantsOf(id, emps){
  const byMgr={}; emps.forEach(e=>{ if(e.manager_id){ (byMgr[e.manager_id]=byMgr[e.manager_id]||[]).push(e); } });
  const out=[], stack=(byMgr[id]||[]).slice(), seen={};
  while(stack.length){ const e=stack.pop(); if(seen[e.id]) continue; seen[e.id]=1; out.push(e); (byMgr[e.id]||[]).forEach(c=>stack.push(c)); }
  return out;
}
// ══ 조직 트리 (org_groups) ═══════════════════════════════════════
//   ORG[group_id] = { id, name, parent_id }
//   내조직 = 같은 group_id (리프 조직 = 파트, 파트가 없으면 팀)
//   타조직 = 그 외 전부
//   상사·부하라인 = 조직 트리의 조상·자손 조직 소속자 (manager_id 누락 보완)
var ORG={};
function orgAncestors(gid){
  var out=[], c=ORG[gid], n=0;
  while(c && c.parent_id && n<20){ out.push(c.parent_id); c=ORG[c.parent_id]; n++; }
  return out;
}
// a 가 b 의 상위 조직에 소속되어 있는가 (= a 는 b 의 상사라인)
function isOrgAbove(a,b){
  if(!a||!b||!a.group_id||!b.group_id) return false;
  if(a.group_id===b.group_id) return false;
  return orgAncestors(b.group_id).indexOf(a.group_id)>=0;
}
// 보고라인(상사라인 또는 부하라인) 여부 — 조직 트리 기준
function inOrgReportLine(me,other){
  return isOrgAbove(other,me) || isOrgAbove(me,other);
}
// 본인평가를 「실시」하는가 — 점수 반영 여부와 별개다.
//  self_eval_on 을 저장한 적이 없으면 기존 동작(점수 반영 설정을 따름)을 유지한다.
function selfEvalOn(cfg){
  var v=String((cfg&&cfg.self_eval_on)||'');
  if(v==='true') return true;
  if(v==='false') return false;
  return String((cfg&&cfg.score_include_self)||'')==='true';
}
function isAutoPeer(rater, ratee){
  // 내조직 자동 동료 = 같은 파트/팀(group_id). 상사·부하는 상사평가/상향평가로 따로 하므로 제외.
  if(!rater||!ratee) return false;
  if(rater.id===ratee.id) return false;
  if(rater.status==='퇴사') return false;
  if(!rater.group_id || rater.group_id!==ratee.group_id) return false;
  if(rater.manager_id===ratee.id || ratee.manager_id===rater.id) return false;
  if(inOrgReportLine(ratee,rater)) return false;
  return true;
}
function canDesignate(p,cfg){
  if(!p) return false;
  const pos=String(p.position||'')+' '+String(p.rank||'');
  if(pos.indexOf('팀장')>=0||pos.indexOf('본부장')>=0||pos.indexOf('대표')>=0) return true;
  if(pos.indexOf('파트장')>=0 && String(cfg&&cfg.partlead_assign)==='true') return true;
  return false;
}
function compsForRating(ratee, raterType, rater, comps, cfg){
  const all=comps.filter(c=>c.active!==false);
  const tr=getEvalTrack(ratee); const rateeLeader=isLeaderRole(ratee,cfg);
  const sameTeam=!!(rater&&ratee&&rater.group_id&&rater.group_id===ratee.group_id);
  const COMMON=c=>c.track==='COMMON', JOB=c=>c.track===tr, LEADER=c=>c.track==='LEADER', FOLLOWER=c=>c.track==='FOLLOWER';
  let pick;
  if(raterType==='self'||raterType==='manager'||raterType==='manager2') pick=c=>COMMON(c)||JOB(c)||(rateeLeader?LEADER(c):FOLLOWER(c));
  else if(raterType==='subordinate') pick=c=>COMMON(c)||JOB(c)||LEADER(c);
  else if(raterType==='peer'){ if(rateeLeader) pick=c=>COMMON(c)||LEADER(c); else if(sameTeam) pick=c=>COMMON(c)||JOB(c); else pick=c=>COMMON(c); }
  else pick=c=>COMMON(c);
  return all.filter(pick).slice().sort((a,b)=>(a.display_order||0)-(b.display_order||0));
}
// ── 직무 트랙 판정 ─────────────────────────────────────────
//  ⚠ 예전 버전은 팀 이름 '완전 일치'로만 찾고, 못 찾으면 무조건 'CORP'(경영지원)로
//    떨어뜨렸다. 실제 팀 이름에는 '팀' 접미사가 붙어(예: 품질경영팀) 전부 미스되어
//    모든 직원이 경영지원 직무역량을 받는 버그가 있었다.
//  이제 ① employees.eval_track ② 소속 조직명 부분일치 ③ 상위 조직 추적
//        ④ team 문자열 부분일치 순으로 찾고, 못 찾으면 '' 을 반환한다.
//    '' 이면 직무역량 항목이 아예 나오지 않는다 — 엉뚱한 항목을 채점하는 것보다 안전하며,
//    배점은 남은 항목으로 자동 정규화된다. 미판정자는 [대상자 지정] 화면에서 경고로 표시된다.
const TRACK_KEYS=[
  ['품질','QA'],
  ['AI','AIDEV'], ['APP','SWDEV'], ['SW','SWDEV'],
  ['연구개발','AIDEV'], ['개발','AIDEV'],
  ['전략마케팅','MKT'], ['마케팅','MKT'],
  ['영업','SALES'], ['사업본부','SALES'], ['세일즈','SALES'],
  ['경영지원','CORP'], ['인사','CORP'], ['재무','CORP'], ['회계','CORP'], ['지원','CORP']
];
function trackOfName(nm){
  var t=String(nm||''); if(!t) return '';
  for(var i=0;i<TRACK_KEYS.length;i++){ if(t.indexOf(TRACK_KEYS[i][0])>=0) return TRACK_KEYS[i][1]; }
  return '';
}
function getEvalTrack(p){
  if(!p) return '';
  if(p.eval_track) return String(p.eval_track);          // ① 직원별 명시 지정 (최우선)
  var g=ORG[p.group_id];
  var hit=trackOfName(g&&g.name);                          // ② 소속 조직명
  if(hit) return hit;
  var anc=orgAncestors(p.group_id);                        // ③ 상위 조직 (파트 → 팀 → 본부)
  for(var i=0;i<anc.length;i++){
    hit=trackOfName(ORG[anc[i]] && ORG[anc[i]].name);
    if(hit) return hit;
  }
  hit=trackOfName(p.team);                                 // ④ employees.team 문자열
  if(hit) return hit;
  return '';                                               // ⑤ 판정 불가 — 임의 배정하지 않는다
}
function isLeaderRole(p,cfg){
  if(!p) return false;
  const roles=String((cfg&&cfg.leadership_roles)||'').split(',').map(x=>x.trim()).filter(Boolean);
  const pos=String(p.position||'')+' '+String(p.rank||'');
  return roles.some(r=>r&&pos.indexOf(r)>=0);
}
function isCEO(p){ return /대표이사/.test(String((p&&p.position)||'')+' '+String((p&&p.rank)||'')); }
// ── 이 사람에게 업적평가(KPI) 작성·승인요청 의무가 있는가 ─────────────
//   360 최종제출 조건 / 홈 단계 / 평가자 진행현황이 모두 이 판정을 공유한다.
//   · 회차에서 KPI 미사용            → 불필요
//   · 평가 대상자 미지정 · EXCLUDED  → 불필요 (평가자 역할만 수행)
//   · 대표이사 제외 설정에 걸림      → 불필요
//   · 직급 비중상 업적 0% (간이 등)  → 불필요
function kpiRequiredFor(person, tgtRow, cfg){
  if(!person || !cfg) return false;
  if(String(cfg.kpi_enabled)==='false') return false;
  if(!tgtRow || tgtRow.eval_type==='EXCLUDED') return false;
  if(String(cfg.exclude_ceo)!=='false' && isCEO(person)) return false;
  var tr=tierRatio(person, tgtRow.eval_type, cfg);
  return (Number(tr.ratio[1])||0)>0;
}

// ══ 업적평가(KPI) 등급·배점 ═══════════════════════════════════════
const KPI_GRADES=['S','A','B','C','D'];
const KPI_CATS=['필수중점','도전창의','계획외'];
const KPI_CAT_STYLE={
  '필수중점':'bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 border-indigo-200 dark:border-indigo-800',
  '도전창의':'bg-violet-50 dark:bg-violet-950/60 text-violet-700 dark:text-violet-300 border-violet-200 dark:border-violet-800',
  '계획외':'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 border-slate-300 dark:border-slate-600'
};
const KPI_GRADE_STYLE={
  S:'bg-indigo-600 text-white border-indigo-600',
  A:'bg-emerald-600 text-white border-emerald-600',
  B:'bg-sky-600 text-white border-sky-600',
  C:'bg-amber-500 text-white border-amber-500',
  D:'bg-rose-500 text-white border-rose-500'
};
// 등급 배율 (설정 kpi_mult_s ~ kpi_mult_d, 기본 100/90/80/70/60)
function kpiMult(cfg,g){
  var d={S:100,A:90,B:80,C:70,D:60};
  var key=String(g||'').toUpperCase(); if(!d.hasOwnProperty(key)) return 0;
  var v=cfg?cfg['kpi_mult_'+key.toLowerCase()]:null; var n=Number(v);
  return (v==null||v===''||isNaN(n))?d[key]:n;
}
// 배점 × 배율 = 획득점수 (예: 배점20 + A등급 = 18점)
function kpiPts(weight,g,cfg){ if(!g) return null; return Math.round(Number(weight||0)*kpiMult(cfg,g))/100; }
function kpiCatOf(k){ var c=String((k&&k.category)||'').trim(); return KPI_CATS.indexOf(c)>=0?c:'필수중점'; }
function kpiSort(a,b){
  var ia=KPI_CATS.indexOf(kpiCatOf(a)), ib=KPI_CATS.indexOf(kpiCatOf(b));
  if(ia!==ib) return ia-ib;
  var sa=Number(a.sort_order||0), sb=Number(b.sort_order||0);
  if(sa!==sb) return sa-sb;
  return Number(a.id||0)-Number(b.id||0);
}
function kpiRubric(k){ return [['S',k.rubric_s],['A',k.rubric_a],['B',k.rubric_b],['C',k.rubric_c],['D',k.rubric_d]]; }
function hasRubric(k){ return !!(k.rubric_s||k.rubric_a||k.rubric_b||k.rubric_c||k.rubric_d); }
// 부문별 1차:2차 반영 비율 (설정 dtier_*)
function dtierOf(person,cfg){
  var g=jobGroupOf(person);
  var key=(g==='영업')?'dtier_sales':(g==='개발')?'dtier_dev':'dtier_general';
  var dflt=(g==='영업')?'60:40':(g==='개발')?'80:20':'70:30';
  var pr=String((cfg&&cfg[key])||dflt).split(':');
  var a=Number(pr[0]), b=Number(pr[1]);
  if(isNaN(a)) a=70; if(isNaN(b)) b=30;
  if(a+b<=0){ a=100; b=0; }
  return [a,b];
}
// 계획외실적 가산점 — 등급이 아니라 평가자가 점수를 직접 부여 (1차·2차 각각)
function kpiBonusOf(k,person,cfg){
  var b1=(k.r1_bonus==null||k.r1_bonus==='')?null:Number(k.r1_bonus);
  var b2=(k.r2_bonus==null||k.r2_bonus==='')?null:Number(k.r2_bonus);
  if(isNaN(b1)) b1=null; if(isNaN(b2)) b2=null;
  if(b1==null&&b2==null) return null;
  if(b2==null) return b1;
  if(b1==null) return b2;
  var r=dtierOf(person,cfg);
  return Math.round((b1*r[0]+b2*r[1])/(r[0]+r[1])*10)/10;
}
// 항목 점수 : 계획외는 가산점, 그 외는 최종조정 > (1차·2차 부문비율 가중) > 단일 단계
function kpiItemScore(k,person,cfg){
  if(kpiCatOf(k)==='계획외') return kpiBonusOf(k,person,cfg);
  if(k.final_grade) return kpiPts(k.weight,k.final_grade,cfg);
  var p1=kpiPts(k.weight,k.r1_grade,cfg), p2=kpiPts(k.weight,k.r2_grade,cfg);
  if(p1==null&&p2==null) return (k.final_score==null?null:Number(k.final_score));
  if(p2==null) return p1;
  if(p1==null) return p2;
  var r=dtierOf(person,cfg);
  return Math.round((p1*r[0]+p2*r[1])/(r[0]+r[1])*100)/100;
}
// 총점 = 필수중점+도전창의 합 + 계획외 가산(최대 kpi_bonus_max)
function kpiTotalOf(kpis,person,cfg){
  var base=0,bonus=0,any=false;
  (kpis||[]).forEach(function(k){
    var s=kpiItemScore(k,person,cfg); if(s==null) return; any=true;
    if(kpiCatOf(k)==='계획외') bonus+=s; else base+=s;
  });
  if(!any) return null;
  var cap=Number((cfg&&cfg.kpi_bonus_max)||10);
  if(bonus>cap) bonus=cap;
  return Math.round((base+bonus)*10)/10;
}

// ══ 승인 라인 : 1차=직속상사 / 2차=차상위자 / 3차=대표 ══════════════
//   · 2차가 대표면 거기서 종료 (2단계)
//   · 직속상사가 대표뿐이면 1단계
//   · 퇴사자는 건너뜀
function findCEO(empById){
  var ks=Object.keys(empById);
  for(var i=0;i<ks.length;i++){ var e=empById[ks[i]]; if(e && e.status!=='퇴사' && isCEO(e)) return e; }
  return null;
}
function upFrom(emp,empById){
  var cur=emp?empById[emp.manager_id]:null, n=0;
  while(cur && cur.status==='퇴사' && n<8){ cur=empById[cur.manager_id]; n++; }
  return cur||null;
}
function approvalLine(emp,empById){
  if(!emp||!empById) return [];
  // 방어: manager_id 가 없는 부분 레코드가 넘어오면 전체 직원 목록의 원본으로 교체
  if(emp.manager_id===undefined && empById[emp.id]) emp=empById[emp.id];
  var ceo=findCEO(empById);
  var l1=upFrom(emp,empById);
  if(!l1) return [];
  var out=[l1];
  var l2=upFrom(l1,empById);
  if(l2 && l2.id!==l1.id && l2.id!==emp.id) out.push(l2);
  if(ceo && out.length>=2 && out[out.length-1].id!==ceo.id && ceo.id!==emp.id) out.push(ceo);
  return out;
}
function approverAt(line,stage){ var i=Number(stage||1)-1; return (line&&i>=0&&i<line.length)?line[i]:null; }
function stageName(i){ return ['1차','2차','최종(대표)'][i]||('' + (i+1) + '차'); }
function resolveApprover(emp,empById){ var L=approvalLine(emp,empById); return L.length?L[0]:null; }

function ApprovalModal({ row, emp, me, cid, empById, cfg, reload, setBusy, flash, setErr, onClose }){
  const [kpis,setKpis]=useState([]);
  const [reason,setReason]=useState('');
  const [gr,setGr]=useState({});
  const [cm,setCm]=useState({});
  const [bn,setBn]=useState({});
  const [loaded,setLoaded]=useState(false);
  const line=approvalLine(emp,empById);
  const stage=Number(row.stage||1);
  const isLast=stage>=line.length;
  const gField=stage>=3?'final_grade':(stage===2?'r2_grade':'r1_grade');
  const cField=stage>=3?'adj_reason':(stage===2?'r2_comment':'r1_comment');
  const bField=stage>=2?'r2_bonus':'r1_bonus';
  useEffect(()=>{ (async()=>{
    const { data, error }=await sb.from('eval_kpi').select('*').eq('cycle_id',cid).eq('employee_id',row.employee_id);
    if(error){ setErr(error.message); return; }
    const list=(data||[]).slice().sort(kpiSort); setKpis(list);
    const g={},c={},b={}; list.forEach(function(k){ g[k.id]=k[gField]||''; c[k.id]=k[cField]||''; b[k.id]=(k[bField]==null?'':String(k[bField])); });
    setGr(g); setCm(c); setBn(b); setLoaded(true);
  })(); },[]);
  const ess=kpis.filter(k=>kpiCatOf(k)==='필수중점'), chl=kpis.filter(k=>kpiCatOf(k)==='도전창의'), extra=kpis.filter(k=>kpiCatOf(k)==='계획외');
  const wsum=g=>g.reduce((s,k)=>s+Number(k.weight||0),0);
  const totalW=wsum(ess)+wsum(chl);
  const bonusCap=Number(cfg.kpi_bonus_max||10);
  const preview=(function(){
    let base=0,bonusRaw=0;
    kpis.forEach(function(k){
      if(kpiCatOf(k)==='계획외'){
        const v=Number(bn[k.id]); if(bn[k.id]!==''&&bn[k.id]!=null&&!isNaN(v)) bonusRaw+=v;
      } else {
        const pt=kpiPts(k.weight,gr[k.id],cfg); if(pt!=null) base+=pt;
      }
    });
    const bonus=Math.min(bonusRaw,bonusCap);
    return { base:Math.round(base*10)/10, bonusRaw:Math.round(bonusRaw*10)/10,
             bonus:Math.round(bonus*10)/10, capped:bonusRaw>bonusCap,
             total:Math.round((base+bonus)*10)/10 };
  })();
  const scored=kpis.filter(k=>kpiCatOf(k)!=='계획외' && gr[k.id]).length;
  const needed=ess.length+chl.length;
  const rt=dtierOf(emp,cfg);

  async function saveGrades(){
    for(let i=0;i<kpis.length;i++){
      const k=kpis[i], pl={};
      if(kpiCatOf(k)==='계획외'){
        const v=Number(bn[k.id]);
        pl[bField]=(bn[k.id]===''||bn[k.id]==null||isNaN(v))?null:v;
        pl[cField]=cm[k.id]||null;
      } else {
        pl[gField]=gr[k.id]||null; pl[cField]=cm[k.id]||null;
      }
      const sc=kpiItemScore(Object.assign({},k,pl),emp,cfg);
      pl.final_score=(sc==null?null:sc);
      const r=await sb.from('eval_kpi').update(pl).eq('id',k.id);
      if(r.error) return r.error;
    }
    return null;
  }
  async function approve(){
    if(needed>0 && scored<needed){ uiAlert('등급을 정하지 않은 항목이 있습니다. ('+scored+'/'+needed+')\n\n모든 필수중점·도전창의 항목에 등급을 매긴 뒤 승인할 수 있습니다.'); return; }
    const nextApp=approverAt(line,stage+1);
    const msg=nextApp
      ? ('이 단계('+stageName(stage-1)+')를 승인하면 '+nextApp.name+'님('+stageName(stage)+')에게 올라갑니다. 계속할까요?')
      : ('최종 승인하면 업적평가가 확정됩니다. 계속할까요?');
    if(!await uiConfirm(msg)) return;
    setBusy(true);
    const e1=await saveGrades();
    if(e1){ setBusy(false); setErr(e1.message); return; }
    const now=new Date().toISOString();
    const upd={ updated_at:now, reject_reason:null, reject_stage:null };
    if(stage===1) upd.l1_approved_at=now; else if(stage===2) upd.l2_approved_at=now; else upd.l3_approved_at=now;
    if(nextApp){ upd.stage=stage+1; upd.approver_id=nextApp.id; upd.status='SUBMITTED'; }
    else { upd.status='APPROVED'; upd.approved_at=now; upd.approver_id=null; }
    const res=await sb.from('eval_kpi_status').update(upd).eq('id',row.id);
    setBusy(false);
    if(res.error){ setErr(res.error.message); return; }
    flash(nextApp?((emp?emp.name:'')+' — '+nextApp.name+'님에게 올렸습니다'):((emp?emp.name:'')+' 업적평가 최종 승인 완료'));
    reload();
  }
  async function reject(){
    if(!reason.trim()){ uiAlert('보완 사유를 입력하세요. 직원 화면에 그대로 표시됩니다.'); return; }
    setBusy(true);
    const e1=await saveGrades();
    if(e1){ setBusy(false); setErr(e1.message); return; }
    const res=await sb.from('eval_kpi_status').update({ status:'REJECTED', reject_reason:reason, reject_stage:stage, approver_id:null, updated_at:new Date().toISOString() }).eq('id',row.id);
    setBusy(false);
    if(res.error){ setErr(res.error.message); return; }
    flash('보완 요청되었습니다 — '+(emp?emp.name:'')+'님이 수정 후 다시 요청합니다');
    reload();
  }

                    </div>
                  </div>
                  <div className="text-right shrink-0">
                    {k.self_grade && <div className="text-[11px] text-slate-400 dark:text-slate-500">본인 <b className="text-slate-600 dark:text-slate-300">{k.self_grade}</b></div>}
                    {stage>=2 && k.r1_grade && <div className="text-[11px] text-slate-400 dark:text-slate-500">1차 <b className="text-slate-600 dark:text-slate-300">{k.r1_grade}</b> ({kpiPts(k.weight,k.r1_grade,cfg)}점)</div>}
                    {stage>=3 && k.r2_grade && <div className="text-[11px] text-slate-400 dark:text-slate-500">2차 <b className="text-slate-600 dark:text-slate-300">{k.r2_grade}</b> ({kpiPts(k.weight,k.r2_grade,cfg)}점)</div>}
                    {kpiCatOf(k)!=='계획외' && myG && <div className="text-xs font-bold text-indigo-700 dark:text-indigo-300 mt-0.5">{stageName(stage-1)} {myG} · {kpiPts(k.weight,myG,cfg)}점</div>}
                    {kpiCatOf(k)==='계획외' && bn[k.id]!=''&&bn[k.id]!=null && <div className="text-xs font-bold text-indigo-700 dark:text-indigo-300 mt-0.5">가산 {bn[k.id]}점</div>}

                <span className="text-xs font-normal text-slate-400 dark:text-slate-500 ml-1.5">{emp?(emp.team+' · '+emp.position):''}</span></h3>
              <div className="text-[11px] mt-1 flex items-center gap-1.5 flex-wrap">

        <div className="px-5 py-4">
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-4 text-center text-xs">
            <div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-2">
              <div className="text-slate-500 dark:text-slate-400">배점 합계</div>
              <b className={totalW!==100?'text-amber-600':'text-emerald-600'}>{totalW}점</b>
              <div className="text-[10px] text-slate-400 dark:text-slate-500">기준 100점</div>
            </div>
            <div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-2">
              <div className="text-slate-500 dark:text-slate-400">채점 진행</div>
              <b className={scored<needed?'text-amber-600':'text-emerald-600'}>{scored}/{needed}</b>
