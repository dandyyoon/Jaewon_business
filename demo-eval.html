      //   그 값이 KPI 총점으로 계산돼 「역량평가만 했는데 KPI 점수가 있다」는
      //   현상이 생겼다. (2026-08-05 수정)
      ['KPI 단계별 등급·가산점', ()=>sb.from('eval_kpi').update({ self_grade:null, r1_grade:null, r1_comment:null, r2_grade:null, r2_comment:null, final_grade:null, adj_reason:null, final_score:null, actual_value:null, achievement_rate:null, r1_bonus:null, r2_bonus:null }).eq('cycle_id',cid)],
      ['KPI 승인상태',   ()=>sb.from('eval_kpi_status').update({ status:'DRAFT', stage:1, approver_id:null, approved_at:null, l1_approved_at:null, l2_approved_at:null, l3_approved_at:null, reject_reason:null, reject_stage:null, submitted_at:null, updated_at:new Date().toISOString() }).eq('cycle_id',cid)],
      ['피드백 수정 이력',   ()=>sb.from('eval_feedback_log').delete().eq('cycle_id',cid)],
      ['피드백 수정 요청',   ()=>sb.from('eval_feedback_unlock_req').delete().eq('cycle_id',cid)],
      ['평가자 제외 요청',   ()=>sb.from('eval_360_exclusions').delete().eq('cycle_id',cid)],
      ['피드백지 열람 차단', ()=>sb.from('eval_config').upsert({ key:'fb_release_'+cid, value:'false' },{ onConflict:'key' })],
      ['결과 직원 비공개',   ()=>sb.from('eval_config').upsert({ key:'result_release_'+cid, value:'false' },{ onConflict:'key' })]
    ];
    for(let i=0;i<steps.length;i++){
      const r=await steps[i][1]();
      if(r && r.error){ setResetting(false); setErr('초기화 중단 — '+steps[i][0]+' 단계에서 실패: '+r.error.message); return; }
    }
    // ── 삭제 검증 : RLS(권한) 때문에 오류 없이 0건만 삭제되는 경우를 잡아낸다 ──
    const chk=await Promise.all([
      sb.from('eval_360').select('id',{count:'exact',head:true}).eq('cycle_id',cid),
      sb.from('eval_targets').select('id',{count:'exact',head:true}).eq('cycle_id',cid),
      sb.from('eval_results').select('id',{count:'exact',head:true}).eq('cycle_id',cid),
      sb.from('eval_feedback').select('id',{count:'exact',head:true}).eq('cycle_id',cid),
      sb.from('eval_feedback_log').select('id',{count:'exact',head:true}).eq('cycle_id',cid),
      sb.from('eval_feedback_unlock_req').select('id',{count:'exact',head:true}).eq('cycle_id',cid),
      sb.from('eval_360_exclusions').select('id',{count:'exact',head:true}).eq('cycle_id',cid)
    ]);
    const NM=['360 점수','평가 대상자 지정','결과 산정','면담 기록','피드백 수정 이력','피드백 수정 요청','평가자 제외 요청'];
    const left=chk.map(function(x,i){ return { nm:NM[i], n:(x&&x.count!=null?x.count:0) }; }).filter(function(x){ return x.n>0; });
    setResetting(false);
    if(left.length){
      await uiAlert('⚠ 일부 데이터가 지워지지 않았습니다.\n\n'
        +left.map(function(x){ return '  · '+x.nm+' '+x.n+'건 남음'; }).join('\n')
        +'\n\n원인 — 해당 테이블에 <삭제 권한(RLS 정책)>이 없어서, 오류 없이 0건만 삭제되었습니다.\n\n'
        +'해결 — 인사부 보관용 SQL 「fix_reset_rls」를 Supabase SQL Editor 에서 한 번 실행한 뒤\n'
        +'다시 [♻ 평가 초기화]를 누르면 정상 삭제됩니다.\n'
        +'(SQL 로 직접 삭제하는 방법도 같은 파일에 들어 있습니다.)');
      await load();
      return;
    }
    await uiAlert('초기화 완료 — '+cname+'\n\n'
      +'남아 있는 것: KPI 업무목표 · S~D 등급기준 · 실적근거\n\n'
      +'다음 할 일\n'
      +'  1. [대상자 지정] 탭 → [재직자 대상자 자동생성]\n'
      +'  2. 각 팀장이 [평가자 지정]으로 동료 평가자 지정\n'
      +'  3. 직원들에게 평가 시작 안내');
    load();
  }

  async function load(){
    if(!cid){ setRows(null); setRrows(null); return; }
    const [tg,ks,r360,rs,fb,sub,nc]=await Promise.all([
      sb.from('eval_targets').select('employee_id,eval_type,peer_rater_ids').eq('cycle_id',cid),
      sb.from('eval_kpi_status').select('employee_id,status').eq('cycle_id',cid),
      fetchAll(()=>sb.from('eval_360').select('rater_id,ratee_id,rater_type,comp_id,score').eq('cycle_id',cid)),
      sb.from('eval_results').select('employee_id,grade,grand_total,status,feedback,feedback_date,feedback_confirmed').eq('cycle_id',cid),
      sb.from('eval_feedback').select('employee_id,period,confirmed,meeting_date').eq('cycle_id',cid),
      sb.from('eval_360_submissions').select('rater_id').eq('cycle_id',cid),
      fetchAll(()=>sb.from('eval_360_comments').select('rater_id,ratee_id,rater_type,strength,improve,other_note').eq('cycle_id',cid))
    ]);
    if(tg.error){ setErr(tg.error.message); return; }
    const ksMap={}; (ks.data||[]).forEach(x=>{ ksMap[x.employee_id]=x.status; });
    const raters=new Set((r360.data||[]).filter(x=>x.score!=null).map(x=>x.rater_id));
    // ★ 최종 제출한 평가자의 점수만 결과에 반영된다 → 입력만 한 사람과 구분해서 표시
    const submitted=new Set(((sub&&sub.data)||[]).map(x=>x.rater_id));
    // ★ 평가 피드백만 저장해도 eval_results 행이 만들어지므로, '행 존재'로 판단하면 안 된다.
    //   등급 또는 종합점수가 실제로 들어간 건만 '산정완료'로 본다.
    const resSet=new Set((rs.data||[]).filter(x=>(x.grade||x.grand_total!=null)).map(x=>x.employee_id));
    const resMap={}; (rs.data||[]).forEach(x=>{ resMap[x.employee_id]=x; });
    // 분기 면담 : 기록 건수 / 확정 건수
    const fbMap={}; (fb.data||[]).forEach(x=>{ var o=(fbMap[x.employee_id]=fbMap[x.employee_id]||{n:0,c:0}); o.n++; if(x.confirmed) o.c++; });
    const exCEO=String((cfg||{}).exclude_ceo)!=='false';
    const list=(tg.data||[]).filter(t=>t.eval_type!=='EXCLUDED').map(t=>({ e:empById[t.employee_id], kpi:ksMap[t.employee_id]||'NONE', p360:raters.has(t.employee_id), res:resSet.has(t.employee_id),
      p360st:(submitted.has(t.employee_id)?'SUB':(raters.has(t.employee_id)?'PART':'NONE')),
      fbN:(fbMap[t.employee_id]||{}).n||0, fbC:(fbMap[t.employee_id]||{}).c||0,
      pf:!!(resMap[t.employee_id]&&String(resMap[t.employee_id].feedback||'').trim()),
      pfC:!!(resMap[t.employee_id]&&resMap[t.employee_id].feedback_confirmed),
      pfD:(resMap[t.employee_id]&&resMap[t.employee_id].feedback_date)||'',
      pn:(Array.isArray(t.peer_rater_ids)?t.peer_rater_ids.length:0) })).filter(x=>x.e && x.e.status!=='퇴사' && !(exCEO&&isCEO(x.e)));
    list.sort((a,b)=>(a.e.team||'').localeCompare(b.e.team||'')||(a.e.name||'').localeCompare(b.e.name||''));
    // setRows 는 아래 평가자 진행 현황(rlist) 계산이 끝난 뒤에 한다.
    //  「제출완료」로 보이지만 실제로는 다시 채점해야 하는 사람을 구분하기 위해서다.

    // ══ 평가자 진행 현황 ══════════════════════════════════════════
    //  평가 대상자가 아니어도(대표이사·평가제외자) 평가자로서 할 일이 있으므로 별도로 집계한다.
    //  과제 생성 규칙은 [360도 평가] 탭과 완전히 동일하게 유지해야 한다.
    const tgRows=tg.data||[];
    const tgByEmp={}; tgRows.forEach(function(t){ tgByEmp[t.employee_id]=t; });
    const rateeIds=new Set(tgRows.filter(t=>t.eval_type!=='EXCLUDED')
      .filter(t=>!(exCEO&&isCEO(empById[t.employee_id]))).map(t=>t.employee_id));
    const actives=emps.filter(e=>e.status!=='퇴사');
    // 점수·서술 색인 (rater|ratee|type)
    const scIdx={}; (r360.data||[]).forEach(function(x){ if(x.score==null) return;
      var k=x.rater_id+'|'+x.ratee_id+'|'+x.rater_type; (scIdx[k]=scIdx[k]||{})[x.comp_id]=1; });
    const nrIdx={}; ((nc&&nc.data)||[]).forEach(function(x){
      if(String(x.strength||'').trim()||String(x.improve||'').trim()||String(x.other_note||'').trim())
        nrIdx[x.rater_id+'|'+x.ratee_id+'|'+x.rater_type]=1; });
    const narrOnS=String(cfg.narr_enabled||'true')!=='false';
    const narrReqS=narrOnS && String(cfg.narr_required||'true')!=='false';
    const rlist=[];
    actives.forEach(function(ra){
      const tk=[];
      if(String(cfg.score_include_self)==='true' && rateeIds.has(ra.id)) tk.push({r:ra,type:'self'});
      const mg=empById[ra.manager_id];
      if(mg && mg.status!=='퇴사' && rateeIds.has(mg.id)) tk.push({r:mg,type:'subordinate'});
      tgRows.forEach(function(t){ if(t.eval_type==='EXCLUDED') return; const rt=empById[t.employee_id];
        if(!rt||rt.id===ra.id||rt.status==='퇴사') return;
        const manual=Array.isArray(t.peer_rater_ids)&&t.peer_rater_ids.indexOf(ra.id)>=0;
        if(manual||isAutoPeer(ra,rt)) tk.push({r:rt,type:'peer'}); });
      actives.forEach(function(e){ if(e.manager_id===ra.id && rateeIds.has(e.id)) tk.push({r:e,type:'manager'}); });
      if(String(cfg.comp_mgr2_on)==='true'){
        actives.forEach(function(e){ if(!rateeIds.has(e.id)||e.manager_id===ra.id) return;
          var m1=empById[e.manager_id]; if(m1 && m1.manager_id===ra.id) tk.push({r:e,type:'manager2'}); });
      }
      const myTg=tgByEmp[ra.id]||null;
      const kpiReq=kpiRequiredFor(ra, myTg, cfg);
      const kpiOk=(ksMap[ra.id]==='SUBMITTED'||ksMap[ra.id]==='APPROVED');
      let tot=0, don=0, nmiss=0;
      tk.forEach(function(t){
        const ac=compsForRating(t.r, t.type, ra, comps||[], cfg);
        tot+=ac.length;
        const set=scIdx[ra.id+'|'+t.r.id+'|'+t.type]||{};
        ac.forEach(function(c){ if(set[c.comp_id]) don++; });
        if(narrOnS && t.type!=='self' && !nrIdx[ra.id+'|'+t.r.id+'|'+t.type]) nmiss++;
      });
      const isSub=submitted.has(ra.id);
      const allScored=(tot===0||don>=tot);
      const narrOkay=!(narrReqS && nmiss>0);
      // 단계 판정 — 지금 무엇을 해야 하는지 한 가지만 보여준다
      let stg;
      if(tk.length===0 && !kpiReq)            stg='NOTASK';
      else if(isSub && allScored && narrOkay) stg='DONE';    // 정상 완료
      else if(isSub)                          stg='RESUB';   // 제출 후 대상·항목이 추가됨 → 다시 채점·제출 필요
      else if(!allScored)                     stg='SCORE';
      else if(!narrOkay)                       stg='NARR';
      else if(kpiReq && !kpiOk)               stg='KPI';
      else                                    stg='WAIT';    // 채점 끝 — 최종제출만 남음
      if(tk.length===0 && !kpiReq) return;   // 평가자도 아니고 KPI 의무도 없으면 목록에서 생략
      rlist.push({ e:ra, nTask:tk.length, tot:tot, don:don, nmiss:nmiss,
        isTarget:!!(myTg&&myTg.eval_type!=='EXCLUDED'&&!(exCEO&&isCEO(ra))),
        etype:myTg?myTg.eval_type:null, kpiReq:kpiReq, kpiSt:ksMap[ra.id]||'NONE',
        sub:isSub, stage:stg });
    });
    rlist.sort(function(a,b){
      const ord={RESUB:0,WAIT:1,NARR:2,KPI:3,SCORE:4,DONE:5,NOTASK:6};
      return (ord[a.stage]-ord[b.stage]) || (b.nTask-a.nTask)
          || (a.e.team||'').localeCompare(b.e.team||'') || (a.e.name||'').localeCompare(b.e.name||'');
    });
    setRrows(rlist);
    // sc → r360 : fetchAll 을 적용하며 변수명이 바뀌었는데 이 줄만 남아
    //  「ReferenceError: sc is not defined」로 진행 현황 로딩이 통째로 멈췄다. (2026-08-06 수정)
    setScCnt({rows:((r360&&r360.data)||[]).length, items:rlist.reduce(function(a,x){return a+(x.tot||0);},0)});

    // ── 위쪽 표(대상자별 현황)의 「360 평가」 열을 실제 상태로 보정한다 ─────────
    //  최종제출은 눌렀지만 그 뒤에 평가 대상·문항이 추가되어 미채점분이 남은 사람은
    //  「제출완료」(초록)가 아니라 「재확인 필요」(빨강)로 보여야 한다.
    //  결과 산정은 제출한 평가자의 「실제 점수 행」만 쓰기 때문에, 이 상태로 산정하면
    //  나중에 추가된 대상의 점수가 조용히 빠진 채 평균이 계산된다.
    const stale={};
    rlist.forEach(function(x){
      if(x.stage==='RESUB') stale[x.e.id]={tot:x.tot, don:x.don, nmiss:x.nmiss};
    });
    list.forEach(function(r){
      const st=r.e && stale[r.e.id];
      if(r.p360st==='SUB' && st){
        r.p360st='RESUB'; r.reTot=st.tot; r.reDon=st.don; r.reNmiss=st.nmiss;
      }
    });
    setRows(list);
  }
  useEffect(()=>{ load(); },[cid]);
  const KL={ NONE:['미작성','bg-slate-200 dark:bg-slate-600 text-slate-700 dark:text-slate-200'], DRAFT:['작성중','bg-sky-200 dark:bg-sky-900 text-sky-800 dark:text-sky-200'], SUBMITTED:['승인대기','bg-amber-200 dark:bg-amber-400 text-amber-900 dark:text-amber-950'], APPROVED:['승인완료','bg-emerald-500 text-white'], REJECTED:['보완 요청','bg-rose-500 text-white'] };
  const sum=rows?{ kpiNo:rows.filter(r=>r.kpi==='NONE'||r.kpi==='DRAFT'||r.kpi==='REJECTED').length, wait:rows.filter(r=>r.kpi==='SUBMITTED').length, no360:rows.filter(r=>!r.p360).length, noRes:rows.filter(r=>!r.res).length,
    fbNo:rows.filter(r=>r.fbC===0).length, pfNo:rows.filter(r=>!r.pfC).length,
    noSub:rows.filter(r=>r.p360st!=='SUB').length,
    reSub:rows.filter(r=>r.p360st==='RESUB').length,
    peerNo:rows.filter(r=>r.pn===0).length }:null;
  return (
    <div>
      <div className="flex items-center gap-2 mb-3 flex-wrap">
        <select value={cid} onChange={e=>setCid(e.target.value)} className="inp !w-56"><option value="">평가주기 선택</option>{cycles.map(c=><option key={c.cycle_id} value={c.cycle_id}>{c.name}</option>)}</select>
        {rows && <span className="text-xs text-slate-400 dark:text-slate-500">대상 {rows.length}명</span>}
        <span className="flex-1" />
        {cid && <button onClick={resetKpiScoresOnly} disabled={resetting}
          title="KPI 표만 건드립니다. 360 점수·면담·결과 산정·대상자 지정은 그대로 남습니다."
          className="text-xs px-3 py-1.5 rounded-lg border border-amber-400 dark:border-amber-700 text-amber-800 dark:text-amber-200 hover:bg-amber-50 dark:hover:bg-amber-950 disabled:opacity-50 whitespace-nowrap font-semibold">
          {resetting?'처리 중…':'KPI 점수만 초기화'}</button>}
        {cid && <button onClick={resetCycle} disabled={resetting}
          title="360 점수·면담·결과·대상자 지정까지 전부 지우는 일괄 초기화입니다."
          className="text-xs px-3 py-1.5 rounded-lg border border-rose-300 dark:border-rose-800 text-rose-600 dark:text-rose-300 hover:bg-rose-50 dark:hover:bg-rose-950 disabled:opacity-50 whitespace-nowrap font-semibold">
          {resetting?'처리 중…':'♻ 평가 전체 초기화'}</button>}
      </div>
      {cid && <div className="text-[11px] text-slate-400 dark:text-slate-500 mb-3 -mt-1 leading-snug">
        <b className="text-amber-700 dark:text-amber-300">KPI 점수만 초기화</b> — KPI 표 한 곳만 비웁니다 (등급·의견·<b>계획외 가산점</b>·구 점수·실적값·달성률).
        <b className="text-emerald-600 dark:text-emerald-400">360 점수·면담·결과 산정·대상자 지정은 그대로 남습니다.</b>
        역량평가만 하는 회차에서 KPI 점수가 남아 있을 때 사용하세요.<br />
        <b className="text-rose-600 dark:text-rose-400">평가 전체 초기화</b> — 360 점수·서술평가·최종제출·면담·결과·단계별 등급·<b>평가 대상자 지정</b>·피드백 수정이력·수정요청·평가자 제외요청을 <b>전부</b> 지우고, KPI 승인상태를 [작성중]으로 되돌리며 <b>피드백지 열람과 결과 공개를 모두 차단</b>합니다.
        <b className="text-rose-600 dark:text-rose-400">한 버튼으로 위 항목이 모두 지워집니다 — 골라서 지울 수 없습니다.</b>
        <b className="text-emerald-600 dark:text-emerald-400">KPI 업무목표·S~D 등급기준·실적근거는 남습니다.</b> 테스트를 끝내고 실제 평가를 시작할 때만 사용하세요.
      </div>}
      {!kpiOn && <div className="mb-3 rounded-xl border border-amber-200 dark:border-amber-900 bg-amber-50 dark:bg-amber-950/40 px-3.5 py-2.5 text-[11.5px] text-amber-800 dark:text-amber-200">📌 이번 회차는 <b>역량평가만</b> 진행됩니다. KPI 관련 항목은 표시하지 않습니다. (평가 설정에서 변경 가능)</div>}
      {!rows ? <div className="text-slate-400 dark:text-slate-500 text-sm py-6">평가주기를 선택하세요.</div> : <div>
        <div className={"grid grid-cols-2 gap-3 mb-4 "+(kpiOn?"sm:grid-cols-3 lg:grid-cols-8":"sm:grid-cols-3 lg:grid-cols-6")}>
          {(kpiOn?[['KPI 미완료',sum.kpiNo,'text-rose-600'],['KPI 승인대기',sum.wait,'text-amber-600']]:[]).concat([['타조직 미지정',sum.peerNo,'text-amber-600'],['360 미제출',sum.noSub,'text-rose-600'],['재확인 필요',sum.reSub,'text-rose-600'],['결과 미산정',sum.noRes,'text-slate-500 dark:text-slate-400'],['면담 확정 없음',sum.fbNo,'text-amber-600'],['피드백 미확정',sum.pfNo,'text-amber-600']]).map(a=>(

                  return <tr key={r.id||(r.cycle_id+'_'+r.employee_id)} className="hover:bg-slate-50 dark:hover:bg-slate-900/50">
                    <td className="px-3 py-2.5 font-semibold text-slate-800 dark:text-slate-100">{e.name}</td>
                    <td className="px-3 py-2.5 text-slate-600 dark:text-slate-300">{e.team||''}</td>
                    <td className="px-3 py-2.5 text-slate-500 dark:text-slate-400">{e.position||''}</td>
                    <td className="px-3 py-2.5 text-right text-slate-600 dark:text-slate-300">{r.comp_total!=null?Number(r.comp_total).toFixed(1):'-'}</td>
                    <td className="px-3 py-2.5 text-right text-slate-500 dark:text-slate-400">{r.kpi_total!=null?Number(r.kpi_total).toFixed(1):'-'}</td>
                    <td className="px-3 py-2.5 text-right font-bold text-slate-800 dark:text-slate-100">{r.grand_total!=null?Number(r.grand_total).toFixed(1):'-'}</td>
                    <td className="px-3 py-2.5 text-center"><span className={"text-xs font-bold px-2 py-0.5 rounded "+(GRADE_COLOR[r.grade]||'bg-slate-200')}>{r.grade||'-'}</span></td>
                    <td className="px-3 py-2.5 text-right text-slate-600 dark:text-slate-300">{r.base_raise_rate!=null?(r.base_raise_rate+'%'):'-'}</td>
                    <td className="px-3 py-2.5 text-center text-[11px]">{r.feedback
                      ? (r.feedback_published
                          ? <span className="text-emerald-700 dark:text-emerald-300 font-bold">공개</span>
                          : <span className="text-amber-700 dark:text-amber-300 font-bold">작성됨</span>)
                      : <span className="text-slate-400 dark:text-slate-500">미작성</span>}</td>
                    <td className="px-3 py-2.5 text-center">
                      <button onClick={()=>setSheet({ person:e, cid:r.cycle_id, selfView:false })}
                        className="text-xs px-2.5 py-1 rounded-lg border border-indigo-300 dark:border-indigo-700 text-indigo-700 dark:text-indigo-300 hover:bg-indigo-50 dark:hover:bg-indigo-950 font-semibold">📊 상세</button>
                    </td>
                  </tr>;
                })}
              </tbody>
            </table>
          </div>}
      </div>}

      {sheet && <FeedbackSheetModal person={sheet.person} cid={sheet.cid} comps={comps||[]} cfg={cfg} grades={grades}
        empById={empById} cycleName={cycleName(sheet.cid)} onClose={()=>setSheet(null)} setErr={setErr}
        me={me} flash={flash} setBusy={setBusy} isHR={!!isAdmin && !sheet.selfView} selfView={sheet.selfView} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
