          {stage===2 && <div className="text-[11px] text-slate-500 dark:text-slate-400 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 mb-3">이 직원({jobGroupOf(emp)} 부문)의 최종 점수는 <b>1차 {rt[0]}% : 2차 {rt[1]}%</b>로 합산됩니다. 설정 → 평가 반영 정책에서 변경할 수 있습니다.</div>}
          {stage>=3 && <div className="text-[11px] text-slate-700 dark:text-slate-200 bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-900 rounded-lg px-3 py-2 mb-3"><b>최종 조정 단계입니다.</b> 여기서 등급을 지정하면 1·2차 합산값을 <b>덮어씁니다</b>. 조정하지 않을 항목은 비워두면 1·2차 합산이 그대로 유지됩니다.</div>}

          {!loaded ? <div className="text-slate-400 dark:text-slate-500 text-sm py-8 text-center">불러오는 중…</div> :
           kpis.length===0 ? <div className="text-slate-400 dark:text-slate-500 text-sm py-8 text-center bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl">등록된 업적평가 항목이 없습니다.</div> : (
            <div>
              {block('필수중점',ess,'(기준 70~80점 · 3~5개)')}
              {block('도전창의',chl,'(기준 20~30점 · 1~2개)')}
              {block('계획외',extra,'(등급 없음 · 평가자가 점수를 직접 부여 · 전체 상한 '+bonusCap+'점)')}
            </div>
          )}

          <div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-3 mt-2">
            <div className="text-xs font-bold text-slate-700 dark:text-slate-200 mb-1">보완 사유 <span className="font-normal text-slate-400 dark:text-slate-500">— 되돌려 보낼 때만 입력</span></div>
            <textarea value={reason} onChange={e=>setReason(e.target.value)} rows="2" className="inp !text-[12px]" placeholder="예: 3번 항목의 실적 근거에 분기별 수치를 추가해 주세요." />
          </div>
        </div>

        <div className="sticky bottom-0 bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 rounded-b-2xl px-5 py-3 flex justify-end gap-2 flex-wrap">
          <span className="mr-auto text-xs text-slate-500 dark:text-slate-400 self-center">{stageName(stage-1)} 합계 <b className="text-indigo-600 dark:text-indigo-400">{preview.total}점</b></span>
          <button onClick={onClose} className="px-4 py-2 text-sm text-slate-600 dark:text-slate-300 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700">닫기</button>
          <button onClick={reject} className="px-4 py-2 text-sm bg-amber-500 text-white rounded-lg hover:bg-amber-600 font-semibold">보완 요청</button>
          <button onClick={approve} className="px-5 py-2 text-sm bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 font-bold">{isLast?'최종 승인':(stageName(stage-1)+' 승인 → 다음 단계')}</button>
        </div>
      </div>
    </div>
  );
}

function esc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function jobGroupOf(p){ var t=getEvalTrack(p); if(t==='SALES'||t==='MKT') return '영업'; if(t==='SWDEV'||t==='AIDEV') return '개발'; return '지원'; }
function fbApplicable(ratee, comps, cfg){ var tr=getEvalTrack(ratee), lead=isLeaderRole(ratee,cfg); return comps.filter(function(c){ return c.active!==false && (c.track==='COMMON'||c.track===tr||(c.track==='LEADER'&&lead)||(c.track==='FOLLOWER'&&!lead)); }).slice().sort(function(a,b){return (a.display_order||0)-(b.display_order||0);}); }
function fbAvg(a){ return a.length? a.reduce(function(s,x){return s+x;},0)/a.length : null; }
function fbR1(v){ return v==null?null:Math.round(v*10)/10; }
function buildRadarSvg(axes, opt){
  // opt.keys : 그릴 선 목록 [{key,color,dash,fill,label}]  (미지정 = 역량 6선)
  // opt.big  : 크게 그리기 (피드백지 전폭 배치용)
  opt=opt||{};
  var big=opt.big!==false;
  var W=big?760:340, Hh=big?520:300;
  var cx=W/2, cy=Hh/2-6, R=big?178:100;
  var N=axes.length, rings=[.25,.5,.75,1];
  if(N<3) R=Math.min(R,120);
  function pt(i,f){ var a=-Math.PI/2+i*2*Math.PI/N; return [cx+Math.cos(a)*R*f, cy+Math.sin(a)*R*f]; }
  var h='';
  // 눈금 링 + 눈금값
  rings.forEach(function(rf){
    h+='<polygon points="'+axes.map(function(_,i){return pt(i,rf).join(',');}).join(' ')+'" fill="none" stroke="'+(rf===1?'#cfd3dc':'#e6e8ee')+'"/>';
    h+='<text x="'+(cx+3)+'" y="'+(cy-R*rf+(big?11:8))+'" font-size="'+(big?9.5:8)+'" fill="#c8ccd6">'+Math.round(rf*100)+'</text>';
  });
  axes.forEach(function(_,i){ var e=pt(i,1); h+='<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0]+'" y2="'+e[1]+'" stroke="#e6e8ee"/>'; });
  // ── 계열 선 그리기 (2026-08-06 개선) ─────────────────────────────
  //  예전에는 「값이 있는 축만 모아 닫힌 다각형」으로 그렸다.
  //  그래서 타조직 동료처럼 공통역량 축에만 점수가 있는 계열은
  //  마지막 축과 첫 축이 이어지며 차트를 가로지르는 긴 직선이 생겼고,
  //  채점하지 않은 구간까지 값이 있는 것처럼 보였다.
  //  → 값이 있는 축이 「연속으로 이어진 구간」만 열린 선으로 그리고,
  //    채점 대상이 아닌 구간은 선을 끊는다. 점은 채점한 축에만 찍힌다.
  function ln(key,color,dash,fill){
    var N=axes.length;
    var has=axes.map(function(a){ return a[key]!=null; });
    var cnt=0; has.forEach(function(b){ if(b) cnt++; });
    if(cnt===0) return '';
    var st=' stroke="'+color+'" stroke-width="'+(big?2.6:2)+'" stroke-linecap="round" stroke-linejoin="round"'+(dash?' stroke-dasharray="5 4"':'');
    var rr=big?3.4:2.4;
    function P(i){ return pt(i,(Number(axes[i][key])||0)/100); }
    var dots='';
    for(var i=0;i<N;i++){ if(!has[i]) continue; var q=P(i);
      dots+='<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="'+rr+'" fill="'+color+'"/>'; }
    // 전 축에 값이 있으면 예전처럼 닫힌 다각형
    if(cnt===N){
      var ps=[]; for(var j=0;j<N;j++){ var q2=P(j); ps.push(q2[0].toFixed(1)+','+q2[1].toFixed(1)); }
      return '<polygon points="'+ps.join(' ')+'" fill="'+(fill?color+'2e':'none')+'"'+st+'/>'+dots;
    }
    // 일부 축만 있으면 연속 구간별로 끊어 그린다 (원형이라 끝↔처음도 인접)
    var start=0; while(start<N && has[start]) start++;   // 빈 축에서 시작해 구간이 잘리지 않게
    var segs=[], cur=[];
    for(var k=0;k<N;k++){
      var idx=(start+k)%N;
      if(has[idx]) cur.push(idx);
      else { if(cur.length) segs.push(cur); cur=[]; }
    }
    if(cur.length) segs.push(cur);
    var out='';
    segs.forEach(function(seg){
      if(seg.length<2) return;   // 점 하나뿐인 구간은 점만 찍는다
      var pp=seg.map(function(m){ var q3=P(m); return q3[0].toFixed(1)+','+q3[1].toFixed(1); }).join(' ');
      out+='<polyline points="'+pp+'" fill="none"'+st+'/>';
    });
    return out+dots;
  }
  var KEYS=opt.keys||[
    {key:'self',color:'#0ea5e9',fill:true},   // 부하(#8b5cf6)와 헷갈려 하늘색으로 (2026-08-09)
    {key:'all',color:'#94a3b8',dash:true},
    {key:'peerIn',color:'#10b981'},
    {key:'peerOut',color:'#f59e0b'},
    {key:'sub',color:'#8b5cf6'},
    {key:'mgr2',color:'#fb7185',dash:true},
    {key:'mgr',color:'#e11d48'}
  ];
  KEYS.forEach(function(k){ h+=ln(k.key,k.color,!!k.dash,!!k.fill); });
  // 축 라벨 — 길면 두 줄로 나눠 겹침을 줄인다
  axes.forEach(function(a,i){
    var e=pt(i,big?1.17:1.2);
    var anc=(e[0]<cx-6)?'end':(e[0]>cx+6)?'start':'middle';
    var nm=String(a.nm||''), fs=big?11:9;
    var lines=[nm];
    if(big && nm.length>9){
      var mid=Math.ceil(nm.length/2), cut=nm.lastIndexOf(' ',mid);
      if(cut<3) cut=nm.lastIndexOf('·',mid);
      if(cut<3) cut=mid;
      lines=[nm.slice(0,cut).trim(), nm.slice(cut).replace(/^[ ·]/,'').trim()];
    }
    var y0=e[1]+(lines.length>1?-1:4);
    lines.forEach(function(t,k){
      h+='<text x="'+e[0].toFixed(1)+'" y="'+(y0+k*(fs+2)).toFixed(1)+'" font-size="'+fs+'" fill="#5b6272" font-weight="600" text-anchor="'+anc+'">'+esc(t)+'</text>';
    });
    if(opt.showVal && a[opt.showVal]!=null){
      h+='<text x="'+e[0].toFixed(1)+'" y="'+(y0+lines.length*(fs+2)).toFixed(1)+'" font-size="'+(fs-1)+'" fill="#9aa3b5" text-anchor="'+anc+'">'+(Math.round(Number(a[opt.showVal])*10)/10)+'</text>';
    }
  });
  return '<svg viewBox="0 0 '+W+' '+Hh+'" width="100%" style="max-height:'+(big?520:300)+'px">'+h+'</svg>';
}
function computeFeedback(ratee, comps, cfg, empById, rows360, kpis){
  var minOther=Number(cfg.anon_min_other||2);
  var minUp=Number(cfg.upward_min_raters||3);   // 부하(상향) 최소 인원 — 미만이면 개인 특정되므로 비공개
  var app=fbApplicable(ratee, comps, cfg);
  var all=Object.keys(empById).map(function(k){return empById[k];}).filter(Boolean);
  var teamSet=new Set(all.filter(function(e){return e.group_id===ratee.group_id && e.status!=='퇴사';}).map(function(e){return e.id;}));
  var jg=jobGroupOf(ratee);
  var jobSet=new Set(all.filter(function(e){return e.status!=='퇴사' && jobGroupOf(e)===jg;}).map(function(e){return e.id;}));
  function rowsFor(cid){ return rows360.filter(function(r){ return r.ratee_id===ratee.id && r.comp_id===cid && r.score!=null; }); }
  // 점수까지 포함해 「행 자체가 있는지」 보는 용도 (저장했지만 빈칸으로 둔 경우 판별)
  function rowsAnyFor(cid){ return rows360.filter(function(r){ return r.ratee_id===ratee.id && r.comp_id===cid; }); }
  function avgP(rs,pred){ var v=rs.filter(pred).map(function(r){return Number(r.score);}); return v.length? v.reduce(function(a,b){return a+b;},0)/v.length : null; }
  var items=app.map(function(c){
    var rs=rowsFor(c.comp_id);
    var self=avgP(rs,function(r){return r.rater_type==='self';});
    var peerIn=avgP(rs,function(r){ var e=empById[r.rater_id]; return r.rater_type==='peer' && e && e.group_id===ratee.group_id; });
    var peerOut=avgP(rs,function(r){ var e=empById[r.rater_id]; return r.rater_type==='peer' && (!e || e.group_id!==ratee.group_id); });
    var others=rs.filter(function(r){return r.rater_type!=='self';});
    var allAvg=(others.length>=minOther)?fbAvg(others.map(function(r){return Number(r.score);})):null;
    // 본인 평균(마스킹 없음) — 상사·동료·부하 점수를 그대로 평균. 평가자가 1명이어도 표시한다.
    //   개별 평가자 점수는 본인 화면에 노출하지 않으므로 익명성 문제가 없고,
    //   평가자 수가 적을 때는 아래 otherN 으로 해석 주의를 안내한다.
    var allRaw=others.length? fbAvg(others.map(function(r){return Number(r.score);})) : null;
    var otherN=new Set(others.map(function(r){ return r.rater_id; })).size;
    // ── 상사 : 직속상사 1명이므로 마스킹하지 않음 (피드백지는 상사·인사부 전용) ──
    var mgr=avgP(rs,function(r){return r.rater_type==='manager';});
    var mgr2=avgP(rs,function(r){return r.rater_type==='manager2';});
    // ── 부하(상향) : 최소 인원 미만이면 누가 줬는지 특정되므로 비공개 ──
    var subRows=rs.filter(function(r){return r.rater_type==='subordinate';});
    var subRawAvg=fbAvg(subRows.map(function(r){return r.score;}));   // 마스킹 없는 원본 (관리자용)
    var subAvg=(subRows.length>=minUp)?fbAvg(subRows.map(function(r){return Number(r.score);})):null;
    // ── 조직 전체 평균 : 같은 항목을 평가받은 전 직원의 타인평가 평균 (본인평가 제외) ──
    //   피평가자 본인 화면에서 「내 평균 vs 조직 전체 평균」 비교에 사용한다.
    var orgRows=rows360.filter(function(r){ return r.comp_id===c.comp_id && r.rater_type!=='self' && r.score!=null; });
    var orgN=new Set(orgRows.map(function(r){ return r.ratee_id; })).size;
    var orgAvg=orgRows.length? fbAvg(orgRows.map(function(r){return Number(r.score);})) : null;
    // 이 항목을 어떤 평가자 유형이 채점하는가 (compsForRating 과 같은 규칙)
    //  채점 대상이 아닌 유형에 「미채점」이라고 쓰면 빠뜨린 것처럼 보인다.
    //  예) 리더의 직무역량 항목은 동료가 채점하지 않는다 → 「대상 아님」이 맞다.
    var tk=String(c.track||''), leadR=isLeaderRole(ratee,cfg), trkR=getEvalTrack(ratee);
    var dueSub    = (tk!=='FOLLOWER');
    var duePeerIn = leadR ? (tk==='COMMON'||tk==='LEADER') : (tk==='COMMON'||tk===trkR);
    // 피평가자가 리더면 타조직 동료도 리더십 항목을 채점한다 (compsForRating 과 동일)
    var duePeerOut= leadR ? (tk==='COMMON'||tk==='LEADER') : (tk==='COMMON');
    // 평균이 몇 명으로 계산됐는지 (부하가 비공개라 검산이 안 되는 문제 대응 · 2026-08-09)
    var mix=[];
    var nMgr=others.filter(function(r){return r.rater_type==='manager';}).length;
    var nMgr2=others.filter(function(r){return r.rater_type==='manager2';}).length;
    var nSubR=others.filter(function(r){return r.rater_type==='subordinate';}).length;
    var nPin=others.filter(function(r){ var e3=empById[r.rater_id]; return r.rater_type==='peer' && e3 && e3.group_id===ratee.group_id; }).length;
    var nPout=others.filter(function(r){ var e4=empById[r.rater_id]; return r.rater_type==='peer' && (!e4 || e4.group_id!==ratee.group_id); }).length;
    if(nMgr) mix.push('상사 '+nMgr);
    if(nMgr2) mix.push('차상위 '+nMgr2);
    if(nSubR) mix.push('부하 '+nSubR);
    if(nPin) mix.push('조직내 '+nPin);
    if(nPout) mix.push('타조직 '+nPout);
    return { nm:c.name, track:tk, wt:Number(c.weight||0), def:String(c.description||c.rubric||'').split('\n')[0],
      dueSub:dueSub, duePeerIn:duePeerIn, duePeerOut:duePeerOut,
      mixTxt:mix.join(' + '), mixN:others.length,
      org:fbR1(orgAvg), orgN:orgN, allRaw:fbR1(allRaw), otherN:otherN, thin:(others.length>0 && others.length<minOther),
      self:fbR1(self), peerIn:fbR1(peerIn), peerOut:fbR1(peerOut), all:fbR1(allAvg),
      mgr:fbR1(mgr), mgr2:fbR1(mgr2), sub:fbR1(subAvg), subRaw:fbR1(subRawAvg),
      subN:subRows.length, subMasked:(subRows.length>0 && subRows.length<minUp),
      masked:(others.length<minOther) };
  });
  // ── 평가자 참여 현황 (관리자 진단용) ────────────────────────────
  //  「상사 점수가 왜 일부 항목에만 있나」를 화면에서 바로 확인하기 위한 집계.
  //  채점 대상 항목 수는 compsForRating 과 같은 규칙으로 계산한다.
  var lead=isLeaderRole(ratee,cfg), trk=getEvalTrack(ratee);
  function dueFor(type){
    return app.filter(function(c){
      var t=String(c.track||'');
      if(t==='COMMON') return true;
      if(t===trk) return type!=='peerOut';                 // 직무 : 타조직 동료는 제외
      // 리더십 : 피평가자가 리더면 동료(조직내·타조직) 모두 채점 대상이다
      if(t==='LEADER') return lead;
      if(t==='FOLLOWER') return !lead && (type==='self'||type==='manager'||type==='manager2');
      return false;
    }).length;
  }
  var PT=[['manager','상사(1차)'],['manager2','상사(2차·차상위)'],
          ['subordinate','부하(상향)'],['peerIn','동료(조직내)'],['peerOut','동료(타조직)'],['self','본인']];
  var participation=PT.map(function(t){
    var scored=0, raters={}, missing=[], blank=[], never=[];
    function match(r){
      if(t[0]==='peerIn'){ var e1=empById[r.rater_id]; return r.rater_type==='peer' && e1 && e1.group_id===ratee.group_id; }
      if(t[0]==='peerOut'){ var e2=empById[r.rater_id]; return r.rater_type==='peer' && (!e2 || e2.group_id!==ratee.group_id); }
      return r.rater_type===t[0];
    }
    app.forEach(function(c){
      var rs=rowsFor(c.comp_id).filter(match);
      if(rs.length){ scored++; rs.forEach(function(r){ raters[r.rater_id==null?'?':r.rater_id]=1; }); return; }
      missing.push(c.name);
      // 행은 있는데 점수만 비어 있는가? → 저장은 눌렀으나 그 칸을 입력하지 않은 것
      var anyRow=rowsAnyFor(c.comp_id).filter(match).length>0;
      (anyRow?blank:never).push(c.name);
    });
    return { type:t[0], label:t[1], scored:scored, total:app.length, due:dueFor(t[0]),
             raters:Object.keys(raters).length, missing:missing, blank:blank, never:never };
  });
  return { items:items, jobGroup:jg, participation:participation, compTotal:app.length };
}
// 서술평가 블록 — 피평가자에게는 호출하지 않음 (피드백지는 상사·HR 전용)
function buildNarrativeHtml(narrs, empById, cfg, isHR){
  if(String(cfg.narr_enabled||'true')==='false') return '';
  var list=(narrs||[]).filter(function(x){ return x.strength||x.improve||x.other_note||x.keywords; });
  if(!list.length) return '';
  var showName = isHR || String(cfg.narr_author_view||'hr_only')==='leader_too';
  var TL={ manager:'상사(1차)', manager2:'상사(2차·차상위)', subordinate:'부하', peer:'동료', self:'본인' };
  // 익명 라벨 : 유형별 A·B·C
  var seq={};
  var order={ manager:0, manager2:1, subordinate:2, peer:3, self:4 };
  list.sort(function(a,b){
    var oa=order[a.rater_type]!=null?order[a.rater_type]:9, ob=order[b.rater_type]!=null?order[b.rater_type]:9;
    if(oa!==ob) return oa-ob;
    return String(a.id).localeCompare(String(b.id));
  });
  // 키워드 집계
  var kw={};
  list.forEach(function(x){
    String(x.keywords||'').split(/[,·\/]/).forEach(function(w){
      w=w.trim(); if(!w) return; kw[w]=(kw[w]||0)+1;
    });
  });
  var kwKeys=Object.keys(kw).sort(function(a,b){ return kw[b]-kw[a] || a.localeCompare(b); });
  var kwHtml='';
  if(kwKeys.length){
    kwHtml='<div style="margin-bottom:12px">'+
      '<div style="font-size:11px;color:#7a8194;margin-bottom:5px">업무성향 · 업무방식 키워드 <span style="color:#9aa3b5">(여러 평가자가 함께 꼽은 순서)</span></div>'+
      '<div>'+kwKeys.map(function(w){
        var big=kw[w]>1;
        return '<span style="display:inline-block;font-size:'+(big?'12px':'11px')+';font-weight:'+(big?'700':'400')+
               ';background:'+(big?'#eef0ff':'#f6f7fa')+';color:'+(big?'#4f46e5':'#5a6072')+
               ';border:1px solid '+(big?'#c7ccff':'#e6e8ee')+';border-radius:99px;padding:3px 9px;margin:0 5px 5px 0">'+
               esc(w)+(big?' ×'+kw[w]:'')+'</span>';
      }).join('')+'</div></div>';
  }
  var cards=list.map(function(x){
    var t=x.rater_type;
    seq[t]=(seq[t]||0)+1;
    var who;
    if(showName){
      var e=empById[x.rater_id];
      who=(e?e.name:x.rater_id)+' <span style="color:#9aa3b5;font-weight:400">('+(TL[t]||t)+')</span>';
    } else {
      who=(TL[t]||t)+' '+String.fromCharCode(64+seq[t]);
    }
    function row(lbl,val,color){
      if(!val) return '';
      return '<div style="display:grid;grid-template-columns:52px 1fr;gap:8px;margin-top:5px">'+
             '<div style="font-size:10.5px;color:'+color+';font-weight:700;padding-top:1px">'+lbl+'</div>'+
             '<div style="font-size:11.5px;color:#2f3340;white-space:pre-wrap;line-height:1.5">'+esc(val)+'</div></div>';
    }
    return '<div style="border:1px solid #e6e8ee;border-radius:10px;padding:9px 11px;margin-bottom:7px;background:#fff">'+
      '<div style="font-size:11.5px;font-weight:700;color:#2f3340">'+who+'</div>'+
      row('강점',x.strength,'#059669')+row('보완점',x.improve,'#d97706')+row('기타',x.other_note,'#7a8194')+
      (x.keywords?'<div style="font-size:10.5px;color:#7c3aed;margin-top:5px">'+esc(x.keywords)+'</div>':'')+
    '</div>';
  }).join('');
  return '<div style="padding:14px 20px;border-top:1px solid #e6e8ee">'+
    '<div style="font-size:12px;font-weight:700;color:#7a8194;margin-bottom:4px">서술평가 <span style="font-weight:400;color:#9aa3b5">— 점수 미반영 참고자료 · '+list.length+'건</span></div>'+
    '<div style="font-size:10.5px;color:#9aa3b5;margin-bottom:9px">'+
      (showName?'작성자 이름이 표시됩니다. ':'작성자는 익명 처리되었습니다 (HR 관리자만 이름 확인 가능). ')+
      '피평가자 본인에게는 공개되지 않습니다.</div>'+
    kwHtml+cards+
  '</div>';
}

function FeedbackSheetModal({ person, cid, comps, cfg, grades, empById, cycleName, onClose, setErr, me, flash, setBusy, isHR, selfView, reload }){

  const MK2=['[강점]','[개선점]','[합의·목표]'];
  function compose2(a,b,c){
    var out=[];
    if(String(a||'').trim()) out.push(MK2[0]+'\n'+String(a).trim());
    if(String(b||'').trim()) out.push(MK2[1]+'\n'+String(b).trim());
    if(String(c||'').trim()) out.push(MK2[2]+'\n'+String(c).trim());
    return out.join('\n\n');
  }
  function parse2(text, row){
    var t=String(text||'');

      return { s:a0, i:b0, g:c0 };
    }
    if(!MK2.some(function(m){ return t.indexOf(m)>=0; })) return { s:t.trim(), i:'', g:'' };

      nx.forEach(function(n){ var k=t.indexOf(n,a); if(k>=0&&k<b) b=k; }); return t.slice(a,b).trim(); }

  }

    const data=computeFeedback(person, comps, cfg, empById, r3act, kp.data||[]);

          평가자별 점수(상사·부하·동료) · 서술평가 · 평가자 참여현황 · 등급 조정 이력 · 면담기록 입력은 <b>직원에게 보이지 않아</b> 숨겨졌습니다.
          <b className="block mt-1">상사 총평은 「직원 공개」를 켠 경우에만 표시됩니다.</b>
        </div>}
        <div id="fbsheet" className="p-4 relative z-0" dangerouslySetInnerHTML={{ __html: html }} />

        {/*  크게 쓰기 — 긴 글을 넓은 창에서 편집한다 (2026-09-13)
             좁은 칸에서 스크롤하며 쓰기 불편하다는 요청에 따라 추가.  */}
        {bigEdit && (()=>{
          const k=bigEdit.key;
          return <div className="fixed inset-0 bg-black/60 z-[60] flex items-center justify-center p-4"
                      onClick={e=>{ if(e.target===e.currentTarget) setBigEdit(null); }}>
            <div className="bg-white dark:bg-slate-800 rounded-2xl w-full max-w-3xl shadow-2xl flex flex-col" style={{maxHeight:'86vh'}}>
              <div className="flex justify-between items-center px-5 py-3 border-b border-slate-200 dark:border-slate-700">
                <div>
                  <div className="font-bold text-slate-800 dark:text-slate-100">{bigEdit.label}
                    <span className="ml-2 text-xs font-normal text-slate-500 dark:text-slate-400">{(person&&person.name)||''} · {cycleName||''}</span></div>
                  <div className="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">{bigEdit.hint}</div>
                </div>
                <button onClick={()=>setBigEdit(null)}
                  className="text-sm px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300 font-semibold">닫기</button>
              </div>
              <div className="p-5 flex-1 overflow-y-auto">
                <textarea autoFocus value={iv[k]} disabled={confirmed}
                  onChange={e=>{ const v=e.target.value; setIv(function(o){ const n=Object.assign({},o); n[k]=v; return n; }); setDirty(true); }}
                  rows={14} placeholder={bigEdit.hint}
                  className={"w-full text-[15px] leading-relaxed border rounded-xl p-4 outline-none resize-y "+(confirmed
                    ?"bg-slate-100 dark:bg-slate-900 border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-200"
                    :"bg-white dark:bg-slate-900 border-slate-300 dark:border-slate-600 text-slate-900 dark:text-slate-100 focus:border-indigo-500")} />
                <div className="mt-2 text-[11px] text-slate-500 dark:text-slate-400 flex justify-between">
                  <span>{confirmed?'확정된 피드백이라 수정할 수 없습니다.':'줄바꿈으로 문단을 나눌 수 있습니다.'}</span>
                  <span>{String(iv[k]||'').length}자</span>
                </div>
              </div>
              <div className="px-5 py-3 border-t border-slate-200 dark:border-slate-700 flex justify-end">
                <button onClick={()=>setBigEdit(null)}
                  className="text-sm px-4 py-2 bg-indigo-600 text-white rounded-lg font-semibold">확인</button>
              </div>
            </div>
          </div>;
        })()}
        {!asSelf && <div className="px-4 pb-4">
          <div className="border border-indigo-200 rounded-xl p-4 bg-indigo-50/40">
            <div className="flex items-baseline justify-between gap-2 flex-wrap mb-1">
              <div className="text-sm font-bold text-slate-800 dark:text-slate-100">✍️ 면담 기록 입력</div>
              <div className="text-[11px] text-indigo-700 dark:text-indigo-300">저장하면 <b>[KPI · 면담]의 「{cycleName||''}」 평가 피드백</b>에 자동 반영됩니다</div>
            </div>
            <div className="text-[11px] text-slate-600 dark:text-slate-300 mb-2.5 leading-relaxed">
              위 방사형·항목별 점수를 보면서 면담하고, 여기에 바로 적으세요. <b>같은 기록</b>이므로 [KPI · 면담] 화면에서도 이어서 다듬을 수 있습니다.
              {confirmed
                ? <span className="block mt-1 text-emerald-700 dark:text-emerald-300 font-semibold">✅ 이미 <b>확정</b>된 피드백이라 수정할 수 없습니다. 수정이 필요하면 [KPI · 면담]에서 [수정 요청]하세요.</span>
                : <span className="block mt-1">공개 여부와 <b>확정</b>은 [KPI · 면담] 화면의 <b>[저장 + 공개] / [확정]</b> 버튼으로 처리합니다.</span>}
              {/*  「공개 버튼이 어디 있나」 문의가 있어 경로를 명시한다 (2026-09-13)  */}
              <span className="block mt-1.5 px-2 py-1.5 rounded-lg bg-indigo-50 dark:bg-indigo-950/40 border border-indigo-200 dark:border-indigo-900 text-indigo-800 dark:text-indigo-200">
                📢 <b>직원에게 공개하려면</b> — 상단 메뉴 <b>[KPI · 면담]</b> → 팀원 선택 → 맨 아래
                <b>「{(halfLabel2||'')}평가 피드백」</b> 카드의 <b>[공개]</b> 버튼을 누르세요.
                {confirmed && <span className="block mt-0.5">확정한 뒤에도 공개·비공개는 언제든 바꿀 수 있습니다.</span>}
              </span>
            </div>
            <div className="space-y-2">
              {/*  ⚠ 다크 모드 대응이 없어 어두운 배경에 회색 글자가 되어
                     내용이 거의 보이지 않았다. (2026-09-13)
                     라벨·본문·안내를 모두 3모드에서 4.5:1 이상으로 맞춘다.
                     긴 글은 [크게 쓰기]로 넓은 창에서 편집한다.  */}
              {[['강점','s','잘한 점 · 강점'],['개선점','i','보완이 필요한 점'],['합의·목표','g','면담에서 합의한 다음 반기 목표']].map(function(x){
                return <div key={x[1]}>
                  <div className="flex items-center justify-between mb-1">
                    <span className="text-xs font-bold text-slate-700 dark:text-slate-200">{x[0]}</span>
                    <button type="button" onClick={()=>setBigEdit({key:x[1], label:x[0], hint:x[2]})}
                      className="text-[11px] px-2 py-0.5 rounded-md border border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300 hover:border-indigo-400 hover:text-indigo-700 dark:hover:text-indigo-300 font-semibold">
                      {confirmed?'🔍 크게 보기':'✏️ 크게 쓰기'}</button>
                  </div>
                  <textarea value={iv[x[1]]} disabled={confirmed}
                    onChange={e=>{ var v=e.target.value; setIv(function(o){ var n=Object.assign({},o); n[x[1]]=v; return n; }); setDirty(true); }}
                    rows="3" placeholder={x[2]}
                    className={"w-full text-sm leading-relaxed border rounded-lg p-2.5 outline-none "+(confirmed
                      ?"bg-slate-100 dark:bg-slate-900 border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-200"
                      :"bg-white dark:bg-slate-900 border-slate-300 dark:border-slate-600 text-slate-900 dark:text-slate-100 focus:border-indigo-500 dark:focus:border-indigo-400")} />
                </div>;
              })}
            </div>
            <div className="flex justify-end items-center gap-2 mt-2">
              {dirty && !confirmed && <span className="text-[11px] text-rose-600 font-semibold">저장하지 않은 변경이 있습니다</span>}
              <button onClick={saveIv} disabled={!dirty||confirmed} className="text-sm px-4 py-2 bg-indigo-600 text-white rounded-lg font-semibold disabled:opacity-40">면담 기록 저장</button>
            </div>
          </div>
        </div>}
      </div>
    </div>
  );
}

function KpiHubTab({ me, emps, cycles, cfg, isAdmin, setBusy, flash, setErr, comps, grades, pendingN, unlockN }){
  const inProg=cycles.find(c=>c.status==='IN_PROGRESS');
  const [cid,setCid]=useState(inProg?inProg.cycle_id:(cycles[0]?cycles[0].cycle_id:''));
  const [view,setView]=useState('mine');
  const [teamSel,setTeamSel]=useState('');
  const [allSel,setAllSel]=useState('');
  const empById=useMemo(()=>Object.fromEntries(emps.map(e=>[e.id,e])),[emps]);
  const active=useMemo(()=>emps.filter(e=>e.status!=='퇴사').slice().sort((a,b)=>(a.team||'').localeCompare(b.team||'')||(a.name||'').localeCompare(b.name||'')),[emps]);
  const reports=useMemo(()=>emps.filter(e=>e.status!=='퇴사' && me && e.manager_id===me.id),[emps,me]);
  const isManager=reports.length>0;
  // 전체(HR) 요약표 데이터 — 1인 1줄
  const [allRows,setAllRows]=useState(null);
  useEffect(()=>{ (async()=>{
    if(!isAdmin||!cid){ setAllRows(null); return; }
    const [tg,kp,ks]=await Promise.all([
      sb.from('eval_targets').select('employee_id,eval_type').eq('cycle_id',cid),
      sb.from('eval_kpi').select('employee_id,category,weight,rubric_s,evidence,r1_grade,r2_grade,final_grade,r1_bonus,r2_bonus,final_score').eq('cycle_id',cid),
      sb.from('eval_kpi_status').select('employee_id,status,stage,approver_id').eq('cycle_id',cid)
    ]);
    if(tg.error||kp.error||ks.error){ setAllRows([]); return; }
    const byEmp={};
    (kp.data||[]).forEach(function(k){ (byEmp[k.employee_id]=byEmp[k.employee_id]||[]).push(k); });
    const stMap={}; (ks.data||[]).forEach(function(x){ stMap[x.employee_id]=x; });
    const rows=(tg.data||[]).map(function(t){
      const e=empById[t.employee_id]; if(!e) return null;
      const ks2=byEmp[t.employee_id]||[];
      const main=ks2.filter(function(k){ return String(k.category||'')!=='계획외'; });
      const w=main.reduce(function(a,k){ return a+Number(k.weight||0); },0);
      const rub=main.filter(function(k){ return String(k.rubric_s||'').trim()!==''; }).length;
      const evi=main.filter(function(k){ return String(k.evidence||'').trim()!==''; }).length;
      const scored=main.filter(function(k){ return k.final_grade||k.r2_grade||k.r1_grade; }).length;
      const stt=stMap[t.employee_id];
      return { e:e, evalType:t.eval_type||'REGULAR', n:main.length, w:w, rub:rub, evi:evi, scored:scored,
               st:(stt&&stt.status)||'NONE', stage:(stt&&stt.stage)||1,
               appr:(stt&&stt.approver_id)?empById[stt.approver_id]:null,
               total:kpiTotalOf(ks2, e, cfg) };
    }).filter(Boolean);
    rows.sort(function(a,b){ return (a.e.team||'').localeCompare(b.e.team||'')||(a.e.name||'').localeCompare(b.e.name||''); });
    setAllRows(rows);
  })(); },[isAdmin, cid, emps]);

  const isApprover=useMemo(()=>{
    if(!me) return false;
    if(isAdmin) return true;
    return active.some(function(e){ return approvalLine(e,empById).some(function(x){ return x && x.id===me.id; }); });
  },[me&&me.id,isAdmin,active,empById]);
  const cycle=cycles.find(c=>c.cycle_id===cid);
  const today=todayStr();
  const withinDates = cycle ? ((!cycle.kpi_input_start || today>=String(cycle.kpi_input_start).slice(0,10)) && (!cycle.kpi_input_end || today<=String(cycle.kpi_input_end).slice(0,10))) : false;
  const inputOpen = !!(cycle && cycle.kpi_input_open!==false && withinDates);
  const closedReason = !cycle ? '' : (cycle.kpi_input_open===false ? 'KPI 입력기간이 닫혀 있습니다(인사부에서 엽니다).' : (!withinDates ? ('KPI 입력 가능 기간이 아닙니다. 기간: '+(cycle.kpi_input_start||'-')+' ~ '+(cycle.kpi_input_end||'-')) : ''));
  const pill=on=>"px-4 py-2 text-sm rounded-lg border transition "+(on?"bg-indigo-600 border-indigo-600 text-white font-bold":"bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700/40");

  if(!me) return <Stub title="KPI · 면담" desc="로그인 계정이 직원 정보와 연결되지 않았습니다. 관리자에게 이메일 등록을 문의하세요." />;

  return (
    <div>
      {/* 확정·마감된 회차를 보고 있으면 '지난 회차 열람' 임을 명확히 한다 */}
      {cycle && (cycle.status==='FINALIZED'||cycle.status==='CLOSED')
        ? <div className="mb-4 rounded-xl border border-indigo-200 dark:border-indigo-900 bg-indigo-50 dark:bg-indigo-950/40 px-4 py-3 text-sm text-indigo-800 dark:text-indigo-200">
            ✅ <b>{cycle.name}</b>은(는) <b>{cycle.status==='FINALIZED'?'확정':'마감'}</b>되었습니다 — 평가·채점은 종료되었고, 작성된 <b>KPI는 열람 전용</b>입니다.
            <div className="text-[12px] mt-1 text-indigo-700/80 dark:text-indigo-300/80"><b>분기 면담</b>과 <b>평가 피드백</b>은 계속 작성·확정할 수 있습니다. 다른 회차를 보려면 오른쪽 위에서 평가주기를 바꾸세요.</div>
          </div>
        : cfg.kpi_enabled==='false'
        ? <div className="mb-4 rounded-xl border border-amber-200 dark:border-amber-900 bg-amber-50 dark:bg-amber-950/40 px-4 py-3 text-sm text-amber-800 dark:text-amber-200">📌 이번 평가는 <b>역량평가만</b> 진행됩니다. KPI(성과) 작성·승인은 이번 회차에서 <b>생략</b>되며, 아래 <b>면담 기록</b>은 그대로 사용합니다.</div>
        : <div className="mb-4 rounded-xl border border-emerald-200 dark:border-emerald-900 bg-emerald-50 dark:bg-emerald-950/40 px-4 py-3 text-sm text-emerald-800 dark:text-emerald-200">📌 이번 평가는 <b>역량 + KPI(성과)</b>로 진행됩니다. 아래에서 KPI를 작성·수정하고 <b>[승인 요청]</b>하세요. (하반기 등 확정 후 수정 시 재승인)</div>}
      <div className="flex gap-2 mb-4 flex-wrap items-center">
        <button onClick={()=>setView('mine')} className={pill(view==='mine')}>내 KPI · 면담</button>
        {isManager && <button onClick={()=>setView('team')} className={pill(view==='team')}>팀원 ({reports.length})</button>}
        {isApprover && <button onClick={()=>setView('approve')} className={pill(view==='approve')+" relative"}>승인 대기{pendingN>0&&<span className="ml-1.5 inline-flex items-center justify-center min-w-[18px] h-[18px] px-1 rounded-full bg-rose-500 text-white text-[10px] font-bold">{pendingN}</span>}{isAdmin&&unlockN>0&&<span title="확정 기록 수정 요청" className="ml-1 inline-flex items-center justify-center min-w-[18px] h-[18px] px-1 rounded-full bg-indigo-500 text-white text-[10px] font-bold">{unlockN}</span>}</button>}
        {isAdmin && <button onClick={()=>setView('all')} className={pill(view==='all')}>전체(HR)</button>}
        <span className="flex-1" />
        <select value={cid} onChange={e=>setCid(e.target.value)} className="inp !w-52">
          <option value="">평가주기 선택</option>
          {cycles.map(c=><option key={c.cycle_id} value={c.cycle_id}>{c.name}</option>)}
        </select>
      </div>
      {!cid ? <div className="text-slate-400 dark:text-slate-500 text-sm py-6">평가주기를 선택하세요.</div> : (
        <div>
          {view==='mine' && (
            <div>
              {closedReason && <div className="text-xs text-amber-700 dark:text-amber-300 bg-amber-50 dark:bg-amber-950 border border-amber-200 dark:border-amber-900 rounded-lg px-3 py-2 mb-3">{closedReason} (조회만 가능)</div>}
              {inputOpen && cycle.kpi_input_end && <div className="text-xs text-slate-400 dark:text-slate-500 mb-2">KPI 입력 마감: {String(cycle.kpi_input_end).slice(0,10)}</div>}
              <PersonPanel person={me} cid={cid} kpiEditable={inputOpen} feedbackEditable={false} me={me} empById={empById} cfg={cfg} setBusy={setBusy} flash={flash} setErr={setErr} comps={comps} grades={grades} cycleName={cycle?cycle.name:''} cycleHalf={cycle?cycle.half:''} isHR={isAdmin} cycles={cycles} />
            </div>
          )}
          {view==='team' && (
            <div>
              <div className="flex gap-2 flex-wrap mb-3">
                {reports.map(r=><button key={r.id} onClick={()=>setTeamSel(r.id)} className={"text-sm px-3 py-1.5 rounded-lg border "+(teamSel===r.id?"bg-slate-900 text-white border-slate-900":"bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700/40")}>{r.name} <span className="text-xs opacity-70">{r.position}</span></button>)}
              </div>
              {!teamSel ? <div className="text-slate-400 dark:text-slate-500 text-sm py-6">면담·피드백할 팀원을 선택하세요.</div> :
                <PersonPanel person={empById[teamSel]} cid={cid} kpiEditable={false} feedbackEditable={true} me={me} empById={empById} cfg={cfg} setBusy={setBusy} flash={flash} setErr={setErr} comps={comps} grades={grades} cycleName={cycle?cycle.name:''} cycleHalf={cycle?cycle.half:''} isHR={isAdmin} cycles={cycles} />}
            </div>
          )}
          {view==='approve' && <div className="space-y-3">
            {isAdmin && <UnlockReqPanel cid={cid} empById={empById} setBusy={setBusy} flash={flash} setErr={setErr} />}
            <ApprovalsPanel me={me} cid={cid} empById={empById} cfg={cfg} setBusy={setBusy} flash={flash} setErr={setErr} />
          </div>}
          {view==='all' && (
            <div className="space-y-3">
              {!allRows ? <div className="text-slate-400 dark:text-slate-500 text-sm py-6">불러오는 중…</div> :
               allRows.length===0 ? <div className="text-slate-400 dark:text-slate-500 text-sm py-6">평가 대상자가 없습니다. [평가 관리 → 대상자 지정]에서 생성하세요.</div> : (
                <div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl overflow-hidden">
                  <div className="px-3.5 py-2 border-b border-slate-200 dark:border-slate-700 flex items-center gap-2 flex-wrap">
                    <span className="text-[13px] font-bold text-slate-800 dark:text-slate-100">전체 {allRows.length}명</span>
                    <span className="text-[11px] text-slate-500 dark:text-slate-400">이름을 누르면 아래에 상세가 열립니다</span>
                    <span className="text-[11px] px-2 py-0.5 rounded-lg bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300"
                      title="등급기준·실적근거·채점 열은 「작성된 항목 수 / 전체 항목 수」입니다. 초록 = 전부 완료, 회색 = 아직 남음">
                      📊 <b>KPI 작성 현황</b> — 「작성 / 전체」 항목 수 · 초록이면 완료</span>
                    <span className="flex-1" />
                    {(function(){
                      const bad=allRows.filter(function(r){ return r.evalType!=='EXCLUDED' && r.w!==100; }).length;
                      const noR=allRows.filter(function(r){ return r.evalType!=='EXCLUDED' && r.n>0 && r.rub<r.n; }).length;
                      return <span className="text-[11px] text-slate-500 dark:text-slate-400">
                        {bad>0 && <b className="text-rose-600 dark:text-rose-400">배점≠100 {bad}명</b>}
                        {bad>0&&noR>0?' · ':''}
                        {noR>0 && <b className="text-amber-600 dark:text-amber-400">등급기준 미완 {noR}명</b>}
                        {bad===0&&noR===0 && <b className="text-emerald-600 dark:text-emerald-400">기준 이상 없음</b>}
                      </span>;
                    })()}
                  </div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-[12px]">
                      <thead className="bg-slate-50 dark:bg-slate-900/60 text-[11px] text-slate-400 dark:text-slate-500">
                        <tr>
                          <th className="text-left px-3 py-1.5 font-normal">이름</th>

                              {r.st==='SUBMITTED'&&r.appr && <span className="text-[10.5px] text-slate-400 dark:text-slate-500 ml-1">{r.appr.name}</span>}

                <PersonPanel person={empById[allSel]} cid={cid} kpiEditable={true} feedbackEditable={true} me={me} empById={empById} cfg={cfg} setBusy={setBusy} flash={flash} setErr={setErr} comps={comps} grades={grades} cycleName={cycle?cycle.name:''} cycleHalf={cycle?cycle.half:''} isHR={isAdmin} cycles={cycles} />}
            </div>

      )}
    </div>
  );
}

// 저장 실패 원인을 담당자가 이해할 수 있는 문장으로 변환
function fbErrMsg(err, name){
  var m=(err&&err.message)||'';
  if(/row-level security|violates row level|permission denied/i.test(m)){
    return '저장 권한이 없어 저장되지 않았습니다. (' + (name||'') + ')\n\n원인: 이 직원의 [직속상사]가 본인으로 지정되어 있지 않거나, 인사평가 관리자 권한이 없습니다.\ne-HR → 임직원 관리에서 직속상사 지정을 확인하고, 계속 발생하면 인사담당자에게 알려주세요.\n\n(원본 오류: ' + m + ')';
  }
  return m;
}

const LOG_KIND={ Q1:'1분기 면담', Q2:'2분기 면담', Q3:'3분기 면담', Q4:'4분기 면담', RESULT:'평가 피드백' };

function ResultFeedback({ result, cid, employeeId, me, setBusy, flash, setErr, reload, half, isHR, personName, empById, req, onRequest, onCancelReq, cycLabel, isCurrent }){
  const [fdate,setFdate]=useState(result&&result.feedback_date?String(result.feedback_date).slice(0,10):'');
  const [showLog,setShowLog]=useState(false);
  useEffect(()=>{
    setFdate(result&&result.feedback_date?String(result.feedback_date).slice(0,10):'');
  },[result&&result.id, result&&result.feedback_date, result&&result.feedback_confirmed, employeeId]);
  const pub=!!(result&&result.feedback_published);
  const done=!!(result&&result.feedback_confirmed);
  const halfLabel = half==='H2' ? '하반기' : (half==='H1' ? '상반기' : '');
  const title = (halfLabel?halfLabel+' ':'')+'평가 피드백';

  // ── 면담 기록 = 평가 피드백 (통합) ──────────────────────────────
  //   입력은 이곳 3칸(강점·개선점·합의·목표)에서만 한다. 피드백지의 별도 입력란은 제거됨.
  //   저장은 기존 컬럼(feedback)에 아래 형식으로 합쳐 넣는다 → 확정·공개·이력·수정요청 로직을 그대로 사용.
  const MK=['[강점]','[개선점]','[합의·목표]'];
  function composeFb(a,b,c){
    var out=[];
    if(String(a||'').trim()) out.push(MK[0]+'\n'+String(a).trim());
    if(String(b||'').trim()) out.push(MK[1]+'\n'+String(b).trim());
    if(String(c||'').trim()) out.push(MK[2]+'\n'+String(c).trim());
    return out.join('\n\n');
  }
  function parseFb(text){
    var t=String(text||'');
    if(!t.trim()) return { s:'', i:'', g:'', legacy:false };
    var hasMk=MK.some(function(m){ return t.indexOf(m)>=0; });
    if(!hasMk){
      // 예전에 자유 서술로 저장된 내용 — 첫 칸으로 옮겨 보존한다
      var fbS0=String((result&&result.fb_strengths)||'').trim();
      var fbI0=String((result&&result.fb_improvements)||'').trim();
      var fbG0=String((result&&result.fb_goals)||'').trim();
      if(fbS0||fbI0||fbG0) return { s:fbS0, i:fbI0, g:fbG0, legacy:true, kept:t.trim() };
      return { s:t.trim(), i:'', g:'', legacy:true };
    }
    function grab(m,next){
      var a=t.indexOf(m); if(a<0) return '';
      a+=m.length;
      var b=t.length;
      next.forEach(function(n){ var k=t.indexOf(n,a); if(k>=0 && k<b) b=k; });
      return t.slice(a,b).trim();
    }
    return { s:grab(MK[0],[MK[1],MK[2]]), i:grab(MK[1],[MK[0],MK[2]]), g:grab(MK[2],[MK[0],MK[1]]), legacy:false };
  }
  const parsed0=parseFb(result&&result.feedback);
  const [fS,setFS]=useState(parsed0.s);
  const [fI,setFI]=useState(parsed0.i);
  const [fG,setFG]=useState(parsed0.g);
  const [legacy,setLegacy]=useState(!!parsed0.legacy);
  useEffect(function(){
    var p=parseFb(result&&result.feedback);
    setFS(p.s); setFI(p.i); setFG(p.g); setLegacy(!!p.legacy);
  },[result&&result.id, result&&result.feedback, employeeId]);
  const txtNow=composeFb(fS,fI,fG);

  async function save(publish, confirm){
    var txt=composeFb(fS,fI,fG);
    var empty=!String(txt||'').trim();
    var had=!!(result&&String(result.feedback||'').trim());
    if(empty && had){ if(!await uiConfirm('이미 작성된 피드백이 있습니다.\n\n빈 내용으로 저장하면 기존 내용이 지워집니다. 계속할까요?')) return; }
    if(empty && !had){ uiAlert('피드백 내용을 입력한 뒤 저장하세요.'); return; }
    if(confirm){
      if(!fdate){ uiAlert('확정하려면 피드백일을 먼저 입력하세요.'); return; }
      if(!await uiConfirm('【'+title+' 확정】\n\n피드백일 : '+fdate+'\n\n확정하면 더 이상 수정할 수 없습니다.\n(수정이 필요하면 인사담당자의 확정 해제가 필요합니다)\n\n확정하시겠습니까?')) return;
    }
    setBusy(true);
    const res=await sb.rpc('save_result_feedback',{ p_cycle:cid, p_emp:employeeId, p_feedback:txt,
      p_publish:(publish==null?null:publish), p_date:(fdate||null), p_confirm:!!confirm });
    setBusy(false); if(res.error){ setErr(fbErrMsg(res.error, title)); return; }
    flash(confirm?(title+' 확정 완료'):(publish===true?'피드백 저장 + 공개':(publish===false?'비공개로 전환':'피드백 저장')));
    if(reload) reload();
  }
  // 확정 후에도 공개/비공개는 바꿀 수 있어야 하므로 전용 함수를 쓴다
  //  ⚠ publish_result_feedback 이 DB 에 없는 환경이 있었다. (2026-09-13)
  //     그 경우 save_result_feedback 으로 대신 처리한다.
  //     총평 내용은 그대로 두고 공개 여부만 바꾸도록 기존 값을 그대로 넘긴다.
  async function publish(v){
    setBusy(true);
    let res=await sb.rpc('publish_result_feedback',{ p_cycle:cid, p_emp:employeeId, p_publish:!!v });
    const fnMissing=(e)=>!!e && /publish_result_feedback|schema cache|does not exist|Could not find/i.test(String(e.message||''));
    if(fnMissing(res.error)){
      //  대체 ① — 저장된 총평을 그대로 다시 넘기며 공개 여부만 바꾼다
      res=await sb.rpc('save_result_feedback',{
        p_cycle:cid, p_emp:employeeId,
        p_feedback:String((result&&result.feedback)||''), p_publish:!!v,
        p_date:(fdate||null), p_confirm:false });
      //  대체 ② — 확정된 총평은 save 가 거부할 수 있다. 그때는 표를 직접 고친다.
      //     RLS 정책이 허용하는 범위에서만 동작하며, 안 되면 아래에서 오류를 보여준다.
      if(res.error){
        const up=await sb.from('eval_results')
          .update({ feedback_published: !!v })
          .eq('cycle_id', cid).eq('employee_id', employeeId).select('employee_id');
        if(!up.error && (up.data||[]).length) res={ error:null };
      }
    }
    setBusy(false);
    if(res.error){
      setErr(fbErrMsg(res.error, title)
        +'\n\n※ 공개 전환 기능이 서버에 아직 준비되지 않았을 수 있습니다. 인사담당자에게 알려 주세요.');
      return;
    }
    flash(v?'직원에게 공개했습니다':'비공개로 전환했습니다'); if(reload) reload();
  }
  async function unconfirm(){
    if(!await uiConfirm('【확정 해제】\n\n'+title+'의 확정을 해제하면 다시 수정할 수 있게 됩니다.\n해제 기록은 수정 이력에 남습니다.\n\n해제하시겠습니까?')) return;
    setBusy(true);
    const res=await sb.rpc('unconfirm_result_feedback',{ p_cycle:cid, p_emp:employeeId });
    setBusy(false); if(res.error){ setErr(fbErrMsg(res.error, title)); return; }
    flash('확정을 해제했습니다'); if(reload) reload();
  }

  return (
    <div className={"bg-white dark:bg-slate-800 border rounded-2xl p-4 "+(done?"border-emerald-300 dark:border-emerald-800":"border-slate-200 dark:border-slate-700")}>
      <div className="flex items-center justify-between gap-2 mb-2 flex-wrap">
        <h3 className="font-semibold text-slate-800 dark:text-slate-100 flex items-center gap-2 flex-wrap">
          {title}
          {cycLabel && <span className={"text-[10px] font-bold px-1.5 py-0.5 rounded "+(isCurrent?"bg-indigo-600 text-white":"bg-slate-200 dark:bg-slate-600 text-slate-600 dark:text-slate-200")}>{cycLabel}</span>}
          {done && <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-emerald-500 text-white">확정</span>}
        </h3>

function PersonPanel({ person, cid, kpiEditable, feedbackEditable, me, empById, cfg, setBusy, flash, setErr, comps, grades, cycleName, cycleHalf, isHR, cycles }){
  // ── 평가 피드백은 상반기 / 하반기 두 개가 각각 존재한다 ──
  //   저장 위치는 eval_results(cycle_id, employee_id) 이므로, 같은 연도의 H1·H2 회차를 찾아 두 장을 렌더한다.
  //   회차 이름·ID 어디에든 H1/상반기, H2/하반기 표기가 있으면 인식한다.
  function _halfOf(c){ var t=String(((c&&c.cycle_id)||'')+' '+((c&&c.name)||'')); return /H1|상반기/i.test(t)?'H1':(/H2|하반기/i.test(t)?'H2':''); }
  function _yearOf(c){ var m=String(((c&&c.cycle_id)||'')+' '+((c&&c.name)||'')).match(/(20\d{2})/); return m?m[1]:''; }

  const _curYear=_yearOf(_curCyc);
  const _curHalf=_halfOf(_curCyc);
  const h1Cyc=_curYear?((cycles||[]).find(function(c){ return _yearOf(c)===_curYear && _halfOf(c)==='H1'; })||null):null;
  const h2Cyc=_curYear?((cycles||[]).find(function(c){ return _yearOf(c)===_curYear && _halfOf(c)==='H2'; })||null):null;
  // 상·하반기를 판별할 수 없는 회차(예: 연간평가 단일 회차)는 기존처럼 한 장만 보여준다
  const splitHalf=!!(_curHalf && _curYear);
  const fbCids=(function(){ var a=[cid]; [h1Cyc,h2Cyc].forEach(function(c){ if(c&&c.cycle_id&&a.indexOf(c.cycle_id)<0) a.push(c.cycle_id); }); return a; })();

  const [fbs,setFbs]=useState([]);
  const [status,setStatus]=useState(null);
  const [result,setResult]=useState(null);
  const [showFb,setShowFb]=useState(false);
  const [editKpi,setEditKpi]=useState(null);
  const [editFb,setEditFb]=useState(null);
  const [showApprove,setShowApprove]=useState(false);
  const [selK,setSelK]=useState(null);
  const [unlockReqs,setUnlockReqs]=useState([]);
  const [resAll,setResAll]=useState([]);            // 상·하반기 결과 행 전부

    if(!cid||!person){ setKpis([]); setFbs([]); setStatus(null); return; }

      sb.from('eval_kpi').select('*').eq('cycle_id',cid).eq('employee_id',person.id).order('id'),
      sb.from('eval_feedback').select('*').eq('cycle_id',cid).eq('employee_id',person.id),
      sb.from('eval_kpi_status').select('*').eq('cycle_id',cid).eq('employee_id',person.id).maybeSingle(),
      sb.from('eval_results').select('*').in('cycle_id',fbCids).eq('employee_id',person.id),

    if(empty && prev && String(prev.content||'').trim()){
      if(!await uiConfirm((PERIOD_LABEL[period]||period)+' 면담에 이미 기록된 내용이 있습니다.\n\n빈 내용으로 저장하면 기존 기록이 지워집니다. 계속할까요?')) return;

              return <button onClick={()=>{ if(!relOn){ uiAlert('평가결과 상세(면담 피드백지)가 아직 열려 있지 않습니다.\n\n인사부에서 아래를 켜주면 바로 열람할 수 있습니다.\n  [평가 관리 → 결과 산정] → 회차 선택 → 「피드백지 · 팀장 열람 허용」\n\n※ 피드백지는 팀장·인사부 전용이며, 직원 본인에게는 공개되지 않습니다.'); return; } setShowFb(true); }}
                title={relOn?'항목별 상세 점수 · 방사형 그래프 · 서술평가를 확인합니다':'인사부가 아직 열람을 허용하지 않았습니다'}
                className={"text-xs px-2.5 py-1.5 rounded-lg border whitespace-nowrap "+(relOn
                  ?"border-indigo-300 dark:border-indigo-700 text-indigo-600 dark:text-indigo-300 hover:bg-indigo-50 dark:hover:bg-indigo-950 font-semibold"
                  :"border-slate-200 dark:border-slate-700 text-slate-400 dark:text-slate-500")}>
                📊 평가결과 보기{relOn?'':' (닫힘)'}</button>;
            })()}
          </div>
        </div>

        {kpiOnP && aLine.length>0 && st!=='DRAFT' && (
          <div className="text-[11px] flex items-center gap-1.5 flex-wrap mt-1.5 pt-1.5 border-t border-slate-100 dark:border-slate-700">
            {aLine.map(function(a,i){
              const at=status?[status.l1_approved_at,status.l2_approved_at,status.l3_approved_at][i]:null;
              const done=!!at;
              const nw=(st==='SUBMITTED') && (i===Number((status&&status.stage)||1)-1);
              return <React.Fragment key={a.id+'_'+i}>
                {i>0 && <span className="text-slate-300 dark:text-slate-600">→</span>}
                <span className={"px-1.5 py-0.5 rounded "+(nw?"bg-amber-100 dark:bg-amber-950 text-amber-700 dark:text-amber-300 font-bold":done?"bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 font-semibold":"bg-slate-100 dark:bg-slate-700 text-slate-400 dark:text-slate-500")}>
                  {done?'✓ ':''}{stageName(i)} {a.name}{done&&at?' ('+String(at).slice(5,10)+')':''}{nw?' 검토중':''}</span>
              </React.Fragment>;
            })}
          </div>
        )}
        {kpiOnP && aLine.length>0 && st==='DRAFT' && <div className="text-[11px] text-slate-400 dark:text-slate-500 mt-1.5 pt-1.5 border-t border-slate-100 dark:border-slate-700">승인 예정: {aLine.map((a,i)=>stageName(i)+' '+a.name).join(' → ')}</div>}
        {kpiOnP && st==='REJECTED' && status && status.reject_reason && (
          <div className="text-[11.5px] text-rose-700 dark:text-rose-300 bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-900 rounded-lg px-2.5 py-1.5 whitespace-pre-line mt-1.5">
            <b>{stageName(Number(status.reject_stage||1)-1)} 보완 요청:</b> {status.reject_reason}
          </div>
        )}
      </div>

      {kpiOnP && warnList.length>0 && (
        <div className="rounded-xl border border-amber-200 dark:border-amber-900 bg-amber-50 dark:bg-amber-950/40 px-3.5 py-2 text-[11.5px] text-amber-800 dark:text-amber-200">
          <b>작성기준 확인</b> — {warnList.join(' · ')}
        </div>
      )}

      {kpiOnP && (sortedK.length===0
        ? <div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-8 text-center text-slate-400 dark:text-slate-500 text-sm">등록된 업무목표가 없습니다.{canEdit?' [+ 항목]으로 등록하세요.':''}</div>
        : <div className="grid grid-cols-1 lg:grid-cols-[minmax(0,0.8fr)_minmax(0,1.4fr)] gap-3">

          <div className="min-w-0">
            <div className="bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl overflow-hidden">
              {[['필수중점',kEss],['도전창의',kChl],['계획외',kExt]].map(function(g){
                if(g[1].length===0 && g[0]==='계획외') return null;
                return <div key={g[0]}>
                  <div className={"px-3 py-1.5 text-[10.5px] font-bold border-b border-slate-200 dark:border-slate-700 "+KPI_CAT_STYLE[g[0]]}>
                    {g[0]} {g[1].length}개 {g[0]!=='계획외'?('· '+wOf(g[1])+'점'):'· 가산 최대 '+bonusCap+'점'}
                  </div>
                  {g[1].length===0
                    ? <div className="px-3 py-2.5 text-[11px] text-amber-600 dark:text-amber-400">항목이 없습니다{canEdit?' — [+ 항목]에서 추가':''}</div>
                    : g[1].map(rowOf)}
                </div>;
              })}
            </div>
            <div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2.5 mt-2.5">
              <div className="text-[11px] text-slate-500 dark:text-slate-400 mb-1.5">분기 면담 {fbs.length}/4</div>
              <div className="flex gap-1">
                {PERIODS.map(function(pr){
                  const has=!!fbByPeriod(pr);
                  return <span key={pr} className={"flex-1 text-center text-[10.5px] py-1 rounded "+(has?"bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 font-bold":"bg-slate-100 dark:bg-slate-700 text-slate-400 dark:text-slate-500")}>{pr}</span>;
                })}
              </div>
            </div>
          </div>

          <div className="min-w-0">
            {!curK ? <div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-8 text-center text-sm text-slate-400 dark:text-slate-500">왼쪽에서 항목을 선택하세요.</div> : (
              <div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-4">
                <div className="flex items-start justify-between gap-3 flex-wrap">
                  <div className="min-w-0 flex-1">
                    <div className="flex items-center gap-2 flex-wrap">
                      <span className={"text-[10.5px] font-bold px-1.5 py-0.5 rounded border "+KPI_CAT_STYLE[kpiCatOf(curK)]}>{kpiCatOf(curK)}</span>
                      <span className="text-[15px] font-bold text-slate-800 dark:text-slate-100 whitespace-pre-line">{curK.kpi_name}</span>
                    </div>
                    {curK.metric && <div className="text-[11.5px] text-slate-500 dark:text-slate-400 mt-1 whitespace-pre-line">{curK.metric}</div>}
                    <div className="text-[11px] text-slate-400 dark:text-slate-500 mt-1.5 flex gap-3 flex-wrap">
                      <span>목표치 <b className="text-slate-600 dark:text-slate-300">{curK.target_text||(curK.target_value==null?'-':curK.target_value)}</b></span>
                      <span>일정 <b className="text-slate-600 dark:text-slate-300">{curK.schedule||'-'}</b></span>
                      {kpiCatOf(curK)!=='계획외' && <span>배점 <b className="text-slate-600 dark:text-slate-300">{curK.weight||0}점</b></span>}
                    </div>
                  </div>
                  {canEdit && <div className="shrink-0 whitespace-nowrap">
                    <button onClick={()=>setEditKpi(curK)} className="text-xs text-indigo-600 hover:underline mr-2">수정</button>
                    <button onClick={()=>delKpi(curK)} className="text-xs text-red-500 hover:underline">삭제</button>
                  </div>}
                </div>

                {kpiCatOf(curK)!=='계획외' && (hasRubric(curK)
                  ? <div className="mt-3">
                      <div className="text-[10px] font-bold text-slate-400 dark:text-slate-500 mb-1">등급 기준</div>
                      <GradeScale k={curK} cur={curK.final_grade||curK.r2_grade||curK.r1_grade||curK.self_grade||''} cfg={cfg} disabled={true} />
                    </div>
                  : <div className="mt-3 text-[11px] text-amber-700 dark:text-amber-300 bg-amber-50 dark:bg-amber-950/40 border border-amber-100 dark:border-amber-900 rounded-lg px-2.5 py-1.5">⚠ 등급기준(S~D)이 비어 있습니다.{canEdit?' [수정]에서 채워주세요 — 승인자가 판단할 근거가 됩니다.':''}</div>
                )}
                {kpiCatOf(curK)==='계획외' && <div className="mt-3 text-[11px] text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-lg px-2.5 py-1.5">계획외실적은 <b>등급을 매기지 않습니다.</b> 본인은 실적만 기재하고, 1차·2차 평가자가 <b>가산점(전체 최대 {bonusCap}점)</b>을 직접 부여합니다.</div>}

                <div className="mt-3">
                  <div className="text-[10px] font-bold text-emerald-700 dark:text-emerald-300 mb-1">{kpiCatOf(curK)==='계획외'?'실적 내용':'내 실적 근거'} {canEdit?<span className="font-normal text-slate-400 dark:text-slate-500">— [수정]에서 작성</span>:null}</div>
                  {curK.evidence
                    ? <div className="text-[11.5px] text-slate-700 dark:text-slate-200 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-100 dark:border-emerald-900 rounded-lg px-2.5 py-2 whitespace-pre-line">{curK.evidence}</div>
                    : <div className="text-[11.5px] text-slate-400 dark:text-slate-500 border border-dashed border-slate-300 dark:border-slate-600 rounded-lg px-2.5 py-2">아직 작성하지 않았습니다. 수치·건수 등 구체적인 실적을 적으면 승인이 빨라집니다.</div>}
                </div>

                {(curK.self_grade||curK.r1_grade||curK.r2_grade||curK.final_grade||curK.r1_bonus!=null||curK.r2_bonus!=null) && (
                  <div className="mt-3 pt-2.5 border-t border-slate-100 dark:border-slate-700 flex gap-3 flex-wrap text-[11px]">
                    {kpiCatOf(curK)==='계획외' ? <React.Fragment>
                      {curK.r1_bonus!=null && <span className="text-slate-500 dark:text-slate-400">1차 가산 <b className="text-slate-700 dark:text-slate-200">{curK.r1_bonus}점</b></span>}
                      {curK.r2_bonus!=null && <span className="text-slate-500 dark:text-slate-400">2차 가산 <b className="text-slate-700 dark:text-slate-200">{curK.r2_bonus}점</b></span>}
                    </React.Fragment> : <React.Fragment>
                      {curK.self_grade && <span className="text-slate-500 dark:text-slate-400">본인 <b className="text-slate-700 dark:text-slate-200">{curK.self_grade}</b></span>}
                      {curK.r1_grade && <span className="text-slate-500 dark:text-slate-400">1차 <b className="text-slate-700 dark:text-slate-200">{curK.r1_grade}</b> ({kpiPts(curK.weight,curK.r1_grade,cfg)}점)</span>}
                      {curK.r2_grade && <span className="text-slate-500 dark:text-slate-400">2차 <b className="text-slate-700 dark:text-slate-200">{curK.r2_grade}</b> ({kpiPts(curK.weight,curK.r2_grade,cfg)}점)</span>}
                      {curK.final_grade && <span className="text-amber-700 dark:text-amber-300">최종조정 <b>{curK.final_grade}</b></span>}
                    </React.Fragment>}
                    {kpiItemScore(curK,person,cfg)!=null && <span className="text-emerald-700 dark:text-emerald-300 font-bold">획득 {kpiItemScore(curK,person,cfg)}점</span>}
                    {curK.r1_comment && <span className="text-slate-400 dark:text-slate-500">· 1차: {curK.r1_comment}</span>}
                    {curK.r2_comment && <span className="text-slate-400 dark:text-slate-500">· 2차: {curK.r2_comment}</span>}
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      )}

      <div>
        <div className="flex items-center justify-between mb-1.5">
          <h3 className="text-[13px] font-semibold text-slate-800 dark:text-slate-100">분기 면담 · 피드백 {cycleName && <span className="font-normal text-slate-400 dark:text-slate-500">— {cycleName}</span>}</h3>
          <span className="text-[11px] text-slate-400 dark:text-slate-500">{feedbackEditable?'분기별로 기록·수정':'팀장/인사부가 기록'}</span>
        </div>
        <p className="text-[11px] text-slate-400 dark:text-slate-500 mb-1.5">분기별로 <b>면담일을 적고 [확정]</b>을 누르면 그 분기 면담은 잠기고 더 이상 수정할 수 없습니다(확정 해제는 인사담당자만). 확정 전에는 [저장]으로 자유롭게 수정할 수 있고, 모든 수정은 <b>이력</b>에 남습니다. 면담 기록은 <b>평가주기별로 따로 저장</b>됩니다.</p>
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5">
          {PERIODS.map(pr=><FeedbackCard key={person.id+'_'+pr} pr={pr} fb={fbByPeriod(pr)} editable={feedbackEditable} empById={empById} onSave={saveFb} onUnconfirm={unconfirmFb} isHR={isHR} cid={cid} employeeId={person.id} personName={person.name} req={reqOf(pr)} onRequest={requestUnlock} onCancelReq={cancelUnlock} />)}
        </div>
      </div>

      {feedbackEditable && (splitHalf ? (
        <div>
          <div className="flex items-center justify-between mb-1.5 mt-4 flex-wrap gap-2">
            <h3 className="text-[13px] font-semibold text-slate-800 dark:text-slate-100">평가 피드백 <span className="font-normal text-slate-400 dark:text-slate-500">— {_curYear}년 상반기 · 하반기</span></h3>
            <span className="text-[11px] text-slate-400 dark:text-slate-500">반기별로 따로 작성·확정</span>
          </div>
          <p className="text-[11px] text-slate-400 dark:text-slate-500 mb-2">평가 피드백은 <b>상반기·하반기 각각 별도로 저장</b>됩니다. 지금 진행중인 회차가 아닌 쪽도 열람·작성할 수 있고, <b>확정</b>하면 그 반기 피드백만 잠깁니다.</p>
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
            {[['H1','상반기',h1Cyc],['H2','하반기',h2Cyc]].map(function(x){
              const hf=x[0], hl=x[1], cy=x[2];
              if(!cy) return (
                <div key={hf} className="bg-slate-50 dark:bg-slate-900/40 border border-dashed border-slate-300 dark:border-slate-600 rounded-2xl p-4">
                  <h3 className="font-semibold text-slate-500 dark:text-slate-400 mb-1.5">{hl} 평가 피드백</h3>
                  <div className="text-[12px] text-slate-500 dark:text-slate-400 leading-relaxed">
                    <b>{_curYear}년 {hl} 평가주기가 아직 없습니다.</b><br/>
                    피드백은 평가주기별로 저장되므로, 먼저 회차를 만들어야 작성할 수 있습니다.<br/>
                    <span className="text-slate-400 dark:text-slate-500">인사담당자 → [평가 관리 → 평가주기 → + 평가주기 생성]</span>
                  </div>
                </div>
              );
              const rw=resAll.find(function(r){ return r.cycle_id===cy.cycle_id; })||null;
              return <ResultFeedback key={'rf_'+person.id+'_'+cy.cycle_id} result={rw} cid={cy.cycle_id} employeeId={person.id}
                me={me} setBusy={setBusy} flash={flash} setErr={setErr} reload={load} half={hf} isHR={isHR}
                personName={person.name} empById={empById} req={reqOf('RESULT',cy.cycle_id)}
                onRequest={requestUnlock} onCancelReq={cancelUnlock}
                cycLabel={cy.cycle_id===cid?'진행 회차':cy.name||cy.cycle_id} isCurrent={cy.cycle_id===cid} />;
            })}
          </div>
        </div>
      ) : (
        <ResultFeedback key={'rf_'+person.id} result={result} cid={cid} employeeId={person.id} me={me} setBusy={setBusy} flash={flash} setErr={setErr} reload={load} half={cycleHalf} isHR={isHR} personName={person.name} empById={empById} req={reqOf('RESULT')} onRequest={requestUnlock} onCancelReq={cancelUnlock} />
      ))}
      {showFb && <FeedbackSheetModal person={person} cid={cid} comps={comps} cfg={cfg} grades={grades} empById={empById} cycleName={cycleName} onClose={()=>{ setShowFb(false); load(); }} reload={load} setErr={setErr} me={me} flash={flash} setBusy={setBusy} isHR={isHR} />}
      {showApprove && status && <ApprovalModal row={status} emp={person} me={me} cid={cid} empById={empById} cfg={cfg} reload={()=>{ setShowApprove(false); load(); }} setBusy={setBusy} flash={flash} setErr={setErr} onClose={()=>setShowApprove(false)} />}
      {editKpi && <KpiEditModal k={editKpi} cid={cid} eid={person.id} cfg={cfg} reload={load} setBusy={setBusy} flash={flash} setErr={setErr} onClose={()=>setEditKpi(null)} />}
      {editFb && <FeedbackModal fb={editFb} cid={cid} employeeId={person.id} authorId={me.id} reload={load} setBusy={setBusy} flash={flash} setErr={setErr} onClose={()=>setEditFb(null)} />}
    </div>
  );
}

function FeedbackModal({ fb, cid, employeeId, authorId, reload, setBusy, flash, setErr, onClose }){
  const [period,setPeriod]=useState(fb.period||'Q1');
  const [content,setContent]=useState(fb.content||'');
  async function save(){
    setBusy(true);
    const res=await sb.from('eval_feedback').upsert({ cycle_id:cid, employee_id:employeeId, author_id:authorId, period, content, updated_at:new Date().toISOString() },{ onConflict:'cycle_id,employee_id,period' });
    setBusy(false);
    if(res.error){ setErr(res.error.message); return; }
    flash('면담 기록이 저장되었습니다'); await reload(); onClose();
  }
  async function del(){
    if(!fb.id){ onClose(); return; }
    if(!await uiConfirm('이 면담 기록을 삭제할까요?')) return;
    setBusy(true); const res=await sb.from('eval_feedback').delete().eq('id',fb.id); setBusy(false);
    if(res.error){ setErr(res.error.message); return; }
    flash('삭제되었습니다'); await reload(); onClose();
  }
  return (
    <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4" onClick={onClose}>
      <div className="bg-white dark:bg-slate-800 rounded-2xl w-full max-w-lg p-5" onClick={ev=>ev.stopPropagation()}>
        <h3 className="font-bold text-slate-800 dark:text-slate-100 mb-4">분기 면담 기록</h3>
        <div className="space-y-3">
          <Field label="분기"><select value={period} onChange={e=>setPeriod(e.target.value)} disabled={!!fb.id} className="inp">{['Q1','Q2','Q3','Q4'].map(q=><option key={q} value={q}>{q}</option>)}</select></Field>
          <Field label="면담 내용 / 피드백"><textarea value={content} onChange={e=>setContent(e.target.value)} rows="6" className="inp" placeholder="목표 진척, 강점·개선점, 코칭 내용 등을 기록하세요." /></Field>
        </div>
        <div className="flex justify-between items-center mt-5">
          {fb.id ? <button onClick={del} className="text-sm text-red-600 hover:text-red-700">삭제</button> : <span />}
          <div className="flex gap-2">
            <button onClick={onClose} className="px-4 py-2 text-sm text-slate-600 dark:text-slate-300 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">취소</button>
            <button onClick={save} className="px-4 py-2 text-sm bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">저장</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function KpiEditModal({ k, cid, eid, cfg, reload, setBusy, flash, setErr, onClose }){
  const isNew=!!k._new;
  const [f,setF]=useState({
    category:k.category||'필수중점',
    kpi_name:k.kpi_name||'', metric:k.metric||'',
    target_text:k.target_text!=null?k.target_text:(k.target_value!=null?String(k.target_value):''),
    schedule:k.schedule||'', weight:k.weight!=null?k.weight:'',
    rubric_s:k.rubric_s||'', rubric_a:k.rubric_a||'', rubric_b:k.rubric_b||'',
    rubric_c:k.rubric_c||'', rubric_d:k.rubric_d||'',
    evidence:k.evidence||'', self_grade:k.self_grade||'', comment:k.comment||''
  });
  const set=(key,v)=>setF(s=>Object.assign({},s,{[key]:v}));
  const cf=cfg||{};
  const isExtra=f.category==='계획외';
  const W=[5,10,15,20,25,30];
  const wNum=Number(f.weight||0);
  async function save(){
    if(!String(f.kpi_name).trim()){ uiAlert('업무목표 항목명을 입력하세요.'); return; }

function parseRatio(str){ const a=String(str||'60:40').split(':'); const x=Number(a[0]), y=Number(a[1]); return [isNaN(x)?60:x, isNaN(y)?40:y]; }
var RATIO_POSITIONS=['대표이사','본부장','팀장','파트장','매니저','연구원'];
function tierRatio(person, evalType, cfg){
  if(evalType==='SIMPLE') return { key:'간이', ratio:parseRatio(cfg.ratio_simple||cfg.ratio_new||'100:0') };
  var pos=String((person&&person.position)||'')+' '+String((person&&person.rank)||'');
  var def={대표이사:cfg.ratio_leader||'40:60',본부장:cfg.ratio_leader||'40:60',팀장:cfg.ratio_leader||'40:60',파트장:cfg.ratio_partlead||'50:50',매니저:cfg.ratio_general||'60:40',연구원:cfg.ratio_general||'60:40'};
  for(var i=0;i<RATIO_POSITIONS.length;i++){ var P=RATIO_POSITIONS[i]; if(pos.indexOf(P)>=0) return { key:P, ratio:parseRatio(cfg['ratio_pos_'+P]||def[P]) }; }
  if(/대표|이사|본부장|팀장/.test(pos)) return { key:'리더', ratio:parseRatio(cfg['ratio_pos_팀장']||cfg.ratio_leader||'40:60') };
  return { key:'일반', ratio:parseRatio(cfg['ratio_pos_연구원']||cfg.ratio_general||'60:40') };
}
// ══ 종합점수 → 등급 : 판정 규칙 (2026-08-05 확정) ═══════════════════
//
//  【규칙】 「종합점수 ≥ 최소점수」인 등급 중 가장 높은 등급.
//          최대점수는 판정에 쓰지 않는다 — 화면 표시용이다.
//
//    예) S 90 / A 80 / B 65 / C 50 / D 0
//        64.99  → C   (50 이상, 65 미만)
//        65     → B   (65 이상)
//        89.995 → A   (80 이상, 90 미만)
//        100    → S
//
//  【왜 바꿨나】 min~max 를 둘 다 비교하던 방식은 두 가지가 구조적으로 깨진다.
//    (1) 소수점 빈틈 — A 최대 89.99 / S 최소 90 이면 89.995 가 어느 구간에도
//        없어서 조용히 최저등급으로 떨어진다. 89.99·79.99·49.99 모두 같은 문제다.
//    (2) 경계 겹침 — C 최대 65 / B 최소 65 면 65 점이 어느 등급인지 표에 없다.
//        예전에는 DB 정렬 순서(min 내림차순)에 따라 우연히 B 가 됐을 뿐이다.
//    최소점수만 쓰면 빈틈도 겹침도 구조적으로 생길 수 없다.
//
//  【반올림】 화면의 종합점수는 소수 1자리로 표시된다. 판정도 같은 값으로 해야
//    「80.0 인데 왜 A 가 아닌가」 같은 어긋남이 생기지 않는다.
//    예전에는 표시는 80.0, 판정은 원값 79.996 이라 서로 달랐다.
// ═══════════════════════════════════════════════════════════════════
function gradeRound(score){ return Math.round((Number(score)||0)*10)/10; }

// 등급표를 최소점수 내림차순으로 정리하고 각 등급의 판정 구간을 만든다
function gradeBands(grades){
  var list=(grades||[]).filter(function(g){ return String(g.grade||'').trim()!==''; })
    .slice().sort(function(a,b){ return Number(b.min_score)-Number(a.min_score); });
  return list.map(function(g,i){
    var min=Number(g.min_score)||0;
    var upper=(i===0)?null:Number(list[i-1].min_score);   // 바로 위 등급의 최소점수 (미만)
    return { grade:g.grade, min:min, upper:upper, raise:Number(g.raise_rate)||0,
             label:(upper==null)?(min+' 이상'):(min+' 이상 ~ '+upper+' 미만'),
             autoMax:(upper==null)?100:upper };
  });
}

function gradeOfEx(score, grades){
  var bands=gradeBands(grades);
  if(!bands.length) return { grade:'-', inBand:false, band:null, shown:gradeRound(score) };
  var v=gradeRound(score);
  for(var i=0;i<bands.length;i++){
    if(v>=bands[i].min) return { grade:bands[i].grade, inBand:true, band:bands[i], shown:v };
  }
  // 가장 낮은 등급의 최소점수보다도 낮다 → 등급표가 0 부터 시작하지 않는 경우
  var low=bands[bands.length-1];
  return { grade:low.grade, inBand:false, band:low, shown:v };
}
function gradeOf(score, grades){ return gradeOfEx(score, grades).grade; }

// 등급표 점검 — 최소점수만으로 판정하므로 확인할 것이 달라진다
//   (1) 최소점수가 같은 등급이 둘 이상 → 어느 등급인지 정할 수 없다
//   (2) 가장 낮은 등급의 최소점수가 0 보다 크다 → 그 아래 점수는 판정할 수 없다
function gradeBandIssues(grades){
  var out={ dupMin:[], notFromZero:null, bands:gradeBands(grades) };
  var bands=out.bands;
  if(!bands.length) return out;
  var seen={};
  bands.forEach(function(b){ var k=String(b.min); (seen[k]=seen[k]||[]).push(b.grade); });
  Object.keys(seen).forEach(function(k){
    if(seen[k].length>1) out.dupMin.push({ min:Number(k), grades:seen[k] });
  });
  var low=bands[bands.length-1];
  if(low.min>0) out.notFromZero={ grade:low.grade, min:low.min };
  return out;
}
function parseRubric(rubric){ if(!rubric) return []; return String(rubric).replace(/\r/g,'').split(/\n+/).map(function(ln){ var m=ln.match(/^\s*([A-FSa-f])\s*[:：]\s*(.+)$/); return m?{label:m[1].toUpperCase(),desc:m[2].trim()}:null; }).filter(Boolean); }
// 역량 등급(A~F) ↔ 점수 변환 — 밴드 중앙값 사용 (A 81~100 → 90 …)
function bandMid(idx,n){ var w=100/n; return Math.round(100-(idx*w+w/2)); }
function bandLabels(rubric){
  var bs=parseRubric(rubric);
  return bs.length?bs.map(function(b){ return b.label; }):['A','B','C','D','F'];
}
function scoreToLabel(score,rubric){
  if(score==null||score==='') return '';
  var L=bandLabels(rubric); var i=rubricBandIndex(score,L.length);
  return (i>=0&&i<L.length)?L[i]:'';
}
function labelToScore(label,rubric){
  var L=bandLabels(rubric); var i=L.indexOf(label);
  if(i<0) return null; return bandMid(i,L.length);
}
function rubricBandIndex(score, n){ if(n<=0) return -1; score=Number(score)||0; var idx=Math.floor((100-score)/(100/n)); if(idx<0)idx=0; if(idx>n-1)idx=n-1; return idx; }
function rubricGet(rubric,g){ var m={}; parseRubric(rubric).forEach(function(b){ m[b.label]=b.desc; }); return m[g]||''; }
function rubricSet(rubric,g,val){ var m={}; parseRubric(rubric).forEach(function(b){ m[b.label]=b.desc; }); m[g]=val; return ['A','B','C','D','F'].filter(function(k){return (m[k]||'').trim();}).map(function(k){return k+': '+String(m[k]).trim();}).join('\n'); }
function compScoreFor(ratee, comps, cfg, rows){
  const tr=getEvalTrack(ratee), lead=isLeaderRole(ratee,cfg);
  const app=comps.filter(c=>c.active!==false && (c.track==='COMMON'||c.track===tr||(c.track==='LEADER'&&lead)||(c.track==='FOLLOWER'&&!lead)));
  // 평가 반영 정책(대표 제안): 자기·동료평가는 기본 미반영(참고만), 상향(부하→리더)은 조건부(3명↑)+리더십 항목만
  const inclSelf=String(cfg.score_include_self)==='true';
  const inclPeer=String(cfg.score_include_peer)==='true';
  const upMin=Number(cfg.upward_min_raters||3);
  const selfW=inclSelf?Number(cfg.rater_weight_self||0):0;
  const mW0=Number(cfg.rater_weight_manager||70), sW0=Number(cfg.rater_weight_subordinate||30);
  const peerNom=inclPeer?Number(cfg.rater_weight_peer||0):0;
  // 동료 표준편차 반영: 인원수·일치도로 신뢰계수 산출 → 실제 반영률 = 설정 × 신뢰계수, 줄어든 만큼 상사·부하로 재분배
  let peerFactor=1, peerN=0;
  if(inclPeer && peerNom>0){
    const prows=rows.filter(r=>r.ratee_id===ratee.id && r.rater_type==='peer' && r.score!=null);
    peerN=new Set(prows.map(r=>r.rater_id)).size;
    const targetN=Number(cfg.peer_target_n||3);
    peerFactor=(peerN===0)?0:Math.min(1, peerN/targetN);
  }
  const peerTrim=String(cfg.peer_trim)==='true';
  const peerEff=Math.round(peerNom*peerFactor*10)/10;
  const freed=peerNom-peerEff;
  const denMS=mW0+sW0;
  const mW=mW0+(denMS>0?freed*mW0/denMS:0);
  const sW=sW0+(denMS>0?freed*sW0/denMS:0);
  // ── 상사 가중치를 1차(직속상사):2차(차상위)로 분할 ──
  //   차상위가 채점하지 않은 항목은 분모에서 자동 제외되어 1차만으로 정규화된다.
  const mgr2On=String(cfg.comp_mgr2_on)==='true';
  const cmt=parseRatio(cfg.comp_mgr_tier||'70:30');
  const cmtSum=(cmt[0]+cmt[1])||100;
  const m1W=mgr2On?(mW*cmt[0]/cmtSum):mW;
  const m2W=mgr2On?(mW*cmt[1]/cmtSum):0;
  const rw={ self:selfW, manager:m1W, manager2:m2W, peer:peerEff, subordinate:sW };
  let earned=0, wsum=0, rated=0; const core=[];
  app.forEach(c=>{
    const rs=rows.filter(r=>r.ratee_id===ratee.id && r.comp_id===c.comp_id && r.score!=null);
    if(!rs.length) return;

  var rel=(kpis||[]).filter(function(k){ return k.final_score!=null && Number(k.weight)>0; });
