  "라":["네팔","몽골","미얀마","캄보디아","라오스","스리랑카"],
};
function tripCountryGrade(c){for(const[g,arr]of Object.entries(TRIP_COUNTRY_GRADE)){if(arr.some(x=>c&&c.includes(x)))return g;}return '다';}

// 국내 출장비 계산. f: {grade,region(sinai/geun/jung),days,nights,time(under4/mid/over9),meal(none/one/all),over40,nonPublic,multiVisits,transitActual,lodgingActual,carKm,toll}
function calcDomesticCost(f){
  const g=f.grade||'제5호';const region=f.region||'geun';const days=Number(f.days)||1;const nights=Number(f.nights)||0;
  const time=f.time||'mid';const meal=f.meal||'none';
  const over40=!!f.over40;const nonPublic=!!f.nonPublic;const multiVisits=!!f.multiVisits;
  const transitActual=Number(f.transitActual)||0;const lodgingActual=Number(f.lodgingActual)||0;const carKm=Number(f.carKm)||0;const toll=Number(f.toll)||0;
  let ilbiUnit=0,ilbi=0,sikUnit=0,sik=0,gyo=0,suk=0;

  // 일비
  if(region==='sinai'){ilbiUnit=TRIP_RATES.sinai[g].ilbi;ilbi=(time==='under4')?0:ilbiUnit*days;}
  else if(region==='geun'){ilbiUnit=TRIP_RATES.geun[g].ilbi;let m=1;if(time==='under4')m=0.5;if(nonPublic)m=Math.min(m,0.5);ilbi=Math.round(ilbiUnit*m)*days;}
  else{ilbiUnit=TRIP_RATES.jung[g].ilbi;let m=1;if(time==='under4')m=0.5;ilbi=Math.round(ilbiUnit*m)*days;}

  // 식비
  if(region==='sinai'){sik=0;}
  else if(region==='geun'){
    if(time==='under4')sik=0;
    else{sikUnit=over40?TRIP_RATES.geun[g].sik40:TRIP_RATES.geun[g].sik;sik=sikUnit*days;if(time==='over9')sik+=Math.round(sikUnit*0.5)*days;}
  } else {sikUnit=(time==='under4')?0:TRIP_RATES.jung[g].sik;sik=sikUnit*days;}
  if(meal==='one'&&sikUnit){sik=Math.max(0,sik-Math.round(sikUnit/2)*days);}
  else if(meal==='all'){sik=0;}

  // 교통비
  if(region==='sinai'||(region==='geun'&&!over40)){
    const flat=TRIP_RATES.sinai[g].gyo;
    if(nonPublic&&transitActual>0)gyo=transitActual;
    else gyo=flat*days;
    if(multiVisits)gyo+=Math.round(flat*0.5)*days;
  } else {
    let actual=transitActual;
    if(carKm>0)actual+=Math.round((carKm/TRIP_RATES.car.yeonbi)*TRIP_RATES.car.yuryubi)+toll;
    gyo=actual;
  }

  // 숙박비
  if(nights===0)suk=0;
  else if(region==='sinai'||(region==='geun'&&!over40))suk=0;
  else{const limit=TRIP_RATES.jung[g].sukMax;const each=Math.min(lodgingActual,limit);suk=(lodgingActual===0)?0:each*nights;}
  if(meal==='all')suk=0;

  const lines=[
    {sub:'교통비',amount:gyo},
    {sub:'일비',amount:ilbi},
    {sub:'식비',amount:sik},
    {sub:'숙박비',amount:suk},
  ];
  const total=lines.reduce((s,l)=>s+l.amount,0);
  return {type:'domestic',grade:g,region,days,nights,lines,total};
}

// 국외 출장비. f:{grade,country,days,nights,fx,meal,nonPublic,lodgingUSD,airKRW,localTransitUSD,krAirportKRW}
function calcOverseasCost(f){
  const g=f.grade||'제5호';const country=f.country||'';const days=Number(f.days)||1;const nights=Number(f.nights)||0;
  const fx=Number(f.fx)||1380;const meal=f.meal||'none';const nonPublic=!!f.nonPublic;
  const lodgingUSD=Number(f.lodgingUSD)||0;const airKRW=Number(f.airKRW)||0;const localTransitUSD=Number(f.localTransitUSD)||0;const krAirportKRW=Number(f.krAirportKRW)||0;
  const cg=tripCountryGrade(country);
  const rate=TRIP_RATES.overseas[g][cg];
  let ilbiUSD=rate.ilbi;if(nonPublic)ilbiUSD*=0.5;
  const ilbiKRW=Math.round(ilbiUSD*days*fx);
  let sikUSD=rate.sik;if(meal==='one')sikUSD=sikUSD-(sikUSD/3);else if(meal==='all')sikUSD=0;
  const sikKRW=Math.round(sikUSD*days*fx);
  let sukUSD=0;if(nights>0&&meal!=='all'){const each=Math.min(lodgingUSD,rate.suk);sukUSD=(lodgingUSD===0)?0:each*nights;}
  const sukKRW=Math.round(sukUSD*fx);
  const localKRW=Math.round(localTransitUSD*fx);
  const gyo=airKRW+krAirportKRW+localKRW;
  const lines=[
    {sub:'교통비',amount:gyo},
    {sub:'일비',amount:ilbiKRW},
    {sub:'식비',amount:sikKRW},
    {sub:'숙박비',amount:sukKRW},
  ];
  const total=lines.reduce((s,l)=>s+l.amount,0);
  return {type:'overseas',grade:g,country,countryGrade:cg,days,nights,fx,lines,total};
}

async function addToCart(lead_id,kind){
  kind=kind||'domestic';
  const u=(await sb.auth.getUser()).data.user;
  const added_by=u?u.email:null;
  const res=await sb.from('trip_cart').upsert({lead_id:String(lead_id),kind,added_by},{onConflict:'kind,lead_id,added_by'});
  return !res.error;
}
async function removeFromCart(lead_id,kind){
  kind=kind||'domestic';
  const u=(await sb.auth.getUser()).data.user;
  const added_by=u?u.email:null;
  let q=sb.from('trip_cart').delete().eq('lead_id',String(lead_id)).eq('kind',kind);
  if(added_by)q=q.eq('added_by',added_by);
  const res=await q;
  return !res.error;
}

function TripCartModal({leads,deals,contacts,acts,kind,onClose}){
  kind=kind||'domestic';
  const isDom=kind==='domestic';
  const allItems=isDom?(leads||[]):(deals||[]);
  const getId=x=>isDom?x.lead_id:String(x.id);
  const getName=x=>isDom?(x.hospital_name||x.lead_id):(x.customer||('딜 #'+x.id));
  const getRegion=x=>isDom?(x.address||''):(x.country||'');
  const getDate=x=>isDom?x.next_action_date:(x.next_action_date||null);
  const getSol=x=>isDom?(x.interest_solution||x.target_solution||''):(x.item||'');
  // 담당 의료진 (국내: lead_contacts 첫 담당)
  const doctorMap={};
  if(isDom&&contacts){contacts.forEach(c=>{if(!doctorMap[c.lead_id])doctorMap[c.lead_id]=c.contact_name||'';});}
  const getDoctor=x=>isDom?(doctorMap[x.lead_id]||'-'):(x.owner||'-');
  // 최근 활동일
  const lastActMap={};
  if(isDom&&acts){acts.forEach(a=>{if(a.lead_id&&!lastActMap[a.lead_id])lastActMap[a.lead_id]=a.activity_date;});}
  const getLastAct=x=>isDom?(lastActMap[x.lead_id]||'-'):'-';

  const [cart,setCart]=useState([]);
  const [loading,setLoading]=useState(true);
  const [busy,setBusy]=useState(false);
  const [q,setQ]=useState('');
  const [region,setRegion]=useState('');
  const [checked,setChecked]=useState({});
  const [showForm,setShowForm]=useState(false);
  const [showManage,setShowManage]=useState(false);

  async function loadCart(){
    setLoading(true);
    const u=(await sb.auth.getUser()).data.user;
    let qq=sb.from('trip_cart').select('*').eq('kind',kind).order('added_at',{ascending:false});
    if(u)qq=qq.eq('added_by',u.email);
    const {data}=await qq;
    setCart(data||[]);
    setLoading(false);
  }
  useEffect(()=>{loadCart();},[]);
  const itemMap={};allItems.forEach(x=>{itemMap[getId(x)]=x;});
  const today=new Date();today.setHours(0,0,0,0);
  const cartIds=new Set(cart.map(c=>String(c.lead_id)));

  // 지역 옵션 (앞 2글자: 서울/경기/부산 등)
  const regionOpts=[...new Set(allItems.map(x=>{const r=getRegion(x);return r?r.trim().slice(0,2):'';}).filter(Boolean))].sort();

  // 후보 목록 (장바구니 미포함 + 검색 + 지역)
  const list=allItems.filter(x=>{
    if(cartIds.has(getId(x)))return false;
    if(region&&!getRegion(x).startsWith(region))return false;
    if(q){const s=(getName(x)+' '+getDoctor(x)+' '+getRegion(x)+' '+getSol(x)).toLowerCase();if(!s.includes(q.toLowerCase()))return false;}
    return true;
  });
  // 목표일 임박 우선 정렬
  list.sort((a,b)=>{
    const da=getDate(a),db=getDate(b);
    if(da&&db)return new Date(da)-new Date(db);
    if(da)return -1;if(db)return 1;
    return getName(a).localeCompare(getName(b));
  });

  function dday(dstr){
    if(!dstr)return null;
    const d=new Date(dstr);if(isNaN(d))return null;d.setHours(0,0,0,0);
    const diff=Math.round((d-today)/(1000*60*60*24));
    if(diff<-3||diff>14)return null;
    if(diff===0)return['D-day','#EF4444'];
    if(diff<0)return['D+'+Math.abs(diff),'#F472B6'];
    return['D-'+diff,diff<=3?'#EF9F27':'#85B7EB'];
  }
  function toggleCheck(id){setChecked(p=>({...p,[id]:!p[id]}));}
  const checkedIds=Object.keys(checked).filter(k=>checked[k]);
  async function addChecked(){
    if(checkedIds.length===0)return;
    setBusy(true);
    for(const id of checkedIds){await addToCart(id,kind);}
    setChecked({});await loadCart();setBusy(false);
  }
  async function remove(id){setBusy(true);await removeFromCart(id,kind);await loadCart();setBusy(false);}
  const accent=isDom?'#5DCAA5':'#534AB7';

  if(showManage){return <TripManageModal onClose={()=>setShowManage(false)}/>;}
  if(showForm){
    const cartItems=cart.map(c=>{const x=itemMap[String(c.lead_id)]||{};return {lead_id:c.lead_id,name:getName(x),region:getRegion(x),doctor:getDoctor(x),sol:getSol(x)};});
    return <TripFormModal kind={kind} cartItems={cartItems} onClose={()=>setShowForm(false)} onSaved={()=>{setShowForm(false);loadCart();}}/>;
  }

  return (<div className="ov" style={{zIndex:60,alignItems:'flex-start',padding:'24px 16px'}}>
    <div className="modal" style={{width:760,maxWidth:'100%'}}>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:4}}>
        <span style={{fontSize:16,fontWeight:700}}>🧳 출장 후보 목록 {isDom?'(국내)':'(해외)'}</span>
        <span style={{fontSize:12,color:'var(--t3)'}}>검색·필터로 후보를 찾아 담고, 출장 신청서로 보냅니다</span>
        <button className="tbtn" style={{marginLeft:'auto',background:'linear-gradient(135deg,#185FA5,#0C447C)'}} onClick={()=>setShowManage(true)}>🗓 출장 관리</button>
        <button className="tbtn" style={{background:'rgba(255,255,255,.06)'}} onClick={onClose}>✕</button>
      </div>
      {loading?<LoadingBear/>:<div>

        {/* 담긴 후보 */}
        <div style={{margin:'12px 0 6px',fontSize:13,fontWeight:700,color:accent}}>담긴 후보 ({cart.length})</div>
        {cart.length===0?<div style={{padding:'10px',textAlign:'center',color:'var(--t3)',fontSize:12,background:'rgba(255,255,255,.03)',borderRadius:8}}>아직 담긴 후보가 없습니다. 아래에서 검색해 담아보세요.</div>:
        <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
          {cart.map(c=>{const x=itemMap[String(c.lead_id)]||{};return (
            <span key={c.id} style={{display:'inline-flex',alignItems:'center',gap:6,padding:'5px 10px',background:accent+'18',border:'0.5px solid '+accent+'55',borderRadius:20,fontSize:12}}>
              {getName(x)||c.lead_id}
              <span style={{cursor:'pointer',color:'#F472B6',fontWeight:700}} onClick={()=>remove(c.lead_id)}>✕</span>
            </span>);})}
        </div>}

        {/* 검색 + 지역 필터 */}
        <div style={{display:'flex',gap:8,margin:'16px 0 10px'}}>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder={isDom?'병원명·의료진 검색':'고객사·국가 검색'} style={{flex:1}}/>
          <select value={region} onChange={e=>setRegion(e.target.value)} style={{width:140}}>
            <option value="">{isDom?'전체 지역':'전체 국가'}</option>
            {regionOpts.map(r=><option key={r} value={r}>{r}</option>)}
          </select>
        </div>

        {/* 목록 (체크 담기) */}
        <div style={{border:'0.5px solid var(--border)',borderRadius:8,overflow:'hidden'}}>
          <div style={{display:'grid',gridTemplateColumns:'28px 1.4fr 1fr 0.8fr 0.9fr 1fr',gap:0,padding:'8px 10px',background:'rgba(255,255,255,.04)',fontSize:11,fontWeight:700,color:'var(--t2)'}}>
            <span></span><span>병원명</span><span>담당 의료진</span><span>지역</span><span>최근 활동일</span><span>관심 솔루션</span>
          </div>
          <div style={{maxHeight:280,overflowY:'auto'}}>
            {list.length===0?<div style={{padding:'18px',textAlign:'center',color:'var(--t3)',fontSize:12}}>검색 결과가 없습니다.</div>:
            list.map(x=>{const id=getId(x);const dd=dday(getDate(x));return (
              <div key={id} onClick={()=>toggleCheck(id)} style={{display:'grid',gridTemplateColumns:'28px 1.4fr 1fr 0.8fr 0.9fr 1fr',gap:0,padding:'9px 10px',borderTop:'0.5px solid var(--border)',fontSize:12,cursor:'pointer',background:checked[id]?accent+'14':'transparent',alignItems:'center'}}>
                <input type="checkbox" checked={!!checked[id]} onChange={()=>toggleCheck(id)} onClick={e=>e.stopPropagation()} style={{width:'auto'}}/>
                <span style={{fontWeight:600,display:'flex',alignItems:'center',gap:6}}>{getName(x)}{dd&&<span style={{fontSize:9,fontWeight:700,padding:'1px 6px',borderRadius:5,background:dd[1]+'22',color:dd[1]}}>{dd[0]}</span>}</span>
                <span style={{color:'var(--t2)'}}>{getDoctor(x)}</span>
                <span style={{color:'var(--t2)'}}>{getRegion(x)?getRegion(x).trim().slice(0,8):'-'}</span>
                <span style={{color:'var(--t3)',fontSize:11}}>{getLastAct(x)}</span>
                <span><SolBadges text={getSol(x)}/></span>
              </div>);})}
          </div>
        </div>

        <div style={{display:'flex',gap:8,alignItems:'center',marginTop:14}}>
          <span style={{fontSize:12,color:'var(--t3)'}}>{checkedIds.length}개 선택됨</span>
          <button className="tbtn" disabled={busy||checkedIds.length===0} style={{background:accent+'2e',color:accent}} onClick={addChecked}>+ 선택 항목 담기</button>
          <div style={{marginLeft:'auto',display:'flex',gap:8}}>
            <button className="btn-ghost" onClick={onClose}>닫기</button>
            <button className="btn" disabled={cart.length===0} onClick={()=>setShowForm(true)}>선택 항목으로 출장 신청서 작성 →</button>
          </div>
        </div>
      </div>}
    </div>
  </div>);
}

        <div><label className="lbl">출장 시작일</label><input type="date" value={f.start_date} onChange={e=>set('start_date',e.target.value)}/></div>
        <div><label className="lbl">출장 종료일</label><input type="date" value={f.end_date} onChange={e=>set('end_date',e.target.value)}/></div>
        <div style={{gridColumn:'1 / 4'}}><label className="lbl">출장 지역</label><input value={f.region_label} onChange={e=>set('region_label',e.target.value)} placeholder="예: 서울, 경기"/></div>
      </div>

      <SEC n="2" t="방문 병원과 일정"/>
      {visits.length===0?<div style={{padding:'12px',textAlign:'center',color:'var(--t3)',fontSize:12,background:'rgba(255,255,255,.03)',borderRadius:8}}>담긴 후보가 없습니다.</div>:
      <div style={{border:'0.5px solid var(--border)',borderRadius:8,overflow:'hidden'}}>
        <div style={{display:'grid',gridTemplateColumns:'34px 1fr 1.3fr 1fr 1.3fr 30px',padding:'7px 8px',background:'rgba(255,255,255,.04)',fontSize:11,fontWeight:700,color:'var(--t2)',gap:6}}>
          <span>순번</span><span>방문일</span><span>병원명</span><span>담당 의료진</span><span>방문 목적</span><span></span>
        </div>
        {visits.map((v,i)=>(<div key={i} style={{display:'grid',gridTemplateColumns:'34px 1fr 1.3fr 1fr 1.3fr 30px',padding:'6px 8px',borderTop:'0.5px solid var(--border)',gap:6,alignItems:'center'}}>
          <span style={{fontSize:12,textAlign:'center'}}>{v.seq}</span>
          <input type="date" value={v.visit_date} onChange={e=>setVisit(i,'visit_date',e.target.value)} style={{fontSize:11,padding:'5px 6px'}}/>
          <input value={v.hospital_name} onChange={e=>setVisit(i,'hospital_name',e.target.value)} style={{fontSize:11,padding:'5px 6px'}}/>
          <input value={v.doctor} onChange={e=>setVisit(i,'doctor',e.target.value)} placeholder="의료진" style={{fontSize:11,padding:'5px 6px'}}/>
          <input value={v.visit_purpose} onChange={e=>setVisit(i,'visit_purpose',e.target.value)} style={{fontSize:11,padding:'5px 6px'}}/>
          <span style={{cursor:'pointer',color:'#F472B6',textAlign:'center',fontWeight:700}} onClick={()=>removeVisit(i)}>✕</span>
        </div>))}
      </div>}

      <SEC n="3" t="출장자 및 예상 비용"/>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:10}}>
        <div><label className="lbl">직위 (출장비 등급) *</label><select value={f.grade} onChange={e=>set('grade',e.target.value)}>{GRADES.map(g=><option key={g} value={g}>{g} · {TRIP_RATES.grades[g].desc}</option>)}</select></div>
        {isDom?<>
          <div><label className="lbl">지역 구분</label><select value={cost.region} onChange={e=>setC('region',e.target.value)}><option value="sinai">시내(성남)</option><option value="geun">근거리(서울·경인)</option><option value="jung">기타지역(중장거리)</option></select></div>
          <div><label className="lbl">체류 시간</label><select value={cost.time} onChange={e=>setC('time',e.target.value)}><option value="under4">4시간 이내</option><option value="mid">4시간 초과</option><option value="over9">9시간 초과(근거리)</option></select></div>
        </>:<>
          <div><label className="lbl">방문 국가</label><input value={cost.country} onChange={e=>setC('country',e.target.value)} placeholder="예: 일본, 미국"/></div>
          <div><label className="lbl">환율(1USD=KRW)</label><input type="number" value={cost.fx} onChange={e=>setC('fx',e.target.value)}/></div>
        </>}
        <div><label className="lbl">출장 일수</label><input type="number" min="1" value={cost.days} onChange={e=>setC('days',e.target.value)}/></div>
        <div><label className="lbl">숙박 일수</label><input type="number" min="0" value={cost.nights} onChange={e=>setC('nights',e.target.value)}/></div>
        <div><label className="lbl">식사 제공</label><select value={cost.meal} onChange={e=>setC('meal',e.target.value)}><option value="none">없음</option><option value="one">1식 제공</option><option value="all">식사·숙박 모두 제공</option></select></div>
      </div>

      {isDom?<div style={{display:'flex',gap:14,flexWrap:'wrap',padding:'9px 12px',background:'rgba(255,255,255,.03)',border:'0.5px solid var(--border)',borderRadius:8,marginBottom:10,fontSize:12}}>
        <label style={{display:'flex',alignItems:'center',gap:5,cursor:'pointer'}}><input type="checkbox" checked={cost.over40} onChange={e=>setC('over40',e.target.checked)} style={{width:'auto'}}/>40km↑(중장거리 교통비)</label>
        <label style={{display:'flex',alignItems:'center',gap:5,cursor:'pointer'}}><input type="checkbox" checked={cost.nonPublic} onChange={e=>setC('nonPublic',e.target.checked)} style={{width:'auto'}}/>비대중교통(일비 1/2)</label>
        <label style={{display:'flex',alignItems:'center',gap:5,cursor:'pointer'}}><input type="checkbox" checked={cost.multiVisits} onChange={e=>setC('multiVisits',e.target.checked)} style={{width:'auto'}}/>4곳↑ 방문(교통비 1/2 추가)</label>
      </div>:null}

      {/* 실비 입력 */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:10}}>
        {isDom?<>
          <div><label className="lbl">교통비 실비(원)</label><input type="number" value={cost.transitActual} onChange={e=>setC('transitActual',e.target.value)}/></div>
          <div><label className="lbl">숙박 실비/박(원)</label><input type="number" value={cost.lodgingActual} onChange={e=>setC('lodgingActual',e.target.value)}/></div>
          <div><label className="lbl">차량 운행거리(km,왕복)</label><input type="number" value={cost.carKm} onChange={e=>setC('carKm',e.target.value)}/></div>
          <div><label className="lbl">통행료(원)</label><input type="number" value={cost.toll} onChange={e=>setC('toll',e.target.value)}/></div>
        </>:<>
          <div><label className="lbl">국제선 항공(원)</label><input type="number" value={cost.airKRW} onChange={e=>setC('airKRW',e.target.value)}/></div>
          <div><label className="lbl">숙박 실비/박(USD)</label><input type="number" value={cost.lodgingUSD} onChange={e=>setC('lodgingUSD',e.target.value)}/></div>
          <div><label className="lbl">현지교통(USD)</label><input type="number" value={cost.localTransitUSD} onChange={e=>setC('localTransitUSD',e.target.value)}/></div>
          <div><label className="lbl">국내 공항이동(원)</label><input type="number" value={cost.krAirportKRW} onChange={e=>setC('krAirportKRW',e.target.value)}/></div>
        </>}
      </div>

      {/* 비용 산출 결과 */}
      <div style={{border:'0.5px solid rgba(239,159,39,.3)',borderRadius:8,overflow:'hidden',marginBottom:12}}>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',padding:'7px 12px',background:'rgba(239,159,39,.08)',fontSize:11,fontWeight:700,color:'#EF9F27'}}><span>구분 (여비)</span><span style={{textAlign:'right'}}>신청액</span></div>
        {calc.lines.map((l,i)=>(<div key={i} style={{display:'grid',gridTemplateColumns:'1fr 1fr',padding:'7px 12px',borderTop:'0.5px solid var(--border)',fontSize:12}}><span>{l.sub}</span><span style={{textAlign:'right'}}>{won(l.amount)}원</span></div>))}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',padding:'9px 12px',borderTop:'0.5px solid rgba(239,159,39,.3)',background:'rgba(239,159,39,.06)',fontSize:13,fontWeight:700}}><span>총계</span><span style={{textAlign:'right',color:'#EF9F27'}}>{won(calc.total)}원</span></div>
      </div>

      <SEC n="4" t="출장 계획 및 목표"/>
      <textarea rows="3" value={f.plan} onChange={e=>set('plan',e.target.value)} placeholder="이번 출장의 계획 및 목표를 입력하세요."/>

      <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:16}}>
        <button className="btn-ghost" onClick={onClose}>취소</button>
        <button className="btn" disabled={saving} onClick={save}>{saving?'저장 중...':'✓ 신청서 저장'}</button>
      </div>
    </div>
  </div>);
}

function printTripPDF(trip,visits){
  var won=function(n){return (n==null||isNaN(n))?'':Math.round(n).toLocaleString('ko-KR');};
  var cj=trip.cost_json||{};
  var res=cj.result||{lines:[],total:0};
  var grade=cj.grade||'';
  var lineMap={};(res.lines||[]).forEach(function(l){lineMap[l.sub]=l.amount;});
  var byDate={};
  (visits||[]).forEach(function(v){var d=v.visit_date||'';if(!byDate[d])byDate[d]=[];byDate[d].push(v);});
  var dateKeys=Object.keys(byDate).sort();
  var fmtMD=function(ds){if(!ds)return '';var d=new Date(ds);if(isNaN(d))return ds;return (d.getMonth()+1)+'월 '+d.getDate()+'일';};
  var dest=dateKeys.map(function(d){
    var items=byDate[d].map(function(v){return v.hospital_name+(v.doctor?(' '+v.doctor):'');}).join(', ');
    return '<div>'+fmtMD(d)+' '+items+'</div>';
  }).join('')||'<div>-</div>';
  var fmtFull=function(ds){if(!ds)return '';var d=new Date(ds);if(isNaN(d))return ds;var wd=['일','월','화','수','목','금','토'][d.getDay()];return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 '+wd+'요일';};
  var dayCount='';
  if(trip.start_date&&trip.end_date){var s=new Date(trip.start_date),e=new Date(trip.end_date);var n=Math.round((e-s)/(1000*60*60*24))+1;dayCount='(총 '+n+'일)';}
  var period=(trip.start_date?fmtFull(trip.start_date):'')+' ~ '+(trip.end_date?fmtFull(trip.end_date):'')+' '+dayCount;

  var H=[];
  H.push('<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>출장신청서</title>');
  H.push('<style>');
  H.push('*{box-sizing:border-box;}');
  H.push("body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;color:#222;padding:30px 36px;font-size:13px;line-height:1.5;}");
  H.push('.notice{font-weight:700;margin-bottom:14px;font-size:13px;}');
  H.push('table{width:100%;border-collapse:collapse;}');
  H.push('td,th{border:1px solid #888;padding:7px 9px;vertical-align:middle;}');
  H.push('.lbl{background:#f3f3f3;font-weight:700;text-align:center;width:90px;}');
  H.push('.center{text-align:center;}');
  H.push('.sub{background:#fafafa;font-weight:600;text-align:center;}');
  H.push('@media print{body{padding:10mm;}}');
  H.push('</style></head><body>');
  H.push('<div class="notice">■ 출장 시행전 신청하여 주시기 바라며, 출장 종료 후 7일 이내에 출장 보고서를 제출하시기 바랍니다.</div>');
  H.push('<table>');
  H.push('<tr><td class="lbl">출장지</td><td>'+dest+'</td></tr>');
  H.push('<tr><td class="lbl">출장 기간</td><td class="center">'+period+'</td></tr>');
  H.push('<tr><td class="lbl">출장 목적</td><td>'+(trip.purpose||'')+'</td></tr>');
  H.push('<tr><td class="lbl" rowspan="4">출장자</td>');
  H.push('<td style="padding:0;"><table style="border:none;"><tr><td class="sub" style="border-top:none;border-left:none;">소속부서</td><td class="sub" style="border-top:none;">직위</td><td class="sub" style="border-top:none;">성명</td><td class="sub" style="border-top:none;border-right:none;">비고</td></tr>');
  H.push('<tr><td class="center" style="border-left:none;">'+(trip.department||'')+'</td><td class="center">'+grade+'</td><td class="center">'+(trip.applicant||'')+'</td><td class="center" style="border-right:none;"></td></tr>');
  H.push('<tr><td style="border-left:none;height:28px;"></td><td></td><td></td><td style="border-right:none;"></td></tr>');
  H.push('<tr><td style="border-left:none;border-bottom:none;height:28px;"></td><td style="border-bottom:none;"></td><td style="border-bottom:none;"></td><td style="border-right:none;border-bottom:none;"></td></tr>');
  H.push('</table></td></tr>');
  H.push('<tr><td class="lbl">출장 예상<br>비용</td><td style="padding:0;">');
  H.push('<div style="padding:6px 9px;font-size:12px;color:#555;">※ 비용산정 : 예상 출장비용 입력 요청 시 또는 사전 출장비 지급 필요시에만 작성</div>');
  H.push('<div style="padding:2px 9px 6px;font-size:12px;">1. 출장자: '+(trip.department||'')+' '+(trip.applicant||'')+' '+grade+'</div>');
  H.push('<table style="border:none;">');
  H.push('<tr><td class="sub" style="border-left:none;width:70px;">구분</td><td class="sub">기준금액</td><td class="sub">산출내역</td><td class="sub">신청액</td><td class="sub" style="border-right:none;">비고</td></tr>');
  H.push('<tr><td class="center" style="border-left:none;">참가비</td><td></td><td></td><td class="center">'+won(0)+'</td><td style="border-right:none;"></td></tr>');
  H.push('<tr><td class="center" rowspan="5" style="border-left:none;">여비</td><td class="center">교통비</td><td></td><td class="center">'+won(lineMap['교통비'])+'</td><td style="border-right:none;"></td></tr>');
  H.push('<tr><td class="center">일비</td><td></td><td class="center">'+won(lineMap['일비'])+'</td><td style="border-right:none;"></td></tr>');
  H.push('<tr><td class="center">식비</td><td></td><td class="center">'+won(lineMap['식비'])+'</td><td style="border-right:none;"></td></tr>');
  H.push('<tr><td class="center">숙박비</td><td></td><td class="center">'+won(lineMap['숙박비'])+'</td><td style="border-right:none;"></td></tr>');
  H.push('<tr><td class="center" style="font-weight:700;">합계</td><td></td><td></td><td class="center" style="font-weight:700;">'+won(res.total)+'</td><td style="border-right:none;"></td></tr>');
  H.push('<tr><td class="center" colspan="2" style="border-left:none;font-weight:700;background:#f3f3f3;">총 계</td><td></td><td class="center" style="font-weight:700;">'+won(res.total)+'</td><td style="border-right:none;"></td></tr>');
  H.push('</table></td></tr>');
  H.push('<tr><td class="lbl">별첨</td><td style="height:60px;">'+(trip.plan||'')+'</td></tr>');
  H.push('</table>');
  H.push('<scr'+'ipt>window.onload=function(){window.print();}<\/scr'+'ipt>');
  H.push('</body></html>');
  var w=window.open('','_blank');
  if(!w){alert('팝업이 차단되었습니다. 팝업을 허용해주세요.');return;}
  w.document.write(H.join(''));
  w.document.close();
}

function TripManageModal({onClose}){
  const [trips,setTrips]=useState([]);
  const [visits,setVisits]=useState([]);
  const [loading,setLoading]=useState(true);
  const [weekStart,setWeekStart]=useState(()=>{const d=new Date();const dow=d.getDay();d.setDate(d.getDate()-dow);d.setHours(0,0,0,0);return d;});
  const [busy,setBusy]=useState(false);

  async function load(){
    setLoading(true);
    const [t,v]=await Promise.all([
      sb.from('business_trips').select('*').order('start_date',{ascending:false}),
      sb.from('trip_visits').select('*').order('seq'),
    ]);
    setTrips(t.data||[]);setVisits(v.data||[]);setLoading(false);
  }
  useEffect(()=>{load();},[]);

  const STATUS_C={'예정':['#13314f','#85B7EB'],'승인':['#1d3b32','#5DCAA5'],'진행중':['#3a2f1a','#EF9F27'],'완료':['#1e3a1a','#86C45A'],'취소':['#3a2230','#ED93B1']};
  const STATUSES=['예정','승인','진행중','완료','취소'];
  const won=n=>(n==null||isNaN(n))?'-':Math.round(n).toLocaleString('ko-KR');

  // 주간 7일
  const days=[...Array(7)].map((_,i)=>{const d=new Date(weekStart);d.setDate(d.getDate()+i);return d;});
  const dstr=d=>d.toISOString().slice(0,10);
  const WD=['일','월','화','수','목','금','토'];
  // 방문일 -> 방문들 (trip 상태 포함)
  const tripMap={};trips.forEach(t=>{tripMap[t.id]=t;});
  const visitsByDate={};
  visits.forEach(v=>{if(!v.visit_date)return;if(!visitsByDate[v.visit_date])visitsByDate[v.visit_date]=[];visitsByDate[v.visit_date].push(v);});

  function moveWeek(n){const d=new Date(weekStart);d.setDate(d.getDate()+n*7);setWeekStart(d);}
  async function setStatus(id,st){setBusy(true);await sb.from('business_trips').update({status:st,updated_at:new Date().toISOString()}).eq('id',id);await load();setBusy(false);}
  async function delTrip(id){if(!confirm('이 출장 신청서를 삭제할까요? (방문 일정도 함께 삭제됩니다)'))return;setBusy(true);await sb.from('business_trips').delete().eq('id',id);await load();setBusy(false);}
  function doPrint(t){printTripPDF(t,visits.filter(v=>v.trip_id===t.id));}

  const weekLabel=days[0].getMonth()+1+'/'+days[0].getDate()+' ~ '+(days[6].getMonth()+1)+'/'+days[6].getDate();

  return (<div className="ov" style={{zIndex:62,alignItems:'flex-start',padding:'18px 12px'}}>
    <div className="modal" style={{width:980,maxWidth:'100%'}}>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
        <span style={{fontSize:16,fontWeight:700}}>🗓 출장 관리</span>
        <span style={{fontSize:12,color:'var(--t3)'}}>주간 캘린더 · 신청 목록 · 출장신청서 출력</span>
        <button className="tbtn" style={{marginLeft:'auto',background:'rgba(255,255,255,.06)'}} onClick={onClose}>✕</button>
      </div>
      {loading?<LoadingBear/>:<div>

        {/* 주간 캘린더 */}
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
          <button className="tbtn" style={{background:'rgba(255,255,255,.06)'}} onClick={()=>moveWeek(-1)}>‹ 이전주</button>
          <span style={{fontSize:13,fontWeight:700}}>{weekLabel}</span>
          <button className="tbtn" style={{background:'rgba(255,255,255,.06)'}} onClick={()=>moveWeek(1)}>다음주 ›</button>
          <button className="tbtn" style={{background:'rgba(255,255,255,.06)'}} onClick={()=>{const d=new Date();const dow=d.getDay();d.setDate(d.getDate()-dow);d.setHours(0,0,0,0);setWeekStart(d);}}>오늘</button>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:6,marginBottom:8}}>
          {days.map((d,i)=>{const ds=dstr(d);const list=visitsByDate[ds]||[];const isToday=ds===new Date().toISOString().slice(0,10);return (
            <div key={i} style={{border:'0.5px solid '+(isToday?'#EF9F27':'var(--border)'),borderRadius:8,minHeight:110,background:isToday?'rgba(239,159,39,.06)':'rgba(255,255,255,.02)',overflow:'hidden'}}>
              <div style={{padding:'5px 8px',fontSize:11,fontWeight:700,color:i===0?'#ED93B1':i===6?'#85B7EB':'var(--t2)',borderBottom:'0.5px solid var(--border)'}}>{(d.getMonth()+1)+'/'+d.getDate()+' ('+WD[i]+')'}{isToday&&<span style={{marginLeft:4,fontSize:9,color:'#EF9F27'}}>오늘</span>}</div>
              <div style={{padding:'5px',display:'flex',flexDirection:'column',gap:4}}>
                {list.map((v,j)=>{const t=tripMap[v.trip_id]||{};const sc=STATUS_C[t.status]||STATUS_C['예정'];return (
                  <div key={j} style={{padding:'4px 6px',borderRadius:5,background:sc[0],fontSize:10,lineHeight:1.3}}>
                    <div style={{fontWeight:700,color:sc[1]}}>{v.hospital_name}</div>
                    {v.doctor&&<div style={{color:'var(--t3)',fontSize:9}}>{v.doctor}</div>}
                  </div>);})}
              </div>
            </div>);})}
        </div>
        {/* 상태 범례 */}
        <div style={{display:'flex',gap:12,fontSize:11,marginBottom:16,flexWrap:'wrap'}}>
          {STATUSES.map(s=>{const sc=STATUS_C[s];return <span key={s} style={{display:'inline-flex',alignItems:'center',gap:5}}><span style={{width:9,height:9,borderRadius:'50%',background:sc[1]}}></span>{s}</span>;})}
        </div>

        {/* 신청 목록 */}
        <div style={{fontSize:13,fontWeight:700,color:'#85B7EB',marginBottom:8}}>출장 신청 목록 ({trips.length})</div>

  </div>);
}

const TYPE_C={'방문':['#13314f','#85B7EB'],'미팅':['#1d3b32','#5DCAA5'],'전화':['#2a2a28','#B4B2A9'],'메일':['#3a2f1a','#EF9F27'],'DEMO':['#2a2747','#AFA9EC'],'계약':['#1e3a1a','#86C45A'],'콜':['#2a2a28','#B4B2A9'],'PR':['#3a2230','#ED93B1'],'Demo':['#2a2747','#AFA9EC'],'BD':['#13314f','#85B7EB']};

function won(v){if(v==null||v==='')return '-';const n=Number(v);if(n>=1e8)return '₩'+(n/1e8).toFixed(1)+'억';if(n>=1e4)return '₩'+Math.round(n/1e4).toLocaleString()+'만';return '₩'+Math.round(n).toLocaleString();}
function commafy(v){if(v==null||v==='')return '';const s=String(v).replace(/[^0-9.]/g,'');if(s==='')return '';const p=s.split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');return p.join('.');}
function uncomma(v){if(v==null)return '';return String(v).replace(/,/g,'');}
function eok(v){return (Number(v||0)/1e8).toFixed(1)+'억';}
function fmtUSD(v){if(v==null||v==='')return '-';return '$'+Math.round(Number(v)).toLocaleString();}
function fmtKRW(v){if(v==null||v==='')return '-';return '₩'+Math.round(v).toLocaleString();}
function toKRW(usd,rate){if(!rate||usd==null)return null;return Number(usd)*Number(rate);}
function mondayOf(d,off){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day+off*7);x.setHours(0,0,0,0);return x;}
function weekRange(off){const m=mondayOf(new Date(),off);const s=new Date(m);s.setDate(m.getDate()+6);return [m,s];}
function inRange(ds,r){if(!ds)return false;const d=new Date(ds);d.setHours(12,0,0,0);return d>=r[0]&&d<=r[1];}
function mmdd(d){return (d.getMonth()+1)+'.'+d.getDate();}

// 데모 상세 모달 (전환/미전환/진행중 목록)
// 데모 진행 현황 패널 (연도/분기 선택 → 카드 숫자 변화, CRM sales_history 기준)
function DemoStatusPanel({salesHistory,newThisMonth,won2paid}){
  const now=new Date();
  const [gran,setGran]=useState('all'); // all | year | quarter
  const [selYear,setSelYear]=useState(now.getFullYear());
  const [selQ,setSelQ]=useState(Math.ceil((now.getMonth()+1)/3));
  const [modal,setModal]=useState(null);
  const sh=salesHistory||[];
  // 원본 집계
  const custDemo={},custBiz={},custHosp={};
  sh.forEach(r=>{const cid=String(r.cust_id||'').trim();const type=String(r.history_type||'').trim();const date=r.history_date;if(!cid||!date)return;if(r.hospital_name)custHosp[cid]=r.hospital_name;if(type==='DEMO시작'){if(!custDemo[cid]||date<custDemo[cid])custDemo[cid]=date;}if(type==='약정시작'){if(!custBiz[cid]||date<custBiz[cid])custBiz[cid]=date;}});
  // 기간 필터: DEMO 시작일 기준
  const inSel=(cid)=>{const s=String(custDemo[cid]||'');if(!s)return false;if(gran==='all')return true;const yy=parseInt(s.slice(0,4))||0;if(gran==='year')return yy===selYear;if(gran==='quarter'){const mm=parseInt(s.slice(5,7))||0;return yy===selYear&&Math.ceil(mm/3)===selQ;}return true;};
  const todayMs=Date.now();
  const demoConverted=[],demoNotConv=[];
  Object.keys(custDemo).forEach(cid=>{if(!inSel(cid))return;const hosp=custHosp[cid]||cid;const startMs=new Date(custDemo[cid]).getTime();const diffDays=isNaN(startMs)?null:Math.round((todayMs-startMs)/86400000);const yy=parseInt(String(custDemo[cid]||'').slice(0,4))||0;const demoYear=yy?String(yy):'미확인';const row={cust_id:cid,hospital_name:hosp,demoStart:custDemo[cid],diffDays,demoYear};if(custBiz[cid]){demoConverted.push({...row,bizStart:custBiz[cid]});}else{if(diffDays===null||diffDays>=0)demoNotConv.push(row);}});
  demoNotConv.sort((a,b)=>(b.diffDays||0)-(a.diffDays||0));
  demoConverted.sort((a,b)=>String(b.bizStart||'').localeCompare(String(a.bizStart||'')));
  const demoTotal=demoConverted.length+demoNotConv.length;
  const demoConvRate=demoTotal?Math.round(demoConverted.length/demoTotal*100):0;
  const convDays=[];demoConverted.forEach(r=>{if(r.demoStart&&r.bizStart){const diff=Math.round((new Date(r.bizStart)-new Date(r.demoStart))/86400000);if(diff>=0)convDays.push(diff);}});
  const avgConvertDays=convDays.length?Math.round(convDays.reduce((a,b)=>a+b,0)/convDays.length):0;
  const demoOngoing=demoNotConv.filter(x=>x.diffDays!==null&&x.diffDays<=90);
  // 연도별/분기별 통계 (전체 기준 - 모달 표용)
  const yMap={};Object.keys(custDemo).forEach(cid=>{const yy=parseInt(String(custDemo[cid]||'').slice(0,4))||0;if(!yy)return;const yk=yy<=2022?'2022이전':String(yy);if(!yMap[yk])yMap[yk]={demo:0,convert:0};yMap[yk].demo++;if(custBiz[cid])yMap[yk].convert++;});
  const demoYearly=['2026','2025','2024','2023','2022이전'].map(yy=>{const x=yMap[yy]||{demo:0,convert:0};return {period:yy==='2022이전'?'2022 이전':yy,demo:x.demo,convert:x.convert,rate:x.demo>0?Math.round(x.convert/x.demo*1000)/10:0};}).filter(r=>r.demo>0);
  const qMap={};Object.keys(custDemo).forEach(cid=>{const s=String(custDemo[cid]||'');const yy=parseInt(s.slice(0,4))||0;const mm=parseInt(s.slice(5,7))||0;if(!yy||!mm)return;const qk=yy+'-Q'+Math.ceil(mm/3);if(!qMap[qk])qMap[qk]={demo:0,convert:0};qMap[qk].demo++;if(custBiz[cid])qMap[qk].convert++;});
  const demoQuarterly=Object.entries(qMap).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,8).map(([key,x])=>({period:key.replace('-',' '),demo:x.demo,convert:x.convert,rate:x.demo>0?Math.round(x.convert/x.demo*1000)/10:0}));

  const years=[];for(let y=now.getFullYear();y>=now.getFullYear()-4;y--)years.push(y);
  const tabBtn=(k,lb)=>{const on=gran===k;return <span onClick={()=>setGran(k)} style={{fontSize:10,padding:'4px 9px',borderRadius:7,cursor:'pointer',background:on?'#2563EB':'#1E293B',border:'0.5px solid '+(on?'#2563EB':'var(--border)'),color:on?'#fff':'var(--t3)'}}>{lb}</span>;};
  const periodLbl=gran==='all'?'전체':gran==='year'?selYear+'년':selYear+'년 '+selQ+'분기';

  return (<div className="panel">
    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10,flexWrap:'wrap'}}>
      <span style={{fontSize:13,fontWeight:600,color:'#AFA9EC'}}>데모 진행 현황</span>
      <span style={{fontSize:11,color:'var(--t3)'}}>{periodLbl}</span>
      <div style={{marginLeft:'auto',display:'flex',gap:5,alignItems:'center'}}>
        {(gran==='year'||gran==='quarter')&&<select value={selYear} onChange={e=>setSelYear(Number(e.target.value))} style={{fontSize:11,padding:'4px 7px',width:'auto',background:'#13202f',border:'0.5px solid var(--border)',borderRadius:7,color:'#c8d3e0'}}>{years.map(y=><option key={y} value={y}>{y}</option>)}</select>}
        {gran==='quarter'&&<select value={selQ} onChange={e=>setSelQ(Number(e.target.value))} style={{fontSize:11,padding:'4px 7px',width:'auto',background:'#13202f',border:'0.5px solid var(--border)',borderRadius:7,color:'#c8d3e0'}}>{[1,2,3,4].map(q=><option key={q} value={q}>{q}분기</option>)}</select>}
        {tabBtn('all','전체')}{tabBtn('year','연도')}{tabBtn('quarter','분기')}
      </div>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10}}>
      <div onClick={()=>setModal(modal==='converted'?null:'converted')} style={{background:'#0d1620',border:'0.5px solid '+(modal==='converted'?'#fb923c':'rgba(251,146,60,.35)'),boxShadow:modal==='converted'?'0 0 0 1px #fb923c66':'none',borderRadius:10,padding:12,cursor:'pointer'}}>
        <div style={{fontSize:10,fontWeight:700,color:'#fb923c',marginBottom:3}}>DEMO 전환율 <span style={{color:'var(--t3)'}}>{modal==='converted'?'▾':'▸'}</span></div>
        <div style={{fontSize:22,fontWeight:700,color:'#fb923c',lineHeight:1}}>{demoConvRate}%</div>
        <div style={{fontSize:10,color:'#fbbf24',marginTop:5}}>전환 {demoConverted.length}건 / 데모 {demoTotal}건</div>
        <div style={{marginTop:6,height:4,borderRadius:2,background:'rgba(255,255,255,.08)'}}><div style={{width:demoConvRate+'%',height:'100%',borderRadius:2,background:'linear-gradient(90deg,#ea580c,#fb923c)'}}/></div>
      </div>
      <div onClick={()=>setModal(modal==='notconv'?null:'notconv')} style={{background:'#0d1620',border:'0.5px solid '+(modal==='notconv'?'#f87171':'rgba(220,38,38,.35)'),boxShadow:modal==='notconv'?'0 0 0 1px #f8717166':'none',borderRadius:10,padding:12,cursor:'pointer'}}>
        <div style={{fontSize:10,fontWeight:700,color:'#f87171',marginBottom:3}}>DEMO 종료 미전환 <span style={{color:'var(--t3)'}}>{modal==='notconv'?'▾':'▸'}</span></div>
        <div style={{fontSize:22,fontWeight:700,color:'#f87171',lineHeight:1}}>{demoNotConv.length}건</div>
        <div style={{fontSize:10,color:'#fbbf24',marginTop:5}}>즉시 follow-up 필요</div>

function ChartBox({cfg,height}){
  const ref=useRef(null);const inst=useRef(null);
  useEffect(()=>{
    if(!ref.current||!window.Chart)return;
    if(inst.current){inst.current.destroy();}
    const merged={...cfg,options:{responsive:true,maintainAspectRatio:false,...(cfg.options||{})}};
    inst.current=new window.Chart(ref.current,merged);
    return ()=>{if(inst.current){inst.current.destroy();inst.current=null;}};
  },[JSON.stringify(cfg)]);
  return <div style={{position:'relative',height:height||168,width:'100%'}}><canvas ref={ref}/></div>;
}

// 목표 대비 실적 그래프 (국내/해외 공용) — 연도/분기/월 전환 + 전년도 점선 + 콤마
// 건수 차트 (월별 영업활동 수·신규 리드 등) — 연도/분기/월 전환 + 전년 대비 점선
function CountChart({title,color,dates}){
  const now=new Date();
  const [year,setYear]=useState(now.getFullYear());
  const [gran,setGran]=useState('month');
  // 연도별 월 건수 집계
  const aggYear=(y)=>{const m={};(dates||[]).forEach(ds=>{if(!ds)return;const dt=new Date(ds);if(isNaN(dt)||dt.getFullYear()!==y)return;const mm=dt.getMonth()+1;m[mm]=(m[mm]||0)+1;});return m;};
  const cur=aggYear(year),prev=aggYear(year-1);
  let labels=[],curArr=[],prevArr=[];
  if(gran==='month'){
    labels=Array.from({length:12},(_,i)=>(i+1)+'월');
    for(let mm=1;mm<=12;mm++){curArr.push(cur[mm]||0);prevArr.push(prev[mm]||0);}
  }else if(gran==='quarter'){
    labels=['1분기','2분기','3분기','4분기'];
    for(let q=0;q<4;q++){let a=0,pv=0;for(let k=1;k<=3;k++){const mm=q*3+k;a+=cur[mm]||0;pv+=prev[mm]||0;}curArr.push(a);prevArr.push(pv);}
  }else{
    const years=[year-3,year-2,year-1,year];labels=years.map(y=>y+'년');
    years.forEach(y=>{const g=aggYear(y);let a=0;for(let mm=1;mm<=12;mm++)a+=g[mm]||0;curArr.push(a);});prevArr=[];
  }
  const total=curArr.reduce((a,b)=>a+b,0);
  const datasets=[{type:'bar',label:String(year),data:curArr,backgroundColor:color,borderRadius:5,order:2}];
  if(gran!=='year'){datasets.push({type:'line',label:'전년('+(year-1)+')',data:prevArr,borderColor:'#EF9F27',borderWidth:2,borderDash:[5,4],pointRadius:3,pointBackgroundColor:'#EF9F27',fill:false,tension:.3,order:1});}
  const cfg={data:{labels,datasets},options:{plugins:{legend:{display:true,labels:{boxWidth:10,font:{size:10}}}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}};
  const years=[];for(let y=now.getFullYear();y>=now.getFullYear()-4;y--)years.push(y);
  const tabBtn=(k,lb)=>{const on=gran===k;return <span onClick={()=>setGran(k)} style={{fontSize:11,padding:'4px 9px',borderRadius:7,cursor:'pointer',background:on?'#2563EB':'#1E293B',border:'0.5px solid '+(on?'#2563EB':'var(--border)'),color:on?'#fff':'var(--t3)'}}>{lb}</span>;};
  return (<div className="panel">
    <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:8,flexWrap:'wrap'}}>
      <span style={{fontSize:13,fontWeight:600,color:'#85B7EB'}}>{title}</span>
      <span style={{fontSize:11,color:'var(--t3)'}}>{year}년 {total}건</span>
      <div style={{marginLeft:'auto',display:'flex',gap:5,alignItems:'center'}}>
        <select value={year} onChange={e=>setYear(Number(e.target.value))} style={{fontSize:11,padding:'4px 7px',width:'auto',background:'#13202f',border:'0.5px solid var(--border)',borderRadius:7,color:'#c8d3e0'}}>{years.map(y=><option key={y} value={y}>{y}</option>)}</select>
        {tabBtn('year','연도')}{tabBtn('quarter','분기')}{tabBtn('month','월별')}
      </div>
    </div>
    {total===0?<Empty msg="데이터 없음"/>:<ChartBox cfg={cfg} height={150}/>}
  </div>);
}

function TargetChart({title,color,targets,orders,rev,mode}){
  const now=new Date();
  const [year,setYear]=useState(now.getFullYear());
  const [gran,setGran]=useState('month'); // month | quarter | year
  const [selMonth,setSelMonth]=useState(0); // 0=전체, 1~12=특정 월
  const wonC=n=>(n==null||isNaN(n))?'0원':Math.round(n).toLocaleString('ko-KR')+'원';
  const axisFmt=n=>{const a=Math.abs(n);if(a>=1e8)return (n/1e8).toFixed(1)+'억';if(a>=1e4)return Math.round(n/1e4).toLocaleString()+'만';return Math.round(n).toLocaleString();};

  // 연도별 월 목표/실적 집계 (원 단위)
  const aggYear=(y)=>{
    const plan={},act={};
    if(mode==='dom'){
      (targets||[]).forEach(t=>{if(!t.year_month||!t.year_month.startsWith(y+'-'))return;const m=Number(t.year_month.slice(5));plan[m]=(plan[m]||0)+(Number(t.target_amount)||0);});
      (orders||[]).forEach(o=>{if(!o.delivered_at)return;const dt=new Date(o.delivered_at);if(isNaN(dt)||dt.getFullYear()!==y)return;const m=dt.getMonth()+1;act[m]=(act[m]||0)+(Number(o.supply_amount)||0);});
    }else{
      (rev||[]).forEach(r=>{if(Number(r.year)!==y)return;const m=Number(r.month);plan[m]=(plan[m]||0)+(Number(r.plan_revenue)||0);act[m]=(act[m]||0)+(Number(r.actual_revenue)||0);});
    }
    return {plan,act};
  };

  const cur=aggYear(year),prev=aggYear(year-1);

  // 단위별 라벨/집계
  let labels=[],planArr=[],actArr=[],prevArr=[];
  if(gran==='month'){
    if(selMonth>=1&&selMonth<=12){
      labels=[selMonth+'월'];
      planArr=[cur.plan[selMonth]||0];actArr=[cur.act[selMonth]||0];prevArr=[prev.act[selMonth]||0];
    }else{
      labels=Array.from({length:12},(_,i)=>(i+1)+'월');
      for(let m=1;m<=12;m++){planArr.push(cur.plan[m]||0);actArr.push(cur.act[m]||0);prevArr.push(prev.act[m]||0);}
    }
  }else if(gran==='quarter'){
    labels=['1분기','2분기','3분기','4분기'];
    for(let q=0;q<4;q++){let p=0,a=0,pv=0;for(let mm=1;mm<=3;mm++){const m=q*3+mm;p+=cur.plan[m]||0;a+=cur.act[m]||0;pv+=prev.act[m]||0;}planArr.push(p);actArr.push(a);prevArr.push(pv);}
  }else{ // year: 최근 4개 연도
    const years=[year-3,year-2,year-1,year];
    labels=years.map(y=>y+'년');
    years.forEach(y=>{const g=aggYear(y);let p=0,a=0;for(let m=1;m<=12;m++){p+=g.plan[m]||0;a+=g.act[m]||0;}planArr.push(p);actArr.push(a);prevArr.push(0);});
  }

  const planSum=planArr.reduce((a,b)=>a+b,0),actSum=actArr.reduce((a,b)=>a+b,0);
  const ach=planSum?Math.round(actSum/planSum*100):0;

  const datasets=[
    {type:'bar',label:'목표',data:planArr,backgroundColor:'#2563EB',borderRadius:4,order:2},
    {type:'bar',label:'실적',data:actArr,backgroundColor:'#22C55E',borderRadius:4,order:2}
  ];
  if(gran!=='year'){
    datasets.push({type:'line',label:'전년도 실적',data:prevArr,borderColor:'#EF9F27',borderWidth:2,borderDash:[5,4],pointRadius:3,pointBackgroundColor:'#EF9F27',fill:false,tension:.3,order:1});
  }
  const cfg={data:{labels,datasets},options:{
    plugins:{legend:{display:true,labels:{boxWidth:10,font:{size:10}}},
      tooltip:{callbacks:{label:(c)=>c.dataset.label+' '+wonC(c.raw)}}},
    scales:{y:{beginAtZero:true,ticks:{callback:(v)=>axisFmt(v)}}}
  }};

  const years=[];for(let y=now.getFullYear();y>=now.getFullYear()-4;y--)years.push(y);
  const tabBtn=(k,lb)=>{const on=gran===k;return <span onClick={()=>{setGran(k);if(k!=='month')setSelMonth(0);}} style={{fontSize:11,padding:'5px 10px',borderRadius:7,cursor:'pointer',background:on?'#2563EB':'#1E293B',border:'0.5px solid '+(on?'#2563EB':'var(--border)'),color:on?'#fff':'var(--t3)'}}>{lb}</span>;};

  return (
    <div className="panel">
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10,flexWrap:'wrap'}}>
        <span style={{fontSize:13,fontWeight:600,color:'#85B7EB'}}>{title}</span>
        <div style={{marginLeft:'auto',display:'flex',gap:6,alignItems:'center'}}>
          <select value={year} onChange={e=>setYear(Number(e.target.value))} style={{fontSize:11,padding:'4px 8px',width:'auto',background:'#13202f',border:'0.5px solid var(--border)',borderRadius:7,color:'#c8d3e0'}}>{years.map(y=><option key={y} value={y}>{y}</option>)}</select>

function SimpleModal({title,fields,init,table,onClose,onSaved,conflict}){
  const [f,setF]=useState(init);
  function set(k,v){setF(p=>({...p,[k]:v}));}
  async function save(){
    let row={...f};
    fields.forEach(fl=>{if(fl.num)row[fl.k]=row[fl.k]===''?null:Number(row[fl.k]);});
    let res;
    if(conflict)res=await sb.from(table).upsert(row,{onConflict:conflict});
    else res=await sb.from(table).insert(row);
    if(res.error){alert('저장 오류: '+res.error.message);return;}
    onSaved();
  }
  return (
    <div className="ov"><div className="modal" style={{width:380}}>
      <div style={{fontSize:14,fontWeight:600,marginBottom:14}}>{title}</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        {fields.map(fl=>(
          <div key={fl.k} style={fl.full?{gridColumn:'1 / 3'}:{}}>

            {fl.opts?<select value={f[fl.k]} onChange={ev=>set(fl.k,ev.target.value)}>{fl.opts.map(o=><option key={o}>{o}</option>)}</select>
              :fl.money?<input type="text" inputMode="numeric" value={commafy(f[fl.k])} onChange={ev=>set(fl.k,uncomma(ev.target.value))}/>
              :<input type={fl.type||'text'} value={f[fl.k]} onChange={ev=>set(fl.k,ev.target.value)}/>}
          </div>
        ))}
      </div>
      <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:16}}>
        <button className="btn-ghost" onClick={onClose}>취소</button>

      </div>
    </div></div>
  );
}

function DomesticView(){

  const filtered=useMemo(()=>{
    const q=search.trim().toLowerCase();
    return leads.filter(l=>{
      if(stageFilter&&l.stage!==stageFilter)return false;
      if(chipF!=='all'){const si=stages.indexOf(l.stage);if(chipF==='ing'&&!(si>=0&&si<=5))return false;if(chipF==='won'&&!(si>=6&&si<=7))return false;if(chipF==='hold'&&l.stage!=='보류')return false;}
      if(htSel.length&&htSel.indexOf(String(l.hospital_type||''))<0)return false;

      if(!q)return true;
      return [l.hospital_name,l.region_wide,l.region_local,l.owner,l.lead_status,l.stage].some(v=>v&&String(v).toLowerCase().includes(q));
    });
  },[leads,search,stageFilter,chipF,htSel,rwSel,solSel,solByLead,stages]);

  const sel=leads.find(l=>l.lead_id===selId);

  const selActs=sel?acts.filter(a=>a.lead_id===sel.lead_id).sort((a,b)=>String(b.activity_date||'').localeCompare(String(a.activity_date||''))):[];

  const leadName=id=>{const l=leads.find(x=>x.lead_id===id);return l?l.hospital_name:'(삭제됨)';};
  const owners=[...new Set(leads.map(l=>l.owner).filter(Boolean))];

  const leadSol={};contacts.forEach(c=>{if(!c.pre_meeting_interest)return;leadSol[c.lead_id]=(leadSol[c.lead_id]||'')+' '+c.pre_meeting_interest;});

  const contractOver=activeLeads.filter(l=>{if(l.stage!=='계약협의')return false;const a=actByLead[l.lead_id];return !a||!a.last||daysAgo(a.last)>=30;});

      {modal&&modal.t==='lead'&&<LeadModal lead={modal.lead} onClose={()=>setModal(null)} onSaved={()=>{setModal(null);load();}}/>}
      {modal&&modal.t==='newlead'&&<NewLeadModal onClose={()=>setModal(null)} onSaved={()=>{setModal(null);load();}}/>}
      {modal&&modal.t==='tripcart'&&<TripCartModal kind="domestic" leads={leads} contacts={contacts} acts={acts} onClose={()=>setModal(null)}/>}
      {modal&&modal.t==='act'&&<ActModal lead={modal.lead} contacts={contacts.filter(c=>c.lead_id===modal.lead.lead_id)} onClose={()=>setModal(null)} onSaved={()=>{setModal(null);load();}}/>}
      {modal&&modal.t==='actedit'&&<ActModal lead={modal.lead} contacts={contacts.filter(c=>c.lead_id===modal.lead.lead_id)} edit={modal.act} onClose={()=>setModal(null)} onSaved={()=>{setModal(null);load();}}/>}
      {sel&&<LeadDetail lead={sel} contacts={contacts} acts={acts} onClose={()=>setSelId(null)} setModal={setModal} onRefresh={load}/>}
      {modal&&modal.t==='stage'&&<StageModal lead={modal.lead} onClose={()=>setModal(null)} onSaved={()=>{setModal(null);load();}}/>}
      {modal&&modal.t==='owner'&&<OwnerModal lead={modal.lead} owners={owners} onClose={()=>setModal(null)} onSaved={()=>{setModal(null);load();}}/>}
      {modal&&modal.t==='demo'&&<DemoModal lead={modal.lead} onClose={()=>setModal(null)} onSaved={()=>{setModal(null);load();}}/>}
      {modal&&modal.t==='presurvey'&&<PresurveyModal lead={modal.lead} contacts={contacts.filter(c=>c.lead_id===modal.lead.lead_id)} onClose={()=>setModal(null)} onSaved={()=>{setModal(null);load();}}/>}

}

function OverseasView(){
  const [deals,setDeals]=useState([]);const [acts,setActs]=useState([]);const [rev,setRev]=useState([]);const [proj,setProj]=useState([]);const [rates,setRates]=useState([]);
  const [funnelType,setFunnelType]=useState('일반');
  const [openWeek,setOpenWeek]=useState(1);
  const [modal,setModal]=useState(null);
  const [loading,setLoading]=useState(true);

  async function load(){
    setLoading(true);
    const [d,a,r,p,x]=await Promise.all([
      sb.from('overseas_deals').select('*').order('id',{ascending:false}),
      sb.from('overseas_activities').select('*').order('activity_date',{ascending:false}),
      sb.from('overseas_revenue').select('*').order('month'),
      sb.from('overseas_projects').select('*').order('id',{ascending:false}),
      sb.from('exchange_rates').select('*').order('rate_date',{ascending:false})
    ]);
    setDeals(d.data||[]);setActs(a.data||[]);setRev(r.data||[]);setProj(p.data||[]);setRates(x.data||[]);
    setLoading(false);
  }
  useEffect(()=>{load();},[]);

  const rate=rates.length?Number(rates[0].usd_krw):null;
  const rateDate=rates.length?rates[0].rate_date:null;

  // 가중 파이프라인 (KRW 기준)
  let pipeKRW=0;
  deals.forEach(d=>{
    const w=(d.funnel_type==='B2B'?W_B2B:W_GEN)[d.stage]||0;
    if(!d.amount)return;
    const krw=d.currency==='KRW'?Number(d.amount):toKRW(d.amount,rate)||0;
    pipeKRW+=krw*w;
  });
  // 매출 달성율
  let planSum=0,actSum=0;
  rev.forEach(r=>{planSum+=Number(r.plan_revenue)||0;actSum+=Number(r.actual_revenue)||0;});
  const achRate=planSum?Math.round(actSum/planSum*100):0;
  // 이번 주 활동
  const wkThis=weekRange(0);
  const thisWeekActs=acts.filter(a=>inRange(a.activity_date,wkThis)).length;
  // Sales 단계 딜
  const salesCnt=deals.filter(d=>d.stage==='Sales'||d.stage==='계약완료').length;

  // 퍼널
  const stages=funnelType==='B2B'?STAGES_B2B:STAGES_GEN;

        <span style={{fontSize:11,color:'var(--t3)'}}>영업 대시보드 / 해외</span>
        <div style={{marginLeft:'auto',display:'flex',gap:8,alignItems:'center'}}>
          {rate?<span className="pill" style={{background:'#13314f',color:'#85B7EB'}}>환율 {rateDate} · 1$={Math.round(rate).toLocaleString()}원</span>

                <div style={{flex:1,height:18,background:'#13202f',borderRadius:5,overflow:'hidden'}}><div style={{height:'100%',width:Math.max(w,x.n?6:0)+'%',background:funnelType==='B2B'?'#534AB7':'#185FA5',borderRadius:5}}/></div>

            {funnelDeals.map(d=>(

                <button className="btn-ghost" style={{padding:'3px 8px'}} onClick={()=>setModal({t:'deal',deal:d})}>수정</button>
              </div>
            ))}
          </div>}
        </div>

        {/* 주간 영업활동 */}
        <div className="card">
          <div style={{display:'flex',alignItems:'center',marginBottom:10}}>
            <span style={{fontSize:14,fontWeight:600}}>주간 영업활동 현황</span>
            <button className="btn" style={{marginLeft:'auto'}} onClick={()=>setModal({t:'act'})}>+ 활동 등록</button>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {weeks.map((w,i)=>{

                      <span style={{fontSize:13,fontWeight:600}}>{w.lb}</span>
                      <span style={{fontSize:11,color:'var(--t3)'}}>{mmdd(r[0])}~{mmdd(r[1])}</span>
                      <span style={{fontSize:10,color:w.clr}}>{w.plan?'예정·액션플랜':'활동 '+rows.length+'건'}</span>
                      <span style={{marginLeft:'auto',fontSize:11,color:'var(--t2)'}}>{rows.length}건</span>
                    </div>

                  {open&&<div style={{padding:'0 11px 8px 14px'}}>

                    {rows.length===0?<div style={{fontSize:11,color:'var(--t3)',padding:'6px 0'}}>활동 없음</div>:

                        <div key={a.id} style={{padding:'7px 0',borderTop:'0.5px solid var(--border)'}}>

                            <span style={{marginLeft:'auto',fontSize:11,color:'var(--t3)'}}>{w.plan?a.next_action_date:a.activity_date}</span>
                          </div>

                          {a.next_step&&!w.plan&&<div style={{fontSize:11,color:'#AFA9EC',marginTop:2}}>↳ 다음 단계: {a.next_step}{a.next_action_date?' ('+a.next_action_date+')':''}</div>}
                        </div>
                      );})}
                  </div>}
                </div>
              );
            })}
          </div>
        </div>

        {/* 월별 매출 + 프로젝트 */}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          <div className="card">
            <div style={{display:'flex',alignItems:'center',marginBottom:10}}><span style={{fontSize:14,fontWeight:600}}>월별 매출 달성율</span><button className="btn-ghost" style={{marginLeft:'auto'}} onClick={()=>setModal({t:'rev'})}>+ 월 매출</button></div>
            {rev.length===0?<Empty msg="월 매출을 입력하세요."/>:
            <div style={{display:'flex',flexDirection:'column',gap:5}}>
              {rev.map(r=>{const a=Number(r.actual_revenue)||0,p=Number(r.plan_revenue)||0;const pct=p?Math.round(a/p*100):0;return (
                <div key={r.id} style={{display:'flex',alignItems:'center',gap:8,fontSize:11}}>
                  <span style={{width:54,color:'var(--t2)'}}>{r.year}.{r.month}</span>

                  <span style={{width:36,textAlign:'right',color:'var(--t)'}}>{pct}%</span>
                </div>
              );})}
            </div>}
          </div>
          <div className="card">
            <div style={{display:'flex',alignItems:'center',marginBottom:10}}><span style={{fontSize:14,fontWeight:600}}>BD 이슈 · 프로젝트</span><button className="btn-ghost" style={{marginLeft:'auto'}} onClick={()=>setModal({t:'proj'})}>+ 프로젝트</button></div>

                  <div style={{flex:1}}><div style={{fontSize:12,fontWeight:600}}>{p.project_name}</div><div style={{fontSize:10,color:'var(--t3)'}}>{p.owner} · {p.schedule}</div></div>
                  <span style={{fontSize:10,color:'#AFA9EC'}}>{p.status}</span>

        <div style={{fontSize:11,color:'var(--t3)',textAlign:'center',padding:'4px 0'}}>전시회(AOCR·ISS·AOSPR·RSNA)는 학회·부스·전시회 탭에서 관리</div>
      </div>}

      {/* 모달 */}
      {modal&&modal.t==='deal'&&<DealModal deal={modal.deal} onClose={()=>setModal(null)} onSaved={()=>{setModal(null);load();}}/>}
      {modal&&modal.t==='tripcart'&&<TripCartModal kind="overseas" deals={deals} onClose={()=>setModal(null)}/>}
      {modal&&modal.t==='act'&&<ActivityModal deals={deals} preDeal={modal.deal} onClose={()=>setModal(null)} onSaved={()=>{setModal(null);load();}}/>}
      {modal&&modal.t==='rate'&&<SimpleModal title="환율 입력 (외국환고시)" table="exchange_rates" conflict="rate_date" init={{rate_date:new Date().toISOString().slice(0,10),usd_krw:''}} fields={[{k:'rate_date',label:'고시 날짜',type:'date'},{k:'usd_krw',label:'1 USD = ? KRW',type:'number',num:true}]} onClose={()=>setModal(null)} onSaved={()=>{setModal(null);load();}}/>}
      {modal&&modal.t==='rev'&&<SimpleModal title="월 매출 입력" table="overseas_revenue" conflict="year,month" init={{year:new Date().getFullYear(),month:new Date().getMonth()+1,plan_revenue:'',actual_revenue:'',currency:'KRW'}} fields={[{k:'year',label:'연도',type:'number',num:true},{k:'month',label:'월',type:'number',num:true},{k:'plan_revenue',label:'계획',type:'number',num:true,money:true},{k:'actual_revenue',label:'실적',type:'number',num:true,money:true},{k:'currency',label:'통화',opts:['KRW','USD']}]} onClose={()=>setModal(null)} onSaved={()=>{setModal(null);load();}}/>}
      {modal&&modal.t==='proj'&&<SimpleModal title="프로젝트 추가" table="overseas_projects" init={{project_name:'',owner:'',status:'업무중',schedule:'',next_step:'',remarks:''}} fields={[{k:'project_name',label:'프로젝트명',full:true},{k:'owner',label:'담당자'},{k:'status',label:'상태',opts:['착수전','업무중','검토중','완료','보류']},{k:'schedule',label:'일정',full:true},{k:'next_step',label:'다음 단계',full:true}]} onClose={()=>setModal(null)} onSaved={()=>{setModal(null);load();}}/>}
    </div>
  );

function monthCounts(dates){const m={};dates.forEach(d=>{if(!d)return;const dt=new Date(d);if(isNaN(dt))return;const k=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');m[k]=(m[k]||0)+1;});const ks=Object.keys(m).sort();return {labels:ks.map(k=>Number(k.slice(5))+'월'),data:ks.map(k=>m[k])};}

function DashboardView({go}){
  const [d,setD]=useState(null);
  const [weekModal,setWeekModal]=useState(null);
  useEffect(()=>{(async()=>{
    let leads=[],from=0;
    while(true){const {data}=await sb.from('leads').select('lead_id,funnel_type,stage,expected_revenue,lead_created_date,demo_status,hospital_name,owner,region_wide').range(from,from+999);if(!data||!data.length)break;leads=leads.concat(data);if(data.length<1000)break;from+=1000;}
    let ord=[],fo=0;
    while(true){const {data}=await sb.from('orders').select('delivered_at,supply_amount').range(fo,fo+999);if(!data||!data.length)break;ord=ord.concat(data);if(data.length<1000)break;fo+=1000;if(fo>40000)break;}
    let sh=[],fs=0;
    while(true){const {data}=await sb.from('sales_history').select('cust_id,hospital_name,history_type,history_date').range(fs,fs+999);if(!data||!data.length)break;sh=sh.concat(data);if(data.length<1000)break;fs+=1000;if(fs>40000)break;}
    const [a,dl,rv,rt,oa,tg]=await Promise.all([
      sb.from('lead_activities').select('lead_id,contact_seq,activity_date,next_action_date,solutions,content,type,priority,owner'),
      sb.from('overseas_deals').select('funnel_type,stage,amount,currency'),
      sb.from('overseas_revenue').select('year,month,plan_revenue,actual_revenue'),
      sb.from('exchange_rates').select('usd_krw,rate_date').order('rate_date',{ascending:false}).limit(1),
      sb.from('overseas_activities').select('activity_date,next_action_date,solutions,content'),
      sb.from('revenue_targets').select('year_month,target_amount')
    ]);
    setD({leads,acts:a.data||[],deals:dl.data||[],rev:rv.data||[],rates:rt.data||[],oacts:oa.data||[],orders:ord,targets:tg.data||[],salesHistory:sh});
  })();},[]);
  if(!d)return <LoadingBear pad={40}/>;
  const rate=d.rates.length?Number(d.rates[0].usd_krw):null;

  let ovsPipe=0;d.deals.forEach(x=>{if(!x.amount)return;const w=(x.funnel_type==='B2B'?W_B2B:W_GEN)[x.stage]||0;const krw=x.currency==='KRW'?Number(x.amount):(toKRW(x.amount,rate)||0);ovsPipe+=krw*w;});
  const allActs=d.acts.concat(d.oacts);
  const cnt=(off,plan)=>{const r=weekRange(off);return allActs.filter(a=>inRange(plan?a.next_action_date:a.activity_date,r)).length;};
  const wkLast=cnt(-1),wkThis=cnt(0),wkNext=cnt(1,true);
  // 솔루션 카운트
  const sol={};const addsol=t=>{if(!t)return;const ms=String(t).toUpperCase().match(/\b(BA|OA|SC|SG|SS|FX|AS|CA)\b/g);if(ms)ms.forEach(x=>sol[x]=(sol[x]||0)+1);};
  allActs.forEach(a=>{a.solutions?addsol(a.solutions):addsol(a.content);});
  const solKeys=SOL_OPTS.filter(k=>sol[k]);const solTotal=solKeys.reduce((s,k)=>s+sol[k],0);
  // 월별 활동/신규리드
  const mAct=monthCounts(d.acts.map(a=>a.activity_date).concat(d.oacts.map(a=>a.activity_date)));
  const newThisMonth=(()=>{const now=new Date();return d.leads.filter(l=>{if(!l.lead_created_date)return false;const dt=new Date(l.lead_created_date);return dt.getFullYear()===now.getFullYear()&&dt.getMonth()===now.getMonth();}).length;})();
  const won2paid=d.leads.filter(l=>l.stage==='계약완료').length;
  // mini funnels
  const domBars=STAGES_GEN.map(s=>d.leads.filter(l=>(l.funnel_type||'일반')==='일반'&&l.stage===s).length);
  const ovsBars=STAGES_B2B.map(s=>d.deals.filter(x=>x.funnel_type==='B2B'&&x.stage===s).length);

  // ── 국내 목표 대비 실적 (올해, 만원) ──
  const yr=new Date().getFullYear();
  const domPlan={},domAct={};
  d.targets.forEach(t=>{if(!t.year_month||!t.year_month.startsWith(yr+'-'))return;const m=Number(t.year_month.slice(5));domPlan[m]=(domPlan[m]||0)+(Number(t.target_amount)||0);});
  d.orders.forEach(o=>{if(!o.delivered_at)return;const dt=new Date(o.delivered_at);if(isNaN(dt)||dt.getFullYear()!==yr)return;const m=dt.getMonth()+1;domAct[m]=(domAct[m]||0)+(Number(o.supply_amount)||0);});
  const domMonths=Array.from(new Set([...Object.keys(domPlan),...Object.keys(domAct)].map(Number))).sort((a,b)=>a-b);
  const domPlanSum=Object.values(domPlan).reduce((a,b)=>a+b,0),domActSum=Object.values(domAct).reduce((a,b)=>a+b,0);
  const domAch=domPlanSum?Math.round(domActSum/domPlanSum*100):0;

  // ── 해외 목표 대비 실적 (만원 환산) ──
  const revRows=[...d.rev].sort((a,b)=>(a.year-b.year)||(a.month-b.month));
  const ovsTgtCfg={type:'bar',data:{labels:revRows.map(r=>r.month+'월'),datasets:[{label:'목표',data:revRows.map(r=>Math.round((Number(r.plan_revenue)||0)/1e4)),backgroundColor:'#6b7280',borderRadius:4},{label:'실적',data:revRows.map(r=>Math.round((Number(r.actual_revenue)||0)/1e4)),backgroundColor:'#534AB7',borderRadius:4}]},options:{plugins:{legend:{display:true,labels:{boxWidth:10}}},scales:{y:{beginAtZero:true,title:{display:true,text:'만원'}}}}};
  let ovsPlanSum=0,ovsActSum=0;d.rev.forEach(r=>{ovsPlanSum+=Number(r.plan_revenue)||0;ovsActSum+=Number(r.actual_revenue)||0;});
  const ovsAch=ovsPlanSum?Math.round(ovsActSum/ovsPlanSum*100):0;
  const totalAch=(domPlanSum+ovsPlanSum)?Math.round((domActSum+ovsActSum)/(domPlanSum+ovsPlanSum)*100):0;

  const donutCfg={type:'doughnut',data:{labels:solKeys,datasets:[{data:solKeys.map(k=>sol[k]),backgroundColor:solKeys.map(k=>SOL_C[k]),borderWidth:0}]},options:{cutout:'66%',plugins:{legend:{display:false}}}};
  const wkData=[['지난주',-1,false,'#888780'],['이번주',0,false,'#185FA5'],['다음주',1,true,'#1D9E75']];

  return (
    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      <div><div className="hd">대시보드</div><div style={{fontSize:12,color:'var(--t2)',marginTop:2}}>국내 + 해외 합산 · 리드허브 통합 현황</div></div>

      {/* KPI */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12}}>
        <Kpi l="파이프라인 (전체)" v={(d.leads.length+d.deals.length)+'건'} c="#5DCAA5" sub={'국내 '+d.leads.length+' · 해외 '+d.deals.length}/>
        <Kpi l="가중 예상매출" v={Math.round(domPipe+ovsPipe).toLocaleString('ko-KR')+'원'} c="#85B7EB" sub={'국내 '+eok(domPipe)+' · 해외 '+eok(ovsPipe)}/>
        <div className="kpi3d" style={{background:'linear-gradient(135deg,#534AB72e,#13202f 70%)',border:'0.5px solid #534AB755'}}>
          <div style={{fontSize:11,color:'var(--t2)'}}>주간 영업활동</div>
          <div style={{display:'flex',gap:8,marginTop:6}}>
            {[['지난주',-1,wkLast],['이번주',0,wkThis],['다음주',1,wkNext]].map(x=>{const r=weekRange(x[1]);return (<div key={x[0]} onClick={()=>setWeekModal(x[1])} style={{textAlign:'center',cursor:'pointer',flex:1,padding:'2px 0',borderRadius:6}} title="클릭 시 상세"><div style={{fontSize:18,fontWeight:700,color:'#AFA9EC'}}>{x[2]}<span style={{fontSize:9,color:'var(--t3)',fontWeight:400}}>건</span></div><div style={{fontSize:9,color:'var(--t3)'}}>{x[0]}</div><div style={{fontSize:8,color:'var(--t3)'}}>{mmdd(r[0])}~{mmdd(r[1])}</div></div>);})}
          </div>
        </div>
        <div className="kpi3d" style={{background:'linear-gradient(135deg,#0F6E562e,#13202f 70%)',border:'0.5px solid #0F6E5655'}}>
          <div style={{fontSize:11,color:'var(--t2)'}}>목표 대비 실적</div>
          <div style={{fontSize:22,fontWeight:700,color:'#5DCAA5',marginTop:2}}>{totalAch}%</div>
          <div style={{height:6,borderRadius:3,background:'rgba(0,0,0,.3)',marginTop:5,overflow:'hidden'}}><div style={{height:'100%',width:Math.min(totalAch,100)+'%',background:'linear-gradient(90deg,#0F6E56,#5DCAA5)'}}/></div>
          <div style={{fontSize:9,color:'var(--t3)',marginTop:3}}>국내 {domAch}% · 해외 {ovsAch}%</div>
        </div>
      </div>

      {/* 국내·해외 영업 패널 (KPI 바로 아래) */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <div className="panel click" onClick={()=>go('domestic')}>
          <div style={{display:'flex',alignItems:'baseline',gap:10,marginBottom:10}}><span style={{fontSize:14,fontWeight:600}}>국내 영업</span><span style={{fontSize:11,color:'var(--t2)'}}>리드</span><span style={{fontSize:15,fontWeight:700}}>{d.leads.length}</span><span style={{fontSize:11,color:'var(--t2)',marginLeft:4}}>가중</span><span style={{fontSize:15,fontWeight:700,color:'#5a9bf0'}}>{eok(domPipe)}</span><span style={{marginLeft:'auto',fontSize:12,color:'#85B7EB'}}>상세 →</span></div>
          <MiniStageBars stages={STAGES_GEN} counts={domBars} colorMap={STAGE_C}/>
        </div>
        <div className="panel click" onClick={()=>go('overseas')}>
          <div style={{display:'flex',alignItems:'baseline',gap:10,marginBottom:10}}><span style={{fontSize:14,fontWeight:600}}>해외 영업</span><span style={{fontSize:11,color:'var(--t2)'}}>딜</span><span style={{fontSize:15,fontWeight:700}}>{d.deals.length}</span><span style={{fontSize:11,color:'var(--t2)',marginLeft:4}}>가중</span><span style={{fontSize:15,fontWeight:700,color:'#AFA9EC'}}>{eok(ovsPipe)}</span><span style={{marginLeft:'auto',fontSize:12,color:'#AFA9EC'}}>상세 →</span></div>
          <MiniStageBars stages={STAGES_B2B} counts={ovsBars} colorMap={STAGE_C_B2B}/>
        </div>
      </div>

      {/* 목표 대비 실적 — 국내 / 해외 분리 (연도/분기/월 전환 + 전년도 점선) */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <TargetChart title="국내 목표 대비 실적" color="#185FA5" mode="dom" targets={d.targets} orders={d.orders}/>
        <TargetChart title="해외 목표 대비 실적" color="#534AB7" mode="ovs" rev={d.rev}/>
      </div>

      {/* 차트 3종 */}
      <div style={{display:'grid',gridTemplateColumns:'1.1fr 1fr 1fr',gap:12}}>
        <div className="panel">
          <div style={{fontSize:13,fontWeight:600,color:'#85B7EB',marginBottom:8}}>솔루션별 영업활동</div>
          {solTotal===0?<Empty msg="솔루션 데이터 없음"/>:
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <div style={{width:140,position:'relative'}}><ChartBox cfg={donutCfg} height={140}/><div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',pointerEvents:'none'}}><div style={{fontSize:9,color:'var(--t3)'}}>전체</div><div style={{fontSize:18,fontWeight:700}}>{solTotal}</div></div></div>
            <div style={{flex:1}}>{solKeys.map(k=><div key={k} style={{display:'flex',alignItems:'center',gap:7,marginBottom:4}}><span style={{width:9,height:9,borderRadius:3,background:SOL_C[k]}}/><span style={{fontSize:12,fontWeight:600,width:28}}>{k}</span><span style={{fontSize:11,color:'var(--t2)'}}>{sol[k]}건</span><span style={{marginLeft:'auto',fontSize:11,color:SOL_C[k]}}>{Math.round(sol[k]/solTotal*100)}%</span></div>)}</div>
          </div>}
        </div>
        <CountChart title="월별 영업활동 수" color="#4a86e8" dates={d.acts.map(a=>a.activity_date).concat(d.oacts.map(a=>a.activity_date))}/>
        <CountChart title="월별 신규 추가 리드" color="#5DCAA5" dates={d.leads.map(l=>l.lead_created_date)}/>
      </div>

      {/* 데모 진행 현황 (CRM sales_history 기준 · 연도/분기 선택 · 클릭 시 상세) */}
      <DemoStatusPanel salesHistory={d.salesHistory} newThisMonth={newThisMonth} won2paid={won2paid}/>

      {weekModal!==null&&<WeekActModal offset={weekModal} acts={d.acts} leads={d.leads} onClose={()=>setWeekModal(null)}/>}

      <SalesRepSection/>
    </div>
  );
}

const SALES_REPS=['신상열','김홍민','장우석','이미정','유정아','이재준'];
const FORMER_REPS=['문민정','최민관'];
const REP_COLORS=['#185FA5','#0F6E56','#534AB7','#D85A30','#BA7517','#1D9E75','#993556','#378ADD'];
function repColor(name,list){const i=list.indexOf(name);return REP_COLORS[(i<0?0:i)%REP_COLORS.length];}

function Donut3D({pct,color,size=92}){
  const p=Math.max(0,Math.min(100,Number(pct)||0));
  const r=size/2-9, c=size/2, circ=2*Math.PI*r;
  const off=circ*(1-p/100);
  const gid='dg'+color.replace('#','')+Math.round(size);
  return (<svg width={size} height={size} viewBox={'0 0 '+size+' '+size}>
    <defs>
      <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stopColor={color} stopOpacity="1"/>
        <stop offset="100%" stopColor={color} stopOpacity="0.55"/>
      </linearGradient>
      <filter id={gid+'s'} x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="2" stdDeviation="3" floodColor={color} floodOpacity="0.5"/>
      </filter>
    </defs>
    <circle cx={c} cy={c} r={r} fill="none" stroke="rgba(255,255,255,.10)" strokeWidth="11"/>
    <circle cx={c} cy={c} r={r} fill="none" stroke={'url(#'+gid+')'} strokeWidth="11" strokeLinecap="round"
      strokeDasharray={circ} strokeDashoffset={off} transform={'rotate(-90 '+c+' '+c+')'} filter={'url(#'+gid+'s)'}/>
    <text x={c} y={c-1} textAnchor="middle" dominantBaseline="middle" fontSize="17" fontWeight="700" fill="#fff">{p}%</text>
    <text x={c} y={c+15} textAnchor="middle" dominantBaseline="middle" fontSize="9" fill="rgba(255,255,255,.6)">달성</text>
  </svg>);
}

    const m={};(data||[]).forEach(r=>{if(r.owner)m[r.owner]=String(Math.round((Number(r.target_amount)||0)/1e4));});

        <button className="btn-ghost" onClick={onClose}>취소</button>

function SalesRepSection(){
  const [data,setData]=useState(null);
  const [sel,setSel]=useState(null);
  const [modal,setModal]=useState(null);
  const [expanded,setExpanded]=useState(false);
  async function load(){
    let leads=[],f=0;
    while(true){const {data}=await sb.from('leads').select('lead_id,owner,prev_owner,stage,funnel_type,expected_revenue,hospital_name,demo_status,lead_status').range(f,f+999);if(!data||!data.length)break;leads=leads.concat(data);if(data.length<1000)break;f+=1000;}
    const {data:acts}=await sb.from('lead_activities').select('owner,activity_date,next_action_date,type,content,lead_id');
    let ord=[],fo=0;
    while(true){const {data}=await sb.from('orders').select('delivered_at,supply_amount,cust_id').range(fo,fo+999);if(!data||!data.length)break;ord=ord.concat(data);if(data.length<1000)break;fo+=1000;if(fo>40000)break;}
    const {data:tg}=await sb.from('revenue_targets').select('year_month,owner,target_amount');
    const {data:co}=await sb.from('customer_owners').select('cust_id,owner');
    setData({leads,acts:acts||[],orders:ord,targets:tg||[],custOwners:co||[]});
  }
  useEffect(()=>{load();},[]);
  if(!data)return <LoadingBear pad={30}/>;

  const repList=[...new Set([...SALES_REPS,...data.leads.map(l=>l.owner).filter(Boolean),...data.targets.map(t=>t.owner).filter(Boolean)])].filter(r=>!FORMER_REPS.includes(r));
  const custOwnerMap={};data.custOwners.forEach(x=>{custOwnerMap[x.cust_id]=x.owner;});
  const yr=new Date().getFullYear();
  const ymNow=new Date().toISOString().slice(0,7);

  function repStat(rep){
    const myLeads=data.leads.filter(l=>l.owner===rep);
    const myActs=data.acts.filter(a=>a.owner===rep);
    const wk=weekRange(0);
    const thisWeek=myActs.filter(a=>inRange(a.activity_date,wk)).length;
    const today=new Date();today.setHours(0,0,0,0);
    const pendingTask=myActs.filter(a=>{if(!a.next_action_date)return false;const d=new Date(a.next_action_date);d.setHours(0,0,0,0);return d>=today;}).length;
    const overdue=myActs.filter(a=>{if(!a.next_action_date)return false;const d=new Date(a.next_action_date);d.setHours(0,0,0,0);return d<today;}).length;
    const todayPlan=myActs.filter(a=>{if(!a.next_action_date)return false;const d=new Date(a.next_action_date);d.setHours(0,0,0,0);return d.getTime()===today.getTime();}).length;
    let targetSum=0;data.targets.forEach(t=>{if(t.owner===rep&&t.year_month&&t.year_month.startsWith(yr+'-'))targetSum+=Number(t.target_amount)||0;});

    const ach=targetSum?Math.round(actualSum/targetSum*100):0;
    const oppo=myLeads.filter(l=>l.stage&&!['계약완료','보류'].includes(l.stage)).length;
    const demo=myLeads.filter(l=>l.demo_status&&/진행|중/.test(l.demo_status)).length;
    let forecast=0;myLeads.forEach(l=>{forecast+=(Number(l.expected_revenue)||0)*((l.funnel_type==='B2B'?W_B2B:W_GEN)[l.stage]||0);});
    return {rep,myLeads,myActs,thisWeek,pendingTask,overdue,todayPlan,targetSum,actualSum,ach,oppo,demo,forecast,custCount:myLeads.length};

            {!expanded&&stats.length>5&&<span style={{width:24,height:24,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:9,fontWeight:700,color:'#fff',background:'rgba(255,255,255,.15)'}}>+{stats.length-5}</span>}
            {expanded&&<><button className="tbtn" style={{background:'linear-gradient(135deg,#2472c8,#185FA5)'}} onClick={()=>setModal('target')}>월 목표 입력</button><button className="tbtn" style={{background:'linear-gradient(135deg,#16997a,#0F6E56)'}} onClick={()=>setModal('cust')}>거래처 담당 지정</button></>}
            <span onClick={()=>setExpanded(v=>!v)} style={{fontSize:12,color:'#85B7EB',cursor:'pointer',marginLeft:4}}>{expanded?'접기 ▴':'펼치기 ▾'}</span>
          </div>
        </div>);
      })()}
      {expanded&&<React.Fragment>
      <div style={{display:'grid',gridTemplateColumns:cur?'1fr 1.5fr':'1fr',gap:14}}>
        <div>
          <div style={{display:'grid',gridTemplateColumns:'1.4fr .7fr .7fr .7fr',gap:6,padding:'0 10px 6px',fontSize:10,color:'var(--t3)',fontWeight:600}}>
            <div>영업사원</div><div style={{textAlign:'center'}}>달성률</div><div style={{textAlign:'center'}}>이번주</div><div style={{textAlign:'center'}}>미처리</div>
          </div>
          {stats.map(s=>{
            const col=repColor(s.rep,repList);const active=sel===s.rep;
            return (<div key={s.rep} onClick={()=>setSel(active?null:s.rep)}
              style={{display:'grid',gridTemplateColumns:'1.4fr .7fr .7fr .7fr',gap:6,alignItems:'center',padding:'10px',borderRadius:10,marginBottom:6,cursor:'pointer',
                background:active?'rgba(24,95,165,.18)':'rgba(255,255,255,.03)',border:'0.5px solid '+(active?col:'var(--border)')}}>
              <div style={{display:'flex',alignItems:'center',gap:8,minWidth:0}}>
                <div style={{width:30,height:30,borderRadius:'50%',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,color:'#fff',background:'linear-gradient(135deg,'+col+','+col+'aa)',boxShadow:'0 2px 6px '+col+'66'}}>{s.rep.slice(0,1)}</div>
                <div style={{minWidth:0}}><div style={{fontSize:13,fontWeight:700,color:'#fff',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{s.rep}</div></div>
              </div>
              <div style={{textAlign:'center'}}>
                <div style={{fontSize:13,fontWeight:700,color:col}}>{s.ach}%</div>
                <div style={{height:4,borderRadius:3,background:'rgba(255,255,255,.10)',marginTop:3,overflow:'hidden'}}><div style={{height:'100%',width:Math.min(100,s.ach)+'%',background:col,borderRadius:3}}/></div>
              </div>
              <div style={{textAlign:'center',fontSize:13,fontWeight:600,color:'#fff'}}>{s.thisWeek}<span style={{fontSize:9,color:'var(--t3)'}}>건</span></div>
              <div style={{textAlign:'center',fontSize:13,fontWeight:600,color:s.overdue>0?'#F09595':'#fff'}}>{s.overdue>0?s.overdue:s.pendingTask}<span style={{fontSize:9,color:'var(--t3)'}}>건</span></div>
            </div>);

        {cur&&(()=>{
          const col=repColor(cur.rep,repList);
          const recent=[...cur.myActs].filter(a=>a.activity_date).sort((a,b)=>new Date(b.activity_date)-new Date(a.activity_date)).slice(0,5);
          const today=new Date();today.setHours(0,0,0,0);
          const upcoming=[...cur.myActs].filter(a=>{if(!a.next_action_date)return false;const d=new Date(a.next_action_date);d.setHours(0,0,0,0);return d>=today;}).sort((a,b)=>new Date(a.next_action_date)-new Date(b.next_action_date)).slice(0,5);
          const leadName={};data.leads.forEach(l=>{leadName[l.lead_id]=l.hospital_name;});
          return (
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            <div style={{display:'flex',alignItems:'center',gap:12,padding:'12px 14px',borderRadius:12,background:'linear-gradient(135deg,'+col+'33,#13202f 75%)',border:'0.5px solid '+col+'66'}}>
              <Donut3D pct={cur.ach} color={col} size={92}/>
              <div style={{flex:1}}>
                <div style={{fontSize:17,fontWeight:700,color:'#fff'}}>{cur.rep}</div>

                <div style={{display:'flex',gap:14,marginTop:8}}>
