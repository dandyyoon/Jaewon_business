              </div>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
              <div style={{background:'rgba(255,255,255,.03)',border:'0.5px solid var(--border)',borderRadius:10,padding:'10px 12px'}}>
                <div style={{fontSize:12,fontWeight:600,color:'#85B7EB',marginBottom:8}}>최근 활동</div>
                {recent.length===0?<Empty msg="활동 없음"/>:recent.map((a,i)=>(
                  <div key={i} style={{display:'flex',gap:8,padding:'5px 0',borderBottom:i<recent.length-1?'0.5px solid var(--border)':'none'}}>
                    <div style={{fontSize:10,color:'var(--t3)',width:42,flexShrink:0}}>{(a.activity_date||'').slice(5)}</div>
                    <div style={{fontSize:11,color:'var(--t2)',minWidth:0,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}><span style={{color:col,fontWeight:600}}>{a.type||''}</span> {leadName[a.lead_id]||a.content||''}</div>
                  </div>
                ))}
              </div>
              <div style={{background:'rgba(255,255,255,.03)',border:'0.5px solid var(--border)',borderRadius:10,padding:'10px 12px'}}>
                <div style={{fontSize:12,fontWeight:600,color:'#FAC775',marginBottom:8}}>예정 일정 (Task)</div>
                {upcoming.length===0?<Empty msg="예정 일정 없음"/>:upcoming.map((a,i)=>(
                  <div key={i} style={{display:'flex',gap:8,padding:'5px 0',borderBottom:i<upcoming.length-1?'0.5px solid var(--border)':'none'}}>
                    <div style={{fontSize:10,color:'#FAC775',width:42,flexShrink:0}}>{(a.next_action_date||'').slice(5)}</div>
                    <div style={{fontSize:11,color:'var(--t2)',minWidth:0,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{leadName[a.lead_id]||a.content||a.type||''}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>);
        })()}
      </div>
      {!cur&&<div style={{fontSize:11,color:'var(--t3)',textAlign:'center',marginTop:8}}>영업사원을 클릭하면 상세 활동이 표시됩니다</div>}
      </React.Fragment>}

      {expanded&&(()=>{
        const formerLeads=data.leads.filter(l=>l.prev_owner&&FORMER_REPS.includes(l.prev_owner));
        if(formerLeads.length===0)return null;
        const byFormer={};
        formerLeads.forEach(l=>{const k=l.prev_owner;if(!byFormer[k])byFormer[k]={count:0,to:{}};byFormer[k].count++;const t=l.owner||'(미지정)';byFormer[k].to[t]=(byFormer[k].to[t]||0)+1;});
        return (
          <div style={{marginTop:14,paddingTop:12,borderTop:'0.5px solid var(--border)'}}>
            <div style={{fontSize:12,fontWeight:600,color:'#B4B2A9',marginBottom:8}}>퇴사자 이관 이력</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:10}}>
              {Object.keys(byFormer).map(name=>{
                const info=byFormer[name];
                const toStr=Object.keys(info.to).map(t=>t+' '+info.to[t]+'건').join(', ');
                return (
                  <div key={name} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 12px',borderRadius:9,background:'rgba(255,255,255,.025)',border:'0.5px solid var(--border)'}}>

                    </div>
                  </div>
                );
              })}
            </div>
            <div style={{fontSize:10,color:'var(--t3)',marginTop:7}}>※ 퇴사자가 등록한 활동 이력은 활동 기록에 그대로 보존됩니다</div>
          </div>
        );
      })()}

      {modal==='target'&&<RepTargetModal reps={stats} repList={repList} onClose={()=>setModal(null)} onSaved={()=>{setModal(null);load();}}/>}
      {modal==='cust'&&<RepCustModal repList={repList} onClose={()=>setModal(null)} onSaved={()=>{setModal(null);load();}}/>}
    </div>
  );
}

function EventModal({ev,onClose,onSaved}){
  const e=ev||{};
  const [f,setF]=useState({event_name:e.event_name||'',scope:e.scope||'국내',country:e.country||'',location:e.location||'',event_type:e.event_type||'부스',event_date:e.event_date||'',event_end_date:e.event_end_date||'',status:e.status||'준비중',booth_cost:e.booth_cost||'',currency:e.currency||'KRW',target_visitors:e.target_visitors||'',actual_visitors:e.actual_visitors||'',target_demos:e.target_demos||'',actual_demos:e.actual_demos||'',leads_collected:e.leads_collected||'',staff:e.staff||'',owner:e.owner||'',remark:e.remark||''});
  const [chk,setChk]=useState(e.checklist||{});
  function set(k,v){setF(p=>({...p,[k]:v}));}
  async function save(){
    if(!f.event_name.trim()){alert('전시/학회명을 입력하세요.');return;}
    const n=k=>f[k]===''?null:Number(f[k]);
    const row={event_name:f.event_name,scope:f.scope,country:f.country,location:f.location,event_type:f.event_type,event_date:f.event_date||null,event_end_date:f.event_end_date||null,status:f.status,booth_cost:n('booth_cost'),currency:f.currency,target_visitors:n('target_visitors'),actual_visitors:n('actual_visitors'),target_demos:n('target_demos'),actual_demos:n('actual_demos'),leads_collected:n('leads_collected'),checklist:chk,staff:f.staff,owner:f.owner,remark:f.remark,updated_at:new Date().toISOString()};
    let res; if(ev&&ev.id)res=await sb.from('events').update(row).eq('id',ev.id); else res=await sb.from('events').insert(row);
    if(res.error){alert('저장 오류: '+res.error.message);return;}
    onSaved();
  }
  return (
    <div className="ov"><div className="modal" style={{width:560}}>
      <div style={{fontSize:14,fontWeight:600,marginBottom:14}}>{ev?'전시/학회 수정':'전시/학회 추가'}</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        <div style={{gridColumn:'1 / 3'}}><label className="lbl">전시/학회명 *</label><input value={f.event_name} onChange={ev2=>set('event_name',ev2.target.value)}/></div>
        <div><label className="lbl">구분</label><select value={f.scope} onChange={ev2=>set('scope',ev2.target.value)}><option>국내</option><option>해외</option></select></div>
        <div><label className="lbl">국가</label><input value={f.country} onChange={ev2=>set('country',ev2.target.value)}/></div>
        <div style={{gridColumn:'1 / 3'}}><label className="lbl">장소</label><input value={f.location} onChange={ev2=>set('location',ev2.target.value)}/></div>
        <div><label className="lbl">유형</label><select value={f.event_type} onChange={ev2=>set('event_type',ev2.target.value)}><option>부스</option><option>광고</option><option>부스+광고</option><option>조립부스</option><option>테이블부스</option><option>독립부스</option></select></div>
        <div><label className="lbl">상태</label><select value={f.status} onChange={ev2=>set('status',ev2.target.value)}><option>준비중</option><option>진행중</option><option>완료</option><option>취소</option></select></div>
        <div><label className="lbl">시작일</label><input type="date" value={f.event_date} onChange={ev2=>set('event_date',ev2.target.value)}/></div>
        <div><label className="lbl">종료일</label><input type="date" value={f.event_end_date} onChange={ev2=>set('event_end_date',ev2.target.value)}/></div>
        <div><label className="lbl">부스 비용</label><input type="text" inputMode="numeric" value={commafy(f.booth_cost)} onChange={ev2=>set('booth_cost',uncomma(ev2.target.value))}/></div>
        <div><label className="lbl">통화</label><select value={f.currency} onChange={ev2=>set('currency',ev2.target.value)}><option>KRW</option><option>USD</option></select></div>
        <div><label className="lbl">목표 방문자</label><input type="number" value={f.target_visitors} onChange={ev2=>set('target_visitors',ev2.target.value)}/></div>
        <div><label className="lbl">실적 방문자</label><input type="number" value={f.actual_visitors} onChange={ev2=>set('actual_visitors',ev2.target.value)}/></div>
        <div><label className="lbl">목표 데모</label><input type="number" value={f.target_demos} onChange={ev2=>set('target_demos',ev2.target.value)}/></div>
        <div><label className="lbl">수집 리드</label><input type="number" value={f.leads_collected} onChange={ev2=>set('leads_collected',ev2.target.value)}/></div>
        <div><label className="lbl">출장자</label><input value={f.staff} onChange={ev2=>set('staff',ev2.target.value)}/></div>
        <div><label className="lbl">담당</label><input value={f.owner} onChange={ev2=>set('owner',ev2.target.value)}/></div>
      </div>
      <div style={{marginTop:12}}><label className="lbl">준비 체크리스트</label>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:6}}>
          {EV_CHECK.map(([k,lb])=><div key={k} onClick={()=>setChk(p=>({...p,[k]:!p[k]}))} style={{display:'flex',alignItems:'center',gap:6,padding:'6px 8px',borderRadius:7,cursor:'pointer',background:chk[k]?'rgba(15,110,86,.25)':'rgba(255,255,255,.03)',border:'0.5px solid '+(chk[k]?'#0F6E56':'var(--border)')}}><span style={{width:14,height:14,borderRadius:4,background:chk[k]?'#0F6E56':'transparent',border:'1px solid '+(chk[k]?'#0F6E56':'var(--border-md)'),color:'#fff',fontSize:10,textAlign:'center',lineHeight:'13px'}}>{chk[k]?'✓':''}</span><span style={{fontSize:11,color:chk[k]?'#fff':'var(--t2)'}}>{lb}</span></div>)}
        </div>
      </div>
      <div style={{marginTop:10}}><label className="lbl">비고</label><textarea rows="2" value={f.remark} onChange={ev2=>set('remark',ev2.target.value)}/></div>
      <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:14}}><button className="btn-ghost" onClick={onClose}>취소</button><button className="btn" onClick={save}>저장</button></div>
    </div></div>
  );
}

function EventsView(){
  const [events,setEvents]=useState([]);const [loading,setLoading]=useState(true);
  const [scope,setScope]=useState('전체');const [modal,setModal]=useState(null);
  async function load(){setLoading(true);const {data}=await sb.from('events').select('*').order('event_date');setEvents(data||[]);setLoading(false);}
  useEffect(()=>{load();},[]);
  const list=events.filter(e=>scope==='전체'||e.scope===scope);
  const today=new Date();today.setHours(0,0,0,0);
  const upcoming=events.filter(e=>e.event_date&&new Date(e.event_date)>=today).length;
  const inprog=events.filter(e=>e.status==='진행중').length;
  const leadSum=events.reduce((s,e)=>s+(Number(e.leads_collected)||0),0);
  function prog(e){const c=e.checklist||{};const done=EV_CHECK.filter(([k])=>c[k]).length;return Math.round(done/EV_CHECK.length*100);}
  function cost(e){if(!e.booth_cost)return '-';return (e.currency==='USD'?'$':'₩')+Number(e.booth_cost).toLocaleString();}

    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        <div className="hd" style={{color:'#EF9F27'}}>학회·부스·전시회</div>
        <div style={{display:'flex',gap:4,marginLeft:8}}>
          {['전체','국내','해외'].map(s=><span key={s} onClick={()=>setScope(s)} style={{fontSize:11,padding:'4px 12px',borderRadius:20,cursor:'pointer',background:scope===s?'#3a2f1a':'transparent',color:scope===s?'#EF9F27':'var(--t3)',border:'0.5px solid '+(scope===s?'#BA7517':'var(--border)')}}>{s}</span>)}
        </div>
        <button className="btn" style={{marginLeft:'auto',background:'linear-gradient(135deg,#D89030,#BA7517)'}} onClick={()=>setModal({})}>+ 전시/학회 추가</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12}}>
        <Kpi l="전체 전시·학회" v={events.length} c="#EF9F27" sub={'국내 '+events.filter(e=>e.scope==='국내').length+' · 해외 '+events.filter(e=>e.scope==='해외').length}/>
        <Kpi l="진행중" v={inprog} c="#5DCAA5" sub="status 진행중"/>
        <Kpi l="예정" v={upcoming} c="#85B7EB" sub="오늘 이후 시작"/>
        <Kpi l="수집 리드 합계" v={leadSum} c="#AFA9EC" sub="전시 통한 리드"/>
      </div>

// ===== 분석건수 이상감지 계산 (CRM 로직 이식) =====
function uPad2(n){return n<10?'0'+n:String(n);}
function uMean(arr){if(!arr.length)return 0;return arr.reduce((s,v)=>s+v,0)/arr.length;}
function uStddev(arr,avg){if(arr.length<2)return 0;const v=arr.reduce((s,x)=>s+Math.pow(x-avg,2),0)/arr.length;return Math.sqrt(v);}
function uNormHospType(rawType){if(!rawType||rawType==='미확인')return '미확인';var t=rawType;if(t.indexOf('소아청소년과')>=0||t.indexOf('아동병원')>=0||t==='소아과'||t.indexOf('소아정형')>=0)return '소아청소년과';if(t.indexOf('정형외과')>=0||t==='정형회과')return '정형외과';if(t.indexOf('치과')>=0)return '치과';if(t.indexOf('대학병원')>=0||t.indexOf('종합병원')>=0)return '종합·대학병원';if(t.indexOf('한의원')>=0||t.indexOf('한방')>=0)return '한방';return '기타의원';}

function buildUsageStats(usageRows,customers,vocRows){
  var map={BA:{},OA:{}};
  usageRows.forEach(function(row){
    var ym=String(row.year_month||'').trim();var hosp=String(row.hospital_name||'').trim();var custId=String(row.cust_id||'').trim();var prod=String(row.product||'').trim().toUpperCase();var cnt=Number(row.cnt||0);
    if(!ym||!hosp||!cnt)return;if(prod!=='BA'&&prod!=='OA')return;
    if(!map[prod][hosp])map[prod][hosp]={custId:custId,months:{}};
    map[prod][hosp].months[ym]=(map[prod][hosp].months[ym]||0)+cnt;
  });
  var allYms=[];['BA','OA'].forEach(function(p){Object.keys(map[p]).forEach(function(h){Object.keys(map[p][h].months).forEach(function(ym){allYms.push(ym);});});});
  if(allYms.length===0)return {ba:{hospitals:[],summary:{}},oa:{hospitals:[],summary:{}},latestYm:''};
  allYms.sort();var latestYm=allYms[allYms.length-1];
  var yr=parseInt(latestYm.slice(0,4));var mo=parseInt(latestYm.slice(4,6));
  function recentMonths(n){var r=[];for(var i=0;i<n;i++){var m=mo-i;var y=yr;while(m<=0){m+=12;y--;}r.unshift(y+uPad2(m));}return r;}
  var planMap={},custIdMap={};
  (customers||[]).forEach(function(c){var nm=String(c.hospital_name||'').trim();if(nm){planMap[nm]=String(c.plan||'').trim();if(!custIdMap[nm])custIdMap[nm]=String(c.cust_id||'').trim();}});
  var custById={};(customers||[]).forEach(function(c){custById[String(c.cust_id||'').trim()]=c;});
  var csAlertMap={};var now=new Date();var threeMonAgo=new Date(now.getFullYear(),now.getMonth()-3,1);
  (vocRows||[]).forEach(function(r){var cid=String(r.cust_id||'').trim();var done=String(r.done||'').trim();var rt=String(r.receipt_type||'').trim();var d=new Date(String(r.received_at||''));if(!cid||isNaN(d.getTime())||d<threeMonAgo)return;if(done!=='Y'||rt==='불만'){if(!csAlertMap[cid])csAlertMap[cid]={count:0,hasBad:false};csAlertMap[cid].count++;if(rt==='불만')csAlertMap[cid].hasBad=true;}});

  function analyzeProduct(prodMap){
    var hospitals=[];var summary={안정형:0,변동형:0,성장형:0,불규칙:0,비활성:0,피크대비소멸:0};
    var recent12=recentMonths(12);var recent6=recentMonths(6);
    Object.keys(prodMap).forEach(function(hosp){
      var h=prodMap[hosp];var resolvedCustId=h.custId||custIdMap[hosp]||'';var masterHospName=hosp;
      var fc=resolvedCustId?custById[resolvedCustId]:null;if(fc)masterHospName=String(fc.hospital_name||'').trim();
      var plan=planMap[masterHospName]||planMap[hosp]||'';var csAlert=(resolvedCustId&&csAlertMap[resolvedCustId])||null;
      var counts12=recent12.map(function(ym){return h.months[ym]||0;});var counts6=recent6.map(function(ym){return h.months[ym]||0;});
      var nonZero12=counts12.filter(function(v){return v>0;});var nonZero6=counts6.filter(function(v){return v>0;});
      var allCountsArr=Object.keys(h.months).sort().map(function(ym){return h.months[ym]||0;});var nonZeroAll=allCountsArr.filter(function(v){return v>0;});
      var latestCount=h.months[latestYm]||0;var avg12=uMean(counts12);var avg6Val=uMean(nonZero6.length>0?counts6:counts12);
      var sdBase=nonZeroAll.length>=3?nonZeroAll:(nonZero12.length>=2?nonZero12:counts12);var sd=uStddev(sdBase,uMean(sdBase));
      var upper=avg6Val+1.5*sd;var lower=Math.max(0,avg6Val-1.5*sd);
      var activeRatio=counts12.filter(function(v){return v>0;}).length/12;
      var firstHalf=recent12.slice(0,6).map(function(ym){return h.months[ym]||0;});var secondHalf=recent12.slice(6).map(function(ym){return h.months[ym]||0;});
      var firstAvg=uMean(firstHalf);var secondAvg=uMean(secondHalf);var growthRate=firstAvg>0?(secondAvg-firstAvg)/firstAvg*100:0;
      var cvAvg=uMean(nonZero12.length>0?nonZero12:[0]);var cv=cvAvg>0?sd/cvAvg:0;var allAvg=uMean(allCountsArr);
      var type='불규칙';
      if(nonZero6.length===0)type='비활성';
      else if(allAvg>=50&&latestCount>0&&latestCount<allAvg*0.2)type='피크대비소멸';
      else if(growthRate>70)type='성장형';
      else if(activeRatio>=0.5&&cv<=0.6)type='안정형';
      else if(activeRatio>=0.5&&cv>0.6)type='변동형';
      else type='불규칙';
      summary[type]=(summary[type]||0)+1;
      var alert=null;if(latestCount>upper&&upper>0)alert='up';else if(latestCount<lower&&latestCount>0&&avg6Val>10)alert='down';
      var movingAvgData=recent12.map(function(ym,i){var win=recent12.slice(Math.max(0,i-5),i+1).map(function(m){return h.months[m]||0;});var wAvg=uMean(win);var wSd=uStddev(win,wAvg);return {ym:ym,avg:Math.round(wAvg),upper:Math.round(wAvg+1.5*wSd),lower:Math.round(Math.max(0,wAvg-1.5*wSd)),count:h.months[ym]||0};});
      var curQ=[],prevQ=[];for(var qi=0;qi<3;qi++){var m=mo-qi,y=yr;while(m<=0){m+=12;y--;}curQ.push(y+uPad2(m));}
      for(var qi2=3;qi2<6;qi2++){var m2=mo-qi2,y2=yr;while(m2<=0){m2+=12;y2--;}prevQ.push(y2+uPad2(m2));}
      var curQSum=curQ.reduce(function(s,m){return s+(h.months[m]||0);},0);var prevQSum=prevQ.reduce(function(s,m){return s+(h.months[m]||0);},0);
      var qChangeRate=prevQSum>0?(curQSum-prevQSum)/prevQSum*100:null;
      hospitals.push({hospName:masterHospName,custId:resolvedCustId,plan:plan,type:type,hospType:uNormHospType(fc?String(fc.hospital_type||'미확인').trim():'미확인'),latestCount:latestCount,avg6:Math.round(avg6Val),avg12:Math.round(avg12),upperBand:Math.round(upper),lowerBand:Math.round(lower),qChangeRate:qChangeRate!==null?Math.round(qChangeRate):null,alert:alert,csAlert:csAlert,movingAvgData:movingAvgData,months:h.months});
    });
    hospitals.sort(function(a,b){if(a.alert&&!b.alert)return -1;if(!a.alert&&b.alert)return 1;return b.latestCount-a.latestCount;});
    return {hospitals:hospitals,summary:summary};
  }
  return {ba:analyzeProduct(map.BA),oa:analyzeProduct(map.OA),latestYm:latestYm};
}

// 분석건수 이상감지 상세 (병원 클릭 시 인라인)
// 전년 비교 (월별 데이터 + 기준월 → 전년동월·전년동기·전년대비 누적, 막대 표시)
function YoYCompare({months,latestYm}){
  const M=months||{};
  const pad2=n=>n<10?'0'+n:String(n);
  const ly=String(latestYm||'');const yr=parseInt(ly.slice(0,4))||0;const mo=parseInt(ly.slice(4,6))||0;
  if(!yr||!mo)return null;
  const sumMonths=(y,mList)=>mList.reduce((s,m)=>s+(M[y+pad2(m)]||0),0);
  const curM=M[yr+pad2(mo)]||0,prevM=M[(yr-1)+pad2(mo)]||0;
  const cmpMoM={cur:curM,prev:prevM,rate:prevM>0?Math.round((curM-prevM)/prevM*1000)/10:null};
  const mList=[];for(let m=1;m<=mo;m++)mList.push(m);
  const curY=sumMonths(yr,mList),prevY=sumMonths(yr-1,mList);
  const cmpYoY={cur:curY,prev:prevY,rate:prevY>0?Math.round((curY-prevY)/prevY*1000)/10:null};
  const qMonths=[];for(let i=0;i<3;i++){let m=mo-i,y=yr;while(m<=0){m+=12;y--;}qMonths.push({y,m});}
  const curQ=qMonths.reduce((s,x)=>s+(M[x.y+pad2(x.m)]||0),0);
  const prevQ=qMonths.reduce((s,x)=>s+(M[(x.y-1)+pad2(x.m)]||0),0);
  const cmpQoQ={cur:curQ,prev:prevQ,rate:prevQ>0?Math.round((curQ-prevQ)/prevQ*1000)/10:null};
  const cmpColor=r=>r==null?'var(--t3)':r>0?'#4ade80':r<0?'#f87171':'var(--t2)';
  const cmpTxt=r=>r==null?'—':(r>0?'+':'')+r+'%';
  return (<div>
    <div style={{fontSize:11,fontWeight:700,color:'#85B7EB',marginBottom:6}}>전년 비교 <span style={{fontSize:9,color:'var(--t3)',fontWeight:400}}>기준 {ly.slice(0,4)}년 {ly.slice(4)}월</span></div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8}}>
      {[['전년동월 대비',cmpMoM,'이번달 vs 작년 같은달'],['전년동기 대비',cmpQoQ,'최근 3개월 vs 작년 동분기'],['전년대비 누적',cmpYoY,'올해누적 vs 작년동기누적']].map(([l,d,sub])=>{
        const barMax=Math.max(d.cur,d.prev,1);
        const curH=Math.max(3,Math.round(d.cur/barMax*46));
        const prevH=Math.max(3,Math.round(d.prev/barMax*46));

}

function InsightView(){
  const [leads,setLeads]=useState([]);const [deals,setDeals]=useState([]);const [orders,setOrders]=useState([]);const [rates,setRates]=useState([]);const [loading,setLoading]=useState(true);
  async function load(){
    setLoading(true);
    let ld=[],f=0;while(true){const {data}=await sb.from('leads').select('stage,funnel_type,lead_source,expected_revenue,cust_id').range(f,f+999);if(!data||!data.length)break;ld=ld.concat(data);if(data.length<1000)break;f+=1000;}
    let od=[],f2=0;while(true){const {data}=await sb.from('orders').select('delivered_at,supply_amount,cust_id').range(f2,f2+999);if(!data||!data.length)break;od=od.concat(data);if(data.length<1000)break;f2+=1000;if(f2>40000)break;}
    const [dl,rt]=await Promise.all([sb.from('overseas_deals').select('stage,funnel_type,amount,currency'),sb.from('exchange_rates').select('usd_krw').order('rate_date',{ascending:false}).limit(1)]);
    setLeads(ld);setDeals(dl.data||[]);setOrders(od);setRates(rt.data||[]);setLoading(false);
  }
  useEffect(()=>{load();},[]);
  const rate=rates.length?Number(rates[0].usd_krw):null;
  // 전환율
  const domWon=leads.filter(l=>l.stage==='계약완료'||l.stage==='업셀링').length;
  const ovsWon=deals.filter(d=>d.stage==='Sales'||d.stage==='계약').length;
  const totalLD=leads.length+deals.length;
  const convRate=totalLD?Math.round((domWon+ovsWon)/totalLD*100):0;
  const linkedN=leads.filter(l=>l.cust_id).length;
  // 가중 예상매출
  let pipe=0;leads.forEach(l=>{pipe+=(Number(l.expected_revenue)||0)*((l.funnel_type==='B2B'?W_B2B:W_GEN)[l.stage]||0);});
  deals.forEach(d=>{if(!d.amount)return;const w=(d.funnel_type==='B2B'?W_B2B:W_GEN)[d.stage]||0;const krw=d.currency==='KRW'?Number(d.amount):(toKRW(d.amount,rate)||0);pipe+=krw*w;});
  // 매출 추이 (orders supply_amount by month)
  const rev={};orders.forEach(o=>{if(!o.delivered_at)return;const dt=new Date(o.delivered_at);if(isNaN(dt))return;const k=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');rev[k]=(rev[k]||0)+(Number(o.supply_amount)||0);});
  const revMonths=Object.keys(rev).sort().slice(-12);
  const thisYear=new Date().getFullYear();
  const yearRev=orders.reduce((s,o)=>{if(!o.delivered_at)return s;const dt=new Date(o.delivered_at);return (!isNaN(dt)&&dt.getFullYear()===thisYear)?s+(Number(o.supply_amount)||0):s;},0);
  // 단계별 전환 퍼널 (국내 일반, 보류 제외, 누적 도달)
  const FUN=STAGES_GEN.slice(0,7);
  const idx=s=>STAGES_GEN.indexOf(s);
  const gen=leads.filter(l=>(l.funnel_type||'일반')==='일반'&&l.stage!=='보류');
  const reached=FUN.map((s,i)=>gen.filter(l=>idx(l.stage)>=i&&idx(l.stage)<8).length);
  const fmax=Math.max(1,...reached);
  // 리드 소스
  const src={};leads.forEach(l=>{const s=l.lead_source||'(미지정)';src[s]=(src[s]||0)+1;});
  const srcKeys=Object.keys(src).sort((a,b)=>src[b]-src[a]).slice(0,8);
  const PC=['#5DCAA5','#85B7EB','#AFA9EC','#EF9F27','#F472B6','#2DD4BF','#FBBF24','#94a3b8'];
  // 해외 단계
  const ovsBars=STAGES_B2B.slice(0,7).map(s=>deals.filter(d=>d.funnel_type==='B2B'&&d.stage===s).length);
  const revLine={type:'line',data:{labels:revMonths,datasets:[{data:revMonths.map(m=>Math.round(rev[m]/1e4)),borderColor:'#5DCAA5',backgroundColor:'rgba(93,202,165,.16)',fill:true,tension:.35,pointRadius:2}]},options:{plugins:{legend:{display:false},tooltip:{callbacks:{}}},scales:{y:{beginAtZero:true,title:{display:true,text:'만원'}}}}};
  const srcDonut={type:'doughnut',data:{labels:srcKeys,datasets:[{data:srcKeys.map(k=>src[k]),backgroundColor:srcKeys.map((k,i)=>PC[i%PC.length]),borderWidth:0}]},options:{cutout:'62%',plugins:{legend:{display:false}}}};
  const ovsBar={type:'bar',data:{labels:STAGES_B2B.slice(0,7),datasets:[{data:ovsBars,backgroundColor:'#534AB7',borderRadius:5}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}};
  return (
    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      <div className="hd" style={{color:'#F472B6'}}>전환·매출 인사이트</div>
      {loading?<LoadingBear/>:
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12}}>
          <Kpi l="전환율" v={convRate+'%'} c="#F472B6" sub={'계약완료+ '+(domWon+ovsWon)+' / '+totalLD}/>
          <Kpi l="고객 연결" v={linkedN} c="#22C55E" sub={leads.length?Math.round(linkedN/leads.length*100)+'% 연결':''}/>
          <Kpi l="가중 예상매출" v={eok(pipe)} c="#85B7EB" sub="국내+해외"/>
          <Kpi l={thisYear+' 매출'} v={eok(yearRev)} c="#5DCAA5" sub="납품일 기준 공급가액"/>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1.3fr 1fr',gap:12}}>
          <div className="panel">
            <div style={{fontSize:13,fontWeight:600,color:'#85B7EB',marginBottom:8}}>국내 단계별 전환 퍼널 <span style={{fontSize:10,color:'var(--t3)',fontWeight:400}}>· 보류 제외, 누적 도달</span></div>
            {gen.length===0?<Empty msg="데이터 없음"/>:
            <div style={{display:'flex',flexDirection:'column',gap:6}}>
              {FUN.map((s,i)=>{const w=Math.round(reached[i]/fmax*100);const cv=i>0&&reached[i-1]?Math.round(reached[i]/reached[i-1]*100):null;return (
                <div key={s} style={{display:'flex',alignItems:'center',gap:9}}>
                  <div style={{width:74,fontSize:11,color:'var(--t2)'}}>{s}</div>
                  <div style={{flex:1,height:18,background:'#13202f',borderRadius:5,overflow:'hidden'}}><div style={{height:'100%',width:Math.max(w,reached[i]?5:0)+'%',background:STAGE_C[s]||'#185FA5',borderRadius:5}}/></div>
                  <div style={{width:34,textAlign:'right',fontSize:12,fontWeight:600}}>{reached[i]}</div>
                  <div style={{width:42,textAlign:'right',fontSize:10,color:cv!=null?(cv>=50?'#5DCAA5':'#EF9F27'):'var(--t3)'}}>{cv!=null?cv+'%':''}</div>
                </div>
              );})}
            </div>}
          </div>
          <div className="panel">
            <div style={{fontSize:13,fontWeight:600,color:'#85B7EB',marginBottom:8}}>리드 유입경로</div>
            {srcKeys.length===0?<Empty msg="데이터 없음"/>:
            <div style={{display:'flex',alignItems:'center',gap:12}}>
              <div style={{width:120}}><ChartBox cfg={srcDonut} height={120}/></div>
              <div style={{flex:1,maxHeight:150,overflow:'auto'}}>{srcKeys.map((k,i)=><div key={k} style={{display:'flex',alignItems:'center',gap:6,marginBottom:3}}><span style={{width:8,height:8,borderRadius:2,background:PC[i%PC.length]}}/><span style={{fontSize:11,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{k}</span><span style={{fontSize:11,color:'var(--t2)'}}>{src[k]}</span></div>)}</div>
            </div>}
          </div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1.6fr 1fr',gap:12}}>
          <div className="panel">
            <div style={{fontSize:13,fontWeight:600,color:'#85B7EB',marginBottom:8}}>매출 추이 <span style={{fontSize:10,color:'var(--t3)',fontWeight:400}}>· 최근 12개월 · CRM 주문 공급가액(만원)</span></div>
            {revMonths.length===0?<Empty msg="주문 매출 데이터 없음"/>:<ChartBox cfg={revLine} height={170}/>}
          </div>
          <div className="panel">
            <div style={{fontSize:13,fontWeight:600,color:'#85B7EB',marginBottom:8}}>해외 BD 단계 분포</div>
            {deals.length===0?<Empty msg="해외 딜 없음"/>:<ChartBox cfg={ovsBar} height={170}/>}
          </div>
        </div>
      </div>}
    </div>
  );
}

function NewLeadModal({onClose,onSaved}){
  const [type,setType]=useState('hospital');
  const [sols,setSols]=useState([]);
  const [f,setF]=useState({});
  const [saving,setSaving]=useState(false);
  const isH=type==='hospital';
  const g=k=>f[k]||'';
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const toggleSol=x=>setSols(p=>p.includes(x)?p.filter(y=>y!==x):[...p,x]);
  const commafy=v=>{v=String(v).replace(/[^0-9]/g,'');return v?Number(v).toLocaleString():'';};
  async function save(){
    if(!g('name').trim()||!g('contact').trim()){alert(isH?'병원명과 담당자는 필수입니다':'기관명과 담당자는 필수입니다');return;}
    setSaving(true);
    try{
      const today=new Date().toISOString().slice(0,10);
      const er=g('er').replace(/[^0-9]/g,'');const sj=sols.join(', ');
      const {data}=await sb.from('leads').select('lead_id').order('lead_id',{ascending:false}).limit(1);
      let n=1;if(data&&data[0]){const m=String(data[0].lead_id).match(/(\d+)/);if(m)n=parseInt(m[1])+1;}
      const lead_id='L_'+String(n).padStart(4,'0');

        funnel_type:isH?'일반':'B2B',stage:isH?'리드':'Lead',lead_status:'리드',lead_created_date:today,
        interest_solution:sj||null,target_solution:sj||null,expected_revenue:er?Number(er):null,
        adopt_timing:g('tcd')||null,decision_maker:g('dm')||null,competitor:g('comp')||null,
        needs:g('needs')||null,remark:g('remark')||null,

      else Object.assign(lead,{biz_area:g('biz')||null,org_scale:g('scale')||null,collab:g('collab')||null,nda_status:g('nda')||null,mou_status:g('mou')||null,poc_status:g('poc')||null});
      const r1=await sb.from('leads').insert(lead);

      const contact={lead_id,contact_seq:1,contact_name:g('contact'),position:g('pos')||null,department:isH?(g('dept')||null):(g('dept2')||null),
        specialty:isH?(g('spec')||null):null,phone:g('phone')||null,email:g('email')||null,
        pre_meeting_interest:sj||null,research_notes:g('rnotes')||null,training_hospital:isH?(g('train')||null):null};
      const r2=await sb.from('lead_contacts').insert(contact);
      if(r2.error)throw r2.error;
      onSaved();
    }catch(e){alert('저장 오류: '+(e.message||e));setSaving(false);}
  }
  const Tab=(t,label,icon)=><span onClick={()=>{setType(t);setSols([]);}} style={{flex:1,textAlign:'center',padding:11,borderRadius:9,cursor:'pointer',fontSize:13,fontWeight:600,color:type===t?'#fff':'var(--t3)',background:type===t?'linear-gradient(135deg,#2563EB,#1d4fd0)':'rgba(255,255,255,.04)',border:'0.5px solid '+(type===t?'#2563EB':'var(--border)'),boxShadow:type===t?'0 4px 12px rgba(37,99,235,.4)':'none'}}>{icon} {label}</span>;
  const In=(k,ph)=><input value={g(k)} placeholder={ph||''} onChange={e=>set(k,e.target.value)}/>;
  const Field=(lbl,k,ph)=><div><label className="lbl">{lbl}</label>{In(k,ph)}</div>;
  const sec={fontSize:12,fontWeight:700,color:'#85B7EB',margin:'16px 0 10px'};
  const sub={fontSize:10,color:'var(--t3)',fontWeight:400};
  return (
    <div className="ov"><div className="modal" style={{width:920,maxWidth:'100%',maxHeight:'90vh',overflow:'auto'}}>
      <div style={{display:'flex',alignItems:'center',marginBottom:14}}><span style={{fontSize:15,fontWeight:700}}>📋 신규 리드 추가</span><button className="tbtn" style={{marginLeft:'auto',background:'rgba(255,255,255,.06)'}} onClick={onClose}>✕</button></div>

function calcPresurveyScore(f){
  let s=0;
  const items=(f.confirmed_items||'').split(',').map(x=>x.trim()).filter(Boolean);
  s+=Math.min(20,items.length*10);
  if((f.expected_needs||'').trim())s+=10;
  const sc=(f.special_clinics||'').split(',').map(x=>x.trim()).filter(Boolean);
  if(sc.length>0)s+=10;
  if((f.clinic_hours||'').trim())s+=5;
  if(f.visit_timeslot&&f.visit_timeslot!=='미확인')s+=5;
  if((f.coordi_name||'').trim())s+=5;
  if((f.coordi_phone||'').trim())s+=5;
  if(f.reservation&&f.reservation!=='미확인')s+=5;
  if((f.visit_caution||'').trim())s+=5;
  if(f.precontact_done)s+=10;
  if(f.meeting_possible&&/가능|응답|예/.test(f.meeting_possible)&&!/미응답|불가/.test(f.meeting_possible))s+=15;
  if((f.reservation_at||'').trim())s+=5;
  s=Math.min(100,s);
  const grade=s>=80?'A':s>=60?'B':s>=40?'C':'D';
  return {score:s,grade};
}

    if(!lead.cust_id){setNotLinked(true);setLoading(false);return;}

      if(data)setF({demo_start:data.demo_start||'',demo_end:data.demo_end||'',demo_provided_cnt:data.demo_provided_cnt!=null?String(data.demo_provided_cnt):'',demo_used_cnt:data.demo_used_cnt!=null?String(data.demo_used_cnt):'',demo_extended_at:data.demo_extended_at||'',demo_extend_reason:data.demo_extend_reason||'',demo_feedback:data.demo_feedback||''});

    {loading?<div style={{fontSize:12,color:'var(--t3)',padding:'24px 0',textAlign:'center'}}>불러오는 중…</div>:
     notLinked?
      <div style={{padding:'16px 0'}}>
        <div style={{fontSize:12,color:'var(--t2)',lineHeight:1.6,marginBottom:6}}>이 리드는 아직 CRM 고객과 연결되지 않았습니다.</div>
        <div style={{fontSize:11,color:'var(--t3)',lineHeight:1.6}}>데모 정보는 CRM 고객마스터에 저장되므로, 먼저 리드를 CRM 고객과 연결해야 입력할 수 있습니다. 아래 데모 트래킹 영역의 <b style={{color:'var(--t2)'}}>🔗 CRM 고객 연결</b> 버튼으로 연결해 주세요.</div>
      </div>

        <div><label className="lbl">DEMO 종료일</label><input type="date" value={f.demo_end} onChange={ev=>set('demo_end',ev.target.value)}/></div>
        <div><label className="lbl">제공 건수</label><input value={f.demo_provided_cnt} onChange={ev=>set('demo_provided_cnt',ev.target.value)} placeholder="숫자"/></div>
        <div><label className="lbl">사용 건수</label><input value={f.demo_used_cnt} onChange={ev=>set('demo_used_cnt',ev.target.value)} placeholder="숫자"/></div>
        <div><label className="lbl">연장일</label><input type="date" value={f.demo_extended_at} onChange={ev=>set('demo_extended_at',ev.target.value)}/></div>
        <div><label className="lbl">연장 사유</label><input value={f.demo_extend_reason} onChange={ev=>set('demo_extend_reason',ev.target.value)}/></div>
        <div style={{gridColumn:'1 / 3'}}><label className="lbl">피드백</label><textarea rows="3" value={f.demo_feedback} onChange={ev=>set('demo_feedback',ev.target.value)}/></div>

// 리드 카드에서 CRM 고객 바로 연결
function LinkCustModal({lead,onClose,onLinked}){
  const [custs,setCusts]=useState([]);const [loading,setLoading]=useState(true);const [cq,setCq]=useState('');const [saving,setSaving]=useState(false);
  useEffect(()=>{
    (async()=>{let cs=[],f=0;while(true){const {data}=await sb.from('customers').select('cust_id,hospital_name,region,ceo_name,phone').range(f,f+999);if(!data||!data.length)break;cs=cs.concat(data);if(data.length<1000)break;f+=1000;if(f>40000)break;}setCusts(cs);setLoading(false);})();
  },[]);
  const norm=s=>String(s||'').replace(/\s+/g,'').toLowerCase();
  const ln=norm(lead.hospital_name);
  const suggest=!ln?[]:(()=>{const ex=custs.filter(c=>norm(c.hospital_name)===ln);if(ex.length)return ex.slice(0,6);return custs.filter(c=>{const cn=norm(c.hospital_name);return cn&&(cn.includes(ln)||ln.includes(cn));}).slice(0,6);})();
  const searchCust=cq.trim()?custs.filter(c=>{const s=cq.trim().toLowerCase();return [c.hospital_name,c.region,c.ceo_name,c.phone,c.cust_id].some(v=>v&&String(v).toLowerCase().includes(s));}).slice(0,20):[];
  const listShow=cq.trim()?searchCust:suggest;
  async function doLink(cust){
    if(saving)return;setSaving(true);
    const r=await sb.from('leads').update({cust_id:cust.cust_id,updated_at:new Date().toISOString()}).eq('lead_id',lead.lead_id);
    setSaving(false);
    if(r.error){alert('오류: '+r.error.message);return;}
    onLinked(cust.cust_id);
  }
  return (<div className="ov" style={{alignItems:'flex-start',padding:'40px 16px'}}>
    <div className="modal" style={{width:520,maxWidth:'100%'}}>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:6}}>
        <span style={{fontSize:15,fontWeight:700,color:'#22C55E'}}>CRM 고객 연결</span>
        <button className="tbtn" style={{marginLeft:'auto',background:'rgba(255,255,255,.06)'}} onClick={onClose}>✕</button>
      </div>
      <div style={{fontSize:11,color:'var(--t2)',marginBottom:10}}>리드 <b>{lead.hospital_name||lead.lead_id}</b>를 연결할 CRM 고객을 선택하세요.</div>
      <input value={cq} onChange={e=>setCq(e.target.value)} placeholder="병원명·지역·원장·전화·고객ID 검색" style={{marginBottom:10}}/>
      {loading?<div style={{fontSize:12,color:'var(--t3)',padding:'20px 0',textAlign:'center'}}>CRM 고객 불러오는 중…</div>:
       <div style={{maxHeight:340,overflowY:'auto'}}>
         {!cq.trim()&&suggest.length>0&&<div style={{fontSize:10,color:'#EF9F27',marginBottom:6}}>병원명이 비슷한 추천 고객</div>}
         {listShow.length===0?<div style={{fontSize:12,color:'var(--t3)',padding:'16px 0',textAlign:'center'}}>{cq.trim()?'검색 결과가 없습니다.':'병원명으로 검색해 주세요.'}</div>:
          listShow.map(c=>(
           <div key={c.cust_id} onClick={()=>doLink(c)} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',borderRadius:7,cursor:'pointer',marginBottom:3,background:'rgba(255,255,255,.02)',border:'0.5px solid var(--border)'}}>
             <div style={{flex:1,minWidth:0}}>
               <div style={{fontSize:12,fontWeight:700,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{c.hospital_name||'(병원명 없음)'}</div>
               <div style={{fontSize:10,color:'var(--t3)',marginTop:2}}>{c.cust_id}{c.region?' · '+c.region:''}{c.ceo_name?' · '+c.ceo_name:''}</div>
             </div>
             <span className="tbtn" style={{background:'linear-gradient(135deg,#22C55E,#0F6E56)',flexShrink:0}}>{saving?'…':'연결'}</span>
           </div>
          ))}
       </div>}
    </div>
  </div>);
}

function LeadDetail({lead,contacts,acts,onClose,setModal,onRefresh}){
  const cs=contacts.filter(c=>c.lead_id===lead.lead_id).sort((a,b)=>(a.contact_seq||0)-(b.contact_seq||0));
  const [cid,setCid]=useState(cs.length?cs[0].id:null);
  const [crmCust,setCrmCust]=useState(null);const [crmLoad,setCrmLoad]=useState(false);const [linkOpen,setLinkOpen]=useState(false);
  useEffect(()=>{
    if(!lead.cust_id){setCrmCust(null);return;}
    setCrmLoad(true);
    sb.from('customers').select('cust_id,hospital_name,demo_start,demo_end,demo_provided_cnt,demo_used_cnt,demo_extended_at,demo_extend_reason,demo_feedback').eq('cust_id',lead.cust_id).maybeSingle().then(({data})=>{setCrmCust(data||null);setCrmLoad(false);});
  },[lead.cust_id]);
  const c=cs.find(x=>x.id===cid)||cs[0]||{};

      const u=(await sb.auth.getUser()).data.user;

          <div style={{marginLeft:'auto',display:'flex',gap:7}}>
            <button className="tbtn" style={{background:'linear-gradient(135deg,#2472c8,#185FA5)'}} onClick={()=>setModal({t:'stage',lead})}>단계 이동</button>
            <button className="tbtn" style={{background:'linear-gradient(135deg,#3a4a5e,#26323f)'}} onClick={()=>setModal({t:'lead',lead})}>정보 수정</button>

                  </div>}
                </div>
              );})}
          </div>
          <div style={{border:'0.5px solid #1FA37C66',borderRadius:12,padding:14}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
              <span style={{fontSize:13,fontWeight:600,color:'#5DCAA5'}}>🧪 데모 트래킹</span>
              <span style={{fontSize:10,color:'var(--t3)'}}>고객마스터(CRM) 기준</span>
              {lead.cust_id&&<span className="pill" style={{background:'#0d2a1a',color:'#22C55E'}}>연결 {lead.cust_id}</span>}
            </div>
            {!lead.cust_id?
              <div style={{padding:'10px 0'}}>
                <div style={{fontSize:12,color:'var(--t3)',marginBottom:10}}>아직 CRM 고객과 연결되지 않았습니다. 데모 진행 후 CRM에서 거래처가 등록되면, 여기서 바로 연결할 수 있어요.</div>
                <button className="tbtn" style={{background:'linear-gradient(135deg,#22C55E,#0F6E56)'}} onClick={()=>setLinkOpen(true)}>🔗 CRM 고객 연결</button>
              </div>
            :crmLoad?
              <div style={{fontSize:12,color:'var(--t3)',padding:'10px 0'}}>CRM 데모 정보 불러오는 중…</div>
            :!crmCust?
              <div style={{fontSize:12,color:'var(--t3)',padding:'10px 0'}}>연결된 CRM 고객({lead.cust_id})을 찾을 수 없습니다.</div>
            :<>
              <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8}}>
                {F('DEMO 시작일',crmCust.demo_start)}{F('DEMO 종료일',crmCust.demo_end)}{F('제공 건수',crmCust.demo_provided_cnt!=null?crmCust.demo_provided_cnt+'건':'')}{F('사용 건수',crmCust.demo_used_cnt!=null?crmCust.demo_used_cnt+'건':'')}
                {F('연장일',crmCust.demo_extended_at)}{F('연장 사유',crmCust.demo_extend_reason)}
              </div>
              <div style={{marginTop:8,padding:'10px 12px',borderRadius:8,background:'rgba(255,255,255,.02)',border:'0.5px solid var(--border)'}}>
                <div style={{fontSize:10,color:'#EF9F27',fontWeight:700,marginBottom:4}}>피드백</div>
                <div style={{fontSize:12,color:crmCust.demo_feedback?'var(--t)':'var(--t3)',whiteSpace:'pre-wrap',lineHeight:1.5}}>{crmCust.demo_feedback||'등록된 피드백이 없습니다.'}</div>
              </div>
            </>}
          </div>
        </div>
      </div>
      {linkOpen&&<LinkCustModal lead={lead} onClose={()=>setLinkOpen(false)} onLinked={(cid)=>{setLinkOpen(false);setCrmLoad(true);sb.from('customers').select('cust_id,hospital_name,demo_start,demo_end,demo_provided_cnt,demo_used_cnt,demo_extended_at,demo_extend_reason,demo_feedback').eq('cust_id',cid).maybeSingle().then(({data})=>{setCrmCust(data||null);setCrmLoad(false);});lead.cust_id=cid;if(onRefresh)onRefresh();}}/>}
    </div>
  );
}

function Shell({user,onLogout}){
  const [view,setView]=useState('dashboard');
  const [hov,setHov]=useState(null);
  const G1=[{id:'dashboard',label:'대시보드',c:'#5DCAA5'},{id:'domestic',label:'국내리드',c:'#185FA5'},{id:'overseas',label:'해외리드',c:'#534AB7'},{id:'expo',label:'학회·부스·전시회',c:'#BA7517'}];
  const G2=[{id:'link',label:'리드↔고객 연결',c:'#22C55E'},{id:'usage',label:'분석건수',c:'#38BDF8'},{id:'insight',label:'전환·매출 인사이트',c:'#F472B6'}];
  const Item=n=>{const on=view===n.id;const hv=hov===n.id&&!on;return <div key={n.id} className="nav" onClick={()=>setView(n.id)} onMouseEnter={()=>setHov(n.id)} onMouseLeave={()=>setHov(h=>h===n.id?null:h)} style={{color:on||hv?'#fff':'var(--t2)',background:on?'linear-gradient(135deg,'+n.c+'dd,'+n.c+'88)':hv?'linear-gradient(135deg,'+n.c+'55,'+n.c+'18)':'linear-gradient(135deg,'+n.c+'22,'+n.c+'0a)',border:on?'2px solid #EF9F27':hv?'1.5px solid #EF9F27aa':'0.5px solid '+n.c+'33',boxShadow:on?'0 0 0 1px #EF9F2755, 0 6px 18px rgba(239,159,39,.35), inset 0 1px 0 rgba(255,255,255,.2)':hv?'0 4px 12px rgba(239,159,39,.22), inset 0 1px 0 rgba(255,255,255,.1)':'inset 0 1px 0 rgba(255,255,255,.04)',transform:hv?'translateX(3px)':'none'}}><span className="dot" style={{background:on||hv?'#fff':n.c,color:n.c}}/>{n.label}</div>;};
  return (
    <div style={{display:'flex',height:'100%'}}>
      <div style={{width:212,flexShrink:0,background:'linear-gradient(180deg,#1b2a3a,#141d29)',borderRight:'0.5px solid var(--border)',display:'flex',flexDirection:'column',padding:'14px 10px',boxShadow:'2px 0 16px rgba(0,0,0,.3)'}}>
        <div style={{padding:'6px 6px 16px'}}>
          <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMzIiIGhlaWdodD0iNDAiIHZpZXdCb3g9IjAgMCAxMzIgNDAiPjxyZWN0IHg9IjAiIHk9IjAiIHdpZHRoPSIxMzIiIGhlaWdodD0iNDAiIHJ4PSI5IiBmaWxsPSIjMWY2ZjVjIi8+PHRleHQgeD0iNjYiIHk9IjI2IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LWZhbWlseT0iUHJldGVuZGFyZCxBcmlhbCxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE4IiBmb250LXdlaWdodD0iODAwIiBsZXR0ZXItc3BhY2luZz0iMSIgZmlsbD0iI2ZmZmZmZiI+REVNTzwvdGV4dD48L3N2Zz4=" alt="Demo" style={{width:138,display:'block',marginBottom:7}}/>
          <div style={{fontSize:17,color:'#fff',fontWeight:800,letterSpacing:.5,marginLeft:38,animation:'hbpulse 1.3s ease-in-out infinite'}}>Sales Hub</div>
        </div>
        <div style={{fontSize:13,color:'#EF9F27',fontWeight:800,padding:'8px 8px 5px',letterSpacing:.3}}>영업 파이프라인</div>
        {G1.map(Item)}
        <div style={{fontSize:13,color:'#EF9F27',fontWeight:800,padding:'14px 8px 5px',letterSpacing:.3}}>공통 분석</div>
        {G2.map(Item)}
        <div style={{fontSize:13,color:'#EF9F27',fontWeight:800,padding:'14px 8px 5px',letterSpacing:.3}}>고객 운영</div>
        <div className="nav" style={{cursor:'pointer',background:'linear-gradient(135deg,#0F6E56,#0a4d3c)',border:'1px solid #1D9E75',color:'#fff',animation:'shpulse 1.5s ease-in-out infinite'}} onClick={()=>window.open('https://demo-crm.vercel.app/','_blank')}><span className="dot" style={{background:'#fff',color:'#fff'}}/>CRM (운영 중 · 별도) <span style={{marginLeft:'auto',fontSize:11,color:'#fff'}}>↗</span></div>
        <div style={{marginTop:'auto',padding:'10px 11px',borderTop:'0.5px solid var(--border)',display:'flex',alignItems:'center',gap:8}}>
          <div style={{width:26,height:26,borderRadius:'50%',background:'#185FA5',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,flexShrink:0}}>{((user&&user.email)||'C')[0].toUpperCase()}</div>
          <span style={{fontSize:10,color:'var(--t2)',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={user&&user.email}>{(user&&user.email)||'사용자'}</span>
          <button onClick={onLogout} title="로그아웃" style={{fontSize:10,padding:'4px 8px',background:'rgba(255,255,255,0.07)',border:'0.5px solid var(--border)',borderRadius:6,color:'var(--t2)',cursor:'pointer',flexShrink:0}}>로그아웃</button>
        </div>
      </div>
      <div style={{flex:1,minWidth:0,overflow:'auto'}}>
        <div style={{padding:'18px 24px'}}>
          {view==='dashboard'&&<DashboardView go={setView}/>}
          {view==='domestic'&&<DomesticView/>}
          {view==='overseas'&&<OverseasView/>}
          {view==='expo'&&<EventsView/>}
          {view==='link'&&<LinkView/>}
          {view==='usage'&&<UsageView/>}
          {view==='insight'&&<InsightView/>}
        </div>
      </div>
    </div>
  );
}
function App(){
  const [user,setUser]=useState(undefined);
  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setUser(data.session?.user||null));
    const {data:sub}=sb.auth.onAuthStateChange((_e,s)=>setUser(s?.user||null));
    return ()=>sub.subscription.unsubscribe();
  },[]);
  if(user===undefined)return <div style={{height:'100%',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--t3)'}}>로딩 중...</div>;
  if(!user)return <Login/>;
  return <Shell user={user} onLogout={async()=>{await sb.auth.signOut();}}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
