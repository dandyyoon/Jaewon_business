function RevenueCharts({revSeries}){
  const revRef=useRef(null);const cntRef=useRef(null);const revInst=useRef(null);const cntInst=useRef(null);
  useEffect(()=>{
    if(!window.Chart||!revRef.current||!cntRef.current)return;
    if(revInst.current)revInst.current.destroy();
    if(cntInst.current)cntInst.current.destroy();
    const labels=revSeries.map(m=>String(m.ym).slice(5)+'월');
    const commonScales={x:{grid:{color:'rgba(255,255,255,0.06)'},ticks:{color:'rgba(255,255,255,0.75)',font:{size:11},maxRotation:0,autoSkip:false},border:{display:false}},y:{grid:{color:'rgba(255,255,255,0.06)'},ticks:{color:'rgba(255,255,255,0.5)',font:{size:11}},border:{display:false}}};
    revInst.current=new window.Chart(revRef.current,{type:'line',data:{labels,datasets:[{data:revSeries.map(m=>m.revenue),borderColor:'#1D9E75',borderWidth:2.5,backgroundColor:(ctx)=>{const g=ctx.chart.ctx.createLinearGradient(0,0,0,160);g.addColorStop(0,'rgba(29,158,117,0.4)');g.addColorStop(1,'rgba(29,158,117,0.02)');return g;},fill:true,tension:0.3,pointBackgroundColor:'#1D9E75',pointRadius:3.5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>Math.round(ctx.raw/10000)+'만원'}}},scales:{...commonScales,y:{...commonScales.y,ticks:{...commonScales.y.ticks,callback:v=>v>=100000000?(v/100000000).toFixed(1)+'억':Math.round(v/20000000)*2+'천만',maxTicksLimit:5}}}}});
    cntInst.current=new window.Chart(cntRef.current,{type:'line',data:{labels,datasets:[{data:revSeries.map(m=>m.count),borderColor:'#378ADD',borderWidth:2.5,backgroundColor:(ctx)=>{const g=ctx.chart.ctx.createLinearGradient(0,0,0,100);g.addColorStop(0,'rgba(55,138,221,0.3)');g.addColorStop(1,'rgba(55,138,221,0.02)');return g;},fill:true,tension:0.3,pointBackgroundColor:'#378ADD',pointRadius:3.5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.raw+'건'}}},scales:commonScales}});
    return()=>{if(revInst.current)revInst.current.destroy();if(cntInst.current)cntInst.current.destroy();};
  },[revSeries]);
  return(<div>
    <div style={{position:'relative',width:'100%',height:180}}><canvas ref={revRef}/></div>
    <div style={{height:'0.5px',background:'var(--border)',margin:'10px 0'}}/>
    <div style={{fontSize:11,fontWeight:700,color:'var(--text-2)',marginBottom:6}}>월별 주문건수</div>
    <div style={{position:'relative',width:'100%',height:110}}><canvas ref={cntRef}/></div>
  </div>);
}

function RevenueInsight(){
  const [ld,setLd]=useState(true);const [err,setErr]=useState(null);
  const [subTab,setSubTab]=useState('overview');
  const [revYear,setRevYear]=useState(String(new Date().getFullYear()));
  const [demoMode,setDemoMode]=useState('ongoing');
  const [dropMode,setDropMode]=useState('yearly');
  const [arDetail,setArDetail]=useState(null);
  // 원본 데이터
  const [orders,setOrders]=useState([]);
  const [receivables,setReceivables]=useState([]);
  const [customers,setCustomers]=useState([]);
  const [usage,setUsage]=useState([]);

  useEffect(()=>{
    (async()=>{
      try{
        const [ord,rec,cust,usg]=await Promise.all([
          fetchAll('orders','order_id,cust_id,received_at,total_amount'),
          fetchAll('receivables','*'),
          fetchAll('customers','cust_id,hospital_name,contract_status,plan,demo_start,demo_end,application_signed_at,contract_start_date'),
          fetchAll('usage_monthly','year_month,cust_id,hospital_name,cnt')
        ]);
        setOrders(ord.filter(o=>String(o.order_id||'').indexOf('BENEFIT-')!==0));
        setReceivables(rec);setCustomers(cust);setUsage(usg);
        setLd(false);
      }catch(e){console.error(e);setErr(e.message||String(e));setLd(false);}
    })();
  },[]);

  // ── 월별 매출/주문건수 ──
  const {monthly,years}=useMemo(()=>{
    const map={};
    orders.forEach(o=>{const ym=fmtDate(o.received_at).slice(0,7);if(!ym)return;if(!map[ym])map[ym]={revenue:0,count:0};map[ym].revenue+=Number(o.total_amount||0);map[ym].count+=1;});
    const ys=[...new Set(Object.keys(map).map(k=>k.slice(0,4)).filter(y=>y>='2024'))].sort().reverse();
    return {monthly:map,years:ys};
  },[orders]);

  const thisYear=String(new Date().getFullYear());const thisMonth=new Date().getMonth()+1;
  const selMonths=revYear===thisYear?Array.from({length:thisMonth},(_,i)=>revYear+'-'+String(i+1).padStart(2,'0')):Array.from({length:12},(_,i)=>revYear+'-'+String(i+1).padStart(2,'0'));
  const revSeries=selMonths.map(ym=>({ym,revenue:(monthly[ym]||{}).revenue||0,count:(monthly[ym]||{}).count||0})).filter(m=>!(revYear!==thisYear&&m.revenue===0&&m.count===0));

  // ── AR 요약 ──
  const arS=useMemo(()=>{
    const today=new Date();
    let unpaid=0,unpaidAmt=0,issued=0,unissued=0,paidCnt=0,total=receivables.length;
    const aging={'30일이내':0,'30~60일':0,'60~90일':0,'90일초과':0};
    receivables.forEach(r=>{
      const paid=r.payment_status==='Y'||r.payment_status==='납부완료'||!!r.paid_at;
      const isIssued=r.invoice_issued==='발행완료';
      if(isIssued)issued++;else unissued++;
      if(paid)paidCnt++;
      else{
        unpaid++;unpaidAmt+=Number(r.total_amount||0);
        // 미수경과일수: 납부기한(due_date) 기준
        const due=r.due_date?new Date(r.due_date):null;
        const d=due?Math.round((today-due)/86400000):0;
        if(d<=30)aging['30일이내']++;else if(d<=60)aging['30~60일']++;else if(d<=90)aging['60~90일']++;else aging['90일초과']++;
      }
    });
    const paidRate=total>0?Math.round(paidCnt/total*100):0;
    const issueRate=total>0?Math.round(issued/total*100):0;
    return {unpaid,unpaidAmt,issued,unissued,paidRate,issueRate,aging};
  },[receivables]);

  // ── 재계약 임박 (계약시작일+1년이 60일 이내) ──
  const renewal=useMemo(()=>{
    const today=new Date();const list=[];
    customers.forEach(c=>{
      if(c.contract_status!=='활성')return;
      const base=c.contract_start_date||c.application_signed_at;
      if(!base)return;
      const start=new Date(base);if(isNaN(start))return;
      // 다음 갱신일 = 시작일 + N년 (오늘 이후 가장 가까운)
      let renew=new Date(start);
      while(renew<today)renew.setFullYear(renew.getFullYear()+1);
      const daysLeft=Math.round((renew-today)/86400000);
      if(daysLeft>=0&&daysLeft<=60)list.push({hospName:c.hospital_name,plan:c.plan||'-',expectedEnd:fmtDate(renew.toISOString()),daysLeft});
    });
    return list.sort((a,b)=>a.daysLeft-b.daysLeft);
  },[customers]);

  // ── DEMO 현황 ──
  const demo=useMemo(()=>{
    const today=new Date();const ongoing=[],expired=[];
    customers.forEach(c=>{
      if(!c.demo_start)return;
      const ds=new Date(c.demo_start);
      const de=c.demo_end?new Date(c.demo_end):null;
      const converted=!!c.application_signed_at||c.contract_status==='활성';
      if(de&&de<today){
        if(!converted)expired.push({hospName:c.hospital_name,demoEnd:fmtDate(c.demo_end),status:c.contract_status||'-',daysSinceEnd:Math.round((today-de)/86400000)});
      }else if(!de||de>=today){
        if(!converted)ongoing.push({hospName:c.hospital_name,demoStart:fmtDate(c.demo_start),elapsedDays:Math.round((today-ds)/86400000)});
      }
    });
    return {ongoing,expired};
  },[customers]);

  // ── 분석건수 감소 감지 ──
  const drop=useMemo(()=>{
    const curY=new Date().getFullYear();const curM=new Date().getMonth()+1;
    // 연간: 작년 1~현재월 vs 올해 1~현재월
    const sumRange=(custId,year)=>{let s=0;usage.forEach(u=>{if(String(u.cust_id)!==String(custId))return;const ym=String(u.year_month);const y=parseInt(ym.slice(0,4));const m=parseInt(ym.slice(4,6));if(y===year&&m>=1&&m<=curM)s+=Number(u.cnt||0);});return s;};
    const custMap={};usage.forEach(u=>{if(u.cust_id&&!custMap[u.cust_id])custMap[u.cust_id]=u.hospital_name;});
    const yearly=[];
    Object.keys(custMap).forEach(cid=>{
      const last=sumRange(cid,curY-1);const cur=sumRange(cid,curY);
      if(last>=5&&cur<last){const dr=Math.round((1-cur/last)*100);if(dr>=30)yearly.push({hospName:custMap[cid],lastYearSum:last,thisYearSum:cur,dropRate:dr});}
    });
    yearly.sort((a,b)=>b.dropRate-a.dropRate);
    return {yearly};
  },[usage]);

  // AR 상세 목록
  const arDetailRows=useMemo(()=>{
    if(!arDetail)return [];
    const today=new Date();
    return receivables.filter(r=>{
      const paid=r.payment_status==='Y'||r.payment_status==='납부완료'||!!r.paid_at;
      const isIssued=r.invoice_issued==='발행완료';
      if(arDetail==='unissued')return !isIssued;
      if(arDetail==='issued')return isIssued;
      if(arDetail==='unpaid')return !paid;
      if(arDetail.startsWith('aging-')){
        if(paid)return false;
        const due=r.due_date?new Date(r.due_date):null;const d=due?Math.round((today-due)/86400000):0;
        const ag=arDetail.replace('aging-','');
        if(ag==='30')return d<=30;if(ag==='60')return d>30&&d<=60;if(ag==='90')return d>60&&d<=90;if(ag==='over')return d>90;
      }
      return false;
    }).map(r=>({병원명:r.hospital_name,납품일자:fmtDate(r.delivered_at),공급가액:r.supply_amount,납부:r.payment_status,발행:r.invoice_issued,
      days:(()=>{const due=r.due_date?new Date(r.due_date):null;return due&&!(r.payment_status||r.paid_at)?Math.round((today-due)/86400000):0;})()}));
  },[arDetail,receivables]);

  if(ld)return <Spin/>;
  if(err)return <div style={{padding:20,color:'#f87171'}}>{err}</div>;

  const annualRev=Object.keys(monthly).filter(k=>k.startsWith(thisYear)).reduce((s,k)=>s+monthly[k].revenue,0);
  const monthRev=(monthly[thisYear+'-'+String(thisMonth).padStart(2,'0')]||{}).revenue||0;
  const subTabs=[{k:'overview',l:'전체 개요'},{k:'chart',l:'매출 추이'},{k:'ar',l:'AR 관리'},{k:'insight',l:'영업 인사이트'}];
  const detailColor={unissued:'#E24B4A',issued:'#1D9E75',unpaid:'#BA7517','aging-30':'#1D9E75','aging-60':'#BA7517','aging-90':'#D85A30','aging-over':'#E24B4A'};
  const detailTitle={unissued:'미발행 계산서 '+arS.unissued+'건',issued:'발행완료 '+arS.issued+'건',unpaid:'미납 '+arS.unpaid+'건','aging-30':'30일 이내 미납','aging-60':'31~60일 미납','aging-90':'61~90일 미납','aging-over':'90일 초과 미납'};

  return(
    <div style={{padding:14,display:'flex',flexDirection:'column',gap:12,height:'100vh',overflowY:'auto'}}>
      {/* 서브탭 */}
      <div style={{display:'flex',gap:6,borderBottom:'0.5px solid var(--border)',paddingBottom:8}}>
        {subTabs.map(t=>(<button key={t.k} onClick={()=>setSubTab(t.k)} style={{fontSize:13,padding:'7px 18px',borderRadius:20,cursor:'pointer',fontFamily:'inherit',border:'2px solid '+(subTab===t.k?'var(--blue)':'var(--border-md)'),background:subTab===t.k?'var(--blue)':'var(--bg)',color:subTab===t.k?'#fff':'var(--text)',fontWeight:subTab===t.k?700:500,boxShadow:subTab===t.k?'0 0 0 3px rgba(37,99,235,0.25)':'none'}}>{t.l}</button>))}
      </div>
      {/* KPI */}
      {(subTab==='overview'||subTab==='chart'||subTab==='ar')&&(
        <div style={{display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:8}}>
          {[
            ['연간 누적매출',annualRev.toLocaleString()+'원','#1D9E75',''],
            ['이번달 매출',monthRev.toLocaleString()+'원','#1D9E75',''],
            ['미수채권 잔액',arS.unpaidAmt.toLocaleString()+'원','#E24B4A',arS.unpaid+'건 미납'],
            ['미발행 계산서',arS.unissued+'건','#E24B4A','즉시 처리 필요'],
            ['재계약 임박',renewal.length+'곳','#BA7517','60일 이내'],
            ['DEMO 현황','진행 '+demo.ongoing.length+' · 만료 '+demo.expired.length,'#7F77DD','클릭하면 상세'],
          ].map(([l,v,c,s])=>(<div key={l} onClick={l==='DEMO 현황'?()=>setSubTab('insight'):l==='미발행 계산서'?()=>setSubTab('ar'):l==='재계약 임박'?()=>setSubTab('insight'):undefined} style={{background:'var(--bg)',border:'0.5px solid var(--border)',borderRadius:10,padding:'12px 14px',cursor:['DEMO 현황','미발행 계산서','재계약 임박'].includes(l)?'pointer':'default'}}>
            <div style={{fontSize:11,color:'rgba(255,255,255,0.7)',marginBottom:6,fontWeight:500}}>{l}</div>
            <div style={{fontSize:15,fontWeight:700,color:c,lineHeight:1.3}}>{v}</div>
            {s&&<div style={{fontSize:10,color:c==='#E24B4A'?c:'rgba(255,255,255,0.5)',marginTop:4,fontWeight:500}}>{s}</div>}
          </div>))}
        </div>
      )}
      {/* 매출 추이 차트 */}
      {(subTab==='overview'||subTab==='chart')&&(
        <div style={{background:'var(--bg)',border:'0.5px solid var(--border)',borderRadius:12,padding:14}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
            <span style={{fontSize:11,fontWeight:700}}>월별 매출 추이</span>
            <div style={{display:'flex',gap:4}}>{years.map(y=>(<button key={y} onClick={()=>setRevYear(y)} style={{fontSize:10,padding:'2px 9px',borderRadius:20,cursor:'pointer',fontFamily:'inherit',border:'0.5px solid '+(revYear===y?'var(--blue)':'var(--border-md)'),background:revYear===y?'var(--blue)':'transparent',color:revYear===y?'#fff':'var(--text-2)'}}>{y}</button>))}</div>
          </div>
          <RevenueCharts revSeries={revSeries}/>
        </div>
      )}
      {/* AR 관리 */}
      {(subTab==='overview'||subTab==='ar')&&(
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:11}}>
          <div style={{background:'var(--bg)',border:'0.5px solid var(--border)',borderRadius:12,padding:14}}>
            <div style={{fontSize:11,fontWeight:700,marginBottom:10}}>AR 현황 요약 <span style={{fontSize:10,color:'var(--text-3)',fontWeight:400}}>클릭하면 오른쪽에 상세</span></div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:7,marginBottom:10}}>
              {[['미발행 계산서',arS.unissued+'건','#E24B4A','unissued'],['발행완료',arS.issued+'건','#1D9E75','issued'],['미납',arS.unpaid+'건','#BA7517','unpaid']].map(([l,v,c,key])=>(<div key={key} onClick={()=>setArDetail(arDetail===key?null:key)} style={{background:arDetail===key?'var(--bg)':'var(--bg-2)',borderRadius:8,padding:9,textAlign:'center',cursor:'pointer',border:arDetail===key?'1.5px solid '+c:'0.5px solid transparent'}}>
                <div style={{fontSize:10,color:'rgba(255,255,255,0.6)',marginBottom:4,fontWeight:500}}>{l}</div>
                <div style={{fontSize:17,fontWeight:700,color:c}}>{v}</div>
              </div>))}
            </div>
            <div style={{marginBottom:7}}><div style={{display:'flex',justifyContent:'space-between',fontSize:10,marginBottom:3}}><span style={{color:'var(--text-2)'}}>납부완료율</span><span style={{fontWeight:700,color:'#34d399'}}>{arS.paidRate}%</span></div><div style={{height:5,background:'var(--bg-2)',borderRadius:3,overflow:'hidden'}}><div style={{width:arS.paidRate+'%',height:'100%',background:'#34d399',borderRadius:3}}/></div></div>
            <div style={{marginBottom:7}}><div style={{display:'flex',justifyContent:'space-between',fontSize:10,marginBottom:3}}><span style={{color:'var(--text-2)'}}>계산서 발행률</span><span style={{fontWeight:700,color:'#60a5fa'}}>{arS.issueRate}%</span></div><div style={{height:5,background:'var(--bg-2)',borderRadius:3,overflow:'hidden'}}><div style={{width:arS.issueRate+'%',height:'100%',background:'#60a5fa',borderRadius:3}}/></div></div>
            <div style={{fontSize:11,fontWeight:700,color:'rgba(255,255,255,0.6)',marginBottom:7}}>미납 aging <span style={{fontSize:10,fontWeight:400,color:'rgba(255,255,255,0.3)'}}>클릭하면 목록</span></div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:6}}>
              {[['30일 이내',arS.aging['30일이내'],'#34d399','aging-30'],['31~60일',arS.aging['30~60일'],'#fbbf24','aging-60'],['61~90일',arS.aging['60~90일'],'#fb923c','aging-90'],['90일 초과',arS.aging['90일초과'],'#f87171','aging-over']].map(([l,v,c,ak])=>(<div key={l} onClick={()=>setArDetail(arDetail===ak?null:ak)} style={{background:'var(--bg-2)',borderRadius:7,padding:9,textAlign:'center',cursor:'pointer',border:arDetail===ak?'1.5px solid '+c:'0.5px solid transparent'}}>
                <div style={{fontSize:9,color:'rgba(255,255,255,0.5)',marginBottom:3}}>{l}</div>
                <div style={{fontSize:15,fontWeight:700,color:c}}>{v}건</div>
              </div>))}
            </div>
          </div>
          <div style={{background:'var(--bg)',border:'0.5px solid var(--border)',borderRadius:12,padding:14,minHeight:200}}>
            {arDetail?(<>
              <div style={{fontSize:12,fontWeight:700,marginBottom:10,color:detailColor[arDetail],display:'flex',alignItems:'center',justifyContent:'space-between'}}><span>{detailTitle[arDetail]}</span><button onClick={()=>setArDetail(null)} style={{background:'transparent',border:'none',cursor:'pointer',fontSize:16,color:'rgba(255,255,255,0.4)'}}>×</button></div>
              {arDetailRows.length===0?<div style={{textAlign:'center',padding:20,color:'rgba(255,255,255,0.4)',fontSize:11}}>해당 건 없음</div>:<div style={{maxHeight:280,overflowY:'auto'}}>
                {arDetailRows.map((r,i)=>{const dc=r.days>90?'#f87171':r.days>60?'#fb923c':r.days>30?'#fbbf24':'#34d399';const paid=r.납부==='Y'||r.납부==='납부완료';return(<div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'7px 0',borderBottom:'0.5px solid var(--border)',fontSize:10}}>
                  <div><div style={{fontSize:11,fontWeight:700,color:'rgba(255,255,255,0.9)'}}>{r.병원명||'-'}</div><div style={{color:'rgba(255,255,255,0.4)',marginTop:2}}>{r.납품일자?'납품 '+r.납품일자:''}{r.공급가액?' · ₩'+Number(r.공급가액).toLocaleString():''}</div></div>
                  <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:3}}>{r.days>0&&<span style={{fontSize:10,fontWeight:700,color:dc}}>{r.days}일</span>}<span style={{fontSize:9,padding:'2px 7px',borderRadius:8,background:paid?'rgba(52,211,153,0.15)':r.발행==='발행완료'?'rgba(96,165,250,0.15)':'rgba(220,38,38,0.15)',color:paid?'#34d399':r.발행==='발행완료'?'#60a5fa':'#f87171'}}>{paid?'납부완료':r.발행==='발행완료'?'발행완료':'미발행'}</span></div>
                </div>);})}
              </div>}
            </>):(<div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100%',minHeight:180,color:'rgba(255,255,255,0.3)',fontSize:11,gap:8}}><span style={{fontSize:28}}>👆</span><span style={{textAlign:'center'}}>왼쪽 항목을 클릭하면<br/>목록이 표시됩니다</span></div>)}
          </div>
        </div>
      )}
      {/* 영업 인사이트 */}
      {(subTab==='overview'||subTab==='insight')&&(
        <div style={{display:'flex',flexDirection:'column',gap:11}}>
          {/* 재계약 임박 */}
          <div style={{background:'var(--bg)',border:'0.5px solid var(--border)',borderRadius:12,padding:14}}>
            <div style={{fontSize:12,fontWeight:700,marginBottom:10,color:'#fbbf24',display:'flex',alignItems:'center',gap:5}}>📅 재계약 임박 <span style={{fontSize:10,color:'rgba(255,255,255,0.4)',fontWeight:400}}>60일 이내 예상 만료 · {renewal.length}곳</span></div>
            {renewal.length===0?<div style={{textAlign:'center',padding:16,color:'rgba(255,255,255,0.3)',fontSize:11}}>60일 이내 재계약 예정 없음</div>:<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:6}}>
              {renewal.slice(0,10).map((r,i)=>(<div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'7px 10px',borderRadius:8,background:'var(--bg-2)',fontSize:10}}>
                <div><div style={{fontSize:11,fontWeight:700,color:'rgba(255,255,255,0.9)'}}>{r.hospName}</div><div style={{color:'rgba(255,255,255,0.4)',marginTop:2}}>{r.plan} · {r.expectedEnd}</div></div>
                <span style={{fontSize:10,padding:'2px 9px',borderRadius:10,whiteSpace:'nowrap',marginLeft:8,fontWeight:700,background:r.daysLeft<=30?'rgba(220,38,38,0.2)':'rgba(251,146,60,0.2)',color:r.daysLeft<=30?'#f87171':'#fb923c'}}>D-{r.daysLeft}</span>
              </div>))}
            </div>}
            {renewal.length>10&&<div style={{marginTop:8,fontSize:10,color:'rgba(255,255,255,0.4)',textAlign:'center'}}>외 {renewal.length-10}곳 더 있음</div>}
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:11}}>
            {/* DEMO 현황 */}
            <div style={{background:'var(--bg)',border:'0.5px solid var(--border)',borderRadius:12,padding:14}}>
              <div style={{fontSize:11,fontWeight:700,marginBottom:8,color:'#a78bfa',display:'flex',alignItems:'center',gap:5}}>🧪 DEMO 현황</div>
              <div style={{display:'flex',gap:6,marginBottom:10}}>{[['ongoing','진행 중 ('+demo.ongoing.length+')'],['expired','종료 후 미전환 ('+demo.expired.length+')']].map(([k,l])=>(<button key={k} onClick={()=>setDemoMode(k)} style={{fontSize:10,padding:'3px 10px',borderRadius:20,cursor:'pointer',fontFamily:'inherit',border:'0.5px solid '+(demoMode===k?'var(--text)':'var(--border-md)'),background:demoMode===k?'var(--text)':'transparent',color:demoMode===k?'var(--bg)':'var(--text-2)'}}>{l}</button>))}</div>
              {demoMode==='ongoing'?(demo.ongoing.length===0?<div style={{textAlign:'center',padding:16,color:'var(--text-3)',fontSize:11}}>DEMO 진행 중인 고객 없음</div>:<div style={{maxHeight:240,overflowY:'auto'}}>{demo.ongoing.map((r,i)=>(<div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 0',borderBottom:'0.5px solid var(--border)',fontSize:10}}><div><div style={{fontSize:11,fontWeight:700,color:'var(--text)'}}>{r.hospName}</div><div style={{color:'var(--text-3)',marginTop:2}}>DEMO 시작 {r.demoStart}</div></div><span style={{fontSize:9,padding:'2px 8px',borderRadius:10,background:'rgba(167,139,250,0.2)',color:'#a78bfa',whiteSpace:'nowrap'}}>+{r.elapsedDays}일째</span></div>))}</div>):(demo.expired.length===0?<div style={{textAlign:'center',padding:16,color:'var(--text-3)',fontSize:11}}>종료 후 미전환 고객 없음</div>:<><div style={{background:'var(--amber-50)',borderRadius:7,padding:'7px 10px',marginBottom:8,fontSize:9,color:'#fbbf24',border:'0.5px solid var(--amber-100)'}}>DEMO 종료 후 미전환 고객입니다. 전환 영업이 필요합니다.</div><div style={{maxHeight:200,overflowY:'auto'}}>{demo.expired.map((r,i)=>(<div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 0',borderBottom:'0.5px solid var(--border)',fontSize:10}}><div><div style={{fontSize:11,fontWeight:700,color:'var(--text)'}}>{r.hospName}</div><div style={{color:'var(--text-3)',marginTop:2}}>종료 {r.demoEnd} · {r.status}</div></div><span style={{fontSize:9,padding:'2px 8px',borderRadius:10,background:r.daysSinceEnd>60?'rgba(220,38,38,0.15)':'rgba(251,146,60,0.15)',color:r.daysSinceEnd>60?'#f87171':'#fb923c',whiteSpace:'nowrap'}}>종료 후 +{r.daysSinceEnd}일</span></div>))}</div></>)}
            </div>
            {/* 분석건수 감소 감지 */}
            <div style={{background:'var(--bg)',border:'0.5px solid var(--border)',borderRadius:12,padding:14}}>
              <div style={{fontSize:11,fontWeight:700,marginBottom:8,color:'#fb923c',display:'flex',alignItems:'center',gap:5}}>📉 분석건수 감소 감지 <span style={{fontSize:10,color:'var(--text-3)',fontWeight:400}}>30% 이상</span></div>
              <div style={{fontSize:9,color:'var(--text-3)',marginBottom:8}}>{new Date().getFullYear()-1}년 1~{thisMonth}월 vs {new Date().getFullYear()}년 동기간</div>
              {drop.yearly.length===0?<div style={{textAlign:'center',padding:16,color:'var(--text-3)',fontSize:11}}>감소 감지 없음</div>:<div style={{maxHeight:220,overflowY:'auto'}}>{drop.yearly.slice(0,8).map((r,i)=>(<div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 0',borderBottom:'0.5px solid var(--border)',fontSize:10}}><div><div style={{fontSize:11,fontWeight:700,color:'var(--text)'}}>{r.hospName}</div><div style={{color:'var(--text-3)',marginTop:2}}>{r.lastYearSum}건 → {r.thisYearSum}건</div></div><span style={{fontSize:9,padding:'2px 8px',borderRadius:10,fontWeight:700,background:r.dropRate>=60?'rgba(220,38,38,0.15)':'rgba(251,146,60,0.15)',color:r.dropRate>=60?'#f87171':'#fb923c',whiteSpace:'nowrap'}}>-{r.dropRate}%</span></div>))}</div>}
              {drop.yearly.length>8&&<div style={{marginTop:6,fontSize:10,color:'var(--text-3)',textAlign:'center'}}>외 {drop.yearly.length-8}곳 더 있음</div>}
              <div style={{marginTop:8,background:'var(--amber-50)',borderRadius:7,padding:'7px 10px',border:'0.5px solid var(--amber-100)'}}><div style={{fontSize:9,color:'#fbbf24'}}>이탈 징후일 수 있습니다. CS 이력 및 재계약 여부를 확인하세요.</div></div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

          <span style={{fontSize:13,fontWeight:800,color:'#fff',letterSpacing:'-.01em'}}>DEMO CRM</span>
        </div>
        <div className="sb-sec">메뉴</div>
        {MENU.map(m=>{
          const isAct=tab===m.id;
          return(
            <div key={m.id} onClick={()=>setTab(m.id)}
              style={{display:'flex',alignItems:'center',gap:9,padding:'9px 11px',borderRadius:8,cursor:'pointer',fontSize:12,fontWeight:isAct?700:600,marginBottom:3,
                background:isAct?m.clr:m.lt,color:isAct?'#fff':m.clr,transition:'all .12s ease'}}>
              <span style={{fontSize:15,width:18,textAlign:'center',flexShrink:0}}>{m.ic}</span>
              <span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{m.lb}</span>
              {isAct&&<span style={{fontSize:13,fontWeight:700,color:'#fff',flexShrink:0}}>✓</span>}
            </div>
          );
        })}
        <div className="sb-sec" style={{marginTop:8}}>도구</div>
        <div onClick={()=>setRefreshKey(k=>k+1)} title="현재 화면 데이터를 다시 불러옵니다"
          style={{display:'flex',alignItems:'center',gap:8,padding:'9px 11px',borderRadius:8,cursor:'pointer',fontSize:11,fontWeight:600,color:'var(--text-2)',background:'rgba(255,255,255,0.05)',border:'0.5px solid var(--border-md)'}}>
          <span style={{fontSize:14}}>🔄</span><span>새로고침</span>
        </div>
        <div style={{marginTop:'auto',padding:'10px 11px',borderTop:'0.5px solid var(--border)',display:'flex',alignItems:'center',gap:8}}>
          <div style={{width:26,height:26,borderRadius:'50%',background:'var(--brand)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,flexShrink:0}}>C</div>
          <span style={{fontSize:11,color:'var(--text-2)'}}>Demo</span>
        </div>
      </div>
      <div className="main">
        <div className="pane">
          {tab==='dashboard'&&<Dashboard key={'d'+refreshKey}/>}
          {tab==='customers'&&<CustomerMaster key={'c'+refreshKey}/>}
          {tab==='orders'&&<OrderManagement key={'o'+refreshKey}/>}
          {tab==='invoices'&&<InvoiceManagement key={'i'+refreshKey}/>}
          {tab==='cs'&&<CSManagement key={'s'+refreshKey}/>}
          {tab==='revenue'&&<RevenueInsight key={'r'+refreshKey}/>}
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>

  new Function(out)();

</script>
</body>
