    return()=>{if(revInst.current)revInst.current.destroy();if(cntInst.current)cntInst.current.destroy();};
  },[labels.join(),revVals.join(),tgtVals.join(),ordVals.join()]);
  return(<div>

    <div style={{position:'relative',width:'100%',height:90}}><canvas ref={cntRef}/></div>
  </div>);
}

function toDate(v){if(!v)return null;const d=new Date(v);return isNaN(d)?null:d;}
function dateToYM(v){
  if(!v)return '';
  const s=String(v);
  if(s.length>=7&&s[4]==='-')return s.slice(0,7);
  const d=new Date(s);
  if(!isNaN(d))return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  return '';
}
function pad2(n){return n<10?'0'+n:String(n);}
function mean(arr){if(!arr.length)return 0;return arr.reduce((s,v)=>s+v,0)/arr.length;}
function stddev(arr,avg){if(arr.length<2)return 0;const v=arr.reduce((s,x)=>s+Math.pow(x-avg,2),0)/arr.length;return Math.sqrt(v);}

// ════════════════════════════════════════════
//  데이터 가공: V1 getUsageStats_ 로직 그대로
// ════════════════════════════════════════════
function buildUsageStats(usageRows,customers,vocRows){
  var map={BA:{},OA:{}};
  usageRows.forEach(function(row){
    var ym=String(row.year_month||'').trim();
    var hosp=String(row.hospital_name||'').trim();
    var custId=String(row.cust_id||'').trim();
    var prod=String(row.product||'').trim().toUpperCase();
    var cnt=Number(row.cnt||0);
    if(!ym||!hosp||!cnt)return;
    if(prod!=='BA'&&prod!=='OA')return;
    if(!map[prod][hosp])map[prod][hosp]={custId:custId,months:{}};
    map[prod][hosp].months[ym]=(map[prod][hosp].months[ym]||0)+cnt;
  });
  var allYms=[];
  ['BA','OA'].forEach(function(p){Object.keys(map[p]).forEach(function(h){Object.keys(map[p][h].months).forEach(function(ym){allYms.push(ym);});});});
  if(allYms.length===0)return {ba:{hospitals:[],summary:{}},oa:{hospitals:[],summary:{}},latestYm:''};
  allYms.sort();
  var latestYm=allYms[allYms.length-1];
  var yr=parseInt(latestYm.slice(0,4));var mo=parseInt(latestYm.slice(4,6));
  function recentMonths(n){var r=[];for(var i=0;i<n;i++){var m=mo-i;var y=yr;while(m<=0){m+=12;y--;}r.unshift(y+pad2(m));}return r;}

  var planMap={},custIdMap={},typeMap={};
  customers.forEach(function(c){
    var nm=String(c.hospital_name||'').trim();
    if(nm){planMap[nm]=String(c.plan||'').trim();if(!custIdMap[nm])custIdMap[nm]=String(c.cust_id||'').trim();}
  });
  var custById={};
  customers.forEach(function(c){custById[String(c.cust_id||'').trim()]=c;});

  // CS 알림 (고객ID 기준, 최근 3개월 미해결/불만)
  var csAlertMap={};
  var now=new Date();var threeMonAgo=new Date(now.getFullYear(),now.getMonth()-3,1);
  vocRows.forEach(function(r){
    var cid=String(r.cust_id||'').trim();
    var done=String(r.done||'').trim();
    var rt=String(r.receipt_type||'').trim();
    var d=new Date(String(r.received_at||''));
    if(!cid||isNaN(d.getTime())||d<threeMonAgo)return;
    if(done!=='Y'||rt==='불만'){
      if(!csAlertMap[cid])csAlertMap[cid]={count:0,hasBad:false};
      csAlertMap[cid].count++;
      if(rt==='불만')csAlertMap[cid].hasBad=true;
    }
  });

  function normHospType(rawType){
    if(!rawType||rawType==='미확인')return '미확인';
    var t=rawType;
    if(t.indexOf('소아청소년과')>=0||t.indexOf('아동병원')>=0||t==='소아과'||t.indexOf('소아정형')>=0)return '소아청소년과';
    if(t.indexOf('정형외과')>=0||t==='정형회과')return '정형외과';
    if(t.indexOf('치과')>=0)return '치과';
    if(t.indexOf('대학병원')>=0||t.indexOf('종합병원')>=0)return '종합·대학병원';
    if(t.indexOf('한의원')>=0||t.indexOf('한방')>=0)return '한방';
    return '기타의원';
  }

  function analyzeProduct(prodMap){
    var hospitals=[];
    var summary={안정형:0,변동형:0,성장형:0,불규칙:0,비활성:0,피크대비소멸:0};
    var recent12=recentMonths(12);var recent6=recentMonths(6);
    Object.keys(prodMap).forEach(function(hosp){
      var h=prodMap[hosp];
      var resolvedCustId=h.custId||custIdMap[hosp]||'';
      var masterHospName=hosp;
      var fc=resolvedCustId?custById[resolvedCustId]:null;
      if(fc)masterHospName=String(fc.hospital_name||'').trim();
      var plan=planMap[masterHospName]||planMap[hosp]||'';
      var csAlert=(resolvedCustId&&csAlertMap[resolvedCustId])||null;

      var allMonths=Object.keys(h.months).sort();
      var monthData=allMonths.map(function(ym){return {ym:ym,count:h.months[ym]||0};});
      var counts12=recent12.map(function(ym){return h.months[ym]||0;});
      var counts6=recent6.map(function(ym){return h.months[ym]||0;});
      var nonZero12=counts12.filter(function(v){return v>0;});
      var nonZero6=counts6.filter(function(v){return v>0;});
      var allCountsArr=Object.keys(h.months).sort().map(function(ym){return h.months[ym]||0;});
      var nonZeroAll=allCountsArr.filter(function(v){return v>0;});
      var latestCount=h.months[latestYm]||0;
      var avg12=mean(counts12);
      var avg6Val=mean(nonZero6.length>0?counts6:counts12);
      var sdBase=nonZeroAll.length>=3?nonZeroAll:(nonZero12.length>=2?nonZero12:counts12);
      var sd=stddev(sdBase,mean(sdBase));
      var upper=avg6Val+1.5*sd;var lower=Math.max(0,avg6Val-1.5*sd);
      var activeRatio=counts12.filter(function(v){return v>0;}).length/12;
      var firstHalf=recent12.slice(0,6).map(function(ym){return h.months[ym]||0;});
      var secondHalf=recent12.slice(6).map(function(ym){return h.months[ym]||0;});
      var firstAvg=mean(firstHalf);var secondAvg=mean(secondHalf);
      var growthRate=firstAvg>0?(secondAvg-firstAvg)/firstAvg*100:0;
      var cvAvg=mean(nonZero12.length>0?nonZero12:[0]);
      var cv=cvAvg>0?sd/cvAvg:0;
      var allAvg=mean(allCountsArr);

      var type='불규칙';
      if(nonZero6.length===0)type='비활성';
      else if(allAvg>=50&&latestCount>0&&latestCount<allAvg*0.2)type='피크대비소멸';
      else if(growthRate>70)type='성장형';
      else if(activeRatio>=0.5&&cv<=0.6)type='안정형';
      else if(activeRatio>=0.5&&cv>0.6)type='변동형';
      else type='불규칙';
      summary[type]=(summary[type]||0)+1;

      var alert=null;
      if(latestCount>upper&&upper>0)alert='up';
      else if(latestCount<lower&&latestCount>0&&avg6Val>10)alert='down';

      var movingAvgData=recent12.map(function(ym,i){
        var win=recent12.slice(Math.max(0,i-5),i+1).map(function(m){return h.months[m]||0;});
        var wAvg=mean(win);var wSd=stddev(win,wAvg);
        return {ym:ym,avg:Math.round(wAvg),upper:Math.round(wAvg+1.5*wSd),lower:Math.round(Math.max(0,wAvg-1.5*wSd)),count:h.months[ym]||0};
      });

      // 분기 변화율
      var curQ=[],prevQ=[];
      for(var qi=0;qi<3;qi++){var m=mo-qi,y=yr;while(m<=0){m+=12;y--;}curQ.push(y+pad2(m));}
      for(var qi2=3;qi2<6;qi2++){var m2=mo-qi2,y2=yr;while(m2<=0){m2+=12;y2--;}prevQ.push(y2+pad2(m2));}
      var curQSum=curQ.reduce(function(s,m){return s+(h.months[m]||0);},0);
      var prevQSum=prevQ.reduce(function(s,m){return s+(h.months[m]||0);},0);
      var qChangeRate=prevQSum>0?(curQSum-prevQSum)/prevQSum*100:null;
      var isQDown=qChangeRate!==null&&qChangeRate<=-10;
      var isQUp=qChangeRate!==null&&qChangeRate>=10;
      var lowPlans=['P10','P20','P50','P100','M100','M200'];
      var isLowPlan=lowPlans.some(function(p){return plan.indexOf(p)>=0;});
      var recent3=[];for(var ri=0;ri<3;ri++){var rm=mo-ri,ry=yr;while(rm<=0){rm+=12;ry--;}recent3.push(ry+pad2(rm));}
      var recent3Sum=recent3.reduce(function(s,m){return s+(h.months[m]||0);},0);
      var isRecentInactive=recent3Sum===0&&avg12>0;

      var actionGroup='모니터링';
      if(isRecentInactive)actionGroup='재활성화';
      else if(isQDown&&(csAlert||type==='피크대비소멸'))actionGroup='즉시대응';
      else if(isQUp&&isLowPlan)actionGroup='업셀링';
      else if(isQDown)actionGroup='모니터링';
      else actionGroup='유지관찰';

      hospitals.push({
        hospName:hosp,custId:resolvedCustId,plan:plan,type:type,actionGroup:actionGroup,
        hospType:normHospType(fc?String(fc.hospital_type||'미확인').trim():'미확인'),
        latestCount:latestCount,avg6:Math.round(avg6Val),avg12:Math.round(avg12),
        upperBand:Math.round(upper),lowerBand:Math.round(lower),
        qChangeRate:qChangeRate!==null?Math.round(qChangeRate):null,
        alert:alert,csAlert:csAlert,movingAvgData:movingAvgData
      });
    });
    hospitals.sort(function(a,b){if(a.alert&&!b.alert)return -1;if(!a.alert&&b.alert)return 1;return b.latestCount-a.latestCount;});
    return {hospitals:hospitals,summary:summary};
  }
  return {ba:analyzeProduct(map.BA),oa:analyzeProduct(map.OA),latestYm:latestYm};
}

// ════════════════════════════════════════════
//  요금제 업셀링: V1 getPlanUsageStats_ 로직
// ════════════════════════════════════════════
function buildPlanUsageStats(usageRows,customers){
  var activeCusts=customers.filter(function(c){var st=String(c.contract_status||'').trim();return st==='활성'||st==='계약';});
  function parseLimit(plan){if(!plan)return null;var p=String(plan);if(p.indexOf('년')>=0)return null;var m=p.match(/[PM](\d+)/i);if(m)return parseInt(m[1]);var n=p.match(/^(\d+)$/);if(n)return parseInt(n[1]);return null;}
  var now=new Date();var yr=now.getFullYear();var mo=now.getMonth()+1;
  var recent6=[];for(var i=0;i<6;i++){var m2=mo-i,y2=yr;while(m2<=0){m2+=12;y2--;}recent6.push(y2+pad2(m2));}
  var latestYm=recent6[0];
  var usageMap={};
  usageRows.forEach(function(row){
    var ym=String(row.year_month||'').trim();var custId=String(row.cust_id||'').trim();
    var prod=String(row.product||'').trim().toUpperCase();var cnt=Number(row.cnt||0);
    if(!custId||prod!=='BA'||!cnt)return;
    if(!usageMap[custId])usageMap[custId]={};
    usageMap[custId][ym]=(usageMap[custId][ym]||0)+cnt;
  });
  function calcTrend(vals){var n=vals.length;if(n<2)return 0;var sx=0,sy=0,sxy=0,sx2=0;vals.forEach(function(v,i){sx+=i;sy+=v;sxy+=i*v;sx2+=i*i;});var d=n*sx2-sx*sx;if(d===0)return 0;return (n*sxy-sx*sy)/d;}
  var hospitals=[];var planSummary={};var planOrder=['P10','P20','P50','P100','P200','P300','P500','P1000'];
  activeCusts.forEach(function(c){
    var custId=String(c.cust_id||'').trim();var hospName=String(c.hospital_name||'').trim();
    var plan=String(c.plan||'').trim();var limit=parseLimit(plan);
    if(!custId||!plan||!limit)return;
    var months=usageMap[custId]||{};
    var vals6=recent6.slice().reverse().map(function(ym){return months[ym]||0;});
    var vals3=vals6.slice(3);var avg3=Math.round(vals3.reduce(function(s,v){return s+v;},0)/3);
    var latestCnt=months[latestYm]||0;var usagePct=limit>0?Math.round(avg3/limit*100):0;
    var trend=calcTrend(vals6);var nonZeroCnt=vals6.filter(function(v){return v>0;}).length;
    var curIdx=planOrder.indexOf(plan);var nextPlan=curIdx>=0&&curIdx<planOrder.length-1?planOrder[curIdx+1]:null;
    var vals3prev=vals6.slice(0,3);var avg3prev=Math.round(vals3prev.reduce(function(s,v){return s+v;},0)/3);
    var growthVs3=avg3prev>0?Math.round((avg3-avg3prev)/avg3prev*100):null;
    var status='적정';var statusDetail='';var upsellTier=null;
    if(nonZeroCnt===0){status='비활성';statusDetail='6개월 미사용';}
    else if(usagePct>100){status='업셀링';upsellTier=1;statusDetail='한도 초과 '+usagePct+'%';}
    else if(usagePct>=80){status='업셀링';upsellTier=1;statusDetail='한도 임박 '+usagePct+'%';}
    else if(growthVs3!==null&&growthVs3>=20&&usagePct>=40){status='업셀링';upsellTier=2;statusDetail='3개월 성장 +'+growthVs3+'%';}
    else if(nonZeroCnt>=5&&usagePct>=50){status='업셀링';upsellTier=3;statusDetail='꾸준한 사용 '+usagePct+'%';}
    else if(trend<-1&&usagePct<50){status='관리필요';statusDetail='감소 추세';}
    else if(usagePct<20&&nonZeroCnt<=3){status='관리필요';statusDetail='저활용';}
    hospitals.push({custId:custId,hospName:hospName,plan:plan,limit:limit,avg3:avg3,latestCnt:latestCnt,usagePct:usagePct,trend:Math.round(trend*10)/10,growthVs3:growthVs3,status:status,statusDetail:statusDetail,upsellTier:upsellTier,nextPlan:nextPlan});
    if(!planSummary[plan])planSummary[plan]={plan:plan,limit:limit,total:0,over:0,upsell:0,manage:0,inactive:0,ok:0,avgSum:0};
    planSummary[plan].total++;planSummary[plan].avgSum+=avg3;
    if(status==='업셀링')planSummary[plan].upsell++;
    else if(status==='관리필요')planSummary[plan].manage++;
    else if(status==='비활성')planSummary[plan].inactive++;
    else planSummary[plan].ok++;
  });
  var planList=Object.keys(planSummary).map(function(kk){return planSummary[kk];});
  planList.forEach(function(p){p.avg=p.total>0?Math.round(p.avgSum/p.total):0;p.avgPct=p.limit>0?Math.round(p.avg/p.limit*100):0;delete p.avgSum;});
  planList.sort(function(a,b){return planOrder.indexOf(a.plan)-planOrder.indexOf(b.plan);});
  var upsellList=hospitals.filter(function(h){return h.status==='업셀링';}).sort(function(a,b){if(a.upsellTier!==b.upsellTier)return a.upsellTier-b.upsellTier;return b.usagePct-a.usagePct;}).slice(0,20);
  var manageList=hospitals.filter(function(h){return h.status==='관리필요';}).sort(function(a,b){return a.trend-b.trend;}).slice(0,20);
  var inactiveList=hospitals.filter(function(h){return h.status==='비활성';}).slice(0,20);
  var kpi={total:hospitals.length,over:hospitals.filter(function(h){return h.usagePct>100;}).length,upsell:hospitals.filter(function(h){return h.status==='업셀링';}).length,manage:hospitals.filter(function(h){return h.status==='관리필요';}).length,inactive:hospitals.filter(function(h){return h.status==='비활성';}).length,ok:hospitals.filter(function(h){return h.status==='적정';}).length};
  return {kpi:kpi,planList:planList,upsellList:upsellList,manageList:manageList,inactiveList:inactiveList,latestYm:latestYm};
}

function CustomerMaster(){
  const [allRows,setAllRows]=useState([]);
  const [acctRows,setAcctRows]=useState([]);
  const [ld,setLd]=useState(true);const [err,setErr]=useState(null);
  const [inputQ,setInputQ]=useState('');const [q,setQ]=useState('');
  const [st,setSt]=useState('');const [rg,setRg]=useState('');
  const [pg,setPg]=useState(1);
  const [sortKey,setSortKey]=useState('');const [sortDir,setSortDir]=useState(1);
  const [did,setDid]=useState(null);const [sn,setSn]=useState(false);
  const [showList,setShowList]=useState(false);
  const [focused,setFocused]=useState(false);
  const [recent,setRecent]=useState([]);
  const debRef=useRef(null);
  const PS=50;

  const acctNameMap=useMemo(()=>{const m={};acctRows.forEach(a=>{const cid=a.cust_id;if(!m[cid])m[cid]=[];if(a.username)m[cid].push(a.username);});return m;},[acctRows]);
  const acct1Map=useMemo(()=>{const m={};acctRows.forEach(a=>{if(String(a.account_no)==='1')m[a.cust_id]=a.username;});return m;},[acctRows]);

  useEffect(()=>{
    (async()=>{
      try{
        const customers=await fetchAll('customers','*');
        const accounts=await fetchAll('customer_accounts','*');
        setAllRows(customers.filter(c=>c.cust_id&&String(c.cust_id).startsWith('C_')).map(mapCustomer));
        setAcctRows(accounts);
        setLd(false);
      }catch(e){console.error(e);setErr(e.message||String(e));setLd(false);}
    })();
  },[]);

  // 고객 열기 + 최근 조회 기록
  function openCust(cid){
    setDid(cid);setShowList(false);setFocused(false);
    setRecent(prev=>[cid,...prev.filter(x=>x!==cid)].slice(0,8));
  }

  const filtered=useMemo(()=>{
    let rows=allRows;
    if(st)rows=rows.filter(c=>c['계약상태']===st);
    if(rg)rows=rows.filter(c=>String(c['지역']||'').includes(rg));
    if(q){const lq=q.toLowerCase();rows=rows.filter(c=>{const names=(acctNameMap[c['고객ID']]||[]).join(' ');return [c['병원명'],c['지역'],c['전화번호'],names].some(v=>String(v||'').toLowerCase().includes(lq));});}
    if(sortKey){rows=[...rows].sort((a,b)=>{let av,bv;if(sortKey==='계정1'){av=acct1Map[a['고객ID']]||'';bv=acct1Map[b['고객ID']]||'';}else{av=String(a[sortKey]||'');bv=String(b[sortKey]||'');}return String(av).localeCompare(String(bv),'ko')*sortDir;});}
    return rows;
  },[allRows,st,rg,q,sortKey,sortDir,acctNameMap,acct1Map]);

  // 검색어 입력 시 드롭다운에 보여줄 결과 (상태/지역 필터 무시, 검색어만)
  const searchHits=useMemo(()=>{
    if(!q.trim())return [];
    const lq=q.toLowerCase();
    return allRows.filter(c=>{const names=(acctNameMap[c['고객ID']]||[]).join(' ');return [c['병원명'],c['지역'],c['전화번호'],names].some(v=>String(v||'').toLowerCase().includes(lq));}).slice(0,30);
  },[allRows,q,acctNameMap]);

  const tot=filtered.length;const totalPages=Math.ceil(tot/PS)||1;
  const pageRows=filtered.slice((pg-1)*PS,pg*PS);
  function toggleSort(k){if(sortKey===k)setSortDir(d=>d*-1);else{setSortKey(k);setSortDir(1);}}

    ['(DEMO)시작일','(DEMO)시작일',false,'date'],['(DEMO)종료일','(DEMO)종료일',false,'date'],
    ['(DEMO)제공건수','(DEMO)제공건수',false],['(DEMO)사용건수','(DEMO)사용건수',false],
    ['(DEMO)연장일','(DEMO)연장일',false,'date'],['(DEMO)연장사유','(DEMO)연장사유',false],

    ['업태','업태',false],['종목','종목',false],['세금계산서 이메일','세금계산서이메일',false],['특이사항','특이사항',false,'textarea'],
  ];

    });
    const sortedCycles=Object.values(cycleGroups).sort((a,b)=>(b.latestDate||'').localeCompare(a.latestDate||''));
    const benefits=hisBtOrds.map(o=>({orderId:o['주문ID']||'',isManual:String(o['주문ID']||'').indexOf('BENEFIT-')===0,date:fmtDate(o['추천혜택 지급일'])||'',count:o['추천혜택 건수']||'',_used:false})).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    const isWithin30=(d1,d2)=>{if(!d1||!d2)return false;const t1=new Date(d1).getTime(),t2=new Date(d2).getTime();if(isNaN(t1)||isNaN(t2))return false;return Math.abs(t1-t2)/86400000<=30;};
    const cycleRows=sortedCycles.map((g,i)=>{
      const s=g.start,q=g.quote,sn=g.send,sg=g.sign;
      const sendDisplay=sn?(sn.type==='거래명세서발송'?'거래명세서':sn.date||'-'):'-';
      const startDate=s?.date||'';
      let matchedBenefit=null;
      if(startDate){const cands=benefits.filter(b=>!b._used&&b.date&&isWithin30(startDate,b.date));if(cands.length>0){cands.sort((a,b)=>{const aA=new Date(a.date)>=new Date(startDate)?0:1;const bA=new Date(b.date)>=new Date(startDate)?0:1;if(aA!==bA)return aA-bA;return Math.abs(new Date(a.date)-new Date(startDate))-Math.abs(new Date(b.date)-new Date(startDate));});matchedBenefit=cands[0];const ui=benefits.findIndex(b=>b.orderId===matchedBenefit.orderId);if(ui>=0)benefits[ui]._used=true;}}
      return{quote:q?.date||'-',send:sendDisplay,sign:sg?.date||'-',plan:s?.plan||(i===0?(c&&c['요금제'])||'-':'-'),start:startDate||'-',benefit:matchedBenefit,_orphan:false,_cycleId:g.cycleId,_s:s,_q:q,_sn:sn,_sg:sg};
    });
    const orphanRows=benefits.filter(b=>!b._used).map(b=>({quote:'-',send:'-',sign:'-',plan:'-',start:'-',benefit:b,_orphan:true,_cycleId:null,_s:null,_q:null,_sn:null,_sg:null}));
    const allR=[...cycleRows,...orphanRows].sort((a,b)=>{const da=a.start!=='-'?a.start:(a.benefit?.date||'');const db=b.start!=='-'?b.start:(b.benefit?.date||'');return (db||'').localeCompare(da||'');});
    if(allR.length===0&&!(gridEdit&&addRows.length>0))allR.push({quote:'-',send:'-',sign:'-',plan:'-',start:'-',benefit:null,_orphan:false,_cycleId:null,_s:null,_q:null,_sn:null,_sg:null});
    return allR;
  }

  async function reloadHistory(){
    const his=await sb.from('sales_history').select('*').eq('cust_id',id);
    setHisRows((his.data||[]).map((h,idx)=>({type:h.history_type,date:fmtDate(h.history_date),plan:h.plan||'',cycleId:h.cycle_id||'',note:h.notes||'',_rowIndex:idx,_historyId:h.history_id})));

  function genHistoryId(yearStr,offset){
    let maxNum=0;
    hisRaw.forEach(h=>{const m=String(h.history_id||'').match(/HIS-\d+-(\d+)/);if(m){const n=parseInt(m[1]);if(n>maxNum)maxNum=n;}});
    return 'HIS-'+yearStr+'-'+String(maxNum+1+offset).padStart(5,'0');
  }
  function genCycleId(offset){
    let maxNum=0;
    const pat=new RegExp('^CYCLE-'+id.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'-(\\d+)$');
    hisRaw.forEach(h=>{const m=String(h.cycle_id||'').match(pat);if(m){const n=parseInt(m[1]);if(n>maxNum)maxNum=n;}});
    return 'CYCLE-'+id+'-'+String(maxNum+1+offset).padStart(3,'0');
  }

  async function saveGrid(allR){
    setSv(true);
    try{
      const yr=String(new Date().getFullYear());
      const updates=[];const inserts=[];let insOffset=0;
      for(const [i,row] of allR.entries()){
        const ed=editData[i];if(!ed)continue;
        const qv=ed.quote!==undefined?ed.quote:(row.quote!=='-'?row.quote:'');
        const snv=ed.send!==undefined?ed.send:(row.send!=='-'?row.send:'');
        const sgv=ed.sign!==undefined?ed.sign:(row.sign!=='-'?row.sign:'');
        const stv=ed.start!==undefined?ed.start:(row.start!=='-'?row.start:'');
        const pl=ed.plan!==undefined?ed.plan:(row.plan!=='-'?row.plan:'');
        const isStatement=snv&&/^[^0-9-]/.test(String(snv).trim());
        const sendType=isStatement?'거래명세서발송':'이용신청서발송';
        const cyc=row._cycleId;
        if(row._s)updates.push({historyId:row._s._historyId,type:'약정시작',date:stv,plan:pl});
        else if(stv&&cyc){inserts.push({history_id:genHistoryId(yr,insOffset++),cust_id:id,hospital_name:c['병원명']||'',history_type:'약정시작',history_date:stv||null,plan:pl||'',cycle_id:cyc});}
        if(row._q)updates.push({historyId:row._q._historyId,type:'견적서발송',date:qv,plan:''});
        else if(qv&&cyc){inserts.push({history_id:genHistoryId(yr,insOffset++),cust_id:id,hospital_name:c['병원명']||'',history_type:'견적서발송',history_date:qv||null,plan:'',cycle_id:cyc});}
        if(row._sn)updates.push({historyId:row._sn._historyId,type:sendType,date:isStatement?null:snv,plan:''});
        else if(snv&&cyc){inserts.push({history_id:genHistoryId(yr,insOffset++),cust_id:id,hospital_name:c['병원명']||'',history_type:sendType,history_date:isStatement?null:(snv||null),plan:'',cycle_id:cyc});}
        if(row._sg)updates.push({historyId:row._sg._historyId,type:'이용신청서계약',date:sgv,plan:''});
        else if(sgv&&cyc){inserts.push({history_id:genHistoryId(yr,insOffset++),cust_id:id,hospital_name:c['병원명']||'',history_type:'이용신청서계약',history_date:sgv||null,plan:'',cycle_id:cyc});}
      }
      addRows.filter(nr=>nr.quote||nr.send||nr.sign||nr.start||nr.plan).forEach(nr=>{
        const sendVal=String(nr.send||'').trim();
        const isStatement=sendVal&&/^[^0-9-]/.test(sendVal);
        const sendType=isStatement?'거래명세서발송':'이용신청서발송';
        const thisCyc='CYCLE-'+id+'-'+String((()=>{let mx=0;const pat=new RegExp('^CYCLE-'+id.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'-(\\d+)$');hisRaw.concat(inserts.map(x=>({cycle_id:x.cycle_id}))).forEach(h=>{const m=String(h.cycle_id||'').match(pat);if(m){const n=parseInt(m[1]);if(n>mx)mx=n;}});return mx+1;})()).padStart(3,'0');
        if(nr.quote)inserts.push({history_id:genHistoryId(yr,insOffset++),cust_id:id,hospital_name:c['병원명']||'',history_type:'견적서발송',history_date:nr.quote||null,plan:'',cycle_id:thisCyc});
        if(sendVal)inserts.push({history_id:genHistoryId(yr,insOffset++),cust_id:id,hospital_name:c['병원명']||'',history_type:sendType,history_date:isStatement?null:(sendVal||null),plan:'',cycle_id:thisCyc});
        if(nr.sign)inserts.push({history_id:genHistoryId(yr,insOffset++),cust_id:id,hospital_name:c['병원명']||'',history_type:'이용신청서계약',history_date:nr.sign||null,plan:'',cycle_id:thisCyc});
        if(nr.start||nr.plan)inserts.push({history_id:genHistoryId(yr,insOffset++),cust_id:id,hospital_name:c['병원명']||'',history_type:'약정시작',history_date:nr.start||null,plan:nr.plan||'',cycle_id:thisCyc});
      });
      if(updates.length===0&&inserts.length===0){setGridEdit(false);setEditData({});setAddRows([]);setSv(false);return;}
      for(const u of updates){
        if(!u.historyId)continue;
        const upd={history_type:u.type,history_date:u.date||null};
        if(u.type==='약정시작')upd.plan=u.plan||'';
        await sb.from('sales_history').update(upd).eq('history_id',u.historyId);
      }
      if(inserts.length>0)await sb.from('sales_history').insert(inserts);
      await reloadHistory();
      setGridEdit(false);setEditData({});setAddRows([]);setSv(false);
      alert('저장되었습니다.');
    }catch(e){alert('저장 오류: '+(e.message||e));setSv(false);}
  }

// 영문 → 한글 (주문)
function mapOrder(o){
  return {
    '주문ID':o.order_id,'고객ID':o.cust_id,'발주처':o.orderer,'병원명':o.orderer,'연락처':o.phone,
    '접수일자':fmtDate(o.received_at),'납기요구일자':fmtDate(o.delivery_due),'품명':o.item_name,'규격':o.spec,
    '수량':o.qty,'공급가액':o.supply_amount,'부가세':o.vat,'금액_VAT포함':o.total_amount,
    '접수자':o.receiver,'검토자':o.reviewer,'납품일자':fmtDate(o.delivered_at),
    '추천혜택 지급일':fmtDate(o.referral_paid_at),'추천혜택 건수':o.referral_cnt,
    '요구사항':o.requirements,'비고':o.notes,_raw:o
  };
}
// 한글 → 영문 (주문)
function toOrderDb(f){
  return {
    cust_id:f['고객ID']||null,orderer:f['발주처']||null,phone:f['연락처']||null,
    received_at:f['접수일자']||null,delivery_due:f['납기요구일자']||null,item_name:f['품명']||null,spec:f['규격']||null,
    qty:f['수량']||null,supply_amount:f['공급가액']||null,vat:f['부가세']||null,total_amount:f['금액_VAT포함']||null,
    receiver:f['접수자']||null,reviewer:f['검토자']||null,delivered_at:f['납품일자']||null,
    referral_paid_at:f['추천혜택 지급일']||null,referral_cnt:f['추천혜택 건수']||null,
    requirements:f['요구사항']||null,notes:f['비고']||null
  };
}

function OrderManagement(){
  const [allRows,setAllRows]=useState([]);
  const [ld,setLd]=useState(true);const [err,setErr]=useState(null);
  const [inputQ,setInputQ]=useState('');const [q,setQ]=useState('');
  const [sn,setSn]=useState(false);const [selOrd,setSelOrd]=useState(null);
  const debRef=useRef(null);

  const load=useCallback(async()=>{
    setLd(true);setErr(null);
    try{
      // 최근 주문 200건 (V1과 동일하게 검색 없으면 최근순)
      let query=sb.from('orders').select('*').order('received_at',{ascending:false}).limit(500);
      const {data,error}=await query;
      if(error)throw error;
      setAllRows((data||[]).map(mapOrder));
      setLd(false);
    }catch(e){console.error(e);setErr(e.message||String(e));setLd(false);}
  },[]);
  useEffect(()=>{load();},[load]);

  const filtered=useMemo(()=>{
    let rows=allRows.filter(o=>String(o['주문ID']||'').indexOf('BENEFIT-')!==0);
    if(q){const lq=q.toLowerCase();rows=rows.filter(o=>[o['주문ID'],o['발주처'],o['병원명'],o['연락처']].some(v=>String(v||'').toLowerCase().includes(lq)));}
    return rows.slice(0,200);
  },[allRows,q]);

  if(ld)return <Spin/>;

  return(
    <div style={{padding:14,height:'100vh',display:'flex',flexDirection:'column',gap:10}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div style={{display:'flex',alignItems:'center',gap:5,background:'var(--bg)',border:'0.5px solid var(--border)',borderRadius:8,padding:'4px 9px',width:280}}>
          <span style={{fontSize:12,color:'var(--text-2)'}}>🔍</span>
          <input value={inputQ} onChange={e=>{const v=e.target.value;setInputQ(v);clearTimeout(debRef.current);debRef.current=setTimeout(()=>setQ(v),400);}} placeholder="주문ID · 병원명 · 원장님 · 연락처 검색" style={{border:'none',background:'transparent',padding:0,fontSize:11}}/>
        </div>
        <button className="btn btn-tem" onClick={()=>setSn(true)}>+ 신규 주문 등록</button>
      </div>
      {err&&<div className="errbox">{err}</div>}
      <div style={{background:'var(--bg)',border:'0.5px solid var(--border)',borderRadius:12,flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>
        <div style={{flex:1,overflowY:'auto'}}>
          <table className="tbl">
            <thead><tr><th>주문ID</th><th>병원명</th><th>접수일</th><th>품명</th><th>규격</th><th style={{textAlign:'right'}}>금액(VAT)</th><th>접수자</th></tr></thead>
            <tbody>
              {filtered.map((o,i)=>(<tr key={o['주문ID']||i} onClick={()=>setSelOrd(o)}>
                <td style={{fontSize:10,color:'var(--text-2)'}}>{o['주문ID']||'-'}</td>
                <td style={{fontWeight:600}}>{o['발주처']||o['병원명']||'-'}</td>
                <td style={{color:'var(--text-2)'}}>{fmtDate(o['접수일자'])||'-'}</td>
                <td style={{color:'var(--text-2)'}}>{o['품명']||'-'}</td>
                <td style={{color:'var(--text-2)'}}>{o['규격']||'-'}</td>
                <td style={{textAlign:'right',color:'#4ade80',fontWeight:600}}>{o['금액_VAT포함']?'₩'+Number(o['금액_VAT포함']).toLocaleString():'-'}</td>
                <td style={{color:'var(--text-2)'}}>{o['접수자']||'-'}</td>
              </tr>))}
              {filtered.length===0&&<tr><td colSpan={7} style={{textAlign:'center',padding:24,color:'var(--text-2)'}}>주문이 없습니다.</td></tr>}
            </tbody>
          </table>
        </div>
        <div style={{padding:'7px 12px',borderTop:'0.5px solid var(--border)',fontSize:10,color:'var(--text-2)'}}>표시 {filtered.length}건 (최근순)</div>
      </div>
      {sn&&<OrdNew onClose={()=>setSn(false)} onSaved={()=>{setSn(false);load();}}/>}
      {selOrd&&<OrdDetail order={selOrd} onClose={()=>setSelOrd(null)} onRefresh={load}/>}
    </div>
  );
}

function OrdDetail({order,onClose,onRefresh}){
  const [ed,setEd]=useState(false);const [sv,setSv]=useState(false);
  const [fm,setFm]=useState(()=>{
    const init={...(order||{})};
    ['접수일자','납기요구일자','납품일자','추천혜택 지급일'].forEach(k=>{if(init[k])init[k]=fmtDate(init[k]);});
    return init;
  });
  function s(k,v){
    const f={...fm,[k]:v};
    if(k==='공급가액'){const n=parseFloat(String(v).replace(/[^\d.]/g,''))||0;f['부가세']=Math.round(n*.1);f['금액_VAT포함']=Math.round(n*1.1);}
    setFm(f);
  }
  async function save(){
    setSv(true);
    try{
      const {error}=await sb.from('orders').update(toOrderDb(fm)).eq('order_id',fm['주문ID']);
      if(error)throw error;
      // 매출채권 동기화 (있으면 갱신)
      await sb.from('receivables').update({spec:fm['규격'],qty:fm['수량'],supply_amount:fm['공급가액'],vat:fm['부가세'],total_amount:fm['금액_VAT포함'],delivered_at:fm['납품일자']||null,received_at:fm['접수일자']||null}).eq('order_id',fm['주문ID']);
      alert('수정되었습니다.');setSv(false);onClose();if(onRefresh)onRefresh();
    }catch(e){alert('오류: '+(e.message||e));setSv(false);}
  }
  async function del(){
    if(!confirm('삭제하시겠습니까?'))return;
    try{
      await sb.from('orders').delete().eq('order_id',fm['주문ID']);
      await sb.from('receivables').delete().eq('order_id',fm['주문ID']);
      alert('삭제되었습니다.');onClose();if(onRefresh)onRefresh();
    }catch(e){alert('오류: '+(e.message||e));}
  }
  const flds=[['주문ID','주문ID',true],['고객ID','고객ID',true],
    ['발주처(병원명)','발주처',false],['연락처','연락처',false],
    ['접수일자','접수일자',false,'date'],['납기요구일자','납기요구일자',false,'date'],
    ['품명','품명',false],['규격(요금제)','규격',false],
    ['수량','수량',false],['공급가액','공급가액',false],
    ['부가세 (자동)','부가세',true],['금액 VAT포함 (자동)','금액_VAT포함',true],
    ['접수자','접수자',false],['검토자','검토자',false],['납품일자','납품일자',false,'date'],
    ['추천혜택 지급일','추천혜택 지급일',false,'date'],['추천혜택 건수','추천혜택 건수',false]];
  return(
    <div className="ov" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="mo">
        <div className="mh"><div className="mt">🧾 주문 상세</div><button className="xb" onClick={onClose}>✕</button></div>
        <div className="mb">
          {ed?(
            <div className="fg">
              {flds.map(([l,k,ro,tp])=>{const isCalc=(k==='부가세'||k==='금액_VAT포함');const isMoney=(k==='공급가액'||k==='부가세'||k==='금액_VAT포함');return(<div key={k} className="fi"><div className="fl">{l}</div><input type={(isMoney||ro)?'text':(tp||'text')} value={isMoney?(fm[k]?Number(String(fm[k]).replace(/[^\d]/g,'')).toLocaleString('ko-KR'):''):(fm[k]||'')} readOnly={ro} className={ro?(isCalc?'ci':'ai'):''} style={isMoney?{textAlign:'right'}:{}} onChange={e=>s(k,isMoney?e.target.value.replace(/[^\d]/g,''):e.target.value)}/></div>);})}
              <div className="fi full"><div className="fl">요구사항</div><textarea value={fm['요구사항']||''} onChange={e=>s('요구사항',e.target.value)} style={{height:54,resize:'none'}}/></div>
              <div className="fi full"><div className="fl">비고</div><textarea value={fm['비고']||''} onChange={e=>s('비고',e.target.value)} style={{height:42,resize:'none'}}/></div>
            </div>
          ):(
            <div className="fg">
              {flds.map(([l,k])=>(<div key={k} className="fb"><div className="fbl">{l}</div><div className={'fbv'+(!order[k]?' dim':'')}>{k.indexOf('금액')>=0||k==='공급가액'||k==='부가세'?(order[k]?'₩'+Number(order[k]).toLocaleString():'-'):(fmtDate(order[k])||order[k]||'-')}</div></div>))}
              <div className="fb full"><div className="fbl">요구사항</div><div className="fbv dim">{order['요구사항']||'-'}</div></div>
              <div className="fb full"><div className="fbl">비고</div><div className="fbv dim">{order['비고']||'-'}</div></div>
            </div>
          )}
        </div>
        <div className="mf">
          <button className="btn btn-r" onClick={del}>🗑 삭제</button>
          <div style={{display:'flex',gap:7}}>
            <button className="btn" onClick={onClose}>닫기</button>
            {ed?<button className="btn btn-t" onClick={save} disabled={sv}>{sv?'저장 중...':'저장'}</button>:<button className="btn btn-b" onClick={()=>setEd(true)}>✎ 수정</button>}
          </div>
        </div>
      </div>
    </div>
  );
}

function OrdNew({onClose,onSaved}){
  const [fm,setFm]=useState({접수일자:localToday(),수량:'1'});
  const [sv,setSv]=useState(false);const [hist,setHist]=useState([]);
  const [srchLd,setSrchLd]=useState(false);const [srchResults,setSrchResults]=useState([]);
  function s(k,v){const f={...fm,[k]:v};if(k==='공급가액'){const n=parseFloat(v)||0;f['부가세']=Math.round(n*.1);f['금액_VAT포함']=Math.round(n*1.1);}setFm(f);}
  async function srch(){
    if(!fm._q)return;setSrchLd(true);setSrchResults([]);
    try{
      const term=fm._q.trim();
      let {data}=await sb.from('customers').select('cust_id,hospital_name,region,plan,ceo_name,phone').or('hospital_name.ilike.%'+term+'%,cust_id.ilike.%'+term+'%').limit(20);
      data=data||[];setSrchLd(false);
      if(data.length===1)selectCust(data[0]);else setSrchResults(data);
    }catch(e){setSrchLd(false);}
  }
  async function selectCust(c){
    setSrchResults([]);
    setFm(f=>({...f,고객ID:c.cust_id,발주처:c.hospital_name,연락처:c.phone}));
    const {data}=await sb.from('orders').select('*').eq('cust_id',c.cust_id).order('received_at',{ascending:false}).limit(5);
    setHist((data||[]).filter(o=>String(o.order_id||'').indexOf('BENEFIT-')!==0).map(mapOrder));
  }
  async function save(){
    if(!fm.발주처){alert('병원명은 필수입니다.');return;}
    setSv(true);
    try{
      // 주문ID 생성: ORD-YYYY-MM-NNNN
      const today=new Date();const prefix='ORD-'+today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0');
      const {data:existing}=await sb.from('orders').select('order_id').like('order_id',prefix+'%');
      const seq=(existing||[]).length+1;
      const newId=prefix+'-'+String(seq).padStart(4,'0');
      const dbRow={order_id:newId,...toOrderDb(fm)};
      const {error}=await sb.from('orders').insert(dbRow);if(error)throw error;
      // 매출채권 자동연동
      let cust={};
      if(fm.고객ID){const {data:cd}=await sb.from('customers').select('*').eq('cust_id',fm.고객ID).single();cust=cd||{};}
      const billingDate=fm.납품일자?new Date(fm.납품일자):new Date();
      const dueDate=new Date(billingDate);dueDate.setDate(dueDate.getDate()+30);
      const fmtD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      const arRow={order_id:newId,cust_id:fm.고객ID||null,hospital_name:fm.발주처||cust.hospital_name||'',received_at:fm.접수일자||null,spec:fm.규격||null,qty:fm.수량||1,delivered_at:fm.납품일자||null,billed_at:fm.납품일자?fmtD(billingDate):null,due_date:fmtD(dueDate),supply_amount:fm.공급가액||null,vat:fm.부가세||null,total_amount:fm['금액_VAT포함']||null,business_reg_no:cust.business_reg_no||null,corp_name:cust.corp_name||null,ceo_name:cust.ceo_name||null,business_address:cust.business_address||null,business_type:cust.business_type||null,business_item:cust.business_item||null,tax_invoice_email:cust.tax_invoice_email||null};
      await sb.from('receivables').insert(arRow);
      // 고객마스터 추천혜택 업데이트
      if(fm['추천혜택 건수']&&fm.고객ID){await sb.from('customers').update({referral_benefit_cnt:fm['추천혜택 건수']}).eq('cust_id',fm.고객ID);}
      alert('등록되었습니다. (주문ID: '+newId+', 매출채권 자동연동 완료)');
      if(onSaved)onSaved();
    }catch(e){alert('오류: '+(e.message||e));setSv(false);}
  }
  return(
    <div className="ov" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="mo lg">
        <div className="mh mh-em"><div className="mt">📋 주문 신규접수</div><button className="xb" onClick={onClose}>✕</button></div>
        <div style={{display:'flex',flex:1,overflow:'hidden',minHeight:0,maxHeight:'72vh'}}>
          <div style={{flex:1.1,padding:14,overflowY:'auto',display:'flex',flexDirection:'column',gap:9}}>
            <div className="sh">🏥 고객정보</div>
            <div className="fg">
              <div className="fi full"><div className="fl">고객 검색</div>
                <div style={{display:'flex',gap:5}}>
                  <input value={fm._q||''} onChange={e=>s('_q',e.target.value)} onKeyDown={e=>e.key==='Enter'&&srch()} placeholder="고객ID 또는 병원명 입력" style={{flex:1}}/>
                  <button className="btn btn-t" style={{padding:'5px 10px'}} onClick={srch}>{srchLd?'검색중...':'검색'}</button>
                </div>
                {srchResults.length>1&&(<div style={{marginTop:5,border:'0.5px solid var(--border)',borderRadius:7,overflow:'hidden',maxHeight:130,overflowY:'auto'}}>{srchResults.map((c,i)=>(<div key={i} onClick={()=>selectCust(c)} style={{padding:'6px 10px',cursor:'pointer',fontSize:11,borderBottom:'0.5px solid var(--border)',background:'var(--bg)'}}><span style={{fontWeight:600}}>{c.hospital_name}</span><span style={{color:'var(--text-2)',marginLeft:8,fontSize:10}}>{c.region||''} · {c.plan||'-'} · {c.ceo_name||''}</span></div>))}</div>)}
                {srchResults.length===0&&fm.고객ID&&(<div style={{fontSize:10,color:'var(--brand-100)',marginTop:3}}>✓ {fm.발주처} 선택됨</div>)}
              </div>
              <div className="fi"><div className="fl">고객ID</div><input className="ai" value={fm.고객ID||''} readOnly/></div>
              <div className="fi"><div className="fl">발주처(병원명) <span className="req">*</span></div><input value={fm.발주처||''} onChange={e=>s('발주처',e.target.value)}/></div>
              <div className="fi"><div className="fl">연락처</div><input value={fm.연락처||''} onChange={e=>s('연락처',e.target.value)}/></div>
            </div>
            <div className="sh">🧾 주문상세</div>
            <div className="fg">
              <div className="fi"><div className="fl">접수일자 <span className="req">*</span></div><input type="date" value={fm.접수일자||''} onChange={e=>s('접수일자',e.target.value)}/></div>
              <div className="fi"><div className="fl">납기요구일자</div><input type="date" value={fm.납기요구일자||''} onChange={e=>s('납기요구일자',e.target.value)}/></div>
              <div className="fi"><div className="fl">품명</div><select value={fm.품명||''} onChange={e=>s('품명',e.target.value)}><option value="">-</option><option>MediAI-BA</option><option>MediAI-OA</option><option>MediAI-SG</option><option>MediAI-SC</option></select></div>
              <div className="fi"><div className="fl">규격(요금제)</div><select value={fm.규격||''} onChange={e=>s('규격',e.target.value)}><option value="">-</option><option>P10</option><option>P20</option><option>P50</option><option>P100</option><option>P200</option><option>P300</option><option>P500</option><option>P1000</option><option>M100</option><option>Basic Plan</option><option>Plus plan</option></select></div>
              <div className="fi"><div className="fl">수량 <span className="req">*</span></div><input value={fm.수량||''} onChange={e=>s('수량',e.target.value)}/></div>
              <div className="fi"><div className="fl">공급가액</div><input value={fm.공급가액?Number(fm.공급가액).toLocaleString('ko-KR'):''} onChange={e=>s('공급가액',e.target.value.replace(/[^\d]/g,''))} placeholder="0" style={{textAlign:'right'}}/></div>
              <div className="fi"><div className="fl">부가세 (자동)</div><input className="ci" value={fm.부가세?Number(fm.부가세).toLocaleString('ko-KR'):''} readOnly style={{textAlign:'right'}}/></div>
              <div className="fi"><div className="fl">금액 VAT포함 (자동)</div><input className="ci" value={fm['금액_VAT포함']?Number(fm['금액_VAT포함']).toLocaleString('ko-KR'):''} readOnly style={{textAlign:'right'}}/></div>
              <div className="fi"><div className="fl">접수자</div><input value={fm.접수자||''} onChange={e=>s('접수자',e.target.value)}/></div>
              <div className="fi"><div className="fl">검토자</div><input value={fm.검토자||''} onChange={e=>s('검토자',e.target.value)}/></div>
              <div className="fi"><div className="fl">납품일자</div><input type="date" value={fm.납품일자||''} onChange={e=>s('납품일자',e.target.value)}/></div>
              <div className="fi"><div className="fl">추천혜택 지급일</div><input type="date" value={fm['추천혜택 지급일']||''} onChange={e=>s('추천혜택 지급일',e.target.value)}/></div>
              <div className="fi"><div className="fl">추천혜택 건수</div><input value={fm['추천혜택 건수']||''} onChange={e=>s('추천혜택 건수',e.target.value)} placeholder="건수 입력"/></div>
            </div>
            <div className="fi full"><div className="fl">요구사항</div><textarea value={fm.요구사항||''} onChange={e=>s('요구사항',e.target.value)} style={{height:54,resize:'none'}}/></div>
            <div className="fi full"><div className="fl">비고</div><textarea value={fm.비고||''} onChange={e=>s('비고',e.target.value)} style={{height:42,resize:'none'}}/></div>
          </div>
          <div style={{width:5,flexShrink:0,background:'rgba(15,110,86,0.3)'}}/>
          <div style={{width:210,padding:13,overflowY:'auto',display:'flex',flexDirection:'column',gap:8}}>
            <div style={{fontSize:11,fontWeight:700,paddingBottom:8,borderBottom:'0.5px solid var(--border)'}}>주문이력</div>
            {hist.length===0?<div style={{fontSize:10,color:'var(--text-2)'}}>고객 선택 후 표시됩니다</div>:
              hist.map((o,i)=>(<div key={i} style={{border:'0.5px solid var(--border)',borderRadius:8,padding:'9px 10px'}}>
                <div style={{fontSize:10,fontWeight:700,marginBottom:3}}>{o['품명']||o['규격']||'-'}</div>
                <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'var(--text-2)',marginBottom:2}}><span>{fmtDate(o['접수일자'])}</span><span style={{color:'var(--brand-100)',fontWeight:600}}>{o['금액_VAT포함']?'₩'+Number(o['금액_VAT포함']).toLocaleString():'-'}</span></div>
                <div style={{fontSize:10,color:'var(--text-2)'}}>요금제: <span style={{color:'var(--blue)'}}>{o['규격']||'-'}</span></div>
                <div style={{fontSize:10,color:'var(--amber)',marginTop:2}}>추천혜택지급일: {o['추천혜택 지급일']?fmtDate(o['추천혜택 지급일']):'-'}</div>
                <div style={{fontSize:10,color:'var(--amber)'}}>추천혜택건수: {o['추천혜택 건수']||'-'}</div>
              </div>))
            }
          </div>
        </div>
        <div className="mf">
          <span style={{fontSize:10,color:'var(--text-2)'}}><span className="req">*</span> 필수 · 금액은 공급가액 입력 시 자동계산</span>
          <div style={{display:'flex',gap:7}}>
            <button className="btn" onClick={onClose}>취소</button>
            <button className="btn btn-t" onClick={save} disabled={sv}>{sv?'저장 중...':'💾 저장 (매출채권 자동연동)'}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function BdgI({t}){
  const map={'발행완료':['rgba(16,110,86,0.25)','#4ade80'],'미발행':['rgba(220,38,38,0.2)','#f87171'],'납부완료':['rgba(16,110,86,0.25)','#4ade80'],'미납':['rgba(220,38,38,0.2)','#f87171']};
  const [bg,col]=map[t]||['rgba(255,255,255,0.08)','var(--text-2)'];
  return <span className="bdg" style={{background:bg,color:col}}>{t||'-'}</span>;
}

// 영문 → 한글 (매출채권/세금계산서)
function mapAR(r){
  return {
    '주문ID':r.order_id,'고객ID':r.cust_id,'병원명':r.hospital_name,'접수일자':fmtDate(r.received_at),
    '규격':r.spec,'수량':r.qty,'납품일자':fmtDate(r.delivered_at),'청구일':fmtDate(r.billed_at),'납부기한':fmtDate(r.due_date),
    '공급가액':r.supply_amount,'부가세':r.vat,'금액_VAT포함':r.total_amount,
    '납부여부':r.payment_status==='Y'?'납부완료':(r.payment_status||''),'실제납부일':fmtDate(r.paid_at),
    '세금계산서_발행여부':r.invoice_issued,'세금계산서_발행일':fmtDate(r.invoice_issued_at),'세금계산서_작성일':fmtDate(r.invoice_written_at),
    '사업자등록번호':r.business_reg_no,'법인명':r.corp_name,'대표자명':r.ceo_name,'사업장주소':r.business_address,
    '업태':r.business_type,'종목':r.business_item,'세금계산서_이메일':r.tax_invoice_email,
    '선납입액':r.prepaid_amount,'할부이력':r.installment_history,_raw:r
  };
}

function InvoiceManagement(){
  const [allRows,setAllRows]=useState([]);
  const [ld,setLd]=useState(true);const [err,setErr]=useState(null);
  const [tf,setTf]=useState('미발행');
  const [issueTarget,setIssueTarget]=useState(null);
  const [payTarget,setPayTarget]=useState(null);
  const [installTarget,setInstallTarget]=useState(null);
  const [dispQ,setDispQ]=useState('');const [q,setQ]=useState('');
  const [sel,setSel]=useState([]);
  const debRef=useRef(null);
  const curYear=new Date().getFullYear();
  const [yearFrom,setYearFrom]=useState(2024);
  const [yearTo,setYearTo]=useState(curYear);

  const load=useCallback(async()=>{
    setLd(true);setErr(null);
    try{const data=await fetchAll('receivables','*');setAllRows(data.map(mapAR));setLd(false);}
    catch(e){console.error(e);setErr(e.message||String(e));setLd(false);}
  },[]);
  useEffect(()=>{load();},[load]);

  const rows=useMemo(()=>{
    return allRows.filter(inv=>{
      const issued=inv['세금계산서_발행여부']==='발행완료';
      const matchTf=tf==='전체'||(tf==='미발행'&&!issued)||(tf==='발행완료'&&issued)||(tf==='할부납부'&&inv['납부여부']==='할부납부');
      // 연도 필터: 납품일자 연도 기준
      const baseY=inv['납품일자']?parseInt(String(inv['납품일자']).slice(0,4)):null;
      if(baseY&&(baseY<yearFrom||baseY>yearTo))return false;
      if(!baseY&&issued)return false;
      const matchQ=!q||(inv.병원명||'').toLowerCase().includes(q.toLowerCase())||String(inv.사업자등록번호||'').includes(q)||(inv.대표자명||'').toLowerCase().includes(q.toLowerCase());
      return matchTf&&matchQ;
    }).sort((a,b)=>{if(tf==='발행완료'){return new Date(b['세금계산서_발행일']||0)-new Date(a['세금계산서_발행일']||0);}return 0;});
  },[allRows,tf,q,yearFrom,yearTo]);

  const ago3m=new Date();ago3m.setMonth(ago3m.getMonth()-3);
  // 카운트는 항상 전체(allRows) + 연도필터 기준으로 계산 (탭 전환과 무관)
  const yearFiltered=allRows.filter(inv=>{
    const issued=inv['세금계산서_발행여부']==='발행완료';
    const baseY=inv['납품일자']?parseInt(String(inv['납품일자']).slice(0,4)):null;
    if(baseY&&(baseY<yearFrom||baseY>yearTo))return false;
    if(!baseY&&issued)return false;
    return true;
  });
  const cts={
    u:yearFiltered.filter(x=>x['세금계산서_발행여부']!=='발행완료').length,
    i:yearFiltered.filter(x=>x['세금계산서_발행여부']==='발행완료').length
  };
  const installRows=allRows.filter(r=>r['납부여부']==='할부납부');
  const totalInstallPaid=installRows.reduce((s,r)=>s+Number(r['선납입액']||0),0);
  const totalInstallRemain=installRows.reduce((s,r)=>{const total=Number(r['공급가액']||0)*1.1;return s+total-Number(r['선납입액']||0);},0);

  function tgl(i){setSel(s=>s.includes(i)?s.filter(x=>x!==i):[...s,i]);}

  async function confirmPay(paidDate){
    const inv=payTarget;setPayTarget(null);
    try{await sb.from('receivables').update({payment_status:'납부완료',paid_at:paidDate,prepaid_amount:null}).eq('order_id',inv['주문ID']);await load();}
    catch(e){alert('오류: '+(e.message||e));}
  }
  async function unpay(inv){
    try{await sb.from('receivables').update({payment_status:'',paid_at:null,prepaid_amount:null}).eq('order_id',inv['주문ID']);await load();}
    catch(e){alert('오류: '+(e.message||e));}
  }
  async function confirmInstall(amount,installDate){
    const inv=installTarget;
    try{
      const prevHist=inv['할부이력']||'';
      const newHist=(prevHist?prevHist+' / ':'')+installDate+':'+amount;
      const totalPaid=newHist.split('/').map(s=>s.trim()).filter(Boolean).reduce((s,e)=>s+Number((e.split(':')[1]||0)),0);
      await sb.from('receivables').update({payment_status:'할부납부',installment_history:newHist,prepaid_amount:totalPaid}).eq('order_id',inv['주문ID']);
      await load();setInstallTarget(null);
    }catch(e){alert('오류: '+(e.message||e));}
  }
  // 할부 입금이력 전체 저장 (수정/삭제 반영)
  async function saveInstallHist(inv,entries){
    try{
      const newHist=entries.join(' / ');
      const totalPaid=entries.reduce((s,e)=>s+Number((e.split(':')[1]||0)),0);
      const newStatus=entries.length>0?'할부납부':'';
      await sb.from('receivables').update({installment_history:newHist,prepaid_amount:totalPaid,payment_status:newStatus}).eq('order_id',inv['주문ID']);
      await load();
      // 이력이 모두 삭제되면 모달 닫기
      if(entries.length===0)setInstallTarget(null);
      else setInstallTarget(t=>t?{...t,'할부이력':newHist,'선납입액':totalPaid}:t);
    }catch(e){alert('오류: '+(e.message||e));}
  }
  async function confirmIssue(writtenDate,issueDate){
    const tgt=issueTarget;setIssueTarget(null);
    try{await sb.from('receivables').update({invoice_issued:'발행완료',invoice_issued_at:issueDate,invoice_written_at:writtenDate}).eq('order_id',tgt['주문ID']);await load();}
    catch(e){alert('발행 오류: '+(e.message||e));}
  }
  async function cancelIssue(inv){
    if(!confirm('발행을 취소하시겠습니까?'))return;
    try{await sb.from('receivables').update({invoice_issued:'',invoice_issued_at:null,invoice_written_at:null}).eq('order_id',inv['주문ID']);await load();}
    catch(e){alert('오류: '+(e.message||e));}
  }
  async function batch(){
    if(sel.length===0){alert('선택된 건이 없습니다.');return;}
    const today=localToday();
    if(!confirm(sel.length+'건을 일괄발행 처리하시겠습니까? (발행일: '+today+')'))return;
    try{
      for(const idx of sel){await sb.from('receivables').update({invoice_issued:'발행완료',invoice_issued_at:today,invoice_written_at:today}).eq('order_id',rows[idx]['주문ID']);}
      await load();setSel([]);alert(sel.length+'건 발행 처리 완료');
    }catch(e){alert('일괄발행 오류: '+(e.message||e));}
  }

  if(ld)return <Spin/>;

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100vh',overflow:'hidden'}}>
      {/* 필터 바 */}
      <div style={{padding:'9px 14px',background:'var(--bg-2)',borderBottom:'0.5px solid var(--border)',display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:5,background:'var(--bg)',border:'0.5px solid var(--border)',borderRadius:8,padding:'3px 8px'}}>
          <span style={{fontSize:10,color:'var(--text-3)'}}>조회기간</span>
          <select value={yearFrom} onChange={e=>setYearFrom(Number(e.target.value))} style={{fontSize:11,padding:'2px 4px',width:75,background:'var(--bg-2)'}}>{Array.from({length:curYear-2024+1},(_,i)=>2024+i).map(y=><option key={y} value={y}>{y}년</option>)}</select>
          <span style={{fontSize:10,color:'var(--text-3)'}}>~</span>
          <select value={yearTo} onChange={e=>setYearTo(Number(e.target.value))} style={{fontSize:11,padding:'2px 4px',width:75,background:'var(--bg-2)'}}>{Array.from({length:curYear-2024+1},(_,i)=>2024+i).map(y=><option key={y} value={y}>{y}년</option>)}</select>
        </div>
        <div style={{display:'flex',gap:6}}>
          {['미발행','발행완료','전체'].map(t=>{
            const clr=t==='미발행'?'#dc2626':t==='발행완료'?'#16a34a':'#2563eb';
            const isAct=tf===t;
            return(<button key={t} onClick={()=>{setTf(t);setSel([]);}} style={{fontSize:11,padding:'7px 15px',borderRadius:10,cursor:'pointer',fontFamily:'inherit',border:'2px solid '+(isAct?clr:'var(--border-md)'),fontWeight:isAct?800:600,background:isAct?clr:'transparent',color:isAct?'#fff':clr,transition:'all .15s ease'}}>
              {t}
              {t==='미발행'&&<span style={{background:isAct?'rgba(255,255,255,0.25)':'var(--red-50)',color:isAct?'#fff':'#f87171',padding:'1px 5px',borderRadius:9,fontSize:10,marginLeft:3,fontWeight:700}}>{cts.u}</span>}
              {t==='발행완료'&&<span style={{fontSize:10,marginLeft:3,opacity:0.9}}>({cts.i}건)</span>}
              {t==='전체'&&<span style={{fontSize:10,marginLeft:3,opacity:0.9}}>({cts.u+cts.i}건)</span>}
            </button>);
          })}

function InstallModal({inv,onConfirm,onCancel,onSaveHist}){
  const _g=Number(inv.공급가액||0);const _v=Number(inv['부가세']||Math.round(_g*.1));const _total=_g+_v;
  const [histEntries,setHistEntries]=useState((inv['할부이력']||'').split('/').map(s=>s.trim()).filter(Boolean));
  const totalPaid=histEntries.reduce((s,e)=>s+Number((e.split(':')[1]||0)),0);
  const [amt,setAmt]=useState('');const [installDate,setInstallDate]=useState(localToday());const [sv,setSv]=useState(false);
  const [editIdx,setEditIdx]=useState(null);const [editDate,setEditDate]=useState('');const [editAmt,setEditAmt]=useState('');

  function startEdit(ei){const p=histEntries[ei].split(':');setEditIdx(ei);setEditDate(p[0]||'');setEditAmt(p[1]||'');}

    if(!editDate||!editAmt){alert('날짜와 금액을 입력하세요.');return;}
    const next=histEntries.map((e,i)=>i===ei?editDate+':'+editAmt:e);
    setHistEntries(next);setEditIdx(null);
    if(onSaveHist)await onSaveHist(inv,next);
  }

    if(!confirm('이 입금 이력을 삭제하시겠습니까?'))return;
    const next=histEntries.filter((_,i)=>i!==ei);
    setHistEntries(next);
    if(onSaveHist)await onSaveHist(inv,next);
  }
  return(
    <div className="ov" onClick={e=>{if(e.target===e.currentTarget)onCancel();}}>
      <div className="mo">
        <div className="mh"><div className="mt">💵 할부납부 처리</div><button className="xb" onClick={onCancel}>✕</button></div>
        <div className="mb" style={{display:'flex',flexDirection:'column',gap:10}}>
          <div style={{background:'var(--blue-50)',border:'0.5px solid var(--blue)',borderRadius:8,padding:'10px 12px',fontSize:11}}>
            <div style={{fontWeight:700,color:'#60a5fa',marginBottom:5,fontSize:13}}>{inv.병원명}</div>
            <div style={{display:'grid',gridTemplateColumns:'80px 1fr',gap:'3px 8px',color:'var(--text-2)'}}>
              <span>합계금액</span><span style={{color:'var(--text)',fontWeight:700}}>₩{_total.toLocaleString()}</span>
              {totalPaid>0&&<><span>누적 선납</span><span style={{color:'#60a5fa',fontWeight:700}}>₩{totalPaid.toLocaleString()}</span></>}
              <span>납품일자</span><span style={{color:'var(--text)'}}>{fmtDate(inv.납품일자)||'-'}</span>
            </div>

          {histEntries.length>0&&(<div style={{background:'var(--bg-2)',borderRadius:7,padding:'10px 12px',fontSize:11}}>
            <div style={{fontWeight:700,color:'var(--text-2)',marginBottom:7}}>🕑 기존 입금 이력</div>
            {histEntries.map((entry,ei)=>{
              const p=entry.split(':');const isEd=editIdx===ei;
              return(<div key={ei} style={{borderBottom:'0.5px solid var(--border)',padding:'5px 0'}}>

                  </div>

                    <span style={{color:'var(--text-2)'}}>{p[0]||''}</span>

                      <button onClick={()=>delEntry(ei)} style={{fontSize:9,padding:'1px 6px',background:'rgba(220,38,38,0.15)',border:'0.5px solid rgba(220,38,38,0.3)',borderRadius:3,cursor:'pointer',color:'#f87171'}}>🗑</button>
                    </div>
                  </div>
                )}
              </div>);
            })}

          </div>)}

          <div className="fi"><div className="fl">입금일 <span className="req">*</span></div><input type="date" value={installDate} onChange={e=>setInstallDate(e.target.value)}/></div>

          {amt>0&&(<div style={{background:'var(--bg-2)',borderRadius:7,padding:'8px 11px',fontSize:11}}>
            <div style={{display:'flex',justifyContent:'space-between'}}><span style={{color:'var(--text-2)'}}>이번 선납입액</span><span style={{color:'#60a5fa',fontWeight:700}}>₩{Number(amt).toLocaleString()}</span></div>
            <div style={{display:'flex',justifyContent:'space-between',marginTop:3}}><span style={{color:'var(--text-2)'}}>미납잔액</span><span style={{color:'#fb923c'}}>₩{Math.max(0,_total-totalPaid-Number(amt)).toLocaleString()}</span></div>
          </div>)}
        </div>
        <div className="mf"><span style={{fontSize:10,color:'var(--text-2)'}}>선납입액이 합계와 같으면 완납처리를 이용하세요</span><div style={{display:'flex',gap:7}}><button className="btn" onClick={onCancel}>취소</button><button className="btn btn-b" disabled={sv} onClick={async()=>{if(!installDate){alert('입금일을 입력하세요.');return;}if(!amt){alert('금액을 입력하세요.');return;}setSv(true);try{await onConfirm(Number(amt),installDate);}finally{setSv(false);}}}>✓ {sv?'저장 중...':'할부납부 확정'}</button></div></div>
      </div>
    </div>
  );
}

const VOC_TYPES=['서비스 일반문의','결제/세금계산서','기능 문의','계정 관리','분석 오류','기타'];

function BdgS({t}){
  const map={'완료':['rgba(16,110,86,0.25)','#4ade80'],'가입전환':['rgba(74,222,128,0.15)','#4ade80'],'VOC':['rgba(248,113,113,0.15)','#f87171'],'미해결':['rgba(234,88,12,0.2)','#fb923c'],'활성':['rgba(16,110,86,0.25)','#4ade80'],'BA':['rgba(37,99,235,0.2)','#60a5fa'],'OA':['rgba(167,139,250,0.2)','#a78bfa'],'SC':['rgba(52,211,153,0.2)','#34d399'],'SG':['rgba(251,146,60,0.2)','#fb923c'],'FX':['rgba(96,165,250,0.2)','#60a5fa']};
  const [bg,col]=map[t]||['rgba(255,255,255,0.08)','var(--text-2)'];
  return <span className="bdg" style={{background:bg,color:col}}>{t||'-'}</span>;
}

// 영문 → 한글 (CS 공통)
function mapCS(r,type){
  const o={
    유형:type,'상담ID':r.cs_id,'고객ID':r.cust_id,'접수일':fmtDate(r.received_at),
    '원장님이름':r.director_name,'병원명':r.hospital_name,'이메일':r.id_email,'원장님연락처':r.director_phone,
    '원장_직원':r.role_type,'실무자번호':r.staff_phone,'솔루션':r.solution,'상담유형':r.cs_type,'상담자':r.counselor,
    '상담내용':r.content,'비고':r.notes,'처리일':fmtDate(r.processed_at),'처리소요일':r.processing_days,
    '완료여부':r.done,'지역':r.region,_raw:r
  };
  if(type==='가입전환')o['재계약여부']=r.renewal;
  if(type==='VOC'){o['접수구분']=r.receipt_type;o['이슈트렌드']=r.issue_trend;}
  return o;
}
// 한글 → 영문 (CS 공통)
function toCSDb(f,type){
  const o={
    cust_id:f['고객ID']||null,received_at:f['접수일']||null,director_name:f['원장님이름']||null,
    hospital_name:f['병원명']||null,id_email:f['이메일']||null,director_phone:f['원장님연락처']||null,
    role_type:f['원장_직원']||null,staff_phone:f['실무자번호']||null,solution:f['솔루션']||null,
    cs_type:f['상담유형']||null,counselor:f['상담자']||null,content:f['상담내용']||null,notes:f['비고']||null,
    processed_at:f['처리일']||null,processing_days:f['처리소요일']||null,done:f['완료여부']||null,region:f['지역']||null
  };
  if(type==='가입전환')o.renewal=f['재계약여부']||null;
  if(type==='VOC'){o.receipt_type=f['접수구분']||null;o.issue_trend=f['이슈트렌드']||null;}
  return o;
}

        <div style={{display:'flex',alignItems:'center',gap:7}}>
          <span style={{fontSize:15,color:'var(--brand-100)'}}>🎧</span>
          <span style={{fontSize:14,fontWeight:700}}>CS 관리</span>
          <span style={{fontSize:11,color:'var(--text-2)'}}>{visibleRows.length}건 표시</span>
          <div style={{display:'flex',alignItems:'center',gap:5,background:'var(--bg)',border:'0.5px solid var(--border)',borderRadius:8,padding:'3px 8px'}}>

            <span style={{fontSize:10,color:'var(--text-3)'}}>~</span>
            <select value={yearTo} onChange={e=>setYearTo(Number(e.target.value))} style={{fontSize:11,padding:'2px 4px',width:72,background:'var(--bg-2)'}}>{Array.from({length:curYear-2024+1},(_,i)=>2024+i).map(y=><option key={y} value={y}>{y}년</option>)}</select>
          </div>
        </div>
        <div style={{display:'flex',gap:6}}>
          {[['전체','#2563eb'],['가입전환','#16a34a'],['VOC','#ea580c']].map(([t,clr])=>{
            const isAct=tf===t;
            return(<button key={t} onClick={()=>setTf(t)} style={{fontSize:11,padding:'7px 15px',borderRadius:10,cursor:'pointer',fontFamily:'inherit',border:'2px solid '+(isAct?clr:'var(--border-md)'),fontWeight:isAct?800:600,background:isAct?clr:'transparent',color:isAct?'#fff':clr,transition:'all .15s ease',position:'relative'}}>
              {isAct&&<span style={{position:'absolute',top:-6,right:-6,width:14,height:14,borderRadius:'50%',background:'#fff',border:'2px solid '+clr,display:'flex',alignItems:'center',justifyContent:'center',fontSize:8,fontWeight:900,color:clr,lineHeight:1}}>✓</span>}
              {t} ({cts[t]||0})
            </button>);
          })}
        </div>
        <div style={{flex:1,display:'flex',alignItems:'center',gap:5,background:'var(--bg)',border:'0.5px solid var(--border)',borderRadius:8,padding:'4px 9px',minWidth:120}}>
          <span style={{fontSize:12,color:'var(--text-2)'}}>🔍</span>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="병원명/원장님/연락처 검색..." style={{border:'none',background:'transparent',padding:0,fontSize:11,width:'100%'}}/>
        </div>
        <button className="btn btn-tem" onClick={()=>setSn(true)}>+ CS 등록</button>
        <button className="btn" style={{background:'#ff0',color:'#000',fontWeight:700}} onClick={async()=>{
          const cid='C_00169', rightId='C_00241', wrongName='정경식';
          const csc=await sb.from('cs_conversion').select('cs_id,cust_id,hospital_name,director_name').eq('cust_id',cid);
          const csv=await sb.from('cs_voc').select('cs_id,cust_id,hospital_name,director_name').eq('cust_id',cid);
          const badC=(csc.data||[]).filter(r=>r.director_name===wrongName);
          const badV=(csv.data||[]).filter(r=>r.director_name===wrongName);
          const t=arr=>arr.map(r=>r.cs_id).join(', ');
          alert('=== 교정 대상 (C_00169 → C_00241) ===\n'
            +'원장 정경식인데 C_00169에 잘못 붙은 CS:\n'
            +'[가입전환 '+badC.length+'건] '+(t(badC)||'없음')+'\n'
            +'[VOC '+badV.length+'건] '+(t(badV)||'없음')+'\n\n'
            +'※ 아직 수정 안 함. 다음 버튼(초록)으로 실제 교정.');
        }}>🔍진단</button>
        <button className="btn" style={{background:'#0f0',color:'#000',fontWeight:700}} onClick={async()=>{
          const cid='C_00169', rightId='C_00241', wrongName='정경식';
          if(!confirm('C_00169에 잘못 붙은 정경식 CS를 C_00241로 교정합니다.\n진행할까요?'))return;
          const csc=await sb.from('cs_conversion').select('cs_id,director_name').eq('cust_id',cid);
          const csv=await sb.from('cs_voc').select('cs_id,director_name').eq('cust_id',cid);
          const badC=(csc.data||[]).filter(r=>r.director_name===wrongName).map(r=>r.cs_id);
          const badV=(csv.data||[]).filter(r=>r.director_name===wrongName).map(r=>r.cs_id);
          let done=0;
          for(const id of badC){await sb.from('cs_conversion').update({cust_id:rightId}).eq('cs_id',id);done++;}
          for(const id of badV){await sb.from('cs_voc').update({cust_id:rightId}).eq('cs_id',id);done++;}
          alert('교정 완료: '+done+'건을 C_00241로 옮겼습니다.\n고객마스터에서 정경식을 다시 확인하세요.');
        }}>✅교정실행</button>
      </div>
      <div style={{flexShrink:0,display:'flex',alignItems:'center',gap:6}}>
        <span style={{fontSize:11,color:'var(--text-2)',marginRight:2}}>완료여부</span>
        {[['','전체 (ALL)','#2563eb'],['Y','완료 (Y)','#16a34a'],['N','미해결 (N)','#ea580c']].map(([v,lb,clr])=>{
          const isAct=df===v;
          return(<button key={v} onClick={()=>setDf(v)} style={{fontSize:11,padding:'5px 13px',borderRadius:8,cursor:'pointer',fontFamily:'inherit',border:'1.5px solid '+(isAct?clr:'var(--border-md)'),fontWeight:isAct?700:500,background:isAct?clr:'transparent',color:isAct?'#fff':'var(--text-2)',transition:'all .15s ease'}}>{lb}</button>);
        })}
      </div>
      {err&&<div style={{padding:'10px 13px',background:'var(--red-50)',border:'0.5px solid var(--red)',borderRadius:8,fontSize:11,color:'#f87171'}}>{err}</div>}
      <div style={{background:'var(--bg)',border:'0.5px solid var(--border)',borderRadius:12,flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>

              {visibleRows.map((it,i)=>(<tr key={(it.유형||'?')+'_'+(it['상담ID']||i)+'_'+i} onClick={()=>setDetail(it)}>

                <td>{fmtDate(it['접수일'])||'-'}</td>
                <td>{it['원장님이름']||'-'}</td>
                <td style={{color:'#60a5fa'}}>{it['병원명']||'-'}</td>
                <td><BdgS t={it['솔루션']||'BA'}/></td>
                <td>{it['상담유형']||'-'}</td>
                <td>{it['상담자']||'-'}</td>
                <td style={{color:'var(--text-2)'}}>{it['처리소요일']||'-'}</td>
                <td><BdgS t={isDone(it)?'완료':'미해결'}/></td>

      {detail&&<CSDetail item={detail} onClose={(deleted,updatedItem)=>{
        const dId=detail['상담ID'];
        if(deleted){setDeletedIds(prev=>new Set([...prev,dId]));setDetail(null);}
        else if(updatedItem){
          const setter=detail.유형==='VOC'?setVocRows:setConvRows;
          setter(prev=>prev.map(r=>r['상담ID']===dId?{...r,...updatedItem}:r));

      }}/>}
      {sn&&<CSForm onClose={(newItem)=>{setSn(false);if(newItem){load();}}}/>}
    </div>
  );
}

function CSDetail({item,onClose}){
  const type=item.유형||'가입전환';
  const [ed,setEd]=useState(false);const [sv,setSv]=useState(false);const [dl,setDl]=useState(false);
  const [detTab,setDetTab]=useState(0);
  const [csHis,setCsHis]=useState([]);const [csHisLd,setCsHisLd]=useState(false);const [csHisClick,setCsHisClick]=useState(null);
  const [fm,setFm]=useState(()=>{
    const init={...item};
    const raw=init['완료여부'];init['완료여부']=(raw==='Y'||raw===true||raw==='true')?'Y':'N';
    ['접수일','처리일'].forEach(k=>{if(init[k])init[k]=fmtDate(init[k]);});
    return init;
  });
  function s(k,v){setFm(f=>({...f,[k]:v}));}

  useEffect(()=>{
    if(detTab!==1||csHis.length>0)return;
    const custId=item['고객ID'];if(!custId){return;}
    setCsHisLd(true);
    Promise.all([
      sb.from('cs_voc').select('*').eq('cust_id',custId),
      sb.from('cs_conversion').select('*').eq('cust_id',custId)
    ]).then(([voc,conv])=>{
      const all=[...(voc.data||[]).map(r=>mapCS(r,'VOC')),...(conv.data||[]).map(r=>mapCS(r,'가입전환'))].sort((a,b)=>String(b['접수일']||'').localeCompare(String(a['접수일']||'')));
      setCsHis(all);
    }).finally(()=>setCsHisLd(false));
  },[detTab]);

  async function del(){
    if(!confirm('삭제하시겠습니까?'))return;
    setDl(true);
    try{const tbl=type==='VOC'?'cs_voc':'cs_conversion';await sb.from(tbl).delete().eq('cs_id',item['상담ID']);onClose(true);}
    catch(e){alert('오류: '+(e.message||e));setDl(false);}
  }
  async function save(){
    setSv(true);
    const doneVal=fm['완료여부']==='Y'?'Y':'N';
    let soyo='';
    if(fm['접수일']&&fm['처리일']){const diff=Math.round((new Date(fm['처리일'])-new Date(fm['접수일']))/86400000);if(diff>=0)soyo=String(diff);}
    const updated={...fm,유형:type,'완료여부':doneVal,'처리소요일':soyo};
    try{
      const tbl=type==='VOC'?'cs_voc':'cs_conversion';
      await sb.from(tbl).update(toCSDb(updated,type)).eq('cs_id',item['상담ID']);
      setSv(false);setFm({...updated});setEd(false);alert('수정되었습니다.');onClose(false,updated);
    }catch(e){alert('오류: '+(e.message||e));setSv(false);}
  }

  const ctOptions=type==='VOC'?VOC_TYPES:JOIN_TYPES;
  const flds=[
    {l:'유형',k:'유형',ro:true,bd:true},{l:'상담ID',k:'상담ID',ro:true},{l:'고객ID',k:'고객ID',ro:true},
    {l:'접수일',k:'접수일',tp:'date'},{l:'원장님이름',k:'원장님이름'},
    {l:'원장/직원 구분',k:'원장_직원',tp:'sel',op:['원장','직원','미확인']},
    {l:'연락처',k:'_contact'},{l:'병원명',k:'병원명'},
    {l:'솔루션',k:'솔루션',tp:'sel',op:SOL_OPTIONS,bd:true},
    {l:'상담유형',k:'상담유형',tp:'sel',op:ctOptions},{l:'상담자',k:'상담자'},

                        <button onClick={(e)=>{e.stopPropagation();setCsHisClick(null);}} style={{background:'rgba(255,255,255,0.08)',border:'1px solid rgba(255,255,255,0.15)',color:'var(--text-2)',cursor:'pointer',fontSize:10,padding:'3px 9px',borderRadius:5}}>✕ 닫기</button>

}

function CSForm({onClose}){
  const [type,setType]=useState('가입전환');
  const today=localToday();
  const [fm,setFm]=useState({접수일:today,처리일:today,솔루션:'BA',완료여부:'Y',원장직원구분:'원장'});
  const [sv,setSv]=useState(false);
  const [custInfo,setCustInfo]=useState(null);
  const [hist,setHist]=useState({v:[],c:[]});const [histTab,setHistTab]=useState('VOC');
  const [srchResults,setSrchResults]=useState([]);const [srchLd,setSrchLd]=useState(false);
  const [accts,setAccts]=useState([]);
  function s(k,v){setFm(f=>({...f,[k]:v}));}

  async function srch(){
    if(!fm._q)return;setSrchLd(true);setSrchResults([]);
    try{
      const term=fm._q.trim();
      const {data}=await sb.from('customers').select('*').or('hospital_name.ilike.%'+term+'%,cust_id.ilike.%'+term+'%,ceo_name.ilike.%'+term+'%').limit(20);
      setSrchLd(false);const a=data||[];setSrchResults(a);if(a.length===1)selectCust(a[0]);
    }catch(e){setSrchLd(false);}
  }
  async function selectCust(c){
    setCustInfo(c);setSrchResults([]);
    // 계정 조회
    const {data:acctData}=await sb.from('customer_accounts').select('*').eq('cust_id',c.cust_id).order('account_no');
    const accList=(acctData||[]).filter(a=>a.username||a.phone||a.email).map(a=>({idx:a.account_no,nm:a.username||'',ph:a.phone||'',em:a.email||''}));
    setAccts(accList);
    const drName=(accList[0]&&accList[0].nm)||c.ceo_name||'';
    setFm(prev=>({...prev,고객ID:c.cust_id,병원명:c.hospital_name,원장님이름:drName,이메일:(accList[0]&&accList[0].em)||'',연락처:firstPhone((accList[0]&&accList[0].ph)||c.phone),지역:c.region||'',_selectedAcct:'1'}));
    // CS 이력
    const [voc,conv]=await Promise.all([sb.from('cs_voc').select('*').eq('cust_id',c.cust_id).limit(20),sb.from('cs_conversion').select('*').eq('cust_id',c.cust_id).limit(20)]);
    setHist({v:(voc.data||[]).map(r=>mapCS(r,'VOC')),c:(conv.data||[]).map(r=>mapCS(r,'가입전환'))});
  }
  async function save(){
    if(!fm.상담내용){alert('상담내용은 필수입니다.');return;}
    setSv(true);
    let soyo='';
    if(fm['접수일']&&fm['처리일']){const diff=Math.round((new Date(fm['처리일'])-new Date(fm['접수일']))/86400000);if(diff>=0)soyo=String(diff);}
    const payload={...fm,유형:type,'원장_직원':fm.원장직원구분||'원장','처리소요일':soyo,
      '원장님연락처':fm.원장직원구분==='직원'?'':(fm.연락처||''),'실무자번호':fm.원장직원구분==='직원'?(fm.실무자번호||''):''};
    try{
      const tbl=type==='VOC'?'cs_voc':'cs_conversion';
      // 상담ID 생성: CS-{F/J}-YYYYMM-NNNN
      const prefix='CS-'+(type==='VOC'?'F':'J')+'-'+(fm.접수일||today).slice(0,7).replace('-','');
      const {data:ex}=await sb.from(tbl).select('cs_id').like('cs_id',prefix+'%');
      const seq=(ex||[]).length+1;
      const newId=prefix+'-'+String(seq).padStart(4,'0');
      const dbRow={cs_id:newId,...toCSDb(payload,type)};
      const {error}=await sb.from(tbl).insert(dbRow);if(error)throw error;
      setSv(false);alert((type)+' 접수가 등록되었습니다. (상담ID: '+newId+')');onClose({상담ID:newId});
    }catch(e){alert('오류: '+(e.message||e));setSv(false);}
  }

  const ctOptions=type==='VOC'?VOC_TYPES:JOIN_TYPES;

  return(
    <div className="ov" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="mo lg">
        <div className="mh mh-em" style={{flexDirection:'column',gap:8,alignItems:'stretch'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div className="mt">🎧 CS 신규접수</div><button className="xb" onClick={onClose}>✕</button>
          </div>

            <div style={{display:'flex',gap:6}}>

            </div>)}
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'4px 12px',fontSize:10,color:'var(--text-3)'}}>
              {[['고객ID',custInfo.cust_id],['유료NO',custInfo.paid_no||'-'],['요금제',custInfo.plan||'-'],['지역',custInfo.region||'-'],['병원종류',custInfo.hospital_type||'-'],['전화번호',custInfo.phone||'-'],['사업자번호',custInfo.business_reg_no||'-'],['대표자명',custInfo.ceo_name||'-'],['활성화일',custInfo.account_activated_at?String(custInfo.account_activated_at).slice(0,10):'-']].map(([l,v])=>(<div key={l}><span>{l}: </span><span style={{color:'var(--text)',fontWeight:600}}>{v}</span></div>))}

              <div className="fi"><div className="fl">상담유형</div><select value={fm.상담유형||''} onChange={e=>s('상담유형',e.target.value)}><option value="">-</option>{ctOptions.map(o=><option key={o}>{o}</option>)}</select></div>
              <div className="fi"><div className="fl">상담자</div><input value={fm.상담자||''} onChange={e=>s('상담자',e.target.value)} placeholder="이름"/></div>

              <div className="fi"><div className="fl">처리일</div><input type="date" value={fm.처리일||''} onChange={e=>s('처리일',e.target.value)}/></div>
              <div className="fi"><div className="fl">처리소요일 (자동)</div><input value={(()=>{if(fm.접수일&&fm.처리일){const d=Math.round((new Date(fm.처리일)-new Date(fm.접수일))/86400000);return d>=0?String(d):'';}return '';})()} readOnly className="ai"/></div>
            </div>

            <div className="fi"><div className="fl">비고</div><textarea value={fm.비고||''} onChange={e=>s('비고',e.target.value)} style={{height:38,resize:'none'}} placeholder="비고 (선택)..."/></div>
            {type==='가입전환'&&<div className="fi"><div className="fl">재계약여부</div><select value={fm.재계약여부||''} onChange={e=>s('재계약여부',e.target.value)}><option value="">-</option><option>Y</option><option>N</option></select></div>}
            <div className="fi"><div className="fl">완료여부</div>
              <div style={{display:'flex',gap:6,paddingTop:4}}>
                <button type="button" onClick={()=>s('완료여부','Y')} style={{flex:1,padding:'5px 0',borderRadius:6,border:'0.5px solid',cursor:'pointer',fontSize:11,fontWeight:700,background:fm.완료여부==='Y'?'var(--brand)':'var(--bg)',color:fm.완료여부==='Y'?'#fff':'var(--text-2)',borderColor:fm.완료여부==='Y'?'var(--brand)':'var(--border-md)'}}>완료</button>
                <button type="button" onClick={()=>s('완료여부','N')} style={{flex:1,padding:'5px 0',borderRadius:6,border:'0.5px solid',cursor:'pointer',fontSize:11,fontWeight:700,background:fm.완료여부==='N'?'var(--red)':'var(--bg)',color:fm.완료여부==='N'?'#fff':'var(--text-2)',borderColor:fm.완료여부==='N'?'var(--red)':'var(--border-md)'}}>미해결</button>
              </div>
            </div>
          </div>
          <div style={{width:6,flexShrink:0,background:'rgba(15,110,86,0.3)'}}/>
          {/* 이력 패널 */}
          <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
            <div style={{padding:'9px 12px',borderBottom:'0.5px solid var(--border)',background:'var(--bg-2)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <div style={{fontSize:11,fontWeight:700,display:'flex',alignItems:'center',gap:5}}>🕑 최근 상담이력</div>
              <div style={{display:'flex',border:'0.5px solid var(--border-md)',borderRadius:6,overflow:'hidden'}}>{[['VOC',hist.v.length],['가입전환',hist.c.length]].map(([t,cnt])=>(<button key={t} onClick={()=>setHistTab(t)} style={{fontSize:9,padding:'2px 7px',border:'none',cursor:'pointer',fontFamily:'inherit',background:histTab===t?'var(--brand-50)':'var(--bg-2)',color:histTab===t?'var(--brand-100)':'var(--text-2)',fontWeight:histTab===t?700:400,borderLeft:t!=='VOC'?'0.5px solid var(--border-md)':'none'}}>{t} {cnt}</button>))}</div>
            </div>
            <div style={{flex:1,overflowY:'auto',padding:'8px 10px',display:'flex',flexDirection:'column',gap:6}}>
              {(histTab==='VOC'?hist.v:hist.c).length===0?<div style={{textAlign:'center',padding:20,color:'var(--text-2)',fontSize:10,lineHeight:1.8,whiteSpace:'pre-line'}}>{custInfo?histTab+' 이력이 없습니다.':'고객을 선택하면\n최근 이력이 표시됩니다'}</div>:(histTab==='VOC'?hist.v:hist.c).map((cs,i)=>(<div key={i} style={{border:'0.5px solid var(--border)',borderRadius:7,padding:'8px 9px',fontSize:10}}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}><span style={{color:'var(--text-2)'}}>{fmtDate(cs['접수일'])||'-'}</span><BdgS t={cs['완료여부']==='Y'?'완료':'미해결'}/></div>
                <div style={{color:'var(--text)',lineHeight:1.6,whiteSpace:'pre-wrap',wordBreak:'break-all'}}>{cs['상담내용']||'(내용 없음)'}</div>
              </div>))}
            </div>
          </div>
        </div>
        <div className="mf"><span style={{fontSize:10,color:'var(--text-2)'}}>ℹ️ CS_{type} 테이블에 신규 행으로 기록됩니다</span><div style={{display:'flex',gap:7}}><button className="btn" onClick={onClose}>취소</button><button className="btn btn-t" style={{padding:'6px 20px',fontWeight:700,fontSize:12}} onClick={save} disabled={sv}>💬 {sv?'저장 중...':type+' 접수'}</button></div></div>
      </div>
    </div>
  );
}
